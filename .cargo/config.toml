# Cargo settings for every workspace in this repo (crates/, apps/*/src-tauri): Cargo reads this file from any folder below
# the repo root, merged under a workspace's own .cargo/config.toml.

# Windows: link with the toolchain's own lld-link (rust-lld.exe, shipped with every msvc toolchain; rustc finds it in its
# sysroot) instead of MSVC's link.exe, which made linking most of a Windows build. It still links against the MSVC and
# Windows SDK libraries, so Visual Studio's build tools stay required. Developers, CI and release builds use the same linker
# (docs/dev-setup.md).
[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"

# Windows: link the C runtime statically into every binary we build (Paddock ADR 0032). The dynamic default imports
# VCRUNTIME140.dll, which is not part of Windows: a sidecar built that way exits with 0xC0000135 on a PC without the VC++
# redistributable (CI runners have it, so CI never showed it). Tauri's own staticVCRuntime covered only an app's main binary and clashes with
# this flag, so every tauri.conf.json sets build.windows.staticVCRuntime to false; this flag covers every binary below this
# folder. Paddock's conformance/release/windows-crt-imports.mjs checks the binaries of every Windows installer build.
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]

# The Gitea cargo registry the shared crates are published to (`publish = ["decryp7"]`; no token needed to read). It is
# defined here, once, because cargo reads configuration from the current folder upwards, not from the manifest: every
# workspace that uses a shared crate by path (crates/, apps/<app>/...) needs it, as the crates' manifests name it
# (ADR 0014 §2). Publishing happens only in the tag workflow (.gitea/workflows/publish.yml) with a token from CI secrets;
# `scripts/publish.mjs` without `--publish` is the local dry run.
[registries.decryp7]
index = "sparse+https://dev.decryptology.net/api/packages/decryp7/cargo/"
