[package]
name = "paddock-assistant"
version = "0.1.0"
description = "The assistant for the Paddock apps (plan W6): the LLM provider port, the prompted tool protocol (Hermes tool calls, think-block and tag filters), tools with budgets and an approval step for tools that write, the bounded cancellable tool loop on an injected clock, versioned bounded conversation persistence, the Pitwall adapter over paddock-pitwall, and the Tauri commands and the paddock://assistant event."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["decryp7"]

[features]
# The Tauri adapter (`paddock_assistant::tauri`: the `paddock://assistant` event, the commands and their table); the core
# never depends on Tauri.
tauri = ["dep:tauri", "dep:paddock-commands", "paddock-commands/tauri"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
paddock-pitwall = { workspace = true }
paddock-health = { workspace = true }
paddock-env = { workspace = true }
tauri = { workspace = true, optional = true }
paddock-commands = { workspace = true, optional = true }
paddock-workspace-hack = { version = "0.1", path = "../paddock-workspace-hack" }

[dev-dependencies]
tempfile = "3"
paddock-pitwall = { workspace = true, features = ["testing"] }
paddock-secrets = { workspace = true }
# The Tauri adapter is tested on Tauri's mock runtime.
tauri = { workspace = true, features = ["test"] }
# The wire types' TypeScript (`ui/projects/paddock-ui/workbench/assistant/generated/`), generated by a unit test.
ts-rs = { version = "11.1", features = ["serde-json-impl"] }
# Its generated-file check (`testing::sync_generated`), also without the `tauri` feature.
paddock-commands = { workspace = true }

[[test]]
name = "tauri"
required-features = ["tauri"]
