[package]
name = "paddock-repo-files"
version = "0.1.0"
description = "A bounded, .gitignore-aware walk of a repository folder and SHA-256 hashing of its files, with deterministic (sorted) results and typed errors. The file layer under the project graph and, later, the repository index."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["decryp7"]

[dependencies]
ignore = "0.4"
sha2 = "0.10"
paddock-workspace-hack = { version = "0.1", path = "../paddock-workspace-hack" }

[dev-dependencies]
tempfile = "3"
