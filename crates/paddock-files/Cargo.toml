[package]
name = "paddock-files"
version = "0.1.0"
description = "User files for the Paddock apps: path grants (the app opens only paths the user chose, by dialog, drag and drop or the command line, canonicalised), open and save pickers behind a port, recent lists (recorded only after a granted open, re-granted on use), reveal in the file manager and open with the default program (command lines as pure functions per OS, nothing that runs on open), and web addresses."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["decryp7"]

[features]
# The Tauri adapter (`paddock_files::tauri`): managed state, the `WindowGrants` command argument, the picker, recent, reveal, open
# and URL commands, the drag-and-drop grants and the recent event. The core never depends on Tauri.
tauri = ["dep:tauri", "paddock-commands/tauri"]
# The native pickers over `tauri-plugin-dialog` (`paddock_files::tauri::NativePicker`); the app registers the plugin.
dialog = ["tauri", "dep:tauri-plugin-dialog"]

[dependencies]
paddock-commands = { workspace = true }
paddock-env = { workspace = true }
paddock-proc = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = { version = "0.4", features = ["kv"] }
tauri = { workspace = true, optional = true }
tauri-plugin-dialog = { version = "2.8", optional = true }

[dev-dependencies]
tempfile = "3"
tauri = { workspace = true, features = ["test"] }
# The wire types' TypeScript (`ui/projects/paddock-ui/shell/files/generated/`), generated by a unit test.
ts-rs = "11.1"
