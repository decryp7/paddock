[package]
name = "paddock-proc"
version = "0.2.0"
description = "Child processes for the Paddock apps: commands without a console window, runs with a timeout and an output cap, supervised children whose whole tree ends on drop, a memory cap that counts real memory, process memory (PSS on Linux, physical footprint on macOS, private working set on Windows; never RSS) and the user's login PATH."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["decryp7"]

[lib]
doctest = false # doctests are off (crates/README.md, "Doctests")

[features]
# `statewait`: waits on a process's run state for tests (rule 99: never in a shipped build). paddock-testkit-start turns it on and
# re-exports it; this package's own unit tests have it under cfg(test).
test-support = []

[dependencies]
log = "0.4"
paddock-env = { workspace = true }
thiserror = "2"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
paddock-workspace-hack = { version = "0.1", path = "../paddock-workspace-hack" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# The kill-on-close job object of every supervised child (plan X54) and the private working set (rule 26).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_System_RestartManager", "Win32_System_RemoteDesktop", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
# The never-panics test of the parsers (conformance check C36).
paddock-testkit = { workspace = true }
tempfile = "3"

[package.metadata.paddock]
# What this crate's tests read that the test cache's reads extractor cannot resolve (ADR 0116 §2, user decision 122), as globs from the
# repository root; `[]` says the blind reads touch no repository file.
# `tests/it/scope.rs`: a child program of the test prints its own working folder.
test-reads = []
