[package]
name = "paddock-view"
version = "0.1.0"
description = "The declarative view model plugins return (ADR 0002): ViewDoc, its nodes, actions and patches, JSON and postcard codecs, the limits validator and the generated TypeScript."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["decryp7"]
# The fuzz target is its own workspace and is not published.
exclude = ["fuzz"]

[dependencies]
paddock-limits = { workspace = true }
paddock-ipc = { workspace = true }
postcard = { version = "1", default-features = false, features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
paddock-workspace-hack = { version = "0.1", path = "../paddock-workspace-hack" }

[dev-dependencies]
paddock-testkit = { workspace = true }
paddock-commands = { workspace = true }
proptest = "1"
# The wire types' TypeScript (`ui/projects/paddock-ui/view/generated/view.ts`), generated by a unit test.
ts-rs = { version = "11.1", features = ["serde-json-impl"] }
