# Fuzz target for paddock-view's decoders and validator. Its own workspace, outside the crates' one; run with
# `cargo +nightly fuzz run decode` from `crates/paddock-view`.
[package]
name = "paddock-view-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
paddock-view = { path = ".." }

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[workspace]
