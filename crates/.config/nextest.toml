# cargo-nextest settings for the crates workspace. Locally: `cargo nextest run --workspace --all-features` (the default
# profile); CI: `--profile ci`. nextest does not run doc tests: `cargo test --doc` runs them.
#
# Each crate's integration tests are one binary, `it` (tests/it/main.rs, one module per former tests/<name>.rs): a
# former binary is a test-name prefix, `cargo nextest run -p paddock-jobs -E 'test(/^pool::/)'`.

# paddock-chromium's real-browser tests (tests/it/real_browser.rs) take turns: Chrome for Testing cold starts side by side
# starve each other on a loaded runner (Debrief's copy of the driver failed so in CI 7213 and 7250). The start itself is
# judged on the browser's run state (ADR 0031); the group keeps them from competing with each other.
[test-groups]
real-browser = { max-threads = 1 }

# Class build (crates/paddock-testkit/src/build_cost.rs): a test that starts a compiler or a `cargo build` has the name prefix `build_`.
# `paddock_testkit::build_cost::charge` fails a test of another name under nextest, and tools/paddock-dev/tests/it/build_cost.rs checks the
# places that start a build and this override. A build in a test costs what a cold compile costs, not what the test's own work costs: in CI
# run 9371 (a cold cache after a rustflags change) ten plugin tests that build the fixture in the test reached the 60 s limit together.
# In the default profile, so every profile inherits it; a setting from the first override that sets it wins, so this one is the first.
# waiver: the build class's budget, a hang backstop and not a performance limit (ER-12), from the cold times of docs/benchmarks.md "2026-11-28,
# test build cost class" (a fresh build folder, no sccache, Mac mini of 14 cores at a 1-minute load of 7 to 20): the plugin fixture's
# `cargo build -p paddock-plugin-test` 40.7 s, every test that needs it waiting 39.6 to 41.0 s on that one build (CI run 9371: stopped at 60.0 s
# on try 1, 37 to 46 s on try 2 over the first try's work, so a cold CI build is about 100 s); the other builds in the class (a one-file
# crate, the CLI's tiny project) 0.4 to 1.2 s. 300 s is 7x the local cold time and 3x the CI one.
[[profile.default.overrides]]
filter = 'test(/(^|::)build_[^:]*$/)'
slow-timeout = { period = "60s", terminate-after = 5 }

# waiver: a real browser's start is judged on its run state and may wait up to 120 s of CPU (see the ci profile's waiver below); two
# minutes in total would stop it first, so the default profile gives it 180 s.
[[profile.default.overrides]]
filter = 'package(paddock-chromium) & binary(it) & test(/^real_browser::/)'
test-group = 'real-browser'
slow-timeout = { period = "30s", terminate-after = 6 }

[profile.default]
# One test per core but one (rules.md 13), so a full run leaves the machine usable.
test-threads = -1
# A test still running after 30 s is reported as SLOW (and again every 30 s); one still running after two minutes (four
# periods) is stopped and fails instead of letting a hang stall the run. Conformance C114 checks every workspace has this
# bound; a test that legitimately needs longer is a named override with a `# waiver:` line, not a longer default.
slow-timeout = { period = "30s", terminate-after = 4 }

# CI (.gitea/workflows/ci.yml, publish.yml): every failure reported, no retries (rules.md 5: a flaky test is fixed, not
# retried), a JUnit report.
[profile.ci]
# ADR 0103 (D2): a test whose child still holds its output 500 ms after the test ended is reported as LEAK. Report-only (ER-41):
# result = "pass" until the first green CI run with it on main, recorded here by run id; then "fail" (nextest 0.9.95 or later).
leak-timeout = { period = "500ms", result = "pass" }
fail-fast = false
retries = 1
flaky-result = "fail"
failure-output = "immediate-final"
# Every core, where a CI job has its host to itself. On a shared host (three macOS runners on one Mac) build-jobs.sh
# sets NEXTEST_TEST_THREADS to the job's core share, which overrides this (conformance/ci/build-jobs.sh).
test-threads = "num-cpus"
# The time budget of one test (rule 40): reported SLOW after 30 s and stopped, failing the run, after 60 s, so a test
# that waits on a timeout or a sleep fails CI instead of slowing it down (paddock-mcp's loopback tests waited 120 s on
# Windows). A test that needs longer is a waiver below: an override with a `# waiver:` line saying why;
# conformance/test/ci-actions.test.mjs checks both.
slow-timeout = { period = "30s", terminate-after = 2 }

[profile.ci.junit]
# Written to <target>/nextest/ci/junit.xml.
path = "junit.xml"

# waiver: a real browser's start is judged on its run state (ADR 0031): a working start on a loaded runner is waited for, and
# only a stuck one fails, after up to 120 s of CPU without becoming ready (the spin patience); 60 s would stop the test first.
[[profile.ci.overrides]]
filter = "package(paddock-chromium) & binary(it) & test(/^real_browser::/)"
slow-timeout = { period = "30s", terminate-after = 6 }

# waiver: the real-window probe (nightly.yml, `--test show_probe`) waits for a real webview and gives up by itself after 90 s
# (`GIVE_UP` in paddock-dialogs/src/probe.rs, exit 2); 60 s would stop it before its own verdict. Four periods (120 s) leave the start
# of the process and Tauri around that bound. It ran under plain `cargo test` with no bound at all before rule 89.
[[profile.ci.overrides]]
filter = "package(paddock-dialogs) & binary(show_probe)"
slow-timeout = { period = "30s", terminate-after = 4 }

# waiver: not a longer time budget, only output: the crash model's probe (paddock-service tests/it/model.rs) prints what the
# pieces of one edge cost on the machine, and a passing test's output is hidden by default, so the numbers would never reach
# the job log (the Windows runner's clock reads are what made the model slow, CI runs 7642 to 7646).
[[profile.ci.overrides]]
filter = "package(paddock-service) & binary(it) & test(the_cost_of_the_pieces_of_one_edge_is_reported)"
success-output = "final"

# waiver: ADR 0103's size class "cpu-heavy" (Bazel's "medium"): paddock-service's crash-model explorations are pure CPU.
# Measured: 5-7 s each on a quiet Mac, at most 8.5 s with 6 CPU burners at load 30 (2026-11-14,
# docs/benchmarks.md, "2026-11-14, test timing redesign"), 59 s on the loaded CI Mac, where four of eight were stopped at 60 s
# (run 8066, job 37869): a 9x slowdown from other jobs' load. n = 1: one CI run shows it, and that job's log does not record the
# runner's load (not measured); the local runs reached load 32 at most (6 burners, the agents' cap), not the ~100 of a busy CI Mac. Two at a time (a test group) cut the slowest from 8.5 s to 6.8 s
# but tripled the wall time (8 s to 22 s), and under other jobs' load the CPU share, not their own number, sets the cost; so the
# class gives them 120 s, the default profile's own bound, instead.
[[profile.ci.overrides]]
filter = "package(paddock-service) & binary(it) & test(/^model::the_crash_model_/)"
slow-timeout = { period = "30s", terminate-after = 4 }

# waiver: ADR 0103's size class "cpu-heavy": paddock-throttle's queue model runs 1200 seeded explorations (3 limits x 400 seeds) of waiters and holders
# against the real lock folder, so its cost is file-system work, not time (it asserts no elapsed time, and its clock is fake).
# Measured: 16 s to 28 s on the Mac under the agents' load (2026-11-27, three runs), and stopped at 60 s on the Windows CI runner (run 9242, job
# 52621, TMT at 60.4 s); it passed in run 9244 under the same limit, so n = 1 for the stop, and the log does not record the runner's load
# (not measured). The class gives it 180 s.
[[profile.ci.overrides]]
filter = "package(paddock-throttle) & binary(it) & test(the_queue_model_has_no_wait_cycle_and_never_exceeds_the_maximum)"
slow-timeout = { period = "30s", terminate-after = 6 }
