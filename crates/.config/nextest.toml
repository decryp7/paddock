# cargo-nextest settings for the crates workspace. Locally: `cargo nextest run --workspace --all-features` (the default
# profile); CI: `--profile ci`. nextest does not run doc tests: `cargo test --doc` runs them.
#
# Each crate's integration tests are one binary, `it` (tests/it/main.rs, one module per former tests/<name>.rs): a
# former binary is a test-name prefix, `cargo nextest run -p paddock-jobs -E 'test(/^pool::/)'`.

# paddock-chromium's real-browser tests (tests/it/real_browser.rs) take turns: Chrome for Testing cold starts side by side
# starve each other on a loaded runner (Debrief's copy of the driver failed so in CI 7213 and 7250). The start itself is
# judged on the browser's run state (ADR 0031); the group keeps them from competing with each other.
[test-groups]
real-browser = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(paddock-chromium) & binary(it) & test(/^real_browser::/)'
test-group = 'real-browser'

[profile.default]
# One test per core but one (rules.md 13), so a full run leaves the machine usable.
test-threads = -1
# A test still running after 30 s is reported as SLOW (and again every 30 s); one still running after five minutes is
# stopped instead of letting a hang stall the run.
slow-timeout = { period = "30s", terminate-after = 10 }

# CI (.gitea/workflows/ci.yml, publish.yml): every failure reported, no retries (rules.md 5: a flaky test is fixed, not
# retried), a JUnit report.
[profile.ci]
fail-fast = false
retries = 0
failure-output = "immediate-final"
# A CI job has its runner to itself.
test-threads = "num-cpus"
# The time budget of one test (rule 40): reported SLOW after 30 s and stopped, failing the run, after 60 s, so a test
# that waits on a timeout or a sleep fails CI instead of slowing it down (paddock-mcp's loopback tests waited 120 s on
# Windows). A test that needs longer is a waiver below: an override with a `# waiver:` line saying why;
# conformance/test/ci-actions.test.mjs checks both.
slow-timeout = { period = "30s", terminate-after = 2 }

[profile.ci.junit]
# Written to <target>/nextest/ci/junit.xml.
path = "junit.xml"
