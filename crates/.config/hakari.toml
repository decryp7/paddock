# cargo-hakari (docs/dev-setup.md, "One feature set per dependency"): `paddock-workspace-hack` depends on every third-party
# crate the workspace builds with more than one feature set, with the union of those features, and every member depends on
# it, so `cargo build -p <one crate>` and `cargo test --workspace` reuse the same compiled dependencies instead of
# rebuilding them with another feature set. After changing dependencies: `cargo hakari generate && cargo hakari manage-deps`;
# CI checks with `cargo hakari verify`.

hakari-package = "paddock-workspace-hack"
dep-format-version = "4"
resolver = "2"

# The platforms the crates are built and tested on (CI: Linux, Windows, macOS; the Mac mini).
platforms = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

# Tauri stays out: the libraries take it without a runtime (wry) on purpose, and unifying its features would build the
# webview stack into every crate, the pure cores included.
[traversal-excludes]
third-party = [
    { name = "tauri" },
    { name = "tauri-utils" },
    { name = "tauri-runtime-wry" },
    { name = "wry" },
    { name = "ts-rs" },
    # gtk-rs 0.18 (the -sys crates too: left in, they make every tool that links paddock-proc need GTK headers on x86_64 Linux): paddock-startup's `dialog` feature is its only user and is optional; unifying it would build gtk on Linux for
    # every shared crate and put glib (RUSTSEC-2024-0429) into the cargo-deny graph.
    { name = "gtk" },
    { name = "gio" },
    { name = "glib" },
    { name = "gtk-sys" },
    { name = "gdk-sys" },
    { name = "gio-sys" },
    { name = "glib-sys" },
    { name = "gobject-sys" },
    { name = "pango-sys" },
    { name = "cairo-sys-rs" },
    { name = "gdk-pixbuf-sys" },
    { name = "atk-sys" },
]
