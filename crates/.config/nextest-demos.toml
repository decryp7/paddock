# cargo-nextest settings for the demo workspaces (apps/shell-demo, apps/workbench-demo): the crates' profiles without what only
# the crates workspace has. nextest refuses a filter that names a package the workspace lacks (CI 7277), so the real-browser
# group of paddock-chromium lives in crates/.config/nextest.toml only. Keep the two profiles equal otherwise.

[profile.default]
# One test per core but one (rules.md 13), so a full run leaves the machine usable.
test-threads = -1
# A test still running after 30 s is reported as SLOW (and again every 30 s); one still running after five minutes is
# stopped instead of letting a hang stall the run.
slow-timeout = { period = "30s", terminate-after = 10 }

# CI (.gitea/workflows/ci.yml, publish.yml): every failure reported, no retries (rules.md 5: a flaky test is fixed, not
# retried), a JUnit report.
[profile.ci]
fail-fast = false
retries = 0
flaky-result = "fail"
failure-output = "immediate-final"
# A CI job has its runner to itself.
test-threads = "num-cpus"
# The time budget of one test (rule 40): reported SLOW after 30 s and stopped, failing the run, after 60 s, so a test
# that waits on a timeout or a sleep fails CI instead of slowing it down (paddock-mcp's loopback tests waited 120 s on
# Windows). A test that needs longer is a waiver below: an override with a `# waiver:` line saying why;
# conformance/test/ci-actions.test.mjs checks both.
slow-timeout = { period = "30s", terminate-after = 2 }

[profile.ci.junit]
# Written to <target>/nextest/ci/junit.xml.
path = "junit.xml"
