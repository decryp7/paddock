[package]
name = "paddock-jobs"
version = "0.2.0"
description = "Long operations for the Paddock apps: phases, throttled progress, cancel tokens, streaming hashes and bounded parallel helpers."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["decryp7"]

[lib]
# Behaviour is tested through the public API in tests/ (an empty unit-test binary only adds unexecuted generic instances to coverage).
test = false

[features]
# The Tauri adapter (`paddock_jobs::tauri`: the `paddock://jobs` sink, `jobs_snapshot`, `job_cancel` in a `paddock-commands`
# table); the core never depends on Tauri.
tauri = ["dep:tauri", "dep:paddock-commands", "paddock-commands/tauri"]

[dependencies]
tauri = { workspace = true, optional = true }
paddock-commands = { workspace = true, optional = true }
paddock-env = { workspace = true }
paddock-limits = { workspace = true }
log = "0.4"
croner = { version = "4", default-features = false, features = ["jiff"] }
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
paddock-workspace-hack = { version = "0.1", path = "../paddock-workspace-hack" }

[dev-dependencies]
proptest = "1"
postcard = { version = "1", default-features = false, features = ["use-std"] }
serde_json = "1"
tempfile = "3"
# The Tauri adapter is tested on Tauri's mock runtime.
tauri = { workspace = true, features = ["test"] }
# The generated TypeScript of the adapter's command table, checked by tests/it/tauri.rs.
paddock-commands = { workspace = true }

[[bench]]
name = "walk"
harness = false
