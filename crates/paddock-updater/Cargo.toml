[package]
name = "paddock-updater"
version = "0.1.0"
description = "Updates for the Paddock apps: the update state machine, release information and minisign signature check over `paddock-download`, the install hand-off, service re-registration per version, and About and What's New."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["decryp7"]

[features]
# The Tauri adapter (`paddock_updater::tauri`: managed state, commands, the `paddock://updates` event, the automatic check
# and the exit hook); the core never depends on Tauri.
tauri = ["dep:tauri", "dep:log", "paddock-commands/tauri", "paddock-jobs/tauri", "paddock-download/tauri"]
# The installer over `tauri-plugin-updater` (`paddock_updater::tauri::PluginInstaller`): the plugin verifies the signature
# again and installs the platform's package. The app registers the plugin.
install = ["tauri", "dep:tauri-plugin-updater"]

[dependencies]
paddock-commands = { workspace = true }
paddock-download = { workspace = true }
paddock-jobs = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
base64 = "0.22"
minisign-verify = "0.3"
tauri = { workspace = true, optional = true }
log = { version = "0.4", features = ["kv"], optional = true }
# Without the `zip` feature (zip 4 has RUSTSEC-2026-0367/0368/0369; Tauri 2 updater packages are .exe/.msi, .app.tar.gz and
# .AppImage, none zipped) and without `system-proxy` (the plugin downloads nothing here: `paddock-download` does).
tauri-plugin-updater = { version = "2.14", optional = true, default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
tempfile = "3"
# The wire types' TypeScript (`ui/projects/paddock-ui/shell/about/generated/`), generated by a unit test.
ts-rs = "11.1"
# The adapter is tested on Tauri's mock runtime.
tauri = { workspace = true, features = ["test"] }
