[package]
name = "paddock-settings"
version = "0.2.0"
description = "Settings for the Paddock apps: the section schema (sections, typed fields, validation, owners) and the versioned settings file that falls back to defaults when it is missing or corrupt."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["decryp7"]

[features]
# The Tauri adapter (`paddock_settings::tauri`: the `paddock://settings` event, the commands and their table, the start-up
# problem notice through `paddock-health`); the core never depends on Tauri.
tauri = ["dep:tauri", "dep:paddock-commands", "paddock-commands/tauri", "dep:paddock-health", "paddock-health/tauri"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
regex = { version = "1", default-features = false, features = ["std", "unicode"] }
tauri = { workspace = true, optional = true }
paddock-commands = { workspace = true, optional = true }
paddock-health = { workspace = true, optional = true }
paddock-workspace-hack = { version = "0.1", path = "../paddock-workspace-hack" }

[dev-dependencies]
# The never-panics test of the parsers (conformance check C36).
paddock-testkit = { workspace = true }
tempfile = "3"
# The Tauri adapter is tested on Tauri's mock runtime.
tauri = { workspace = true, features = ["test"] }
# The wire types' TypeScript (`ui/projects/paddock-ui/shell/settings/generated/`), generated by a unit test.
ts-rs = { version = "11.1", features = ["serde-json-impl"] }
# Its generated-file check (`testing::sync_generated`), also without the `tauri` feature.
paddock-commands = { workspace = true }
