[package]
name = "paddock-settings"
version = "0.1.0"
description = "Settings for the Paddock apps: the section schema (sections, typed fields, validation, owners) and the versioned settings file that falls back to defaults when it is missing or corrupt."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["decryp7"]

# Scaffold from plan S0: the publish job holds the crate back until its work package removes this marker.
[package.metadata.paddock]
scaffold = true

[features]
# The Tauri adapter (`paddock_settings::tauri`); the core above it never depends on Tauri.
tauri = ["dep:tauri"]

[dependencies]
tauri = { workspace = true, optional = true }
