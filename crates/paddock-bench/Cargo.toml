[package]
name = "paddock-bench"
version = "0.1.0"
description = "Benchmark harness with stored budgets (rule 16): measurements of startup, throughput, time to first event, query latency and memory recorded with an injected clock, a results file per app, a budgets file (TOML) with tolerances and a regression limit against the previous run, a check that fails on a miss, and the paddock-bench command for the nightly workflow."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["decryp7"]

[package.metadata.paddock]
scaffold = true

[[bin]]
name = "paddock-bench"
path = "src/bin/paddock-bench.rs"

[dependencies]
paddock-cli = { workspace = true }
paddock-env = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[dev-dependencies]
tempfile = "3"
jsonschema = { version = "0.33", default-features = false }
