[package]
name = "paddock-secrets"
version = "0.1.0"
description = "Credentials for the Paddock apps: the Secrets port, a Secret that never prints, the keyring adapter, an in-memory store for tests, the opt-in owner-only file fallback and the one naming scheme."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["decryp7"]

[features]
# The OS credential store (Windows Credential Manager, macOS Keychain, Secret Service) through `keyring`. Its calls live in
# `src/os/native.rs`, refuse to run in tests unless `PADDOCK_SECRETS_REAL=1`, and are left out of the coverage job.
keyring = ["dep:keyring"]

[dependencies]
zeroize = "1"
log = "0.4"
# The OS random source for `random_token` (fails closed; the same version as paddock-mcp and paddock-ipc).
getrandom = "0.3"
keyring = { version = "4.2", optional = true }
paddock-env = { workspace = true }
paddock-workspace-hack = { version = "0.1", path = "../paddock-workspace-hack" }

[target.'cfg(unix)'.dependencies]
paddock-proc = { workspace = true }
# O_NOFOLLOW and O_NONBLOCK for opening a secret file (no symlink followed, no wait on a planted pipe).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# The owner-only DACL of a secret file, and its check on read.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
