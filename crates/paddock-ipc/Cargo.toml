[package]
name = "paddock-ipc"
version = "0.1.0"
description = "The family's one IPC (ADR 0001 step 1): length-prefixed postcard frames on a private local endpoint, a per-launch token and peer-pid handshake, a symmetric peer with calls, streams with credits, cancel and pushes, the child launcher and loop, and the companion link (discovery file, reconnect with back-off, replace another build)."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["decryp7"]
# The fuzz targets are their own workspace and are not published.
exclude = ["fuzz"]

# A child process for this crate's own tests (echo, exit at once, never connect, wrong token, a link companion). Never shipped
# by an app; it only exists so the tests start real processes.
[lib]
doctest = false # doctests are off (crates/README.md, "Doctests")

[[bin]]
name = "paddock-ipc-test-child"
path = "src/bin/test_child.rs"
test = false
doc = false

[features]
# Test support (rule 99; ADR 0072 WP-0): `testing::endings`, the harness that drives an endpoint through every way a
# connection ends and the raw-stream client that sees what the peer would, and `Host::with_clock`. Enabled from
# `[dev-dependencies]` only, never in a shipped build (`./dev check test-features`, C170).
# ADR 0122 adds the queue probe (Winsock's `FIONREAD` for loopback TCP on Windows) and the act gate (`Host::with_act_gate`,
# `ServerConfig::with_act_gate`).
test-support = ["windows-sys/Win32_Networking_WinSock"]

[dependencies]
paddock-env = { workspace = true }
paddock-jobs = { workspace = true }
paddock-limits = { workspace = true }
paddock-proc = { workspace = true }
getrandom = "0.3"
log = "0.4"
postcard = { version = "1", default-features = false, features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: a JSON number crosses the IPC unchanged (found by the fuzz target: without it a float could move by
# one unit in the last place each time it crossed).
serde_json = { version = "1", features = ["float_roundtrip"] }
subtle = "2.6"
paddock-workspace-hack = { version = "0.1", path = "../paddock-workspace-hack" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
paddock-jobs = { workspace = true, features = ["test-support"] }
# The self dev-dependency that turns `test-support` on for this package's own integration tests (rule 99): `Host::with_clock` and
# `testing::endings` are test-only and never reach a shipped build.
paddock-ipc = { path = ".", features = ["test-support"] }
paddock-testkit = { workspace = true }
proptest = "1"
tempfile = "3"

[package.metadata.paddock]
# What this crate's tests read that the test cache's reads extractor cannot resolve (ADR 0116 §2, user decision 122), as globs from the
# repository root; `[]` says the blind reads touch no repository file.
# The endings tests load the register and the ratchet through `Applicability::load_from` and `Ratchet::load_from`, which walk up from
# `CARGO_MANIFEST_DIR` to the first folder that has them.
test-reads = [
    "docs/ipc-endpoints.toml",
    "docs/ipc-endpoint-ratchet.toml",
]
