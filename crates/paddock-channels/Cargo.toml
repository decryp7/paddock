[package]
name = "paddock-channels"
version = "0.1.0"
description = "Outbound notification channels for the Paddock apps: webhook, ntfy and e-mail with secrets from paddock-secrets, bounded payloads, retries with back-off on the family's clock, and a test send."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["decryp7"]

[features]
default = ["smtp"]
# The real SMTP sender (`LettreSender`: lettre with rustls and the platform verifier). Without it the app brings its own `MailSender`.
smtp = ["dep:lettre"]
# The Tauri adapter (`paddock_channels::tauri`: the managed `ChannelsControl`, the commands `channels_get`, `channels_save`,
# `channels_set_secret`, `channels_clear_secret`, `channels_test` and the `paddock://channels` event); the core never depends on Tauri.
tauri = ["dep:tauri", "paddock-commands/tauri"]

[dependencies]
paddock-jobs = { workspace = true }
paddock-secrets = { workspace = true }
paddock-download = { workspace = true }
paddock-net = { workspace = true }
paddock-commands = { workspace = true }
# The dialog contracts of this crate (`dialogs!`, ADR 0026 §3).
paddock-dialogs = { workspace = true }
paddock-env = { workspace = true }
tauri = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls", "ring", "rustls-platform-verifier"], optional = true }
paddock-workspace-hack = { version = "0.1", path = "../paddock-workspace-hack" }

[dev-dependencies]
paddock-testkit = { workspace = true }
# The wire types' TypeScript (`ui/projects/paddock-ui/shell/channels/generated/`), generated by a unit test.
ts-rs = "11.1"
proptest = "1"
tempfile = "3"
tauri = { workspace = true, features = ["test"] }
