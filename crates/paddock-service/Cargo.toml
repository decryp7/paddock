[package]
name = "paddock-service"
version = "0.1.0"
description = "Background services and login items for the Paddock apps: one ServiceSpec rendered as a launchd plist (bundled for SMAppService or a file), a systemd unit, a Windows Run entry or service and the NSIS installer hooks; registration and repair behind ports (rule 24: unregister, bootout, wait, register once per version change; a stale registration repaired automatically); the registered version; the exe-changed restart; launch at login; the health entry."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["decryp7"]

[features]
# The Tauri adapter (`paddock_service::tauri`): the managed `ServiceControl`, the commands `service_status`,
# `service_repair`, `service_install` and `open_login_items`, the `paddock://service` event and the health wiring. The
# core never depends on Tauri.
tauri = ["dep:tauri", "paddock-commands/tauri"]

[dependencies]
paddock-cli = { workspace = true }
paddock-commands = { workspace = true }
paddock-env = { workspace = true }
paddock-health = { workspace = true }
paddock-proc = { workspace = true }
paddock-settings = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = { version = "0.4", features = ["kv"] }
tauri = { workspace = true, optional = true }
paddock-workspace-hack = { version = "0.1", path = "../paddock-workspace-hack" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# SMAppService (macOS 13+): the native glue in `src/native.rs` only.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }

# Windows' own elevation prompt (`ShellExecuteExW` with "runas") and the service host (sessions, the user's token,
# `CreateProcessAsUserW`, the SCM dispatcher): the native glue in `src/native.rs` only.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Environment",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-service = "0.8"

[dev-dependencies]
tempfile = "3"
# The never-panics test of the parser (`corpus`, `never_panics`).
paddock-testkit = { workspace = true }
# The wire types' TypeScript (`ui/projects/paddock-ui/shell/service/generated/`), generated by a unit test.
ts-rs = "11.1"
# The adapter is tested on Tauri's mock runtime.
tauri = { workspace = true, features = ["test"] }
# Every rendered plist must parse as a property list.
plist = "1"
