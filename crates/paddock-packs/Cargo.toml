[package]
name = "paddock-packs"
version = "0.1.0"
description = "Knowledge packs for the Paddock apps (rule 21): TOML packs, built-in plus the user's packs folder, parsed once with limits, typed with unknown keys reported, one bad pack refused whole without touching the rest, a debounced reload that builds the new set and swaps it, and user regexes compiled with caps."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["decryp7"]

[features]
# The real-folder watcher (`paddock_packs::watch::NotifySource`): `paddock-watch`'s adapter over the `notify` crate.
watch = ["paddock-watch/notify"]
# The Tauri adapter (`paddock_packs::tauri`): the managed registry of pack kinds, the commands `packs_status` and
# `packs_reload`, the `paddock://packs` event and the `paddock-health` entry whose Repair reloads. The core never depends on Tauri.
tauri = ["dep:tauri", "dep:paddock-health", "dep:log", "paddock-commands/tauri"]

[dependencies]
paddock-env = { workspace = true }
paddock-jobs = { workspace = true }
paddock-watch = { workspace = true }
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
serde = { version = "1", features = ["derive"] }
paddock-commands = { workspace = true }
paddock-health = { workspace = true, optional = true }
log = { version = "0.4", optional = true }
tauri = { workspace = true, optional = true }
serde_ignored = "0.1"
toml = "0.9"
paddock-workspace-hack = { version = "0.1", path = "../paddock-workspace-hack" }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
# The wire types' TypeScript (`ui/projects/paddock-ui/shell/packs/generated/`), generated by a unit test.
ts-rs = "11.1"
# The adapter is tested on Tauri's mock runtime.
tauri = { workspace = true, features = ["test"] }
