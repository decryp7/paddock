[package]
name = "paddock-commands"
version = "0.1.0"
description = "The command table for the Paddock apps: one macro for the kind, window classes, request size limit and async-only rule of every command, the guard hook and generated TypeScript command names."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["decryp7"]

# Scaffold from plan S0: the publish job holds the crate back until its work package removes this marker.
[package.metadata.paddock]
scaffold = true

[features]
# The Tauri adapter (`paddock_commands::tauri`); the core above it never depends on Tauri.
tauri = ["dep:tauri"]

[dependencies]
tauri = { workspace = true, optional = true }
