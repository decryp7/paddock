[package]
name = "paddock-commands"
version = "0.1.0"
description = "The command table for the Paddock apps: one macro for the kind, window classes, request size limit and async-only rule of every command, the guard hook and generated TypeScript command names."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["decryp7"]

[features]
# The Tauri adapter (`paddock_commands::tauri`); the core above it never depends on Tauri.
tauri = ["dep:tauri", "dep:log", "dep:serde_json"]

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { workspace = true, optional = true }
log = { version = "0.4", features = ["kv"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
# The Tauri adapter is tested on Tauri's mock runtime.
tauri = { workspace = true, features = ["test"] }
# The wire types' TypeScript (`ui/projects/paddock-ui/shell/generated/commands.ts`), generated by a unit test.
ts-rs = "11.1"
