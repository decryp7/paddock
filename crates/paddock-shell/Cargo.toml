[package]
name = "paddock-shell"
# Lockstep with the npm package @decryp7/paddock-ui (ADR 0012 §3, "one version across the boundary"): the UI checks
# `shell_version` against its own version at start-up. `scripts/publish.mjs` and this crate's tests check the two agree.
version = "0.2.0"
description = "The Paddock app shell as one Tauri plugin: every shell command behind one guard, the shell's managed state and window, page and run hooks, generated permission sets per window class, and the manifest check."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["decryp7"]
# Tauri plugins name themselves through `links` (the app's build reads the plugin's permissions through it).
links = "paddock-shell"

[features]
# Dialogs are not parented to a native window and nothing is shown natively: for tests on Tauri's mock runtime only.
mock-runtime = ["paddock-dialogs/mock-runtime"]
# The start-up watchdog asks natively, and Report a Problem asks where to save, through `tauri-plugin-dialog` (the app registers
# that plugin).
native-dialogs = ["paddock-startup/dialog", "paddock-diag/dialog"]
# The installer over `tauri-plugin-updater` (the app registers that plugin).
install = ["paddock-updater/install"]
# The native tray icon.
tray = ["paddock-window/tray"]

[dependencies]
tauri = { workspace = true }
paddock-commands = { workspace = true, features = ["tauri"] }
paddock-dialogs = { workspace = true, features = ["tauri"] }
paddock-diag = { workspace = true, features = ["tauri"] }
paddock-download = { workspace = true, features = ["tauri"] }
paddock-health = { workspace = true, features = ["tauri"] }
paddock-jobs = { workspace = true, features = ["tauri"] }
paddock-menu = { workspace = true, features = ["tauri"] }
paddock-service = { workspace = true, features = ["tauri"] }
paddock-settings = { workspace = true, features = ["tauri"] }
paddock-startup = { workspace = true, features = ["tauri"] }
paddock-updater = { workspace = true, features = ["tauri"] }
paddock-window = { workspace = true, features = ["tauri"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = { version = "0.4", features = ["kv"] }

[build-dependencies]
tauri-plugin = { version = "2.7", features = ["build"] }

[dev-dependencies]
# The background service test drives a fake OS (`paddock_service::testing`).
paddock-service = { workspace = true, features = ["tauri"] }
tauri = { workspace = true, features = ["test"] }
paddock-dialogs = { workspace = true, features = ["tauri", "mock-runtime"] }
# The diagnostics test installs a scoped log and folders in a temporary directory.
paddock-log = { workspace = true }
paddock-env = { workspace = true }
# The permission sets are resolved through Tauri's own ACL in the tests.
tauri-utils = "2.10"
toml = "0.9"
tempfile = "3"
# The wire types' TypeScript (`ui/projects/paddock-ui/shell/generated/shell.ts`), generated by a unit test.
ts-rs = "11.1"
