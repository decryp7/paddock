[package]
name = "paddock-window"
version = "0.1.0"
description = "Windows for the Paddock apps: top-level windows in the shell's label scheme, remembered bounds on the right monitor, single instance and deep links, the bounded quit, native feel, the tray icon and the tray popover window."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["decryp7"]

[features]
# The Tauri adapter (`paddock_window::tauri`); the core above it never depends on Tauri.
tauri = ["dep:tauri", "paddock-commands/tauri", "paddock-dialogs/tauri", "dep:windows"]
# The native tray icon (`paddock_window::tauri::NativeTray`): Tauri's `tray-icon` feature. The popover needs only `tauri`.
tray = ["tauri", "tauri/tray-icon"]
# WebView2's browser keys off in release builds (Windows): needs the webview itself, so Tauri's `wry` runtime, which
# the app has anyway. Without it the UI's native-feel guard covers the keys it can.
wry = ["tauri", "tauri/wry", "dep:webview2-com"]

[dependencies]
paddock-commands = { workspace = true }
# The clock of the exit limits (`paddock_jobs::time`), so tests run them out without waiting.
paddock-jobs = { workspace = true }
paddock-dialogs = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = { version = "0.4", features = ["kv"] }
url = "2.5"
tauri = { workspace = true, optional = true }
paddock-workspace-hack = { version = "0.1", path = "../paddock-workspace-hack" }

[target.'cfg(windows)'.dependencies]
# WebView2's browser keys (native feel), rounded popover corners (DWM) and the taskbar check (tray).
windows = { version = "0.62", optional = true, features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging"] }
webview2-com = { version = "0.39", optional = true }

[dev-dependencies]
# The adapter is tested on Tauri's mock runtime: no window, tray icon or single-instance lock reaches the desktop.
tauri = { workspace = true, features = ["test"] }
# Builds monitors for the popover and bounds on the mock runtime.
tauri-runtime = "2.12"
paddock-commands = { workspace = true, features = ["tauri"] }
# Dialogs opened in these tests are not parented natively (the mock runtime cannot on Linux).
paddock-dialogs = { workspace = true, features = ["mock-runtime"] }
tempfile = "3"
# The wire types' TypeScript (`ui/projects/paddock-ui/shell/generated/window.ts`), generated by a unit test.
ts-rs = "11.1"

[[test]]
# Runs on the main thread (no harness): macOS builds menus there only.
name = "native_menu"
harness = false
required-features = ["tray"]
