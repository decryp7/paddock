[package]
name = "paddock-storage"
version = "0.1.0"
description = "What each Paddock app keeps on disk and how to clear it safely: categories the app declares (cache the app can rebuild, data that is the user's), a bounded size walk (entries, time, depth, no links, one volume), a preview that is measured first, a re-check before every delete (still there, still the same kind, still inside the category's folder, not changed since the preview), confirmation for the user's data, and everything as a job with live progress and Cancel. Nothing outside the app's own folders is ever removed."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["decryp7"]

[features]
# The Tauri adapter (`paddock_storage::tauri`): managed state, the scan, clear, cancel, last-usage and reveal commands, the jobs, and
# the `paddock://storage` outcome event. The core never depends on Tauri.
tauri = ["dep:tauri", "paddock-commands/tauri", "paddock-jobs/tauri", "paddock-files/tauri"]

[dependencies]
paddock-commands = { workspace = true }
paddock-env = { workspace = true }
paddock-jobs = { workspace = true }
paddock-files = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = { version = "0.4", features = ["kv"] }
tauri = { workspace = true, optional = true }
paddock-workspace-hack = { version = "0.1", path = "../paddock-workspace-hack" }

[dev-dependencies]
tempfile = "3"
tauri = { workspace = true, features = ["test"] }
# The wire types' TypeScript (`ui/projects/paddock-ui/shell/storage/generated/`), generated by a unit test.
ts-rs = "11.1"
