# The shared crates' clippy configuration. Only the kill entries and the Keychain entries of the family preset
# (lint/clippy.toml) apply here: the shared crates are where the process helpers live, so `Command::new` and `temp_dir`
# stay allowed in them, and paddock-secrets is the one door to the OS credential store, so keyring::Entry stays allowed.
disallowed-methods = [
    # ADR 0021 amendment 2026-11-11 (D-P2): a canonical path keeps Windows' verbatim `\\?\` prefix and later meets git, cargo, text or a plain path. Go through paddock_env::winpath, which holds the one #[expect].
    { path = "std::fs::canonicalize", reason = "use paddock_env::winpath::real_for_tools (programs), real (display, Rust file APIs) or real_verbatim (Win32 long paths, compared only with verbatim paths); ADR 0021 amendment 2026-11-11" },
    { path = "std::path::Path::canonicalize", reason = "use paddock_env::winpath::real_for_tools (programs), real (display, Rust file APIs) or real_verbatim (Win32 long paths, compared only with verbatim paths); ADR 0021 amendment 2026-11-11" },
    # ADR 0033: nothing is ended by a bare pid. A pid may name another process by the time it is signalled; end it through
    # paddock-proc with a ProcessId, or through a handle or job this process owns. A justified site carries
    # #[expect(clippy::disallowed_methods, reason = "...")].
    { path = "libc::kill", allow-invalid = true, reason = "signals a bare pid: use paddock_proc::end / kill_tree with a ProcessId (ADR 0033)" },
    { path = "libc::killpg", allow-invalid = true, reason = "signals a process group by a bare pid: use paddock_proc::kill_tree with a ProcessId (ADR 0033)" },
    { path = "nix::sys::signal::kill", allow-invalid = true, reason = "signals a bare pid: use paddock_proc::end / ask with a ProcessId (ADR 0033)" },
    { path = "nix::sys::signal::killpg", allow-invalid = true, reason = "signals a process group by a bare pid: use paddock_proc::kill_tree with a ProcessId (ADR 0033)" },
    { path = "sysinfo::Process::kill", allow-invalid = true, reason = "ends a process found by pid: use paddock_proc::end with a ProcessId (ADR 0033)" },
    { path = "sysinfo::Process::kill_with", allow-invalid = true, reason = "ends a process found by pid: use paddock_proc::end / ask with a ProcessId (ADR 0033)" },
    # A pre_exec hook forces fork+exec instead of posix_spawn; every fork carries copies of the process's inheritable
    # descriptors (a lock, an exec-status pipe) until it execs, which refused restarts and hung spawns. Do the work after
    # the spawn through the held child (paddock_proc::Supervised::lower_priority) or in the child's own code.
    { path = "std::os::unix::process::CommandExt::pre_exec", allow-invalid = true, reason = "forces fork+exec: act on the held child after the spawn instead (ER-21, lessons)" },
    # ADR 0057 (rule 72, C99): no shipped process uses the macOS Keychain. Ad-hoc builds lose silent access on every update and
    # a blocked call waits with no window; the admin key and the pasted keys live in owner-only files (paddock-secrets).
    { path = "security_framework::passwords::get_generic_password", allow-invalid = true, reason = "the macOS Keychain: no shipped process uses it; keep secrets in an owner-only file through paddock-secrets (ADR 0057, rule 72); allow-invalid: security-framework is empty off Apple targets, so the path does not resolve on the Linux and Windows legs (it resolves on macOS, measured 2026-11-08)" },
    { path = "security_framework::passwords::generic_password", allow-invalid = true, reason = "the macOS Keychain: no shipped process uses it; keep secrets in an owner-only file through paddock-secrets (ADR 0057, rule 72); allow-invalid: security-framework is empty off Apple targets, so the path does not resolve on the Linux and Windows legs (it resolves on macOS, measured 2026-11-08)" },
