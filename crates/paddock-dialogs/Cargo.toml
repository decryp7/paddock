[package]
name = "paddock-dialogs"
version = "0.2.0"
description = "Dialogs as OS windows for the Paddock apps: the dialog contracts as static tables and `allows(dialog, command)`, pure placement on the parent's monitor, window creation by kind, fit/grow and bounds."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["decryp7"]

[features]
# The Tauri adapter (`paddock_dialogs::tauri`); the core above it never depends on Tauri.
tauri = ["dep:tauri", "dep:log"]
# For other crates' tests on Tauri's mock runtime: dialogs are not parented to a native window. Never in an app.
mock-runtime = ["tauri"]

[dependencies]
paddock-commands = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { workspace = true, optional = true }
log = { version = "0.4", features = ["kv"], optional = true }
paddock-workspace-hack = { version = "0.1", path = "../paddock-workspace-hack" }

[dev-dependencies]
# The Tauri adapter is tested on Tauri's mock runtime; `tauri-runtime` builds monitors for the placement on it.
tauri = { workspace = true, features = ["test"] }
tauri-runtime = "2.12"
paddock-commands = { workspace = true, features = ["tauri"] }
log = { version = "0.4", features = ["kv"] }
# The wire types' TypeScript (`ui/projects/paddock-ui/shell/generated/dialogs.ts`), generated by a unit test.
ts-rs = "11.1"
