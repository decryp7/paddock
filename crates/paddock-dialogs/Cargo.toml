[package]
name = "paddock-dialogs"
version = "0.2.0"
description = "Dialogs as OS windows for the Paddock apps: the dialog contracts as static tables and `allows(dialog, command)`, pure placement on the parent's monitor, window creation by kind, fit/grow and bounds."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["decryp7"]

[features]
# The Tauri adapter (`paddock_dialogs::tauri`); the core above it never depends on Tauri.
tauri = ["dep:tauri", "dep:log", "dep:objc2-app-kit", "dep:windows"]
# For other crates' tests on Tauri's mock runtime: dialogs are not parented to a native window. Never in an app.
mock-runtime = ["tauri"]

[dependencies]
paddock-commands = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { workspace = true, optional = true }
log = { version = "0.4", features = ["kv"], optional = true }
paddock-workspace-hack = { version = "0.1", path = "../paddock-workspace-hack" }

# Windows: the edge (ADR 0043 §3): DPI, frames, work area and the window subclass (`edge/windows.rs`). Already in every app's
# tree through Tauri.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# macOS: a dialog window is attached to its parent when it is shown, not when it is created (`addChildWindow:ordered:`;
# AppKit orders a child in with its parent at once, ADR 0026 §4.6 and the 1.1-0 spike). Already in every app's tree
# through Tauri.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSResponder", "NSWindow", "NSGraphics"], optional = true }

[dev-dependencies]
# The Tauri adapter is tested on Tauri's mock runtime; `tauri-runtime` builds monitors for the placement on it.
tauri = { workspace = true, features = ["test", "wry"] }
tauri-runtime = "2.12"
paddock-commands = { workspace = true, features = ["tauri"] }
log = { version = "0.4", features = ["kv"] }
# The wire types' TypeScript (`ui/projects/paddock-ui/shell/generated/dialogs.ts`), generated by a unit test.
ts-rs = "11.1"
# Property tests of the size state machine (ADR 0043 check 2).
proptest = "1"
# The real-window probe resolves the app's dialog capability against the shell plugin's permission files.
toml = "0.9"

# The §6 real-window probe: a Tauri app needs the main thread, so no libtest harness. Exits 0 at once unless
# PADDOCK_REAL_WINDOWS=1 (see crates/README.md).
[[test]]
name = "show_probe"
harness = false
required-features = ["tauri"]
