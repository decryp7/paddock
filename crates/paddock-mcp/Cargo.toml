[package]
name = "paddock-mcp"
version = "0.1.0"
description = "Local-only MCP (Model Context Protocol) server for the Paddock apps (ADR 0007): JSON-RPC 2.0 with the 2025-06-18 shapes, a tool and resource registry that is read-only by default (actions need an explicit opt-in), input validation, result caps, paging and time limits, a redacted audit log, stdio and loopback transports with per-client keys, and the client-side request builders and types Pitwall uses."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["decryp7"]

[features]
# The Tauri adapter (`paddock_mcp::tauri`): the managed `McpControl`, the commands `mcp_get`, `mcp_save`, `mcp_issue_key`,
# `mcp_revoke_key`, `mcp_audit`, `mcp_audit_clear` and the `paddock://mcp` event. The core never depends on Tauri.
tauri = ["dep:tauri", "paddock-commands/tauri"]

[dependencies]
paddock-commands = { workspace = true }
# The dialog contracts of this crate (`dialogs!`, ADR 0026 §3).
paddock-dialogs = { workspace = true }
paddock-env = { workspace = true }
tauri = { workspace = true, optional = true }
paddock-jobs = { workspace = true }
paddock-log = { workspace = true }
paddock-proc = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
sha2 = "0.10"
getrandom = "0.3"
paddock-workspace-hack = { version = "0.1", path = "../paddock-workspace-hack" }

[dev-dependencies]
# The wire types' TypeScript (`ui/projects/paddock-ui/shell/mcp/generated/`), generated by a unit test.
ts-rs = "11.1"
tauri = { workspace = true, features = ["test"] }
# The never-panics test of the parsers (conformance check C36).
paddock-testkit = { workspace = true }
tempfile = "3"
