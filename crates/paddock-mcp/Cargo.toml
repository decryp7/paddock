[package]
name = "paddock-mcp"
version = "0.1.0"
description = "Local-only MCP (Model Context Protocol) server for the Paddock apps (ADR 0007): JSON-RPC 2.0 with the 2025-06-18 shapes, a tool and resource registry that is read-only by default (actions need an explicit opt-in), input validation, result caps, paging and time limits, a redacted audit log, stdio and loopback transports with per-client keys, and the client-side request builders and types Pitwall uses."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["decryp7"]

[lib]
doctest = false # doctests are off (crates/README.md, "Doctests")

[features]
# The Tauri adapter (`paddock_mcp::tauri`): the managed `McpControl`, the commands `mcp_get`, `mcp_save`, `mcp_issue_key`,
# `mcp_revoke_key`, `mcp_audit`, `mcp_audit_clear` and the `paddock://mcp` event. The core never depends on Tauri.
tauri = ["dep:tauri", "paddock-commands/tauri"]
# Test support (rule 99; ADR 0122 §4): the loopback listener's act gate (`serve_loopback_with_act_gate`) for the ending test.
# Enabled from `[dev-dependencies]` only, never in a shipped build (`./dev check test-features`, C170).
test-support = []

[dependencies]
paddock-commands = { workspace = true }
# The dialog contracts of this crate (`dialogs!`, ADR 0026 §3).
paddock-dialogs = { workspace = true }
paddock-env = { workspace = true }
# The one end line of a connection (ADR 0072 WP-7, rules 42 and 55): `paddock_ipc::endlog`, shared with the other endpoints.
paddock-ipc = { workspace = true }
tauri = { workspace = true, optional = true }
paddock-jobs = { workspace = true }
paddock-log = { workspace = true }
paddock-proc = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
# The loopback accept waits on a poll that `Serving::stop` wakes (no wake connection to the listener).
mio = { version = "1", features = ["os-poll", "net"] }
sha2 = "0.10"
getrandom = "0.3"
paddock-workspace-hack = { version = "0.1", path = "../paddock-workspace-hack" }

[dev-dependencies]
paddock-jobs = { workspace = true, features = ["test-support"] }
paddock-commands = { workspace = true, features = ["test-support"] }
# The wire types' TypeScript (`ui/projects/paddock-ui/shell/mcp/generated/`), generated by a unit test.
ts-rs = "11.1"
tauri = { workspace = true, features = ["test"] }
# The never-panics test of the parsers (conformance check C36).
paddock-testkit = { workspace = true }
tempfile = "3"
# The ending harness of ADR 0072 (`tests/it/endings.rs`): the raw-stream client, the scenarios, the ratchet.
paddock-ipc = { workspace = true, features = ["test-support"] }
# The self dev-dependency that turns `test-support` on for this package's own integration tests (rule 99): the act gate.
paddock-mcp = { path = ".", features = ["test-support"] }

[target.'cfg(unix)'.dev-dependencies]
# The loopback test that interrupts a read with a real signal (the Linux field case of 2026-11-07).
libc = "0.2"

[package.metadata.paddock]
# What this crate's tests read that the test cache's reads extractor cannot resolve (ADR 0116 §2, user decision 122), as globs from the
# repository root; `[]` says the blind reads touch no repository file.
# `tests/it/endings.rs` loads the endings register and ratchet through `load_from(CARGO_MANIFEST_DIR)` (see paddock-ipc).
test-reads = [
    "docs/ipc-endpoints.toml",
    "docs/ipc-endpoint-ratchet.toml",
]
