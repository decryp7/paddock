[package]
name = "paddock-slots"
version = "0.1.0"
description = "Numbered slots backed by operating-system file locks that the kernel releases when the holder dies: take the first free slot of N, hold it for the life of a job, release it, and read which slots are busy. No stale reclaim, so no reclaim race."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["decryp7"]

[lib]
doctest = false # doctests are off (crates/README.md, "Doctests")

[dependencies]
paddock-workspace-hack = { version = "0.1", path = "../paddock-workspace-hack" }

[dev-dependencies]
# The one constructor of a program's Command (the tests' holder child).
paddock-env = { workspace = true }
tempfile = "3"
paddock-testkit = { workspace = true }

[package.metadata.paddock]
# What this crate's tests read that the test cache's reads extractor cannot resolve (ADR 0116 §2, user decision 122), as globs from the
# repository root; `[]` says the blind reads touch no repository file.
# `tests/it/holder.rs` starts the test binary again (`current_exe`) as a holder child: no repository file.
test-reads = []
