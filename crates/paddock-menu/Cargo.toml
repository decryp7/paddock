[package]
name = "paddock-menu"
version = "0.1.0"
description = "Menus for the Paddock apps: the menu model, its validation and limits, the macOS native menu with the standard items, diffing and routing to the focused window."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["decryp7"]

# Scaffold from plan S0: the publish job holds the crate back until its work package removes this marker.
[package.metadata.paddock]
scaffold = true

[features]
# The Tauri adapter (`paddock_menu::tauri`); the core above it never depends on Tauri.
tauri = ["dep:tauri"]

[dependencies]
tauri = { workspace = true, optional = true }
