[package]
name = "paddock-menu"
version = "0.1.0"
description = "Menus for the Paddock apps: the menu model, its validation and limits, the macOS native menu with the standard items, diffing and routing to the focused window."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["decryp7"]

[features]
# The Tauri adapter (`paddock_menu::tauri`); the core above it never depends on Tauri.
tauri = ["dep:tauri", "dep:log"]

[dependencies]
paddock-commands = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { workspace = true, optional = true }
log = { version = "0.4", features = ["kv"], optional = true }

[dev-dependencies]
# The Tauri adapter is tested on Tauri's mock runtime: no window or menu bar reaches the desktop.
tauri = { workspace = true, features = ["test"] }
paddock-commands = { workspace = true, features = ["tauri"] }
log = { version = "0.4", features = ["kv"] }
# The wire types' TypeScript (`ui/projects/paddock-ui/shell/menu/generated/menu.ts`), generated by a unit test.
ts-rs = "11.1"
