[package]
name = "paddock-net"
version = "0.1.0"
description = "Outbound HTTP policy for the Paddock apps: https only (plain http to loopback), reach limits with a guard on every address and redirect, caps, redirect limit, host allow-list, offline switch, per-host gap and conditional requests, on paddock-download's TLS and proxy set-up with connection reuse."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["decryp7"]

[lib]
doctest = false # doctests are off (crates/README.md, "Doctests")

[features]
# Test support (rule 99): the test-only hooks and fakes (`FakeWire`, `Reply`, `Seen`, `StaticLookup`). Enabled from
# `[dev-dependencies]` only, never in a shipped build (`./dev check test-features`, C170).
test-support = []
default = ["http"]
# The real wire (`UreqWire`: ureq and rustls, certificates from the operating system, the proxy of `paddock-download`, the
# address guard applied to the very addresses the socket connects to). Without it the app brings its own `Wire`.
http = ["dep:ureq", "dep:rustls", "paddock-download/http"]

[dependencies]
paddock-limits = { workspace = true }
paddock-jobs = { workspace = true }
# The workspace entry has no default features: `http` (ureq and rustls) comes only with this crate's own `http` feature.
paddock-download = { workspace = true }
url = "2"
ureq = { version = "3.1", default-features = false, features = ["rustls-no-provider", "platform-verifier"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"], optional = true }
paddock-workspace-hack = { version = "0.1", path = "../paddock-workspace-hack" }

[dev-dependencies]
# The self dev-dependency that turns `test-support` on for this package's own integration tests (rule 99).
paddock-net = { path = ".", features = ["test-support"] }
paddock-jobs = { workspace = true, features = ["test-support"] }
paddock-testkit = { workspace = true }
proptest = "1"

# What this crate's tests read that the test cache's reads extractor cannot resolve (ADR 0116 §2, user decision 122), as globs from the
# repository root; `[]` says the blind reads touch no repository file.
# `tests/it/slim.rs` runs `cargo tree --offline --locked -p paddock-net` in this folder: it reads the workspace lock, this crate's manifest and
# its dependencies' manifests, all of which are in this crate's key already.
[package.metadata.paddock]
test-reads = []
