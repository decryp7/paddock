[package]
name = "paddock-diag"
version = "0.1.0"
description = "Report a problem for the Paddock apps: a diagnostics zip of the app's logs, system facts and settings that the user previews file by file and saves where they choose. One redactor for secrets, personal data and content; sections the app contributes; nothing is ever sent."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["decryp7"]

[features]
# The Tauri adapter (`paddock_diag::tauri`): managed state, the preview/save/cancel commands, the save job and its event, the
# webview log command and the "Diagnostics > Logging" section applied to the log. The core never depends on Tauri.
tauri = ["dep:tauri", "paddock-commands/tauri", "paddock-jobs/tauri"]
# The save picker over `tauri-plugin-dialog` (`paddock_diag::tauri::NativePicker`); the app registers the plugin.
dialog = ["tauri", "dep:tauri-plugin-dialog"]

[dependencies]
paddock-commands = { workspace = true }
paddock-env = { workspace = true }
paddock-jobs = { workspace = true }
paddock-log = { workspace = true }
paddock-settings = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tauri = { workspace = true, optional = true }
log = { version = "0.4", features = ["kv"] }
tauri-plugin-dialog = { version = "2.8", optional = true }
paddock-workspace-hack = { version = "0.1", path = "../paddock-workspace-hack" }

[dev-dependencies]
tempfile = "3"
tauri = { workspace = true, features = ["test"] }
# The wire types' TypeScript (`ui/projects/paddock-ui/shell/diagnostics/generated/`), generated by a unit test.
ts-rs = "11.1"
