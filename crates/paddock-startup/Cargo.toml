[package]
name = "paddock-startup"
version = "0.2.0"
description = "The start-up contract of the Paddock apps: the pure watchdog and its ticker, `window_ready`, boot-error forwarding, the UI checkpoint, the liveness heartbeat and the native ask dialog, plus the run lifecycle: the running marker and unclean-shutdown detection, safe mode, the autosaved versioned UI session and the restore offer."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["decryp7"]

[features]
# The Tauri adapter (`paddock_startup::tauri`); the core above it never depends on Tauri.
tauri = ["dep:tauri", "os-probe", "paddock-commands/tauri"]
# The OS process table behind `lifecycle::os_probe` (is the process of a left-behind running marker still alive?).
os-probe = ["dep:sysinfo"]
# The native question through `tauri-plugin-dialog` (`paddock_startup::tauri::NativeAsker`); the app registers the plugin.
dialog = ["tauri", "dep:tauri-plugin-dialog"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { workspace = true, optional = true }
log = { version = "0.4", features = ["kv"] }
paddock-commands = { workspace = true }
paddock-env = { workspace = true }
paddock-log = { workspace = true }
sysinfo = { version = "0.39", default-features = false, features = ["system"], optional = true }
tauri-plugin-dialog = { version = "2.8", optional = true }
paddock-workspace-hack = { version = "0.1", path = "../paddock-workspace-hack" }

[dev-dependencies]
# The never-panics test of the parsers (conformance check C36).
paddock-testkit = { workspace = true }
tempfile = "3"
# The wire types' TypeScript (`ui/projects/paddock-ui/shell/startup/generated/`), generated by a unit test.
ts-rs = "11.1"
# The adapter is tested on Tauri's mock runtime.
tauri = { workspace = true, features = ["test"] }
