[package]
name = "paddock-metrics"
version = "0.1.0"
description = "Metrics for the Paddock apps: a generic tiered store (fine points for a short time, coarser averages for longer, every tier bounded, restored and persisted through paddock-env), the machine sampler (CPU, memory, own process memory with PSS on Linux, free space of a path's volume) on the shared Clock, and a bounded folder size."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["decryp7"]

[dependencies]
paddock-env = { workspace = true }
paddock-jobs = { workspace = true }
paddock-proc = { workspace = true }
serde = { version = "1", features = ["derive"] }
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }
paddock-workspace-hack = { version = "0.1", path = "../paddock-workspace-hack" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
paddock-testkit = { workspace = true }
serde_json = "1"
