[package]
name = "paddock-health"
version = "0.2.0"
description = "Service health for the Paddock apps: service state, cause and repair action, the registry and its snapshot, and the cause-key notification centre with versioned persistence."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["decryp7"]

[features]
# The Tauri adapter (`paddock_health::tauri`: events, commands and their table); the core never depends on Tauri.
tauri = ["dep:tauri", "paddock-commands/tauri"]
# The OS notification adapter over `tauri-plugin-notification` (`paddock_health::tauri::native::PluginToaster`); the app registers the plugin.
os-notify = ["tauri", "dep:tauri-plugin-notification", "dep:paddock-proc"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = { version = "0.4", features = ["kv"] }
# The family's clock port (`paddock_jobs::time`).
paddock-jobs = { workspace = true }
# Local time of day for quiet hours (`notify::os::SystemLocalTime`).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tauri = { workspace = true, optional = true }
paddock-commands = { workspace = true, optional = true }
tauri-plugin-notification = { version = "2.7", optional = true }
# Opening the system's notification settings (no console window on Windows).
paddock-proc = { workspace = true, optional = true }
paddock-workspace-hack = { version = "0.1", path = "../paddock-workspace-hack" }

[dev-dependencies]
tempfile = "3"
# The Tauri adapter is tested on Tauri's mock runtime.
tauri = { workspace = true, features = ["test"] }
# The wire types' TypeScript (`ui/projects/paddock-ui/shell/generated/health.ts`), generated by a unit test.
ts-rs = { version = "11.1", features = ["serde-json-impl"] }
# Its generated-file check (`testing::sync_generated`), also without the `tauri` feature.
paddock-commands = { workspace = true }
