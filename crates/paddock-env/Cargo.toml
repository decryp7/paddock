[package]
name = "paddock-env"
version = "0.1.0"
description = "Folders and state files for the Paddock apps: the per-OS data, config, cache, log and runtime folders (one override variable, portable mode) and the versioned state file (atomic write with backup, migrations, damaged or missing gives defaults, newer is refused)."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["decryp7"]

[dependencies]
serde = "1"
serde_json = "1"
log = "0.4"
paddock-workspace-hack = { version = "0.1", path = "../paddock-workspace-hack" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# NtCreateFile relative to a folder handle with the owner-only descriptor, and the owner and DACL read back from the handle.
windows-sys = { version = "0.61", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
tempfile = "3"
