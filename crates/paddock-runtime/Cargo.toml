[package]
name = "paddock-runtime"
version = "0.1.0"
description = "Pinned runtimes for the Paddock apps (Chromium, FFmpeg, llama.cpp): a catalogue of per-platform archives with size and SHA-256, a versioned store that installs through paddock-download as one job (download, unpack, self-test, install), keeps the previous release for rollback and quarantines a release that fails."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["decryp7"]

[lib]
doctest = false # doctests are off (crates/README.md, "Doctests")

[features]
# Test support (rule 97): the test-only hooks and fakes (`RuntimeStore::with_clock`). Enabled from `[dev-dependencies]`
# only, never in a shipped build (`./dev check test-features`, C170).
testing = []

[dependencies]
paddock-archive = { workspace = true }
paddock-download = { workspace = true }
paddock-env = { workspace = true }
paddock-jobs = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
log = "0.4"
paddock-workspace-hack = { version = "0.1", path = "../paddock-workspace-hack" }

[dev-dependencies]
# The self dev-dependency that turns `testing` on for this package's own integration tests (rule 97).
paddock-runtime = { path = ".", features = ["testing"] }
paddock-jobs = { workspace = true, features = ["testing"] }
# The never-panics test of the parsers (conformance check C36).
paddock-testkit = { workspace = true }
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tar = { version = "0.4", default-features = false }
flate2 = "1"
