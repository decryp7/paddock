[package]
name = "paddock-download"
version = "0.1.0"
description = "Downloads for the Paddock apps: segmented Range downloads with per-host caps, 429 and Retry-After back-off, resume, and one in-order SHA-256 while writing, reported as job phases."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["decryp7"]

# Scaffold from plan S0: the publish job holds the crate back until its work package removes this marker.
[package.metadata.paddock]
scaffold = true

[features]
# The Tauri adapter (`paddock_download::tauri`); the core above it never depends on Tauri.
tauri = ["dep:tauri"]

[dependencies]
tauri = { workspace = true, optional = true }
