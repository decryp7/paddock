# The pinned Chromium (Chrome for Testing, Google's builds of Chrome meant for automation) every app may download. One
# entry per platform with the archive's URL, size and SHA-256; paddock-runtime refuses anything that does not match.
# The URLs are versioned and do not change. Chrome for Testing publishes no hashes: the SHA-256 values are computed from
# the downloaded archives (taken from Spotter's reviewed pin), the sizes from the host's Content-Length. Review the diff
# and the version before committing a new pin. Keys: <windows|macos|linux>-<x86_64|aarch64>.

