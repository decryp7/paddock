[package]
name = "paddock-testkit"
version = "0.1.0"
description = "Rust test kit for the Paddock apps (a dev-dependency): scratch folders with a leftover check, a process-wide environment lock with an in-process hermetic environment, golden files with an update variable, a fake OS command runner, a never-panics helper and the deterministic clock."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["decryp7"]

[dependencies]
paddock-jobs = { workspace = true }
tempfile = "3"
paddock-workspace-hack = { version = "0.1", path = "../paddock-workspace-hack" }
