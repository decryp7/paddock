[package]
name = "paddock-testkit"
version = "0.1.0"
description = "Rust test kit for the Paddock apps (a dev-dependency): scratch folders with a leftover check, a process-wide environment lock with an in-process hermetic environment, golden files with an update variable, a fake OS command runner, a never-panics helper, a held loopback port, the deterministic clock, bounded waits on a condition (wait_until, wait_for, poll_for, retry_within), programs a test writes and starts without the ETXTBSY race (exe) and the boot-volume temp folder for programs started as their own responsible process."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["decryp7"]

[lib]
doctest = false # doctests are off (crates/README.md, "Doctests")

[dependencies]
paddock-env = { workspace = true }
paddock-jobs = { workspace = true, features = ["test-support"] }
paddock-limits = { workspace = true }
tempfile = "3"
# `net::HeldPort::reset`: SO_LINGER 0 on an accepted connection.
socket2 = "0.6"
paddock-workspace-hack = { version = "0.1", path = "../paddock-workspace-hack" }

# `Scratch` makes its folders in the caller's effective group (getegid).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# `tests/it/process.rs`: a child that resolves its folders the way sccache does (Windows: `SHGetKnownFolderPath`); already in the
# lockfile through tauri.
[dev-dependencies]
dirs = "7"

[package.metadata.paddock]
# The files this crate's tests read that the test cache's reads extractor cannot resolve (ADR 0116 §2, user decision 122). The one blind
# site is `src/bin/paddock-stand-in.rs`: the stand-in prints (`{cwd}`) or compares (`cwd_ends`) the working folder a test started it in,
# and reads no repository file. What its tests read from the repository (`conformance/ci/boot-volume.sh`) is a resolved literal chain.
test-reads = []
