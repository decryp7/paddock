[package]
name = "paddock-testkit"
version = "0.1.0"
description = "Rust test kit for the Paddock apps (a dev-dependency): scratch folders with a leftover check, a process-wide environment lock with an in-process hermetic environment, golden files with an update variable, a fake OS command runner, a never-panics helper, a held loopback port, the deterministic clock, bounded waits on a condition (wait_until, wait_for, poll_for, retry_within) and the boot-volume temp folder for programs started as their own responsible process."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["decryp7"]

[dependencies]
paddock-jobs = { workspace = true }
paddock-limits = { workspace = true }
tempfile = "3"
# `net::HeldPort::reset`: SO_LINGER 0 on an accepted connection.
socket2 = "0.6"
# `start` (ADR 0071): the wait for a started program drives the product's start judge.
paddock-proc = { workspace = true, optional = true }
paddock-workspace-hack = { version = "0.1", path = "../paddock-workspace-hack" }

[target.'cfg(unix)'.dev-dependencies]
# The scripted child of `start`'s tests stops itself with SIGSTOP (no signal to a pid from the test, rule 53).
libc = "0.2"

[features]
# `start`: wait_ready_or_exit, wait_exit and warm_first_start (ADR 0071 section 1). Off by default: it adds paddock-proc.
start = ["dep:paddock-proc"]
