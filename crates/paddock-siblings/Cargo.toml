[package]
name = "paddock-siblings"
version = "0.1.0"
description = "Hand-off between the Paddock apps: find an installed family app, open it with a typed hand-off (files to import, an item to show) on its command line, refuse unknown apps and requests the app does not accept, and parse what arrives."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["decryp7"]

[features]
default = ["native"]
# The real process start (`ProcessSpawner`, `Siblings::native`); tests and apps with their own spawner turn it off.
native = []
# `paddock_siblings::testing`: a file system and a spawner that start nothing.
testing = []

[dependencies]
paddock-env = { workspace = true }
paddock-proc = { workspace = true }
paddock-window = { workspace = true }
serde = { version = "1", features = ["derive"] }
log = { version = "0.4", features = ["kv"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
# The doctest uses the fakes.
paddock-siblings = { path = ".", features = ["testing"] }
