[package]
name = "paddock-build"
version = "0.1.0"
description = "The Tauri build step of the Paddock apps (a build-dependency): the Windows application manifest embedded into every binary, empty placeholders for the sidecars Tauri's externalBin requires, rerun triggers, then tauri-build."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["decryp7"]

[lib]
doctest = false # doctests are off (crates/README.md, "Doctests")

[features]
# `Build::run` calls tauri-build; the pure core (directives, placeholders, the manifest) never depends on it.
tauri-build = ["dep:tauri-build"]

[dependencies]
tauri-build = { version = "2.7", optional = true }
serde_json = "1"
# `cargo_layout`: the profile folder above `OUT_DIR` in both of cargo's build-folder layouts.
paddock-env = { path = "../paddock-env", version = "0.1.0", registry = "decryp7" }
paddock-workspace-hack = { version = "0.1", path = "../paddock-workspace-hack" }

[dev-dependencies]
tempfile = "3"

[package.metadata.paddock]
# What this crate's tests read that the test cache's reads extractor cannot resolve (ADR 0116 §2, user decision 122), as globs from the
# repository root; `[]` says the blind reads touch no repository file.
# The tests give the library `CARGO_MANIFEST_DIR` as a value of an injected environment and use folders they make.
test-reads = []
