[package]
name = "paddock-watch"
version = "0.1.0"
description = "Folder watching for the Paddock apps: a debounce on the shared Clock (quiet time plus a longest wait), the ChangeSource port with a notify adapter, a watcher thread, and Debrief's settle rule (a file is ready when its size and time stopped changing) with batching and a bounded folder scan."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["decryp7"]

[lib]
doctest = false # doctests are off (crates/README.md, "Doctests")

[features]
# Test support (rule 99): the test-only hooks and fakes (`FakeSource`). Enabled from `[dev-dependencies]` only, never in
# a shipped build (`./dev check test-features`, C170).
test-support = []
# The real-folder adapter over the `notify` crate (`paddock_watch::NotifySource`); its calls live in `src/native.rs`, which
# the coverage job leaves out.
notify = ["dep:notify"]

[dependencies]
log = "0.4"
paddock-jobs = { workspace = true }
paddock-workspace-hack = { version = "0.1", path = "../paddock-workspace-hack" }
notify = { version = "8", optional = true, default-features = false, features = ["macos_fsevent"] }

[dev-dependencies]
# The self dev-dependency that turns `test-support` on for this package's own integration tests (rule 99).
paddock-watch = { path = ".", features = ["test-support"] }
paddock-jobs = { workspace = true, features = ["test-support"] }
# The bounded retry of the real-folder test (`wait::retry_within`) and the hang guard of the rescan tests (`wait::HANG_GUARD`).
paddock-testkit = { workspace = true }
tempfile = "3"
