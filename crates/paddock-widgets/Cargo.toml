[package]
name = "paddock-widgets"
version = "0.1.0"
description = "Widget layouts for the Paddock apps: a closed catalogue per app and surface, placements with limits, versioned lenient reading, edits as pure commands with one level of undo, and the widget state envelope (ADR 0035)."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["decryp7"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# The wire types' TypeScript (`ui/projects/paddock-ui/widgets/generated/widgets.ts`); `Widget` and its kinds are `TS` too.
ts-rs = "11.1"
paddock-workspace-hack = { version = "0.1", path = "../paddock-workspace-hack" }

[dev-dependencies]
# `testing::sync_generated`, the stale-file check of the generated TypeScript.
paddock-commands = { workspace = true }
proptest = "1"
