[package]
name = "paddock-panels"
version = "0.1.0"
description = "Pop-out panel windows for the Paddock apps: validated panel ids, placement on any display clamped to its work area, remembered bounds per view, the drag ghost, and UI-state forwarding between a host window and its pop-outs and dialogs."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = ["decryp7"]

[features]
# The Tauri adapter (`paddock_panels::tauri`); the core above it never depends on Tauri.
tauri = ["dep:tauri", "paddock-commands/tauri", "paddock-dialogs/tauri", "dep:windows", "dep:objc2-app-kit"]
# For other crates' tests on Tauri's mock runtime: pop-outs are not owned by a native window. Never in an app.
mock-runtime = ["tauri"]

[dependencies]
paddock-commands = { workspace = true }
paddock-dialogs = { workspace = true }
paddock-env = { workspace = true }
paddock-window = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = { version = "0.4", features = ["kv"] }
percent-encoding = "2"
tauri = { workspace = true, optional = true }
paddock-workspace-hack = { version = "0.1", path = "../paddock-workspace-hack" }

[target.'cfg(windows)'.dependencies]
# The drag ghost is shown without taking the focus, and the primary mouse button is read outside any webview.
windows = { version = "0.62", optional = true, features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The primary mouse button outside any webview (NSEvent.pressedMouseButtons).
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent"], optional = true }

[dev-dependencies]
# The adapter is tested on Tauri's mock runtime: no window ever reaches the desktop.
tauri = { workspace = true, features = ["test"] }
# Builds monitors for the placement on the mock runtime.
tauri-runtime = "2.12"
paddock-commands = { workspace = true, features = ["tauri"] }
tempfile = "3"
# The wire types' TypeScript (`ui/projects/paddock-ui/workbench/panels/generated/panels.ts`), generated by a unit test.
ts-rs = "11.1"
