paddock-jobs = { path = "paddock-jobs", version = "0.2.0", registry = "decryp7" }
paddock-limits = { path = "paddock-limits", version = "0.1.0", registry = "decryp7" }
paddock-log = { path = "paddock-log", version = "0.1.0", registry = "decryp7" }
