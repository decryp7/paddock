# Workspace root for Paddock's shared Rust crates: `paddock-jobs` (ADR 0008) and the app shell crates (ADR 0012, plan
# docs/plans/workbench.md). Every crate has a pure core and a `tauri` feature for its adapter; all are published to the
# Gitea cargo registry `decryp7` (crates/.cargo/config.toml) by the tag workflow only (.gitea/workflows/publish.yml).
[workspace]
resolver = "3"
# Fuzz targets are their own workspaces (cargo-fuzz).
exclude = ["paddock-ipc/fuzz"]
members = [
    "paddock-channels",
    "paddock-commands",
    "paddock-dialogs",
    "paddock-diag",
    "paddock-download",
    "paddock-env",
    "paddock-health",
    "paddock-ipc",
    "paddock-jobs",
    "paddock-log",
    "paddock-menu",
    "paddock-names",
    "paddock-packs",
    "paddock-pitwall",
    "paddock-proc",
    "paddock-secrets",
    "paddock-service",
    "paddock-settings",
    "paddock-shell",
    "paddock-startup",
    "paddock-testkit",
    "paddock-updater",
    "paddock-window",
    "paddock-workspace-hack",
]

# cargo-machete (CI: `cargo machete`) reports dependencies no code uses. A false report (a dependency used only through a
# macro or for its features) goes into `ignored`, here for every crate or in the crate's own
# `[package.metadata.cargo-machete]`, with a comment saying why.
[workspace.metadata.cargo-machete]
# cargo-hakari's crate: depended on for its features, never named in code.
ignored = ["paddock-workspace-hack"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://dev.decryptology.net/decryp7/paddock"

[workspace.dependencies]
# Library crates take Tauri without its default runtime (wry) and features; the app enables those.
tauri = { version = "2.12", default-features = false }

# The workspace's own crates, for one crate depending on another: `paddock-jobs = { workspace = true }`. The version is
# the one published to the `decryp7` registry (keep it equal to the crate's `version`); the path is used in the workspace.
paddock-channels = { path = "paddock-channels", version = "0.1.0", registry = "decryp7" }
paddock-commands = { path = "paddock-commands", version = "0.1.0", registry = "decryp7" }
paddock-dialogs = { path = "paddock-dialogs", version = "0.1.0", registry = "decryp7" }
paddock-diag = { path = "paddock-diag", version = "0.1.0", registry = "decryp7" }
paddock-download = { path = "paddock-download", version = "0.1.0", registry = "decryp7" }
paddock-env = { path = "paddock-env", version = "0.1.0", registry = "decryp7" }
paddock-health = { path = "paddock-health", version = "0.1.0", registry = "decryp7" }
paddock-ipc = { path = "paddock-ipc", version = "0.1.0", registry = "decryp7" }
paddock-jobs = { path = "paddock-jobs", version = "0.1.0", registry = "decryp7" }
paddock-log = { path = "paddock-log", version = "0.1.0", registry = "decryp7" }
paddock-names = { path = "paddock-names", version = "0.1.0", registry = "decryp7" }
paddock-menu = { path = "paddock-menu", version = "0.1.0", registry = "decryp7" }
paddock-packs = { path = "paddock-packs", version = "0.1.0", registry = "decryp7" }
paddock-pitwall = { path = "paddock-pitwall", version = "0.1.0", registry = "decryp7" }
paddock-proc = { path = "paddock-proc", version = "0.1.0", registry = "decryp7" }
paddock-secrets = { path = "paddock-secrets", version = "0.1.0", registry = "decryp7" }
paddock-service = { path = "paddock-service", version = "0.1.0", registry = "decryp7" }
paddock-settings = { path = "paddock-settings", version = "0.1.0", registry = "decryp7" }
paddock-shell = { path = "paddock-shell", version = "0.2.0", registry = "decryp7" }
paddock-startup = { path = "paddock-startup", version = "0.1.0", registry = "decryp7" }
paddock-testkit = { path = "paddock-testkit", version = "0.1.0", registry = "decryp7" }
paddock-updater = { path = "paddock-updater", version = "0.1.0", registry = "decryp7" }
paddock-window = { path = "paddock-window", version = "0.1.0", registry = "decryp7" }

# Debug info for development and test builds (docs/dev-setup.md, "Build profiles"): line tables are enough for backtraces
# with file and line, and dependencies get none, which makes the objects smaller and linking faster. A debugger session
# that needs variables sets `CARGO_PROFILE_DEV_DEBUG=full` for that build. split-debuginfo stays at each platform's
# default (macOS already keeps it out of the binaries; Windows supports only `packed`).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

