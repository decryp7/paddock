# Workspace root for Paddock's shared Rust crates: `paddock-jobs` (ADR 0008) and the app shell crates (ADR 0012, plan
# docs/plans/workbench.md). Every crate has a pure core and a `tauri` feature for its adapter; all are published to the
# Gitea cargo registry `decryp7` (the root .cargo/config.toml) by the tag workflow only (.gitea/workflows/publish.yml).
[workspace]
resolver = "3"
# Fuzz targets are their own workspaces (cargo-fuzz).
exclude = ["paddock-ipc/fuzz", "paddock-plugin-package/fuzz", "paddock-testplan/fuzz", "paddock-view/fuzz"]
members = [
    "cargo-paddock-plugin",
    "paddock-archive",
    "paddock-assistant",
    "paddock-bench",
    "paddock-cli",
    "paddock-build",
    "paddock-channels",
    "paddock-chromium",
    "paddock-commands",
    "paddock-dialogs",
    "paddock-diag",
    "paddock-download",
    "paddock-env",
    "paddock-guard",
    "paddock-files",
    "paddock-health",
    "paddock-ipc",
    "paddock-jobs",
    "paddock-limits",
    "paddock-log",
    "paddock-mcp",
    "paddock-live",
    "paddock-menu",
    "paddock-metrics",
    "paddock-names",
    "paddock-net",
    "paddock-packs",
    "paddock-panels",
    "paddock-pitwall",
    "paddock-plugin-api",
    "paddock-plugin-host",
    "paddock-plugin-package",
    "paddock-plugin-test",
    "paddock-power",
    "paddock-proc",
    "paddock-repo-files",
    "paddock-repo-graph",
    "paddock-runtime",
    "paddock-secrets",
    "paddock-service",
    "paddock-setup",
    "paddock-settings",
    "paddock-shell",
    "paddock-storage",
    "paddock-siblings",
    "paddock-slots",
    "paddock-startup",
    "paddock-testkit",
    "paddock-testplan",
    "paddock-updater",
    "paddock-view",
    "paddock-watch",
    "paddock-widgets",
    "paddock-window",
    "paddock-workbench",
    "paddock-workspace-hack",
]

# cargo-machete (CI: `cargo machete`) reports dependencies no code uses. A false report (a dependency used only through a
# macro or for its features) goes into `ignored`, here for every crate or in the crate's own
# `[package.metadata.cargo-machete]`, with a comment saying why.
[workspace.metadata.cargo-machete]
# cargo-hakari's crate: depended on for its features, never named in code.
ignored = ["paddock-workspace-hack"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://dev.decryptology.net/decryp7/paddock"

[workspace.dependencies]
# Library crates take Tauri without its default runtime (wry) and features; the app enables those.
tauri = { version = "2.12", default-features = false }

# The workspace's own crates, for one crate depending on another: `paddock-jobs = { workspace = true }`. The version is
# the one published to the `decryp7` registry (keep it equal to the crate's `version`); the path is used in the workspace.
cargo-paddock-plugin = { path = "cargo-paddock-plugin", version = "0.1.0", registry = "decryp7" }
paddock-archive = { path = "paddock-archive", version = "0.1.0", registry = "decryp7" }
paddock-assistant = { path = "paddock-assistant", version = "0.1.0", registry = "decryp7" }
paddock-bench = { path = "paddock-bench", version = "0.1.0", registry = "decryp7" }
paddock-cli = { path = "paddock-cli", version = "0.1.0", registry = "decryp7" }
paddock-build = { path = "paddock-build", version = "0.1.0", registry = "decryp7" }
paddock-channels = { path = "paddock-channels", version = "0.1.0", registry = "decryp7" }
paddock-chromium = { path = "paddock-chromium", version = "0.1.0", registry = "decryp7" }
paddock-commands = { path = "paddock-commands", version = "0.2.0", registry = "decryp7" }
paddock-dialogs = { path = "paddock-dialogs", version = "0.2.0", registry = "decryp7" }
paddock-diag = { path = "paddock-diag", version = "0.1.0", registry = "decryp7" }
# No default features: only the members that run a download over the real network enable `http` (ureq and rustls) themselves,
# so `paddock-net` with `default-features = false` and the crates that only classify addresses do not compile a TLS stack.
paddock-download = { path = "paddock-download", version = "0.2.0", registry = "decryp7", default-features = false }
