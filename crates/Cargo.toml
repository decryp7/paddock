# Debug info for development and test builds (docs/dev-setup.md, "Build profiles"): line tables are enough for backtraces
# with file and line, and dependencies get none, which makes the objects smaller and linking faster. A debugger session
# that needs variables sets `CARGO_PROFILE_DEV_DEBUG=full` for that build. split-debuginfo stays at each platform's
# default (macOS already keeps it out of the binaries; Windows supports only `packed`).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The hashing, signature and deflate code of the plugin package runs in the tests of every crate that installs a plugin
# (the 10 MB fixture program is hashed, deflated and verified several times per install). Unoptimised it takes seconds per
# install and minutes under load (a macOS CI test hit nextest's 60 s limit); optimised it takes milliseconds. Only these
# dependencies are optimised, the workspace's own code stays at opt-level 0 (paddock-plugin-package's tests/it/dev_profile.rs).
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.ed25519-compact]
opt-level = 3

[profile.dev.package.zlib-rs]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3

# The crash model (paddock-service tests/it/model.rs) explores five configurations of about 30 000 to 90 000 states each, and
# unoptimised one took 42 to 52 s of the ci profile's 60 s limit. Only this package is optimised (debug assertions stay on);
# nextest and llvm-cov build with the dev profile, so the override reaches the ci runs too.
[profile.dev.package.paddock-service]
opt-level = 3
