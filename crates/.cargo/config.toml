# The Gitea cargo registry the shared crates are published to (`publish = ["decryp7"]`). Publishing happens only in the
# tag workflow (.gitea/workflows/publish.yml) with a token from CI secrets; `scripts/publish.mjs` without `--publish` is the
# local dry run.
[registries.decryp7]
index = "sparse+https://dev.decryptology.net/api/packages/decryp7/cargo/"
