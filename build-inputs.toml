# Build inputs (ADR 0062): every file a build, test or release step needs from outside this repository, pinned by size and
# SHA-256 and served from the private store (the Gitea organisation `paddock-build-inputs`, generic packages at
# /api/packages/<org>/generic/<package>/<version>/<file>). A `url` is provenance only: no step fetches it; only a person
# (or the mirror workflow) contacts a publisher, once per version, and uploads the verified file.
#
# Interim file of ADR 0062 WP-1: it holds the Tauri bundler helpers. WP-2 completes it with every other input and the
# parser shared with paddock-runtime's catalogue; conformance/ci/build-inputs-reader.mjs (the interim reader, registered in
# docs/known-copies.toml) reads the subset below line by line and WP-3's `./dev inputs` replaces it.
#
# Entry keys: id, kind, version, source, licence (SPDX), ships (bytes end up inside an installer, so notices list it),
# redistribute (false: never in a Gitea package), package, file (the name in the store), release_path, used_by,
# tied_to (a lockfile package whose version decides the entry; "<npm package>@<version>").
# Platform keys: key (linux-x86_64, windows-x86_64, ...), url, size, sha256, and `checked` (how the pin was first taken).

format = 1

