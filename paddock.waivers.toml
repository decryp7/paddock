# Waivers for Paddock's own conformance run (see .gitea/workflows/ci.yml, job "conformance"). Each one expires.

[[waiver]]
check = "C15"
path = "ui/projects/paddock-e2e/src/*"
reason = "the unit tests of the installed-Chrome guard must name the installed Chrome (channel and paths) to prove it is refused"
expires = "2027-04-30"

# Findings in the imported apps (ADR 0014). Paddock's self-check is strict for its own shared code; the apps' gaps are
# each app's follow-up work, dated so they cannot be forgotten.
[[waiver]]
check = "C36"
path = "apps/*"
reason = "parser crates of the imported apps without a fuzz target or never-panics test (Debrief 7, Dyno 4, Pitcrew 2, Pitwall 3, Spotter 1); each app adds its never-panics tests as a follow-up"
expires = "2026-12-31"

[[waiver]]
check = "C37"
path = "apps/dyno/*"
reason = "Dyno's integration tests are still one binary per file (pre-monorepo); moving them into tests/it is a follow-up (Debrief's perf/test-speed shows how)"
expires = "2026-12-31"

[[waiver]]
check = "C37"
path = "apps/spotter/*"
reason = "Spotter's integration tests are still one binary per file (pre-monorepo); moving them into tests/it is a follow-up"
expires = "2026-12-31"

# C39 (ADR 0023): the apps' ports read off dropped listeners, one waiver per file so a new one in an app is still caught.
[[waiver]]
check = "C39"
path = "apps/spotter/crates/spotter-sources/tests/http_sources.rs"
reason = "Spotter: an unreachable-source test on a freed port; to use HeldPort::reset"
expires = "2026-12-31"

