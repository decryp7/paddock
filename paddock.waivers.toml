# C54 (rule 52): Dyno's lowered threads still use the starvable levels (macOS QoS BACKGROUND, Windows background mode);
# whether anything waits on them (the disk-map scan calls background_current_thread) is being checked separately.
[[waiver]]
check = "C54"
path = "apps/dyno/crates/dyno-platform/src/priority.rs"
reason = "Dyno: background_current_thread() uses QOS_CLASS_BACKGROUND and THREAD_MODE_BACKGROUND_BEGIN; to move to the gentle levels or carry inline background-qos waivers once it is known that nothing waits on those threads"
expires = "2026-12-31"

# C54 (rule 52), service level: launchd ProcessType Background / LowPriorityIO and systemd IOSchedulingClass=idle. The
# shared renderer applies them to every Background or low_priority() service; the fix is ADR 0020's priority helper
# deciding per class (a service someone waits on renders at User), not a per-app patch. Each file is waived separately so
# a new use is still caught. Golden files under tests/ are not checked for service settings.
[[waiver]]
check = "C54"
path = "crates/paddock-service/src/render.rs"
reason = "paddock-service: renders LowPriorityIO and IOSchedulingClass=idle for every low_priority() service; to follow ADR 0020's priority helper (the class decides the level)"
expires = "2026-12-31"

[[waiver]]
check = "C54"
path = "crates/paddock-service/src/golden.rs"
reason = "paddock-service: the golden specs request ProcessType::Background as the apps do today; changes with the renderer (ADR 0020 helper)"
expires = "2026-12-31"

[[waiver]]
check = "C54"
path = "apps/debrief/crates/debrief-agent/src/service/launchd.rs"
reason = "Debrief: the headless diagnostics agent's daemon plist is ProcessType Background. Scheduled collection is work nobody waits on, but a person may wait for a triggered capture, so this is a known violation of rule 52"
owner = "debrief"
follow_up = "Debrief 1.2: render the agent's plist at Standard (or Adaptive with an XPC trigger) and keep Background only for scheduled collection, through the ADR 0020 priority helper; delete this waiver then"
expires = "2026-12-31"

