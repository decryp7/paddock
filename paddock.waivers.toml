# ADR 0033: kills by a bare pid in the apps and tools, each a dated follow-up (the shared crates go through paddock_proc).
[[waiver]]
check = "C53"
path = "apps/debrief/crates/chromium-driver/src/launch.rs"
reason = "Debrief WP-5: the watchdog killpg()s a pid captured at launch after is_running() may have reaped the browser; move to paddock-chromium or paddock_proc::Supervised"
expires = "2026-12-31"

[[waiver]]
check = "C53"
path = "apps/debrief/crates/chromium-driver/src/process.rs"
reason = "Debrief WP-5: killpg and taskkill /T after try_wait may have reaped the leader; replace with paddock_proc::Supervised"
expires = "2026-12-31"

[[waiver]]
check = "C53"
path = "apps/debrief/crates/debrief-ai-worker/src/child.rs"
reason = "Debrief WP-5: the atexit reaper SIGKILLs registered pids that try_wait already reaped; register ProcessIds"
expires = "2026-12-31"

[[waiver]]
check = "C53"
path = "apps/debrief/crates/debrief-collect/src/runner.rs"
reason = "Debrief WP-5 (test): kills a grandchild by the pid it printed; use paddock_proc::end with a ProcessId"
expires = "2026-12-31"

[[waiver]]
check = "C53"
path = "apps/debrief/crates/debrief-ipc/src/process.rs"
reason = "Debrief WP-5: OsChild::kill_group killpg()s after try_wait may have reaped the leader; kill through a ProcessId"
expires = "2026-12-31"

[[waiver]]
check = "C53"
path = "apps/debrief/crates/debrief-plugin-windows/src/command.rs"
reason = "Debrief WP-5 (test): kills a grandchild by the pid it printed; use paddock_proc::end with a ProcessId"
expires = "2026-12-31"

[[waiver]]
