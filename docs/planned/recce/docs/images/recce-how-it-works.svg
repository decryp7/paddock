<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="t d">
<title id="t">How Recce works</title><desc id="d">Index, then Search, then Answer, then Serve over MCP. Pitwall runs the local model for answers; Pacenotes shares the document readers.</desc>
<style>
:root{--ink:#14161A;--muted:#566070;--card:#FFFFFF;--line:#DDE1E8;--soft:#F1F3F7;--bar:#ECEEF2;--link:#8A93A3;--codebg:#F7F8FA;--acc:#0B7A55;--acct:#0B7A55;--accf:#0B7A55;--glow:.20;--shadow:.22;--wbg:#FFFFFF}
@media (prefers-color-scheme: dark){:root{--ink:#F2F4F7;--muted:#A6AEBC;--card:#171A20;--line:#2B303A;--soft:#1B1E24;--bar:#20242C;--link:#667085;--codebg:#12151A;--acc:#57D3A6;--acct:#57D3A6;--glow:.26;--shadow:.55;--wbg:#0E0F12}}
text{font-family:-apple-system,"SF Pro Display","SF Pro Text","Segoe UI Variable Display","Segoe UI",Cantarell,"Noto Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums;fill:var(--ink)}
.lt{display:inline}.dk{display:none}
@media (prefers-color-scheme: dark){.lt{display:none}.dk{display:inline}}
.eyebrow{font-size:15px;font-weight:600;letter-spacing:.14em;fill:var(--acct)}
.h1{font-size:56px;font-weight:600;letter-spacing:-.025em}
.h2{font-size:42px;font-weight:600;letter-spacing:-.02em}
.sub{font-size:22px;fill:var(--muted)}
.small{font-size:20px;fill:var(--muted)}
.pilltxt{font-size:17px;font-weight:600;fill:var(--acct)}
.name{font-size:26px;font-weight:600;letter-spacing:-.01em}
.card{fill:var(--card);stroke:var(--line)}
.ph{fill:var(--soft);stroke:var(--link);stroke-width:1.5;stroke-dasharray:5 4}
.mono{font-weight:600;fill:var(--muted)}
.track{fill:none;stroke:var(--line);stroke-width:1.25;opacity:.8}
.gl{fill:none;stroke:var(--acct);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.accfill{fill:var(--acc);fill-opacity:.13}.accline{fill:var(--acc)}
.ptitle{font-size:29px;font-weight:600;letter-spacing:-.01em}
.pbody{font-size:21px;fill:var(--muted)}
.stepn{font-size:16px;font-weight:600;letter-spacing:.1em;fill:var(--muted)}
.stept{font-size:26px;font-weight:600}
.steps{font-size:21px;fill:var(--muted)}
.conn{fill:none;stroke:var(--link);stroke-width:1.5;stroke-linecap:round;stroke-dasharray:1 7}
.chev{fill:none;stroke:var(--link);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wtit{font-size:17px;font-weight:600;letter-spacing:.14em;fill:var(--muted)}
.wname{font-size:22px;font-weight:600}.wnote{font-size:20px;fill:var(--muted)}
.wbar{fill:var(--bar)}.wedge{fill:none;stroke:var(--line)}
.mbg{fill:var(--soft)}.mc{fill:var(--card);stroke:var(--line)}.mside{fill:var(--bar)}.mrule{fill:var(--line)}.ms{fill:var(--line)}
.mfield{fill:var(--soft);stroke:var(--line)}.mact{fill:var(--acc);fill-opacity:.14}.maccf{fill:var(--accf)}.mbox{fill:var(--acc);fill-opacity:.12;stroke:var(--acc);stroke-width:2}
.mt{font-size:14px;font-weight:500;fill:var(--ink)}.mm{font-size:13px;fill:var(--muted)}.mta{font-size:13px;font-weight:600;fill:var(--acct)}.mtw{font-size:12.5px;font-weight:600;fill:#fff}.mh{font-size:20px;font-weight:600;fill:var(--ink)}
.medge{fill:none;stroke:var(--link);stroke-width:1.5}.mcode{fill:var(--codebg);stroke:var(--line)}.mmono{font:13px ui-monospace,"SF Mono",Menlo,Consolas,monospace;fill:var(--ink)}.mmonoa{font:600 13px ui-monospace,"SF Mono",Menlo,Consolas,monospace;fill:var(--acct)}
.madd{fill:#2EA043;fill-opacity:.18}.mdel{fill:#F85149;fill-opacity:.16}.mrec{fill:#E5484D}.mcon{fill:var(--card);stroke:var(--acc);stroke-width:2}
.mline{fill:none;stroke:var(--acc);stroke-width:2;stroke-linejoin:round}.mfill{fill:var(--acc);fill-opacity:.10}.mband{fill:var(--acc);fill-opacity:.22}
.mring{fill:none;stroke:var(--muted);stroke-width:1.5}.mring2{fill:var(--muted);fill-opacity:.45}.mbig{font-size:28px;font-weight:600;fill:var(--ink)}.mt2{font-size:18px;font-weight:600;fill:var(--ink)}
</style><rect class="ph" x="81" y="41" width="38" height="38" rx="9"/><text class="mono" x="100" y="66.8" text-anchor="middle" style="font-size:20px">R</text><text class="name" x="132" y="68" style="font-size:28px">How Recce works</text>
<circle class="accfill" cx="260" cy="188" r="44"/><g class="gl" transform="translate(242 170) scale(1.5)"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 12.5l9 5 9-5M3 17l9 5 9-5"/></g><path class="conn" d="M318 188 L554 188"/><path class="chev" d="M548 182 l7 6 -7 6"/><text class="stepn" x="260" y="272" text-anchor="middle">STEP 1</text><text class="stept" x="260" y="302" text-anchor="middle">Index</text><text class="steps" x="260" y="330" text-anchor="middle">Names, content and</text><text class="steps" x="260" y="358" text-anchor="middle">meaning, on your PC.</text>
<circle class="accfill" cx="620" cy="188" r="44"/><g class="gl" transform="translate(602 170) scale(1.5)"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></g><path class="conn" d="M678 188 L914 188"/><path class="chev" d="M908 182 l7 6 -7 6"/><text class="stepn" x="620" y="272" text-anchor="middle">STEP 2</text><text class="stept" x="620" y="302" text-anchor="middle">Search</text><text class="steps" x="620" y="330" text-anchor="middle">One box, as you type.</text>
<circle class="accfill" cx="980" cy="188" r="44"/><g class="gl" transform="translate(962 170) scale(1.5)"><path d="M4 5h16v11H9l-5 4z"/></g><path class="conn" d="M1038 188 L1274 188"/><path class="chev" d="M1268 182 l7 6 -7 6"/><text class="stepn" x="980" y="272" text-anchor="middle">STEP 3</text><text class="stept" x="980" y="302" text-anchor="middle">Answer</text><text class="steps" x="980" y="330" text-anchor="middle">A local model, with cited</text><text class="steps" x="980" y="358" text-anchor="middle">sources.</text>
<circle class="accfill" cx="1340" cy="188" r="44"/><g class="gl" transform="translate(1322 170) scale(1.5)"><rect x="4" y="4" width="16" height="6" rx="2"/><rect x="4" y="14" width="16" height="6" rx="2"/><path d="M8 7h.01M8 17h.01"/></g><text class="stepn" x="1340" y="272" text-anchor="middle">STEP 4</text><text class="stept" x="1340" y="302" text-anchor="middle">Serve over MCP</text><text class="steps" x="1340" y="330" text-anchor="middle">Later: local AI gets the</text><text class="steps" x="1340" y="358" text-anchor="middle">same view.</text>
<line x1="80" x2="1520" y1="434" y2="434" stroke="var(--line)"/>
<text class="small" x="80" y="472">Pitwall runs the local model for answers; Pacenotes shares the document readers.</text>
</svg>