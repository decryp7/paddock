# The endpoint register (ADR 0072 §5, check C102): every place in non-test code that listens or accepts. `./dev check
# ipc-endpoints` scans the Rust sources (a `syn` pass over everything outside tests/, benches/, examples/ and #[cfg(test)]
# items) and fails when a listen site is in neither section, when an entry no longer matches its file, or when the ending
# test it names does not exist.
#
# [[endpoint]]   id           the name the ending test and the ratchet use (several files may share one id and one test)
#                file         the file with the listen sites
#                calls        the primitives found there (the ids of tools/paddock-dev/src/ipc_endpoints.rs PRIMITIVES)
#                sites        how many sites the file has; a new listen call in a registered file changes it and so is reviewed
#                ending_test  `path::function`: the test that drives this endpoint through the scenarios of
#                             `paddock_ipc::testing::endings` and compares with docs/ipc-endpoint-ratchet.toml
#                consumers    (free text) who reaches this site through a constructor
# [[out_of_scope]] path       a file, or `dir/**`; it must match at least one site (a stale entry fails)
#                reason, owner, and where it applies delete_by / adopt_by (a tag)
#
#                calls, sites   what the matching files hold, as for an endpoint (a new listen call in a waived file is still a
#                               listener and is looked at)
# [[not_applicable]] endpoint, scenario, reason (and `os`): see the section at the end.
#
# The ratchet (docs/ipc-endpoint-ratchet.toml) lists what fails today; this file never does.

[[endpoint]]
id = "ipc-host"
file = "crates/paddock-ipc/src/handshake.rs"
calls = ["paddock_ipc::endpoint::Listener::bind*"]
sites = 3
ending_test = "crates/paddock-ipc/tests/it/endings.rs::ipc_host_ends_every_connection_right_or_is_in_the_ratchet"
consumers = "Host::listen, listen_in and listen_at: paddock-ipc's launcher and link server, the Dyno agent, paddock-plugin-test"

[[endpoint]]
id = "ipc-host"
file = "crates/paddock-ipc/src/endpoint/mod.rs"
calls = ["paddock_ipc::endpoint::Listener::bind*"]
sites = 4
ending_test = "crates/paddock-ipc/tests/it/endings.rs::ipc_host_ends_every_connection_right_or_is_in_the_ratchet"
consumers = "the public Listener::bind, bind_in, bind_fixed and bind_system over the OS endpoint (below); the Dyno helper binds with bind_system"

[[endpoint]]
id = "ipc-host"
file = "crates/paddock-ipc/src/endpoint/unix.rs"
calls = ["std::os::unix::net::UnixListener::bind"]
sites = 2
ending_test = "crates/paddock-ipc/tests/it/endings.rs::ipc_host_ends_every_connection_right_or_is_in_the_ratchet"
consumers = "the Unix socket under every paddock-ipc Listener"

[[endpoint]]
id = "ipc-host"
file = "crates/paddock-ipc/src/endpoint/windows.rs"
calls = ["CreateNamedPipeW"]
sites = 1
ending_test = "crates/paddock-ipc/tests/it/endings.rs::ipc_host_ends_every_connection_right_or_is_in_the_ratchet"
consumers = "the named pipe under every paddock-ipc Listener (Windows)"

[[endpoint]]
id = "ipc-link-server"
file = "crates/paddock-ipc/src/link/server.rs"
calls = ["paddock_ipc::Host::listen*"]
sites = 3
ending_test = "crates/paddock-ipc/tests/it/endings.rs::ipc_link_server_ends_every_connection_right_or_is_in_the_ratchet"
consumers = "LinkServer::start: a companion process serving its link (Pitcrew's capped server model, ADR 0001)"

[[endpoint]]
id = "ipc-launcher"
file = "crates/paddock-ipc/src/launch.rs"
calls = ["paddock_ipc::Host::listen*"]
sites = 1
ending_test = "crates/paddock-ipc/tests/it/endings.rs::ipc_launcher_ends_every_connection_right_or_is_in_the_ratchet"
consumers = "launch(): paddock-plugin-host, Dyno's plugin host (dyno-plugin-host), Dyno's app link to its children"

[[endpoint]]
id = "dyno-agent"
file = "apps/dyno/crates/dyno-agent/src/wire.rs"
calls = ["paddock_ipc::Host::listen*"]
sites = 1
ending_test = "apps/dyno/crates/dyno-agent/tests/endings.rs::dyno_agent_ends_every_connection_right_or_is_in_the_ratchet"
consumers = "the Dyno agent's endpoint (the app and dyno-cli connect)"

[[endpoint]]
id = "dyno-helper"
file = "apps/dyno/crates/dyno-helper/src/serve.rs"
calls = ["paddock_ipc::endpoint::Listener::bind*"]
sites = 1
ending_test = "apps/dyno/crates/dyno-helper/src/server.rs::dyno_helper_ends_every_connection_right_or_is_in_the_ratchet"
consumers = "the Dyno helper service's system endpoint (raw connections, no handshake: ADR 0027)"

[[endpoint]]
id = "mcp-loopback"
file = "crates/paddock-mcp/src/listener.rs"
calls = ["paddock_mcp::serve_loopback", "std::net::TcpListener::bind"]
sites = 2
ending_test = "crates/paddock-mcp/tests/it/endings.rs::mcp_loopback_ends_every_connection_right_or_is_in_the_ratchet"
consumers = "paddock-shell and Dyno's app (the MCP listener, ADR 0007); the stdio bridge in dyno-cli is its client"

[[endpoint]]
id = "pitcrew-service"
file = "apps/pitcrew/crates/pitcrew-service/src/ipc.rs"
calls = ["tokio::net::UnixListener::bind", "tokio::net::windows::named_pipe::ServerOptions::create_with_security_attributes_raw"]
sites = 2
ending_test = "apps/pitcrew/crates/pitcrew-service/tests/endings.rs::pitcrew_service_ends_every_connection_right_or_is_in_the_ratchet"
consumers = "Pitcrew's app-service transport (ADR 0004): a hand-rolled copy of ipc-endpoint and ipc-frames-peer (ADR 0072 §9)"

