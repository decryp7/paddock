what = "Dyno's world-map data, built from Natural Earth by scripts/build-world-map.mjs"
manual = "the script reads a downloaded Natural Earth file, so a check would need the network"
regenerate = "node apps/dyno/scripts/build-world-map.mjs <natural-earth.geojson>"
paths = ["apps/dyno/scripts/build-world-map.mjs", "apps/dyno/app/src/app/features/map/world-map.data.ts"]
outputs = ["apps/dyno/app/src/app/features/map/world-map.data.ts"]
cost = "heavy"

[[generator]]
id = "per-machine-installer"
what = "The Windows per-machine installer include and its stop-image list, generated by paddock-service from each app's Tauri config"
check = ["cargo", "test", "-p", "paddock-service", "--lib", "per_machine"]
regenerate = "PADDOCK_WRITE_TS=1 cargo test -p paddock-service --lib per_machine   # in crates"
cwd = "crates"
paths = ["crates/paddock-service/**", "crates/paddock-setup/nsis/**", "apps/*/app/src-tauri/tauri*.conf.json", "apps/*/app/src-tauri/windows/**"]
outputs = ["apps/*/app/src-tauri/windows/paddock-per-machine*.nsh", "crates/paddock-setup/nsis/paddock-per-machine.nsh"]
cost = "heavy"
drift_marker = ["test result: FAILED"]

# ---- icons and drawings --------------------------------------------------------------------------------------------------

[[generator]]
id = "icons"
what = "the built family icons installed in the apps and the docs (icons/tools/install.mjs)"
check = ["node", "icons/tools/install.mjs", "--check"]
regenerate = "node icons/tools/install.mjs   # after `node icons/tools/build.mjs` when a design changed"
paths = ["icons/**", "apps/*/app/src-tauri/icons/**", "apps/*/app/public/**", "docs/images/src/icons/*", "apps/*/docs/images/*-icon.svg"]
outputs = ["apps/*/app/src-tauri/icons/**", "docs/images/src/icons/*", "apps/*/docs/images/*-icon.svg"]
cost = "fast"
requires = ["node_modules/.package-lock.json"]

