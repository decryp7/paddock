# ---- the conformance run and its baselines -----------------------------------------------------------------------------

[[generator]]
id = "conformance-line"
what = "every conformance check CI runs on the tree, the arguments read from ci.yml by `./dev ci conformance-args` (the one reader the push gate uses; ADR 0098 WP-2); includes the C71 baseline (it may only shrink)"
check = ["sh", "-c", "args=$(./dev ci conformance-args) || exit $?; exec node $args"]
regenerate = "none: fix the findings it prints; `node conformance/bin/paddock-timing-baseline.mjs --write` rewrites conformance/baselines/C71.json (shrink only)"
paths = ["**"]
outputs = ["conformance/baselines/*.json"]
cost = "heavy"
requires = [".gitea/workflows/ci.yml", "conformance/bin/paddock-conformance.mjs"]

