# The generator registry (ER-40: a generated or pinned file is regenerated by its tool, never edited by hand).
#
# One entry per family of generated or pinned files: how to check it, how to fix it, and which paths mark it. `./dev gen check`
# runs the checks whose paths a change touches (`--all` runs every one); `./dev merge check <merge-commit>` runs the ones a
# merge makes due, so an integrator's per-merge list of checks is this file. The conformance check C116 fails when a file
# that says it is generated (a header such as "Generated by ...", "@generated" or "Do not edit") or sits at a known generated
# path is not named by the `outputs` of any entry, so a new generated file cannot go unregistered.
#
# Schema (version 1). tools/paddock-dev/src/generators/registry.rs parses and validates it; a bad entry is listed, not skipped.
#   id          lower-case letters, digits and `-`; unique. For `--only` and the output.
#   what        one line: what is generated and what makes it stale.
#   check       the program and its arguments as an array (no shell unless the entry names `sh -c`). Exit status 0 = current.
#               It must change nothing in the tree.
#   regenerate  the command that fixes drift, as the text the error shows. `none: <what to do instead>` when no command can.
#   cwd         the folder both run in, relative to the repository root (default ".").
#   paths       globs (`*` and `?` stay in a folder, `**` crosses folders) of the inputs and outputs: a change to one makes the
#               check due. Lists, not the whole tree, unless the check is meant to run on every change.
#   outputs     globs of the files it writes: what C116 matches generated files against. May be empty for a check only.
#   cost        "fast" (a script over files; run four at a time) or "heavy" (a build, the network or a long tool; one at a time).
#   manual      instead of `check`: why there is no automatic check (needs the network, a download, a person). Such an entry never
#               runs and never fails; `gen check` names it with its regenerate command when its paths change, and C116 counts its
#               outputs as covered. Keep these few: each one is a known gap.
#   requires    files that must exist for the check to be possible on this tree (a script that is on another branch, an installed
#               tool folder). A missing one is NOT MEASURED ("not on this tree"), never a pass (ER-33).
#
# Comparable practice (ER-37): Nx and turborepo declare each task's inputs and outputs and run what a change touches; Bazel
# checks each generated file with a diff_test; `cargo hakari verify` and `cargo metadata --locked` are each one tool's own check.
# This registry takes the declared inputs and outputs, keeps each tool's own check as the command, and adds no cache.

version = 1

# ---- lockfiles and the workspace hack ----------------------------------------------------------------------------------

# One entry per Cargo workspace: `cargo metadata --locked` is the check CI's `--locked` builds make.
[[generator]]
id = "cargo-lock-crates"
what = "crates/Cargo.lock resolves with --locked (a manifest change, a duplicate key or a shared crate's new dependency leaves it stale)"
check = ["sh", "-c", "cargo metadata --locked --format-version 1 >/dev/null"]
regenerate = "cargo metadata --format-version 1 >/dev/null   # without --locked cargo rewrites Cargo.lock; commit it"
cwd = "crates"
paths = ["crates/Cargo.toml", "crates/**/Cargo.toml", "crates/Cargo.lock"]
outputs = ["crates/Cargo.lock"]
cost = "heavy"
drift_marker = ["needs to be updated", "duplicate key", "cannot update the lock file"]

