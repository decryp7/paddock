# The test-result cache (ADR 0116): a test target whose inputs did not change reuses its pass. Read by one accessor,
# tools/paddock-dev/src/test_cache/config.rs (ER-42). Review date 2026-12-26 (ER-41): delete the cache if it has caught nothing real.

# Bumping this invalidates every record, in every store: the "clean cache" of Bazel's documentation, as reviewed data (§2).
epoch = 1

# The nightly is the net for a key that misses an input (§6). While it is paused, a record older than `max_age_hours` is refused
# (decision D7); set this to false when the nightly runs again.
nightly_paused = true
max_age_hours = 48

# The nextest profile a target's tests run with. It is part of the key (a different profile is a different test run).
profile = "ci"

# Targets that are never cached, by model node id (ADR 0116 §3, the `noTestCache` list). An entry makes CI stricter: adding one
# needs no approval; removing one is a weakening and needs the user's approval in the change (ER-46 read in its own direction;
# `test_cache::config::removed` compares this list with the merge base's).
no_test_cache = []

# The switch (ER-41): reuse is report-only (shadow) until the first two green train runs with zero soundness findings are recorded
# here by run id. In shadow mode every target still runs, and a target whose key matched a record and then failed is a soundness
# finding that blocks the switch.
[switch]
green_runs = []
