# The shared-crate dependency guard (`./dev locks guard`): the features Cargo resolves for each watched crate, per workspace.
# Generated by `./dev locks guard --write` (never by hand, ER-40); CI and the push gate compare it with `cargo metadata`.
# A dependency added to a shared crate (crates/*/Cargo.toml) can force a feature on a crate every app builds (oxc_resolver forces
# serde_json's `preserve_order`), which changes every app's Cargo.lock. A change that moves a line here says so in review: it is
# either unwanted (drop the dependency or its feature) or wanted (commit this file with it).
# `watch` is the list of crates to pin: add a crate name there and run `./dev locks guard --write`.

watch = ["serde_json"]

[features.serde_json]
"apps/debrief" = ["alloc", "default", "float_roundtrip", "indexmap", "preserve_order", "raw_value", "std", "unbounded_depth"]
"apps/debrief/docs/research/2026-10-28-duckdb-server-mode/harness" = ["default", "std"]
"apps/debrief/fuzz" = ["alloc", "default", "float_roundtrip", "indexmap", "preserve_order", "std"]
"apps/dyno" = ["alloc", "default", "float_roundtrip", "raw_value", "std", "unbounded_depth"]
"apps/dyno/fuzz" = ["alloc", "default", "float_roundtrip", "std"]
"apps/dyno/vendor/tray-icon" = ["default", "std"]
"apps/pitcrew" = ["alloc", "default", "float_roundtrip", "raw_value", "std", "unbounded_depth"]
"apps/pitwall" = ["alloc", "default", "float_roundtrip", "raw_value", "std", "unbounded_depth"]
"apps/shell-demo/src-tauri" = ["alloc", "default", "float_roundtrip", "raw_value", "std", "unbounded_depth"]
"apps/spotter" = ["alloc", "default", "float_roundtrip", "raw_value", "std", "unbounded_depth"]
"apps/workbench-demo/src-tauri" = ["alloc", "default", "float_roundtrip", "raw_value", "std", "unbounded_depth"]
"crates" = ["alloc", "default", "float_roundtrip", "raw_value", "std", "unbounded_depth"]
"crates/paddock-archive/fuzz" = ["alloc", "default", "float_roundtrip", "std"]
"crates/paddock-ipc/fuzz" = ["alloc", "default", "float_roundtrip", "std"]
