# The ratchet of ADR 0072 (D8): what fails today, per instance of the ADR's table (I1 to I27), found by the ending harness
# (`paddock_ipc::testing::endings`) on main's behaviour. Every ending test is green with this file and red without it
# (`PADDOCK_ENDINGS_NO_RATCHET=1`), and the file only shrinks: a fault that is not listed is a new failure, and a listed fault
# that no longer happens fails the run until its entry is removed. `./dev check ipc-endpoints` (C102) checks the file's shape;
# `./dev check ipc-endpoints --tag <tag>` refuses a release tag that matches a `blocks_tag` pattern while an entry remains.
#
# instance    I1..I27 of the ADR, or WP-7 for the missing end line (a logging gap, which blocks no tag)
# endpoint    the id in docs/ipc-endpoints.toml
# scenario    a scenario of the harness, or `*` for every scenario that ran
# fault       the kind the harness reports
# blocks_tag  the tag pattern a release of which is refused while the entry exists (`none` only for a logging gap)
# os          only where the fault is not on every OS (linux, macos, windows)

[[ratchet]]
instance = "I4"
endpoint = "ipc-host"
scenario = "silent-client"
fault = "no-reason"
blocks_tag = "dyno-v*"
note = "The handshake watchdog closes the stream when it runs out; the client reads a bare end (handshake.rs bounded)."

[[ratchet]]
instance = "I1"
