id = "0097"
title = "A user approval carries proof that the user gave it"
summary = "A user approval carries proof that the user gave it (accepted 2026-11-10 by the user; D3: no interim signer (the Mac has no Touch ID), (a) two FIDO2 keys when they arrive, genesis signed by the first; D7: signed release intents, CI tags when green; D8 (a) declined for now, (b) later; other decisions as recommended; ER-21): a record that stands for the user's consent (an `approved = \"user\"` entry, an `approved: user` trailer, a waiver, a switch that lowers a tag gate, an acceptance) counts only when written by a commit signed with a touch-required FIDO2 key (Secure Enclave as recovery) in a chained, pinned `allowed_signers`, read from `origin/main`; a record counts only as the signed commit left it (projection rule over `git log -L`, strict schemas); the verifier checks the presence bit itself (`ssh-keygen -Y verify` does not); check C108, `./dev approve` in a fresh clone, code pins, a post-tag audit from `main`, bot identities as defence in depth; a structural walk in which a merge carries a value only if one side changed it since the merge base (a landing merge passes, an evil or replaying merge fails), a root-owned FIDO middleware, the decision in its own pinned crate `paddock-approvals` behind one pinned gate action that always builds it in the gated job; revision 6; D1-D11, 16 agent-days, enforcement after 14.25"
status = "accepted"
accepted = "2026-11-10"
