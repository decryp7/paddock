id = "R-2026-11-11-0073-elevated-helper"
title = "Amendment to ADR 0073: Debrief's elevated work moves into one narrow helper, and the elevated relaunch goes"
summary = "Amendment to ADR 0073 (proposed 2026-11-11; direction decided by the user on 2026-11-11: a narrow elevated helper instead of \"Restart as administrator\"): one on-demand `debrief-admin.exe` with a closed request list (ETW for .NET and native, logman, the Security log, dumps, process samples) from the per-machine install folder, verified pipe per rule 75, no environment, the per-plugin elevated role and `restart_elevated` removed, elevated mode for a hand-started elevated Debrief; D-H1 to D-H7 open; 13 to 18.5 days plus ADR 0053's Debrief row; gates debrief-v1.2.0"
status = "proposed"
approval_file = "docs/adr/amendments/0073-elevated-helper-2026-11-11.md"
adr_by = "2026-11-25" # 14 days after the user's direction decision of 2026-11-11 (ADR 0096 section 2 default)
prerequisites = ["ADR 0053 Debrief per-machine install", "Windows test VM admin snapshot", "ADR 0092 WP-9 rule 75 text", "ADR 0073 WP-0"]

