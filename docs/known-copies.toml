# The copies register (ADR 0034, rule 55): every mechanism that exists more than once in the family, its one canonical
# implementation and each copy, with the app that deletes the copy and the tag by which it must be gone.
#
# Format (ADR 0034 §1-§2):
#   [[mechanism]]  id (kebab-case, unique), title, canonical (crate or package), paths (globs over tracked files; a whole
#                  crate is written `<crate>/src/**`), symbols (optional), status ("built" | "planned": a planned
#                  canonical's files may not exist yet), adr (optional: where the canonical home was decided)
#   [[mechanism.copy]]  paths, symbols (optional), kind ("copy", the default, or "wiring": a few lines that hook a plugin
#                  up by hand; covered by the tag check only), owner (an apps/ folder or "paddock"), delete_by
#                  (`<owner>-vX.Y.Z`, or `vX.Y.Z` for owner "paddock"), note (facts, not branch names)
#   symbols: "item:<Name>" (the span of a Rust/TypeScript item named Name) or "text:<literal>" (changed lines that contain
#            the literal). Without symbols, any counted change to a matching file touches the member. Only non-test source
#            files count (no tests, fixtures, manifests, lockfiles, docs or generated files).
#
# Check C58 (ADR 0034 §3, follow-up WP-1):
#   - a change that touches one member of a mechanism touches every other copy and a built canonical, or waives a member
#     in a commit that touches the mechanism:  Copies-waived: <mechanism-id> <member-path>: <reason>
#     (`*` for the member path only when the mechanism has at most two members besides wiring)
#   - an entry leaves the register only with its copy's files, or with:  Copies-removed: <mechanism-id> <path>: <reason>
#   - a delete_by date moves only with:  Copies-date: <mechanism-id> <path>: <old> -> <new>: approved: <coordinator|user>: <reason>
#     (rule 55(d); a move to a later release line needs approved: user)
#   - a tag `<app>-vX.Y.Z` is refused while a copy owned by that app has a delete_by version <= X.Y.Z.
#
# Seeded 2026-10-31 from the family survey (family-redesign-and-sharing-2026-10-31) and from the shared crates' own
# "Taken from" / "Ported from" / "Extracted from" doc comments in crates/ and ui/, at origin/main c3404cdc7. Paths are
# as they are on main. A release batch that deletes a copy removes its entry in the same batch, before its tag.
# Not listed on purpose (ADR 0034 §1): documentation (AGENTS.md sections synced from docs/blocks, READMEs), templates/**
# (the source of new standalone repositories), the per-app clippy.toml presets (C13), and domain code that only looks
# alike (Dyno's socket lister, Pitcrew's and Pitwall's transports, supervisor transitions; rule 42).

version = 1

