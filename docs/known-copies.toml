[[mechanism]]
id = "ci-slot-ownership"
title = "Whether a folder is `target-<name>-<slot>` of this job's slot directly in the CI home (`job-isolation.sh owns`)"
canonical = "paddock-dev"
paths = ["tools/paddock-dev/src/slots.rs"]
symbols = ["item:owns", "item:valid_slot"]
status = "built"
adr = "docs/adr/0022-rust-developer-and-ci-tool.md"

  [[mechanism.copy]]
  paths = ["conformance/ci/job-isolation.sh"]
  symbols = ['text:s[1-9][0-9]*', 'text:rel="${real#"$home"/}"', 'text:glob="${lay//\{slot\}/$s}"', "text:cmd_owns"]
  owner = "paddock"
  delete_by = "v0.4.0"
  note = "The shell `owns` and slot validation stay until the CI kit moves to `dev` (ADR 0022 R2/R5). The shell keeps other kept-folder kinds and defaults the slot to s1 on Linux; the Rust copy knows only `target`, takes `--ci-home` and `--slot` explicitly and has no such default."

  [[mechanism.copy]]
  paths = ["conformance/ci/kept-folders.txt"]
  symbols = ["text:target-{name}-{slot}"]
  owner = "paddock"
  delete_by = "v0.4.0"
  note = "The `target` layout this ownership rule hard-codes in the Rust copy; a change of the layout changes both."
