# The copies register (ADR 0034, rule 55): every mechanism that exists more than once in the family, its one canonical
# implementation and each copy, with the app that deletes the copy and the tag by which it must be gone.
#
# Format (ADR 0034 §1-§2):
#   [[mechanism]]  id (kebab-case, unique), title, canonical (crate or package), paths (globs over tracked files),
#                  symbols (optional), status ("built" | "planned": a planned canonical's paths may not exist yet),
#                  adr (optional: where the canonical home was decided)
#   [[mechanism.copy]]  paths, symbols (optional), owner (an apps/ folder or "paddock"), delete_by (`<owner>-vX.Y.Z`,
#                  or `vX.Y.Z` for owner "paddock"), note
#   symbols: "item:<Name>" (the span of a Rust/TypeScript item named Name) or "text:<literal>" (changed lines that contain
#            the literal). Without symbols, any change to a matching file touches the member.
#
# Check C58 (ADR 0034 §3, follow-up WP-1): a change that touches one member of a mechanism touches every other member,
# or waives it with a commit trailer:  Copies-waived: <mechanism-id> <member-path-or-*>: <reason>
# A tag `<app>-vX.Y.Z` is refused while a copy owned by that app has a delete_by version <= X.Y.Z.
# Moving a delete_by date is a reviewed change with the reason in the commit body.
#
# Seeded 2026-10-31 from the family survey (family-redesign-and-sharing-2026-10-31) at origin/main c3404cdc7. Paths are
# as they are on main; copies already deleted on a release branch leave the register when that branch lands.
# Not listed on purpose: AGENTS.md paddock:block sections (C23), per-app clippy.toml presets (C13), and domain code that
# only looks alike (Dyno's socket lister, Pitcrew's and Pitwall's transports, supervisor transitions; rule 42).

version = 1

