# The gate register (ADR 0060 section 3): what is deliberately not gated, conditional, report-only, ratcheted or planned.
# `./dev gates check` (C100) fails on a check that no reachable CI line runs and that is not listed here, on an entry that
# is no longer needed, on a review_by that has passed (at most 60 days after since) and on a moved date without a
# `Gates-date:` trailer. Fix the cause and remove the entry; do not extend the date.

version = 1

# Which docs are rule-bearing (section 5). ADRs, research, plans, lessons and changelogs are history: they may name what was planned.
[docs]
include = ["AGENTS.md", "apps/*/AGENTS.md", "docs/rules.md", "docs/design-guide.md", "**/README.md", "docs/wiki/**/*.md"]
exclude = ["docs/adr/**", "apps/*/docs/adr/**", "docs/research/**", "docs/plans/**", "docs/planned/**", "docs/audits/**",
           "docs/lessons.md", "**/CHANGELOG.md", "**/vendor/**", "**/fixtures/**", "**/spikes/**", "ui/docs/review/**",
           "**/node_modules/**"]

# Repository variables as CI sets them (section 2.4); a vars.* not listed here makes the line conditional.
[vars]
SCCACHE_REDIS_ENDPOINT = "redis://172.16.1.188:6379"
SCCACHE_REDIS_DB = "5"

# Files whose results blocks record measurements (rule 48): a `gate = "measurement"` test must appear in one of them.
[measurements]
files = ["docs/benchmarks.md", "apps/*/docs/performance.md"]

# Harnesses outside CI that run checks (VM rows never run in CI: memory local-test-vms).
[[harness]]
name = "vm-smoke"
paths = ["scripts/vm-smoke/**"]

