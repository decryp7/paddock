# Debrief never adopted the lint preset (ADR 0060 3.2, 7): a release's worth of work, so a ratchet, not a 60-day exception. The
# workspace tables are in apps/debrief/Cargo.toml, C13 runs in debrief.yml with these members exempt from the opt-in and these
# clippy.toml paths allowed to be missing (clippy.toml applies to the whole workspace, so a path with uncleaned call sites cannot be
# added yet), and `./dev gates ratchet --release-tag` refuses a debrief-v1.2.0 tag (or a later one) while either list is not
# empty. Both lists only shrink. The whole cleanup (both clippy paths and all 46 members) stays in Debrief 1.2.
# approved: user 2026-11-08 (target debrief-v1.2.0, not v1.3.0); scope decided again by the user 2026-11-09.
# 2026-11-12 (user, Debrief 1.2 Tier A): C13 is limited to the temp_dir and reqwest bans and there is no crate-by-crate ratchet before
# debrief-v1.2.0, so `blocks_tag = "report-only"`: `./dev gates ratchet --release-tag` reports the open lists and never refuses the tag.
# The move is recorded by the `Gates-date: C13 debrief blocks_tag blocking -> report-only; approved: user` trailer of the commit that touches this line.
[[ratchet]]
id = "C13"
app = "debrief"
not_yet = ["app/src-tauri", "crates/cargo-debrief-plugin", "crates/chromium-driver", "crates/debrief-agent", "crates/debrief-ai", "crates/debrief-ai-worker", "crates/debrief-alloc", "crates/debrief-batch", "crates/debrief-cli", "crates/debrief-collect", "crates/debrief-core", "crates/debrief-dump", "crates/debrief-etw", "crates/debrief-ipc", "crates/debrief-monitor", "crates/debrief-notes", "crates/debrief-pdf", "crates/debrief-plugin-api", "crates/debrief-plugin-dotnet", "crates/debrief-plugin-dumps", "crates/debrief-plugin-e2e", "crates/debrief-plugin-formats", "crates/debrief-plugin-host", "crates/debrief-plugin-native", "crates/debrief-plugin-otel", "crates/debrief-plugin-package", "crates/debrief-plugin-profiling", "crates/debrief-plugin-registry", "crates/debrief-plugin-syslog", "crates/debrief-plugin-test", "crates/debrief-plugin-tools", "crates/debrief-plugin-web", "crates/debrief-plugin-windows", "crates/debrief-plugins", "crates/debrief-profile", "crates/debrief-store-client", "crates/debrief-store-duck", "crates/debrief-store-worker", "crates/debrief-symbols", "crates/debrief-video", "examples/plugins/annotator-example", "examples/plugins/collector-example", "examples/plugins/importer-example", "examples/plugins/tool-example", "examples/plugins/transform-example", "xtask"]
