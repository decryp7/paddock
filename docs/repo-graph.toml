# The declared inputs, owners and prose of the repository model (ADR 0117 §3): every path fact the planner knows that is not an
# edge an extractor reads from the code. Read by one accessor, tools/paddock-dev/src/repo_inputs.rs (ER-42); the crate
# crates/paddock-repo-graph holds no path (§14, its guard test model::guard). A file nothing here or in a project folder claims is
# unowned: the plan answers everything and names it.
#
# Narrowing an entry (fewer files or targets, a new `none` or `doc` owner for a built path, a new setup-only action, less prose)
# is the unsafe direction: it needs a golden diff in the same change and the user's approval (§14, ER-46). Widening needs neither.
#
# [[input]]  name, files (globs: no `/` matches a name in any folder, a leading `/` anchors at the root), reaches (all | cargo |
#            npm | apps | owner | project:<id>), reach (code | release | test | plumbing | docs; default code), extractor (a
#            content extractor that narrows it: attributes | npm-lock | guards), adds (true: the file keeps its owner and the input
#            adds its targets), except (globs taken back out)
# [[owner]]  paths (globs), node (none | doc | project:<id>); the most specific pattern wins, a later rule a tie
# [prose]    project_names (prose in a project folder, by name), project_folders (a project's own prose folders), doc_owner
#            (prose under a doc owner), doc_assets (documentation images under a doc owner; content detection may override, D14)
# [[project]] id (the plan's key), folder (relative to the root; empty: a check job that owns no path); each app is also a project,
#            `app:<name>` for `apps/<name>`, found by its contract file
# [paths]    the folders and file names the adapters read: workflows, actions, apps, contract, script_folders, node_tests, e2e,
#            checkout, root_spellings
# [hash]     runner_configs (the nextest, Vitest and Playwright files that select and run a node), contracts (the files whose command
#            lines run a node's phases), image_files (what pins the CI image), workspace_files (the lockfile and root manifest of a
#            Cargo package's workspace folder) and cargo_config_folders (the `.cargo` folders from that folder up): added to a node's
#            input hash (§5, WP-7; ADR 0116 §2)
# [ci]       setup_only (actions that stay plumbing in a release job), release_actions (actions that make a job a release job),
#            release_gate_phases (the contract phases a check of a release job runs beside the smoke set), and the sub-table
#            [ci.jobs] (per ci.yml job, the projects it runs for by choice; see its own comment below)
# [planner]  mode (graph | rules; no table: graph), reason (required for rules), lint_phases (the contract phases a test-only change
#            keeps): which planner decides `./dev plan --ci`. The
#            graph decides from the landing of ADR 0117's wiring (the user, 2026-11-23); `rules` is the emergency switch back to the
#            rule tables, a commit that states its reason here. `--compare` and `--replay` read both whatever this says.
version = 1

[planner]
mode = "graph"
reason = "ADR 0117: the repository graph decides CI plans from landing (the user's decision of 2026-11-23)"
# The contract phases that lint and format a project: a test-only change keeps them beside its affected tests.
lint_phases = ["fmt", "lint"]

[[project]]
id = "crates"
folder = "crates"

[[project]]
id = "ui"
folder = "ui"

[[project]]
id = "eslint"
folder = "eslint"

[[project]]
id = "conformance"
folder = "conformance"

[[project]]
id = "tools"
folder = "tools"

[[project]]
id = "icons"
folder = "icons"

[[project]]
id = "ci-image"
folder = "ci-image"

[[project]]
id = "paddock-dev"
folder = "tools/paddock-dev"

# A check job with no folder (it owns no path); it is reached by named inputs and by a true global.
[[project]]
id = "c99"
folder = ""

[paths]
workflows = ".gitea/workflows/"
actions = ".gitea/actions/"
apps = "apps/"
contract = "paddock.ci.json"
script_folders = ["conformance/ci/", "conformance/release/", "conformance/src/util/", "scripts/"]
node_tests = "conformance/test/"
e2e = "e2e"
checkout = ".paddock/"
# [from, to], replaced in order: the checkout, the stable host-runner path, and the folder an app repository checks Paddock out to
# for the reusable workflows.
root_spellings = [
  ["${{ env.PADDOCK_WORKSPACE || github.workspace }}/", ""],
  ["${{ env.PADDOCK_WORKSPACE || github.workspace }}", "."],
  ["${{ github.workspace }}/", ""],
  ["${PADDOCK_WORKSPACE:-$GITHUB_WORKSPACE}/", ""],
  ["$PADDOCK_WORKSPACE/", ""],
  ["$GITHUB_WORKSPACE/", ""],
  [" .paddock/", " "],
  ["\".paddock/", "\""],
]

[prose]
project_names = ["README*", "CHANGELOG*", "LICENSE*"]
project_folders = ["docs"]
# An SVG under a doc owner is a text image: prose of the docs (content detection reads it as text, so `doc_assets` cannot claim it).
doc_owner = ["*.md", "*.txt", "LICENSE*", "*.svg"]
doc_assets = ["*.png", "*.jpg", "*.jpeg", "*.gif", "*.webp", "*.svg"]

[[input]]
name = "rust-toolchain"
files = ["/rust-toolchain", "/rust-toolchain.toml"]
reaches = ["all"]

[[input]]
name = "npm-root"
files = ["/package.json", "/.npmrc", "/.nvmrc", "tsconfig/**"]
