[[input]]
# The planner reads every workflow, action and contract (its CI adapter and `--ci` outputs): a change to one is paddock-dev's code
# too, so the planner's tests and goldens run (review of 59e5f7ec3, P1-3; G5).
name = "ci-files-planner"
files = [".gitea/workflows/**", ".gitea/actions/**", "apps/*/paddock.ci.json"]
except = [".gitea/**/*.md"]
reaches = ["project:paddock-dev"]
adds = true

[[input]]
# An app's icon sources (icons/<app>/) are installed into that app (icons/tools/install.mjs): the app named by the second path
# segment; a folder that names no app (icons/archive, icons/tools) reaches none through this input.
name = "icon-sources"
files = ["icons/*/**"]
reaches = ["app:{1}"]
adds = true

[[input]]
name = "icon-tools"
files = ["icons/tools/**", "icons/package.json"]
reaches = ["apps"]
adds = true

[[input]]
name = "e2e-guards"
files = ["ui/projects/paddock-e2e/src/env.ts", "ui/projects/paddock-e2e/src/build-guard.ts"]
reaches = ["apps"]
adds = true

[[input]]
name = "notices"
files = ["scripts/notices.sh", "templates/repo/about.toml", "conformance/src/notices/**"]
reaches = ["apps"]
adds = true

[[input]]
name = "generated-bindings"
files = ["ui/**/generated/*.ts", "ui/**/generated/*.json"]
reaches = ["project:crates"]
adds = true
except = ["**/public-api.ts", "**/ng-package.json"]

[[input]]
name = "test-guards"
files = ["*.rs", "*.ts"]
reaches = ["project:conformance"]
extractor = "guards"
adds = true
except = ["**/node_modules/**"]

[[owner]]
paths = ["docs/**", "diagrams/**", "*.md", "LICENSE*", ".gitea/**/*.md"]
node = "doc"

[[owner]]
paths = ["spikes/**"]
node = "none"

[[owner]]
paths = [".gitignore", ".editorconfig", ".DS_Store", ".gitea/ISSUE_TEMPLATE/**"]
node = "none"

[ci]
setup_only = ["setup-rust", "build-jobs", "node-caches", "dev-tool-cache", "sccache-stats", "cache-report"]
release_actions = ["tauri-bundle", "publish-release", "macos-verify", "keychain", "strip-signing-keys"]
# A check a release job runs (a `run:` step: the release preflight, a conformance check) is a gate of the release: the app's smoke
# set and these contract phases, never the installers; the steps that use a release action build them (rule 54 narrowed, user
# decision 2026-11-23).
release_gate_phases = ["checks"]

# [ci.jobs]: the projects a ci.yml job runs for by choice, which no `if:` shows (ADR 0123 §2; read by
# tools/paddock-dev/src/repo_inputs.rs `ci_jobs`, ER-42). The job model (crates/paddock-ci-config) derives every other project from the
# plan outputs the job's and its steps' conditions read; a job left with no project is a problem, never `always`. Shrink-only (ER-46): a
# new entry needs the user, and the model check (tests/it/job_model.rs) compares the whole with plan_gitea::CI_JOBS until ADR 0117 D12.
[ci.jobs]
plan = ["everything"]            # the plan job runs on every change
gitleaks = ["conformance"]       # the secret scan runs for `conformance` by choice
quick = ["conformance"]          # the short checks run on every change; their C99 and heavy tool steps are derived (c99, tools)
test-cache-shadow = ["crates"]   # the shadow report reads the crates workspace's test cache

[hash]
runner_configs = ["**/.config/nextest.toml", "**/vitest.config.*", "**/playwright.config.*", "**/angular.json"]
contracts = ["paddock.ci.json"]
image_files = ["ci-image/VERSION", "ci-image/Dockerfile"]
workspace_files = ["Cargo.lock", "Cargo.toml"]
cargo_config_folders = [".cargo"]
