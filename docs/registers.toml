# The register of registers (ER-46, ER-42; C161): every file under docs/ that holds a list the family keeps (a register, an allow list, a
# ratchet, a set of declared inputs) says here, in one place, how it may change and which reader parses it.
#
# One [[register]] per table of a file (a top-level array of tables or a table):
#   file     the repository path; every docs/*.toml is declared here, or C161 reports a register with no policy
#   table    the top-level key of the table
#   policy   shrink-only: no entry the merge base lacks (an addition is a finding, the user approves growth, ER-46);
#            approval-required: a new entry carries a non-empty `approved` field; free: no growth rule (the reason says why)
#   key      the fields whose values name one entry (growth is measured on them); members: a list field whose strings each count
#   reader   the Rust file that parses the table (empty: none yet)
#   strict   "serde": the reader refuses an unknown key itself (`deny_unknown_fields` in the reader's file); "check": it does not,
#            and `fields` is the one refusal, applied by C161 (a table field not in `fields` is a finding). A reader moves from
#            check to serde and never back; `fields = ["*"]` is for a table whose keys are data (a map)
#   why      at least 8 characters
# A policy may only tighten against the merge base: free to approval-required to shrink-only (a loosened policy is a finding).
# The top-level keys of a file that are not tables (version, required, watch) are listed in `scalars` on its first entry.
version = 1

[[register]]
file = "docs/ci-scope-first-runs.toml"
table = "first_green"
policy = "free"
reader = "tools/paddock-dev/src/run_scope.rs"
strict = "check"
fields = ["*"]
why = "written only by `./dev ci scope-record`, which refuses a run that is not finished, green and complete; a producer is named once"

