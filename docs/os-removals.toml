# The user's approvals of `hostTests` entries that take an operating system away from code (`skip`, `only`): conformance C155's
# os-removal compares every such entry with the contract at the merge base and counts the ones recorded here as approved (ER-46).
# Each approval names its contract, the removal keys exactly as C155 reports them (`only <os> <name>`, `skip <package> [<module>]`),
# `by = "user"`, the date and why. Adding an entry is the user's decision, never an agent's: the register is shrink-only, so C155 reports
# an approval the merge base lacks as one unwaivable finding (the user approves the growth with a `[[register_growth]]` line for C155 in docs/gates.toml: date, count and digest of exactly the added approvals),
# and an approval the merge base already covers as stale. An entry leaves once its exception is on the target branch, or with it.
version = 1

[[approved]]
contract = "tools/paddock-dev/paddock.ci.json"
by = "user"
date = "2026-11-27"
why = "decision 114 (user, in chat): paddock-dev's OS-independent test areas run on Linux only (ER-52); Windows and macOS keep the OS-specific tests"
entries = [
  "skip merge_check::", "skip ci_runs::", "skip ci_run::", "skip plan_graph::", "skip plan_repo::", "skip plan_since::",
  "skip plan_gitea::", "skip run_scope::", "skip nextest_log::", "skip log_text::", "skip job_outcome::", "skip active_apps::",
  "skip test_cost::", "skip os_placement::", "skip repo_model::hash::", "skip repo_model::replay::",
]
