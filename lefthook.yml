# Git hooks for the whole monorepo (https://lefthook.dev; lefthook reads only this root file). Install once with
# `npx lefthook install`. Each app's checks run in its own folder (`root:`) and only on its staged files; CI runs the
# full gates (scripts/affected.mjs). The apps' own lefthook.yml files were merged here at their import (ADR 0014).
pre-commit:
  parallel: true
  commands:
    debrief-rustfmt:
      root: "apps/debrief/"
      glob: "*.rs"
      run: rustfmt --edition 2021 --check {staged_files}
    debrief-clippy:
      root: "apps/debrief/"
      glob: "*.rs"
      run: cargo clippy --workspace --all-targets --quiet -- -D warnings
    debrief-eslint:
      root: "apps/debrief/app/"
      glob: "*.{ts,html}"
      run: npx eslint --max-warnings 0 {staged_files}
    dyno-rustfmt:
      root: "apps/dyno/"
      glob: "*.rs"
      run: rustfmt --edition 2021 --check {staged_files}
    dyno-clippy:
      root: "apps/dyno/"
      glob: "*.rs"
      run: cargo clippy --workspace --all-targets --quiet -- -D warnings
    dyno-eslint:
      root: "apps/dyno/app/"
      glob: "*.{ts,html}"
      run: npx eslint --max-warnings 0 {staged_files}
    pitcrew-rustfmt:
      root: "apps/pitcrew/"
      glob: "*.rs"
      run: rustfmt --edition 2021 --check {staged_files}
    pitcrew-clippy:
      root: "apps/pitcrew/"
      glob: "*.rs"
      run: cargo clippy --workspace --all-targets --quiet -- -D warnings
    pitcrew-eslint:
      root: "apps/pitcrew/app/"
      glob: "*.{ts,html}"
      run: npx eslint --max-warnings 0 {staged_files}
    pitwall-rustfmt:
      root: "apps/pitwall/"
      glob: "*.rs"
      run: rustfmt --edition 2021 --check {staged_files}
    pitwall-clippy:
      root: "apps/pitwall/"
      glob: "*.rs"
      run: cargo clippy --workspace --all-targets --quiet -- -D warnings
    pitwall-eslint:
      root: "apps/pitwall/app/"
      glob: "*.{ts,html}"
      run: npx eslint --max-warnings 0 {staged_files}
    spotter-rustfmt:
      root: "apps/spotter/"
      glob: "*.rs"
      run: rustfmt --edition 2021 --check {staged_files}
    spotter-clippy:
      root: "apps/spotter/"
      glob: "*.rs"
      run: cargo clippy --workspace --all-targets --quiet -- -D warnings
    spotter-eslint:
      root: "apps/spotter/app/"
      glob: "*.{ts,html}"
      run: npx eslint --max-warnings 0 {staged_files}
    pitwall-privacy:
      root: "apps/pitwall/"
      glob: "*.{rs,toml}"
      run: bash scripts/ci/privacy-check.sh
    crates-rustfmt:
      root: "crates/"
      glob: "*.rs"
      run: rustfmt --edition 2024 --check {staged_files}

commit-msg:
  commands:
    conventional:
      run: node conformance/bin/paddock-conformance.mjs commit-lint --file {1}

# One command, so the hook cannot drift from CI (ADR 0038, docs/plans/ci-in-rust.md WP-2): `./dev check --pre-push` runs ER-9's fast
# gates for what the push changes (fmt, host and Windows Clippy, Linux Clippy in the CI image, conformance with ci.yml's own list,
# commit-lint, lockfiles, Pitwall's script tests and deny, C102). It reads the planner; a gate that cannot run is "not measured".
pre-push:
  commands:
    pre-push:
      # git's pre-push lines on standard input: the gate checks exactly the commits being pushed (a dirty tree is only noted).
      use_stdin: true
      run: ./dev check --pre-push --refs-from-stdin
