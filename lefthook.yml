# Git hooks for the whole monorepo (https://lefthook.dev; lefthook reads only this root file). Install once with
# `npx lefthook install`. Each app's checks run in its own folder (`root:`) and only on its staged files; CI runs the
# full gates (scripts/affected.mjs). The apps' own lefthook.yml files were merged here at their import (ADR 0014).
pre-commit:
  parallel: true
  commands:
    debrief-rustfmt:
      root: "apps/debrief/"
      glob: "*.rs"
      run: rustfmt --edition 2021 --check {staged_files}
    debrief-clippy:
      root: "apps/debrief/"
      glob: "*.rs"
      run: cargo clippy --workspace --all-targets --quiet -- -D warnings
    debrief-eslint:
      root: "apps/debrief/app/"
      glob: "*.{ts,html}"
      run: npx eslint --max-warnings 0 {staged_files}
    dyno-rustfmt:
      root: "apps/dyno/"
      glob: "*.rs"
      run: rustfmt --edition 2021 --check {staged_files}
    dyno-clippy:
      root: "apps/dyno/"
      glob: "*.rs"
      run: cargo clippy --workspace --all-targets --quiet -- -D warnings
    dyno-eslint:
      root: "apps/dyno/app/"
      glob: "*.{ts,html}"
      run: npx eslint --max-warnings 0 {staged_files}
    pitcrew-rustfmt:
      root: "apps/pitcrew/"
      glob: "*.rs"
      run: rustfmt --edition 2021 --check {staged_files}
    pitcrew-clippy:
      root: "apps/pitcrew/"
      glob: "*.rs"
      run: cargo clippy --workspace --all-targets --quiet -- -D warnings
    pitcrew-eslint:
      root: "apps/pitcrew/app/"
      glob: "*.{ts,html}"
      run: npx eslint --max-warnings 0 {staged_files}
    pitwall-rustfmt:
      root: "apps/pitwall/"
      glob: "*.rs"
      run: rustfmt --edition 2021 --check {staged_files}
    pitwall-clippy:
      root: "apps/pitwall/"
      glob: "*.rs"
      run: cargo clippy --workspace --all-targets --quiet -- -D warnings
    pitwall-eslint:
      root: "apps/pitwall/app/"
      glob: "*.{ts,html}"
      run: npx eslint --max-warnings 0 {staged_files}
    spotter-rustfmt:
      root: "apps/spotter/"
      glob: "*.rs"
      run: rustfmt --edition 2021 --check {staged_files}
    spotter-clippy:
      root: "apps/spotter/"
      glob: "*.rs"
      run: cargo clippy --workspace --all-targets --quiet -- -D warnings
    spotter-eslint:
      root: "apps/spotter/app/"
      glob: "*.{ts,html}"
      run: npx eslint --max-warnings 0 {staged_files}
    pitwall-privacy:
      root: "apps/pitwall/"
      glob: "*.{rs,toml}"
      run: bash scripts/ci/privacy-check.sh
    crates-rustfmt:
      root: "crates/"
      glob: "*.rs"
      run: rustfmt --edition 2024 --check {staged_files}

commit-msg:
  commands:
    conventional:
      run: node conformance/bin/paddock-conformance.mjs commit-lint --file {1}

pre-push:
  commands:
    # Fast static gates for the whole push (ADR 0038): conformance over the tree, as CI's conformance job runs it.
    # `./dev check --pre-push` is not built yet; replace this entry with it when it lands. Skip with LEFTHOOK=0.
    conformance:
      run: node conformance/bin/paddock-conformance.mjs --app paddock --root . --only C06,C14,C15,C16,C24,C29,C30,C31,C34,C35,C36,C37,C39,C43,C45,C48,C53,C54,C56,C57,C59,C71,C79,C98,C104 --strict C36
    pitwall-scripts:
      root: "apps/pitwall/"
      run: node --test scripts/ci/*.test.mjs
    pitwall-deny:
      root: "apps/pitwall/"
      run: cargo deny --workspace check
    # C102 (ADR 0072): every listen site is in docs/ipc-endpoints.toml with an ending test or a reason, and the ratchet of
    # connection endings is well formed. The release path's tag check calls `./dev check ipc-endpoints --tag <tag>`.
    ipc-endpoints:
      run: ./dev check ipc-endpoints
