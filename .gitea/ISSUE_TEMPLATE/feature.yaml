name: Feature request
about: Suggest something an app should do.
title: "[Feature] "
labels:
  - feature
body:
  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        - Dyno
        - Debrief
        - Pitwall
        - Pitcrew
        - Spotter
        - Sighter
        - Pacenotes
        - Recce
        - Scrutineer
        - Other
    validations:
      required: true
  - type: textarea
    id: wish
    attributes:
      label: What you'd like
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The problem it solves for you.
    validations:
      required: true
