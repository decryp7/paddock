name: release-verdict
description: "Says in the job summary whether a release workflow run built installers ('installers: built' or 'installers: not built (why)') and fails a run that was asked to build them (nightly, manual, tag) and did not. Use it in a last job with if: always() that needs the plan and the release job."
inputs:
  app:
    description: The app id (dyno).
    required: true
  plan-run:
    description: "needs.plan.outputs.run ('true' or 'false'); empty when the workflow has no plan job."
    default: ""
  skip-reason:
    description: "'train' when the plan ended a scheduled run early because a train was in CI; empty otherwise."
    default: ""
  release-result:
    description: needs.<release job>.result.
    required: true
  gates-result:
    description: "needs.gates.result, when the workflow has gates: a tag whose gates failed names the failed jobs."
    default: ""
  token:
    description: Token to list this run's jobs (only to name failed gates).
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: Installers built?
      shell: bash
      env:
        APP: ${{ inputs.app }}
        EVENT: ${{ github.event_name }}
        REF: ${{ github.ref }}
        PLAN_RUN: ${{ inputs.plan-run }}
        SKIP_REASON: ${{ inputs.skip-reason }}
        RELEASE_RESULT: ${{ inputs.release-result }}
        GATES_RESULT: ${{ inputs.gates-result }}
        SERVER_URL: ${{ github.server_url }}
        REPOSITORY: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        TOKEN: ${{ inputs.token }}
      run: node "${{ github.action_path }}/../../../conformance/ci/release-verdict.mjs"
