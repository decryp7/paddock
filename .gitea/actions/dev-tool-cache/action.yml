name: dev-tool-cache
description: "./dev's own binary through the Actions cache (the runners' RustFS S3), Linux only (ADR 0111, 0115): keyed by the launcher's input hash, the OS, the architecture and a cache-version salt (no restore-keys); a restored binary is verified for its hash and rebuilt when it is not; only a verified binary under a key the restore did not find is saved, and the job summary says restored (exact, partial, miss) and saved from actions/cache's own outputs. It must run before the first ./dev call of a job, because a ./dev call builds the tool from source when it is not there and the restore then has nothing to fill (run 8576: 42 of 44 jobs rebuilt it); setup-rust, node-caches and build-jobs use it first. The first use in a job does the work and sets PADDOCK_DEV_TOOL_CACHE_DONE; later uses do nothing. A use before a Rust compiler exists finds no hash and leaves the work to the next use. The logic is conformance/ci/dev-tool-cache.sh (tested by conformance/test/dev-tool-cache.test.mjs); Mac and Windows hosts keep their own slot's folder."
runs:
  using: composite
  steps:
    - name: Key of the tool
      id: key
      if: runner.os == 'Linux' && env.PADDOCK_DEV_TOOL_CACHE_DONE != '1'
      shell: bash
      run: bash "${{ github.action_path }}/../../../conformance/ci/dev-tool-cache.sh" key
    - name: Restore the tool
      id: restore
      if: runner.os == 'Linux' && env.PADDOCK_DEV_TOOL_CACHE_DONE != '1' && steps.key.outputs.usable == 'true'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.key.outputs.path }}
        key: ${{ steps.key.outputs.key }}
    - name: Verify the tool, build it on a miss
      id: verify
      if: runner.os == 'Linux' && env.PADDOCK_DEV_TOOL_CACHE_DONE != '1' && steps.key.outputs.usable == 'true'
      shell: bash
      run: bash "${{ github.action_path }}/../../../conformance/ci/dev-tool-cache.sh" verify "${{ steps.restore.outputs.cache-hit }}" "${{ steps.restore.outputs.cache-matched-key }}"
    - name: Save the verified tool
      id: save
      if: runner.os == 'Linux' && env.PADDOCK_DEV_TOOL_CACHE_DONE != '1' && steps.key.outputs.usable == 'true' && steps.verify.outputs.save == 'true'
      continue-on-error: true
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.key.outputs.path }}
        key: ${{ steps.key.outputs.key }}
    - name: Confirm the save
      id: confirm
      if: runner.os == 'Linux' && env.PADDOCK_DEV_TOOL_CACHE_DONE != '1' && steps.key.outputs.usable == 'true' && steps.verify.outputs.save == 'true'
      continue-on-error: true
      # A failed save is only a warning in the save step; looking the key up again is the proof it is there.
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.key.outputs.path }}
        key: ${{ steps.key.outputs.key }}
        lookup-only: true
    - name: Cache summary
      if: always() && runner.os == 'Linux' && env.PADDOCK_DEV_TOOL_CACHE_DONE != '1' && steps.key.outputs.usable == 'true'
      shell: bash
      env:
        KEY: ${{ steps.key.outputs.key }}
      run: |
        bash "${{ github.action_path }}/../../../conformance/ci/dev-tool-cache.sh" summary "${{ steps.verify.outputs.state || 'not run' }}" "${{ steps.verify.outputs.save }}" "${{ steps.confirm.outputs.cache-hit }}" "${{ steps.restore.outputs.cache-hit }}" "${{ steps.restore.outputs.cache-matched-key }}"
        # Set last, after the save and the confirm above: a use later in the job then does nothing (it would find the tool built).
        echo "PADDOCK_DEV_TOOL_CACHE_DONE=1" >> "$GITHUB_ENV"
