name: host-tools
description: "Pinned cargo-nextest on every OS: host runners keep the checksum-verified release in the CI home's shared tools folder (job-isolation), tools/cargo-nextest/<version>, and download it only when that version is missing; the Linux image brings its own. Every runner then checks that `cargo nextest --version` is the pin."
runs:
  using: composite
  steps:
    - name: cargo-nextest
      shell: bash
      run: bash "${{ github.action_path }}/../../../conformance/ci/kit.sh" host host-tools
