name: host-tools
description: "Pinned cargo-nextest on every OS: host runners keep the checksum-verified release in the CI home's shared tools folder (job-isolation), tools/cargo-nextest/<version>, and download it only when that version is missing; the Linux image brings its own. Every runner then checks that `cargo nextest --version` is the pin."
runs:
  using: composite
  steps:
    - name: cargo-nextest
      shell: bash
      run: |
        set -euo pipefail
        # The pin: the version the paddock-ci image has (ci-image/Dockerfile via the garage image); bump both together, with
        # the two SHA-256 values of the release archives.
        VERSION=0.9.149
        if [ "$RUNNER_OS" != Linux ]; then
          case "$RUNNER_OS-$(uname -m)" in
            macOS-*)          A=universal-apple-darwin.tar.gz;  SUM=47b9941765a9ff94e304a3fe5444ac1c7593da655525b8b69f8f2b31a9217507; BIN=cargo-nextest ;;
            Windows-x86_64)   A=x86_64-pc-windows-msvc.zip;     SUM=bf904b85c7c5c2a29c340053a8d9d8e8027ff0d55a2bf7cef7d23032f8166438; BIN=cargo-nextest.exe ;;
            *) echo "::error::no pinned cargo-nextest for $RUNNER_OS $(uname -m)"; exit 1 ;;
          esac
          tools="$(bash "${{ github.action_path }}/../../../conformance/ci/kit.sh" isolation path tools)"  # shared: installs land by rename
          DEST="$tools/cargo-nextest/$VERSION"
          if [ ! -x "$DEST/$BIN" ]; then
            dl=$(mktemp -d)
            curl -fsSL --retry 3 -o "$dl/$A" "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$VERSION/cargo-nextest-$VERSION-$A"
            if command -v sha256sum >/dev/null 2>&1; then GOT=$(sha256sum "$dl/$A" | cut -d' ' -f1); else GOT=$(shasum -a 256 "$dl/$A" | cut -d' ' -f1); fi
            [ "$GOT" = "$SUM" ] || { echo "::error::cargo-nextest $VERSION checksum mismatch for $A (got $GOT)"; exit 1; }
            mkdir -p "$dl/x"
            case "$A" in
              *.zip) if command -v unzip >/dev/null 2>&1; then unzip -q "$dl/$A" -d "$dl/x"; else powershell -NoProfile -Command "Expand-Archive -Path '$(cygpath -w "$dl/$A")' -DestinationPath '$(cygpath -w "$dl/x")'"; fi ;;
              *) tar -xzf "$dl/$A" -C "$dl/x" ;;
            esac
            mkdir -p "$DEST"
            # A part file of this job's own: two jobs installing the same version at once each rename a whole copy into place.
            cp "$dl/x/$BIN" "$DEST/$BIN.part.$$" && chmod +x "$DEST/$BIN.part.$$" && mv -f "$DEST/$BIN.part.$$" "$DEST/$BIN"
            rm -rf "$dl"
            echo "cargo-nextest $VERSION installed in $DEST"
          else
            echo "cargo-nextest $VERSION kept in $DEST"
          fi
          PATH="$DEST:$PATH"
          if [ "$RUNNER_OS" = Windows ]; then cygpath -w "$DEST" >> "$GITHUB_PATH"; else echo "$DEST" >> "$GITHUB_PATH"; fi
        fi
        GOT=$(cargo-nextest nextest --version 2>/dev/null | head -1 | awk '{print $2}' || true)
        [ "$GOT" = "$VERSION" ] || { echo "::error::cargo-nextest is ${GOT:-missing} on this runner, the pin is $VERSION (.gitea/actions/host-tools)"; exit 1; }
        echo "cargo-nextest $GOT"
