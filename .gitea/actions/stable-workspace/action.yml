name: stable-workspace
description: "Host runners only: moves the checkout to a fixed folder of the job's slot in the CI home (job-isolation: src/<name>-<slot>) and leaves a link at the old path (where the folder cannot move, as on Windows, keeps a clone there at the same commit), sets PADDOCK_WORKSPACE to it, so the build runs from the same physical path every time. sccache keys a Rust compile on its working folder; the runner's per-job hashed work folder made every path crate miss."
inputs:
  name:
    description: "Folder name under the CI home's src/ (the job's slot is appended); one per repo and job (the default is both)."
    default: ${{ github.repository }}-${{ github.job }}
runs:
  using: composite
  steps:
    - name: Move the checkout to a stable path
      shell: bash
      env:
        NAME: ${{ inputs.name }}
      run: bash "${{ github.action_path }}/../../../conformance/ci/kit.sh" host stable-workspace "$NAME"
