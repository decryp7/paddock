name: job-isolation
description: "Job isolation on a host runner (README, Job isolation): `acquire` (the first bash step, before stable-workspace, build-folder and every kept folder) takes a free job slot of the host (an OS file lock held by `./dev ci slot`) and, through the job-tmpdir step of `./dev ci isolation`, points TMPDIR (TMP and TEMP on Windows) and PADDOCK_JOB_TEMP at the runner's own per-job temp folder and makes the job's short socket folder PADDOCK_SOCKET_BASE (Unix), after sweeping those of killed jobs; `release` (the last step, if: always()) removes the socket folder, gives the slot back and fails when its holder died during the job. Sets PADDOCK_CI_SLOT, PADDOCK_CI_SLOT_TOKEN, PADDOCK_JOB_TEMP, TMPDIR and PADDOCK_SOCKET_BASE. Does nothing in a Linux container (one job per Linux host; ADR 0025)."
inputs:
  mode:
    description: "'acquire' or 'release'."
    default: acquire
runs:
  using: composite
  steps:
    - shell: bash
      env:
        MODE: ${{ inputs.mode }}
      # A failed acquire marks the job (`./dev --job-setup`: PADDOCK_JOB_ABORTED=1, conformance C117); the release runs the tool the
      # acquire pinned (the wrapper takes PADDOCK_DEV as it is), so it never builds after the job's temp folder is gone.
      run: |
        # One job per Linux host (ADR 0025): nothing to do there, so no tool is fetched or built for it.
        if [ "${RUNNER_OS:-}" = Linux ]; then exit 0; fi
        if [ "$MODE" = acquire ]; then setup=--job-setup; else setup=; fi
        bash "${{ github.action_path }}/../../../dev" $setup ci isolation "$MODE"
