name: build-env
description: "Sets PADDOCK_BUILD_COMMIT and PADDOCK_BUILD_DATE for the following steps, so the About page can show them (paddock-updater reads them with option_env!). `./dev ci build-env` (tools/paddock-dev/tests/it/build_env.rs holds it equal to conformance/ci/build-env.mjs, which conformance check C56 reads)."
runs:
  using: composite
  steps:
    - shell: bash
      run: bash "${{ github.action_path }}/../../../dev" ci build-env
