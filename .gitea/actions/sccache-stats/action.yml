name: sccache-stats
description: "Prints sccache --show-stats (hit rate) in the job log; use it as the last step with `if: always()`. Does nothing when sccache is absent."
runs:
  using: composite
  steps:
    - name: sccache statistics
      shell: bash
      run: bash "${{ github.action_path }}/../../../conformance/ci/kit.sh" host sccache-stats || echo "::warning::sccache-stats did not run (exit $?); it never fails a job."
