name: sccache-stats
description: "Prints sccache --show-stats (hit rate) in the job log; use it as the last step with `if: always()`. Does nothing when sccache is absent."
runs:
  using: composite
  steps:
    - name: sccache statistics
      shell: bash
      run: |
        # Without sccache there are no statistics, and no tool is fetched or built for that.
        command -v sccache >/dev/null 2>&1 || exit 0
        bash "${{ github.action_path }}/../../../dev" ci sccache-stats || echo "::warning::sccache-stats did not run (exit $?); it never fails a job."
