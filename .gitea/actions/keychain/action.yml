name: keychain
description: "Conformance C99 (ADR 0057 §3, rule 72): no shipped process uses the macOS Keychain. The one copy of the command, used by ci.yml's c99 job and by every release path (app-release.yml, debrief.yml, the two demo release workflows)."
inputs:
  scope:
    description: "The app a release judges, as apps/<app> or any path below it (reduced to apps/<app>): its workspaces, crates/ and its UI projects only (ER-31), so another app's finding cannot block it. Empty: the whole repository (ci.yml)."
    default: ""
  paddock:
    description: "Folder of the Paddock checkout that holds conformance/ (. in the monorepo, .paddock when the job checked it out there)."
    default: "."
runs:
  using: composite
  steps:
    - shell: bash
      env:
        SCOPE: ${{ inputs.scope }}
        PADDOCK: ${{ inputs.paddock }}
        RUSTC_WRAPPER: ""
      run: |
        set -euo pipefail
        if [ -n "$SCOPE" ] && [ "${SCOPE#apps/}" = "$SCOPE" ]; then
          echo "::error::C99 scope '$SCOPE' is not an app folder: use apps/<app> (or a path below it), or leave it empty for the whole repository."
          exit 1
        fi
        # A workspace in a subfolder of the app (apps/<app>/app/src-tauri) is still the app's: the scope is the app folder.
        SCOPE=$(printf '%s' "$SCOPE" | sed -E 's#^(apps/[^/]+).*#\1#')
        start=$(date +%s)
        fail='::error::C99 found a way to the macOS Keychain, or could not look (see the findings above). Fix the finding, or read "check broken" / "not measured" as a failed check, not a pass (ADR 0057 section 3).'
        if [ -n "$SCOPE" ]; then
          echo "C99: scope $SCOPE"
          node "$PADDOCK/conformance/bin/paddock-conformance.mjs" --app paddock --root . --only C99 --scope "$SCOPE" || { echo "$fail"; exit 1; }
        else
          echo "C99: the whole repository"
          node "$PADDOCK/conformance/bin/paddock-conformance.mjs" --app paddock --root . --only C99 || { echo "$fail"; exit 1; }
        fi
        echo "C99 took $(( $(date +%s) - start )) s"
