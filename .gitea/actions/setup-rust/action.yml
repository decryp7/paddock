name: setup-rust
description: "The Rust toolchain with components and targets (here, before ./dev), CARGO_BUILD_JOBS for the runner (`./dev ci build-jobs`) when no earlier step set it, then `./dev ci setup-rust`: sccache (installed, checksum-verified, when the runner has none) on the local disk or the shared Redis backend, and the Tauri Linux libraries on request. A release, rule 54 or tag run keeps the shell steps until the release-path lane (docs/plans/ci-in-rust.md)."
inputs:
  toolchain:
    description: "Toolchain channel or version. Empty (the default) means the `channel` of the root rust-toolchain.toml, the family's one Rust version (stable when the checkout has no such file)."
    default: ""
  components:
    description: Space-separated rustup components, e.g. "clippy rustfmt".
    default: ""
  targets:
    description: Space-separated extra targets.
    default: ""
  tauri-linux-deps:
    description: "Install the Linux libraries Tauri needs (webkit2gtk, gtk, rsvg, appindicator); ignored on other systems."
    default: "false"
  sccache-backend:
    description: "local (default: sccache's disk cache, the job slot's kept folder sccache-s<n> on a host runner, /sccache in a container when that mount exists), auto (Redis when an endpoint is set, else local), redis (the endpoint is required) or s3 (the local disk first, the shared RustFS store behind it; the local disk alone when S3 cannot be used). The default is the dispatch input `sccache_backend` of ci.yml (one run), else the Gitea variable PADDOCK_CI_SCCACHE_BACKEND, local when both are unset (docs/research/2026-11-19-sccache.md section 8)."
    default: ${{ github.event.inputs.sccache_backend || vars.PADDOCK_CI_SCCACHE_BACKEND || 'local' }}
  sccache-redis-endpoint:
    description: "Shared sccache backend, e.g. redis://172.16.1.188:6379 (no path: sccache ignores it). Used on every OS; empty means sccache's local disk."
    default: ${{ vars.SCCACHE_REDIS_ENDPOINT }}
  sccache-redis-db:
    description: "Redis database number for sccache. The shared server gives sccache database 5 (docs/dev-setup.md); never another number."
    default: ${{ vars.SCCACHE_REDIS_DB }}
  sccache-s3-access-key-id:
    description: "The RustFS key's id: pass the repository secret PADDOCK_SCCACHE_S3_ACCESS_KEY_ID. Used only with sccache-backend s3, and only by the one step that runs ./dev ci setup-rust (conformance C141 checks every use passes it)."
    default: ""
  sccache-s3-secret-access-key:
    description: "The RustFS key's secret: pass the repository secret PADDOCK_SCCACHE_S3_SECRET_ACCESS_KEY. Never reaches $GITHUB_ENV or a later step."
    default: ""
  sccache-s3-endpoint:
    description: "The S3 store's URL, http://host:port."
    default: ${{ vars.PADDOCK_SCCACHE_S3_ENDPOINT }}
  sccache-s3-bucket:
    description: "The S3 bucket."
    default: ${{ vars.PADDOCK_SCCACHE_S3_BUCKET }}
runs:
  using: composite
  steps:
    - name: Rust toolchain
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
        COMPONENTS: ${{ inputs.components }}
        TARGETS: ${{ inputs.targets }}
        # The install itself is ./dev's (the repository root's wrapper, present in every checkout): one install per runner at a time.
        PADDOCK_DEV_SCRIPT: ${{ github.action_path }}/../../../dev
      run: |
        set -euo pipefail
        command -v rustup >/dev/null || { echo "::error::rustup is not installed on this runner"; exit 1; }
        # One source for the version: the root rust-toolchain.toml (rule 55). A job that names a toolchain (the fuzz jobs' nightly) keeps it.
        if [ -z "$TOOLCHAIN" ]; then
          pin="${GITHUB_WORKSPACE:-.}/rust-toolchain.toml"
          if [ -f "$pin" ]; then TOOLCHAIN=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' "$pin" | head -1); fi
          TOOLCHAIN=${TOOLCHAIN:-stable}
          echo "Rust toolchain $TOOLCHAIN (from rust-toolchain.toml)"
        fi
        # RUSTUP_TOOLCHAIN outranks rust-toolchain.toml and `rustup default`: every later step runs exactly the toolchain this step settled
        # on, so a job that names one (the fuzz jobs' dated nightly) is not overridden by the repo's pin.
        settle() {
          export RUSTUP_TOOLCHAIN="$1"
          if [ -n "${GITHUB_ENV:-}" ]; then echo "RUSTUP_TOOLCHAIN=$1" >> "$GITHUB_ENV"; fi
        }
        # In the Paddock CI image (it writes /etc/paddock-ci-release) the toolchain and its components (llvm-tools too) are installed
        # under the pinned version's name (an older image: as `stable`, a different toolchain name to rustup). When it is the pinned
        # version, use it as it is (nothing downloads); `RUSTUP_TOOLCHAIN=<name>` makes the check itself skip the rust-toolchain.toml,
        # which would start a download.
        # Skipped when this job asks for extra targets or a component the image lacks. An image whose version differs from the pin
        # installs the pinned one below.
        if [ -f "${PADDOCK_CI_RELEASE_FILE:-/etc/paddock-ci-release}" ] && [ -z "$TARGETS" ]; then
          for name in "$TOOLCHAIN" stable; do
            if [ "$name" != stable ] && ! rustup toolchain list 2>/dev/null | grep -q "^${name}-"; then continue; fi
            have=$(RUSTUP_TOOLCHAIN=$name rustc --version 2>/dev/null | awk '{print $2}')
            if [ "$TOOLCHAIN" = stable ] || [ "$have" = "$TOOLCHAIN" ]; then
              installed=$(RUSTUP_TOOLCHAIN=$name rustup component list --installed 2>/dev/null || true)
              missing=0
              for c in $COMPONENTS; do printf '%s\n' "$installed" | grep -q "^$c-" || missing=1; done
              if [ "$missing" = 0 ]; then
                settle "$name"
                echo "Rust toolchain $name from the Paddock CI image (components: ${COMPONENTS:-none})"
                rustc --version
                cargo --version
                exit 0
              fi
            fi
          done
        fi
        # One install of a toolchain at a time per runner (a lock in RUSTUP_HOME, shared with ./dev's own install), then a check that
        # rustc, cargo and the components really run; a half-installed or conflicted toolchain is uninstalled and installed again inside
        # the lock (CI run 8060: two Windows jobs installed 1.100.0 at once and left cargo-clippy "not applicable"; ER-26). It prints the
        # one ::error:: line with the cause and the next step itself.
        sh "$PADDOCK_DEV_SCRIPT" --install-toolchain "$TOOLCHAIN" "$COMPONENTS" "$TARGETS" || exit 1
        rustup default "$TOOLCHAIN"
        settle "$TOOLCHAIN"
        rustc --version
        cargo --version
    # Every Rust job gets its runner's share of the host's cores, also when no build-jobs step ran before this one. It comes after
    # the toolchain: `./dev ci build-jobs` needs rustc (the shell script on the release path does not).
    - name: Build jobs for this runner
      shell: bash
      run: |
        if [ -z "${CARGO_BUILD_JOBS:-}" ]; then bash "${{ github.action_path }}/../../../conformance/ci/kit.sh" build-jobs; else echo "CARGO_BUILD_JOBS=$CARGO_BUILD_JOBS (set earlier in the job)"; fi
    # ./dev's own binary through the Actions cache (the runners' RustFS S3), Linux only (ADR 0111): keyed by the launcher's input hash,
    # the OS, the architecture and a cache-version salt (no restore-keys); a restored binary is verified for its hash and rebuilt when it
    # is not; only a build that passed that check is saved; the job summary says hit or miss and whether the save is there. The logic is
    # conformance/ci/dev-tool-cache.sh (tested by conformance/test/dev-tool-cache.test.mjs); Mac and Windows hosts keep their own slot's folder.
    - name: Key of the tool
      id: key
      if: runner.os == 'Linux'
      shell: bash
      run: bash "${{ github.action_path }}/../../../conformance/ci/dev-tool-cache.sh" key
    - name: Restore the tool
      id: restore
      if: runner.os == 'Linux' && steps.key.outputs.usable == 'true'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.key.outputs.path }}
        key: ${{ steps.key.outputs.key }}
    - name: Verify the tool, build it on a miss
      id: verify
      if: runner.os == 'Linux' && steps.key.outputs.usable == 'true'
      shell: bash
      run: bash "${{ github.action_path }}/../../../conformance/ci/dev-tool-cache.sh" verify "${{ steps.restore.outputs.cache-hit }}"
    - name: Save the verified tool
      id: save
      if: runner.os == 'Linux' && steps.key.outputs.usable == 'true' && steps.verify.outputs.save == 'true'
      continue-on-error: true
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.key.outputs.path }}
        key: ${{ steps.key.outputs.key }}
    - name: Confirm the save
      id: confirm
      if: runner.os == 'Linux' && steps.key.outputs.usable == 'true' && steps.verify.outputs.save == 'true'
      continue-on-error: true
      # A failed save is only a warning in the save step; looking the key up again is the proof it is there.
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.key.outputs.path }}
        key: ${{ steps.key.outputs.key }}
        lookup-only: true
    - name: Cache summary
      if: always() && runner.os == 'Linux' && steps.key.outputs.usable == 'true'
      shell: bash
      env:
        KEY: ${{ steps.key.outputs.key }}
      run: bash "${{ github.action_path }}/../../../conformance/ci/dev-tool-cache.sh" summary "${{ steps.verify.outputs.state || 'not run' }}" "${{ steps.verify.outputs.save }}" "${{ steps.confirm.outputs.cache-hit }}"
    # Everything after the toolchain is `./dev ci setup-rust` (tools/paddock-dev/src/ci_setup_rust.rs). The two steps above stay
    # here: ./dev needs rustc to hash and build itself, and the job's later ./dev calls must see the same compiler.
    # Until the release-path lane (docs/plans/ci-in-rust.md, step 5), a run that never downloads ./dev (a release or rule 54
    # dispatch, a tag) keeps the shell steps below unchanged; tests/it/setup_rust.rs proves both give the same result.
    - name: Implementation
      id: kit
      shell: bash
      run: |
        # The rule lives once, in conformance/ci/kit.sh (it prints its reason on standard error).
        kit="$(bash "${{ github.action_path }}/../../../conformance/ci/kit.sh" which)"
        echo "kit=$kit" >> "$GITHUB_OUTPUT"
        echo "setup-rust: compile cache through the $kit implementation"
    # ./dev builds itself from source when no pinned copy exists (cargo, build scripts): that runs here, in a step that holds no S3 key.
    # The step below then only runs the built tool, which hands the key to the sccache server and to nothing else.
    - name: Build ./dev
      if: steps.kit.outputs.kit == 'dev'
      shell: bash
      run: |
        if [ -z "${PADDOCK_DEV:-}" ]; then
          if [ -z "${PADDOCK_DEV_TOKEN-}${GITHUB_TOKEN-}" ]; then export PADDOCK_DEV_DOWNLOAD=0; fi
          bash "${{ github.action_path }}/../../../dev" ci setup-rust --help >/dev/null
        fi
    - name: Compile cache and Tauri libraries
      if: steps.kit.outputs.kit == 'dev'
      shell: bash
      env:
        BACKEND: ${{ inputs.sccache-backend }}
        PADDOCK_SCCACHE_REDIS_ENDPOINT: ${{ inputs.sccache-redis-endpoint }}
        REDIS_DB: ${{ inputs.sccache-redis-db }}
        TAURI_LINUX_DEPS: ${{ inputs.tauri-linux-deps }}
        # The S3 key goes to this step only (never $GITHUB_ENV): ./dev masks it and hands it to the sccache server it starts.
        PADDOCK_SCCACHE_S3_ACCESS_KEY_ID: ${{ inputs.sccache-s3-access-key-id }}
        PADDOCK_SCCACHE_S3_SECRET_ACCESS_KEY: ${{ inputs.sccache-s3-secret-access-key }}
        PADDOCK_SCCACHE_S3_ENDPOINT: ${{ inputs.sccache-s3-endpoint }}
        PADDOCK_SCCACHE_S3_BUCKET: ${{ inputs.sccache-s3-bucket }}
      run: |
        # Without the read credential ./dev builds itself from source and never takes a binary from the store (ADR 0022 section 3.3).
        if bash "${{ github.action_path }}/../../../conformance/ci/dev-tool-cache.sh" no-download; then export PADDOCK_DEV_DOWNLOAD=0; fi
        # The tool job-isolation pinned for this job, else the wrapper (one tool per job, never a second fetch).
        if [ -n "${PADDOCK_DEV:-}" ]; then
          "$PADDOCK_DEV" ci setup-rust --sccache-backend "$BACKEND" --sccache-redis-db "$REDIS_DB" --tauri-linux-deps "$TAURI_LINUX_DEPS"
        else
          bash "${{ github.action_path }}/../../../dev" ci setup-rust --sccache-backend "$BACKEND" --sccache-redis-db "$REDIS_DB" --tauri-linux-deps "$TAURI_LINUX_DEPS"
        fi
    - name: Install sccache
      if: steps.kit.outputs.kit == 'shell'
      shell: bash
      run: |
        set -euo pipefail
        VERSION=0.19.0
        # The pinned release on every OS (one version, one cache format). A runner that already has exactly it keeps it.
        if command -v sccache >/dev/null 2>&1 && [ "$(sccache --version | awk '{print $2}')" = "$VERSION" ]; then exit 0; fi
        case "$RUNNER_OS-$(uname -m)" in
          Linux-x86_64)            T=x86_64-unknown-linux-musl;  EXT=tar.gz; SUM=aa73c7270c997894038c0d8f0d297865f57569e1687883322bc431713d4bb9dd ;;
          Linux-aarch64|Linux-arm64) T=aarch64-unknown-linux-musl; EXT=tar.gz; SUM=3e47fc4a71b1ddd1b4294a0de9d34498922fdf41e3cd0bda5df3954e3d6deb9d ;;
          macOS-arm64)             T=aarch64-apple-darwin;       EXT=tar.gz; SUM=a35a0b7d622618774bc1bb8102d72562dfb21e619f88b153b370d7f89bc286af ;;
          Windows-x86_64)          T=x86_64-pc-windows-msvc;     EXT=zip;    SUM=28be8c61f6b2c89b9eb2869f6af7f78e6f992e78a8abae0ce855fcc129cbeac1 ;;
          *) echo "::warning::no pinned sccache release for $RUNNER_OS $(uname -m); building without the shared compile cache."; exit 0 ;;
        esac
        DEST="${RUNNER_TOOL_CACHE:-$HOME/.cache}/sccache/$VERSION"
        BIN=sccache; [ "$RUNNER_OS" = "Windows" ] && BIN=sccache.exe
        if [ ! -x "$DEST/$BIN" ]; then
          dl=$(mktemp -d)
          NAME="sccache-v$VERSION-$T"
          # A failed download must not fail the job: the build runs without the cache.
          if ! curl -fsSL --retry 3 -o "$dl/$NAME.$EXT" "https://github.com/mozilla/sccache/releases/download/v$VERSION/$NAME.$EXT"; then
            echo "::warning::could not download sccache $VERSION; building without the compile cache."; exit 0
          fi
          if command -v sha256sum >/dev/null 2>&1; then GOT=$(sha256sum "$dl/$NAME.$EXT" | cut -d' ' -f1); else GOT=$(shasum -a 256 "$dl/$NAME.$EXT" | cut -d' ' -f1); fi
          [ "$GOT" = "$SUM" ] || { echo "::error::sccache $VERSION checksum mismatch for $T (got $GOT)"; exit 1; }
          if [ "$EXT" = zip ]; then
            if command -v unzip >/dev/null 2>&1; then unzip -q "$dl/$NAME.$EXT" -d "$dl"; else powershell -NoProfile -Command "Expand-Archive -Path '$(cygpath -w "$dl/$NAME.$EXT")' -DestinationPath '$(cygpath -w "$dl")'"; fi
          else
            tar -xzf "$dl/$NAME.$EXT" -C "$dl"
          fi
          mkdir -p "$DEST"
          # Renamed into place whole: a runner with a shared tool cache may run two jobs that install it at once.
          cp "$dl/$NAME/$BIN" "$DEST/$BIN.part.$$"
          chmod +x "$DEST/$BIN.part.$$"
          mv -f "$DEST/$BIN.part.$$" "$DEST/$BIN"
          rm -rf "$dl"
        fi
        echo "$DEST" >> "$GITHUB_PATH"
    - name: sccache
      if: steps.kit.outputs.kit == 'shell'
      shell: bash
      env:
        BACKEND: ${{ inputs.sccache-backend }}
        REDIS_ENDPOINT: ${{ inputs.sccache-redis-endpoint }}
        REDIS_DB: ${{ inputs.sccache-redis-db }}
      run: |
        set -euo pipefail
        # The Install step added the pinned copy to PATH for later steps only; this step finds it by its folder.
        PINNED="${RUNNER_TOOL_CACHE:-$HOME/.cache}/sccache/0.19.0"
        if [ -d "$PINNED" ]; then PATH="$PINNED:$PATH"; fi
        if ! command -v sccache >/dev/null 2>&1; then
          echo "::warning::sccache is not available on this runner; building without the compile cache."
          exit 0
        fi
        if [ "$BACKEND" = s3 ]; then
          echo "::notice::sccache-backend s3 is not used by this shell path (a release, rule 54 or tag run); the local disk is used until the release lane runs ./dev ci setup-rust."
          BACKEND=local
        fi
        case "$BACKEND" in auto|redis|local) ;; *) echo "::error::sccache-backend must be auto, redis, local or s3 (got '$BACKEND')"; exit 1 ;; esac
        if [ "$BACKEND" = redis ] && [ -z "$REDIS_ENDPOINT" ]; then
          echo "::error::sccache-backend is redis but sccache-redis-endpoint is empty (set the Gitea variable SCCACHE_REDIS_ENDPOINT)"; exit 1
        fi
        # CI's own server: a host runner may run a developer's sccache on the default port 4226 with its own backend, which
        # would silently ignore the settings below. sccache-stats stops this port's server, never the default one. On a host
        # each job slot has its own port (job-isolation's ports.txt: 4227 for s1, 4228 for s2, ...), so a concurrent job's start (which
        # stops the server first) or its sccache-stats (which stops it last) never takes this job's server away.
        iso="${{ github.action_path }}/../../../conformance/ci/job-isolation.sh"
        PORT=4227
        if [ "$RUNNER_OS" != Linux ]; then PORT="$(bash "$iso" port sccache)"; fi
        export SCCACHE_SERVER_PORT="$PORT" SCCACHE_IGNORE_SERVER_IO_ERROR=1
        SETTINGS=()
        if [ "$BACKEND" = redis ] || { [ "$BACKEND" = auto ] && [ -n "$REDIS_ENDPOINT" ]; }; then
          export SCCACHE_REDIS_ENDPOINT="$REDIS_ENDPOINT" SCCACHE_REDIS_DB="${REDIS_DB:-5}"
          SETTINGS+=("SCCACHE_REDIS_ENDPOINT=$REDIS_ENDPOINT" "SCCACHE_REDIS_DB=${REDIS_DB:-5}")
          echo "sccache: shared backend $REDIS_ENDPOINT db ${REDIS_DB:-5}"
        else
          # Local disk, one folder per job slot on every OS (ADR 0111; the Rust twin is tools/paddock-dev/src/ci_setup_rust.rs). sccache's
          # LRU evicts any file below its folder and its local storage "only supports a single sccache server at a time" (docs/Local.md),
          # so a Linux lane never gets the mount itself: its folder is <mount>/sccache-<lane>. A host runner's slot folder outlives
          # the job; a container without the mount keeps the cache in the job (with a notice: every job then starts cold).
          # This path never uses the S3 level (see the notice above); the Rust command's S3 local tier is the sibling folder
          # <mount>/sccache-<lane>-s3 (ci_setup_rust::lane_s3_dir), never a folder inside the lane's, so a shell twin would name it the same.
          SIZE=20G
          if [ "$RUNNER_OS" = Linux ]; then
            MOUNT="${PADDOCK_SCCACHE_MOUNT:-/sccache}"  # overridable so the step's test does not depend on the runner's real mount
            LANES="${PADDOCK_CI_SLOTS:-${PADDOCK_CI_JOBS_PER_HOST:-6}}"
            LANE="${PADDOCK_CI_SLOT:-}"
            if [ -d "$MOUNT" ] && [ -w "$MOUNT" ] && [ -z "$LANE" ] && [ -n "${RUNNER_TEMP:-}" ]; then
              # The lane the Rust command takes: the same slot holder, in the mount's lanes/ folder. Only the tool this job already has
              # (PADDOCK_DEV, pinned by job-isolation): this path never builds ./dev, and a failure is said, never hidden.
              LANE_ERR="$(mktemp)"
              if [ -n "${PADDOCK_DEV:-}" ] && [ -x "$PADDOCK_DEV" ]; then
                LANE="$("$PADDOCK_DEV" ci slot acquire --max "$LANES" --owner "$RUNNER_TEMP" --root "$MOUNT/lanes" 2>"$LANE_ERR" | awk 'NR == 1 { print $1 }')" || LANE=""
              else
                echo "no ./dev binary is pinned for this job (PADDOCK_DEV), and this path never builds one" > "$LANE_ERR"
              fi
              if [ -n "$LANE" ]; then
                # The slot, and what the end-of-job check (`dev ci slot check`, in sccache-stats) needs: the lanes folder and the lock file's identity.
                { echo "PADDOCK_CI_SLOT=$LANE"; echo "PADDOCK_CI_LANE_ROOT=$MOUNT/lanes"; echo "PADDOCK_CI_LANE_LOCK=$(stat -c '%d:%i' "$MOUNT/lanes/slots/$LANE.lock" 2>/dev/null || true)"; } >> "$GITHUB_ENV" || { echo "::error::could not record the lane $LANE in GITHUB_ENV"; exit 1; }
                echo "sccache: this job holds lane $LANE of $LANES on $MOUNT"
              else
                echo "::warning::no lane of $MOUNT was taken: $(tr '\n' ' ' < "$LANE_ERR"). The compile cache lives and dies with the job."
                echo "- sccache lane: NOT taken ($(tr '\n' ' ' < "$LANE_ERR")); job-private folder" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              fi
              rm -f "$LANE_ERR"
            fi
            if [ -d "$MOUNT" ] && [ -w "$MOUNT" ] && [ -n "$LANE" ]; then
              DIR="$MOUNT/sccache-$LANE"
              TOTAL="${PADDOCK_CI_SCCACHE_GB:-60}"
              case "$TOTAL" in '' | *[!0-9]*) TOTAL=60 ;; esac
              PER=$((TOTAL / LANES)); if [ "$PER" -lt 2 ]; then PER=2; fi
              SIZE="${PER}G"
            elif [ -d "$MOUNT" ] && [ -w "$MOUNT" ]; then
              DIR="${RUNNER_TEMP:-/tmp}/sccache"; echo "::notice::no lane of $MOUNT could be taken; the compile cache lives and dies with the job."
            else DIR="${RUNNER_TEMP:-/tmp}/sccache"; echo "::notice::no /sccache mount in this container; the compile cache lives and dies with the job."; fi
          else
            # The job slot's own cache: sccache's local storage "only supports a single sccache server at a time" (docs/Local.md),
            # so each slot's server has its own folder, and the host's budget PADDOCK_CI_SCCACHE_GB (default 40) is divided
            # between the slots (PADDOCK_CI_SLOTS), at least 2 GB each.
            DIR="$(bash "$iso" path sccache)"
            SLOTS="$(bash "$iso" slots)"
            TOTAL="${PADDOCK_CI_SCCACHE_GB:-40}"
            case "$TOTAL" in '' | *[!0-9]*) TOTAL=40 ;; esac
            PER=$((TOTAL / SLOTS)); if [ "$PER" -lt 2 ]; then PER=2; fi
            SIZE="${PER}G"
          fi
          mkdir -p "$DIR"
          if [ "$RUNNER_OS" = Windows ]; then DIR="$(cygpath -w "$DIR")"; fi
          export SCCACHE_DIR="$DIR" SCCACHE_CACHE_SIZE="$SIZE"
          SETTINGS+=("SCCACHE_DIR=$DIR" "SCCACHE_CACHE_SIZE=$SIZE")
          echo "sccache: local disk $DIR"
        fi
        sccache --version
        # A server left on this port by an earlier job would keep that job's backend: start it fresh with this job's settings.
        sccache --stop-server >/dev/null 2>&1 || true
        # The cache must slow a build down, never fail it: when the server cannot start or answer (a broken or full backend),
        # RUSTC_WRAPPER stays unset and the job builds without sccache.
        if ! sccache --start-server || ! sccache --show-stats >/dev/null 2>&1; then
          sccache --stop-server >/dev/null 2>&1 || true
          echo "::warning::the sccache server did not start; the build runs without the compile cache."
          exit 0
        fi
        # sccache itself is the wrapper, never a script around it: Windows starts a .cmd through cmd.exe, whose 8191-character
        # command line limit rustc's arguments for a large crate exceed (windows-sys). sccache puts every CARGO_* variable into its
        # cache key, CARGO_TARGET_DIR included, so a job that needs a build folder outside its checkout sets it with cargo's
        # `--config build.target-dir=...` (configuration is not hashed), not with the environment variable.
        {
          echo "RUSTC_WRAPPER=sccache"
          # Cached builds are not incremental.
          echo "CARGO_INCREMENTAL=0"
          echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1"
          echo "SCCACHE_SERVER_PORT=$PORT"
          # Windows: cargo's legacy build-dir layout. Cargo 1.100 passes one -L per indirect dependency and falls back to an @argfile
          # past CreateProcessW's 32,767 characters; sccache 0.19 expands that file and cannot start rustc (os error 206, run 8027,
          # mozilla/sccache#2787). The same line as LEGACY_BUILD_DIR_LAYOUT in tools/paddock-dev/src/ci_setup_rust.rs.
          if [ "$RUNNER_OS" = Windows ]; then echo "__CARGO_TEMPORARY_BUILD_DIR_NEW_LAYOUT_OPT_OUT=1"; fi
          for kv in "${SETTINGS[@]}"; do echo "$kv"; done
        } >> "$GITHUB_ENV"
    - name: Linux dependencies for Tauri
      if: steps.kit.outputs.kit == 'shell' && runner.os == 'Linux' && inputs.tauri-linux-deps == 'true'
      shell: bash
      run: |
        SUDO=$(command -v sudo || true)
        $SUDO apt-get update
        $SUDO apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf cmake
