name: setup-rust
description: "The Rust toolchain with components and targets (here, before ./dev), CARGO_BUILD_JOBS for the runner (`./dev ci build-jobs`) when no earlier step set it, then `./dev ci setup-rust`: sccache (installed, checksum-verified, when the runner has none) on the local disk or the shared Redis backend, and the Tauri Linux libraries on request."
inputs:
  toolchain:
    description: "Toolchain channel or version. Empty (the default) means the `channel` of the root rust-toolchain.toml, the family's one Rust version (stable when the checkout has no such file)."
    default: ""
  components:
    description: Space-separated rustup components, e.g. "clippy rustfmt".
    default: ""
  targets:
    description: Space-separated extra targets.
    default: ""
  tauri-linux-deps:
    description: "Install the Linux libraries Tauri needs (webkit2gtk, gtk, rsvg, appindicator); ignored on other systems."
    default: "false"
  sccache-backend:
    description: "local (default: sccache's disk cache, the job slot's kept folder sccache-s<n> on a host runner, /sccache in a container when that mount exists), auto (Redis when an endpoint is set, else local) or redis (the endpoint is required)."
    default: local
  sccache-redis-endpoint:
    description: "Shared sccache backend, e.g. redis://172.16.1.188:6379 (no path: sccache ignores it). Used on every OS; empty means sccache's local disk."
    default: ${{ vars.SCCACHE_REDIS_ENDPOINT }}
  sccache-redis-db:
    description: "Redis database number for sccache. The shared server gives sccache database 5 (docs/dev-setup.md); never another number."
    default: ${{ vars.SCCACHE_REDIS_DB }}
runs:
  using: composite
  steps:
    - name: Rust toolchain
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
        COMPONENTS: ${{ inputs.components }}
        TARGETS: ${{ inputs.targets }}
        # The install itself is ./dev's (the repository root's wrapper, present in every checkout): one install per runner at a time.
        PADDOCK_DEV_SCRIPT: ${{ github.action_path }}/../../../dev
      run: |
        set -euo pipefail
        command -v rustup >/dev/null || { echo "::error::rustup is not installed on this runner"; exit 1; }
        # One source for the version: the root rust-toolchain.toml (rule 55). A job that names a toolchain (the fuzz jobs' nightly) keeps it.
        if [ -z "$TOOLCHAIN" ]; then
          pin="${GITHUB_WORKSPACE:-.}/rust-toolchain.toml"
          if [ -f "$pin" ]; then TOOLCHAIN=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' "$pin" | head -1); fi
          TOOLCHAIN=${TOOLCHAIN:-stable}
          echo "Rust toolchain $TOOLCHAIN (from rust-toolchain.toml)"
        fi
        # RUSTUP_TOOLCHAIN outranks rust-toolchain.toml and `rustup default`: every later step runs exactly the toolchain this step settled
        # on, so a job that names one (the fuzz jobs' dated nightly) is not overridden by the repo's pin.
        settle() {
          export RUSTUP_TOOLCHAIN="$1"
          if [ -n "${GITHUB_ENV:-}" ]; then echo "RUSTUP_TOOLCHAIN=$1" >> "$GITHUB_ENV"; fi
        }
        # In the Paddock CI image (it writes /etc/paddock-ci-release) the toolchain and its components (llvm-tools too) are installed
        # under the pinned version's name (an older image: as `stable`, a different toolchain name to rustup). When it is the pinned
        # version, use it as it is (nothing downloads); `RUSTUP_TOOLCHAIN=<name>` makes the check itself skip the rust-toolchain.toml,
        # which would start a download.
        # Skipped when this job asks for extra targets or a component the image lacks. An image whose version differs from the pin
        # installs the pinned one below.
        if [ -f "${PADDOCK_CI_RELEASE_FILE:-/etc/paddock-ci-release}" ] && [ -z "$TARGETS" ]; then
          for name in "$TOOLCHAIN" stable; do
            if [ "$name" != stable ] && ! rustup toolchain list 2>/dev/null | grep -q "^${name}-"; then continue; fi
            have=$(RUSTUP_TOOLCHAIN=$name rustc --version 2>/dev/null | awk '{print $2}')
            if [ "$TOOLCHAIN" = stable ] || [ "$have" = "$TOOLCHAIN" ]; then
              installed=$(RUSTUP_TOOLCHAIN=$name rustup component list --installed 2>/dev/null || true)
              missing=0
              for c in $COMPONENTS; do printf '%s\n' "$installed" | grep -q "^$c-" || missing=1; done
              if [ "$missing" = 0 ]; then
                settle "$name"
                echo "Rust toolchain $name from the Paddock CI image (components: ${COMPONENTS:-none})"
                rustc --version
                cargo --version
                exit 0
              fi
            fi
          done
        fi
        # One install of a toolchain at a time per runner (a lock in RUSTUP_HOME, shared with ./dev's own install), then a check that
        # rustc, cargo and the components really run; a half-installed or conflicted toolchain is uninstalled and installed again inside
        # the lock (CI run 8060: two Windows jobs installed 1.100.0 at once and left cargo-clippy "not applicable"; ER-26). It prints the
        # one ::error:: line with the cause and the next step itself.
        sh "$PADDOCK_DEV_SCRIPT" --install-toolchain "$TOOLCHAIN" "$COMPONENTS" "$TARGETS" || exit 1
        rustup default "$TOOLCHAIN"
        settle "$TOOLCHAIN"
        rustc --version
        cargo --version
    # Every Rust job gets its runner's share of the host's cores, also when no build-jobs step ran before this one. It comes after
    # the toolchain: `./dev ci build-jobs` needs rustc. A failed setup marks the job (PADDOCK_JOB_ABORTED=1, conformance C117).
    - name: Build jobs for this runner
      shell: bash
      run: |
        if [ -n "${CARGO_BUILD_JOBS:-}" ]; then echo "CARGO_BUILD_JOBS=$CARGO_BUILD_JOBS (set earlier in the job)"; exit 0; fi
        bash "${{ github.action_path }}/../../../dev" ci build-jobs && exit 0
        rc=$?
        echo "::error::A job setup step failed (exit $rc: ./dev ci build-jobs). The job's later steps are skipped, because they would run without the slot, temp folders and core share that step sets up. Read the error above it, fix that, and rerun the job."
        if [ -n "${GITHUB_ENV:-}" ]; then echo "PADDOCK_JOB_ABORTED=1" >> "$GITHUB_ENV" || true; fi
        exit "$rc"
    # Everything after the toolchain is `./dev ci setup-rust` (tools/paddock-dev/src/ci_setup_rust.rs). The two steps above stay
    # here: ./dev needs rustc to hash and build itself, and the job's later ./dev calls must see the same compiler.
    - name: Compile cache and Tauri libraries
      shell: bash
      env:
        BACKEND: ${{ inputs.sccache-backend }}
        PADDOCK_SCCACHE_REDIS_ENDPOINT: ${{ inputs.sccache-redis-endpoint }}
        REDIS_DB: ${{ inputs.sccache-redis-db }}
        TAURI_LINUX_DEPS: ${{ inputs.tauri-linux-deps }}
      run: bash "${{ github.action_path }}/../../../dev" ci setup-rust --sccache-backend "$BACKEND" --sccache-redis-db "$REDIS_DB" --tauri-linux-deps "$TAURI_LINUX_DEPS"
