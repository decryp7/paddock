name: setup-rust
description: Rust toolchain with components and targets, sccache when the runner has it, and the Tauri Linux libraries on request.
inputs:
  toolchain:
    description: Toolchain channel or version.
    default: stable
  components:
    description: Space-separated rustup components, e.g. "clippy rustfmt".
    default: ""
  targets:
    description: Space-separated extra targets.
    default: ""
  tauri-linux-deps:
    description: "Install the Linux libraries Tauri needs (webkit2gtk, gtk, rsvg, appindicator); ignored on other systems."
    default: "false"
runs:
  using: composite
  steps:
    - name: Rust toolchain
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
        COMPONENTS: ${{ inputs.components }}
        TARGETS: ${{ inputs.targets }}
      run: |
        set -euo pipefail
        command -v rustup >/dev/null || { echo "::error::rustup is not installed on this runner"; exit 1; }
        args=(--profile minimal)
        for c in $COMPONENTS; do args+=(--component "$c"); done
        for t in $TARGETS; do args+=(--target "$t"); done
        rustup toolchain install "$TOOLCHAIN" "${args[@]}" --no-self-update
        rustup default "$TOOLCHAIN"
        rustc --version
        cargo --version
    - name: sccache
      shell: bash
      run: |
        # A shared compile cache when the runner image has sccache (the garage image and the host runners do); otherwise plain rustc.
        if command -v sccache >/dev/null 2>&1; then
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          sccache --version
        else
          echo "::notice::sccache is not installed on this runner; building without the shared compile cache."
        fi
    - name: Linux dependencies for Tauri
      if: runner.os == 'Linux' && inputs.tauri-linux-deps == 'true'
      shell: bash
      run: |
        SUDO=$(command -v sudo || true)
        $SUDO apt-get update
        $SUDO apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf cmake
