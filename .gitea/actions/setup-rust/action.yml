name: setup-rust
description: CARGO_BUILD_JOBS for the runner (build-jobs) when no earlier step set it, the Rust toolchain with components and targets, sccache (installed, checksum-verified, when the runner has none) on the shared Redis backend, and the Tauri Linux libraries on request.
inputs:
  toolchain:
    description: Toolchain channel or version.
    default: stable
  components:
    description: Space-separated rustup components, e.g. "clippy rustfmt".
    default: ""
  targets:
    description: Space-separated extra targets.
    default: ""
  tauri-linux-deps:
    description: "Install the Linux libraries Tauri needs (webkit2gtk, gtk, rsvg, appindicator); ignored on other systems."
    default: "false"
  sccache-backend:
    description: "local (default: sccache's disk cache, the job slot's kept folder sccache-s<n> on a host runner, /sccache in a container when that mount exists), auto (Redis when an endpoint is set, else local) or redis (the endpoint is required)."
    default: local
  sccache-redis-endpoint:
    description: "Shared sccache backend, e.g. redis://172.16.1.188:6379 (no path: sccache ignores it). Used on every OS; empty means sccache's local disk."
    default: ${{ vars.SCCACHE_REDIS_ENDPOINT }}
  sccache-redis-db:
    description: "Redis database number for sccache. The shared server gives sccache database 5 (docs/dev-setup.md); never another number."
    default: ${{ vars.SCCACHE_REDIS_DB }}
runs:
  using: composite
  steps:
    # Every Rust job gets its runner's share of the host's cores, also when no build-jobs step ran before this one.
    - name: Build jobs for this runner
      shell: bash
      run: |
        if [ -z "${CARGO_BUILD_JOBS:-}" ]; then bash "${{ github.action_path }}/../../../conformance/ci/build-jobs.sh"; else echo "CARGO_BUILD_JOBS=$CARGO_BUILD_JOBS (set earlier in the job)"; fi
    - name: Rust toolchain
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
        COMPONENTS: ${{ inputs.components }}
        TARGETS: ${{ inputs.targets }}
        NATIVE: ${{ github.action_path }}/../../../conformance/ci/run-native.mjs
      run: |
        set -euo pipefail
        command -v rustup >/dev/null || { echo "::error::rustup is not installed on this runner"; exit 1; }
        COMPONENTS="${COMPONENTS//,/ }"  # ci.yml passes "clippy,rustfmt"; rustup takes both forms
        RUSTUP_DIR="${RUSTUP_HOME:-$HOME/.rustup}"
        STAMP="$RUSTUP_DIR/paddock-ci-synced-$TOOLCHAIN"
        LOCK="$RUSTUP_DIR/paddock-ci-sync.lock"
        HOURS="${PADDOCK_RUSTUP_SYNC_HOURS:-24}"
        case "$HOURS" in '' | *[!0-9]*) HOURS=24 ;; esac
        WAIT="${PADDOCK_RUSTUP_LOCK_WAIT:-900}"
        case "$WAIT" in '' | *[!0-9]*) WAIT=900 ;; esac
        IMAGE="${PADDOCK_CI_RELEASE_FILE:-/etc/paddock-ci-release}"  # overridable so the step's test never reads the real file
        # Everything this job asks for is installed: no network sync. `rustup toolchain install` crashed on the Windows host
        # 0.5 s into "syncing channel updates" (runs 6460 and 7267); a job that does not sync cannot hit that. A channel (stable,
        # beta, nightly) still syncs when the host's last sync is older than PADDOCK_RUSTUP_SYNC_HOURS (default 24, 0 always),
        # so host runners follow new releases; an exact version, or the Paddock CI image (/etc/paddock-ci-release), never does.
        why=""
        fresh() {
          if [ -f "$IMAGE" ] || grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' <<<"$TOOLCHAIN"; then return 0; fi
          if [ "$HOURS" -gt 0 ] && [ -f "$STAMP" ] && [ -n "$(find "$STAMP" -mmin "-$((HOURS * 60))" 2>/dev/null)" ]; then return 0; fi
          if [ "$HOURS" = 0 ]; then why="PADDOCK_RUSTUP_SYNC_HOURS is 0"
          elif [ -f "$STAMP" ]; then why="last sync older than $HOURS h"
          else why="no sync recorded on this host yet"; fi
          return 1
        }
        # Here-strings, not `printf | grep -q`: under pipefail, grep -q quitting at the first match can SIGPIPE the writer and
        # fail the pipeline, which read an installed component as missing (conformance C62).
        installed() {
          local list host c t
          # Exactly this toolchain: `rustup run` resolves "nightly" to nightly-<host>, never to a dated nightly-2026-10-01-<host>
          # or another host's; RUSTUP_AUTO_INSTALL=0 keeps rustup 1.28+ from installing (and syncing) it here.
          if ! RUSTUP_AUTO_INSTALL=0 rustup run "$TOOLCHAIN" rustc --version >/dev/null 2>&1; then why="missing the $TOOLCHAIN toolchain"; return 1; fi
          why=""
          list=$(rustup component list --installed --toolchain "$TOOLCHAIN" 2>/dev/null || true)
          # A component is listed as <name>-<host triple>, or as the bare name (rust-src); cargo is always the host's.
          host=$(sed -n 's/^cargo-//p' <<<"$list" | sed -n 1p)
          for c in $COMPONENTS; do grep -Fxq -e "$c" -e "$c-${host:-?}" <<<"$list" || why="$why component $c"; done
          list=$(rustup target list --installed --toolchain "$TOOLCHAIN" 2>/dev/null || true)
          for t in $TARGETS; do grep -Fxq "$t" <<<"$list" || why="$why target $t"; done
          if [ -n "$why" ]; then why="missing$why"; return 1; fi
        }
        # The toolchain for this job's later steps, without changing the host's default (other jobs share it).
        use_toolchain() {
          echo "RUSTUP_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
          export RUSTUP_TOOLCHAIN="$TOOLCHAIN"
          rustc --version
          cargo --version
        }
        if fresh && installed; then
          echo "Rust $TOOLCHAIN already installed with components '${COMPONENTS:-none}' and targets '${TARGETS:-none}': no sync"
          use_toolchain
          exit 0
        fi
        echo "Syncing Rust $TOOLCHAIN: $why"

        # One sync per host at a time (the host's jobs share RUSTUP_HOME): a mkdir lock with its owner recorded (its job's
        # RUNNER_TEMP, pid, host and start time). A live owner is waited for by polling, at most PADDOCK_RUSTUP_LOCK_WAIT s
        # (default 900); then the job syncs without the lock. A lock is stale when its owner's RUNNER_TEMP is gone (the runner
        # deletes it after the job and never reuses the name), when it was taken more than 2 x WAIT s ago (at least 60 s: a
        # runner that crashed or rebooted leaves its folder behind), or when it has no owner file and is more than 60 s old
        # (a job that died between mkdir and writing it). A stale lock is moved to a name of this job's own and deleted only
        # if it still has the owner read (or still none); one that changed hands meanwhile is left under its new name and
        # logged, never moved back (rule 53). Only this job's own lock is removed.
        OWNER="$(printf '%s\n' "temp=${RUNNER_TEMP:-}" "pid=$$" "host=$(hostname 2>/dev/null || echo unknown)" "since=$(date +%s)")"
        MAX_AGE=$((2 * WAIT)); if [ "$MAX_AGE" -lt 60 ]; then MAX_AGE=60; fi
        locked=0
        codes=""
        unlock() {
          if [ "$locked" = 1 ] && [ "$(cat "$LOCK/owner" 2>/dev/null)" = "$OWNER" ]; then rm -rf "$LOCK"; fi
          locked=0
        }
        trap 'unlock; if [ -n "$codes" ]; then rm -rf "$codes"; fi' EXIT
        mkdir -p "$RUSTUP_DIR"
        deadline=$(($(date +%s) + WAIT))
        n=0
        held=""
        while :; do
          if mkdir "$LOCK" 2>/dev/null; then
            if printf '%s\n' "$OWNER" >"$LOCK/owner" 2>/dev/null; then
              locked=1
              break
            fi
            rmdir "$LOCK" 2>/dev/null || true  # this job's own, still empty: an ownerless lock would hold everyone up
            echo "could not record the sync lock's owner; waiting as if it were held"
          else
            held="$(cat "$LOCK/owner" 2>/dev/null || true)"
            stale=""
            now=$(date +%s)
            if [ -z "$held" ]; then
              if [ -d "$LOCK" ] && [ -z "$(find "$LOCK" -maxdepth 0 -mmin -1 2>/dev/null)" ]; then stale="it has no owner and is more than 60 s old"; fi
            else
              held_temp="$(sed -n 's/^temp=//p' <<<"$held")"
              held_since="$(sed -n 's/^since=//p' <<<"$held")"
              if [ -n "$held_temp" ] && [ ! -d "$held_temp" ]; then stale="its job's folder $held_temp is gone"
              elif [[ "$held_since" =~ ^[0-9]+$ ]] && [ $((now - held_since)) -gt "$MAX_AGE" ]; then stale="it was taken $((now - held_since)) s ago, more than $MAX_AGE s"; fi
            fi
            if [ -n "$stale" ]; then
              n=$((n + 1))
              grave="$LOCK.stale.$$.$n"
              if [ ! -e "$grave" ] && mv "$LOCK" "$grave" 2>/dev/null; then
                if [ "$(cat "$grave/owner" 2>/dev/null || true)" = "$held" ]; then
                  rm -rf "$grave"
                  echo "Removed a stale Rust sync lock: $stale"
                else
                  echo "::warning::the Rust sync lock changed hands while it was reclaimed; left as $grave ($(tr '\n' ' ' <"$grave/owner" 2>/dev/null || true))"
                fi
              fi
              continue
            fi
          fi
          if [ "$(date +%s)" -ge "$deadline" ]; then
            echo "::warning::the Rust sync lock $LOCK is still held after ${WAIT}s (${held//$'\n'/ }); syncing without it"
            break
          fi
          sleep 2  # waiting on the lock's holder, a condition with a deadline; never a fixed delay before a retry
        done
        # Another job may have synced while this one waited.
        if [ "$locked" = 1 ] && fresh && installed; then
          echo "Rust $TOOLCHAIN was synced by another job meanwhile: no sync"
          unlock
          use_toolchain
          exit 0
        fi

        args=(--profile minimal)
        for c in $COMPONENTS; do args+=(--component "$c"); done
        for t in $TARGETS; do args+=(--target "$t"); done
        # Through run-native when Node is there: Git Bash reports any NTSTATUS crash as 127, run-native prints the raw code (hex,
        # NTSTATUS name) and rustup's last stderr lines. A crash (never an error rustup reports) gets one more try: a stated
        # mitigation for an intermittent crash whose cause the logged code is to name, not a fix.
        codes="$(mktemp -d "${TMPDIR:-/tmp}/rustup-codes.XXXXXX")"  # macOS mktemp -d alone ignores TMPDIR
        how=""
        for try in 1 2; do
          rc=0
          if command -v node >/dev/null 2>&1; then
            cf="$codes/$try"
            if [ "$RUNNER_OS" = Windows ] && command -v cygpath >/dev/null 2>&1; then cf="$(cygpath -m "$cf")"; fi  # node.exe reads C:/ paths
            node "$NATIVE" --code-file "$cf" -- rustup toolchain install "$TOOLCHAIN" "${args[@]}" --no-self-update || rc=$?
          else
            rustup toolchain install "$TOOLCHAIN" "${args[@]}" --no-self-update || rc=$?
          fi
          [ "$rc" = 0 ] && break
          crash=0
          if [ -s "$codes/$try" ]; then
            how="$(head -1 "$codes/$try")"
            case "$how" in signal* | *NTSTATUS* | *STATUS_*) crash=1 ;; esac
          else
            how="exit $rc"
            # Git Bash reports 127 for a Windows program that ended with an NTSTATUS crash code, not only for a missing one.
            if [ "$rc" = 127 ] && [ "$RUNNER_OS" = Windows ]; then
              crash=1
              how="$how: rustup was found but Windows ended it with an NTSTATUS crash code, which Git Bash reports as 127"
            fi
          fi
          echo "rustup toolchain install, try $try of 2: $how"
          if [ "$crash" != 1 ] || [ "$try" = 2 ]; then break; fi
          echo "::warning::rustup crashed ($how); trying once more"
        done
        if [ "$rc" != 0 ]; then
          case "$how" in exit*) why="$how" ;; *) why="ended with $how" ;; esac
          echo "::error::rustup could not install the $TOOLCHAIN toolchain ($why). Run 'rustup toolchain install $TOOLCHAIN' on the runner to see why."
          exit 1
        fi
        touch "$STAMP"
        # A host with no default yet (a fresh runner) gets this one, for steps that run before setup-rust (job-isolation's
        # paddock-dev build); a host that has one keeps it. Only stable or an exact version: never a dated nightly.
        if [ "$TOOLCHAIN" = stable ] || grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$' <<<"$TOOLCHAIN"; then
          if ! rustup default >/dev/null 2>&1; then rustup default "$TOOLCHAIN"; fi
        fi
        unlock
        use_toolchain
    - name: Install sccache
      shell: bash
      run: |
        set -euo pipefail
        VERSION=0.19.0
        # The pinned release on every OS (one version, one cache format). A runner that already has exactly it keeps it.
        if command -v sccache >/dev/null 2>&1 && [ "$(sccache --version | awk '{print $2}')" = "$VERSION" ]; then exit 0; fi
        case "$RUNNER_OS-$(uname -m)" in
          Linux-x86_64)            T=x86_64-unknown-linux-musl;  EXT=tar.gz; SUM=aa73c7270c997894038c0d8f0d297865f57569e1687883322bc431713d4bb9dd ;;
          Linux-aarch64|Linux-arm64) T=aarch64-unknown-linux-musl; EXT=tar.gz; SUM=3e47fc4a71b1ddd1b4294a0de9d34498922fdf41e3cd0bda5df3954e3d6deb9d ;;
          macOS-arm64)             T=aarch64-apple-darwin;       EXT=tar.gz; SUM=a35a0b7d622618774bc1bb8102d72562dfb21e619f88b153b370d7f89bc286af ;;
          Windows-x86_64)          T=x86_64-pc-windows-msvc;     EXT=zip;    SUM=28be8c61f6b2c89b9eb2869f6af7f78e6f992e78a8abae0ce855fcc129cbeac1 ;;
          *) echo "::warning::no pinned sccache release for $RUNNER_OS $(uname -m); building without the shared compile cache."; exit 0 ;;
        esac
        DEST="${RUNNER_TOOL_CACHE:-$HOME/.cache}/sccache/$VERSION"
        BIN=sccache; [ "$RUNNER_OS" = "Windows" ] && BIN=sccache.exe
        # The shared tool cache keeps a copy only while it runs and reports the pin: a copy an older install left half-written,
        # or any other version, is replaced by a verified download.
        if [ ! -x "$DEST/$BIN" ] || [ "$("$DEST/$BIN" --version 2>/dev/null | awk '{print $2}')" != "$VERSION" ]; then
          # A fresh folder of this job's own (mktemp -d, under the job's TMPDIR where job-tmpdir or job-isolation set one): the
          # archive is downloaded, verified and unpacked where no other job reads or writes; only a verified binary is renamed
          # into the shared cache.
          PART="$DEST/$BIN.part.$$"
          dl=""
          trap 'if [ -n "$dl" ]; then rm -rf "$dl"; fi; rm -f "$PART"' EXIT
          dl=$(mktemp -d "${TMPDIR:-/tmp}/sccache.XXXXXX")  # macOS mktemp -d alone ignores TMPDIR
          NAME="sccache-v$VERSION-$T"
          URL="https://github.com/mozilla/sccache/releases/download/v$VERSION/$NAME.$EXT"
          sha256() { if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1" | cut -d' ' -f1; else shasum -a 256 "$1" | cut -d' ' -f1; fi; }
          # A mismatch is deleted and fetched once more, with both hashes, the size and the first bytes logged: an error page
          # from a proxy or a cut-off transfer shows there; a wrong pin or a changed release asset mismatches twice.
          GOT=""; GOT1=""
          for try in 1 2; do
            rm -f "$dl/$NAME.$EXT"
            # A failed download must not fail the job: the build runs without the cache.
            if ! curl -fsSL --retry 3 -o "$dl/$NAME.$EXT" "$URL"; then
              echo "::warning::could not download sccache $VERSION; building without the compile cache."; exit 0
            fi
            GOT=$(sha256 "$dl/$NAME.$EXT")
            [ "$GOT" = "$SUM" ] && break
            [ -z "$GOT1" ] && GOT1="$GOT"
            echo "sccache $VERSION download $try of 2 for $T: expected SHA-256 $SUM, got $GOT ($(wc -c < "$dl/$NAME.$EXT" | tr -d ' ') bytes from $URL)"
            echo "  first bytes: $(head -c 160 "$dl/$NAME.$EXT" | LC_ALL=C tr -c '[:print:]' '.')"
          done
          if [ "$GOT" != "$SUM" ]; then
            echo "::error::sccache $VERSION checksum mismatch for $T: expected $SUM, got $GOT1 and $GOT on both downloads (a wrong pin or a changed release asset; .gitea/actions/setup-rust)"
            exit 1
          fi
          if [ "$EXT" = zip ]; then
            if command -v unzip >/dev/null 2>&1; then unzip -q "$dl/$NAME.$EXT" -d "$dl"; else powershell -NoProfile -Command "Expand-Archive -Path '$(cygpath -w "$dl/$NAME.$EXT")' -DestinationPath '$(cygpath -w "$dl")'"; fi
          else
            tar -xzf "$dl/$NAME.$EXT" -C "$dl"
          fi
          # Renamed into place whole: a runner with a shared tool cache may run two jobs that install it at once. On Windows
          # the rename fails while another job's sccache server runs the installed copy: that copy is used when it reports
          # the pin; otherwise the job builds without the cache (the EXIT trap removes the part file and the download).
          if mkdir -p "$DEST" && cp "$dl/$NAME/$BIN" "$PART" && chmod +x "$PART" && mv -f "$PART" "$DEST/$BIN"; then
            echo "sccache $VERSION installed in $DEST"
          elif [ "$("$DEST/$BIN" --version 2>/dev/null | awk '{print $2}')" = "$VERSION" ]; then
            echo "sccache $VERSION was installed in $DEST by another job meanwhile: using that copy"
          else
            echo "::warning::could not put sccache $VERSION into $DEST; building without the compile cache."
            exit 0
          fi
        fi
        echo "$DEST" >> "$GITHUB_PATH"
    - name: sccache
      shell: bash
      env:
        BACKEND: ${{ inputs.sccache-backend }}
        REDIS_ENDPOINT: ${{ inputs.sccache-redis-endpoint }}
        REDIS_DB: ${{ inputs.sccache-redis-db }}
      run: |
        set -euo pipefail
        # The Install step added the pinned copy to PATH for later steps only; this step finds it by its folder.
        PINNED="${RUNNER_TOOL_CACHE:-$HOME/.cache}/sccache/0.19.0"
        if [ -d "$PINNED" ]; then PATH="$PINNED:$PATH"; fi
        if ! command -v sccache >/dev/null 2>&1; then
          echo "::warning::sccache is not available on this runner; building without the compile cache."
          exit 0
        fi
        case "$BACKEND" in auto|redis|local) ;; *) echo "::error::sccache-backend must be auto, redis or local (got '$BACKEND')"; exit 1 ;; esac
        if [ "$BACKEND" = redis ] && [ -z "$REDIS_ENDPOINT" ]; then
          echo "::error::sccache-backend is redis but sccache-redis-endpoint is empty (set the Gitea variable SCCACHE_REDIS_ENDPOINT)"; exit 1
        fi
        # CI's own server: a host runner may run a developer's sccache on the default port 4226 with its own backend, which
        # would silently ignore the settings below. sccache-stats stops this port's server, never the default one. On a host
        # each job slot has its own port (job-isolation's ports.txt: 4227 for s1, 4228 for s2, ...), so a concurrent job's start (which
        # stops the server first) or its sccache-stats (which stops it last) never takes this job's server away.
        iso="${{ github.action_path }}/../../../conformance/ci/job-isolation.sh"
        PORT=4227
        if [ "$RUNNER_OS" != Linux ]; then PORT="$(bash "$iso" port sccache)"; fi
        export SCCACHE_SERVER_PORT="$PORT" SCCACHE_IGNORE_SERVER_IO_ERROR=1
        SETTINGS=()
        if [ "$BACKEND" = redis ] || { [ "$BACKEND" = auto ] && [ -n "$REDIS_ENDPOINT" ]; }; then
          export SCCACHE_REDIS_ENDPOINT="$REDIS_ENDPOINT" SCCACHE_REDIS_DB="${REDIS_DB:-5}"
          SETTINGS+=("SCCACHE_REDIS_ENDPOINT=$REDIS_ENDPOINT" "SCCACHE_REDIS_DB=${REDIS_DB:-5}")
          echo "sccache: shared backend $REDIS_ENDPOINT db ${REDIS_DB:-5}"
        else
          # Local disk. A host runner keeps it in the job slot's kept folder, so it outlives the job; a container uses the /sccache
          # mount the runner provides, or a folder that dies with the container (with a notice: every job then starts cold).
          SIZE=20G
          if [ "$RUNNER_OS" = Linux ]; then
            MOUNT="${PADDOCK_SCCACHE_MOUNT:-/sccache}"  # overridable so the step's test does not depend on the runner's real mount
            if [ -d "$MOUNT" ] && [ -w "$MOUNT" ]; then DIR="$MOUNT"
            else DIR="${RUNNER_TEMP:-/tmp}/sccache"; echo "::notice::no /sccache mount in this container; the compile cache lives and dies with the job."; fi
          else
            # The job slot's own cache: sccache's local storage "only supports a single sccache server at a time" (docs/Local.md),
            # so each slot's server has its own folder, and the host's budget PADDOCK_CI_SCCACHE_GB (default 40) is divided
            # between the slots (PADDOCK_CI_SLOTS), at least 2 GB each.
            DIR="$(bash "$iso" path sccache)"
            SLOTS="$(bash "$iso" slots)"
            TOTAL="${PADDOCK_CI_SCCACHE_GB:-40}"
            case "$TOTAL" in '' | *[!0-9]*) TOTAL=40 ;; esac
            PER=$((TOTAL / SLOTS)); if [ "$PER" -lt 2 ]; then PER=2; fi
            SIZE="${PER}G"
          fi
          mkdir -p "$DIR"
          if [ "$RUNNER_OS" = Windows ]; then DIR="$(cygpath -w "$DIR")"; fi
          export SCCACHE_DIR="$DIR" SCCACHE_CACHE_SIZE="$SIZE"
          SETTINGS+=("SCCACHE_DIR=$DIR" "SCCACHE_CACHE_SIZE=$SIZE")
          echo "sccache: local disk $DIR"
        fi
        sccache --version
        # A server left on this port by an earlier job would keep that job's backend: start it fresh with this job's settings.
        sccache --stop-server >/dev/null 2>&1 || true
        # The cache must slow a build down, never fail it: when the server cannot start or answer (a broken or full backend),
        # RUSTC_WRAPPER stays unset and the job builds without sccache.
        if ! sccache --start-server || ! sccache --show-stats >/dev/null 2>&1; then
          sccache --stop-server >/dev/null 2>&1 || true
          echo "::warning::the sccache server did not start; the build runs without the compile cache."
          exit 0
        fi
        # sccache itself is the wrapper, never a script around it: Windows starts a .cmd through cmd.exe, whose 8191-character
        # command line limit rustc's arguments for a large crate exceed (windows-sys). sccache puts every CARGO_* variable into its
        # cache key, CARGO_TARGET_DIR included, so a job that needs a build folder outside its checkout sets it with cargo's
        # `--config build.target-dir=...` (configuration is not hashed), not with the environment variable.
        {
          echo "RUSTC_WRAPPER=sccache"
          # Cached builds are not incremental.
          echo "CARGO_INCREMENTAL=0"
          echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1"
          echo "SCCACHE_SERVER_PORT=$PORT"
          for kv in "${SETTINGS[@]}"; do echo "$kv"; done
        } >> "$GITHUB_ENV"
    - name: Linux dependencies for Tauri
      if: runner.os == 'Linux' && inputs.tauri-linux-deps == 'true'
      shell: bash
      run: |
        SUDO=$(command -v sudo || true)
        $SUDO apt-get update
        $SUDO apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf cmake
