name: setup-rust
description: Rust toolchain with components and targets, sccache (installed, checksum-verified, when the runner has none) on the shared Redis backend, and the Tauri Linux libraries on request.
inputs:
  toolchain:
    description: Toolchain channel or version.
    default: stable
  components:
    description: Space-separated rustup components, e.g. "clippy rustfmt".
    default: ""
  targets:
    description: Space-separated extra targets.
    default: ""
  tauri-linux-deps:
    description: "Install the Linux libraries Tauri needs (webkit2gtk, gtk, rsvg, appindicator); ignored on other systems."
    default: "false"
  sccache-backend:
    description: "auto (Redis when an endpoint is set, else local disk), redis (the endpoint is required) or local (sccache's disk, e.g. for a runner whose disk beats the network)."
    default: auto
  sccache-redis-endpoint:
    description: "Shared sccache backend, e.g. redis://172.16.1.188:6379 (no path: sccache ignores it). Used on every OS; empty means sccache's local disk."
    default: ${{ vars.SCCACHE_REDIS_ENDPOINT }}
  sccache-redis-db:
    description: "Redis database number for sccache. The shared server gives sccache database 5 (docs/dev-setup.md); never another number."
    default: ${{ vars.SCCACHE_REDIS_DB }}
runs:
  using: composite
  steps:
    - name: Rust toolchain
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
        COMPONENTS: ${{ inputs.components }}
        TARGETS: ${{ inputs.targets }}
      run: |
        set -euo pipefail
        command -v rustup >/dev/null || { echo "::error::rustup is not installed on this runner"; exit 1; }
        # In the Paddock CI image (it writes /etc/paddock-ci-release) the stable toolchain and its components are already
        # there: skip the network round trip unless this job asks for extra targets or a component the image lacks.
        if [ -f /etc/paddock-ci-release ] && [ "$TOOLCHAIN" = stable ] && [ -z "$TARGETS" ]; then
          installed=$(rustup component list --installed 2>/dev/null || true)
          missing=0
          for c in $COMPONENTS; do printf '%s\n' "$installed" | grep -q "^$c-" || missing=1; done
          if [ "$missing" = 0 ]; then
            echo "Rust toolchain from the Paddock CI image (components: ${COMPONENTS:-none})"
            rustc --version
            cargo --version
            exit 0
          fi
        fi
        args=(--profile minimal)
        for c in $COMPONENTS; do args+=(--component "$c"); done
        for t in $TARGETS; do args+=(--target "$t"); done
        rustup toolchain install "$TOOLCHAIN" "${args[@]}" --no-self-update
        rustup default "$TOOLCHAIN"
        rustc --version
        cargo --version
    - name: Install sccache
      shell: bash
      run: |
        set -euo pipefail
        # Present on the runner (the garage image, the host runners): use it. Otherwise a pinned release, checksum-verified.
        if command -v sccache >/dev/null 2>&1; then exit 0; fi
        VERSION=0.18.0
        case "$RUNNER_OS-$(uname -m)" in
          Linux-x86_64)            T=x86_64-unknown-linux-musl;  EXT=tar.gz; SUM=45f1447fbe231e3037bde351ef70677dd212216c8d62ae7ca409fecc4d6acc89 ;;
          Linux-aarch64|Linux-arm64) T=aarch64-unknown-linux-musl; EXT=tar.gz; SUM=2b3284d5da3b46a47dc4229e75bb7b88ac4aa99c8d754fb7d2f84997e5a4354a ;;
          macOS-arm64)             T=aarch64-apple-darwin;       EXT=tar.gz; SUM=308184519b646f5125289e8515b36f6ca65a13a041923994aebe702348674e8e ;;
          Windows-x86_64)          T=x86_64-pc-windows-msvc;     EXT=zip;    SUM=8965c74d5e8a225244f741e18ad2f3f504f48228dc1bac948fc22761a348363d ;;
          *) echo "::warning::no pinned sccache release for $RUNNER_OS $(uname -m); building without the shared compile cache."; exit 0 ;;
        esac
        DEST="${RUNNER_TOOL_CACHE:-$HOME/.cache}/sccache/$VERSION"
        BIN=sccache; [ "$RUNNER_OS" = "Windows" ] && BIN=sccache.exe
        if [ ! -x "$DEST/$BIN" ]; then
          TMP=$(mktemp -d)
          NAME="sccache-v$VERSION-$T"
          curl -fsSL --retry 3 -o "$TMP/$NAME.$EXT" "https://github.com/mozilla/sccache/releases/download/v$VERSION/$NAME.$EXT"
          if command -v sha256sum >/dev/null 2>&1; then GOT=$(sha256sum "$TMP/$NAME.$EXT" | cut -d' ' -f1); else GOT=$(shasum -a 256 "$TMP/$NAME.$EXT" | cut -d' ' -f1); fi
          [ "$GOT" = "$SUM" ] || { echo "::error::sccache $VERSION checksum mismatch for $T (got $GOT)"; exit 1; }
          if [ "$EXT" = zip ]; then
            if command -v unzip >/dev/null 2>&1; then unzip -q "$TMP/$NAME.$EXT" -d "$TMP"; else powershell -NoProfile -Command "Expand-Archive -Path '$(cygpath -w "$TMP/$NAME.$EXT")' -DestinationPath '$(cygpath -w "$TMP")'"; fi
          else
            tar -xzf "$TMP/$NAME.$EXT" -C "$TMP"
          fi
          mkdir -p "$DEST"
          cp "$TMP/$NAME/$BIN" "$DEST/$BIN"
          chmod +x "$DEST/$BIN"
          rm -rf "$TMP"
        fi
        echo "$DEST" >> "$GITHUB_PATH"
    - name: sccache
      shell: bash
      env:
        BACKEND: ${{ inputs.sccache-backend }}
        REDIS_ENDPOINT: ${{ inputs.sccache-redis-endpoint }}
        REDIS_DB: ${{ inputs.sccache-redis-db }}
        ACTION_DIR: ${{ github.action_path }}
      run: |
        set -euo pipefail
        # The Install step added the pinned copy to PATH for later steps only; this step finds it by its folder.
        PINNED="${RUNNER_TOOL_CACHE:-$HOME/.cache}/sccache/0.18.0"
        if [ -d "$PINNED" ]; then PATH="$PINNED:$PATH"; fi
        if ! command -v sccache >/dev/null 2>&1; then
          echo "::warning::sccache is not available on this runner; building without the shared compile cache."
          exit 0
        fi
        case "$BACKEND" in auto|redis|local) ;; *) echo "::error::sccache-backend must be auto, redis or local (got '$BACKEND')"; exit 1 ;; esac
        # sccache puts every CARGO_* variable into its cache key, CARGO_TARGET_DIR included. A job that sets it to a folder next
        # to its checkout (host runners: a per-job hashed work folder) would never hit; the wrapper drops it before sccache sees it.
        WRAPPER=sccache
        if [ -n "${CARGO_TARGET_DIR:-}${CARGO_BUILD_TARGET_DIR:-}" ]; then
          if [ "$RUNNER_OS" = Windows ]; then WRAPPER="$(cygpath -w "$(cygpath -u "$ACTION_DIR")/rustc-wrapper.cmd")"
          else WRAPPER="$ACTION_DIR/rustc-wrapper.sh"; chmod +x "$WRAPPER" 2>/dev/null || true; fi
        fi
        {
          echo "RUSTC_WRAPPER=$WRAPPER"
          # Cached builds are not incremental; an unreachable cache must slow a build down, never fail it.
          echo "CARGO_INCREMENTAL=0"
          echo "SCCACHE_IGNORE_SERVER_IO_ERROR=1"
          # CI's own server: a host runner may run a developer's sccache on the default port 4226 with its own backend, which
          # would silently ignore the settings below. sccache-stats stops this port's server, never the default one.
          echo "SCCACHE_SERVER_PORT=4227"
        } >> "$GITHUB_ENV"
        export SCCACHE_SERVER_PORT=4227
        if [ "$BACKEND" = redis ] && [ -z "$REDIS_ENDPOINT" ]; then
          echo "::error::sccache-backend is redis but sccache-redis-endpoint is empty (set the Gitea variable SCCACHE_REDIS_ENDPOINT)"; exit 1
        fi
        # Every OS uses the shared server when asked (the cache keys include compiler and target); local disk is the fallback.
        if [ "$BACKEND" != local ] && [ -n "$REDIS_ENDPOINT" ]; then
          echo "SCCACHE_REDIS_ENDPOINT=$REDIS_ENDPOINT" >> "$GITHUB_ENV"
          echo "SCCACHE_REDIS_DB=${REDIS_DB:-5}" >> "$GITHUB_ENV"
          echo "sccache: shared backend $REDIS_ENDPOINT db ${REDIS_DB:-5}"
          # GITHUB_ENV reaches the next steps only; the server started below needs the settings now.
          export SCCACHE_REDIS_ENDPOINT="$REDIS_ENDPOINT" SCCACHE_REDIS_DB="${REDIS_DB:-5}" SCCACHE_IGNORE_SERVER_IO_ERROR=1
        else
          echo "sccache: local disk"
        fi
        sccache --version
        # A server left on this port by an earlier job would keep that job's backend: start it fresh with this job's settings.
        sccache --stop-server >/dev/null 2>&1 || true
        rm -f "$HOME/.paddock-ci/sccache-server.log"; mkdir -p "$HOME/.paddock-ci"; export SCCACHE_LOG=debug SCCACHE_ERROR_LOG="$HOME/.paddock-ci/sccache-server.log" # DIAG-TEMP
        sccache --start-server || echo "::warning::the sccache server did not start; the build runs without the shared cache."
    - name: Linux dependencies for Tauri
      if: runner.os == 'Linux' && inputs.tauri-linux-deps == 'true'
      shell: bash
      run: |
        SUDO=$(command -v sudo || true)
        $SUDO apt-get update
        $SUDO apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf cmake
