name: tauri-bundle
description: "Builds the installers with tauri build (updater-signed when both keys are given; the key reaches tauri build only, and a CI run that is not a tag signs with a throw-away key), copies them and their signatures to dist/, and checks they carry this build's version. An NSIS or AppImage build uses the pinned bundler tools in <build folder>/.tauri; branch runs keep the verified downloads in actions/cache, tag runs download them."
inputs:
  bundles:
    description: "Bundle list: nsis | deb,appimage | app,dmg."
    required: true
  app-dir:
    description: The folder with src-tauri/ and package.json.
    default: app
  root:
    description: "Where `npm ci` runs (default: app-dir; in the monorepo the repository root, whose one lock installs every app)."
    default: ""
  prepare:
    description: "A command run in `root` right after `npm ci` (an app whose UI imports the shared library builds it: npm run build -w ui)."
    default: ""
  apple-signing-identity:
    description: "APPLE_SIGNING_IDENTITY (a secret). Empty or unset keeps the ad-hoc seal (rule 23); a real identity turns the hardened runtime on."
    default: ""
  signing-private-key:
    description: TAURI_SIGNING_PRIVATE_KEY (a secret); the key is stripped of whitespace first.
    default: ""
  signing-key-password:
    description: TAURI_SIGNING_PRIVATE_KEY_PASSWORD (a secret).
    default: ""
  updater-pubkey:
    description: TAURI_UPDATER_PUBKEY (a secret); stripped of whitespace first.
    default: ""
runs:
  using: composite
  steps:
    # The pinned bundler tools (conformance/ci/tauri-tools.mjs), SHA-256 checked on every use. In the Linux container the
    # AppImage tools are kept in actions/cache under a key made of their versions and hashes, so a warm cache bundles with
    # GitHub unreachable (a Windows host keeps the NSIS downloads in its own folder, LOCALAPPDATA). Branch and dispatch runs
    # only: a tag run reads no cache at all (ADR 0085 D9) and downloads them; tauri-tools.mjs ignores a kept folder on a tag too.
    - name: Bundler tools cache key
      id: tools
      if: "runner.os == 'Linux' && !startsWith(github.ref, 'refs/tags/')"
      shell: bash
      env:
        BUNDLES: ${{ inputs.bundles }}
      run: |
        set -euo pipefail
        dir="${XDG_CACHE_HOME:-$HOME/.cache}/paddock-tauri-tools"
        case "$dir" in /*) ;; *) dir="$HOME/.cache/paddock-tauri-tools" ;; esac
        key="$(node "${{ github.action_path }}/../../../conformance/ci/tauri-tools.mjs" key --bundles "$BUNDLES")"
        echo "dir=$dir" >> "$GITHUB_OUTPUT"
        echo "key=$key" >> "$GITHUB_OUTPUT"
        echo "PADDOCK_TAURI_TOOLS_CACHE=$dir" >> "$GITHUB_ENV"
    - uses: actions/cache@v4
      if: steps.tools.outputs.key != ''
      with:
        path: ${{ steps.tools.outputs.dir }}
        key: ${{ steps.tools.outputs.key }}
    - shell: bash
      env:
        BUNDLES: ${{ inputs.bundles }}
        APP_DIR: ${{ inputs.app-dir }}
        ROOT: ${{ inputs.root }}
        PREPARE: ${{ inputs.prepare }}
        APPLE_SIGNING_IDENTITY: ${{ inputs.apple-signing-identity }}
        TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.signing-private-key }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.signing-key-password }}
        TAURI_UPDATER_PUBKEY: ${{ inputs.updater-pubkey }}
      run: |
        args=(--app-dir "$APP_DIR" --root "${ROOT:-$APP_DIR}")
        if [ -n "$PREPARE" ]; then args+=(--prepare "$PREPARE"); fi
        bash "${{ github.action_path }}/../../../conformance/ci/tauri-bundle.sh" "$BUNDLES" "${args[@]}"
