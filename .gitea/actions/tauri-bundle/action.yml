name: tauri-bundle
description: "Builds the installers with tauri build (updater-signed when both keys are given), copies them and their signatures to dist/, and checks they carry this build's version. An AppImage build uses the pinned linuxdeploy and AppRun, kept in actions/cache."
inputs:
  bundles:
    description: "Bundle list: nsis | deb,appimage | app,dmg."
    required: true
  app-dir:
    description: The folder with src-tauri/ and package.json.
    default: app
  root:
    description: "Where `npm ci` runs (default: app-dir; in the monorepo the repository root, whose one lock installs every app)."
    default: ""
  prepare:
    description: "A command run in `root` right after `npm ci` (an app whose UI imports the shared library builds it: npm run build -w ui)."
    default: ""
  apple-signing-identity:
    description: "APPLE_SIGNING_IDENTITY (a secret). Empty or unset keeps the ad-hoc seal (rule 23); a real identity turns the hardened runtime on."
    default: ""
  signing-private-key:
    description: TAURI_SIGNING_PRIVATE_KEY (a secret); the key is stripped of whitespace first.
    default: ""
  signing-key-password:
    description: TAURI_SIGNING_PRIVATE_KEY_PASSWORD (a secret).
    default: ""
  updater-pubkey:
    description: TAURI_UPDATER_PUBKEY (a secret); stripped of whitespace first.
    default: ""
runs:
  using: composite
  steps:
    # An AppImage build: keep the pinned linuxdeploy and AppRun (conformance/ci/appimage-tools.mjs, SHA-256 checked on every
    # use) in actions/cache under a key made of their versions and hashes, so a warm cache bundles with GitHub unreachable.
    # ADR 0022's "release jobs bypass every cache" is about running a cached build of our own tool; this cache is allowed on
    # release and tag runs because every file in it is re-hashed against its pin before use, so it can only save a download.
    - name: AppImage tools cache key
      id: appimage
      if: runner.os == 'Linux' && contains(format(',{0},', inputs.bundles), ',appimage,')
      shell: bash
      run: |
        set -euo pipefail
        dir="${XDG_CACHE_HOME:-$HOME/.cache}/paddock-appimage-tools"
        case "$dir" in /*) ;; *) dir="$HOME/.cache/paddock-appimage-tools" ;; esac
        key="$(node "${{ github.action_path }}/../../../conformance/ci/appimage-tools.mjs" key)"
        echo "dir=$dir" >> "$GITHUB_OUTPUT"
        echo "key=$key" >> "$GITHUB_OUTPUT"
        echo "PADDOCK_APPIMAGE_TOOLS=$dir" >> "$GITHUB_ENV"
    - uses: actions/cache@v4
      if: steps.appimage.outputs.key != ''
      with:
        path: ${{ steps.appimage.outputs.dir }}
        key: ${{ steps.appimage.outputs.key }}
    - shell: bash
      env:
        BUNDLES: ${{ inputs.bundles }}
        APP_DIR: ${{ inputs.app-dir }}
        ROOT: ${{ inputs.root }}
        PREPARE: ${{ inputs.prepare }}
        APPLE_SIGNING_IDENTITY: ${{ inputs.apple-signing-identity }}
        TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.signing-private-key }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.signing-key-password }}
        TAURI_UPDATER_PUBKEY: ${{ inputs.updater-pubkey }}
      run: |
        args=(--app-dir "$APP_DIR" --root "${ROOT:-$APP_DIR}")
        if [ -n "$PREPARE" ]; then args+=(--prepare "$PREPARE"); fi
        bash "${{ github.action_path }}/../../../conformance/ci/tauri-bundle.sh" "$BUNDLES" "${args[@]}"
