name: build-jobs
description: "CARGO_BUILD_JOBS (and NEXTEST_TEST_THREADS, the job's core share, or the runner's PADDOCK_CI_TEST_THREADS) for the job: the smaller of the host's cores and RAM divided by the jobs the host runs at once (runner.envs PADDOCK_CI_JOBS_PER_HOST, PADDOCK_CI_RESERVED_CORES, PADDOCK_CI_RESERVED_RAM_MB, else the runner class's known layout; Linux keeps cargo's default until its share is measured), or the runner's PADDOCK_CI_BUILD_JOBS (`./dev ci build-jobs`; tools/paddock-dev/tests/it/build_jobs.rs holds its output). An early step of a job (after Git bash on Windows, before job-isolation, which builds paddock-dev); setup-rust runs it too when no earlier step set CARGO_BUILD_JOBS."
inputs:
  split:
    description: "How many builds the job runs at once (cargo mutants --jobs N): each gets 1/split of the share."
    default: "1"
runs:
  using: composite
  steps:
    - name: Build jobs for this runner
      shell: bash
      env:
        SPLIT: ${{ inputs.split }}
      # A failed setup marks the job (PADDOCK_JOB_ABORTED=1, which the later `!cancelled()` steps test, conformance C117), so those steps
      # do not run without the job's core share (run 8027: the crate job on Windows ran its tests after ./dev could not be built).
      run: |
        bash "${{ github.action_path }}/../../../dev" ci build-jobs "$SPLIT" && exit 0
        rc=$?
        echo "::error::A job setup step failed (exit $rc: ./dev ci build-jobs). The job's later steps are skipped, because they would run without the slot, temp folders and core share that step sets up. Read the error above it, fix that, and rerun the job."
        if [ -n "${GITHUB_ENV:-}" ]; then echo "PADDOCK_JOB_ABORTED=1" >> "$GITHUB_ENV" || true; fi
        exit "$rc"
