name: install-test-browser
description: "Installs the pinned Chrome for Testing (SHA-256 checked) and sets CHROMIUM_TEST_PATH and <PREFIX>_REQUIRE_TEST_BROWSER=1, so tests never use an installed browser (rule 7) and a missing browser fails instead of skipping."
inputs:
  catalogue:
    description: A paddock-runtime catalogue (crates/paddock-chromium/src/chromium.toml, the build the apps download). Give this, pin or rust-source.
    default: ""
  pin:
    description: A JSON pin file { version, base, sums }. Give this, catalogue or rust-source.
    default: ""
  rust-source:
    description: A Rust source holding PINNED_VERSION, BASE and the checksum table (Debrief's runtime.rs).
    default: ""
  env-prefix:
    description: Upper-case app prefix for the REQUIRE variable (DEBRIEF gives DEBRIEF_REQUIRE_TEST_BROWSER).
    required: true
  dir:
    description: Where to install it.
    default: ${{ runner.temp }}/paddock-test-browser
runs:
  using: composite
  steps:
    - shell: bash
      env:
        CATALOGUE: ${{ inputs.catalogue }}
        PIN: ${{ inputs.pin }}
        RUST_SOURCE: ${{ inputs.rust-source }}
        PREFIX: ${{ inputs.env-prefix }}
        DIR: ${{ inputs.dir }}
        INSTALLER: ${{ github.action_path }}/../../../conformance/ci/install-test-browser.mjs
      run: |
        set -euo pipefail
        args=(--dir "$DIR" --env-prefix "$PREFIX")
        if [ -n "$CATALOGUE" ]; then args+=(--catalogue "$CATALOGUE"); fi
        if [ -n "$PIN" ]; then args+=(--pin "$PIN"); fi
        if [ -n "$RUST_SOURCE" ]; then args+=(--rust-source "$RUST_SOURCE"); fi
        # The installer prints CHROMIUM_TEST_PATH and appends it to $GITHUB_ENV. A run that exits 0 without it (as when Node did not
        # see the script as its main module through a linked work folder) would leave the tests to fail later with a misleading
        # message: fail here instead.
        out=$(node "$INSTALLER" "${args[@]}")
        printf '%s\n' "$out"
        case "$out" in
          *CHROMIUM_TEST_PATH=*) ;;
          *) echo "::error::install-test-browser printed no CHROMIUM_TEST_PATH ($INSTALLER)"; exit 1 ;;
        esac
