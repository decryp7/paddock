name: nightly-mark
description: "Records a fully green scheduled run for this commit; plan skips the next scheduled run while main is unchanged. Use it in a job that needs every other job, with if: github.event_name == 'schedule' && success()."
runs:
  using: composite
  steps:
    - name: Marker file
      shell: bash
      run: |
        mkdir -p .nightly-green
        echo "${{ github.sha }}" > .nightly-green/sha
    - uses: actions/cache/save@v4
      with:
        path: .nightly-green
        key: nightly-green-${{ github.sha }}
