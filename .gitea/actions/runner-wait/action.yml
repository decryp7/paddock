name: runner-wait
description: "A train run waits in its own first job: on a workflow_dispatch run of a train/* branch, wait (on this Linux job, at most max) until no older run has an unfinished job on the Mac or Windows runner this workflow needs (./dev ci runner-wait). `./dev ci dispatch` sends such a train at once, so the queued run is what scheduled runs yield to (ci schedule-skip). Any other event or ref: nothing. Fails open (a warning) when the runs cannot be read; fails the job, naming the busy run, at max. Put it in a job with no needs, after the checkout, and make every macOS or Windows job need that job (conformance checks it)."
inputs:
  max:
    # ER-12: the measured span this limit must cover, recorded in docs/benchmarks.md ("How long a run holds the Mac and Windows
    # runners", 2026-11-15): over the newest 200 runs (2026-11-10 to 11-15) the macOS/Windows jobs of one run spanned at most
    # 94.6 min since 2026-11-13 (run 8047), p95 130.1 min; the six spans over 150 min (up to 327.9 min, run 7925) were the
    # overlapping runs of 2026-11-11 that one Mac-heavy run at a time removes. Under act_runner's default 3 h job timeout.
    # Linux slots: this job holds one of the three (docs/ci-schedules.md) while it waits. `./dev ci dispatch` lets at most two
    # train runs wait at once (MAX_TRAIN_WAITERS = LINUX_SLOTS - 1 in tools/paddock-dev/src/ci_runs/dispatch.rs), so one slot
    # stays free for the older runs' own Linux jobs; a train dispatches up to eight workflows that use this action.
    description: "The longest to wait: 2h30m covers every measured run since 2026-11-13 (longest 94.6 min) and stays under act_runner's default 3 h job timeout."
    default: "2h30m"
  token:
    description: Token that reads the repository's Actions runs (the job token can).
    default: ${{ github.token }}
  dev-token:
    description: "Read token of the private package store for ./dev's prebuilt download (ADR 0022 R0b); empty: ./dev builds the tool. Pass BUILD_INPUTS_TOKEN."
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/train/')
      env:
        PLAN_TOKEN: ${{ inputs.token }}
        PADDOCK_DEV_TOKEN: ${{ inputs.dev-token }}
        PADDOCK_DEV_DOWNLOAD: ${{ startsWith(github.ref, 'refs/tags/') && '0' || '' }}
        RUN_ID: ${{ github.run_id }}
        MAX: ${{ inputs.max }}
      run: bash "${{ github.action_path }}/../../../dev" ci runner-wait --run-id "$RUN_ID" --max "$MAX"
