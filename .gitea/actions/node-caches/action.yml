name: node-caches
description: "Keeps npm's download cache and the Angular build cache between runs: on a host runner in the CI home's kept folders (job-isolation: npm shared, angular/<name>-<slot> per job slot), in a Linux container on the runner's /sccache mount (its npm/ and angular/ subfolders); a container without the mount keeps both in the job (a notice says so)."
inputs:
  angular-dir:
    description: "The Angular workspace whose .angular/cache is kept (relative to the checkout); empty keeps only the npm cache."
    default: ui
  name:
    description: "The Angular cache's folder: one per job (and per matrix shard; on a host the job's slot is appended), because two builds must not write one cache at once."
    default: ${{ github.job }}
runs:
  using: composite
  steps:
    - name: npm and Angular caches
      shell: bash
      env:
        ANGULAR_DIR: ${{ inputs.angular-dir }}
        NAME: ${{ inputs.name }}
      run: bash "${{ github.action_path }}/../../../conformance/ci/kit.sh" host node-caches "$ANGULAR_DIR" "$NAME"
