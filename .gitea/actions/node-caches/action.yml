name: node-caches
description: "Keeps npm's download cache and the Angular build cache between runs: on a host runner in the job slot's own kept folders (job-isolation: npm-<slot> and angular/<name>-<slot>); in a Linux container in the job's own folders under RUNNER_TEMP, filled and kept through actions/cache (the runners' RustFS S3): npm keyed by OS, Node and the lockfile with restore-keys, Angular by the lockfile (which holds the Angular version) and the app's sources, with none. No folder of the shared /sccache mount is used (ADR 0111). The job summary gets each cache's key and hit or miss; the save runs in actions/cache's post step, whose log says if it failed."
inputs:
  angular-dir:
    description: "The Angular workspace whose .angular/cache is kept (relative to the checkout); empty keeps only the npm cache."
    default: ui
  name:
    description: "The Angular cache's folder: one per job (and per matrix shard; on a host the job's slot is appended), because two builds must not write one cache at once."
    default: ${{ github.job }}
runs:
  using: composite
  steps:
    - name: npm and Angular caches
      shell: bash
      env:
        ANGULAR_DIR: ${{ inputs.angular-dir }}
        NAME: ${{ inputs.name }}
      run: bash "${{ github.action_path }}/../../../conformance/ci/kit.sh" host node-caches "$ANGULAR_DIR" "$NAME"
    # Linux containers only (a host keeps its slot's folders): the folders node-caches made are filled from, and saved to, the Actions
    # cache. The save is actions/cache's post step at the end of the job and only for a miss on a green job.
    - name: Node version for the cache key
      id: node
      if: runner.os == 'Linux'
      shell: bash
      run: echo "version=$(node --version 2>/dev/null || echo none)" >> "$GITHUB_OUTPUT"
    - name: npm download cache
      id: npm-cache
      if: runner.os == 'Linux'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/node-caches/npm
        key: npm-v1-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.node.outputs.version }}-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          npm-v1-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.node.outputs.version }}-
    - name: Angular build cache
      id: angular-cache
      if: runner.os == 'Linux' && inputs.angular-dir != ''
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/node-caches/angular
        # The lockfile pins the Angular version; the sources are what the cache was built from. No restore-keys.
        key: ng-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.name }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles(format('{0}/projects/**', inputs.angular-dir), format('{0}/src/**', inputs.angular-dir), format('{0}/angular.json', inputs.angular-dir)) }}
    - name: Cache summary
      if: always() && runner.os == 'Linux'
      shell: bash
      env:
        NPM_KEY: ${{ steps.npm-cache.outputs.cache-primary-key }}
        NPM_HIT: ${{ steps.npm-cache.outputs.cache-hit }}
        NG_KEY: ${{ steps.angular-cache.outputs.cache-primary-key }}
        NG_HIT: ${{ steps.angular-cache.outputs.cache-hit }}
      run: |
        # cache-hit is "true" for an exact key, "false" for a restore-keys or no match, and empty when the step did not run.
        line() { # <name> <key> <hit>
          case "$3" in
            true) echo "- $1 cache \`$2\`: hit" ;;
            false) echo "- $1 cache \`$2\`: miss (it is saved by the post step at the end of the job when the job succeeds; a failed save is only a warning in that step's log)" ;;
            *) echo "- $1 cache: not measured (the step did not run)" ;;
          esac
        }
        { line npm "$NPM_KEY" "$NPM_HIT"; [ -z "$NG_KEY" ] || line Angular "$NG_KEY" "$NG_HIT"; } | tee -a "$GITHUB_STEP_SUMMARY"
