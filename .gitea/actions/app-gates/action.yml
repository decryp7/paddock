name: app-gates
description: "One app's matrix leg in the monorepo (ADR 0014 §6): the app's own commands from apps/<app>/paddock.ci.json (prepare, checks, UI checks), and the Rust gates of its Cargo workspace (fmt, clippy, nextest, doc tests, deny), only for the halves the change reaches. On Windows and macOS legs (paddock.ci.json `os`) the Rust half skips what one OS decides for all: fmt and deny run on Linux only, clippy not on Windows (as the crates leg). The caller checks out, sets up Rust and runs `npm ci` at the root; the inputs come from the plan job's matrix (scripts/affected.mjs)."
inputs:
  app:
    description: The app (its folder under apps/).
    required: true
  cargo:
    description: The app's Cargo workspace folder from the repo root (apps/shell-demo/src-tauri); empty for an app without Rust.
    default: ""
  nextest-config:
    description: A nextest config file from the repo root (crates/.config/nextest.toml); empty uses the workspace's own.
    default: ""
  prepare:
    description: Commands from the repo root before either half, one per line (build the UI the app embeds).
    default: ""
  checks:
    description: Commands from the repo root that always run, one per line (release facts).
    default: ""
  rust-checks:
    description: Commands from the repo root that run only when the Rust half does (a coverage guard, tests in another time zone), one per line. Linux leg only.
    default: ""
  host-rust-checks:
    description: "Commands from the repo root that run only when the Rust half does, on the Windows and macOS legs, after the Rust step (its clippy and tests), one per line. For a check that must see a build the tests do not make (a non-test `cargo check`, where dev-dependency features are not unified in). Host legs only."
    default: ""
  ui-checks:
    description: Commands from the repo root for the UI half, one per line (lint, unit tests, Chromium e2e).
    default: ""
  e2e-checks:
    description: "Commands from the repo root for an end-to-end leg, one per line; $E2E_SHARD (i/N) and $E2E_INDEX (i) are set. Empty: not an end-to-end leg."
    default: ""
  e2e-shard:
    description: "This leg's shard, i/N (paddock.ci.json e2eShards)."
    default: ""
  rust:
    description: "'true' runs the Rust half."
    default: "true"
  ui:
    description: "'true' runs the UI half."
    default: "true"
  last-packages:
    description: "Space-separated packages whose tests run after the rest, on Linux only (a Tauri shell whose build overwrites a binary the other tests start); host legs leave them out of clippy, tests and doc tests. Empty: none."
    default: ""
  windows-clippy:
    description: "'true' also runs clippy on the Windows leg (default: skipped there, as the crates leg: one OS decides lints for all). For an app whose Windows-only code (a service) clippy must see."
    default: "false"
  notices:
    description: "'true' also checks the app's THIRD_PARTY_NOTICES.md is up to date (its paddock.ci.json `notices` block, scripts/notices.sh): cargo-about pinned to 0.9.2, Linux leg only."
    default: "false"
  filter:
    description: "A nextest filterset for a pull request that reaches only part of the workspace (package(=a) | package(=b)); empty runs every test."
    default: ""
  display:
    description: "'true' runs the tests on Linux under a virtual display and a session bus (xvfb-run, dbus-run-session): an app whose tests open a real (off-screen) browser window."
    default: "false"
runs:
  using: composite
  steps:
    - name: Prepare (${{ inputs.app }})
      id: prepare
      if: inputs.prepare != '' && (inputs.rust == 'true' || inputs.ui == 'true')
      shell: bash
      env:
        COMMANDS: ${{ inputs.prepare }}
      run: bash "${{ github.action_path }}/../../../conformance/ci/run-commands.sh"

    - name: Checks (${{ inputs.app }})
      if: inputs.checks != ''
      shell: bash
      env:
        COMMANDS: ${{ inputs.checks }}
      run: bash "${{ github.action_path }}/../../../conformance/ci/run-commands.sh"

    # Third-party notices (Rust through cargo-about, npm through the root lock) are generated output: the committed file must equal
    # what the dependencies produce now (a new dependency or a version bump changes it).
    - name: Install cargo-about (${{ inputs.app }})
      if: ${{ !cancelled() && steps.prepare.outcome != 'failure' && inputs.notices == 'true' && runner.os == 'Linux' }}
      uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2
      with:
        tool: cargo-about@0.9.2

    - name: Check the notices (${{ inputs.app }})
      if: ${{ !cancelled() && steps.prepare.outcome != 'failure' && inputs.notices == 'true' && runner.os == 'Linux' }}
      shell: bash
      env:
        APP: ${{ inputs.app }}
      run: bash "${{ github.action_path }}/../../../scripts/notices.sh" "$APP" --check

    - name: Rust checks (${{ inputs.app }})
      if: ${{ !cancelled() && steps.prepare.outcome != 'failure' && inputs.rust-checks != '' && inputs.rust == 'true' }}
      shell: bash
      env:
        COMMANDS: ${{ inputs.rust-checks }}
      run: bash "${{ github.action_path }}/../../../conformance/ci/run-commands.sh"

    # Every step of the Rust half runs even after another failed (clippy and nextest each name what broke), and the steps after a
    # failed check (`checks`, `rust-checks`) still run, so one run reports every failure (`!cancelled()`).
    - name: Rust (${{ inputs.app }}; fmt, clippy, tests on the mock runtime, doc tests, deny)
      if: ${{ !cancelled() && steps.prepare.outcome != 'failure' && inputs.rust == 'true' && inputs.cargo != '' }}
      shell: bash
      # The stable checkout path on a host runner (stable-workspace), so sccache sees the same working folder every run.
      working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/${{ inputs.cargo }}
      env:
        NEXTEST_CONFIG: ${{ inputs.nextest-config }}
        FILTER: ${{ inputs.filter }}
        DISPLAY_TESTS: ${{ inputs.display }}
        LAST_PACKAGES: ${{ inputs.last-packages }}
        WINDOWS_CLIPPY: ${{ inputs.windows-clippy }}
      run: |
        set -uo pipefail
        status=0
        # A failed step prints one error annotation with its command and, for nextest, the failing tests (ER-27): the
        # step's output is kept in a file and its FAIL/TIMEOUT/SIG* lines (colours removed) name them, the first ten.
        step() {
          echo "::group::$*"
          local log rc names; log=$(mktemp)
          # act runs `bash -e -o pipefail`: a bare failing pipeline would end the step here, so test it and read PIPESTATUS first.
          if "$@" 2>&1 | tee "$log"; then rc=0; else rc=${PIPESTATUS[0]}; fi
          if [ "$rc" -ne 0 ]; then
            status=1
            names=$(sed $'s/\x1b\\[[0-9;]*m//g' "$log" | sed -nE 's/^ *(FAIL|TIMEOUT|SIGABRT|SIGSEGV|SIGKILL|LEAK-FAIL) +\[[^]]*\] +(\([^)]*\) +)?//p' | sort -u | sed -n '1,10p' | paste -sd ';' - | sed 's/;/; /g')
            echo "::error::failed (exit $rc): $*${names:+ | failing tests: $names}"
          fi
          rm -f "$log"
          echo "::endgroup::"
        }
        config=()
        if [ -n "$NEXTEST_CONFIG" ]; then config=(--config-file "${PADDOCK_WORKSPACE:-$GITHUB_WORKSPACE}/$NEXTEST_CONFIG"); fi
        filter=()
        if [ -n "$FILTER" ]; then echo "::notice::nextest runs only the crates this change reaches: $FILTER"; filter=(-E "$FILTER"); fi
        # last-packages: tested apart after the rest on Linux; a host leg leaves them out altogether.
        exclude=(); last=()
        for pkg in $LAST_PACKAGES; do exclude+=(--exclude "$pkg"); last+=(-p "$pkg"); done
        hostexclude=(); if [ "$RUNNER_OS" != Linux ]; then hostexclude=(${exclude[@]+"${exclude[@]}"}); fi
        # Format, advisories and licences do not depend on the OS; clippy is skipped on Windows like the crates leg unless the app opts in (windowsClippy).
        if [ "$RUNNER_OS" = Linux ]; then step cargo fmt --all --check; fi
        if [ "$RUNNER_OS" != Windows ] || [ "$WINDOWS_CLIPPY" = true ]; then step cargo clippy --workspace ${hostexclude[@]+"${hostexclude[@]}"} --all-targets -- -D warnings; fi
        wrap=()
        if [ "$DISPLAY_TESTS" = true ] && [ "$RUNNER_OS" = Linux ]; then wrap=(xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" dbus-run-session --); fi
        step ${wrap[@]+"${wrap[@]}"} cargo nextest run --workspace ${exclude[@]+"${exclude[@]}"} ${config[@]+"${config[@]}"} --profile ci ${filter[@]+"${filter[@]}"}
        if [ "$RUNNER_OS" = Linux ] && [ ${#last[@]} -gt 0 ]; then step ${wrap[@]+"${wrap[@]}"} cargo nextest run ${last[@]+"${last[@]}"} ${config[@]+"${config[@]}"} --profile ci --no-tests=pass ${filter[@]+"${filter[@]}"}; fi
        step cargo test --workspace ${hostexclude[@]+"${hostexclude[@]}"} --doc
        if [ "$RUNNER_OS" = Linux ]; then step cargo deny --all-features --workspace check; fi
        exit $status

    # After the Rust step, in the same job and with the same preparation (toolchain, caches, `prepare`), on the host legs only: a build with
    # no test targets, which clippy --all-targets and nextest never make (Dyno ADR 0033 section 3.2).
    - name: Host Rust checks (${{ inputs.app }})
      if: ${{ !cancelled() && steps.prepare.outcome != 'failure' && inputs.host-rust-checks != '' && inputs.rust == 'true' && runner.os != 'Linux' }}
      shell: bash
      # The stable checkout path of a host leg (stable-workspace), like the Rust step: sccache keys a compile on its working folder.
      working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}
      env:
        COMMANDS: ${{ inputs.host-rust-checks }}
      run: bash "${{ github.action_path }}/../../../conformance/ci/run-commands.sh"

    - name: UI (${{ inputs.app }})
      if: ${{ !cancelled() && steps.prepare.outcome != 'failure' && inputs.ui == 'true' && inputs.ui-checks != '' }}
      shell: bash
      env:
        COMMANDS: ${{ inputs.ui-checks }}
      run: bash "${{ github.action_path }}/../../../conformance/ci/run-commands.sh"

    - name: End-to-end tests (${{ inputs.app }} ${{ inputs.e2e-shard }})
      if: ${{ !cancelled() && steps.prepare.outcome != 'failure' && inputs.e2e-checks != '' }}
      shell: bash
      env:
        COMMANDS: ${{ inputs.e2e-checks }}
        E2E_SHARD: ${{ inputs.e2e-shard }}
      run: |
        export E2E_INDEX="${E2E_SHARD%%/*}"
        bash "${{ github.action_path }}/../../../conformance/ci/run-commands.sh"
