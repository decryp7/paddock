# Nightly benchmark workflow for a Paddock app (plan X26, rule 16). Copy to the app's `.gitea/workflows/bench.yml` and set the
# three `APP_*` values and the benchmark command. The benchmark writes `bench/<app>.results.json` (paddock_bench::Results);
# the budgets live in `bench/budgets.toml`; the previous night's results come from the cache, so a regression beyond
# `regression_pct` fails even inside the limit. The run is skipped while main is unchanged since the last green night.
#
# Pin the paddock actions to a release tag; Renovate bumps it with the crates.

name: bench

on:
  schedule:
    - cron: "3 14 * * *" # 22:03 UTC+8, a night slot (see docs/ci-schedules.md in the Paddock repo)
  workflow_dispatch:

env:
  APP_ID: myapp                       # the app's id (results file bench/<id>.results.json)
  # Bounded (rule 89): the app's .config/nextest.toml needs a `bench` profile with its measured bound (see apps/debrief).
  BENCH_COMMAND: cargo nextest run --profile bench --release -p myapp-core --test bench --no-capture
  PADDOCK_BENCH_VERSION: "0.1"        # the paddock-bench crate (registry decryp7)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.plan.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 1 }
      - id: plan
        uses: decryp7/paddock/.gitea/actions/plan@v0.3.0

  bench:
    needs: [plan]
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: decryp7/paddock/.gitea/actions/setup-rust@v0.3.0

      # Last green night's results, for the regression check. Exact key per night, newest restored by prefix.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: previous
        with:
          path: bench/previous
          key: bench-previous-${{ github.run_id }}
          restore-keys: bench-previous-
      # The report of the cache step (ADR 0115: restore, hit as exact, partial or miss, from the step's own outputs). A template runs in
      # another repository, pinned to a Paddock tag that need not have the cache-report action, so it prints the same line inline
      # (conformance/ci/cache-report.sh is the one definition; `./dev ci cache-audit` reads the `cache-report:` line).
      - name: Cache report
        if: always()
        shell: bash
        env:
          HIT: ${{ steps.previous.outputs.cache-hit }}
          MATCHED: ${{ steps.previous.outputs.cache-matched-key }}
        run: |
          o=miss; if [ "$HIT" = true ]; then o=exact; elif [ -n "$MATCHED" ]; then o=partial; fi
          echo "- bench-previous cache: restored: $o; saved: by the save step below" | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"

      - name: Benchmarks
        run: ${{ env.BENCH_COMMAND }}

      - name: Install paddock-bench
        run: cargo install paddock-bench --version "${PADDOCK_BENCH_VERSION}" --registry decryp7 --locked

      - name: Check the budgets
        shell: bash
        run: |
          set -o pipefail
          args=(--budgets bench/budgets.toml --results "bench/${APP_ID}.results.json")
          [ -f "bench/previous/${APP_ID}.results.json" ] && args+=(--previous "bench/previous/${APP_ID}.results.json")
          paddock-bench check "${args[@]}" --markdown | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"

      # Saved only after the budgets held, so a bad night never becomes the baseline.
      - name: Keep these results as the baseline
        run: mkdir -p bench/previous && cp "bench/${APP_ID}.results.json" bench/previous/
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: keep
        with:
          path: bench/previous
          key: bench-previous-${{ github.run_id }}
      - name: Cache save report
        if: always() && steps.keep.outcome != 'skipped'
        shell: bash
        env:
          RESULT: ${{ steps.keep.outcome }}
        run: |
          echo "- bench-previous cache: saved: $RESULT" | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"

      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3.2.1
        if: always()
        with:
          name: bench-results
          path: bench/*.results.json
          if-no-files-found: warn

  nightly-mark:
    needs: [bench]
    if: github.event_name == 'schedule' && success()
    runs-on: ubuntu-latest
    steps:
      - uses: decryp7/paddock/.gitea/actions/nightly-mark@v0.3.0
