# Debrief's CI and release in the Paddock monorepo (ADR 0014, imported from decryp7/debrief's build.yml): every job runs in
# apps/debrief. The plan job runs only when the change reaches Debrief (scripts/affected.mjs: Debrief's own files, a shared
# input, or a global one); Debrief is not a leg of ci.yml because its gates span three OS, real-app smoke tests and the
# installers.
#
# Branch runs (a manual dispatch; there is no pull_request trigger: pull requests are the branch ledger, docs/plans/
# merge-queue.md, and start no run) are the checks: Rust (Linux and macOS), plugin SDK, licences, frontend and the end-to-end tests in Chromium. A full run adds the real-app smoke tests on three OS, the installers and the end-to-end tests in WebKit
# (Paddock rule 3: WebKit and the slow legs run on the combined result). Full runs are pushes to main, debrief-v* tags
# (which also publish the Gitea release and the moving debrief-latest release the app's updater reads), the nightly run and
# a manual run with `bundles: true` (the plan job's `full` output).
#
# Speed (Paddock lessons, "Test and build speed"): Linux jobs run in the paddock-ci image (Rust, nextest, Tauri's libraries,
# Node, Playwright's browsers, Chrome for Testing and libduckdb baked in); every Rust job compiles through sccache on local
# disk (setup-rust: the runner's /sccache mount in a container, the job slot's sccache-s<n> on a host); host runners build from a
# fixed checkout path (stable-workspace) into a kept build folder set as cargo configuration (the build-folder action),
# never CARGO_TARGET_DIR, which sccache hashes; npm's and Angular's caches are kept (node-caches).
#
# Runner labels: ubuntu-latest (jobs in the paddock-ci image), windows-latest and macos-latest (host runners).
# Releases need a repository secret RELEASE_TOKEN (a Gitea access token with write:repository scope) and the family's
# updater key (PADDOCK_TAURI_SIGNING_PRIVATE_KEY, _PASSWORD and PADDOCK_TAURI_UPDATER_PUBKEY).

name: debrief

on:
  push:
    branches: [main]
    tags: ["debrief-v*"]
  # Nightly on the default branch (main), with the installers. Scheduled runs start at night local time (UTC+8). The
  # Windows legs start after the Proxmox backup window (00:00 to 04:00 local) and are staggered; see docs/ci-schedules.md.
  schedule:
    - cron: "3 22 * * *" # 06:03 UTC+8, Windows leg
  workflow_dispatch:
    inputs:
      bundles:
        description: "Full run: also the installers, the real-app smoke tests and the end-to-end tests in WebKit"
        type: boolean
        default: false
      since_run:
        description: "Rerun only what failed in this finished debrief.yml run (its number): the failed jobs, the failed e2e shards, inside rust tests only the failed nextest tests and inside the frontend job only the failed vitest files (./dev plan --ci --app debrief; ER-10). A full run's failures need bundles: true too. A full run before landing catches the rest."
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always
  # Line tables only (file:line in backtraces, no variable info): smaller debug builds and caches and much less
  # memory when linking the test binaries. The test profile inherits this from dev.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# A newer push or dispatch on the same branch supersedes the run still going; tags have their own ref,
# so releases are never cancelled by later pushes.
# The event is part of the group, so a push to main never cancels the nightly or a manual run of main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Every step runs in the app's folder unless it says otherwise.
defaults:
  run:
    working-directory: apps/debrief

jobs:
  # Decides whether this run is needed at all:
  # the change does not reach Debrief (scripts/affected.mjs, the same plan as ci.yml);
  # a push to main whose commit carries a debrief-v* tag is covered by the tag run;
  # a nightly run is skipped while main is unchanged since the last green one.
  # And whether it is a full run (`full`): installers, real-app smoke and WebKit only for main, tags, nightly and
  # `bundles: true`, never for a branch or pull request run.
  plan:
    name: plan
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    defaults:
      run:
        working-directory: .
    outputs:
      run: ${{ steps.plan.outputs.run }}
      # A rerun of a run's failures (the since_run input; tools/paddock-dev/src/plan_since.rs): the jobs that rerun (empty
      # otherwise; each job's `if` reads an empty list as its own name), the nextest filter of a rust tests job narrowed to its
      # failed tests, the failed vitest files of the frontend job, and the e2e shards (every shard unless a rerun names some).
      rerun_jobs: ${{ steps.plan.outputs.rerun_jobs }}
      rust_test_filter: ${{ steps.plan.outputs.rust_test_filter }}
      rust_test_macos_filter: ${{ steps.plan.outputs.rust_test_macos_filter }}
      frontend_include: ${{ steps.plan.outputs.frontend_include }}
      e2e_shards: ${{ steps.plan.outputs.e2e_shards }}
      full: ${{ github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/debrief-v') || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && (inputs.bundles == true || github.event.inputs.bundles == 'true')) }}
    env:
      PADDOCK_DEV_DOWNLOAD: ${{ startsWith(github.ref, 'refs/tags/') && '0' || '' }}
    steps:
      # The whole history: the plan's base can be any older commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Exact-key lookup only: nothing is downloaded. The marker is saved by the nightly-mark job after a fully green run.
      - uses: actions/cache/restore@v4
        id: green
        if: github.event_name == 'schedule'
        with:
          path: .nightly-green
          key: debrief-nightly-green-${{ github.sha }}
          lookup-only: true

      # A scheduled run ends early while a train's dispatch run is queued or running (ADR 0093 amendment 2026-11-12).
      - id: train
        uses: ./.gitea/actions/schedule-skip
        with:
          workflow: debrief.yml
          dev-token: ${{ secrets.BUILD_INPUTS_TOKEN }}

      - name: Decide
        id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          GREEN: ${{ steps.green.outputs.cache-hit }}
          TRAIN_SKIP: ${{ steps.train.outputs.skip }}
          PLAN_TOKEN: ${{ github.token }}
          PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
          PADDOCK_DEV_DOWNLOAD: ${{ startsWith(github.ref, 'refs/tags/') && '0' || '' }}
          # The rerun reads the earlier run's jobs and logs through the API; PLAN_FULL says whether this rerun is full.
          PLAN_SINCE_RUN: ${{ github.event.inputs.since_run }}
          PLAN_FULL: ${{ github.event.inputs.bundles }}
          # The `full` output's expression, copied (tools/paddock-dev/tests/it/tree.rs keeps them equal): the mode line below lets a
          # later rerun of this run's failures tell whether it was full (plan_since::read_full). It is the scope only; `plan verdict:`
          # at the end says whether the run was complete.
          PLAN_MODE_FULL: ${{ github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/debrief-v') || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && (inputs.bundles == true || github.event.inputs.bundles == 'true')) }}
        run: |
          echo "plan mode: full=$PLAN_MODE_FULL"
          run=$(./dev plan --ci --app debrief)
          if [ "$EVENT" = schedule ] && [ "$GREEN" = true ]; then
            run=false
            echo "::notice::main has not changed since the last green run ($SHA); skipping."
          fi
          if [ "$EVENT" = schedule ] && [ "$TRAIN_SKIP" = true ]; then
            run=false
          fi
          grep -q '^e2e_shards=' "$GITHUB_OUTPUT" || echo 'e2e_shards=[{"shard":1},{"shard":2},{"shard":3},{"shard":4}]' >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; then
            # Lightweight tags list the commit itself, annotated ones list the tag object and the peeled commit (^{}).
            tag=$(git ls-remote --tags origin 'refs/tags/debrief-v*' | awk -v sha="$SHA" '$1 == sha { sub("refs/tags/", "", $2); sub(/\^\{\}$/, "", $2); print $2; exit }')
            if [ -n "$tag" ]; then
              run=false
              echo "::notice::commit is tagged $tag; the tag run is the gate."
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          # The line `./dev ci verdict` trusts (plan_since::COMPLETE_LINE), printed after every decision above: the plan ran its jobs,
          # this is not a rerun of failures and the mode is full. The scope line at the top is logged before these decisions, so a
          # run skipped for a train or an unchanged main, or a since_run dispatch, would pass for full on it.
          complete=false
          if [ "$run" = true ] && [ -z "$PLAN_SINCE_RUN" ] && [ "$PLAN_MODE_FULL" = true ]; then complete=true; fi
          echo "plan verdict: complete=$complete"

      # ADR 0060 3.2: the lint-adoption ratchet of Debrief (docs/gates.toml [[ratchet]] C13) must be empty before the release it names
      # (debrief-v1.2.0) or a later one is tagged. A tag run refuses at once, before anything is built. Only the ratchets of this
      # tag's app can refuse it: no other C100 finding (a register date, another app's gap) blocks a Debrief release (ER-31).
      - uses: ./.gitea/actions/setup-rust
        if: startsWith(github.ref, 'refs/tags/debrief-v')
      - name: Refuse the tag while the lint adoption list is not empty (C100 ratchet)
        if: startsWith(github.ref, 'refs/tags/debrief-v')
        working-directory: .
        run: ./dev gates ratchet --release-tag "$GITHUB_REF_NAME"

  # The checks run as parallel jobs; the installers and smoke tests (full runs only) wait for rust-lint. Each Rust job ends
  # with sccache-stats (the hit rate in its log).

  rust-lint:
    name: rust format + clippy
    needs: [plan]
    if: needs.plan.outputs.run == 'true' && contains(fromJSON(needs.plan.outputs.rerun_jobs || '["rust-lint"]'), 'rust-lint')
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    env:
      # setup-rust runs ./dev (docs/plans/ci-in-rust.md): the read credential, and a tag or release run builds the tool from source.
      PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
      PADDOCK_DEV_DOWNLOAD: ${{ startsWith(github.ref, 'refs/tags/') && '0' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.gitea/actions/setup-rust
        with:
          components: clippy rustfmt

      # Cheap and first: a formatting slip fails in seconds.
      - name: Format
        run: cargo fmt --all --check

      # ADR 0060 3.2, C13: the workspace lint tables, the opt-in of every member not on the adoption list (docs/gates.toml
      # [[ratchet]] C13 debrief: the list only shrinks) and the clippy.toml paths. Run from the repository root: the check
      # reads the preset in lint/ and the register in docs/.
      - name: Lint preset (C13)
        working-directory: .
        run: node conformance/bin/paddock-conformance.mjs --app debrief --root apps/debrief --only C13 --paddock .

      # The store crates link the official prebuilt libduckdb (ADR 0014): the image's when it has the pinned version, else
      # the pinned, SHA-256-checked download (every job that builds the workspace links it).
      - name: libduckdb
        run: bash scripts/ci/libduckdb-env.sh

      - name: Clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - uses: ./.gitea/actions/sccache-stats
        if: always()

  rust-test:
    name: rust tests
    needs: [plan]
    if: needs.plan.outputs.run == 'true' && contains(fromJSON(needs.plan.outputs.rerun_jobs || '["rust-test"]'), 'rust-test')
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    env:
      # setup-rust runs ./dev (docs/plans/ci-in-rust.md): the read credential, and a tag or release run builds the tool from source.
      PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
      PADDOCK_DEV_DOWNLOAD: ${{ startsWith(github.ref, 'refs/tags/') && '0' || '' }}
      # The nightly runs the store tests at the app's own thread counts (debrief-store-duck tests/common::test_options).
      DEBRIEF_TEST_APP_BUDGETS: ${{ github.event_name == 'schedule' && '1' || '0' }}
      # A missing test browser fails the real-browser tests instead of skipping them.
      DEBRIEF_REQUIRE_TEST_BROWSER: "1"
      # Chromium refuses to run as root, which the job's container is: the explicit root-only opt-in to start without the
      # sandbox (a user's browser keeps it). The window needs a display: the Tests step runs on a virtual one.
      DEBRIEF_BROWSER_NO_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v4

      # The job's own temp and socket folders (ER-14; on the host runners job-isolation's acquire makes the same): the tests
      # and the leak check never touch a folder other runs use. The socket folder goes with the job's last step.
      - uses: ./.gitea/actions/job-tmpdir

      - uses: ./.gitea/actions/setup-rust

      # The pinned cargo-nextest (the image's; the step fails when it is another version).
      - uses: ./.gitea/actions/host-tools

      - name: libduckdb
        run: bash scripts/ci/libduckdb-env.sh

      # The pinned Chrome for Testing build (the one the app may download, runtime.rs), never an installed browser (Paddock
      # rule 7): the image's (CHROMIUM_TEST_PATH) when it is Debrief's pin, else the pin, installed into the job's temp.
      - name: Pinned test browser
        run: |
          # `[&]` and the quoted case pattern below keep this file free of YAML-anchor look-alikes, so the planner can split it
          # into jobs (a since_run rerun reads the job names from it; tools/paddock-dev/tests/it/tree.rs checks it).
          want=$(sed -n 's/.*PINNED_VERSION: [&]str = "\([^"]*\)".*/\1/p' app/src-tauri/src/browser/runtime.rs)
          have=$("${CHROMIUM_TEST_PATH:-/nonexistent}" --version 2>/dev/null | awk '{ print $NF }' || true)
          if [ -n "$want" ] && [ "$have" = "$want" ]; then
            echo "Chrome for Testing $have from the CI image: $CHROMIUM_TEST_PATH"
            exit 0
          fi
          echo "::notice::the CI image has Chrome for Testing ${have:-none}, Debrief pins ${want:-?}: installing the pin."
          out=$(node ../../conformance/ci/install-test-browser.mjs --rust-source app/src-tauri/src/browser/runtime.rs \
            --dir "$RUNNER_TEMP/debrief-test-browser" --env-prefix DEBRIEF)
          printf '%s\n' "$out"
          case "$out" in *"CHROMIUM_TEST_PATH="*) ;; *) echo "::error::the test browser installer printed no CHROMIUM_TEST_PATH"; exit 1 ;; esac

      - name: Temp folders before the tests
        run: node scripts/ci/check-temp-leaks.mjs --dir "$PADDOCK_JOB_TEMP" --socket-dir "$PADDOCK_SOCKET_BASE" --shared --snapshot "$RUNNER_TEMP/temp-leaks.json"

      # nextest runs every test in its own process, in parallel across crates, and reports every failure;
      # .config/nextest.toml serialises the tests that time real child processes. The ci profile never retries (a flaky
      # test is fixed, not retried), stops a test after its time budget and writes a JUnit report.
      # xvfb-run: a virtual display (no screen, no desktop) for the real-browser tests' windows.
      # A since_run rerun narrowed to the failed tests passes their nextest filter (the plan job's rust_test_filter).
      - name: Tests (workspace)
        env:
          RERUN_FILTER: ${{ needs.plan.outputs.rust_test_filter }}
        run: xvfb-run -a cargo nextest run --workspace --profile ci ${RERUN_FILTER:+-E "$RERUN_FILTER"}

      - name: Test report (JUnit)
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: rust-tests-junit
          path: apps/debrief/target/nextest/ci/junit.xml
          if-no-files-found: ignore

      # nextest does not run doc tests. This step and the next ones run even after the tests failed (each names what broke).
      - name: Doc tests (workspace)
        if: ${{ !cancelled() && needs.plan.outputs.rust_test_filter == '' }}
        run: cargo test --workspace --doc

      # Tests clean up after themselves (docs/testing/temp-leaks.md): a debrief-* / imt-* folder left behind fails the job.
      - name: No temp folders left behind
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-temp-leaks.mjs --dir "$PADDOCK_JOB_TEMP" --socket-dir "$PADDOCK_SOCKET_BASE" --shared --check "$RUNNER_TEMP/temp-leaks.json"

      # The analyses' memory budget (ADR 0014) is the shipped worker's: measured on a release build, Linux only
      # (DuckDB's jemalloc is the allocator there; the test skips itself in debug builds).
      # Non-blocking until Debrief 1.2 WP D-0 (user decision 2026-10-27): since the permanent entity catalogue the peak is
      # about 338 MB against 315 and `compare` runs out of DuckDB memory at 64 MB (bisected to the catalogue, already in 1.1.1).
      # The test still runs and its failure shows as a warning; D-0 fixes the catalogue's memory and removes continue-on-error.
      # Debrief 1.2.0 does not ship while this step fails.
      - name: Memory budget
        if: ${{ !cancelled() && needs.plan.outputs.rust_test_filter == '' }}
        continue-on-error: true
        run: cargo test --release -p debrief-store-duck --test analysis_memory -- --nocapture

      - uses: ./.gitea/actions/sccache-stats
        if: always()

      - uses: ./.gitea/actions/job-tmpdir
        if: always()
        with:
          mode: remove

  # The same tests on the macOS host runner: the contained-plugin sandbox (sandbox-exec profiles, the private socket,
  # symlinked temp paths) and other platform code only run here; a macOS-only bug once passed the Linux-only suite.
  # Host mode: the checkout moves to a fixed path (stable-workspace, so sccache hits the workspace crates too) and builds into
  # a kept folder outside it (the build-folder action); libduckdb as on Linux, through DYLD_LIBRARY_PATH (set in
  # GITHUB_ENV, never under `nice`/`env`, which macOS's SIP would strip it from).
  rust-test-macos:
    name: rust tests (macOS)
    needs: [plan]
    if: needs.plan.outputs.run == 'true' && contains(fromJSON(needs.plan.outputs.rerun_jobs || '["rust-test-macos"]'), 'rust-test-macos')
    runs-on: macos-latest
    env:
      # Read credential and tag rule for ./dev's prebuilt download (ADR 0022 R0b; a tag run builds from source).
      PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
      PADDOCK_DEV_DOWNLOAD: ${{ startsWith(github.ref, 'refs/tags/') && '0' || '' }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
        working-directory: apps/debrief
    steps:
      - uses: actions/checkout@v4

      # CARGO_BUILD_JOBS: this runner's share of the host's cores (before job-isolation, which builds paddock-dev).
      - uses: ./.gitea/actions/build-jobs

      # A slot of the host (job isolation; after Git bash on Windows), before every kept folder.
      - uses: ./.gitea/actions/job-isolation

      - uses: ./.gitea/actions/stable-workspace
        with:
          name: debrief-${{ github.job }}-${{ runner.os }}

      - uses: ./.gitea/actions/setup-rust

      - uses: ./.gitea/actions/host-tools

      # The build folder outside the checkout, as cargo configuration (the shared build-folder action).
      - uses: ./.gitea/actions/build-folder
        with:
          workspace: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/apps/debrief
          name: debrief-${{ github.job }}

      - name: The test browser's folder
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/apps/debrief
        run: |
          # Outside the checkout, which stable-workspace moves: the job slot's kept folder (the installer stamps the pinned
          # version in it).
          dir="$(bash ../../conformance/ci/kit.sh isolation path browser debrief)"
          echo "DEBRIEF_TEST_BROWSER_DIR=$dir" >> "$GITHUB_ENV"

      - name: libduckdb
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/apps/debrief
        run: bash scripts/ci/libduckdb-env.sh

      # The pinned Chrome for Testing (runtime.rs), never the host's installed Chrome (Paddock rule 7); kept on the host and
      # downloaded once per pin. Sets CHROMIUM_TEST_PATH and DEBRIEF_REQUIRE_TEST_BROWSER=1.
      - uses: ./.gitea/actions/install-test-browser
        with:
          rust-source: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/apps/debrief/app/src-tauri/src/browser/runtime.rs
          env-prefix: DEBRIEF
          dir: ${{ env.DEBRIEF_TEST_BROWSER_DIR }}

      - name: Temp folders before the tests
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/apps/debrief
        run: node scripts/ci/check-temp-leaks.mjs --dir "$PADDOCK_JOB_TEMP" --socket-dir "$PADDOCK_SOCKET_BASE" --snapshot "$RUNNER_TEMP/temp-leaks.json"

      # A since_run rerun narrowed to the failed tests passes their nextest filter (the plan job's rust_test_macos_filter).
      - name: Tests (workspace)
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/apps/debrief
        env:
          RERUN_FILTER: ${{ needs.plan.outputs.rust_test_macos_filter }}
        run: cargo nextest run --workspace --profile ci ${RERUN_FILTER:+-E "$RERUN_FILTER"}

      - name: Doc tests (workspace)
        if: ${{ !cancelled() && needs.plan.outputs.rust_test_macos_filter == '' }}
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/apps/debrief
        run: cargo test --workspace --doc

      - name: No temp folders left behind
        if: ${{ !cancelled() }}
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/apps/debrief
        run: node scripts/ci/check-temp-leaks.mjs --dir "$PADDOCK_JOB_TEMP" --socket-dir "$PADDOCK_SOCKET_BASE" --check "$RUNNER_TEMP/temp-leaks.json"

      - uses: ./.gitea/actions/sccache-stats
        if: always()

      # The slot goes back last, after everything that uses its folders and its sccache port.
      - uses: ./.gitea/actions/job-isolation
        if: always()
        with:
          mode: release

  # The plugin SDK as an author uses it: a project of every kind from `cargo debrief-plugin new` builds, and one of them
  # passes `cargo debrief-plugin test` (conformance in the sandbox, then its own tests). The examples themselves are
  # workspace members and run in `rust tests`.
  plugin-sdk:
    name: plugin SDK templates
    needs: [plan]
    if: needs.plan.outputs.run == 'true' && contains(fromJSON(needs.plan.outputs.rerun_jobs || '["plugin-sdk"]'), 'plugin-sdk')
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    env:
      # setup-rust runs ./dev (docs/plans/ci-in-rust.md): the read credential, and a tag or release run builds the tool from source.
      PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
      PADDOCK_DEV_DOWNLOAD: ${{ startsWith(github.ref, 'refs/tags/') && '0' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.gitea/actions/setup-rust

      # The new projects share one build folder, as cargo configuration above them (never CARGO_TARGET_DIR: sccache hashes
      # it), so their common dependencies build once. They live outside the repo, so they do not see the repo's
      # .cargo/config.toml: the registry that the shared crates name in `publish` (paddock-proc, reached through debrief-ipc)
      # is declared here as well, or cargo cannot even parse their manifests.
      - name: One build folder for the new projects
        run: |
          mkdir -p /tmp/plugins/.cargo
          printf "[build]\ntarget-dir = '/tmp/debrief-sdk-target'\n\n[registries.decryp7]\nindex = \"sparse+https://dev.decryptology.net/api/packages/decryp7/cargo/\"\n" > /tmp/plugins/.cargo/config.toml

      - name: Install cargo debrief-plugin
        run: cargo install --path crates/cargo-debrief-plugin --locked --debug --target-dir /tmp/debrief-sdk-target

      - name: New projects of every kind build
        run: |
          set -e
          for kind in importer transform tool collector annotator; do
            cargo debrief-plugin new "my-$kind" --kind "$kind" --dir /tmp/plugins --sdk-path .
            (cd "/tmp/plugins/my-$kind" && cargo build --all-targets)
          done

      - name: A new importer passes cargo debrief-plugin test, packages and signs
        working-directory: /tmp/plugins/my-importer
        run: |
          cargo debrief-plugin test
          cargo debrief-plugin keygen --out ci.secret-key
          cargo debrief-plugin package --sign ci.secret-key
          cargo debrief-plugin inspect my-importer-0.1.0.debriefplugin

      - uses: ./.gitea/actions/sccache-stats
        if: always()

  licences:
    name: licences, notices + commits
    needs: [plan]
    if: needs.plan.outputs.run == 'true' && contains(fromJSON(needs.plan.outputs.rerun_jobs || '["licences"]'), 'licences')
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so pull requests can check every commit message.
          fetch-depth: 0

      # cargo-deny comes with the image; cargo-about does not. Pinned: the committed notices are its output, and a new
      # release can find more licence texts (0.9.3 found five more than 0.9.2 on 2026-10-28); bump it together with
      # scripts/notices/generate.sh's output.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2

      # cargo about reads every crate's licence from its sources and cargo deny clones the advisory database: without a
      # cache both download everything on every run. The image's CARGO_HOME is /usr/local/cargo. Saved on every run (a
      # new key each time), so the advisory database stays fresh.
      - uses: actions/cache/restore@v4
        with:
          path: |
            /usr/local/cargo/registry/index
            /usr/local/cargo/registry/cache
            /usr/local/cargo/advisory-dbs
          key: debrief-licences-${{ runner.os }}-${{ hashFiles('apps/debrief/Cargo.lock') }}
          restore-keys: debrief-licences-${{ runner.os }}-

      # The binary, not the Docker-based action: no image to pull on every run. Every workspace crate, not just
      # the root package.
      - name: Licences, advisories and sources
        run: cargo deny --all-features --workspace check

      - name: Third-party notices are up to date
        run: |
          node --test app/scripts/build-info.test.mjs app/scripts/whats-new.test.mjs app/scripts/build-sidecars.test.mjs app/scripts/libduckdb.test.mjs app/scripts/lint-styles.test.mjs app/scripts/lint-effects.test.mjs app/scripts/window-weight.test.mjs scripts/commit-lint.test.mjs scripts/ci/check-icons.test.mjs scripts/ci/check-temp-leaks.test.mjs scripts/ci/check-index.test.mjs scripts/ci/check-smoke-dialogs.test.mjs scripts/ci/check-quarantine.test.mjs scripts/ci/scan-fixtures.test.mjs scripts/ci/startup-bench.test.mjs scripts/ci/libduckdb-env.test.mjs app/e2e/retried-reporter.test.mjs
          node scripts/ci/check-quarantine.mjs
          node scripts/ci/scan-fixtures.mjs
          node scripts/ci/check-icons.mjs
          cd ../.. && scripts/notices.sh debrief --check

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            /usr/local/cargo/registry/index
            /usr/local/cargo/registry/cache
            /usr/local/cargo/advisory-dbs
          key: debrief-licences-${{ runner.os }}-${{ hashFiles('apps/debrief/Cargo.lock') }}-${{ github.run_id }}

  frontend:
    name: frontend build, lint + unit tests
    needs: [plan]
    if: needs.plan.outputs.run == 'true' && contains(fromJSON(needs.plan.outputs.rerun_jobs || '["frontend"]'), 'frontend')
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    defaults:
      run:
        working-directory: apps/debrief/app
    steps:
      - uses: actions/checkout@v4

      # The job's own temp and socket folders (ER-14; on the host runners job-isolation's acquire makes the same): the tests
      # and the leak check never touch a folder other runs use. The socket folder goes with the job's last step.
      - uses: ./.gitea/actions/job-tmpdir

      # npm's download cache and the Angular build cache kept on the runner's /sccache mount (Node is the image's).
      - uses: ./.gitea/actions/node-caches
        with:
          angular-dir: apps/debrief/app
          name: debrief-frontend

      # One npm workspace for the monorepo (ADR 0014 §1): the root lock installs every package.
      - name: Install
        run: |
          (cd ../../.. && npm ci)
          npm audit --omit=dev --audit-level=high

      # The app imports the shared library from ui/dist (tsconfig paths), which lint, the build and the tests need.
      - name: Build the shared UI
        run: (cd ../../.. && npm run build -w ui)

      - name: Lint
        if: needs.plan.outputs.frontend_include == ''
        run: npm run lint

      # Needs the installed TypeScript (a type-checked call-graph walk), so it runs here and not with the other script tests.
      - name: Dialog command lint tests
        if: needs.plan.outputs.frontend_include == ''
        run: node --test scripts/check-dialog-commands.test.mjs

      # --stats-json writes dist/app/browser-stats.json for the window-weight step below (the one build of this job).
      - name: Frontend build
        if: needs.plan.outputs.frontend_include == ''
        run: npx ng build --stats-json

      # Paddock rule 35: the JS the main window loads before first paint (static closure of main, bootstrap, app and
      # app.config) stays under its budget (measured + 10%, docs/performance.md); pop-out and dialog are reported, the
      # About dialog window is bounded too.
      - name: First-paint JS budget (main window)
        if: needs.plan.outputs.frontend_include == ''
        run: |
          node scripts/window-weight.mjs main --max 1355
          node scripts/window-weight.mjs popout
          node scripts/window-weight.mjs about --max 480

      # No inline <style>/<script> (Tauri's CSP nonce would disable the app's styles) and the start-up splash is present.
      - name: Built index.html (no inline elements, splash present)
        if: needs.plan.outputs.frontend_include == ''
        run: node ../scripts/ci/check-index.mjs

      - name: Translations are extracted and the pseudo-locale builds
        if: needs.plan.outputs.frontend_include == ''
        run: |
          node --test scripts/i18n/locales.test.mjs
          npx ng extract-i18n --output-path .i18n-check 2>&1 | tee .i18n-check.log
          if grep -qi 'duplicate' .i18n-check.log; then echo 'Duplicate i18n message ids (see above)'; exit 1; fi
          node scripts/i18n/build-locales.mjs --check .i18n-check/messages.xlf

      # A since_run rerun narrowed to the failed spec files (frontend_include) runs only those, without coverage (the full
      # run before landing measures it); the steps above passed in that run and are skipped.
      - name: Frontend unit tests
        env:
          RERUN_INCLUDE: ${{ needs.plan.outputs.frontend_include }}
        run: |
          node ../scripts/ci/check-temp-leaks.mjs --dir "$PADDOCK_JOB_TEMP" --socket-dir "$PADDOCK_SOCKET_BASE" --shared --snapshot "$RUNNER_TEMP/temp-leaks-ui.json"
          args=(--coverage)
          if [ -n "$RERUN_INCLUDE" ]; then args=(); for f in $RERUN_INCLUDE; do args+=(--include "$f"); done; fi
          npx ng test --watch=false "${args[@]}"
          node ../scripts/ci/check-temp-leaks.mjs --dir "$PADDOCK_JOB_TEMP" --socket-dir "$PADDOCK_SOCKET_BASE" --shared --check "$RUNNER_TEMP/temp-leaks-ui.json"

      - uses: ./.gitea/actions/job-tmpdir
        if: always()
        with:
          mode: remove

  # Four shards that run at the same time, each with its own production build (Angular's cache kept per shard) and port.
  # Playwright's Chromium and WebKit come with the image: nothing is downloaded. Branch and pull request runs test in
  # Chromium only; full runs (main, tags, nightly, `bundles: true`) in Chromium and WebKit (Paddock rule 3).
  e2e:
    name: end-to-end (shard ${{ matrix.shard }}/4)
    needs: [plan]
    if: needs.plan.outputs.run == 'true' && contains(fromJSON(needs.plan.outputs.rerun_jobs || '["e2e"]'), 'e2e')
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    strategy:
      fail-fast: false
      matrix:
        # Every shard; a since_run rerun only the failed ones (the plan job writes all four otherwise). The `include` form of
        # ci.yml's crate legs, proven on this Gitea.
        include: ${{ fromJSON(needs.plan.outputs.e2e_shards) }}
    defaults:
      run:
        working-directory: apps/debrief/app
    steps:
      - uses: actions/checkout@v4

      - uses: ./.gitea/actions/node-caches
        with:
          angular-dir: apps/debrief/app
          name: debrief-e2e-${{ matrix.shard }}

      - name: Install
        run: (cd ../../.. && npm ci)

      # The app imports the shared library from ui/dist (tsconfig paths), which lint, the build and the tests need.
      - name: Build the shared UI
        run: (cd ../../.. && npm run build -w ui)

      # One production build serves every project of this shard, under the Tauri CSP.
      - name: Production build for the end-to-end tests
        run: npx ng build

      - name: Frontend end-to-end tests
        env:
          CI: "true"
          # Required by playwright.config.ts in CI (no default port, no reused server): one per shard, as jobs may share a host.
          DEBRIEF_E2E_PORT: "435${{ matrix.shard }}"
          DEBRIEF_E2E_PREBUILT: "1"
        run: npx playwright test --shard=${{ matrix.shard }}/4 ${{ needs.plan.outputs.full != 'true' && '--project=chromium' || '' }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report-${{ matrix.shard }}
          path: apps/debrief/app/playwright-report
          if-no-files-found: ignore

  # A few WebdriverIO smoke tests of the real app (engine + shell + production UI, no mock), through
  # tauri-driver: msedgedriver for WebView2 on Windows, WebKitWebDriver under Xvfb on Linux (both in place: the image's,
  # the host's). macOS has no WKWebView driver. Locally: see docs/testing-manual.md ("Smoke tests of the real app").
  # Full runs only (main, debrief-v* tags, nightly, `bundles: true`), never on branch or pull request runs.
  tauri-smoke:
    name: real-app smoke (${{ matrix.os }})
    # After the bundle and the macOS Rust tests: the macOS leg's start-up benchmark is a timing gate and must not share the
    # runner with this run's heavy builds (debrief.yml 8007 measured 1.8x its budgets beside the LTO bundle job). A failed
    # bundle or test leg does not skip the smoke (!cancelled); a failed rust-lint still does.
    needs: [plan, rust-lint, bundle, rust-test-macos]
    if: ${{ !cancelled() && needs.rust-lint.result == 'success' && needs.plan.outputs.run == 'true' && needs.plan.outputs.full == 'true' && contains(fromJSON(needs.plan.outputs.rerun_jobs || '["tauri-smoke"]'), 'tauri-smoke') }}
    strategy:
      fail-fast: false
      matrix:
        # macOS has no WebDriver for WKWebView: its leg builds the .app, starts every sidecar from it and asserts that the
        # app stays up and quits within 10 s (scripts/ci/macos-smoke.sh). The v1.0.1 store-worker abort reached users
        # because no macOS job ever started the sidecars.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Read credential and tag rule for ./dev's prebuilt download (ADR 0022 R0b; a tag run builds from source).
      PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
      PADDOCK_DEV_DOWNLOAD: ${{ startsWith(github.ref, 'refs/tags/') && '0' || '' }}
    # Linux legs run in the paddock-ci image; Windows and macOS run on the host.
    container: ${{ matrix.os == 'ubuntu-latest' && 'dev.decryptology.net/decryp7/paddock-ci:v2' || '' }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: apps/debrief
    # Windows runners usually run as administrator, where WebView2 ignores WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS (how
    # msedgedriver enables remote debugging); the debug build hands those arguments to WebView2 itself, so both legs
    # are required. Each run keeps Debrief's folders in a temp DEBRIEF_DATA_DIR (see app/e2e-tauri/wdio.conf.ts).
    steps:
      - uses: actions/checkout@v4

      # Host-mode Windows runners may not have Git's bash on PATH; actions and `shell: bash` need it. The npm cache lives in
      # a host folder that outlives the job (npm ci then installs from disk).
      - name: Git bash on PATH (Windows)
        if: runner.os == 'Windows'
        # cmd, not PowerShell: runners with a restricted execution policy refuse the .ps1 act writes for a step.
        shell: cmd
        working-directory: .
        run: |
          rem Which account runs the job: WebView2 smoke tests cannot run as SYSTEM (its temp is C:\Windows\SystemTemp).
          whoami
          echo the job temp folder is %TEMP%
          if not exist "%ProgramFiles%\Git\bin\bash.exe" (echo Git for Windows is not installed on this runner: no bash.exe in "%ProgramFiles%\Git\bin" & exit /b 1)
          echo %ProgramFiles%\Git\bin>>"%GITHUB_PATH%"
          echo npm_config_prefer_offline=true>>"%GITHUB_ENV%"
          echo npm_config_audit=false>>"%GITHUB_ENV%"
          echo npm_config_fund=false>>"%GITHUB_ENV%"

      # CARGO_BUILD_JOBS: this runner's share of the host's cores (before job-isolation, which builds paddock-dev).
      - uses: ./.gitea/actions/build-jobs

      # A slot of the host (job isolation; after Git bash on Windows), before every kept folder.
      - uses: ./.gitea/actions/job-isolation

      # npm's download cache on the Windows host (node-caches keeps it elsewhere): the job slot's kept folder npm-s<n>.
      - name: npm cache (Windows)
        if: runner.os == 'Windows'
        working-directory: .
        run: |
          dir="$(bash conformance/ci/kit.sh isolation path npm)"
          echo "npm_config_cache=$(cygpath -w "$dir")" >> "$GITHUB_ENV"

      # Host runners: the same checkout path every run, so sccache hits the workspace crates.
      - uses: ./.gitea/actions/stable-workspace
        if: runner.os != 'Linux'
        with:
          name: debrief-${{ github.job }}-${{ runner.os }}

      - uses: ./.gitea/actions/setup-rust

      # One kept build folder per job on a host (the smoke and installer jobs run at the same time and would otherwise wait
      # for each other on the cargo lock), as cargo configuration (the shared build-folder action): PADDOCK_BUILD_FOLDER and
      # DEBRIEF_E2E_APP for the steps below.
      - uses: ./.gitea/actions/build-folder
        with:
          workspace: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/apps/debrief
          name: debrief-${{ github.job }}

      # The debug app the real-app smoke starts (wdio), in the job's build folder.
      - name: The smoke's app binary
        shell: bash
        run: |
          ext=; if [ "$RUNNER_OS" = Windows ]; then ext=.exe; fi
          echo "DEBRIEF_E2E_APP=$PADDOCK_BUILD_FOLDER/debug/debrief-app$ext" >> "$GITHUB_ENV"

      # Host runners keep their own Node: fail fast when it is missing or not the major version app/.nvmrc asks for.
      - name: Host Node matches app/.nvmrc
        if: runner.os != 'Linux'
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/apps/debrief
        run: |
          want=$(tr -d ' v\r\n' < app/.nvmrc | cut -d. -f1)
          if ! command -v node >/dev/null; then
            if [ -x "/c/Program Files/nodejs/node.exe" ]; then
              echo 'C:\Program Files\nodejs' >> "$GITHUB_PATH"
              export PATH="/c/Program Files/nodejs:$PATH"
            else
              echo "::error::Node.js is not installed on this runner: install Node $want (app/.nvmrc) on the host and put it on PATH."
              exit 1
            fi
          fi
          have=$(node -p 'process.versions.node.split(".")[0]')
          if [ "$have" != "$want" ]; then
            echo "::error::The runner has Node $(node --version) but app/.nvmrc asks for Node $want: install Node $want on the host."
            exit 1
          fi
          node --version

      # npm's and Angular's caches (the /sccache mount on Linux, the CI home's kept folders on macOS). Windows reuses a whole
      # node_modules instead (below).
      - uses: ./.gitea/actions/node-caches
        if: runner.os != 'Windows'
        with:
          angular-dir: apps/debrief/app
          name: debrief-smoke

      - name: libduckdb
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/apps/debrief
        run: bash scripts/ci/libduckdb-env.sh

      - name: tauri-driver
        if: runner.os != 'macOS'
        run: command -v tauri-driver || cargo install tauri-driver --locked

      # The Edge WebDriver must match the runner's WebView2 runtime exactly: the script reads the runtime's
      # version from the registry (EdgeUpdate client {F3017226-…}) and downloads
      # https://msedgedriver.microsoft.com/<version>/edgedriver_win64.zip into app/e2e-tauri/.drivers/.
      - name: Edge WebDriver matching WebView2
        if: runner.os == 'Windows'
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/apps/debrief/app
        run: node e2e-tauri/scripts/fetch-msedgedriver.mjs

      # Windows host: unpacking ~900 packages into a fresh node_modules took 7–14 min per job even with the npm cache
      # on disk. A finished node_modules per package-lock.json lives in the job slot's kept folder node-modules and is linked into the
      # job's checkout (a directory junction); npm ci runs only when the lockfile changed. The last step removes the
      # junction, so no cleanup ever walks into the shared copy (a junction a killed job left is removed here first).
      - name: Reuse node_modules for this lockfile (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}
        run: bash apps/debrief/scripts/ci/windows-node-modules.sh link

      - name: Debug app binary
        if: runner.os != 'macOS'
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/apps/debrief/app
        run: |
          [ -d ../../../node_modules ] || (cd ../../.. && npm ci)
          # The app imports the shared library from ui/dist (tsconfig paths).
          (cd ../../.. && npm run build -w ui)
          npm run e2e:tauri:build

      # macOS: a real debug .app (ad-hoc sealed by tauri.macos.conf.json) with the sidecars and libduckdb inside, the same
      # layout the installer ships; then the signature/Team-ID/load checks and the launch-and-quit smoke.
      - name: Debug .app (macOS)
        if: runner.os == 'macOS'
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/apps/debrief/app
        env:
          DEBRIEF_CARGO_PROFILE: debug
        run: |
          (cd ../../.. && npm ci)
          # The app imports the shared library from ui/dist (tsconfig paths).
          (cd ../../.. && npm run build -w ui)
          npx tauri build --debug --bundles app --config src-tauri/tauri.sidecars.conf.json

      - name: Smoke test, sidecars and quit within 10 s (macOS)
        if: runner.os == 'macOS'
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/apps/debrief
        run: |
          app=$(find "$PADDOCK_BUILD_FOLDER/debug/bundle/macos" -maxdepth 1 -name '*.app' | head -n 1)
          [ -d "$app" ] || { echo "::error::no debug .app was built"; exit 1; }
          node --test scripts/ci/macos-smoke.test.mjs
          bash scripts/ci/macos-verify-bundle.sh "$app"
          bash scripts/ci/macos-smoke.sh "$app"

      - name: Smoke tests (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/apps/debrief/app
        # Keep Debrief's folders so a failure can show the app's own logs (next step).
        env:
          DEBRIEF_E2E_KEEP_DATA: "1"
        run: npm run e2e:tauri

      - name: Debrief logs of the failed smoke run (Windows)
        if: failure() && runner.os == 'Windows'
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/apps/debrief/app
        run: |
          for f in $(find e2e-tauri/.tmp -path '*debrief-e2e-*' -name '*.log' 2>/dev/null | sort); do
            echo "::group::$f"; tail -n 150 "$f"; echo "::endgroup::"
          done
          tasklist //FI "IMAGENAME eq debrief-app.exe" || true

      # A session bus for the single-instance plugin and notifications, and a virtual display for WebKitGTK.
      - name: Smoke tests (Linux)
        if: runner.os == 'Linux'
        working-directory: apps/debrief/app
        # WebKitGTK in a CI container: its web-process sandbox (bubblewrap) cannot start as root inside Docker, and
        # there is no GPU. These switches apply to this throwaway test container only, never to Debrief itself.
        env:
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
          # Keep Debrief's folders so a failure can show the app's own logs (next step).
          DEBRIEF_E2E_KEEP_DATA: "1"
        run: dbus-run-session -- xvfb-run -a --server-args="-screen 0 1600x1000x24" npm run e2e:tauri

      - name: Debrief logs of the failed smoke run (Linux)
        if: failure() && runner.os == 'Linux'
        run: |
          for f in $(find /tmp -path '*debrief-e2e-*' -name '*.log' 2>/dev/null | sort); do
            echo "::group::$f"; tail -n 150 "$f"; echo "::endgroup::"
          done
          dmesg 2>/dev/null | tail -n 30 || true

      # Screenshots and page sources of failed smoke tests (wdio.conf.ts `afterTest`).
      - name: Smoke test failures
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: tauri-smoke-${{ runner.os }}
          path: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/apps/debrief/app/e2e-tauri/.artifacts
          if-no-files-found: ignore

      # No live search test here: CI never depends on the real network. The same probe runs over recorded engine pages in
      # the rust tests (browser::live::tests); the live one is a manual run (docs/development.md, "Live search test").

      # The start-up benchmark (Paddock rule 16; startup_timings.rs): five everyday starts of the built app after a
      # first run, each one's "Startup timings" line read and the medians checked against scripts/ci/startup-budgets.json.
      # Nightly and manual runs only. macOS has measured budgets; Linux reports until its first nightly numbers are in.
      - name: Start-up benchmark (macOS)
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !cancelled() && runner.os == 'macOS'
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/apps/debrief
        run: |
          app=$(find "$PADDOCK_BUILD_FOLDER/debug/bundle/macos" -maxdepth 1 -name '*.app' | head -n 1)
          node --test scripts/ci/startup-bench.test.mjs
          node scripts/ci/startup-bench.mjs "$app" --runs 5 --out "${RUNNER_TEMP:-/tmp}/startup-timings.json"

      - name: Start-up benchmark (Linux, report only)
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !cancelled() && runner.os == 'Linux'
        env:
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          dbus-run-session -- xvfb-run -a --server-args="-screen 0 1600x1000x24" \
            node scripts/ci/startup-bench.mjs "$PADDOCK_BUILD_FOLDER/debug/debrief-app" --runs 5 --report-only \
            --out "${RUNNER_TEMP:-/tmp}/startup-timings.json"

      - name: Start-up timings
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !cancelled() && runner.os != 'Windows'
        uses: actions/upload-artifact@v3
        with:
          name: startup-timings-${{ runner.os }}
          path: ${{ runner.temp }}/startup-timings.json
          if-no-files-found: ignore

      # Unlink the shared node_modules (rmdir on a junction removes the link only, never the target's files).
      - name: Unlink the shared node_modules (Windows)
        if: always() && runner.os == 'Windows'
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}
        run: bash apps/debrief/scripts/ci/windows-node-modules.sh unlink

      - uses: ./.gitea/actions/sccache-stats
        if: always()

      # The slot goes back last, after everything that uses its folders and its sccache port.
      - uses: ./.gitea/actions/job-isolation
        if: always()
        with:
          mode: release

  # Installers only on full runs: debrief-v* tags, pushes to main, the nightly run and manual runs with `bundles: true`; never
  # for branch or pull request runs. They are the slowest jobs and the Windows leg runs on a developer PC.
  bundle:
    name: bundle (${{ matrix.os }})
    needs: [plan, rust-lint]
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.full == 'true' && contains(fromJSON(needs.plan.outputs.rerun_jobs || '["bundle"]'), 'bundle')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb,rpm
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: dmg
    runs-on: ${{ matrix.os }}
    env:
      # A release or installer job builds the tool from source: it never runs a prebuilt binary (ADR 0022, release jobs bypass every cache).
      PADDOCK_DEV_DOWNLOAD: "0"
    # Linux legs run in the paddock-ci image; Windows and macOS run on the host.
    container: ${{ matrix.os == 'ubuntu-latest' && 'dev.decryptology.net/decryp7/paddock-ci:v2' || '' }}
    defaults:
      run:
        shell: bash
        working-directory: apps/debrief
    steps:
      - uses: actions/checkout@v4

      # Host-mode Windows runners may not have Git's bash on PATH; actions and `shell: bash` need it.
      - name: Git bash on PATH (Windows)
        if: runner.os == 'Windows'
        # cmd, not PowerShell: runners with a restricted execution policy refuse the .ps1 act writes for a step.
        shell: cmd
        working-directory: .
        run: |
          whoami
          if not exist "%ProgramFiles%\Git\bin\bash.exe" (echo Git for Windows is not installed on this runner: no bash.exe in "%ProgramFiles%\Git\bin" & exit /b 1)
          echo %ProgramFiles%\Git\bin>>"%GITHUB_PATH%"
          echo npm_config_prefer_offline=true>>"%GITHUB_ENV%"
          echo npm_config_audit=false>>"%GITHUB_ENV%"
          echo npm_config_fund=false>>"%GITHUB_ENV%"

      # CARGO_BUILD_JOBS: this runner's share of the host's cores (before job-isolation, which builds paddock-dev).
      - uses: ./.gitea/actions/build-jobs

      # A slot of the host (job isolation; after Git bash on Windows), before every kept folder.
      - uses: ./.gitea/actions/job-isolation

      # npm's download cache on the Windows host (node-caches keeps it elsewhere): the job slot's kept folder npm-s<n>.
      - name: npm cache (Windows)
        if: ${{ runner.os == 'Windows' && !startsWith(github.ref, 'refs/tags/') }}
        working-directory: .
        run: |
          dir="$(bash conformance/ci/kit.sh isolation path npm)"
          echo "npm_config_cache=$(cygpath -w "$dir")" >> "$GITHUB_ENV"

      # Host runners: the same checkout path every run, so sccache hits the workspace crates.
      - uses: ./.gitea/actions/stable-workspace
        if: runner.os != 'Linux'
        with:
          name: debrief-${{ github.job }}-${{ runner.os }}

      - uses: ./.gitea/actions/setup-rust

      # The release build folder as cargo configuration (the shared build-folder action): PADDOCK_BUILD_FOLDER.
      - uses: ./.gitea/actions/build-folder
        with:
          workspace: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/apps/debrief
          name: debrief-${{ github.job }}

      - name: Host Node matches app/.nvmrc
        if: runner.os != 'Linux'
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/apps/debrief
        run: |
          want=$(tr -d ' v\r\n' < app/.nvmrc | cut -d. -f1)
          if ! command -v node >/dev/null; then
            if [ -x "/c/Program Files/nodejs/node.exe" ]; then
              echo 'C:\Program Files\nodejs' >> "$GITHUB_PATH"
              export PATH="/c/Program Files/nodejs:$PATH"
            else
              echo "::error::Node.js is not installed on this runner: install Node $want (app/.nvmrc) on the host and put it on PATH."
              exit 1
            fi
          fi
          have=$(node -p 'process.versions.node.split(".")[0]')
          if [ "$have" != "$want" ]; then
            echo "::error::The runner has Node $(node --version) but app/.nvmrc asks for Node $want: install Node $want on the host."
            exit 1
          fi
          node --version

      # Not on a tag (rule 78): the kept npm and Angular caches are written by branch runs. A tag gets a cache of its own.
      - uses: ./.gitea/actions/node-caches
        if: ${{ runner.os != 'Windows' && !startsWith(github.ref, 'refs/tags/') }}
        with:
          angular-dir: apps/debrief/app
          name: debrief-bundle

      - name: Fresh npm cache and no kept Angular cache on a tag
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}
        run: bash conformance/ci/tag-node-caches.sh apps/debrief/app

      - name: libduckdb
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/apps/debrief
        run: bash scripts/ci/libduckdb-env.sh

      # Not on a tag (rule 78): the kept node_modules is written by branch runs. A tag removes a junction a killed job left
      # (only the link, never its target) and the build step runs a fresh npm ci.
      - name: Reuse node_modules for this lockfile (Windows)
        if: ${{ runner.os == 'Windows' && !startsWith(github.ref, 'refs/tags/') }}
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}
        run: bash apps/debrief/scripts/ci/windows-node-modules.sh link

      - name: No kept node_modules on a tag (Windows)
        if: ${{ runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/') }}
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}
        run: bash apps/debrief/scripts/ci/windows-node-modules.sh unlink

      # No cargo-about and no notices regeneration here: the licences job fails when the committed notices
      # (app/src-tauri/resources, app/src/app/about/generated) are out of date, and a release needs that job.

      # Signed updater artifacts (docs/releasing.md): with the signing secrets set, Tauri writes a .sig next to
      # every installer (v2 updater artifacts: the installers themselves, plus Debrief.app.tar.gz on macOS; never
      # v1 zips) and the public key is built into the app. Without them (forks, pull requests) the app has no
      # update key and reports "updates are not available in this build".
      - name: Build installers
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/apps/debrief/app
        env:
          # One updater key for the family (ADR 0014, amendment): every release is signed with the shared key only. Copies
          # installed before the move cannot verify it and are reinstalled once by hand (the release notes say so).
          # The private key and its password reach this step on a debrief-v* release tag only (ADR 0085 D7, rule 78); any other
          # run signs with a throw-away key made in the job, and inside the step only `tauri build` sees a key, in its environment
          # (conformance/ci/updater-key.sh). The UI and sidecar builds (beforeBuildCommand) run first, without it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/debrief-v') && secrets.PADDOCK_TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/debrief-v') && secrets.PADDOCK_TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.PADDOCK_TAURI_UPDATER_PUBKEY }}
          # Installers use the size-optimised `dist` profile (thin LTO, one codegen unit, stripped); the sidecars match.
          DEBRIEF_CARGO_PROFILE: dist
        run: |
          # The key leaves the environment before npm ci (its install scripts are branch code); updater-key.sh strips both
          # keys of whitespace (strip-keys.mjs) and fails a run that is not a tag but has the private key.
          source ../../../conformance/ci/updater-key.sh
          updater_key_take
          # A tag installs fresh (rule 78): never a node_modules an earlier run left in a kept checkout.
          case "$GITHUB_REF" in
            refs/tags/*) (cd ../../.. && npm ci) ;;
            *) [ -d ../../../node_modules ] || (cd ../../.. && npm ci) ;;
          esac
          # The app imports the shared library from ui/dist (tsconfig paths), which the app build (beforeBuildCommand) needs. It runs
          # here, after updater_key_take, so no key is in its environment.
          (cd ../../.. && npm run build -w ui)
          updater_key_throwaway .
          # Host runners keep their build folder between runs: drop old installers so an earlier version's (signed)
          # installer can never be collected into this release.
          target="$PADDOCK_BUILD_FOLDER"
          if command -v cygpath >/dev/null; then target="$(cygpath -u "$target")"; fi
          rm -rf "$target/dist/bundle"
          bundles='${{ matrix.bundles }}'
          mkdir -p ../target
          extra=()
          # NSIS (Windows): the pinned NSIS tools in <build folder>/.tauri, useLocalToolsDir, checked after the build (ADR 0085 WP-9).
          case ",$bundles," in *,nsis,* | *,appimage,*)
            node ../../../conformance/ci/tauri-tools.mjs install --bundles "$bundles" --src-tauri src-tauri
            echo '{"bundle":{"useLocalToolsDir":true}}' > ../target/tools.conf.json
            extra=(--config ../target/tools.conf.json) ;;
          esac
          # Ad-hoc builds ship WITHOUT the hardened runtime (tauri.macos.conf.json): with it, library validation refuses the
          # bundled libduckdb even after an ad-hoc re-sign (docs/releasing.md). A Developer ID build turns it back on.
          if [ "$RUNNER_OS" = macOS ] && [ -n "${APPLE_SIGNING_IDENTITY:-}" ] && [ "$APPLE_SIGNING_IDENTITY" != "-" ]; then
            echo '{"bundle":{"macOS":{"hardenedRuntime":true}}}' > ../target/hardened.conf.json
            extra=(${extra[@]+"${extra[@]}"} --config ../target/hardened.conf.json)
          fi
          if [ "$updater_key_signing" = true ]; then
            # macOS updates install from the .app bundle's archive.
            if [ "$RUNNER_OS" = macOS ]; then bundles="app,$bundles"; fi
            TAURI_UPDATER_PUBKEY="$updater_pubkey" node -e 'process.stdout.write(JSON.stringify({ bundle: { createUpdaterArtifacts: true }, plugins: { updater: { pubkey: process.env.TAURI_UPDATER_PUBKEY } } }))' > ../target/updater.conf.json
            extra=(--config ../target/updater.conf.json ${extra[@]+"${extra[@]}"})
          else
            echo '::warning::No updater signing secrets: this build cannot update itself.'
          fi
          # The UI and sidecar builds (beforeBuildCommand, merged with tauri.sidecars.conf.json) run here without the key;
          # tauri build gets a configuration that empties the hook (ADR 0085 D7).
          node ../../../conformance/ci/before-build.mjs --app-dir . --config src-tauri/tauri.sidecars.conf.json
          echo '{"build":{"beforeBuildCommand":null}}' > ../target/no-hook.conf.json
          # The key is in the environment of this one command only, never in its arguments (updater_key_exec).
          updater_key_exec npx tauri build --bundles "$bundles" --config src-tauri/tauri.sidecars.conf.json ${extra[@]+"${extra[@]}"} --config ../target/no-hook.conf.json -- --profile dist
          case ",$bundles," in *,nsis,* | *,appimage,*) node ../../../conformance/ci/tauri-tools.mjs check --bundles "$bundles" --src-tauri src-tauri ;; esac
          # Every updater signature verifies against the one public key this build carries.
          if [ "$updater_key_signing" = true ]; then
            sigdir="$target/dist/bundle"
            if command -v cygpath >/dev/null; then sigdir="$(cygpath -m "$sigdir")"; fi
            node ../../../conformance/release/updater-key-check.mjs --pubkey "$updater_pubkey" --dir "$sigdir"
          fi

      # ADR 0032: no binary the installer carries (the app, its sidecars, duckdb.dll, named by the Tauri configuration) imports
      # the VC++ runtime; the runner has the redistributable, a user's PC may not.
      - name: Shipped binaries need no VC++ runtime (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}
        run: |
          # Node on Windows reads C:/... paths, not Git Bash's /c/...
          dir="$PADDOCK_BUILD_FOLDER"
          if command -v cygpath >/dev/null; then dir="$(cygpath -m "$dir")"; fi
          node conformance/release/windows-crt-imports.mjs --src-tauri apps/debrief/app/src-tauri --bin-dir "$dir/dist" \
            --config apps/debrief/app/src-tauri/tauri.sidecars.conf.json

      # The packaged store worker finds libduckdb by run path (crates/debrief-store-worker/build/rpath.rs): a signed,
      # notarized macOS app ignores DYLD_LIBRARY_PATH. Unpack the package and check that one of the worker's run paths
      # reaches the packaged library, so a change to the bundle layout cannot ship a worker that fails to start.
      - name: Packaged store worker finds libduckdb by run path (Linux, macOS)
        if: runner.os != 'Windows'
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/apps/debrief
        run: |
          bundle="$PADDOCK_BUILD_FOLDER/dist/bundle"
          if [ "$RUNNER_OS" = Linux ]; then
            deb=$(find "$bundle/deb" -name '*.deb' | head -n 1)
            tree=$(mktemp -d)
            dpkg-deb -x "$deb" "$tree"
            bin="$tree/usr/bin/debrief-store-worker"; lib=libduckdb.so; origin='$ORIGIN'
            readelf -d "$bin" | grep -E 'R(UN)?PATH' || true
            paths=$(readelf -d "$bin" | sed -n 's/.*(R\(UN\)\{0,1\}PATH).*\[\(.*\)\]/\2/p')
          else
            app=$(find "$bundle/macos" -maxdepth 1 -name '*.app' | head -n 1)
            bin="$app/Contents/MacOS/debrief-store-worker"; lib=libduckdb.dylib; origin='@executable_path'
            otool -L "$bin" | grep duckdb
            paths=$(otool -l "$bin" | awk '/cmd LC_RPATH/ { getline; getline; print $2 }' | paste -sd: -)
          fi
          echo "run paths of $bin: $paths"
          found=
          IFS=: read -ra entries <<< "$paths"
          for p in "${entries[@]}"; do
            p="${p/"$origin"/$(dirname "$bin")}"
            if [ -f "$p/$lib" ]; then found="$p/$lib"; break; fi
          done
          if [ -z "$found" ]; then
            echo "::error::none of the packaged store worker's run paths ($paths) holds $lib"
            exit 1
          fi
          echo "the worker loads $found"

      # signingIdentity "-" (tauri.macos.conf.json) must leave an ad-hoc sealed .app, in the bundle and in the DMG:
      # a linker-signed one is reported as "damaged" on a quarantined download.
      # Also checks every nested Mach-O's Team ID against the app's and runs the packaged store worker's --self-test
      # (opens and reopens a tiny store) and the plugin host from the bundle, so dyld's library validation is exercised.
      - name: Verify the .app and the DMG are ad-hoc sealed and load (macOS)
        if: runner.os == 'macOS'
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/apps/debrief
        run: bash scripts/ci/macos-verify-bundle.sh

      - name: Collect installers
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/apps/debrief
        run: |
          mkdir -p dist
          dir="$PADDOCK_BUILD_FOLDER"
          # Git bash on Windows: turn C:/... into a path find understands.
          if command -v cygpath >/dev/null; then dir="$(cygpath -u "$dir")"; fi
          find "$dir/dist/bundle" -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*-setup.exe' -o -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.sig' \) -exec cp {} dist/ \;
          ls -la dist
          # Every versioned installer must carry this build's version (the .app.tar.gz has none in its name).
          version="$(node -p "require('./app/src-tauri/tauri.conf.json').version")"
          stale="$(ls dist | grep -E '_[0-9]+\.[0-9]+\.[0-9]+' | grep -v "_${version}_" || true)"
          if [ -n "$stale" ]; then echo "::error::Installers from another version: $stale"; exit 1; fi

      # Gitea Actions supports upload/download-artifact v3.
      - uses: actions/upload-artifact@v3
        with:
          name: debrief-${{ runner.os }}
          path: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/apps/debrief/dist/*
          if-no-files-found: error

      - name: Unlink the shared node_modules (Windows)
        if: always() && runner.os == 'Windows'
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}
        run: bash apps/debrief/scripts/ci/windows-node-modules.sh unlink

      - uses: ./.gitea/actions/sccache-stats
        if: always()

      # The slot goes back last, after everything that uses its folders and its sccache port.
      - uses: ./.gitea/actions/job-isolation
        if: always()
        with:
          mode: release

  # Conformance C99 (ADR 0057 §3.4, rule 72): the shared keychain action, scoped to Debrief and crates/ (ER-31); the release
  # waits for it. Tags and manual runs only; ci.yml's c99 job covers pull requests, main and the nightly.
  keychain:
    name: C99 (no Keychain in a macOS build)
    needs: [plan]
    if: (startsWith(github.ref, 'refs/tags/debrief-v') || github.event_name == 'workflow_dispatch') && contains(fromJSON(needs.plan.outputs.rerun_jobs || '["keychain"]'), 'keychain')
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    steps:
      - uses: actions/checkout@v4

      - uses: ./.gitea/actions/keychain
        with:
          scope: apps/debrief

  release:
    name: release
    if: needs.plan.outputs.run == 'true' && startsWith(github.ref, 'refs/tags/debrief-v')
    needs: [plan, bundle, tauri-smoke, rust-lint, rust-test, rust-test-macos, plugin-sdk, licences, frontend, e2e, keychain]
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    env:
      # A release job: ./dev ci steps never download a stored tool binary here (conformance/ci/kit.sh keeps the shell scripts too).
      PADDOCK_DEV_DOWNLOAD: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # CARGO_BUILD_JOBS: this runner's share of the host (`./dev ci build-jobs` through conformance/ci/kit.sh; Linux keeps cargo's default).
      - uses: ./.gitea/actions/build-jobs

      - uses: actions/download-artifact@v3
        with:
          path: apps/debrief/artifacts

      # git-cliff comes with the image.
      - name: Release notes (git-cliff)
        run: |
          command -v git-cliff >/dev/null || cargo install git-cliff --locked
          # Debrief's commits and the shared ones it ships (ADR 0014 §4), between its own debrief-v* tags.
          git cliff -r ../.. --config cliff.toml --tag-pattern 'debrief-v.*' --include-path 'apps/debrief/**' \
            --include-path 'crates/**' --include-path 'ui/**' --latest --strip header -o artifacts/RELEASE_NOTES.md
          # Not signed or notarized yet (decision 2026-10-23): every release explains the first launch. Copies installed
          # before the move to the monorepo cannot verify the family's updater key: they are reinstalled once by hand.
          cat >> artifacts/RELEASE_NOTES.md <<'FIRST_LAUNCH'

          ### First launch

          Debrief is not code-signed yet, so your system may warn the first time you open it.

          - **Existing installs:** download this version once by hand and install it over the old one. Copies installed before Debrief moved to the Paddock repository cannot update themselves to it; later versions update as usual.
          - **macOS:** first drag Debrief from the disk image to Applications and open it from there. The first time, macOS says "“Debrief” Not Opened": choose **Done** (not Move to Trash). Open System Settings > Privacy & Security, scroll down to "“Debrief” was blocked to protect your Mac." and choose **Open Anyway**. macOS asks once more, "Open “Debrief”?": choose **Open Anyway** again, then enter an administrator's name and password. You do this once; later starts open normally. If the button is missing, open Debrief again first.
          - **Windows:** if SmartScreen says "Windows protected your PC", choose **More info > Run anyway**.
          FIRST_LAUNCH

      # cargo-cyclonedx comes with the image.
      - name: SBOMs (CycloneDX)
        run: |
          command -v cargo-cyclonedx >/dev/null || cargo install cargo-cyclonedx --locked
          cargo cyclonedx --manifest-path app/src-tauri/Cargo.toml --format json --override-filename debrief-rust.cdx
          cp app/src-tauri/debrief-rust.cdx.json artifacts/
          (cd ../.. && npm ci && npx --yes @cyclonedx/cyclonedx-npm --workspace debrief-app --omit dev --output-file apps/debrief/artifacts/debrief-ui.cdx.json)

      # latest.json for the updater (the shared conformance/release/latest-json.mjs, tested there): version, notes from RELEASE_NOTES.md, pub_date and, per platform, the
      # installer's URL in this release, its signature (.sig) and size. Installed apps fetch
      # releases/download/debrief-latest/latest.json (tauri.conf.json), the moving release published below.
      - name: Updater manifest (latest.json)
        env:
          # The public address installed apps download from. Inside the runners github.server_url is Gitea's internal
          # http address, which the updater must never be given.
          BASE_URL: https://dev.decryptology.net/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: |
          if ! find artifacts -name '*.sig' | grep -q .; then
            echo '::warning::No signed updater artifacts; latest.json is not published (installed apps will not see this release).'
            exit 0
          fi
          tag='${{ github.ref_name }}'
          node ../../conformance/release/latest-json.mjs --dir artifacts --version "${tag#debrief-}" --notes artifacts/RELEASE_NOTES.md \
            --base-url "$BASE_URL" --out artifacts/latest.json
          # The signatures are in latest.json; the .sig files are not release assets.
          find artifacts -name '*.sig' -delete
          cat artifacts/latest.json

      # Plain API calls instead of gitea.com/actions/release-action, which is a Go action and the runner image has no Go.
      - name: Publish the release
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          publish=../../conformance/release/publish.mjs
          api="${{ github.server_url }}/api/v1"
          node "$publish" --api "$api" --repo "${{ github.repository }}" --tag "${{ github.ref_name }}" \
            --notes artifacts/RELEASE_NOTES.md --dir artifacts
          if [ ! -f artifacts/latest.json ]; then exit 0; fi
          # The updater's one endpoint: the moving debrief-latest release in this repo gets this release's latest.json,
          # which points at the installers here. Nothing is written to the old repo (no update bridge: installs from
          # before the move are reinstalled by hand).
          mkdir -p "$RUNNER_TEMP/latest" && cp artifacts/latest.json "$RUNNER_TEMP/latest/"
          node "$publish" --api "$api" --repo "${{ github.repository }}" --tag debrief-latest \
            --notes artifacts/RELEASE_NOTES.md --dir "$RUNNER_TEMP/latest" --replace

  # Records a fully green scheduled run for this commit; `plan` skips the next scheduled run while main is unchanged.
  # Never runs when anything failed, so a red commit is retried every night.
  # A run the plan skipped (main unchanged, or a train in CI) measured nothing and is never marked.
  nightly-mark:
    name: nightly-mark
    needs: [plan, rust-lint, rust-test, rust-test-macos, plugin-sdk, licences, frontend, e2e, tauri-smoke, bundle]
    if: github.event_name == 'schedule' && success() && needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    defaults:
      run:
        working-directory: .
    steps:
      - name: Marker file
        run: |
          mkdir -p .nightly-green
          echo "${{ github.sha }}" > .nightly-green/sha

      - uses: actions/cache/save@v4
        with:
          path: .nightly-green
          key: debrief-nightly-green-${{ github.sha }}
