# DRAFT, NOT YET APPROVED: a workflow file is a shared integration point (AGENTS.md); the integrator reviews and merges it.
#
# Sighter's ONNX Runtime builds (stage-2 plan SW5, ADR 0001 decision 4 and P5): one job per variant builds the pinned ONNX
# Runtime with telemetry compiled out, static, Release (apps/sighter/scripts/ort/build-ort.sh), checks it for telemetry,
# links and runs the minimal `ort` program on it (scripts/ort/smoke), checks the Windows imports (ADR 0032), and, when
# asked, publishes the archive as a Gitea generic package. App builds never compile ONNX Runtime: they fetch these
# archives by the pins in apps/sighter/scripts/ort/catalogue/.
#
# Manual dispatch only, plus a monthly scheduled run that only builds (no publish) so a toolchain drift on a runner shows
# before the next bump; never on push or pull request (rule 50: CI runs only what a change needs; a cold build is long).
# A published version is never overwritten: Gitea refuses the same file twice, and a rebuild needs PIPELINE_REV + 1 in
# apps/sighter/scripts/ort/pins.env.
#
# Runner labels only, never a host name (user, 2026-10-30): any runner of the right OS takes a job. ubuntu-latest (the
# paddock-ci image), macos-latest (must be Apple silicon: build-ort.sh refuses another host), windows-latest. Every job
# works in its own temporary folder ($RUNNER_TEMP/ort) and detects its compile jobs at run time (build-ort.sh: cores
# minus one, one job per 2 GB after 4 GB for the OS), so no machine's paths, caches or core count are assumed. The
# Windows variants run one after the other (`needs`), so two cold C++ builds never share a runner. Build times:
# apps/sighter/docs/research/2026-10-ort-builds.md.
#
# Needs before the first run: ADR 0032's checker (conformance/release/windows-crt-imports.mjs, branch
# fix/windows-static-crt) merged; the PACKAGE_TOKEN secret (write:package) for publishing; CMake >= 3.28, Python >= 3.10
# and Git on the macOS and Windows runners (the Linux job installs them in the container).

name: sighter-ort

on:
  workflow_dispatch:
    inputs:
      variants:
        description: "Variants to build, space separated (all: every one)"
        required: false
        default: "all"
      publish:
        description: "Publish the archives to the Gitea generic package (only from main)"
        type: boolean
        default: false
  schedule:
    - cron: "17 2 3 * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  ORT_DISABLE_TELEMETRY: "1"
  CARGO_TERM_COLOR: always
  PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main' }}

jobs:
  linux-x64-cpu:
    name: onnxruntime linux-x64-cpu
    if: github.event_name == 'schedule' || inputs.variants == 'all' || contains(inputs.variants, 'linux-x64-cpu')
    runs-on: ubuntu-latest
    container: dev.decryptology.net/decryp7/paddock-ci:v2
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # The job's own folder, in the runner's native form (the artifact upload reads it too).
      - name: Work folder
        run: echo "ORT_WORK=$(cd "$RUNNER_TEMP" && pwd)/ort" >>"$GITHUB_ENV"
      - name: Build tools
        run: |
          command -v cmake >/dev/null && cmake --version | head -n 1
          if ! command -v cmake >/dev/null || ! command -v python3 >/dev/null; then
            apt-get update && apt-get install -y --no-install-recommends cmake python3 git
          fi
      - name: Build ONNX Runtime
        run: apps/sighter/scripts/ort/build-ort.sh linux-x64-cpu "$ORT_WORK"
      - name: Smoke (CPU EP)
        run: |
          stage=$(ls -d "$ORT_WORK"/stage/onnxruntime-*-linux-x64-cpu)
          cd apps/sighter/scripts/ort/smoke
          export CARGO_TARGET_DIR="$ORT_WORK/smoke-target"
          ORT_LIB_PATH="$stage/lib" cargo build --release --locked
          "$CARGO_TARGET_DIR/release/sighter-ort-smoke" cpu
          ../check-telemetry.sh "$CARGO_TARGET_DIR/release/sighter-ort-smoke"
      - name: Publish
        if: env.PUBLISH == 'true'
        env:
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
        run: apps/sighter/scripts/ort/publish-ort.sh "$ORT_WORK/out" linux-x64-cpu
      - uses: actions/upload-artifact@v3
        with:
          name: onnxruntime-linux-x64-cpu
          path: ${{ env.ORT_WORK }}/out/

  macos-arm64-coreml:
    name: onnxruntime macos-arm64-coreml
    if: github.event_name == 'schedule' || inputs.variants == 'all' || contains(inputs.variants, 'macos-arm64-coreml')
    runs-on: macos-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Work folder
        run: echo "ORT_WORK=$(cd "$RUNNER_TEMP" && pwd)/ort" >>"$GITHUB_ENV"
      - name: Build ONNX Runtime
        run: apps/sighter/scripts/ort/build-ort.sh macos-arm64-coreml "$ORT_WORK"
      - name: Smoke (CPU and CoreML EPs)
        run: |
          stage=$(ls -d "$ORT_WORK"/stage/onnxruntime-*-macos-arm64-coreml)
          cd apps/sighter/scripts/ort/smoke
          export CARGO_TARGET_DIR="$ORT_WORK/smoke-target"
          ORT_LIB_PATH="$stage/lib" cargo build --release --locked
          "$CARGO_TARGET_DIR/release/sighter-ort-smoke" cpu
          "$CARGO_TARGET_DIR/release/sighter-ort-smoke" coreml
          ../check-telemetry.sh "$CARGO_TARGET_DIR/release/sighter-ort-smoke"
      - name: Publish
        if: env.PUBLISH == 'true'
        env:
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
        run: apps/sighter/scripts/ort/publish-ort.sh "$ORT_WORK/out" macos-arm64-coreml
      - uses: actions/upload-artifact@v3
        with:
          name: onnxruntime-macos-arm64-coreml
          path: ${{ env.ORT_WORK }}/out/

  windows-x64-directml:
    name: onnxruntime windows-x64-directml
    if: github.event_name == 'schedule' || inputs.variants == 'all' || contains(inputs.variants, 'windows-x64-directml')
    runs-on: windows-latest
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # cygpath -m: C:/... works for Git Bash, Cargo, Node and the artifact upload alike.
      - name: Work folder
        run: echo "ORT_WORK=$(cygpath -m "$RUNNER_TEMP")/ort" >>"$GITHUB_ENV"
      - name: Build ONNX Runtime
        run: apps/sighter/scripts/ort/build-ort.sh windows-x64-directml "$ORT_WORK"
      - name: Smoke (CPU EP) and imports
        run: |
          stage=$(ls -d "$ORT_WORK"/stage/onnxruntime-*-windows-x64-directml)
          dml=$(ls "$ORT_WORK"/cache/directml/*/x64/bin/DirectML.dll)
          cd apps/sighter/scripts/ort/smoke
          export CARGO_TARGET_DIR="$ORT_WORK/smoke-target"
          ORT_LIB_PATH="$stage/lib" cargo build --release --locked
          exe="$CARGO_TARGET_DIR/release/sighter-ort-smoke.exe"
          ../check-windows-imports.sh windows-x64-directml "$exe" "$dml"
          ../check-telemetry.sh "$exe"
          ../check-telemetry.sh --allow-telemetry-group "$dml"
          # CPU first, with no DirectML.dll beside the binary: the delay-loaded import must not stop the start.
          "$exe" cpu
      - name: Smoke (DirectML EP, informational)
        # A runner may expose no DirectX 12 adapter (spike S2 records whether ours do); a failure here does not fail the run.
        continue-on-error: true
        run: |
          exe="$ORT_WORK/smoke-target/release/sighter-ort-smoke.exe"
          cp "$(ls "$ORT_WORK"/cache/directml/*/x64/bin/DirectML.dll)" "$(dirname "$exe")/"
          "$exe" directml
          rm -f "$(dirname "$exe")/DirectML.dll"
      - name: Publish
        if: env.PUBLISH == 'true'
        env:
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
        run: apps/sighter/scripts/ort/publish-ort.sh "$ORT_WORK/out" windows-x64-directml
      - uses: actions/upload-artifact@v3
        with:
          name: onnxruntime-windows-x64-directml
          path: ${{ env.ORT_WORK }}/out/

  windows-x64-cpu:
    name: onnxruntime windows-x64-cpu
    # After the DirectML build: two cold ONNX Runtime builds on one Windows runner would only slow both.
    needs: [windows-x64-directml]
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.variants == 'all' || contains(inputs.variants, 'windows-x64-cpu')) }}
    runs-on: windows-latest
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Work folder
        run: echo "ORT_WORK=$(cygpath -m "$RUNNER_TEMP")/ort" >>"$GITHUB_ENV"
      - name: Build ONNX Runtime
        run: apps/sighter/scripts/ort/build-ort.sh windows-x64-cpu "$ORT_WORK"
      - name: Smoke (CPU EP) and imports
        run: |
          stage=$(ls -d "$ORT_WORK"/stage/onnxruntime-*-windows-x64-cpu)
          cd apps/sighter/scripts/ort/smoke
          export CARGO_TARGET_DIR="$ORT_WORK/smoke-target"
          ORT_LIB_PATH="$stage/lib" cargo build --release --locked
          exe="$CARGO_TARGET_DIR/release/sighter-ort-smoke.exe"
          ../check-windows-imports.sh windows-x64-cpu "$exe"
          ../check-telemetry.sh "$exe"
          "$exe" cpu
      - name: Publish
        if: env.PUBLISH == 'true'
        env:
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
        run: apps/sighter/scripts/ort/publish-ort.sh "$ORT_WORK/out" windows-x64-cpu
      - uses: actions/upload-artifact@v3
        with:
          name: onnxruntime-windows-x64-cpu
          path: ${{ env.ORT_WORK }}/out/

  # OPTIONAL, NOT ENABLED: Windows arm64 with DirectML (stage-2 plan SW5), cross-built on an x64 Windows runner (ONNX
  # Runtime's `--arm64`; pyke's equivalent job takes 40 min on a 4-vCPU runner). To enable it: add a
  # `windows-arm64-directml` variant to build-ort.sh (host Windows x64, `--use_dml --enable_msvc_static_runtime --arm64`,
  # `fetch-directml.sh arm64`, catalogue key windows-aarch64, lib.exe from Hostx64/arm64), uncomment this job, and add the
  # entry to catalogue/onnxruntime.toml. An x64 runner cannot run the arm64 smoke program: it is only built (target
  # aarch64-pc-windows-msvc) and its imports checked, with the x64 DirectML rules; running it needs an arm64 Windows PC.
