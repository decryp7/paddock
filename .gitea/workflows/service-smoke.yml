# The service-after-update smoke (conformance C21, catalogue R03) in a throw-away macOS VM on the Mac runner (rule 7: the
# smoke registers a real launch agent, so it never runs on the runner's own session). Builds the shell demo twice on the
# host, build N (the version in Cargo.toml) and build N+1 (its patch number plus one), and hands both .app bundles to
# tools/macos-vm-smoke.sh, which clones a fresh Tart VM from a pinned base image, runs scripts/shell-demo/smoke-service-update.sh
# in it and always deletes the VM again. Needs Tart on the runner (cirruslabs/cli) and 60 GB free; one VM at a time on the
# Mac (a host-wide VM slot, so a concurrent job or a developer's smoke waits instead of starting a second VM).
# The Linux guest is the same tool with --guest linux: linux-arm64 builds of the app and agent (made in one throw-away
# arm64 container by scripts/shell-demo/build-linux-arm64.sh, so Docker is needed too), the update smoke in a systemd
# --user session, then the desktop smoke (tray, notification, Quit) in a light X session. The VMs run one after the other.

name: service-smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 15 * * *" # 23:17 UTC+8, macOS VM only

concurrency:
  group: service-smoke
  cancel-in-progress: false

jobs:
  # A scheduled run ends early while a train's dispatch run is in CI (./dev ci schedule-skip; ADR 0093 amendment 2026-11-12).
  # Only scheduled runs have it; the jobs below run when it was skipped (any other event) or said run, never when it failed or was cancelled.
  gate:
    name: gate (no train in CI?)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    defaults:
      run:
        working-directory: .
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: train
        uses: ./.gitea/actions/schedule-skip
        with:
          workflow: service-smoke.yml
          dev-token: ${{ secrets.BUILD_INPUTS_TOKEN }}
      - id: decide
        env:
          SKIP: ${{ steps.train.outputs.skip }}
        run: if [ "$SKIP" = true ]; then echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi

  macos-vm:
    name: update smoke in a macOS VM
    needs: [gate]
    if: always() && needs.gate.result != 'failure' && needs.gate.result != 'cancelled' && needs.gate.outputs.run != 'false'
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      # This job's VMs only: the leftover check below never sees another job's VM on the same Mac (job isolation).
      PADDOCK_VM_PREFIX: paddock-smoke-${{ github.run_id }}-${{ github.run_attempt }}-
    steps:
      - uses: actions/checkout@v4

      # The job's own temp folder and socket folder (ER-14): nothing of the smoke lands in the runner user's temp folder.
      - uses: ./.gitea/actions/job-tmpdir

      - name: Persistent build folder
        run: |
          echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/../.paddock-ci-target-shell-demo" >> "$GITHUB_ENV"

      # CARGO_BUILD_JOBS: this runner's share of the host's cores.
      - uses: ./.gitea/actions/build-jobs

      - uses: ./.gitea/actions/build-env

      - name: Tart is installed
        run: tart --version

      - name: Build N and N+1 (the second differs by its patch version, so by its ad-hoc code hash)
        env:
          CI: "true"
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/smoke-builds"; rm -rf "$out"; mkdir -p "$out/n" "$out/n1"
          # The app and its agent carry the same version (the agent's tests check it), so N+1 bumps both: the smoke
          # waits for the agent's heartbeat to report the app's new version, and a changed agent has a new cdhash.
          tomls="apps/shell-demo/src-tauri/Cargo.toml apps/shell-demo/src-tauri/agent/Cargo.toml"
          v_old=$(node scripts/demo-release.mjs shell-demo version)
          v_new=$(node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); console.log(`${a}.${b}.${c+1}`)' "$v_old")
          echo "PADDOCK_SMOKE_OLD_VERSION=$v_old" >> "$GITHUB_ENV"
          echo "PADDOCK_SMOKE_NEW_VERSION=$v_new" >> "$GITHUB_ENV"
          bundle() { bash scripts/demo/bundle.sh shell-demo app,dmg >/dev/null; cp -R "$CARGO_TARGET_DIR"/release/bundle/macos/*.app "$1/"; }
          bundle "$out/n"
          for toml in $tomls; do sed -i '' "s/^version = \"$v_old\"/version = \"$v_new\"/" "$toml"; done
          bundle "$out/n1"
          bash scripts/demo/check-agent-version.sh "$(echo "$out"/n1/*.app)/Contents/MacOS/shell-demo-agent" "$v_new"
          git checkout -- $tomls apps/shell-demo/src-tauri/Cargo.lock 2>/dev/null || true

      - name: Run the smoke in a fresh VM (always deleted)
        run: |
          out="$RUNNER_TEMP/smoke-builds"
          app="$(basename "$(ls -d "$out"/n/*.app)")"
          PADDOCK_VM_LOG_DIR="$RUNNER_TEMP/smoke-logs" \
            bash tools/macos-vm-smoke.sh --old "$out/n/$app" --new "$out/n1/$app"

      - name: Build N and N+1 for linux-arm64 (one container, removed after)
        run: bash scripts/shell-demo/build-linux-arm64.sh "$RUNNER_TEMP/smoke-builds-linux"

      - name: Run the Linux update and desktop smokes in a fresh Ubuntu VM (always deleted)
        run: |
          out="$RUNNER_TEMP/smoke-builds-linux"
          read -r PADDOCK_SMOKE_OLD_VERSION PADDOCK_SMOKE_NEW_VERSION < "$out/versions"
          export PADDOCK_SMOKE_OLD_VERSION PADDOCK_SMOKE_NEW_VERSION
          PADDOCK_VM_LOG_DIR="$RUNNER_TEMP/smoke-logs-linux" \
            bash tools/macos-vm-smoke.sh --guest linux --old "$out/n/paddock-shell-demo" --new "$out/n1/paddock-shell-demo"

      - name: No VM is left behind
        if: always()
        run: |
          left=$(tart list --quiet | grep "^$PADDOCK_VM_PREFIX" || true)
          [ -z "$left" ] || { echo "::error::leftover VMs: $left"; exit 1; }

      - uses: ./.gitea/actions/job-tmpdir
        if: always()
        with:
          mode: remove
