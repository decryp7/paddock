# The service-after-update smoke (conformance C21, catalogue R03) in a throw-away macOS VM on the Mac runner (rule 7: the
# smoke registers a real launch agent, so it never runs on the runner's own session). Builds the shell demo twice on the
# host, build N (the version in Cargo.toml) and build N+1 (its patch number plus one), and hands both .app bundles to
# tools/macos-vm-smoke.sh, which clones a fresh Tart VM from a pinned base image, runs scripts/shell-demo/smoke-service-update.sh
# in it and always deletes the VM again. Needs Tart on the runner (cirruslabs/cli) and 60 GB free; one VM at a time.
# The Linux guest is the same tool with --guest linux: linux-arm64 builds of the app and agent (made in one throw-away
# arm64 container by scripts/shell-demo/build-linux-arm64.sh, so Docker is needed too), the update smoke in a systemd
# --user session, then the desktop smoke (tray, notification, Quit) in a light X session. The VMs run one after the other.

name: service-smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: service-smoke
  cancel-in-progress: false

jobs:
  macos-vm:
    name: update smoke in a macOS VM
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      TART_HOME: /Volumes/d7sst7/ci-tart
    steps:
      - uses: actions/checkout@v4

      - name: Persistent build folder
        run: |
          echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/../.paddock-ci-target-shell-demo" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_JOBS=4" >> "$GITHUB_ENV"

      - uses: ./.gitea/actions/build-env

      - name: Tart is installed
        run: tart --version

      - name: Build N and N+1 (the second differs by its patch version, so by its ad-hoc code hash)
        env:
          CI: "true"
        run: |
          set -euo pipefail
          # The app and its agent carry the same version (the agent's tests check it), so N+1 bumps both: the smoke
          # waits for the agent's heartbeat to report the app's new version, and a changed agent has a new cdhash.
          # The script checks each build's agent version and undoes the bump on every exit.
          out="$RUNNER_TEMP/smoke-builds"
          bash scripts/shell-demo/build-macos-n-n1.sh "$out"
          read -r v_old v_new < "$out/versions"
          echo "PADDOCK_SMOKE_OLD_VERSION=$v_old" >> "$GITHUB_ENV"
          echo "PADDOCK_SMOKE_NEW_VERSION=$v_new" >> "$GITHUB_ENV"

      - name: Run the smoke in a fresh VM (always deleted)
        run: |
          out="$RUNNER_TEMP/smoke-builds"
          app="$(basename "$(ls -d "$out"/n/*.app)")"
          PADDOCK_VM_LOG_DIR="$RUNNER_TEMP/smoke-logs" \
            bash tools/macos-vm-smoke.sh --old "$out/n/$app" --new "$out/n1/$app"

      - name: Build N and N+1 for linux-arm64 (one container, removed after)
        run: bash scripts/shell-demo/build-linux-arm64.sh "$RUNNER_TEMP/smoke-builds-linux"

      - name: Run the Linux update and desktop smokes in a fresh Ubuntu VM (always deleted)
        run: |
          out="$RUNNER_TEMP/smoke-builds-linux"
          read -r PADDOCK_SMOKE_OLD_VERSION PADDOCK_SMOKE_NEW_VERSION < "$out/versions"
          export PADDOCK_SMOKE_OLD_VERSION PADDOCK_SMOKE_NEW_VERSION
          PADDOCK_VM_LOG_DIR="$RUNNER_TEMP/smoke-logs-linux" \
            bash tools/macos-vm-smoke.sh --guest linux --old "$out/n/paddock-shell-demo" --new "$out/n1/paddock-shell-demo"

      - name: No VM is left behind
        if: always()
        run: |
          left=$(tart list --quiet | grep '^paddock-smoke-' || true)
          [ -z "$left" ] || { echo "::error::leftover VMs: $left"; exit 1; }
