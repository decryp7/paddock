# Pitcrew's CI and release in the Paddock monorepo (ADR 0014; moved from decryp7/pitcrew's build.yml): every step runs in
# apps/pitcrew. The plan job runs the rest only when the change reaches Pitcrew (scripts/affected.mjs --ci --app pitcrew).
# Installers are built for pitcrew-v* tags (which publish the Gitea release here, the moving pitcrew-latest release the app's
# updater reads and the bridge latest.json in the old repo), the nightly run and manual runs.
#
# Checks Pitcrew on every push and pull request. Installers are built only for v* tags (which also publish a Gitea
# release with them attached), the nightly run and manual runs (see the bundle job).
#
# Runner labels: ubuntu-latest, windows-latest, macos-latest (a host runner on the owner's Apple Silicon Mac: one job at
# a time, so macOS jobs stay lean; they install nothing system-wide and leave no processes or launch agents behind).
# Linux jobs run in the garage image (https://dev.decryptology.net/decryp7/garage): Rust, Tauri libraries, Node, Playwright
# browsers and sccache pre-installed, root, no sudo.
# Releases need a repository secret RELEASE_TOKEN (a Gitea access token with write:repository scope); signed
# updates need TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD and TAURI_UPDATER_PUBKEY
# (docs/releasing.md).
# Actions are referenced by tag; Renovate (renovate.json, helpers:pinGitHubActionDigests) pins them to digests.

name: pitcrew

on:
  push:
    branches: [main]
    tags: ["pitcrew-v*"]
  pull_request:
  schedule:
    - cron: "45 0 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# A newer push to the same branch supersedes the run still going; tags have their own ref, so releases are never
# cancelled by later pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Every step runs in the app's folder unless it says otherwise.
defaults:
  run:
    working-directory: apps/pitcrew

jobs:
  # Runs the rest only when the change reaches Pitcrew (the same plan as ci.yml); a push to main whose commit carries a
  # pitcrew-v* tag is covered by the tag run.
  plan:
    name: plan
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    defaults:
      run:
        working-directory: .
    outputs:
      run: ${{ steps.plan.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide
        id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          PLAN_TOKEN: ${{ github.token }}
        run: |
          run=$(node scripts/affected.mjs --ci --app pitcrew)
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; then
            tag=$(git ls-remote --tags origin 'refs/tags/pitcrew-v*' | awk -v sha="$SHA" '$1 == sha { sub("refs/tags/", "", $2); sub(/\^\{\}$/, "", $2); print $2; exit }')
            if [ -n "$tag" ]; then run=false; echo "::notice::commit is tagged $tag; the tag run is the gate."; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
  rust-lint:
    name: rust format + clippy
    if: needs.plan.outputs.run == 'true'
    needs: [plan]
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/garage:ubuntu-24.04-20261023-r5
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Cheap and first: a formatting slip fails in seconds.
      - name: Format
        run: cargo fmt --all --check

      - name: Linux dependencies for Tauri
        run: |
          if [ -f /etc/garage-release ]; then echo "garage image: the system packages are installed"; exit 0; fi
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update
          $SUDO apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - uses: actions/cache/restore@v4
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/pitcrew/target
            !apps/pitcrew/target/debug/incremental
          key: clippy-garage-${{ runner.os }}-${{ hashFiles('apps/pitcrew/Cargo.lock') }}
          restore-keys: clippy-garage-${{ runner.os }}-

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - uses: actions/cache/save@v4
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/pitcrew/target
            !apps/pitcrew/target/debug/incremental
          key: clippy-garage-${{ runner.os }}-${{ hashFiles('apps/pitcrew/Cargo.lock') }}

  rust-test:
    name: rust tests (${{ matrix.os }})
    if: needs.plan.outputs.run == 'true'
    needs: [plan]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.os == 'ubuntu-latest' && 'dev.decryptology.net/decryp7/garage:ubuntu-24.04-20261023-r5' || '' }}
    env:
      RUSTC_WRAPPER: ${{ matrix.os == 'ubuntu-latest' && 'sccache' || '' }}
      SCCACHE_DIR: /sccache
      SCCACHE_CACHE_SIZE: 5G
    steps:
      - uses: actions/checkout@v4

      # Host-mode Windows runners: Git's bash on PATH (actions and `shell: bash` need it) and a build folder that
      # outlives the job, so the next run builds incrementally.
      - name: Git bash on PATH and a persistent build folder (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if not exist "%ProgramFiles%\Git\bin\bash.exe" (echo Git for Windows is not installed on this runner & exit /b 1)
          echo %ProgramFiles%\Git\bin>>"%GITHUB_PATH%"
          echo CARGO_TARGET_DIR=%USERPROFILE%\.pitcrew-ci\target-%GITHUB_JOB%>>"%GITHUB_ENV%"
          echo CARGO_BUILD_JOBS=8>>"%GITHUB_ENV%"

      - uses: dtolnay/rust-toolchain@stable

      - name: Linux dependencies for Tauri
        if: runner.os == 'Linux'
        run: |
          if [ -f /etc/garage-release ]; then echo "garage image: the system packages are installed"; exit 0; fi
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update
          $SUDO apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      # sccache compile cache for the Linux build (docs/development.md: a runner volume is the faster option).
      - name: Restore the sccache compile cache
        if: runner.os == 'Linux'
        id: sccache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /sccache
          key: sccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('apps/pitcrew/**/Cargo.lock') }}
          restore-keys: sccache-${{ runner.os }}-${{ github.job }}-

      - uses: actions/cache/restore@v4
        if: runner.os == 'Linux'
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: test-registry-${{ runner.os }}-${{ hashFiles('apps/pitcrew/Cargo.lock') }}
          restore-keys: test-registry-${{ runner.os }}-

      - name: Tests
        run: cargo test --workspace

      - name: sccache statistics
        if: always() && runner.os == 'Linux'
        run: sccache --show-stats

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: always() && runner.os == 'Linux' && steps.sccache.outputs.cache-hit != 'true'
        with:
          path: /sccache
          key: sccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('apps/pitcrew/**/Cargo.lock') }}

      - uses: actions/cache/save@v4
        if: always() && runner.os == 'Linux' && steps.cargo-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: test-registry-${{ runner.os }}-${{ hashFiles('apps/pitcrew/Cargo.lock') }}

  # The macOS code for real (the launch agent, Unix socket, SIGTERM stops, Keychain, SMAppService): clippy and the
  # tests on the Mac host runner. Host toolchains are used as they are (Rust and Node are installed there).
  macos:
    name: macOS clippy + tests
    if: needs.plan.outputs.run == 'true'
    needs: [plan]
    runs-on: macos-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/../.pitcrew-ci-target
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain present
        run: |
          rustc --version && cargo --version
          cargo clippy --version || { echo "::error::clippy is missing on the Mac runner (rustup component add clippy)"; exit 1; }

      - name: Clippy (macOS)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests (macOS)
        run: cargo test --workspace

      # Nothing may stay behind on the host: no fake runners, no test sockets.
      - name: Clean up test processes
        if: always()
        run: |
          pkill -f fake_runner || true
          rm -rf "${TMPDIR:-/tmp}"/pitcrew-* || true

  licences:
    name: licences, scripts + commits
    if: needs.plan.outputs.run == 'true'
    needs: [plan]
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/garage:ubuntu-24.04-20261023-r5
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so pull requests can check every commit message.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/advisory-dbs
          key: licences-${{ runner.os }}-${{ hashFiles('apps/pitcrew/Cargo.lock') }}
          restore-keys: licences-${{ runner.os }}-

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Commit messages follow Conventional Commits
        if: github.event_name == 'pull_request'
        run: node scripts/commit-lint.mjs --range "origin/${{ github.base_ref }}..HEAD"

      - name: Script tests
        run: node --test scripts/commit-lint.test.mjs scripts/release/latest-json.test.mjs scripts/check-index.test.mjs scripts/ci/*.test.mjs

      - name: Licences, advisories and sources
        run: cargo deny --all-features --workspace check

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/advisory-dbs
          key: licences-${{ runner.os }}-${{ hashFiles('apps/pitcrew/Cargo.lock') }}-${{ github.run_id }}

  frontend:
    name: frontend build, lint + unit tests
    if: needs.plan.outputs.run == 'true'
    needs: [plan]
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/garage:ubuntu-24.04-20261023-r5
    defaults:
      run:
        working-directory: apps/pitcrew/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: |
          (cd ../../.. && npm ci)
          npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Frontend build
        run: npx ng build

      - name: Frontend unit tests
        run: npx ng test --watch=false --coverage

  bundle:
    name: bundle (${{ matrix.os }})
    needs: [plan, rust-lint]
    if: needs.plan.outputs.run == 'true' && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: dmg
          - os: ubuntu-latest
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.os == 'ubuntu-latest' && 'dev.decryptology.net/decryp7/garage:ubuntu-24.04-20261023-r5' || '' }}
    env:
      RUSTC_WRAPPER: ${{ matrix.os == 'ubuntu-latest' && 'sccache' || '' }}
      SCCACHE_DIR: /sccache
      SCCACHE_CACHE_SIZE: 5G
    steps:
      - uses: actions/checkout@v4

      # The WebKitGTK, GTK and appindicator packages the app links against, and what the AppImage bundler needs.
      - name: Linux dependencies for Tauri and the bundles
        if: runner.os == 'Linux'
        run: |
          if [ -f /etc/garage-release ]; then echo "garage image: the system packages are installed"; exit 0; fi
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update
          $SUDO apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf file xdg-utils

      # sccache compile cache for the Linux build (docs/development.md: a runner volume is the faster option).
      - name: Restore the sccache compile cache
        if: runner.os == 'Linux'
        id: sccache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /sccache
          key: sccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('apps/pitcrew/**/Cargo.lock') }}
          restore-keys: sccache-${{ runner.os }}-${{ github.job }}-

      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version-file: .nvmrc

      - name: Git bash on PATH and a persistent build folder (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if not exist "%ProgramFiles%\Git\bin\bash.exe" (echo Git for Windows is not installed on this runner & exit /b 1)
          echo %ProgramFiles%\Git\bin>>"%GITHUB_PATH%"
          echo CARGO_TARGET_DIR=%USERPROFILE%\.pitcrew-ci\target-%GITHUB_JOB%>>"%GITHUB_ENV%"
          echo CARGO_BUILD_JOBS=8>>"%GITHUB_ENV%"

      # The Mac host runner keeps its own toolchain (nothing is installed there).
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os != 'macOS'

      # Host runners keep their own Node; fail fast when it is missing or not the major version the repo root .nvmrc asks for.
      - name: Host Node matches app/.nvmrc
        if: runner.os != 'Linux'
        shell: bash
        run: |
          want=$(tr -d ' v\r\n' < ../../.nvmrc | cut -d. -f1)
          if ! command -v node >/dev/null; then
            if [ -x "/c/Program Files/nodejs/node.exe" ]; then
              echo 'C:\Program Files\nodejs' >> "$GITHUB_PATH"
              export PATH="/c/Program Files/nodejs:$PATH"
            else
              echo "::error::Node.js is not installed on this runner: install Node $want (.nvmrc at the repo root)."
              exit 1
            fi
          fi
          have=$(node -p 'process.versions.node.split(".")[0]')
          if [ "$have" != "$want" ]; then
            echo "::error::The runner has Node $(node --version) but the repo root .nvmrc asks for Node $want."
            exit 1
          fi

      # Signed updater artifacts (docs/releasing.md): with the signing secrets set, Tauri writes a .sig next to every
      # installer and the public key is built into the app. Without them (forks, pull requests) the app reports
      # "Updates are not available in this build".
      - name: Build installers
        working-directory: apps/pitcrew/app
        shell: bash
        env:
          # Tauri's DMG step skips Finder window scripting on CI (no Automation permission prompt on the host).
          CI: "true"
          # One updater key for the family (ADR 0014, amendment): built with the shared public key; the first monorepo
          # release is the transition release, signed with the app's old key (PITCREW_TRANSITION_SIGNING_KEY, copied from the
          # old repo's secrets; delete it after that release), every later one with the shared key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.PITCREW_TRANSITION_SIGNING_KEY || secrets.PADDOCK_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.PITCREW_TRANSITION_SIGNING_KEY && secrets.PITCREW_TRANSITION_SIGNING_KEY_PASSWORD || secrets.PADDOCK_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.PADDOCK_TAURI_UPDATER_PUBKEY }}
          # Empty until there is a Developer ID: the build stays ad hoc with the hardened runtime off (rule 23).
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          BUNDLES: ${{ matrix.bundles }}
        run: |
          # Rule 25: whitespace out of the signing secrets (a trailing newline from a pasted secret breaks the key).
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then export TAURI_SIGNING_PRIVATE_KEY="$(printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | tr -d ' \t\r\n')"; fi
          if [ -n "${TAURI_UPDATER_PUBKEY:-}" ]; then export TAURI_UPDATER_PUBKEY="$(printf '%s' "$TAURI_UPDATER_PUBKEY" | tr -d ' \t\r\n')"; fi
          (cd ../../.. && npm ci)
          # The Windows runner keeps its target folder between runs: drop old installers so an earlier version's
          # (signed) installer can never be collected into this release.
          target="${CARGO_TARGET_DIR:-../target}"
          if command -v cygpath >/dev/null; then target="$(cygpath -u "$target")"; fi
          rm -rf "$target/dist/bundle"
          bundles="$BUNDLES"
          # The DMG step removes the .app it packed unless the app bundle is requested too; the bundle check and the
          # macOS updater both need it.
          if [ "$RUNNER_OS" = macOS ]; then bundles="app,$bundles"; fi
          # Ad-hoc builds ship WITHOUT the hardened runtime (tauri.macos.conf.json, Paddock rule 23): ad-hoc code under it
          # cannot load a vendor-signed library ("different Team IDs"). A real signing identity turns it back on, as
          # notarization requires.
          extra=()
          if [ "$RUNNER_OS" = macOS ] && [ -n "${APPLE_SIGNING_IDENTITY:-}" ] && [ "$APPLE_SIGNING_IDENTITY" != "-" ]; then
            mkdir -p ../target
            echo '{"bundle":{"macOS":{"hardenedRuntime":true}}}' > ../target/hardened.conf.json
            extra=(--config ../target/hardened.conf.json)
          fi
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$TAURI_UPDATER_PUBKEY" ]; then
            mkdir -p ../target
            node -e 'process.stdout.write(JSON.stringify({ bundle: { createUpdaterArtifacts: true }, plugins: { updater: { pubkey: process.env.TAURI_UPDATER_PUBKEY } } }))' > ../target/updater.conf.json
            npx tauri build --bundles "$bundles" --config ../target/updater.conf.json ${extra[@]+"${extra[@]}"} -- --profile dist
          else
            echo '::warning::No updater signing secrets: this build cannot update itself.'
            unset TAURI_UPDATER_PUBKEY TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
            npx tauri build --bundles "$bundles" ${extra[@]+"${extra[@]}"} -- --profile dist
          fi

      - name: sccache statistics
        if: always() && runner.os == 'Linux'
        run: sccache --show-stats

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: always() && runner.os == 'Linux' && steps.sccache.outputs.cache-hit != 'true'
        with:
          path: /sccache
          key: sccache-${{ runner.os }}-${{ github.job }}-${{ hashFiles('apps/pitcrew/**/Cargo.lock') }}

      # signingIdentity "-" must leave an ad-hoc sealed .app and DMG with the hardened runtime off, one TeamIdentifier on
      # every bundled Mach-O, and sidecars that start from the built app (Paddock rule 23).
      - name: Verify the .app and the DMG (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/ci/macos-verify-bundle.sh

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist
          dir="${CARGO_TARGET_DIR:-target}"
          if command -v cygpath >/dev/null; then dir="$(cygpath -u "$dir")"; fi
          find "$dir/dist/bundle" -type f \( -name '*-setup.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.app.tar.gz' -o -name '*.sig' \) -exec cp {} dist/ \;
          ls -la dist
          # Every versioned installer must carry this build's version (the .app.tar.gz has none in its name).
          version="$(node -p "require('./app/src-tauri/tauri.conf.json').version")"
          stale="$(ls dist | grep -E '_[0-9]+\.[0-9]+\.[0-9]+' | grep -v "_${version}_" || true)"
          if [ -n "$stale" ]; then echo "::error::Installers from another version: $stale"; exit 1; fi

      # Gitea Actions supports upload/download-artifact v3.
      - uses: actions/upload-artifact@v3
        with:
          name: pitcrew-${{ runner.os }}
          path: apps/pitcrew/dist/*
          if-no-files-found: error

  release:
    name: release
    if: needs.plan.outputs.run == 'true' && (startsWith(github.ref, 'refs/tags/pitcrew-v'))
    needs: [plan, bundle, rust-lint, rust-test, macos, licences, frontend]
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/garage:ubuntu-24.04-20261023-r5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v3
        with:
          path: apps/pitcrew/artifacts

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Release notes (git-cliff)
        run: |
          cargo install git-cliff --locked
          git cliff -r ../.. --config cliff.toml --tag-pattern 'pitcrew-v.*' --include-path 'apps/pitcrew/**' --include-path 'crates/**' --include-path 'ui/**' --latest --strip header -o artifacts/RELEASE_NOTES.md
          # Not signed or notarized yet (decision 2026-10-23): every release explains the first launch.
          cat >> artifacts/RELEASE_NOTES.md <<'FIRST_LAUNCH'

          ### First launch

          Pitcrew is not code-signed yet, so your system may warn the first time you open it.

          - **macOS:** if it says the app cannot be opened, choose Done, then System Settings > Privacy & Security > scroll to the message about Pitcrew > **Open Anyway**.
          - **Windows:** if SmartScreen says "Windows protected your PC", choose **More info > Run anyway**.
          FIRST_LAUNCH

      # latest.json for the updater: version, notes, pub_date and, per platform, the installer's URL, signature and
      # size. Installed apps fetch releases/download/latest/latest.json (the latest non-pre-release release).
      - name: Updater manifest (latest.json)
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          # The public address installed apps download from. Inside the runners github.server_url is Gitea's internal
          # http address, which the updater must never be given.
          BASE_URL: https://dev.decryptology.net/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: |
          node --test scripts/release/latest-json.test.mjs
          if ! find artifacts -name '*.sig' | grep -q .; then
            echo '::warning::No signed updater artifacts; latest.json is not published (installed apps will not see this release).'
            exit 0
          fi
          node scripts/release/latest-json.mjs --dir artifacts --version "${TAG#pitcrew-}" --notes artifacts/RELEASE_NOTES.md \
            --base-url "$BASE_URL" --out artifacts/latest.json
          find artifacts -name '*.sig' -delete
          cat artifacts/latest.json

      # Plain API calls instead of gitea.com/actions/release-action, which is a Go action and the runner image has no Go.
      - name: Publish the release
        shell: bash
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          OLD_REPO: decryp7/Pitcrew
        run: |
          node --test scripts/release/publish.test.mjs
          publish=../../conformance/release/publish.mjs
          api="${{ github.server_url }}/api/v1"
          node "$publish" --api "$api" --repo "${{ github.repository }}" --tag "${{ github.ref_name }}" --notes artifacts/RELEASE_NOTES.md --dir artifacts
          if [ ! -f artifacts/latest.json ]; then exit 0; fi
          # The updater's two endpoints (ADR 0014 §4): the moving pitcrew-latest release here, and the bridge, the old repo's newest
          # release (its releases/download/latest/ resolves there), for copies installed before the move.
          mkdir -p "$RUNNER_TEMP/latest" && cp artifacts/latest.json "$RUNNER_TEMP/latest/"
          node "$publish" --api "$api" --repo "${{ github.repository }}" --tag pitcrew-latest --notes artifacts/RELEASE_NOTES.md --dir "$RUNNER_TEMP/latest" --replace
          node "$publish" --api "$api" --repo "$OLD_REPO" --newest --notes artifacts/RELEASE_NOTES.md --dir "$RUNNER_TEMP/latest" --replace
