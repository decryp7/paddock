# Dyno's installers and release (ADR 0014; moved from decryp7/dyno's build.yml). The gates are not here: Dyno is a leg
# of ci.yml (apps/dyno/paddock.ci.json: Rust on Linux, Windows and macOS, the frontend with the Chromium and WebKit e2e), and its bundles, the macOS seal check,
# the sidecar start and the release are the shared app-release.yml. This file is only the triggers and the app's facts.
#
#   push to main      installers on three OS and the real-app smoke when the change reaches Dyno (the same plan as ci.yml)
#   a dyno-v* tag     the gates (ci.yml, only Dyno's legs, WebKit e2e included), then installers, then the Gitea release with latest.json on
#                     the release and on the moving dyno-latest release, which installed copies update from
#   nightly           installers again, so a toolchain or runner change shows up the night it happens
#   manual            installers without a release (the "one CI build with bundles" before a tag, rule 25); `gates: true`
#                     also runs Dyno's ci.yml legs first
#
# Runner labels: ubuntu-latest (the paddock-ci image), windows-latest and macos-latest (host runners; they install nothing
# system-wide and leave no processes or launch agents behind). Secrets: the family's updater key
# (PADDOCK_TAURI_SIGNING_PRIVATE_KEY, PADDOCK_TAURI_SIGNING_PRIVATE_KEY_PASSWORD, PADDOCK_TAURI_UPDATER_PUBKEY), RELEASE_TOKEN
# (a Gitea access token with write:repository) and, once there is a Developer ID, APPLE_SIGNING_IDENTITY.

name: dyno-release

on:
  push:
    branches: [main]
    tags: ["dyno-v*"]
  schedule:
    - cron: "11 4 * * *"
  workflow_dispatch:
    inputs:
      gates:
        description: "Also run Dyno's gates (ci.yml legs) before the installers"
        type: boolean
        default: false

# A newer push to main supersedes the run still going; a tag has its own ref, so a release is never cancelled by a later push. The group differs from ci.yml's (that
# one is called below and names this workflow too), or the called workflow would cancel its caller.
concurrency:
  group: ${{ github.workflow }}-run-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Runs the rest only when the change reaches Dyno; a push to main whose commit carries a dyno-v* tag is covered by
  # the tag run.
  plan:
    name: plan
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    outputs:
      run: ${{ steps.plan.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # affected.mjs for Dyno, and the skip of a main push whose commit carries a dyno-v* tag (the tag run is the gate).
      # The nightly builds installers even when main's CI nightly was green.
      - id: plan
        uses: ./.gitea/actions/plan
        with:
          app: dyno
          tag-pattern: dyno-v*
          nightly-marker: "false"

  # A tag is gated by exactly Dyno's legs of ci.yml (all of them, both halves, on the tagged commit).
  gates:
    name: gates
    needs: [plan]
    if: ${{ needs.plan.outputs.run == 'true' && (startsWith(github.ref, 'refs/tags/dyno-v') || github.event.inputs.gates == 'true') }}
    uses: ./.gitea/workflows/ci.yml
    with:
      app: dyno
      # A manual run with gates is the "one CI build with bundles" before a tag: WebKit included.
      webkit: ${{ github.event_name == 'workflow_dispatch' }}

  release:
    name: installers + release
    needs: [plan, gates]
    if: ${{ !cancelled() && needs.plan.outputs.run == 'true' && (needs.gates.result == 'success' || (needs.gates.result == 'skipped' && !startsWith(github.ref, 'refs/tags/'))) }}
    uses: ./.gitea/workflows/app-release.yml
    with:
      paddock-ref: ${{ github.sha }}
      app-id: dyno
      app-name: Dyno
      app-dir: apps/dyno/app
      cargo-dir: apps/dyno
      tag-prefix: dyno-
      latest-tag: dyno-latest
      notes-extra: "**Existing installs:** download this version once by hand. Dyno now updates from the Paddock releases, which a copy installed before this version does not look at."
      cliff-config: apps/dyno/cliff.toml
      cliff-paths: |
        apps/dyno/**
        crates/**
        ui/**
      # Every sidecar (bundle.externalBin) is started from the built macOS app with --version, which exits 0 (the old
      # macos-verify-bundle.sh ran the same); dyno-agent and the dyno command have no --self-test.
      sidecars: |
        dyno-agent:--version
        dyno:--version
      # Run paths of the packaged binaries, and the executables a package must carry, on Linux and macOS; on macOS the agent
      # also measures once from the built app (read-only).
      bundle-check: apps/dyno/scripts/check-bundle.sh
      setup-node: false
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.PADDOCK_TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.PADDOCK_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBKEY: ${{ secrets.PADDOCK_TAURI_UPDATER_PUBKEY }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
