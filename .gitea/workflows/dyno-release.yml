# Dyno's installers and release (ADR 0014; moved from decryp7/dyno's build.yml). The gates are not here: Dyno is a leg
# of ci.yml (apps/dyno/paddock.ci.json: Rust on Linux, Windows and macOS, the frontend with the Chromium and WebKit e2e), and its bundles, the macOS seal check,
# the sidecar start and the release are the shared app-release.yml. This file is only the triggers and the app's facts.
#
#   push to main      nothing: the nightly (nightly.yml) builds the installers, so a push does not spend three OS builds
#   a dyno-v* tag     the gates (ci.yml, only Dyno's legs, WebKit e2e included), then installers, then the Gitea release with latest.json on
#                     the release and on the moving dyno-latest release, which installed copies update from
#   nightly           no longer here: nightly.yml builds the installers (installers-dyno), see the verdict job below
#   manual            installers without a release (the "one CI build with bundles" before a tag, rule 25); `gates: true`
#                     also runs Dyno's ci.yml legs beside them (not before). Rule 54: a run whose installers job did not run FAILS (verdict job).
#
# Runner labels: ubuntu-latest (the paddock-ci image), windows-latest and macos-latest (host runners; they install nothing
# system-wide and leave no processes or launch agents behind). Secrets: the family's updater key
# (PADDOCK_TAURI_SIGNING_PRIVATE_KEY, PADDOCK_TAURI_SIGNING_PRIVATE_KEY_PASSWORD, PADDOCK_TAURI_UPDATER_PUBKEY), RELEASE_TOKEN
# (a Gitea access token with write:repository) and, once there is a Developer ID, APPLE_SIGNING_IDENTITY.

name: dyno-release

on:
  push:
    tags: ["dyno-v*"]
  workflow_dispatch:
    inputs:
      gates:
        description: "Also run Dyno's gates (ci.yml legs) before the installers"
        type: boolean
        default: false

# A newer push to main supersedes the run still going; a tag has its own ref, so a release is never cancelled by a later push. The group differs from ci.yml's (that
# one is called below and names this workflow too), or the called workflow would cancel its caller.
concurrency:
  group: ${{ github.workflow }}-run-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Runs the rest only when the change reaches Dyno; a push to main whose commit carries a dyno-v* tag is covered by
  # the tag run.
  plan:
    name: plan
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    outputs:
      run: ${{ steps.plan.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # affected.mjs for Dyno, and the skip of a main push whose commit carries a dyno-v* tag (the tag run is the gate).
      # The nightly builds installers even when main's CI nightly was green.
      - id: plan
        uses: ./.gitea/actions/plan
        with:
          app: dyno
          tag-pattern: dyno-v*
          nightly-marker: "false"
          dev-token: ${{ secrets.BUILD_INPUTS_TOKEN }}

      # ADR 0072 D8: a tag whose pattern a ratchet entry of docs/ipc-endpoint-ratchet.toml blocks is refused (connection endings
      # not yet made right), before the gates run. Fails this job, so `gates` and `release` do not start.
      - name: Connection endings (ADR 0072, C102)
        if: ${{ startsWith(github.ref, 'refs/tags/dyno-v') }}
        run: ./dev check ipc-endpoints --tag "${GITHUB_REF_NAME}"

  # A tag is gated by exactly Dyno's legs of ci.yml (all of them, both halves, on the tagged commit).
  gates:
    name: gates
    needs: [plan]
    if: ${{ needs.plan.outputs.run == 'true' && (startsWith(github.ref, 'refs/tags/dyno-v') || github.event.inputs.gates == 'true') }}
    uses: ./.gitea/workflows/ci.yml
    with:
      app: dyno
      # A manual run with gates is the "one CI build with bundles" before a tag: WebKit included.
      webkit: ${{ github.event_name == 'workflow_dispatch' }}
    secrets:
      BUILD_INPUTS_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}

  # Installers for a manual run: they need only the plan, never `gates`.
  # Gitea 28.2 skips a reusable-workflow job whose need was skipped, whatever its `if` says (125 of 133 green release runs
  # built nothing), so a job that waits on the optional `gates` job can not be the one that builds on a push or a dispatch.
  # A manual run with `gates: true` runs the gates beside the installers; both must be green for the run to be.
  installers:
    name: installers
    needs: [plan]
    if: ${{ needs.plan.outputs.run == 'true' && !startsWith(github.ref, 'refs/tags/') }}
    uses: ./.gitea/workflows/app-release.yml
    with:
      paddock-ref: ${{ github.sha }}
      app-id: dyno
      app-name: Dyno
      app-dir: apps/dyno/app
      cargo-dir: apps/dyno
      tag-prefix: dyno-
      latest-tag: dyno-latest
      notes-extra: "**Existing installs:** download this version once by hand. Dyno now updates from the Paddock releases, which a copy installed before this version does not look at."
      # Dyno's UI imports the shared library from ui/dist, which the app build (Tauri's beforeBuildCommand) needs.
      prepare: npm run build -w ui
      cliff-config: apps/dyno/cliff.toml
      # The first release had no earlier dyno-v* tag, and crates/** and ui/** reach back through the whole monorepo: its notes were
      # the CHANGELOG's [1.0.0] section. Since 1.1.0 every release's notes are the CHANGELOG section of its version (the history
      # behind a release is landing commits, which git-cliff cannot tell apart); notes-from-changelog keeps that after the first tag.
      first-release-changelog: apps/dyno/CHANGELOG.md
      notes-from-changelog: true
      cliff-paths: |
        apps/dyno/**
        crates/**
        ui/**
      # Every sidecar (bundle.externalBin) is started from the built macOS app with --version, which exits 0 (the old
      # macos-verify-bundle.sh ran the same); dyno-agent and the dyno command have no --self-test.
      sidecars: |
        dyno-agent:--version
        dyno:--version
        dyno-bench:--version
        dyno-bench-gpu:--version
        dyno-helper:--version
      # Run paths of the packaged binaries, and the executables a package must carry, on Linux and macOS; on macOS the agent
      # also measures once from the built app (read-only).
      bundle-check: apps/dyno/scripts/check-bundle.sh
      # dyno-agent.exe is a GUI-subsystem program (the login entry starts it without a command prompt window); the dyno command is a console one.
      windows-bundle-check: node apps/dyno/scripts/check-pe-subsystem.mjs --dir
      windows-pre-bundle: node scripts/stage-paddock-setup.mjs --app dyno
      windows-installer-check: node conformance/release/check-per-machine-installer.mjs --conf apps/dyno/app/src-tauri/tauri.conf.json --dir
      setup-node: false
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.PADDOCK_TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.PADDOCK_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBKEY: ${{ secrets.PADDOCK_TAURI_UPDATER_PUBKEY }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  # A tag: the gates first (ER-15: no release past red gates), then the same installers and the Gitea release. Only a tag run has
  # the gates, so this job never waits on a skipped need.
  release:
    name: installers + release
    needs: [plan, gates]
    if: ${{ needs.plan.outputs.run == 'true' && startsWith(github.ref, 'refs/tags/dyno-v') && needs.gates.result == 'success' }}
    uses: ./.gitea/workflows/app-release.yml
    with:
      paddock-ref: ${{ github.sha }}
      app-id: dyno
      app-name: Dyno
      app-dir: apps/dyno/app
      cargo-dir: apps/dyno
      tag-prefix: dyno-
      latest-tag: dyno-latest
      notes-extra: "**Existing installs:** download this version once by hand. Dyno now updates from the Paddock releases, which a copy installed before this version does not look at."
      # Dyno's UI imports the shared library from ui/dist, which the app build (Tauri's beforeBuildCommand) needs.
      prepare: npm run build -w ui
      cliff-config: apps/dyno/cliff.toml
      # The first release had no earlier dyno-v* tag, and crates/** and ui/** reach back through the whole monorepo: its notes were
      # the CHANGELOG's [1.0.0] section. Since 1.1.0 every release's notes are the CHANGELOG section of its version (the history
      # behind a release is landing commits, which git-cliff cannot tell apart); notes-from-changelog keeps that after the first tag.
      first-release-changelog: apps/dyno/CHANGELOG.md
      notes-from-changelog: true
      cliff-paths: |
        apps/dyno/**
        crates/**
        ui/**
      # Every sidecar (bundle.externalBin) is started from the built macOS app with --version, which exits 0 (the old
      # macos-verify-bundle.sh ran the same); dyno-agent and the dyno command have no --self-test.
      sidecars: |
        dyno-agent:--version
        dyno:--version
        dyno-bench:--version
        dyno-bench-gpu:--version
        dyno-helper:--version
      # Run paths of the packaged binaries, and the executables a package must carry, on Linux and macOS; on macOS the agent
      # also measures once from the built app (read-only).
      bundle-check: apps/dyno/scripts/check-bundle.sh
      # dyno-agent.exe is a GUI-subsystem program (the login entry starts it without a command prompt window); the dyno command is a console one.
      windows-bundle-check: node apps/dyno/scripts/check-pe-subsystem.mjs --dir
      windows-pre-bundle: node scripts/stage-paddock-setup.mjs --app dyno
      windows-installer-check: node conformance/release/check-per-machine-installer.mjs --conf apps/dyno/app/src-tauri/tauri.conf.json --dir
      setup-node: false
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.PADDOCK_TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.PADDOCK_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBKEY: ${{ secrets.PADDOCK_TAURI_UPDATER_PUBKEY }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  # What this run proves about the installers (rule 54): "installers: built" or "installers: not built (why)" in the summary, and a
  # red run when a manual run or a tag was meant to build them and did not. The verdict reads whichever of the two installer jobs ran.
  verdict:
    name: installers verdict
    needs: [plan, gates, installers, release]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    steps:
      - uses: actions/checkout@v4
      - uses: ./.gitea/actions/release-verdict
        with:
          app: dyno
          plan-run: ${{ needs.plan.outputs.run }}
          release-result: ${{ needs.release.result != 'skipped' && needs.release.result || needs.installers.result }}
          gates-result: ${{ needs.gates.result }}
