# Reusable (plan X10): an app's release from its tag, and only from one (rule 9). Installers are built on all three
# platforms (macOS DMG sealed ad-hoc and verified with codesign --verify --deep --strict, rule 23; Windows NSIS; Linux deb
# and AppImage), the updater keys are stripped of whitespace (rule 25), the About page gets its commit and date, and the
# Gitea release is published with notes (changelog plus the First launch block), latest.json and the installers.
#
# In the monorepo (ADR 0014) an app's workflow is a thin caller: its tag is `<app>-v*`, the gates are ci.yml's `app` legs
# (`uses: ./.gitea/workflows/ci.yml` with `app: <id>`), and this workflow is called from the same checkout
# (.gitea/workflows/pitcrew-release.yml is the pattern):
#
#   jobs:
#     gates: { uses: ./.gitea/workflows/ci.yml, with: { app: pitcrew } }
#     release:
#       needs: [gates]
#       uses: ./.gitea/workflows/app-release.yml
#       with:
#         paddock-ref: ${{ github.sha }}     # this very commit: the kit lives in the same repository
#         app-id: pitcrew
#         app-name: Pitcrew
#         app-dir: apps/pitcrew/app          # the Tauri project (src-tauri/, tauri.conf.json)
#         cargo-dir: apps/pitcrew            # the Cargo workspace whose .cargo/config.toml includes ci.toml (build-folder)
#         tag-prefix: pitcrew-               # tags are pitcrew-v1.2.3; the version is what follows the prefix
#         latest-tag: pitcrew-latest         # the moving release the updater reads latest.json from
#         sidecars: pitcrew-service:--version
#       secrets: the Tauri keys, RELEASE_TOKEN (the family names its keys PADDOCK_TAURI_*: map them, see pitcrew-release.yml)
#
# Secrets: TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD, TAURI_UPDATER_PUBKEY (the updater; without them the
# build is unsigned and cannot update itself), APPLE_SIGNING_IDENTITY (empty while the apps are ad-hoc sealed, rule 23),
# RELEASE_TOKEN (a Gitea token with write:repository). Run it by hand (workflow_dispatch in the caller) to build and verify
# the bundles without releasing: the "one CI build with bundles" of rule 25. An app in its own repository calls it as
# decryp7/paddock/.gitea/workflows/app-release.yml@<tag> with `paddock-ref: <tag>`, and its own `root` and `cargo-dir`.

name: app-release

on:
  workflow_call:
    inputs:
      paddock-ref:
        description: The Paddock commit or tag whose actions and scripts this run uses (in the monorepo, the commit being built).
        type: string
        required: true
      app-id:
        type: string
        required: true
      app-name:
        type: string
        required: true
      app-dir:
        description: The Tauri project folder (src-tauri/ and package.json), from the repository root.
        type: string
        default: app
      root:
        description: Where .nvmrc, the npm lock and `npm ci` are (default `.`, the repository root, one lock for every app).
        type: string
        default: .
      cargo-dir:
        description: The Cargo workspace folder whose .cargo/config.toml includes ci.toml; the build folder is set there (build-folder action).
        type: string
        required: true
      app-folder:
        description: "The app's folder (apps/<app>) that the C99 keychain job judges with crates/. Empty: derived from cargo-dir (the action keeps its first two segments), which is right for every app whose workspace is apps/<app> or below it."
        type: string
        default: ""
      tag-prefix:
        description: "The app's tag prefix with the dash (pitcrew-): tags are <prefix>v1.2.3. Empty: plain v* tags."
        type: string
        default: ""
      latest-tag:
        description: "The moving release that also carries latest.json (pitcrew-latest). Empty: none."
        type: string
        default: ""
      notes-extra:
        description: "A paragraph after the First launch block of the release notes (e.g. to reinstall once). Empty: none."
        type: string
        default: ""
      cliff-config:
        description: "The git-cliff config of the app's changelog (empty: git-cliff's default lookup)."
        type: string
        default: ""
      cliff-paths:
        description: "Paths whose commits belong in the app's changelog, one glob per line (apps/pitcrew/**). Empty: all commits."
        type: string
        default: ""
      first-release-changelog:
        description: "The app's CHANGELOG.md. With no earlier tag of the app, the notes are this file's section of the tagged version instead of git-cliff's whole history (the monorepo's shared paths reach back years). Empty: git-cliff always."
        type: string
        default: ""
      notes-from-changelog:
        description: "With first-release-changelog: take the CHANGELOG section of the tagged version for every release, not only the first (an app whose history is squashed landing commits). A missing, Unreleased or empty section fails the run."
        type: boolean
        default: false
      prepare:
        description: "A command run at `root` after `npm ci`, before the build (an app whose UI imports the shared library: npm run build -w ui). Empty: none."
        type: string
        default: ""
      setup-node:
        description: "Install Node from .nvmrc on Linux. False for an image that has the repo's Node baked in (the Paddock CI image)."
        type: boolean
        default: true
      sidecars:
        description: "Sidecar programs started from the built macOS app, one per line: name or name:args (default argument --self-test)."
        type: string
        default: ""
      bundle-check:
        description: "An app's own check of the built bundle: a script from the repository root, run on Linux and macOS after the installers are built with the bundle folder ($PADDOCK_BUILD_FOLDER/dist/bundle) as its argument (Dyno's run paths of the packaged binaries). Empty: none."
        type: string
        default: ""
      windows-bundle-check:
        description: "An app's own check of the built Windows binaries: a command run by bash on the Windows runner from the repository root after the installer is built, with the cargo profile folder ($PADDOCK_BUILD_FOLDER/dist, where the sidecars are built) appended as its last argument (Dyno: the PE subsystem of dyno-agent.exe and dyno.exe). Empty: none."
        type: string
        default: ""
      windows-pre-bundle:
        description: "A command run by bash on the Windows runner from the repository root before the installer is built (a per-machine app: `node scripts/stage-paddock-setup.mjs --app <app>`, which builds paddock-setup.exe and stages it beside the installer hooks; family ADR 0053 S7). The updater's public key is in PADDOCK_SETUP_UPDATE_KEY. Empty: none."
        type: string
        default: ""
      windows-installer-check:
        description: "A command run by bash on the Windows runner from the repository root after the installer is built, with the cargo profile folder (holding bundle/nsis) appended: the per-machine artifact gate (`node conformance/release/check-per-machine-installer.mjs --conf <tauri.conf.json> --dir`; ADR 0039). Empty: none."
        type: string
        default: ""
      image:
        type: string
        default: dev.decryptology.net/decryp7/garage:ubuntu-24.04-20261023-r5
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
      TAURI_UPDATER_PUBKEY:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      RELEASE_TOKEN:
        required: false

jobs:
  bundle:
    name: bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    env:
      # A release or installer job builds the tool from source: it never runs a prebuilt binary (ADR 0022, release jobs bypass every cache).
      PADDOCK_DEV_DOWNLOAD: "0"
    # Linux runs in the caller's image (Tauri's libraries pre-installed); Windows and macOS run on the host.
    container: ${{ matrix.os == 'ubuntu-latest' && inputs.image || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: decryp7/paddock
          ref: ${{ inputs.paddock-ref }}
          path: .paddock

      # Host-mode Windows runner: Git's bash on PATH (`shell: bash` needs it).
      - name: Git bash on PATH (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if not exist "%ProgramFiles%\Git\bin\bash.exe" (echo Git for Windows is not installed on this runner & exit /b 1)
          echo %ProgramFiles%\Git\bin>>"%GITHUB_PATH%"

      # CARGO_BUILD_JOBS: this runner's share of the host's cores (before job-isolation, which builds paddock-dev).
      - uses: ./.paddock/.gitea/actions/build-jobs

      # A slot of the host (job isolation; after Git bash on Windows), before every kept folder.
      - uses: ./.paddock/.gitea/actions/job-isolation

      # The same physical checkout path every run on the host runners (sccache keys a compile on its folder), and the
      # release build folder as cargo configuration (.cargo/ci.toml), which `tauri build` reads like every cargo command:
      # target/ on Linux, a kept folder on the hosts.
      - uses: ./.paddock/.gitea/actions/stable-workspace
        if: runner.os != 'Linux'
        with:
          name: ${{ inputs.app-id }}-bundle-${{ runner.os }}

      - uses: ./.paddock/.gitea/actions/build-folder
        with:
          workspace: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/${{ inputs.cargo-dir }}
          name: ${{ inputs.app-id }}-bundle

      - uses: ./.paddock/.gitea/actions/setup-rust

      - uses: ./.paddock/.gitea/actions/setup-node
        if: runner.os == 'Linux' && inputs.setup-node
        with:
          app-dir: ${{ inputs.root }}

      # Host runners keep their own Node; fail fast when it is missing or not the major version .nvmrc asks for.
      - name: Host Node matches .nvmrc
        if: runner.os != 'Linux'
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}
        env:
          NVMRC: ${{ inputs.root }}/.nvmrc
        run: |
          want=$(tr -d ' v\r\n' < "$NVMRC" | cut -d. -f1)
          if ! command -v node >/dev/null; then
            if [ -x "/c/Program Files/nodejs/node.exe" ]; then
              echo 'C:\Program Files\nodejs' >> "$GITHUB_PATH"
              export PATH="/c/Program Files/nodejs:$PATH"
            else
              echo "::error::Node.js is not installed on this runner: install Node $want ($NVMRC)."
              exit 1
            fi
          fi
          have=$(node -p 'process.versions.node.split(".")[0]')
          if [ "$have" != "$want" ]; then
            echo "::error::The runner has Node $(node --version) but $NVMRC asks for Node $want."
            exit 1
          fi

      - uses: ./.paddock/.gitea/actions/node-caches
        with:
          angular-dir: ${{ inputs.app-dir }}
          name: ${{ inputs.app-id }}-bundle

      # A tag names the version the installers carry: fail before three OS build the wrong one.
      - name: The tag names the app's version
        if: startsWith(github.ref, format('refs/tags/{0}v', inputs.tag-prefix))
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          PREFIX: ${{ inputs.tag-prefix }}
          CONF: ${{ inputs.app-dir }}/src-tauri/tauri.conf.json
        run: node .paddock/conformance/ci/check-tag.mjs --tag "$TAG" --prefix "$PREFIX" --conf "$CONF"

      # The first release's notes come from the CHANGELOG: fail here, not after the three builds, when its section is missing,
      # still "Unreleased" or empty.  The earlier tags are listed on the server (ls-remote), so the shallow checkout fetches nothing.
      - name: The first release's CHANGELOG section is ready
        if: startsWith(github.ref, format('refs/tags/{0}v', inputs.tag-prefix)) && inputs.first-release-changelog != ''
        shell: bash
        env:
          FIRST_CHANGELOG: ${{ inputs.first-release-changelog }}
          TAG: ${{ github.ref_name }}
          PREFIX: ${{ inputs.tag-prefix }}
          NOTES_FROM_CHANGELOG: ${{ inputs.notes-from-changelog }}
        run: |
          bash .paddock/conformance/ci/first-release-notes.sh || exit 1

      - uses: ./.paddock/.gitea/actions/build-env

      # A per-machine app's installer embeds paddock-setup.exe (its hooks `File` it): build and stage it first, or the installer
      # build stops. Fails closed (the script errors without the crate, the include stops makensis without the file).
      - name: Stage paddock-setup.exe
        if: inputs.windows-pre-bundle != '' && runner.os == 'Windows'
        shell: bash
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}
        env:
          STAGE: ${{ inputs.windows-pre-bundle }}
          PADDOCK_SETUP_UPDATE_KEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          set -euo pipefail
          eval "$STAGE" || { echo "::error::staging paddock-setup.exe failed (command: $STAGE); see the lines above"; exit 1; }

      - uses: ./.paddock/.gitea/actions/tauri-bundle
        with:
          bundles: ${{ matrix.bundles }}
          app-dir: ${{ inputs.app-dir }}
          root: ${{ inputs.root }}
          prepare: ${{ inputs.prepare }}
          apple-signing-identity: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          signing-private-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          signing-key-password: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          updater-pubkey: ${{ secrets.TAURI_UPDATER_PUBKEY }}

      # The app's own look at what was built (run paths and the executables a package must carry), before the seal check.
      - name: The app's own bundle check
        if: inputs.bundle-check != '' && runner.os != 'Windows'
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}
        env:
          CHECK: ${{ inputs.bundle-check }}
        run: bash "$CHECK" "$PADDOCK_BUILD_FOLDER/dist/bundle"

      # The built Windows binaries read as artifacts (ADR 0039), e.g. no console window for a program the login entry starts.
      - name: The app's own Windows binary check
        if: inputs.windows-bundle-check != '' && runner.os == 'Windows'
        shell: bash
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}
        env:
          CHECK: ${{ inputs.windows-bundle-check }}
        run: |
          set -euo pipefail
          echo "::group::windows binary check"
          eval "$CHECK" "\"$PADDOCK_BUILD_FOLDER/dist\"" || { echo "::error::the Windows binary check failed (command: $CHECK); see the lines above"; exit 1; }
          echo "::endgroup::"

      # The per-machine installer read as an artifact (ADR 0039): administrator level, paddock-setup.exe inside, the include's version.
      - name: The per-machine installer check
        if: inputs.windows-installer-check != '' && runner.os == 'Windows'
        shell: bash
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}
        env:
          CHECK: ${{ inputs.windows-installer-check }}
        run: |
          set -euo pipefail
          echo "::group::per-machine installer check"
          eval "$CHECK" "\"$PADDOCK_BUILD_FOLDER/dist\"" || { echo "::error::the per-machine installer check failed (command: $CHECK); see the lines above"; exit 1; }
          echo "::endgroup::"

      # Rule 23: sealed ad-hoc, hardened runtime off, `codesign --verify --deep --strict` on the .app and the app inside the
      # DMG, every sidecar started from the built app; the app is never started here.
      - uses: ./.paddock/.gitea/actions/macos-verify
        if: runner.os == 'macOS'
        with:
          sidecars: ${{ inputs.sidecars }}
          tauri-conf: ${{ inputs.app-dir }}/src-tauri/tauri.conf.json

      - uses: ./.paddock/.gitea/actions/sccache-stats
        if: always()

      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: ${{ inputs.app-id }}-${{ runner.os }}
          # Where tauri-bundle.sh wrote it: the stable checkout on a host (on Windows the work folder stays a separate clone).
          path: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/dist/*
          if-no-files-found: error

      - uses: ./.paddock/.gitea/actions/host-cleanup
        if: always() && runner.os != 'Linux'
        with:
          app-id: ${{ inputs.app-id }}
          temp-prefix: ${{ inputs.app-id }}-it-

      # The kept build folder stays within its cap; the installers are already in the artifact.
      - uses: ./.paddock/.gitea/actions/prune-build-folder
        if: always() && runner.os != 'Linux'
        with:
          drop-bundles: "true"

      # The slot goes back last, after everything that uses its folders and its sccache port.
      - uses: ./.paddock/.gitea/actions/job-isolation
        if: always()
        with:
          mode: release

  # Conformance C99 (ADR 0057 §3.4, rule 72): a release never ships a build that can reach the macOS Keychain. The shared
  # keychain action, scoped to this app's folder and crates/ (ER-31); tags and manual runs only (ci.yml's c99 job covers the
  # rest). The release waits for it.
  keychain:
    name: C99 (no Keychain in a macOS build)
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: decryp7/paddock
          ref: ${{ inputs.paddock-ref }}
          path: .paddock

      - uses: ./.paddock/.gitea/actions/keychain
        with:
          scope: ${{ inputs.app-folder || inputs.cargo-dir }}
          paddock: .paddock

  release:
    name: release
    if: startsWith(github.ref, format('refs/tags/{0}v', inputs.tag-prefix))
    needs: [bundle, keychain]
    runs-on: ubuntu-latest
    env:
      # A release or installer job builds the tool from source: it never runs a prebuilt binary (ADR 0022, release jobs bypass every cache).
      PADDOCK_DEV_DOWNLOAD: "0"
    permissions:
      contents: write
    container:
      image: ${{ inputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: decryp7/paddock
          ref: ${{ inputs.paddock-ref }}
          path: .paddock

      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          path: artifacts

      - name: Every platform's installers are present
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          for pattern in '*.dmg' '*-setup.exe' '*.deb' '*.AppImage'; do
            ls release/$pattern >/dev/null 2>&1 || { echo "::error::no $pattern was built: nothing is released"; exit 1; }
          done

      - uses: ./.paddock/.gitea/actions/setup-rust

      # git-cliff comes with the Paddock CI image; other images build it once.
      - name: Changelog of this release
        env:
          CONFIG: ${{ inputs.cliff-config }}
          PATHS: ${{ inputs.cliff-paths }}
          PREFIX: ${{ inputs.tag-prefix }}
          FIRST_CHANGELOG: ${{ inputs.first-release-changelog }}
          NOTES_FROM_CHANGELOG: ${{ inputs.notes-from-changelog }}
          TAG: ${{ github.ref_name }}
        run: |
          # The first release of an app has no earlier tag: its notes are the CHANGELOG section of that version.
          OUT=release/CHANGELOG-latest.md bash .paddock/conformance/ci/first-release-notes.sh || exit 1
          if [ -s release/CHANGELOG-latest.md ]; then exit 0; fi
          command -v git-cliff >/dev/null || cargo install git-cliff --locked
          args=(--latest --strip header -o release/CHANGELOG-latest.md)
          if [ -n "$CONFIG" ]; then args+=(--config "$CONFIG"); fi
          if [ -n "$PREFIX" ]; then args+=(--tag-pattern "${PREFIX}v.*"); fi
          while IFS= read -r path; do
            if [ -n "$path" ]; then args+=(--include-path "$path"); fi
          done <<< "$PATHS"
          git cliff "${args[@]}"

      - uses: ./.paddock/.gitea/actions/publish-release
        with:
          app-name: ${{ inputs.app-name }}
          changelog: release/CHANGELOG-latest.md
          artifacts-dir: release
          tag-prefix: ${{ inputs.tag-prefix }}
          latest-tag: ${{ inputs.latest-tag }}
          notes-extra: ${{ inputs.notes-extra }}
          token: ${{ secrets.RELEASE_TOKEN }}
