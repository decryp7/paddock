# Mutation testing of the engine with cargo-mutants: how many deliberately injected bugs the tests catch.
# Weekly over all of debrief-core; a manual run with a `base` tests only the mutants in the lines changed since it (--in-diff).
# No pull_request trigger: pull requests are the branch ledger (docs/plans/merge-queue.md) and start no run (the contract test
# no_workflow_runs_on_a_pull_request).
# Surviving mutants are listed in mutants.out (uploaded); they point at untested behaviour.

name: debrief-mutants

on:
  schedule:
    - cron: "3 12 * * 6" # Saturday 20:03 UTC+8
  workflow_dispatch:
    inputs:
      base:
        description: "A commit or origin/<branch> (for example origin/main): only the mutants in the lines of debrief-core changed since it (empty: all of debrief-core)"
        required: false
        default: ""

# A newer dispatch on the same branch supersedes the one still running.
concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: true

env:
  # The fallback switch of conformance/ci/kit.sh (WP-1): set the repository variable to shell and every kit step runs its script.
  PADDOCK_CI_KIT: ${{ vars.PADDOCK_CI_KIT }}
  CARGO_TERM_COLOR: always

# Every step runs in the app's folder (ADR 0014: Debrief lives in apps/debrief) unless its job says otherwise.
defaults:
  run:
    working-directory: apps/debrief

jobs:
  # Decides whether this run is needed at all:
  # the weekly run is skipped while main is unchanged since the last green one.
  plan:
    name: plan
    runs-on: ubuntu-latest
    container:
      # The paddock-ci image: ./dev (the schedule-skip step) runs there.
      image: dev.decryptology.net/decryp7/paddock-ci:v3
    outputs:
      run: ${{ steps.plan.outputs.run }}
    defaults:
      run:
        working-directory: .
    steps:
      # A scheduled run ends early while a train is in CI (ADR 0093 amendment 2026-11-12); the action needs the checkout.
      - uses: actions/checkout@v4
        if: github.event_name == 'schedule'
      - id: train
        if: github.event_name == 'schedule'
        uses: ./.gitea/actions/schedule-skip
        with:
          workflow: debrief-mutants.yml
          max-gap-hours: "192"
          dev-token: ${{ secrets.BUILD_INPUTS_TOKEN }}

      # Exact-key lookup only: nothing is downloaded. The marker is saved by the weekly-mark job after a fully green run.
      - uses: actions/cache/restore@v4
        id: green
        if: github.event_name == 'schedule'
        with:
          path: .nightly-green
          key: debrief-mutants-weekly-green-${{ github.sha }}
          lookup-only: true

      - name: Decide
        id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          GREEN: ${{ steps.green.outputs.cache-hit }}
          TRAIN_SKIP: ${{ steps.train.outputs.skip }}
        run: |
          run=true
          if [ "$EVENT" = schedule ] && [ "$GREEN" = true ]; then
            run=false
            echo "::notice::main has not changed since the last green run ($SHA); skipping."
          fi
          if [ "$EVENT" = schedule ] && [ "$TRAIN_SKIP" = true ]; then
            run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  mutants:
    needs: [plan]
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/garage:ubuntu-24.04-20261023-r5
    env:
      # The garage image has only `stable`; rust-toolchain.toml names the pinned version, which rustup would download on every run,
      # `./dev` building itself first included. RUSTUP_TOOLCHAIN outranks the file and is set for every step of the job.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # CARGO_BUILD_JOBS: this runner's share of the host (`./dev ci build-jobs` through conformance/ci/kit.sh; Linux keeps cargo's default).
      - uses: ./.gitea/actions/build-jobs

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-mutants
          key: mutants-${{ runner.os }}-${{ hashFiles('apps/debrief/Cargo.lock') }}
          restore-keys: mutants-${{ runner.os }}-

      - name: Install cargo-mutants
        run: command -v cargo-mutants || cargo install cargo-mutants --locked

      - name: Mutants in the changed lines
        if: github.event_name == 'workflow_dispatch' && inputs.base != ''
        env:
          BASE: ${{ inputs.base }}
        run: |
          case "$BASE" in -*) echo "::error::base '$BASE' is not a commit. Dispatch with a commit id or branch name."; exit 1 ;; esac
          git diff --relative "$BASE...HEAD" -- crates/debrief-core > base.diff
          cargo mutants -p debrief-core --in-diff base.diff --timeout-multiplier 3 --no-shuffle

      # Two mutants build at once (--jobs 2): each gets half of the job's share, so the job's rustc count stays its share.
      - uses: ./.gitea/actions/build-jobs
        if: github.event_name != 'workflow_dispatch' || inputs.base == ''
        with:
          split: "2"

      - name: Mutants in debrief-core
        if: github.event_name != 'workflow_dispatch' || inputs.base == ''
        run: cargo mutants -p debrief-core --timeout-multiplier 3 --jobs 2

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: mutants-out
          path: apps/debrief/mutants.out/
          if-no-files-found: ignore

  # Records a fully green scheduled run for this commit; `plan` skips the next scheduled run while main is unchanged.
  # Never runs when anything failed, so a red commit is retried every night.
  weekly-mark:
    name: weekly-mark
    needs: [plan, mutants]
    if: github.event_name == 'schedule' && success() && needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/garage:ubuntu-24.04-20261023-r5
    defaults:
      run:
        working-directory: .
    steps:
      - name: Marker file
        run: |
          mkdir -p .nightly-green
          echo "${{ github.sha }}" > .nightly-green/sha

      - uses: actions/cache/save@v4
        with:
          path: .nightly-green
          key: debrief-mutants-weekly-green-${{ github.sha }}
