# Dyno's CI and release in the Paddock monorepo (ADR 0014; moved from decryp7/dyno's build.yml): every step runs in
# apps/dyno. The plan job runs the rest only when the change reaches Dyno (scripts/affected.mjs --ci --app dyno).
#
# Built like Paddock's own CI (ci.yml): the paddock-ci image on Linux (Rust, Tauri's libraries, Node, Playwright's browsers,
# cargo-nextest and cargo-deny baked in), one Rust leg per OS through the shared actions (setup-rust: sccache on local disk;
# stable-workspace and a kept build folder on the host runners, set as cargo configuration, never CARGO_TARGET_DIR;
# host-tools: the pinned cargo-nextest), nextest's ci profile with its per-test time budget (apps/dyno/.config/nextest.toml)
# plus the doc tests, the npm and Angular caches (node-caches), and the Chromium e2e in two shards.
#
# Where each check runs:
#   rust (Linux, Windows, macOS)  format (Linux), clippy (all three), tests (nextest), doc tests, the Linux adapters against
#                                 the container's real /proc (Linux), the agent's one real measurement (macOS, full runs)
#   licences                      cargo deny, commit messages (pull requests), script tests, Tauri capabilities and CSP
#   frontend                      npm audit, lint, ng build, index.html without inline elements, unit tests with coverage,
#                                 unit tests in another time zone
#   e2e (2 shards)                Playwright, Chromium, mock backend
#   e2e-webkit                    Playwright, WebKit (full runs only)
#   bundle (3 OS)                 installers; the real-app smoke: run paths and seals of the packaged binaries, on macOS
#                                 the seal and sidecars started from the built app (full runs)
#   release                       a dyno-v* tag: notes, latest.json, the Gitea release
# A full run is a push to main, a dyno-v* tag, the nightly run, or a manual run with `bundles: true`; other branches and
# pull requests run Chromium only and build no installers (rule 3).
#
# Dyno's tests act only on dummy processes and temp folders they create themselves (AGENTS.md "Safety"), which matters most
# on the macOS runner: it is a person's real Mac. The host runners keep their build folders within a cap (scripts/ci-prune.sh).
# Runner labels: ubuntu-latest (the paddock-ci image), windows-latest and macos-latest (host runners; they install nothing
# system-wide and leave no processes or launch agents behind).
# Releases need RELEASE_TOKEN (a Gitea access token with write:repository scope); signed updates need the family's updater
# key, PADDOCK_TAURI_SIGNING_PRIVATE_KEY, PADDOCK_TAURI_SIGNING_PRIVATE_KEY_PASSWORD and PADDOCK_TAURI_UPDATER_PUBKEY.
# Installed copies update from the moving dyno-latest release here; copies installed before the move to the monorepo
# are reinstalled once by hand (no transition release).

name: dyno

on:
  push:
    branches: [main]
    tags: ["dyno-v*"]
  pull_request:
  schedule:
    - cron: "45 0 * * *"
  workflow_dispatch:
    inputs:
      bundles:
        description: "Full run: also the installers, the real-app smoke and the WebKit e2e"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# A newer push to the same branch supersedes the run still going; tags have their own ref, so releases are never
# cancelled by later pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Every step runs in the app's folder unless it says otherwise.
defaults:
  run:
    working-directory: apps/dyno

jobs:
  # Runs the rest only when the change reaches Dyno (the same plan as ci.yml); a push to main whose commit carries a
  # dyno-v* tag is covered by the tag run. `full`: the installers, the real-app smoke and WebKit run too.
  plan:
    name: plan
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    defaults:
      run:
        working-directory: .
    outputs:
      run: ${{ steps.plan.outputs.run }}
      full: ${{ steps.plan.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide
        id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          BUNDLES: ${{ github.event.inputs.bundles }}
          PLAN_TOKEN: ${{ github.token }}
        run: |
          run=$(node scripts/affected.mjs --ci --app dyno)
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; then
            tag=$(git ls-remote --tags origin 'refs/tags/dyno-v*' | awk -v sha="$SHA" '$1 == sha { sub("refs/tags/", "", $2); sub(/\^\{\}$/, "", $2); print $2; exit }')
            if [ -n "$tag" ]; then run=false; echo "::notice::commit is tagged $tag; the tag run is the gate."; fi
          fi
          full=false
          case "$EVENT" in
            schedule) full=true ;;
            workflow_dispatch) if [ "$BUNDLES" = true ]; then full=true; fi ;;
            push) case "$REF" in refs/heads/main|refs/tags/dyno-v*) full=true ;; esac ;;
          esac
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "full=$full" >> "$GITHUB_OUTPUT"

  # One leg per OS, as Paddock's crate job: the macOS code for real (launch agent, Unix sockets, SIGSTOP/SIGCONT duty cycles,
  # lsof, codesign) on the Mac host runner, the Windows adapters where they run (cross-checking them from Linux needs a
  # Windows C toolchain for the bundled SQLite). Every step runs even after another
  # failed; nextest names the crate of every failure.
  rust:
    name: rust (${{ matrix.os }})
    if: needs.plan.outputs.run == 'true'
    needs: [plan]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.os == 'ubuntu-latest' && 'dev.decryptology.net/decryp7/paddock-ci:v2' || '' }}
    steps:
      - uses: actions/checkout@v4

      # Host-mode Windows runner: Git's bash on PATH (`shell: bash` needs it), a build folder that outlives the job as cargo
      # configuration (PADDOCK_CARGO_TARGET; CARGO_TARGET_DIR would enter sccache's key), eight build jobs.
      - name: Git bash on PATH and a persistent build folder (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: .
        run: |
          if not exist "%ProgramFiles%\Git\bin\bash.exe" (echo Git for Windows is not installed on this runner & exit /b 1)
          echo %ProgramFiles%\Git\bin>>"%GITHUB_PATH%"
          echo PADDOCK_CARGO_TARGET=--config=build.target-dir='%USERPROFILE%\.paddock-ci\target-dyno-%GITHUB_JOB%'>>"%GITHUB_ENV%"
          echo CARGO_BUILD_JOBS=8>>"%GITHUB_ENV%"

      - name: Persistent build folder (macOS)
        if: runner.os == 'macOS'
        working-directory: .
        run: |
          echo "PADDOCK_CARGO_TARGET=--config=build.target-dir='$HOME/.paddock-ci/target-dyno-$GITHUB_JOB'" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_JOBS=4" >> "$GITHUB_ENV"

      # The same physical checkout path every run on the host runners, so sccache hits the workspace crates too.
      - uses: ./.gitea/actions/stable-workspace
        if: runner.os != 'Linux'
        with:
          name: dyno-${{ github.job }}-${{ runner.os }}

      - uses: ./.gitea/actions/setup-rust
        with:
          components: clippy rustfmt

      - uses: ./.gitea/actions/host-tools

      # Cheap and first: a formatting slip fails in seconds.
      - name: Format
        if: runner.os == 'Linux'
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/apps/dyno
        run: cargo fmt --all --check

      - name: Clippy
        if: ${{ !cancelled() }}
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/apps/dyno
        shell: bash
        run: cargo clippy $PADDOCK_CARGO_TARGET --workspace --all-targets -- -D warnings

      - name: Tests
        if: ${{ !cancelled() }}
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/apps/dyno
        shell: bash
        run: cargo nextest run $PADDOCK_CARGO_TARGET --workspace --profile ci

      # The Linux adapters against this container's real /proc and /sys (the run above already includes them; this names
      # them in the log). scripts/linux-verify.sh also runs them as uid 1000 on a developer machine.
      - name: Linux adapter tests (real /proc)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/apps/dyno
        run: cargo nextest run -p dyno-platform --profile ci -E 'test(/linux::/) | test(/parse::/)'

      # nextest does not run doc tests.
      - name: Doc tests
        if: ${{ !cancelled() }}
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/apps/dyno
        shell: bash
        run: cargo test $PADDOCK_CARGO_TARGET --workspace --doc

      # The real-app smoke on the Mac: the agent's own CLI on the real machine, one measurement, read-only (full runs).
      - name: Agent measures once (macOS)
        if: ${{ !cancelled() && runner.os == 'macOS' && needs.plan.outputs.full == 'true' }}
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/apps/dyno
        run: |
          out="${TMPDIR:-/tmp}/dyno-once-ci.json"
          cargo run $PADDOCK_CARGO_TARGET -q -p dyno-agent -- once > "$out"
          head -c 400 "$out"
          rm -f "$out"

      # Nothing may stay behind on the host: cap the kept build folder, remove test temp folders.
      - name: Prune the build folder (host runners)
        if: always() && runner.os != 'Linux'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            bash scripts/ci-prune.sh "$(cygpath -u "$USERPROFILE")/.paddock-ci/target-dyno-$GITHUB_JOB" 20 || true
            rm -rf "$(cygpath -u "${TEMP:-/tmp}")"/dyno-* || true
          else
            bash scripts/ci-prune.sh "$HOME/.paddock-ci/target-dyno-$GITHUB_JOB" 20 || true
            rm -rf "${TMPDIR:-/tmp}"/dyno-* || true
          fi

      - uses: ./.gitea/actions/sccache-stats
        if: always()

  licences:
    name: licences, scripts + commits
    if: needs.plan.outputs.run == 'true'
    needs: [plan]
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so pull requests can check every commit message.
          fetch-depth: 0

      - name: Commit messages follow Conventional Commits
        if: github.event_name == 'pull_request'
        run: node scripts/commit-lint.mjs --range "origin/${{ github.base_ref }}..HEAD"

      - name: Script tests
        run: node --test scripts/commit-lint.test.mjs scripts/release/latest-json.test.mjs scripts/check-capabilities.test.mjs app/scripts/check-index.test.mjs scripts/ci/*.test.mjs

      # Least-privilege capabilities, a CSP without unsafe-eval or remote origins, drag-region permissions for the
      # frameless title bar, macOS private API in both places (docs/suite-lessons.md).
      - name: Tauri capabilities and CSP
        run: node scripts/check-capabilities.mjs

      # cargo-deny comes with the image.
      - name: Licences, advisories and sources
        run: cargo deny --all-features --workspace check

  frontend:
    name: frontend build, lint + unit tests
    if: needs.plan.outputs.run == 'true'
    needs: [plan]
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    defaults:
      run:
        working-directory: apps/dyno/app
    steps:
      - uses: actions/checkout@v4

      - uses: ./.gitea/actions/node-caches
        with:
          angular-dir: apps/dyno/app
          name: dyno-${{ github.job }}

      - name: Install
        run: |
          (cd ../../.. && npm ci)
          npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npx ng lint

      - name: Frontend build
        run: npx ng build

      # Tauri adds a nonce to inline <style>/<script>, which makes the webview ignore 'unsafe-inline' and block
      # Angular's runtime component styles: index.html must have no inline elements (docs/suite-lessons.md).
      - name: index.html has no inline style or script
        run: node scripts/check-index.mjs

      # The units/format guard and the coverage guard are specs (format.spec.ts, the coverage-guard spec) that run
      # with the rest; a raw number in a template fails them.
      - name: Frontend unit tests (with coverage)
        run: npx ng test --watch=false --coverage

      - name: Tests are timezone-independent
        run: TZ=Pacific/Auckland npx ng test --watch=false

  # Browser flows against `ng serve` with the mock backend in Chromium, in two shards that run at the same time (one worker
  # each; --fully-parallel lets a shard take part of a file). Playwright's browsers come with the image. One port per
  # shard: another job may hold a port on the same runner.
  e2e:
    name: e2e chromium (shard ${{ matrix.shard }}/2)
    if: needs.plan.outputs.run == 'true'
    needs: [plan]
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: apps/dyno/app
    env:
      PW_PORT: ${{ matrix.shard == 1 && '4360' || '4361' }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.gitea/actions/node-caches
        with:
          angular-dir: apps/dyno/app
          name: dyno-e2e-${{ matrix.shard }}

      - name: Install
        run: (cd ../../.. && npm ci)

      - name: End-to-end tests (Chromium)
        run: npx playwright test --project=chromium --workers=1 --fully-parallel --shard=${{ matrix.shard }}/2

      - uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: playwright-results-chromium-${{ matrix.shard }}
          path: |
            apps/dyno/app/playwright-report
            apps/dyno/app/.angular/playwright-results
          if-no-files-found: ignore

  # WebKit (the engine of the macOS app's WKWebView) on full runs only (rule 3: branches run Chromium).
  e2e-webkit:
    name: e2e webkit
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.full == 'true'
    needs: [plan]
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    defaults:
      run:
        working-directory: apps/dyno/app
    env:
      PW_PORT: "4362"
    steps:
      - uses: actions/checkout@v4

      - uses: ./.gitea/actions/node-caches
        with:
          angular-dir: apps/dyno/app
          name: dyno-e2e-webkit

      - name: Install
        run: (cd ../../.. && npm ci)

      - name: End-to-end tests (WebKit)
        run: npx playwright test --project=webkit --workers=1

      - uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: playwright-results-webkit
          path: |
            apps/dyno/app/playwright-report
            apps/dyno/app/.angular/playwright-results
          if-no-files-found: ignore

  # Installers and the real-app smoke (the macOS seal, sidecars started from the built app) on full runs only.
  bundle:
    name: bundle (${{ matrix.os }})
    needs: [plan]
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: dmg
          - os: ubuntu-latest
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.os == 'ubuntu-latest' && 'dev.decryptology.net/decryp7/paddock-ci:v2' || '' }}
    steps:
      - uses: actions/checkout@v4

      # The host runners keep the release build folder between runs. `tauri build` finds the build folder through cargo's
      # environment, so here it is CARGO_TARGET_DIR, at one fixed path per app (a fixed value keeps sccache's key stable).
      - name: Git bash on PATH and a persistent build folder (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: .
        run: |
          if not exist "%ProgramFiles%\Git\bin\bash.exe" (echo Git for Windows is not installed on this runner & exit /b 1)
          echo %ProgramFiles%\Git\bin>>"%GITHUB_PATH%"
          echo CARGO_TARGET_DIR=%USERPROFILE%\.paddock-ci\target-dyno-bundle>>"%GITHUB_ENV%"
          echo CARGO_BUILD_JOBS=8>>"%GITHUB_ENV%"

      - name: Persistent build folder (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "CARGO_TARGET_DIR=$HOME/.paddock-ci/target-dyno-bundle" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_JOBS=4" >> "$GITHUB_ENV"

      - uses: ./.gitea/actions/setup-rust

      # Host runners keep their own Node; fail fast when it is missing or not the major version the repo root .nvmrc asks for.
      - name: Host Node matches .nvmrc
        if: runner.os != 'Linux'
        shell: bash
        run: |
          want=$(tr -d ' v\r\n' < ../../.nvmrc | cut -d. -f1)
          if ! command -v node >/dev/null; then
            if [ -x "/c/Program Files/nodejs/node.exe" ]; then
              echo 'C:\Program Files\nodejs' >> "$GITHUB_PATH"
              export PATH="/c/Program Files/nodejs:$PATH"
            else
              echo "::error::Node.js is not installed on this runner: install Node $want (.nvmrc at the repo root)."
              exit 1
            fi
          fi
          have=$(node -p 'process.versions.node.split(".")[0]')
          if [ "$have" != "$want" ]; then
            echo "::error::The runner has Node $(node --version) but the repo root .nvmrc asks for Node $want."
            exit 1
          fi

      - uses: ./.gitea/actions/node-caches
        with:
          angular-dir: apps/dyno/app
          name: dyno-bundle

      # Rule 25 (C06): the family's updater keys, whitespace out, for the following steps.
      - uses: ./.gitea/actions/strip-signing-keys
        with:
          signing-private-key: ${{ secrets.PADDOCK_TAURI_SIGNING_PRIVATE_KEY }}
          updater-pubkey: ${{ secrets.PADDOCK_TAURI_UPDATER_PUBKEY }}

      # Signed updater artifacts: with the keys set, Tauri writes a .sig next to every installer and the public key is built
      # into the app. Without them (forks, pull requests) the app reports "Updates are not available in this build".
      - name: Build installers
        working-directory: apps/dyno/app
        shell: bash
        env:
          # Tauri's DMG step skips Finder window scripting on CI (no Automation permission prompt on the host).
          CI: "true"
          # linuxdeploy runs without FUSE inside a container.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.PADDOCK_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Empty until there is a Developer ID: the build stays ad hoc with the hardened runtime off (rule 23).
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          BUNDLES: ${{ matrix.bundles }}
        run: |
          (cd ../../.. && npm ci)
          # The host runners keep their build folder between runs: drop old installers so an earlier version's (signed)
          # installer can never be collected into this release.
          target="${CARGO_TARGET_DIR:-../target}"
          if command -v cygpath >/dev/null; then target="$(cygpath -u "$target")"; fi
          rm -rf "$target/dist/bundle"
          bundles="$BUNDLES"
          # The DMG step removes the .app it packed unless the app bundle is requested too; the bundle check and the
          # macOS updater both need it.
          if [ "$RUNNER_OS" = macOS ]; then bundles="app,$bundles"; fi
          # Ad-hoc builds ship WITHOUT the hardened runtime (tauri.macos.conf.json, Paddock rule 23): ad-hoc code under it
          # cannot load a vendor-signed library ("different Team IDs"). A real signing identity turns it back on, as
          # notarization requires.
          extra=()
          if [ "$RUNNER_OS" = macOS ] && [ -n "${APPLE_SIGNING_IDENTITY:-}" ] && [ "$APPLE_SIGNING_IDENTITY" != "-" ]; then
            mkdir -p ../target
            echo '{"bundle":{"macOS":{"hardenedRuntime":true}}}' > ../target/hardened.conf.json
            extra=(--config ../target/hardened.conf.json)
          fi
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ] && [ -n "${TAURI_UPDATER_PUBKEY:-}" ]; then
            mkdir -p ../target
            node -e 'process.stdout.write(JSON.stringify({ bundle: { createUpdaterArtifacts: true }, plugins: { updater: { pubkey: process.env.TAURI_UPDATER_PUBKEY.replace(/\s+/g, "") } } }))' > ../target/updater.conf.json
            npx tauri build --bundles "$bundles" --config ../target/updater.conf.json ${extra[@]+"${extra[@]}"} -- --profile dist
          else
            echo '::warning::No updater signing secrets: this build cannot update itself.'
            unset TAURI_UPDATER_PUBKEY TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
            npx tauri build --bundles "$bundles" ${extra[@]+"${extra[@]}"} -- --profile dist
          fi

      # The real-app smoke: run paths of the packaged binaries, the macOS seal and the executables a package must carry
      # (scripts/check-bundle.sh; on macOS also scripts/ci/macos-verify-bundle.sh: no hardened runtime while ad hoc, one
      # TeamIdentifier, every sidecar starts from the built .app and DMG): a layout change cannot ship a binary that fails to start.
      - name: Packaged binaries have sound run paths and seals (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/check-bundle.sh "${CARGO_TARGET_DIR:-target}/dist/bundle"

      - uses: ./.gitea/actions/sccache-stats
        if: always()

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist
          dir="${CARGO_TARGET_DIR:-target}"
          if command -v cygpath >/dev/null; then dir="$(cygpath -u "$dir")"; fi
          find "$dir/dist/bundle" -type f \( -name '*-setup.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.app.tar.gz' -o -name '*.sig' \) -exec cp {} dist/ \;
          ls -la dist
          # Every versioned installer must carry this build's version (the .app.tar.gz has none in its name).
          version="$(node -p "require('./app/src-tauri/tauri.conf.json').version")"
          stale="$(ls dist | grep -E '_[0-9]+\.[0-9]+\.[0-9]+' | grep -v "_${version}_" || true)"
          if [ -n "$stale" ]; then echo "::error::Installers from another version: $stale"; exit 1; fi

      # Gitea Actions supports upload/download-artifact v3.
      - uses: actions/upload-artifact@v3
        with:
          name: dyno-${{ runner.os }}
          path: apps/dyno/dist/*
          if-no-files-found: error

      # Host runners: keep the build folder within its cap; remove bundles that already went into the artifact.
      - name: Prune the build folder (host runners)
        if: always() && runner.os != 'Linux'
        shell: bash
        run: |
          dir="${CARGO_TARGET_DIR:-}"
          if [ -n "$dir" ]; then
            if command -v cygpath >/dev/null; then dir="$(cygpath -u "$dir")"; fi
            rm -rf "$dir/dist/bundle" || true
            bash scripts/ci-prune.sh "$dir" 20 || true
          fi

  release:
    name: release
    if: needs.plan.outputs.run == 'true' && (startsWith(github.ref, 'refs/tags/dyno-v'))
    needs: [plan, bundle, rust, licences, frontend, e2e, e2e-webkit]
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v3
        with:
          path: apps/dyno/artifacts

      - name: Release notes (git-cliff)
        run: |
          cargo install git-cliff --locked
          git cliff -r ../.. --config cliff.toml --tag-pattern 'dyno-v.*' --include-path 'apps/dyno/**' --include-path 'crates/**' --include-path 'ui/**' --latest --strip header -o artifacts/RELEASE_NOTES.md
          # Not signed or notarized yet (decision 2026-10-23): every release explains the first launch.
          cat >> artifacts/RELEASE_NOTES.md <<'FIRST_LAUNCH'

          ### First launch

          Dyno is not code-signed yet, so your system may warn the first time you open it.

          - **Existing installs:** download this version once by hand. Dyno now updates from the Paddock releases, which a copy installed before this version does not look at.
          - **macOS:** if it says the app cannot be opened, choose Done, then System Settings > Privacy & Security > scroll to the message about Dyno > **Open Anyway**.
          - **Windows:** if SmartScreen says "Windows protected your PC", choose **More info > Run anyway**.
          FIRST_LAUNCH

      # latest.json for the updater: version, notes, pub_date and, per platform, the installer's URL, signature and
      # size. Installed apps fetch it from the moving dyno-latest release.
      - name: Updater manifest (latest.json)
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          # Public URL, not github.server_url: inside the runners that is the internal http address, and the updater
          # requires https.
          BASE_URL: https://dev.decryptology.net/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: |
          node --test scripts/release/latest-json.test.mjs
          if ! find artifacts -name '*.sig' | grep -q .; then
            echo '::warning::No signed updater artifacts; latest.json is not published (installed apps will not see this release).'
            exit 0
          fi
          node scripts/release/latest-json.mjs --dir artifacts --version "${TAG#dyno-}" --notes artifacts/RELEASE_NOTES.md \
            --base-url "$BASE_URL" --out artifacts/latest.json
          find artifacts -name '*.sig' -delete
          cat artifacts/latest.json

      # Plain API calls instead of gitea.com/actions/release-action, which is a Go action and the runner image has no Go.
      - name: Publish the release
        shell: bash
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          node --test scripts/release/publish.test.mjs
          publish=../../conformance/release/publish.mjs
          api="${{ github.server_url }}/api/v1"
          node "$publish" --api "$api" --repo "${{ github.repository }}" --tag "${{ github.ref_name }}" --notes artifacts/RELEASE_NOTES.md --dir artifacts
          if [ ! -f artifacts/latest.json ]; then exit 0; fi
          # The updater's one endpoint (tauri.conf.json): the moving dyno-latest release here.
          mkdir -p "$RUNNER_TEMP/latest" && cp artifacts/latest.json "$RUNNER_TEMP/latest/"
          node "$publish" --api "$api" --repo "${{ github.repository }}" --tag dyno-latest --notes artifacts/RELEASE_NOTES.md --dir "$RUNNER_TEMP/latest" --replace
