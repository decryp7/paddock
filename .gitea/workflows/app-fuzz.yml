# Reusable (plan X41): nightly fuzzing of an app's parsers with cargo-fuzz (libFuzzer, a dated nightly toolchain). Each shard
# compiles the fuzz workspace once and fuzzes its targets one after another; a crash fails the shard and the reproducers are
# uploaded. Triage: the app's docs/fuzzing.md. Every parser crate has a target or a never-panics test (conformance check C34).
#
#   on: { schedule: [{ cron: "13 15 * * *" }], workflow_dispatch: {} }
#   jobs:
#     plan: ...                                                   # .gitea/actions/plan
#     fuzz:
#       needs: [plan]
#       if: needs.plan.outputs.run == 'true'
#       uses: decryp7/paddock/.gitea/workflows/app-fuzz.yml@v0.3.0
#       with:
#         paddock-ref: v0.3.0
#         shards: '[{"shard":1,"targets":"fuzz_json fuzz_csv"},{"shard":2,"targets":"fuzz_ql"}]'
#     mark: { needs: [fuzz], if: "github.event_name == 'schedule' && success()", ... }   # .gitea/actions/nightly-mark

name: app-fuzz

on:
  workflow_call:
    inputs:
      paddock-ref:
        description: The Paddock tag whose actions this run uses (the same tag as in `uses:`).
        type: string
        required: true
      shards:
        description: 'JSON array of { "shard": n, "targets": "space separated target names" }.'
        type: string
        required: true
      seconds:
        description: Seconds per target.
        type: string
        default: "300"
      toolchain:
        description: A dated nightly (the build and its cache change only when the pin does).
        type: string
        default: nightly-2026-10-01
      fuzz-dir:
        description: The folder of the fuzz workspace (cargo fuzz init).
        type: string
        default: fuzz
      max-len:
        type: string
        default: "131072"
      image:
        type: string
        default: dev.decryptology.net/decryp7/garage:ubuntu-24.04-20261023-r5
      timeout-minutes:
        description: A shard that runs longer than this is stopped (its targets, the build and the cache restore included).
        type: number
        default: 120

env:
  # The fallback switch of conformance/ci/kit.sh (WP-1): set the repository variable to shell and every kit step runs its script.
  PADDOCK_CI_KIT: ${{ vars.PADDOCK_CI_KIT }}
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: fuzz (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    container:
      image: ${{ inputs.image }}
    strategy:
      fail-fast: false
      max-parallel: 2 # one of the three Linux slots stays free
      matrix:
        include: ${{ fromJSON(inputs.shards) }}
    env:
      # setup-rust runs ./dev (docs/plans/ci-in-rust.md): no read credential here, so it builds from source; never from the store on a tag.
      PADDOCK_DEV_DOWNLOAD: ${{ startsWith(github.ref, 'refs/tags/') && '0' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: decryp7/paddock
          ref: ${{ inputs.paddock-ref }}
          path: .paddock

      - uses: ./.paddock/.gitea/actions/setup-rust
        with:
          toolchain: ${{ inputs.toolchain }}

      # One key per shard: each shard builds the same targets, so its fuzz/target is all it needs.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-fuzz
            ${{ inputs.fuzz-dir }}/target
          key: fuzz-shard${{ matrix.shard }}-${{ inputs.fuzz-dir }}-${{ runner.os }}-${{ inputs.toolchain }}-${{ hashFiles(format('{0}/Cargo.lock', inputs.fuzz-dir), 'Cargo.lock') }}
          restore-keys: fuzz-shard${{ matrix.shard }}-${{ inputs.fuzz-dir }}-${{ runner.os }}-${{ inputs.toolchain }}-

      # The corpus grows with every night: restored from the newest earlier one for the same fuzz dir and lock file and saved
      # under a key of its own (a cache is never overwritten under the same key). libFuzzer writes the inputs it finds to the
      # FIRST folder it is given, so `corpus/<target>` comes first on the command line; `work/<target>` is only extra input.
      - uses: actions/cache@v4
        with:
          path: ${{ inputs.fuzz-dir }}/corpus
          key: fuzz-corpus-shard${{ matrix.shard }}-${{ inputs.fuzz-dir }}-${{ hashFiles(format('{0}/Cargo.lock', inputs.fuzz-dir)) }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-shard${{ matrix.shard }}-${{ inputs.fuzz-dir }}-${{ hashFiles(format('{0}/Cargo.lock', inputs.fuzz-dir)) }}-

      - name: Install cargo-fuzz
        run: command -v cargo-fuzz || cargo install cargo-fuzz --locked

      - name: Build every fuzz target
        working-directory: ${{ inputs.fuzz-dir }}
        run: cargo fuzz build

      # Every target of the shard runs even after one crashes; the step fails at the end if any did.
      - name: Fuzz ${{ matrix.targets }}
        working-directory: ${{ inputs.fuzz-dir }}
        shell: bash
        env:
          TARGETS: ${{ matrix.targets }}
          SECONDS_PER_TARGET: ${{ inputs.seconds }}
          MAX_LEN: ${{ inputs.max-len }}
        run: |
          failed=()
          for target in $TARGETS; do
            echo "::group::$target"
            mkdir -p "work/$target" "corpus/$target"
            if ! cargo fuzz run "$target" "corpus/$target" "work/$target" -- -max_total_time="$SECONDS_PER_TARGET" -rss_limit_mb=2048 -max_len="$MAX_LEN" -timeout=20; then
              failed+=("$target")
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Crashed: ${failed[*]} (reproducers in the crashes-shard artifact)"
            exit 1
          fi

      # What ran, in the job summary (ER-27): the targets, the time each had and how large each corpus is.
      - name: Summary
        if: always()
        shell: bash
        env:
          TARGETS: ${{ matrix.targets }}
          SECONDS_PER_TARGET: ${{ inputs.seconds }}
          FUZZ_DIR: ${{ inputs.fuzz-dir }}
          OUTCOME: ${{ job.status }}
        run: |
          {
            echo "### fuzz shard ${{ matrix.shard }}: $OUTCOME"
            echo ""
            echo "| target | seconds | corpus files | crashes |"
            echo "|---|---|---|---|"
            for target in $TARGETS; do
              files=$(find "$FUZZ_DIR/corpus/$target" -type f 2>/dev/null | wc -l | tr -d ' ')
              crashes=$(find "$FUZZ_DIR/artifacts/$target" -type f 2>/dev/null | wc -l | tr -d ' ')
              echo "| $target | $SECONDS_PER_TARGET | $files | $crashes |"
            done
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

      # One artifact per shard: the reproducers of every target that crashed, in artifacts/<target>/.
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: crashes-shard-${{ matrix.shard }}
          path: ${{ inputs.fuzz-dir }}/artifacts/
          if-no-files-found: ignore
