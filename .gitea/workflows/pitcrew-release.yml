# Pitcrew's installers and release (ADR 0014; moved from decryp7/pitcrew's build.yml). The gates are not here: Pitcrew is a leg
# of ci.yml (apps/pitcrew/paddock.ci.json: Rust on Linux, Windows and macOS, the frontend), and its bundles, the macOS seal check,
# the sidecar start and the release are the shared app-release.yml. This file is only the triggers and the app's facts.
#
#   push to main      nothing: the nightly (nightly.yml) builds the installers, so a push does not spend three OS builds
#   a pitcrew-v* tag  the gates (ci.yml, only Pitcrew's legs), then installers, then the Gitea release with latest.json on
#                     the release and on the moving pitcrew-latest release, which installed copies update from
#   nightly           no longer here: nightly.yml builds the installers (installers-pitcrew), see the verdict job below
#   manual            installers without a release (the "one CI build with bundles" before a tag, rule 25); `gates: true`
#                     also runs Pitcrew's ci.yml legs beside them (not before). Rule 54: a run whose installers job did not run FAILS (verdict job).
#
# Runner labels: ubuntu-latest (the paddock-ci image), windows-latest and macos-latest (host runners; they install nothing
# system-wide and leave no processes or launch agents behind). Secrets: the family's updater key
# (PADDOCK_TAURI_SIGNING_PRIVATE_KEY, PADDOCK_TAURI_SIGNING_PRIVATE_KEY_PASSWORD, PADDOCK_TAURI_UPDATER_PUBKEY), RELEASE_TOKEN
# (a Gitea access token with write:repository) and, once there is a Developer ID, APPLE_SIGNING_IDENTITY.

name: pitcrew-release

on:
  push:
    tags: ["pitcrew-v*"]
  workflow_dispatch:
    inputs:
      gates:
        description: "Also run Pitcrew's gates (ci.yml legs) before the installers"
        type: boolean
        default: false

# A newer push to main supersedes the run still going; a tag has its own ref, so a release is never cancelled by a later push. The group differs from ci.yml's (that
# one is called below and names this workflow too), or the called workflow would cancel its caller.
concurrency:
  group: ${{ github.workflow }}-run-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Runs the rest only when the change reaches Pitcrew; a push to main whose commit carries a pitcrew-v* tag is covered by
  # the tag run.
  plan:
    name: plan
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    outputs:
      run: ${{ steps.plan.outputs.run }}
    env:
      PADDOCK_DEV_DOWNLOAD: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # affected.mjs for Pitcrew, and the skip of a main push whose commit carries a pitcrew-v* tag (the tag run is the gate).
      # The nightly builds installers even when main's CI nightly was green.
      - id: plan
        uses: ./.gitea/actions/plan
        with:
          app: pitcrew
          tag-pattern: pitcrew-v*
          nightly-marker: "false"
          dev-token: ${{ secrets.BUILD_INPUTS_TOKEN }}
          release: "true"
          # Full when the gates job runs (a tag, or a dispatch with gates on): the scope of the plan action's verdict line.
          full: ${{ startsWith(github.ref, 'refs/tags/pitcrew-v') || github.event.inputs.gates == 'true' }}

      # ADR 0072 D8: a tag whose pattern a ratchet entry of docs/ipc-endpoint-ratchet.toml blocks is refused (connection endings
      # not yet made right), before the gates run. Fails this job, so `gates` and `release` do not start.
      - name: Connection endings (ADR 0072, C102)
        if: ${{ startsWith(github.ref, 'refs/tags/pitcrew-v') }}
        run: ./dev check ipc-endpoints --tag "${GITHUB_REF_NAME}"

  # A tag is gated by exactly Pitcrew's legs of ci.yml (all of them, both halves, on the tagged commit).
  gates:
    name: gates
    needs: [plan]
    if: ${{ needs.plan.outputs.run == 'true' && (startsWith(github.ref, 'refs/tags/pitcrew-v') || github.event.inputs.gates == 'true') }}
    uses: ./.gitea/workflows/ci.yml
    with:
      app: pitcrew
      release: true
    secrets:
      BUILD_INPUTS_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}

  # Installers for a manual run: they need only the plan, never `gates`.
  # Gitea 28.3.0 skips a reusable-workflow job whose need was skipped, whatever its `if` says (125 of 133 green release runs
  # built nothing), so a job that waits on the optional `gates` job can not be the one that builds on a push or a dispatch.
  # A manual run with `gates: true` runs the gates beside the installers; both must be green for the run to be.
  installers:
    name: installers
    # paddock-timing-job: macos — the macOS bundle starts every sidecar from the built app and bounds it (the --version start check)
    # paddock-timing-overlap: only a manual run with `gates: true` overlaps the gates (ci.yml legs); a tag run orders release after gates. Gitea 28.3.0 skips a reusable-workflow job whose need was skipped, so this job cannot need `gates` without building nothing on a push (see above). Remove this waiver, and make the job need `gates`, once go-gitea #40126 / #40221 (an `if` on a job with a skipped need) is in the runner's Gitea; or use one gated copy of this job.
    needs: [plan]
    if: ${{ needs.plan.outputs.run == 'true' && !startsWith(github.ref, 'refs/tags/') }}
    uses: ./.gitea/workflows/app-release.yml
    with:
      paddock-ref: ${{ github.sha }}
      app-id: pitcrew
      app-name: Pitcrew
      app-dir: apps/pitcrew/app
      cargo-dir: apps/pitcrew
      tag-prefix: pitcrew-
      latest-tag: pitcrew-latest
      notes-extra: "**Existing installs:** download this version once by hand. Pitcrew now updates from the Paddock releases, which a copy installed before this version does not look at."
      cliff-config: apps/pitcrew/cliff.toml
      cliff-paths: |
        apps/pitcrew/**
        crates/**
        ui/**
      # --version: Pitcrew's service has no --self-test; its --version loads every library and exits 0.
      sidecars: pitcrew-service:--version
      setup-node: false
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.PADDOCK_TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.PADDOCK_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBKEY: ${{ secrets.PADDOCK_TAURI_UPDATER_PUBKEY }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  # A tag: the gates first (ER-15: no release past red gates), then the same installers and the Gitea release. Only a tag run has
  # the gates, so this job never waits on a skipped need.
  release:
    name: installers + release
    needs: [plan, gates]
    if: ${{ needs.plan.outputs.run == 'true' && startsWith(github.ref, 'refs/tags/pitcrew-v') && needs.gates.result == 'success' }}
    uses: ./.gitea/workflows/app-release.yml
    with:
      paddock-ref: ${{ github.sha }}
      app-id: pitcrew
      app-name: Pitcrew
      app-dir: apps/pitcrew/app
      cargo-dir: apps/pitcrew
      tag-prefix: pitcrew-
      latest-tag: pitcrew-latest
      notes-extra: "**Existing installs:** download this version once by hand. Pitcrew now updates from the Paddock releases, which a copy installed before this version does not look at."
      cliff-config: apps/pitcrew/cliff.toml
      cliff-paths: |
        apps/pitcrew/**
        crates/**
        ui/**
      # --version: Pitcrew's service has no --self-test; its --version loads every library and exits 0.
      sidecars: pitcrew-service:--version
      setup-node: false
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.PADDOCK_TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.PADDOCK_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBKEY: ${{ secrets.PADDOCK_TAURI_UPDATER_PUBKEY }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  # What this run proves about the installers (rule 54): "installers: built" or "installers: not built (why)" in the summary, and a
  # red run when a manual run or a tag was meant to build them and did not. The verdict reads whichever of the two installer jobs ran.
  verdict:
    name: installers verdict
    needs: [plan, gates, installers, release]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    steps:
      - uses: actions/checkout@v4
      - uses: ./.gitea/actions/release-verdict
        with:
          app: pitcrew
          plan-run: ${{ needs.plan.outputs.run }}
          release-result: ${{ needs.release.result != 'skipped' && needs.release.result || needs.installers.result }}
          gates-result: ${{ needs.gates.result }}
