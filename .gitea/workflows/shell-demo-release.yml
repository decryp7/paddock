# Releases Paddock Shell Demo (apps/shell-demo, plan docs/plans/workbench.md §10, S18) from a `shell-demo-v<version>` tag,
# and only from one (rule 9): the gates run again on the tagged commit, then the installers are built on all three
# platforms (macOS DMG sealed ad-hoc and verified, Windows NSIS, Linux deb and AppImage) and the Gitea release is created
# with them and the version's notes. The app's tags are its own: the packages and crates release from `v*` (publish.yml),
# and ci.yml's `v*` tag filter never matches `shell-demo-v*`.
#
# Before tagging (rule 25): `cargo deny check advisories` in apps/shell-demo/src-tauri, one CI run with bundles
# (workflow_dispatch below builds them without releasing), the icon check, and the First launch notes (added here).
# The demo has no updater key yet: its builds say "Updates are not available in this build" and no latest.json is
# published. Secrets: RELEASE_TOKEN (a Gitea token with write:repository) for the release.

name: shell-demo-release

on:
  push:
    tags: ["shell-demo-v*"]
  # Builds and verifies the installers without releasing (the "one CI build with bundles" before a tag).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    name: gates (version, icons, ui, app)
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/garage:ubuntu-24.04-20261023-r5
    steps:
      - uses: actions/checkout@v4

      # CARGO_BUILD_JOBS: this runner's share of the host (conformance/ci/build-jobs.sh; Linux keeps cargo's default).
      - uses: ./.gitea/actions/build-jobs

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: The tag names the app's version
        if: startsWith(github.ref, 'refs/tags/shell-demo-v')
        run: node scripts/demo-release.mjs shell-demo check-tag "${{ github.ref_name }}"

      - name: The app icons are the icon pipeline's
        run: node scripts/demo-release.mjs shell-demo icons

      - name: The release notes (the version's CHANGELOG section)
        run: node scripts/demo-release.mjs shell-demo notes /tmp/notes.md && cat /tmp/notes.md

      - name: UI (specs, translations, the shell demo's build and browser checks)
        working-directory: ui
        env:
          PW_PORT: 4300
          SHELL_DEMO_PORT: 4301
          WORKBENCH_DEMO_PORT: 4302
        run: |
          (cd .. && npm ci)  # the root npm workspace (ADR 0014 §1)
          npm test
          npm run test:scripts
          npm run build
          npm run i18n:check
          npm run shell-demo:build
          npx playwright install --with-deps chromium
          npx playwright test --project=shell-demo

      - name: App (fmt, clippy, tests on the mock runtime, advisories)
        working-directory: apps/shell-demo/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo nextest run --workspace --config-file ../../../crates/.config/nextest.toml --profile ci
          cargo test --workspace --doc
          cargo deny check

  bundle:
    name: bundle (${{ matrix.os }})
    needs: [gates]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    # Linux runs in the garage image (Tauri's libraries pre-installed); Windows and macOS run on the host.
    container: ${{ matrix.os == 'ubuntu-latest' && 'dev.decryptology.net/decryp7/garage:ubuntu-24.04-20261023-r5' || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Git bash on PATH (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if not exist "%ProgramFiles%\Git\bin\bash.exe" (echo Git for Windows is not installed on this runner & exit /b 1)
          echo %ProgramFiles%\Git\bin>>"%GITHUB_PATH%"

      - name: Build folder of the job (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/../.paddock-ci-target-shell-demo" >> "$GITHUB_ENV"

      # CARGO_BUILD_JOBS: this runner's share of the host's cores (before job-isolation, which builds paddock-dev).
      - uses: ./.gitea/actions/build-jobs

      # A slot of the host (job isolation; after Git bash on Windows); on Windows the build folder is the slot's kept one.
      - uses: ./.gitea/actions/job-isolation

      - name: Kept build folder (Windows)
        if: runner.os == 'Windows'
        run: |
          dir="$(bash conformance/ci/job-isolation.sh path target shell-demo)"
          echo "CARGO_TARGET_DIR=$(cygpath -w "$dir")" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: 24

      # The About page's commit and date (plan X10): PADDOCK_BUILD_COMMIT and PADDOCK_BUILD_DATE for option_env!.
      - uses: ./.gitea/actions/build-env

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: runner.os == 'Windows'

      - name: Toolchain present
        run: rustc --version && cargo --version && node --version

      - name: Build the installers
        env:
          CI: "true"
        run: |
          bash scripts/demo/bundle.sh shell-demo "${{ matrix.bundles }}"

      # Rule 23: sealed ad-hoc, hardened runtime off, `codesign --verify --deep --strict` on the .app and on the app inside
      # the DMG, every Mach-O with the app's TeamIdentifier, the agent started with --self-test; the app is never started.
      - name: Verify the .app and the DMG (macOS)
        if: runner.os == 'macOS'
        run: bash scripts/demo/verify-macos.sh shell-demo

      # Rule 23 on Linux and Windows: the sample agent (externalBin, plan X4) starts with --self-test; on Linux from the
      # .deb's own files (unpacked, never installed), on Windows from the copy the installer bundles.
      - name: The bundled agent starts (Linux)
        if: runner.os == 'Linux'
        uses: ./.gitea/actions/sidecar-self-test
        with:
          deb: apps/shell-demo/dist/*.deb
          sidecars: shell-demo-agent

      - name: The bundled agent starts (Windows)
        if: runner.os == 'Windows'
        uses: ./.gitea/actions/sidecar-self-test
        with:
          dir: apps/shell-demo/src-tauri/binaries
          sidecars: shell-demo-agent

      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: paddock-shell-demo-${{ runner.os }}
          path: apps/shell-demo/dist/*
          if-no-files-found: error

      - uses: ./.gitea/actions/job-isolation
        if: always()
        with:
          mode: release

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/shell-demo-v')
    needs: [bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: dev.decryptology.net/decryp7/garage:ubuntu-24.04-20261023-r5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/download-artifact@9bc31d5ccc31df68ecc42ccf4149144866c47d8a # v3
        with:
          path: artifacts

      - name: Every platform's installers are present
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release
          for pattern in '*.dmg' '*-setup.exe' '*.deb' '*.AppImage'; do
            ls release/$pattern >/dev/null 2>&1 || { echo "::error::no $pattern was built: nothing is released"; exit 1; }
          done

      - name: Publish the release
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          node --test scripts/demo-release.test.mjs
          node scripts/demo-release.mjs shell-demo notes release-notes.md
          node scripts/demo-release.mjs shell-demo publish "${{ github.ref_name }}" release release-notes.md
