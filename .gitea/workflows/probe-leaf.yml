# Part of the throwaway probe (probe-outer.yml): the leaf, a matrix fed by an input, (Linux only, so no host isolation is needed).
name: probe-leaf
on:
  workflow_call:
    inputs:
      legs:
        type: string
        required: true
jobs:
  leaf:
    name: leaf (${{ matrix.os }}, ${{ matrix.n }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.legs) }}
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v3
    steps:
      - run: echo "probe leaf ${{ matrix.n }} on ${{ matrix.os }}; github.job=${{ github.job }}"
