# Part of the throwaway probe (probe-outer.yml): the leaf, a matrix fed by an input, with the job-level container expression ci.yml uses.
name: probe-leaf
on:
  workflow_call:
    inputs:
      legs:
        type: string
        required: true
jobs:
  leaf:
    name: leaf (${{ matrix.os }}, ${{ matrix.n }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.legs) }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.os == 'ubuntu-latest' && 'dev.decryptology.net/decryp7/paddock-ci:v3' || '' }}
    steps:
      - run: echo "probe leaf ${{ matrix.n }} on ${{ matrix.os }}; github.job=${{ github.job }}"
