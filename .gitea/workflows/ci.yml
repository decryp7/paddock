# Checks the shared UI package, its entry points, the reference apps and the Rust crates on every push and pull request.
# Publishing is not here: a v* tag runs publish.yml (gates, then the cargo and npm registries and the Gitea release); this
# workflow ends with the publish dry run, so a tag never meets a packaging problem first.
#
# Runner labels: ubuntu-latest (jobs in the shared paddock-ci image, ci-image/), windows-latest and macos-latest (host runners, tools used as
# installed), as in Debrief and Pitwall.

name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  ui:
    name: ui (tokens, contrast, components, entry points, publish dry run)
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v1
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: npm ci

      # WCAG contrast of every text/background pair and colour-vision separation of the chart palette.
      - name: Contrast and CVD checks
        run: npm run test:tokens

      - name: Component specs
        run: npm test

      - name: Script tests
        run: npm run test:scripts

      # Every entry point (root, /shell/*, /workbench/*) is built by ng-packagr; the dry run below checks each is exported.
      - name: Build the library (all entry points)
        run: npm run build

      # The shell's message catalog and the pseudo-locale files match the build (plan S15: `npm run i18n` to refresh).
      - name: Translation files up to date
        run: npm run i18n:check

      - name: Build @decryp7/paddock-e2e
        run: npm run build:e2e

      - name: Build the shell demo
        run: npm run shell-demo:build

      - name: Build the workbench demo
        run: npm run workbench-demo:build

      # Lists every npm package, entry point and crate with what a tag would publish; publishes nothing.
      - name: Publish dry run
        run: node ../scripts/publish.mjs --skip-build

  # The reference apps in the browser (gallery and shell demo; axe, keyboard, CSP, 320 px), in two shards that run at the
  # same time: the specs run one at a time within a shard (playwright.config.ts), so splitting the files halves the wait.
  # The apps compile from source (tsconfig paths), so a shard needs no library build.
  e2e:
    name: reference apps (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v1
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      # Playwright's browsers and Chrome for Testing are baked into the image (ci-image/): nothing is downloaded per job.
      - name: Install
        run: npm ci

      - name: Reference app checks
        # CI names its ports (@decryp7/paddock-e2e refuses a default there: another job could hold it), one pair per shard.
        env:
          PW_PORT: ${{ matrix.shard == 1 && '4300' || '4310' }}
          SHELL_DEMO_PORT: ${{ matrix.shard == 1 && '4301' || '4311' }}
          WORKBENCH_DEMO_PORT: ${{ matrix.shard == 1 && '4302' || '4312' }}
        run: npx playwright test --shard=${{ matrix.shard }}/2

  # @decryp7/paddock-conformance (conformance/, plan X9): every check has a good and a bad fixture, the release scripts are
  # tested (latest.json byte-equal to the apps' copy), the shared macOS verify runs against a shimmed bundle. No dependencies.
  conformance:
    name: conformance (checks, release scripts)
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v1
    defaults:
      run:
        working-directory: conformance
    steps:
      - uses: actions/checkout@v4

      - name: Tests
        run: npm test

      # Paddock runs its own conformance checks (plan X9). Only the checks that apply to a library repository run; the rest
      # are skipped on purpose, each for a reason:
      #   C03 icons, C04 macOS signing, C13 Rust lint preset (needs a root Cargo.toml; the crates workspace is crates/),
      #   C28 repo baseline (Paddock is the source of templates/repo), C29 window weight (the demo's budgets are not set)
      #     are app-only or Paddock owns the source of what they compare;
      #   C07 release preflight and C08 release artifacts: Paddock releases through publish.yml, not an app release job;
      #   C23 commit lint and doc blocks: Paddock's AGENTS.md is the source of the blocks, and its history predates the
      #     100-character subject rule.
      # C24 needs every docs/images file reviewed (docs/images/REVIEWED.md). C37 needs one test binary per crate and every
      # crate tested here and on the workspace hack (paddock.conformance.json). C14 (hermetic wrapper), C29 and C30 (wall clock)
      # report warnings; C36 (parser hardening) is strict here (a new parser needs its never-panics test); C15 has a dated
      # waiver (paddock.waivers.toml).
      - name: Paddock itself (applicable checks)
        working-directory: .
        run: node conformance/bin/paddock-conformance.mjs --app paddock --root . --only C06,C14,C15,C16,C24,C29,C30,C31,C34,C35,C36,C37 --strict C36


  # The shared CI actions' scripts and the dev and host tools (plan X10, X47): every script runs in a scratch folder with a
  # PATH of shims, so no launchd, systemd, Docker or installed app is touched. New-app templates are covered by scripts/.
  tools:
    name: tools and shared scripts
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v1
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: node --test tools/test/*.test.mjs

      - name: new-app templates
        run: node --test scripts/new-app.test.mjs scripts/coverage-gate.test.mjs

  # @decryp7/paddock-eslint (eslint/, plan X11): RuleTester cases per rule and the preset run through ESLint on temp files.
  eslint-preset:
    name: eslint preset (rules 27 to 39)
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v1
    defaults:
      run:
        working-directory: eslint
    steps:
      - uses: actions/checkout@v4

      - run: npm ci

      - run: npm test

  crates:
    name: crates (fmt, workspace hack, unused deps, coverage, deny)
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v1
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v4
      - uses: ./.gitea/actions/setup-rust
        with:
          sccache-redis-endpoint: ${{ vars.SCCACHE_REDIS_ENDPOINT }}
          sccache-redis-db: ${{ vars.SCCACHE_REDIS_DB }}
      - run: cargo fmt --all --check

      # cargo-hakari and cargo-machete come with the image (ci-image/).
      # One feature set per dependency (docs/dev-setup.md): the workspace-hack crate is current and every member uses it.
      - name: Workspace hack up to date
        run: cargo hakari generate --diff && cargo hakari manage-deps --dry-run && cargo hakari verify

      # Unused dependencies. A false report goes into `ignored` of [workspace.metadata.cargo-machete] (Cargo.toml) or of the
      # crate's own [package.metadata.cargo-machete], with the reason; the workspace-hack crate is depended on for features.
      - name: Unused dependencies
        run: cargo machete $(ls -d paddock-*/ | grep -v '^paddock-workspace-hack/$')

      # Merged line coverage over all test binaries, adapters included (the per-binary summary counts unused generic instances).
      # Native glue files are left out (crates/README.md: never logic, reviewed by hand), and so are paddock-proc's test child (a
      # re-executed test binary that its parent ends with SIGKILL, so its coverage data is never written) and paddock-ipc's (the same); paddock-ipc's endpoint/{unix,windows}.rs are
      # its native glue (OS error paths; the portable surface in endpoint/mod.rs is covered). paddock-chromium's fake browser
      # runs in re-executed test binaries that are often ended by force (no coverage data), like paddock-proc's test child.
      # The gate (scripts/coverage-gate.mjs) leaves out only the `#[tauri::command]` attribute lines: llvm-cov charges every
      # region of the macro's generated wrapper to that line, which no test can all reach.
      - name: Coverage (>= 99 % lines)
        run: |
          cargo llvm-cov nextest --profile ci --workspace --all-features --ignore-filename-regex '(paddock-window/src/tauri|paddock-panels/src/tauri|paddock-updater/src/tauri|paddock-secrets/src/os|paddock-diag/src/tauri|paddock-files/src/tauri|paddock-service/src|paddock-watch/src|paddock-metrics/src|paddock-health/src/tauri|paddock-siblings/src)/native\.rs$|paddock-proc/src/testchild\.rs$|paddock-chromium/src/fake\.rs$|paddock-ipc/src/bin/test_child\.rs$|paddock-plugin-test/src/bin/(fixture|fixture_v1|misbehaving)\.rs$|paddock-plugin-api/src/entry\.rs$|paddock-plugin-test/src/process\.rs$|paddock-ipc/src/endpoint/(unix|windows)\.rs$' --lcov --output-path lcov.info
          node ../scripts/coverage-gate.mjs lcov.info 99
      - run: cargo deny check
      - uses: ./.gitea/actions/sccache-stats
        if: always()

  # Each crate on Linux, Windows and macOS (platform-only bugs exist: lessons): clippy and tests with every feature, so the
  # `tauri` adapters are built too. One step per crate that runs even after another crate failed, so every failure names
  # its crate; scripts/publish.test.mjs fails when a workspace member has no step here.
  crate:
    name: crate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Linux runs in the paddock-ci image (Rust, Tauri's libraries, Node, Playwright, Chrome for Testing, cargo-nextest baked in); Windows and
    # macOS run on the host.
    container: ${{ matrix.os == 'ubuntu-latest' && 'dev.decryptology.net/decryp7/paddock-ci:v1' || '' }}
    defaults:
      run:
        working-directory: crates
        shell: bash
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      # Host-mode Windows runner: Git's bash on PATH (`shell: bash` needs it), a build folder that outlives the job, and
      # eight build jobs (the runner runs two jobs at once).
      - name: Git bash on PATH and a persistent build folder (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: .
        run: |
          if not exist "%ProgramFiles%\Git\bin\bash.exe" (echo Git for Windows is not installed on this runner & exit /b 1)
          echo %ProgramFiles%\Git\bin>>"%GITHUB_PATH%"
          echo CARGO_TARGET_DIR=%USERPROFILE%\.paddock-ci\target-%GITHUB_JOB%>>"%GITHUB_ENV%"
          echo CARGO_BUILD_JOBS=8>>"%GITHUB_ENV%"

      # The Mac host runner: a build folder next to the checkout that outlives the job; the host toolchain as installed.
      - name: Persistent build folder (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/../.paddock-ci-target" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_JOBS=4" >> "$GITHUB_ENV"

      # Toolchain and sccache on every OS: the shared Redis backend (database 5) when the Gitea variables are set. The macOS
      # leg can switch to the local disk with `sccache-backend: local` if the network proves slower than its disk.
      - uses: ./.gitea/actions/setup-rust
        with:
          components: clippy
          sccache-backend: auto
          sccache-redis-endpoint: ${{ vars.SCCACHE_REDIS_ENDPOINT }}
          sccache-redis-db: ${{ vars.SCCACHE_REDIS_DB }}

      - name: Toolchain present
        run: |
          rustc --version && cargo --version
          cargo clippy --version || { echo "::error::clippy is missing on this runner (rustup component add clippy)"; exit 1; }

      # The paddock-ci image has cargo-nextest; the host runners get the prebuilt binary.
      - uses: taiki-e/install-action@v2
        if: runner.os != 'Linux'
        with:
          tool: cargo-nextest

      - name: paddock-commands
        if: ${{ !cancelled() }}
        run: cargo clippy -p paddock-commands --all-targets --all-features -- -D warnings && cargo nextest run -p paddock-commands --all-features --profile ci && cargo test -p paddock-commands --all-features --doc

      # The report adapter on the mock runtime with a fake save picker; the native dialog (`dialog` feature) is built too.
      - name: paddock-diag
        if: ${{ !cancelled() }}
        run: cargo clippy -p paddock-diag --all-targets --all-features -- -D warnings && cargo nextest run -p paddock-diag --all-features --profile ci && cargo nextest run -p paddock-diag --profile ci && cargo test -p paddock-diag --all-features --doc

      - name: paddock-dialogs
        if: ${{ !cancelled() }}
        run: cargo clippy -p paddock-dialogs --all-targets --all-features -- -D warnings && cargo nextest run -p paddock-dialogs --all-features --profile ci && cargo test -p paddock-dialogs --all-features --doc

      - name: paddock-download
        if: ${{ !cancelled() }}
        run: cargo clippy -p paddock-download --all-targets --all-features -- -D warnings && cargo nextest run -p paddock-download --all-features --profile ci && cargo nextest run -p paddock-download --no-default-features --profile ci && cargo test -p paddock-download --all-features --doc

      - name: paddock-health
        if: ${{ !cancelled() }}
        run: cargo clippy -p paddock-health --all-targets --all-features -- -D warnings && cargo nextest run -p paddock-health --all-features --profile ci && cargo test -p paddock-health --all-features --doc

      - name: paddock-jobs
        if: ${{ !cancelled() }}
        run: cargo clippy -p paddock-jobs --all-targets --all-features -- -D warnings && cargo nextest run -p paddock-jobs --all-features --profile ci && cargo test -p paddock-jobs --all-features --doc

      - name: paddock-menu
        if: ${{ !cancelled() }}
        run: cargo clippy -p paddock-menu --all-targets --all-features -- -D warnings && cargo nextest run -p paddock-menu --all-features --profile ci && cargo test -p paddock-menu --all-features --doc

      - name: paddock-settings
        if: ${{ !cancelled() }}
        run: cargo clippy -p paddock-settings --all-targets --all-features -- -D warnings && cargo nextest run -p paddock-settings --all-features --profile ci && cargo test -p paddock-settings --all-features --doc

      # The plugin: every shell command registered on the mock runtime, the permission sets through Tauri's ACL, the
      # demo's contracts and manifest, the version lockstep with @decryp7/paddock-ui. Also without the optional features.
      - name: paddock-shell
        if: ${{ !cancelled() }}
        run: cargo clippy -p paddock-shell --all-targets --all-features -- -D warnings && cargo nextest run -p paddock-shell --all-features --profile ci && cargo nextest run -p paddock-shell --profile ci && cargo test -p paddock-shell --all-features --doc

      - name: paddock-startup
        if: ${{ !cancelled() }}
        run: cargo clippy -p paddock-startup --all-targets --all-features -- -D warnings && cargo nextest run -p paddock-startup --all-features --profile ci && cargo test -p paddock-startup --all-features --doc

      - name: paddock-updater
        if: ${{ !cancelled() }}
        run: cargo clippy -p paddock-updater --all-targets --all-features -- -D warnings && cargo nextest run -p paddock-updater --all-features --profile ci && cargo nextest run -p paddock-updater --profile ci && cargo test -p paddock-updater --all-features --doc

      - name: paddock-proc
        if: ${{ !cancelled() }}
        run: cargo clippy -p paddock-proc --all-targets --all-features -- -D warnings && cargo nextest run -p paddock-proc --all-features --profile ci && cargo test -p paddock-proc --all-features --doc

      - name: paddock-runtime
        if: ${{ !cancelled() }}
        run: cargo clippy -p paddock-runtime --all-targets --all-features -- -D warnings && cargo nextest run -p paddock-runtime --all-features --profile ci && cargo test -p paddock-runtime --all-features --doc

      # The driver against its fake browser (Unix); the real-browser test runs only where CHROMIUM_TEST_PATH names a
      # Chrome for Testing build, never an installed browser (rule 7).
      - name: paddock-chromium
        if: ${{ !cancelled() }}
        run: cargo clippy -p paddock-chromium --all-targets --all-features -- -D warnings && cargo nextest run -p paddock-chromium --all-features --profile ci && cargo test -p paddock-chromium --all-features --doc

      - name: paddock-mcp
        if: ${{ !cancelled() }}
        run: cargo clippy -p paddock-mcp --all-targets --all-features -- -D warnings && cargo nextest run -p paddock-mcp --all-features --profile ci && cargo test -p paddock-mcp --all-features --doc
      - name: paddock-archive
        if: ${{ !cancelled() }}
        run: cargo clippy -p paddock-archive --all-targets --all-features -- -D warnings && cargo nextest run -p paddock-archive --all-features --profile ci && cargo test -p paddock-archive --all-features --doc
      - name: paddock-bench
        if: ${{ !cancelled() }}
        run: cargo clippy -p paddock-bench --all-targets --all-features -- -D warnings && cargo nextest run -p paddock-bench --all-features --profile ci && cargo test -p paddock-bench --all-features --doc
      - name: paddock-cli
        if: ${{ !cancelled() }}
        run: cargo clippy -p paddock-cli --all-targets --all-features -- -D warnings && cargo nextest run -p paddock-cli --all-features --profile ci && cargo test -p paddock-cli --all-features --doc
      # The IPC with real child processes (its own test child) and the companion link; the fuzz target is built on Linux.
      - name: paddock-view
        if: ${{ !cancelled() }}
        run: cargo clippy -p paddock-view --all-targets --all-features -- -D warnings && cargo nextest run -p paddock-view --all-features --profile ci && cargo test -p paddock-view --all-features --doc

      - name: paddock-ipc
        if: ${{ !cancelled() }}
        run: cargo clippy -p paddock-ipc --all-targets --all-features -- -D warnings && cargo nextest run -p paddock-ipc --all-features --profile ci && cargo test -p paddock-ipc --all-features --doc

      # Crash containment: panics, quarantine on a fake clock, guarded calls with time budgets.
      - name: paddock-guard
        if: ${{ !cancelled() }}
        run: cargo clippy -p paddock-guard --all-targets --all-features -- -D warnings && cargo nextest run -p paddock-guard --all-features --profile ci && cargo test -p paddock-guard --all-features --doc

      - name: paddock-env
        if: ${{ !cancelled() }}
        run: cargo clippy -p paddock-env --all-targets --all-features -- -D warnings && cargo nextest run -p paddock-env --all-features --profile ci && cargo test -p paddock-env --all-features --doc
      - name: paddock-files
        if: ${{ !cancelled() }}
        run: cargo clippy -p paddock-files --all-targets --all-features -- -D warnings && cargo nextest run -p paddock-files --all-features --profile ci && cargo test -p paddock-files --all-features --doc
      - name: paddock-storage
        if: ${{ !cancelled() }}
        run: cargo clippy -p paddock-storage --all-targets --all-features -- -D warnings && cargo nextest run -p paddock-storage --all-features --profile ci && cargo test -p paddock-storage --all-features --doc

      - name: paddock-testkit
        if: ${{ !cancelled() }}
        run: cargo clippy -p paddock-testkit --all-targets --all-features -- -D warnings && cargo nextest run -p paddock-testkit --all-features --profile ci && cargo test -p paddock-testkit --all-features --doc

      # The test-plan formats: properties (parse after write, no panics on any bytes) run with the tests; the fuzz target in
      # paddock-testplan/fuzz is built by the nightly fuzz job.
      - name: paddock-testplan
        if: ${{ !cancelled() }}
        run: cargo clippy -p paddock-testplan --all-targets --all-features -- -D warnings && cargo nextest run -p paddock-testplan --all-features --profile ci && cargo test -p paddock-testplan --all-features --doc

      - name: paddock-metrics
        if: ${{ !cancelled() }}
        run: cargo clippy -p paddock-metrics --all-targets --all-features -- -D warnings && cargo nextest run -p paddock-metrics --all-features --profile ci && cargo test -p paddock-metrics --all-features --doc

      - name: paddock-live
        if: ${{ !cancelled() }}
        run: cargo clippy -p paddock-live --all-targets --all-features -- -D warnings && cargo nextest run -p paddock-live --all-features --profile ci && cargo test -p paddock-live --all-features --doc

      - name: paddock-channels
        if: ${{ !cancelled() }}
        run: cargo clippy -p paddock-channels --all-targets --all-features -- -D warnings && cargo nextest run -p paddock-channels --all-features --profile ci && cargo test -p paddock-channels --all-features --doc

      - name: paddock-names
        if: ${{ !cancelled() }}
        run: cargo clippy -p paddock-names --all-targets --all-features -- -D warnings && cargo nextest run -p paddock-names --all-features --profile ci && cargo test -p paddock-names --all-features --doc

      - name: paddock-archive
        if: ${{ !cancelled() }}
        run: cargo clippy -p paddock-archive --all-targets --all-features -- -D warnings && cargo nextest run -p paddock-archive --all-features --profile ci && cargo test -p paddock-archive --all-features --doc

      - name: paddock-net
        if: ${{ !cancelled() }}
        run: cargo clippy -p paddock-net --all-targets --all-features -- -D warnings && cargo nextest run -p paddock-net --all-features --profile ci && cargo test -p paddock-net --all-features --doc

      - name: paddock-siblings
        if: ${{ !cancelled() }}
        run: cargo clippy -p paddock-siblings --all-targets --all-features -- -D warnings && cargo nextest run -p paddock-siblings --all-features --profile ci && cargo nextest run -p paddock-siblings --profile ci && cargo test -p paddock-siblings --all-features --doc

      - name: paddock-build
        if: ${{ !cancelled() }}
        run: cargo clippy -p paddock-build --all-targets --all-features -- -D warnings && cargo nextest run -p paddock-build --all-features --profile ci && cargo test -p paddock-build --all-features --doc

      - name: paddock-packs
        if: ${{ !cancelled() }}
        run: cargo clippy -p paddock-packs --all-targets --all-features -- -D warnings && cargo nextest run -p paddock-packs --all-features --profile ci && cargo test -p paddock-packs --all-features --doc

      - name: paddock-watch
        if: ${{ !cancelled() }}
        run: cargo clippy -p paddock-watch --all-targets --all-features -- -D warnings && cargo nextest run -p paddock-watch --all-features --profile ci && cargo test -p paddock-watch --all-features --doc

      - name: paddock-log
        if: ${{ !cancelled() }}
        run: cargo clippy -p paddock-log --all-targets --all-features -- -D warnings && cargo nextest run -p paddock-log --all-features --profile ci && cargo test -p paddock-log --all-features --doc

      - name: paddock-service
        if: ${{ !cancelled() }}
        run: cargo clippy -p paddock-service --all-targets --all-features -- -D warnings && cargo nextest run -p paddock-service --all-features --profile ci && cargo test -p paddock-service --all-features --doc

      - name: paddock-assistant
        if: ${{ !cancelled() }}
        run: cargo clippy -p paddock-assistant --all-targets --all-features -- -D warnings && cargo nextest run -p paddock-assistant --all-features --profile ci && cargo test -p paddock-assistant --all-features --doc

      # The plugin package: manifest limits, archive layout and signature, trust, keys; properties run with the tests; the fuzz
      # targets are in paddock-plugin-package/fuzz (cargo +nightly fuzz run manifest|package).
      # The plugin platform's API, host and test kit; the host's tests start the test kit's fixture plugin as a real process.
      - name: paddock-plugin-api
        if: ${{ !cancelled() }}
        run: cargo clippy -p paddock-plugin-api --all-targets --all-features -- -D warnings && cargo nextest run -p paddock-plugin-api --all-features --profile ci && cargo test -p paddock-plugin-api --all-features --doc
      - name: paddock-plugin-host
        if: ${{ !cancelled() }}
        run: cargo clippy -p paddock-plugin-host --all-targets --all-features -- -D warnings && cargo nextest run -p paddock-plugin-host --all-features --profile ci && cargo test -p paddock-plugin-host --all-features --doc
      - name: paddock-plugin-test
        if: ${{ !cancelled() }}
        run: cargo clippy -p paddock-plugin-test --all-targets --all-features -- -D warnings && cargo nextest run -p paddock-plugin-test --all-features --profile ci && cargo test -p paddock-plugin-test --all-features --doc
      - name: paddock-plugin-package
        if: ${{ !cancelled() }}
        run: cargo clippy -p paddock-plugin-package --all-targets --all-features -- -D warnings && cargo nextest run -p paddock-plugin-package --all-features --profile ci && cargo test -p paddock-plugin-package --all-features --doc

      - name: paddock-pitwall
        if: ${{ !cancelled() }}
        run: cargo clippy -p paddock-pitwall --all-targets --all-features -- -D warnings && cargo nextest run -p paddock-pitwall --all-features --profile ci && cargo test -p paddock-pitwall --all-features --doc

      - name: paddock-secrets
        if: ${{ !cancelled() }}
        run: cargo clippy -p paddock-secrets --all-targets --all-features -- -D warnings && cargo nextest run -p paddock-secrets --all-features --profile ci && cargo nextest run -p paddock-secrets --profile ci && cargo test -p paddock-secrets --all-features --doc

      - name: paddock-panels
        if: ${{ !cancelled() }}
        run: cargo clippy -p paddock-panels --all-targets --all-features -- -D warnings && cargo nextest run -p paddock-panels --all-features --profile ci && cargo test -p paddock-panels --all-features --doc

      - name: paddock-window
        if: ${{ !cancelled() }}
        run: cargo clippy -p paddock-window --all-targets --all-features -- -D warnings && cargo nextest run -p paddock-window --all-features --profile ci && cargo test -p paddock-window --all-features --doc

      - name: paddock-workbench
        if: ${{ !cancelled() }}
        run: cargo clippy -p paddock-workbench --all-targets --all-features -- -D warnings && cargo nextest run -p paddock-workbench --all-features --profile ci && cargo test -p paddock-workbench --all-features --doc

      - uses: ./.gitea/actions/sccache-stats
        if: always()

  # Paddock Shell Demo (apps/shell-demo, plan S18): the shell plugin in a real app, in its own workspace, with the UI it
  # embeds. Inside this repo it is the first consumer: a change to a shell crate or to the UI that breaks an app fails
  # here before a tag. Its installers are built by shell-demo-release.yml (a `shell-demo-v*` tag or a manual run).
  shell-demo-app:
    name: shell demo app (fmt, clippy, tests, deny)
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v1
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - uses: ./.gitea/actions/setup-rust
        with:
          sccache-redis-endpoint: ${{ vars.SCCACHE_REDIS_ENDPOINT }}
          sccache-redis-db: ${{ vars.SCCACHE_REDIS_DB }}

      # Tauri's build embeds the UI (tauri.conf.json `frontendDist`), so it is built first.
      - name: The UI the app embeds
        working-directory: ui
        run: |
          npm ci
          npm run shell-demo:build

      - name: App (fmt, clippy, tests on the mock runtime, deny)
        working-directory: apps/shell-demo/src-tauri
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo nextest run --workspace --config-file ../../../crates/.config/nextest.toml --profile ci
          cargo test --workspace --doc
          cargo deny check

      - uses: ./.gitea/actions/sccache-stats
        if: always()

  # Paddock Workbench Demo (apps/workbench-demo, plan X50 W8): the shell and workbench plugins in a real app, in its own workspace, with the UI it
  # embeds. Inside this repo it is the first consumer: a change to a shell or workbench crate or to the UI that breaks an app fails
  # here before a tag. Its installers are built by workbench-demo-release.yml (a `workbench-demo-v*` tag or a manual run).
  workbench-demo-app:
    name: workbench demo app (fmt, clippy, tests, deny)
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/garage:ubuntu-24.04-20261023-r5
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - uses: ./.gitea/actions/setup-rust
        with:
          sccache-redis-endpoint: ${{ vars.SCCACHE_REDIS_ENDPOINT }}
          sccache-redis-db: ${{ vars.SCCACHE_REDIS_DB }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Tauri's build embeds the UI (tauri.conf.json `frontendDist`), so it is built first.
      - name: The UI the app embeds
        working-directory: ui
        run: |
          npm ci
          npm run workbench-demo:build

      - name: App (fmt, clippy, tests on the mock runtime, deny)
        working-directory: apps/workbench-demo/src-tauri
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo nextest run --workspace --config-file ../../../crates/.config/nextest.toml --profile ci
          cargo test --workspace --doc
          cargo deny check

      - uses: ./.gitea/actions/sccache-stats
        if: always()
