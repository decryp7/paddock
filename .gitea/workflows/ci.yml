# Checks the shared UI package on every push and pull request; a v* tag also builds paddock-ui-<version>.tgz and attaches it
# to a Gitea release (needs the repository secret RELEASE_TOKEN: an access token with write:repository scope).
# Rust jobs are added with the first crate in crates/.

name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  ui:
    name: ui (tokens, contrast, components, gallery)
    runs-on: ubuntu-latest
    container:
      image: catthehacker/ubuntu:act-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: npm ci

      # WCAG contrast of every text/background pair and colour-vision separation of the chart palette.
      - name: Contrast and CVD checks
        run: npm run test:tokens

      - name: Component specs
        run: npm test

      - name: Build the library
        run: npm run build

      - name: Gallery checks (axe, keyboard, CSP)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

  release:
    name: release tarball
    needs: ui
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    container:
      image: catthehacker/ubuntu:act-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Pack and attach paddock-ui-<version>.tgz to the release
        env:
          GITEA_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: node scripts/release.mjs --publish

