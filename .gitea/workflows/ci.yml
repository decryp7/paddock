# The monorepo's CI (ADR 0014 §6): a plan job decides which projects a change reaches (scripts/affected.mjs: the Cargo and
# npm graphs plus the frontendDist and config-path edges), then only those run: the shared UI package and its entry points,
# the reference apps, the Rust crates, the conformance, tools and ESLint packages, and one matrix leg per affected app
# (apps/<app>/paddock.ci.json, through .gitea/actions/app-gates). The base of the diff: a pull request's merge base, the last
# green push run of main for a push to main, the `base` input of a manual run; tags and manual runs without a base run
# everything. nightly.yml runs everything, Chromium and WebKit, every night (the safety net for a wrong filter).
# Publishing is not here: a v* tag runs publish.yml (gates, then the cargo and npm registries and the Gitea release); this
# workflow ends with the publish dry run, so a tag never meets a packaging problem first.
#
# Runner labels: ubuntu-latest (jobs in the shared paddock-ci image, ci-image/), windows-latest and macos-latest (host runners, tools used as
# installed), as in Debrief and Pitwall.

name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: "Diff from this commit (empty: run everything)"
        required: false
        default: ""
      webkit:
        description: "Also run the WebKit tests (the WebKit job, and an app's WebKit lines)"
        type: boolean
        default: false
      since_run:
        description: "Rerun only what failed in this finished ci.yml run (its number): the failed jobs, and inside a job that failed only in nextest only its failed tests (./dev plan --since-run; ER-10). Passed jobs do not run; a full run before landing catches the rest."
        required: false
        default: ""
  # nightly.yml: everything, with WebKit.
  workflow_call:
    inputs:
      webkit:
        description: "Also run the WebKit job"
        type: boolean
        default: false
      app:
        description: "Only this app's legs, every half, whatever changed: the gates of an app's own tag (<app>-release.yml)"
        type: string
        default: ""
      release:
        description: "A release workflow's gates (a rule 54 dispatch counts as a release): ./dev never downloads its tool, whatever the ref"
        type: boolean
        default: false
    secrets:
      BUILD_INPUTS_TOKEN:
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Which projects this run tests. The script's own tests run first: a wrong plan would hide failures.
  plan:
    name: plan (affected projects)
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    outputs:
      crates: ${{ steps.plan.outputs.crates }}
      ui: ${{ steps.plan.outputs.ui }}
      eslint: ${{ steps.plan.outputs.eslint }}
      conformance: ${{ steps.plan.outputs.conformance }}
      c99: ${{ steps.plan.outputs.c99 }}
      tools: ${{ steps.plan.outputs.tools }}
      icons: ${{ steps.plan.outputs.icons }}
      paddock_dev: ${{ steps.plan.outputs.paddock_dev }}
      apps: ${{ steps.plan.outputs.apps }}
      any_app: ${{ steps.plan.outputs.any_app }}
      base: ${{ steps.plan.outputs.base }}
      # A rerun of a run's failures (the since_run input): the jobs that rerun (empty otherwise; each job's `if` reads an empty
      # list as its own name, so a normal run gates on the projects alone). The crate and paddock-dev legs: in a rerun of their
      # failures the failed ones, each with the nextest filter of its failed tests (empty: the whole leg); otherwise every OS.
      rerun_jobs: ${{ steps.plan.outputs.rerun_jobs }}
      crate_legs: ${{ steps.plan.outputs.crate_legs }}
      paddock_dev_legs: ${{ steps.plan.outputs.paddock_dev_legs }}
    env:
      PADDOCK_DEV_DOWNLOAD: ${{ (inputs.release == true || startsWith(github.ref, 'refs/tags/')) && '0' || '' }}
    steps:
      # The whole history: the base (a merge base, the last green commit of main) can be any older commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ADR 0060: C100 cannot be the only guard of its own wiring (a change that deletes the line deletes the check too), so a plain
      # grep on every event checks that the conformance job and the nightly still run it.
      - name: C100 stays wired
        run: |
          for f in .gitea/workflows/ci.yml .gitea/workflows/nightly.yml; do
            grep -Eq '^[[:space:]]*run: \./dev gates check( --warn)?$' "$f" || { echo "::error file=$f::C100 is not wired: no line runs ./dev gates check. Fix: restore the line (ADR 0060 section 4)."; exit 1; }
          done

      - name: The plan's tests
        run: node --test scripts/affected.test.mjs

      - name: Affected projects
        id: plan
        env:
          PLAN_TOKEN: ${{ github.token }}
          PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
          PADDOCK_DEV_DOWNLOAD: ${{ (inputs.release == true || startsWith(github.ref, 'refs/tags/')) && '0' || '' }}
          PLAN_BASE: ${{ github.event.inputs.base }}
          PLAN_APP: ${{ inputs.app }}
          PLAN_WEBKIT: ${{ (inputs.webkit == true || inputs.webkit == 'true') && '1' || '' }}
          # The rerun reads the earlier run's jobs and logs through the API (tools/paddock-dev/src/plan_since.rs).
          PLAN_SINCE_RUN: ${{ github.event.inputs.since_run }}
          # Fallback for one release (ADR 0022 R4): the repository variable PLAN_PLANNER=node plans with scripts/affected.mjs again
          # (a rerun of failures, PLAN_SINCE_RUN, always uses ./dev plan). Unset: ./dev plan. Remove with the script.
          PLAN_PLANNER: ${{ vars.PLAN_PLANNER }}
          # The crate and paddock-dev legs when the plan names none of its own (every run but a rerun of their failures).
          PLAN_OS_LEGS: '[{"os":"ubuntu-latest"},{"os":"windows-latest"},{"os":"macos-latest"}]'
        run: |
          if [ -z "$PLAN_SINCE_RUN" ] && [ "$PLAN_PLANNER" = node ]; then
            echo "::warning::PLAN_PLANNER=node: planning with scripts/affected.mjs, the fallback that goes with the script (ADR 0022 R4). Unset the repository variable to plan with ./dev plan."
            node scripts/affected.mjs --ci
          else
            ./dev plan --ci
          fi
          grep -q '^crate_legs=' "$GITHUB_OUTPUT" || echo "crate_legs=$PLAN_OS_LEGS" >> "$GITHUB_OUTPUT"
          grep -q '^paddock_dev_legs=' "$GITHUB_OUTPUT" || echo "paddock_dev_legs=$PLAN_OS_LEGS" >> "$GITHUB_OUTPUT"

  # C102 (ADR 0072): every listen site of the Rust sources is in docs/ipc-endpoints.toml with an ending test or a reason, and the
  # ratchet of connection endings is well formed. Always runs (./dev builds paddock-dev from source here, about a minute; the scan itself takes about 3 s): a listener added anywhere must not
  # land unregistered, whatever the plan thinks it reaches.
  ipc-endpoints:
    name: endpoint register (C102)
    needs: [plan]
    if: ${{ contains(fromJSON(needs.plan.outputs.rerun_jobs || '["ipc-endpoints"]'), 'ipc-endpoints') }}
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    env:
      PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
      PADDOCK_DEV_DOWNLOAD: ${{ (inputs.release == true || startsWith(github.ref, 'refs/tags/')) && '0' || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Every listen site is registered
        run: ./dev check ipc-endpoints

  ui:
    needs: [plan]
    if: ${{ needs.plan.outputs.ui == 'true' && contains(fromJSON(needs.plan.outputs.rerun_jobs || '["ui"]'), 'ui') }}
    name: ui (tokens, contrast, components, entry points, publish dry run)
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: ./.gitea/actions/node-caches

      # One npm workspace for the repo (ADR 0014 §1): the root lock installs every package.
      - name: Install
        working-directory: .
        run: npm ci

      # WCAG contrast of every text/background pair and colour-vision separation of the chart palette.
      - name: Contrast and CVD checks
        run: npm run test:tokens

      # The Paddock ESLint preset (rules 27 to 39 and the angular-eslint template and accessibility rules) over every ui project.
      - name: Lint
        run: npm run lint

      - name: Component specs
        run: npm test

      - name: Script tests
        run: npm run test:scripts

      # Every entry point (root, /shell/*, /workbench/*) is built by ng-packagr; the dry run below checks each is exported.
      - name: Build the library (all entry points)
        run: npm run build

      # The shell's message catalog and the pseudo-locale files match the build (plan S15: `npm run i18n` to refresh).
      - name: Translation files up to date
        run: npm run i18n:check

      - name: Build @decryp7/paddock-e2e
        run: npm run build:e2e

      - name: Build the shell demo
        run: npm run shell-demo:build

      - name: Build the workbench demo
        run: npm run workbench-demo:build

      # Lists every npm package, entry point and crate with what a tag would publish; publishes nothing.
      - name: Publish dry run
        run: node ../scripts/publish.mjs --skip-build

  # The reference apps in the browser (gallery and shell demo; axe, keyboard, CSP, 320 px), in two shards that run at the
  # same time: the specs run one at a time within a shard (playwright.config.ts), so splitting the files halves the wait.
  # The apps compile from source (tsconfig paths), so a shard needs no library build.
  e2e:
    name: reference apps (shard ${{ matrix.shard }}/2)
    needs: [plan]
    if: ${{ needs.plan.outputs.ui == 'true' && contains(fromJSON(needs.plan.outputs.rerun_jobs || '["e2e"]'), 'e2e') }}
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      # Playwright's browsers and Chrome for Testing are baked into the image (ci-image/): nothing is downloaded per job.
      - uses: ./.gitea/actions/node-caches
        with:
          name: e2e-${{ matrix.shard }}

      - name: Install
        working-directory: .
        run: npm ci

      - name: Reference app checks
        # CI names its ports (@decryp7/paddock-e2e refuses a default there: another job could hold it), one pair per shard.
        env:
          PW_PORT: ${{ matrix.shard == 1 && '4300' || '4310' }}
          SHELL_DEMO_PORT: ${{ matrix.shard == 1 && '4301' || '4311' }}
          WORKBENCH_DEMO_PORT: ${{ matrix.shard == 1 && '4302' || '4312' }}
        run: npx playwright test --shard=${{ matrix.shard }}/2

  # WebKit is the engine of WKWebView, which the macOS apps render in: the three ui Playwright projects run in it on the Mac host runner
  # (Playwright's own WebKit build), for pushes to main, v* tags and nightly.yml only. Branch and pull request runs stay Chromium-only (rule 3).
  e2e-webkit:
    name: reference apps in WebKit (macOS)
    needs: [plan]
    if: ${{ needs.plan.outputs.ui == 'true' && (inputs.webkit == true || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || contains(fromJSON(needs.plan.outputs.rerun_jobs || '[]'), 'e2e-webkit')) && contains(fromJSON(needs.plan.outputs.rerun_jobs || '["e2e-webkit"]'), 'e2e-webkit') }}
    runs-on: macos-latest
    env:
      # A run for a tag builds the tool from source (ADR 0022: release and tag jobs bypass every cache); other runs may download it.
      PADDOCK_DEV_DOWNLOAD: ${{ (inputs.release == true || startsWith(github.ref, 'refs/tags/')) && '0' || '' }}
      # Read credential for ./dev's prebuilt download (ADR 0022 R0b).
      PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      # CARGO_BUILD_JOBS: this runner's share of the host's cores (before job-isolation, which builds paddock-dev).
      - uses: ./.gitea/actions/build-jobs

      # A slot of the host (job isolation): its own Angular cache and ports, so two runs of this job can share the Mac.
      - uses: ./.gitea/actions/job-isolation

      - uses: ./.gitea/actions/node-caches

      - name: Install
        working-directory: .
        run: npm ci

      # A host runner has no image: the browser is installed once per Playwright version into a kept host folder (outside the
      # checkout and the runner user's own caches, rule 7) and only when that folder is missing.
      - name: WebKit
        run: |
          PW_VERSION=$(node -p "require('playwright-core/package.json').version")
          BROWSERS="${RUNNER_TOOL_CACHE:-$HOME/.cache}/paddock-playwright/$PW_VERSION"
          echo "PLAYWRIGHT_BROWSERS_PATH=$BROWSERS" >> "$GITHUB_ENV"
          if [ ! -f "$BROWSERS/.installed-webkit" ]; then
            PLAYWRIGHT_BROWSERS_PATH="$BROWSERS" npx playwright install webkit
            touch "$BROWSERS/.installed-webkit"
          fi

      - name: Reference app checks in WebKit
        env:
          PADDOCK_WEBKIT: "1"
        run: |
          # The job slot's own block of three ports (conformance/ci/ports.txt `webkit`: 4320-4322 for s1).
          port=$(bash ../conformance/ci/job-isolation.sh port webkit)
          export PW_PORT=$port SHELL_DEMO_PORT=$((port + 1)) WORKBENCH_DEMO_PORT=$((port + 2))
          npx playwright test --project=gallery-webkit --project=shell-demo-webkit --project=workbench-demo-webkit

      - uses: ./.gitea/actions/job-isolation
        if: always()
        with:
          mode: release

  # @decryp7/paddock-conformance (conformance/, plan X9): every check has a good and a bad fixture, the release scripts are
  # tested (latest.json byte-equal to the apps' copy), the shared macOS verify runs against a shimmed bundle. No dependencies.
  conformance:
    name: conformance (checks, release scripts)
    needs: [plan]
    if: ${{ needs.plan.outputs.conformance == 'true' && contains(fromJSON(needs.plan.outputs.rerun_jobs || '["conformance"]'), 'conformance') }}
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    defaults:
      run:
        working-directory: conformance
    env:
      PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
      PADDOCK_DEV_DOWNLOAD: ${{ (inputs.release == true || startsWith(github.ref, 'refs/tags/')) && '0' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # C100 reads the register's history (the Gates-date trailers) and the base revision.
          fetch-depth: 0

      - name: Tests
        run: npm test

      # Paddock runs its own conformance checks (plan X9). Only the checks that apply to a library repository run; the rest
      # are skipped on purpose, each for a reason:
      #   C03 icons, C04 macOS signing, C13 Rust lint preset (needs a root Cargo.toml; the crates workspace is crates/),
      #   C28 repo baseline (Paddock is the source of templates/repo), C29 window weight (the demo's budgets are not set)
      #     are app-only or Paddock owns the source of what they compare;
      #   C07 release preflight and C08 release artifacts: Paddock releases through publish.yml, not an app release job;
      #   C23 commit lint and doc blocks: Paddock's AGENTS.md is the source of the blocks, and its history predates the
      #     100-character subject rule.
      # C24 needs every docs/images file reviewed (docs/images/REVIEWED.md). C37 needs one test binary per crate and every
      # crate tested here and on the workspace hack (paddock.conformance.json). C14 (hermetic wrapper), C29 and C30 (wall clock)
      # report warnings; C36 (parser hardening) is strict here (a new parser needs its never-panics test); C15 has a dated
      # waiver (paddock.waivers.toml). C71 (tests do not settle on real time) compares its baseline with the merge base's with origin/main, so
      # the checkout above has the full history (a one-commit clone has no merge base and C71 would only warn that it did not measure).
      - name: Paddock itself (applicable checks)
        working-directory: .
        run: node conformance/bin/paddock-conformance.mjs --app paddock --root . --only C06,C14,C15,C16,C24,C29,C30,C31,C34,C35,C36,C37,C39,C43,C45,C48,C53,C54,C56,C57,C59,C71,C79,C98 --strict C36

      # ADR 0060, C100: every check the repository defines is run by a reachable CI line, or registered in docs/gates.toml with a
      # reason, an owner and a review date. Rollback: `./dev gates check --warn`. The nightly has a job of its own (nightly.yml).
      - uses: ./.gitea/actions/setup-rust
      - name: C100 (every check runs somewhere)
        working-directory: .
        run: ./dev gates check

      - uses: ./.gitea/actions/sccache-stats
        if: always()

  # Conformance C99 (ADR 0057 §3, rule 72): no shipped process uses the macOS Keychain. Its own job, planned on its inputs
  # (every Cargo.toml and Cargo.lock under apps/ and crates/, the scanned sources, capabilities, paddock.ci.json, the check's
  # code; scripts/affected.mjs C99_INPUT), because it needs cargo and the registry (`cargo fetch`, `cargo tree` for both Apple
  # triples) and the conformance job above does not. Every release path runs the same action, scoped to its app.
  c99:
    name: C99 (no Keychain in a macOS build)
    needs: [plan]
    if: ${{ needs.plan.outputs.c99 == 'true' && contains(fromJSON(needs.plan.outputs.rerun_jobs || '["c99"]'), 'c99') }}
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    steps:
      - uses: actions/checkout@v4

      - uses: ./.gitea/actions/keychain

  # The shared CI actions' scripts and the dev and host tools (plan X10, X47): every script runs in a scratch folder with a
  # PATH of shims, so no launchd, systemd, Docker or installed app is touched. New-app templates are covered by scripts/.
  tools:
    name: tools and shared scripts
    needs: [plan]
    if: ${{ needs.plan.outputs.tools == 'true' && contains(fromJSON(needs.plan.outputs.rerun_jobs || '["tools"]'), 'tools') }}
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: node --test tools/test/*.test.mjs

      - name: new-app templates
        run: node --test scripts/new-app.test.mjs scripts/coverage-gate.test.mjs

      # The VM start check's evidence parsers and judges (scripts/vm-smoke): a fake guest, no VM.
      - name: VM start check
        run: node --test scripts/vm-smoke/*.test.mjs

      # The plan's rules and the repo contracts it checks (doc inputs, app CI files, CODEOWNERS, Renovate, one npm lock).
      - name: Affected rules and repo contracts
        run: node --test scripts/affected.test.mjs

  # The Windows test VM tooling (scripts/vm-lock.sh, vm-win.sh, vm-win/) is a macOS tool: its lock and guard-rail tests have seven cases that
  # need sysctl, BSD stat, the keychain and Fusion's lease file, which the Linux `ui` job skips ("not measured on this OS", ER-33). They run
  # here, on the Mac host, against fakes only (no VM, no Fusion). Gated on the `tools` output, which every scripts/ change turns on.
  tools-macos:
    name: VM tooling tests (macOS)
    needs: [plan]
    if: ${{ needs.plan.outputs.tools == 'true' && contains(fromJSON(needs.plan.outputs.rerun_jobs || '["tools-macos"]'), 'tools-macos') }}
    runs-on: macos-latest
    env:
      PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
      PADDOCK_DEV_DOWNLOAD: ${{ (inputs.release == true || startsWith(github.ref, 'refs/tags/')) && '0' || '' }}
    steps:
      - uses: actions/checkout@v4

      # CARGO_BUILD_JOBS: this runner's share of the host's cores (the tests build and run ./dev).
      - uses: ./.gitea/actions/build-jobs

      - uses: ./.gitea/actions/job-isolation

      - name: VM lock and Windows test VM guard rails
        run: node --test scripts/vm-lock.test.mjs scripts/vm-win.test.mjs

      - uses: ./.gitea/actions/job-isolation
        if: always()
        with:
          mode: release

  # `wiki` (tools/wiki, the LLM-wiki lint, log and page tool): its own Cargo workspace; Linux only (it reads text and runs git).
  # Its tests include a lint of this repository's docs/wiki, so the pilot wiki is checked whenever the tool changes.
  wiki:
    name: wiki tool
    needs: [plan]
    if: ${{ needs.plan.outputs.tools == 'true' && contains(fromJSON(needs.plan.outputs.rerun_jobs || '["wiki"]'), 'wiki') }}
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    defaults:
      run:
        working-directory: tools/wiki
        shell: bash
    env:
      CARGO_TERM_COLOR: always
    steps:
      # The whole history: the lint reads the rules on origin/main and on the open rule branches (origin/docs/*).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The engineering rules, one more rules source for the copied-text check. Optional: when the runner's token cannot read
      # that repository the step fails softly and the lint skips the missing file.
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: decryp7/engineering-rules
          path: engineering-rules

      # A Linux container: one job per host and no kept folders or ports, so no job-isolation slot is taken (the action does
      # nothing there, ADR 0025).
      - uses: ./.gitea/actions/build-jobs

      # No build-folder action: the job is Linux-container only, so the build folder is tools/wiki/target in the container (git-ignored).
      - uses: ./.gitea/actions/setup-rust
        with:
          components: clippy,rustfmt

      # The engineering rules are optional input of the lint; say loudly when they are missing instead of skipping quietly.
      - name: Engineering rules present
        working-directory: .
        run: |
          if [ -f engineering-rules/RULES.md ]; then
            echo "- wiki lint: engineering-rules checked out, so its RULES.md is a rules source" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          else
            echo "::warning::wiki lint: engineering-rules is not checked out (the runner's token cannot read decryp7/engineering-rules?), so the copied-rule check skips the ER text. Give the job a token that can read it."
            echo "- wiki lint: engineering-rules NOT checked out; the ER text was not a rules source" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi

      - name: Lockfile is current
        run: |
          cargo metadata --locked --format-version 1 > /dev/null || {
            echo "::error::tools/wiki/Cargo.lock is stale, run cargo update -w in tools/wiki and commit it"; exit 1; }

      - name: Format
        if: ${{ !cancelled() }}
        run: cargo fmt --check

      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        if: ${{ !cancelled() }}
        run: cargo nextest run --profile ci --locked --no-fail-fast

      - name: Deny
        if: ${{ !cancelled() }}
        run: cargo deny check

      # The tool lints the wiki the way a person runs it (stale pages only warn).
      - name: Lint the wiki
        if: ${{ !cancelled() }}
        env:
          # The run log in the workspace, not the container's home, so a failed run's log survives the job (uploaded below).
          WIKI_LOG_DIR: ${{ github.workspace }}/wiki-logs
        run: |
          # The summary line is written whether the lint passes or fails; the step then ends with the lint's own exit code.
          set +e
          cargo run --locked -- --repo ../.. lint --er ../../engineering-rules/RULES.md 2>&1 | tee wiki-lint.out
          rc=${PIPESTATUS[0]}
          echo "- wiki lint (exit $rc): $(tail -1 wiki-lint.out)" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          exit "$rc"

      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        if: failure()
        with:
          name: wiki-logs
          path: wiki-logs
          if-no-files-found: ignore

      # The tools build with a plain Rust toolchain: no GTK -sys crate may reach them through the shared crates (the workspace
      # hack once pulled gtk-sys into paddock-proc on x86_64 Linux, so `cargo install` of wiki and heavy needed GTK headers). The
      # check reads the dependency graph for the Linux target, so it holds on an image that happens to have GTK installed.
      - name: No GTK in the tools' Linux build
        if: ${{ !cancelled() }}
        working-directory: .
        run: |
          # bash -e -o pipefail: every command that may legitimately fail is handled by hand. grep exits 1 when it finds nothing,
          # which is the success case here.
          rc=0
          for tool in wiki heavy; do
            tree=$(cd "tools/$tool" && cargo tree --locked --target x86_64-unknown-linux-gnu -e normal,build --prefix none) || {
              echo "::error::cargo tree failed for tools/$tool (see the lines above). Run it in tools/$tool with the same arguments."
              rc=1; continue; }
            # ER-33: the probe must be able to see the thing. Both tools link paddock-proc, where the hack's GTK crates arrived.
            echo "$tree" | grep -q '^paddock-proc ' || {
              echo "::error::check broken: the dependency graph of tools/$tool has no paddock-proc, so a GTK crate there would not be seen."
              rc=1; continue; }
            hits=$(echo "$tree" | grep -E '^(gtk|gdk|gio|glib|gobject|pango|cairo|atk|gdk-pixbuf|soup|webkit2gtk|javascriptcore-rs)[a-z0-9-]*-(sys|sys-rs) ' | sort -u || true)
            if [ -n "$hits" ]; then
              echo "::error::tools/$tool depends on GTK -sys crates on x86_64 Linux: $(echo "$hits" | tr '\n' ' '). Add them to crates/.config/hakari.toml traversal-excludes, run cargo hakari generate and refresh the lockfiles."
              rc=1
            else
              echo "tools/$tool: no GTK -sys crate in the x86_64 Linux graph"
            fi
          done
          exit "$rc"

      - uses: ./.gitea/actions/sccache-stats
        if: always()

  # The heavy tool (tools/heavy): the machine-wide heavy-step lock. Its own Cargo workspace; a Linux container, so no build-folder action
  # (the build folder is tools/heavy/target in the container, git-ignored).
  heavy:
    name: heavy tool
    needs: [plan]
    if: ${{ needs.plan.outputs.tools == 'true' && contains(fromJSON(needs.plan.outputs.rerun_jobs || '["heavy"]'), 'heavy') }}
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    defaults:
      run:
        working-directory: tools/heavy
        shell: bash
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - uses: ./.gitea/actions/build-jobs

      - uses: ./.gitea/actions/setup-rust
        with:
          components: clippy,rustfmt

      - name: Lockfile is current
        run: |
          cargo metadata --locked --format-version 1 > /dev/null || {
            echo "::error::tools/heavy/Cargo.lock is stale, run cargo update -w in tools/heavy and commit it"; exit 1; }

      - name: Format
        if: ${{ !cancelled() }}
        run: cargo fmt --check

      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        if: ${{ !cancelled() }}
        run: cargo nextest run --profile ci --locked --no-fail-fast

      - name: Deny
        if: ${{ !cancelled() }}
        run: cargo deny check

      - uses: ./.gitea/actions/sccache-stats
        if: always()

  # The family icons (icons/): the pipeline's tests (seam scan, coverage, tray shapes, .icns frames, docs copies) and the check that every
  # installed copy in the apps and the docs equals the build. Without the second step a hand edit of an app's icons goes unnoticed.
  icons:
    name: icons (tests, installed copies)
    needs: [plan]
    if: ${{ needs.plan.outputs.icons == 'true' && contains(fromJSON(needs.plan.outputs.rerun_jobs || '["icons"]'), 'icons') }}
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    steps:
      - uses: actions/checkout@v4

      - uses: ./.gitea/actions/node-caches

      - name: Install
        run: npm ci

      - name: Icon tests
        working-directory: icons
        run: npm test

      - name: Installed icon copies match the build
        run: node icons/tools/install.mjs --check

  # @decryp7/paddock-eslint (eslint/, plan X11): RuleTester cases per rule and the preset run through ESLint on temp files.
  eslint-preset:
    name: eslint preset (rules 27 to 39)
    needs: [plan]
    if: ${{ needs.plan.outputs.eslint == 'true' && contains(fromJSON(needs.plan.outputs.rerun_jobs || '["eslint-preset"]'), 'eslint-preset') }}
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    defaults:
      run:
        working-directory: eslint
    steps:
      - uses: actions/checkout@v4

      - uses: ./.gitea/actions/node-caches
        with:
          angular-dir: ''

      - name: Install
        working-directory: .
        run: npm ci

      - run: npm test

  crates:
    name: crates (fmt, workspace hack, unused deps, coverage, deny)
    needs: [plan]
    if: ${{ needs.plan.outputs.crates == 'true' && contains(fromJSON(needs.plan.outputs.rerun_jobs || '["crates"]'), 'crates') }}
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    defaults:
      run:
        working-directory: crates
    env:
      # The job runs as root in the container, where Chromium refuses to start with its sandbox (the real-browser test of
      # paddock-chromium); the driver drops the sandbox only for root AND with this opt-in.
      PADDOCK_BROWSER_NO_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.gitea/actions/setup-rust
      - run: cargo fmt --all --check

      # cargo-hakari and cargo-machete come with the image (ci-image/).
      # One feature set per dependency (docs/dev-setup.md): the workspace-hack crate is current and every member uses it.
      - name: Workspace hack up to date
        run: cargo hakari generate --diff && cargo hakari manage-deps --dry-run && cargo hakari verify

      # Unused dependencies. A false report goes into `ignored` of [workspace.metadata.cargo-machete] (Cargo.toml) or of the
      # crate's own [package.metadata.cargo-machete], with the reason; the workspace-hack crate is depended on for features.
      - name: Unused dependencies
        run: cargo machete $(ls -d paddock-*/ | grep -v '^paddock-workspace-hack/$')

      # Merged line coverage over all test binaries, adapters included (the per-binary summary counts unused generic instances).
      # Native glue files are left out (crates/README.md: never logic, reviewed by hand), and so are paddock-proc's test child (a
      # re-executed test binary that its parent ends with SIGKILL, so its coverage data is never written) and paddock-ipc's (the same); paddock-ipc's endpoint/{unix,windows}.rs are
      # its native glue (OS error paths; the portable surface in endpoint/mod.rs is covered). paddock-chromium's fake browser
      # runs in re-executed test binaries that are often ended by force (no coverage data), like paddock-proc's test child.
      # paddock-dialogs' `probe.rs` (feature `probe`) is the ADR 0026 section 6 real-window harness: it opens real webview windows and
      # runs only where there is a window system (PADDOCK_REAL_WINDOWS=1: the `dialog-window-probe` job), so no ordinary test reaches it.
      # The gate (scripts/coverage-gate.mjs) leaves out only the `#[tauri::command]` attribute lines: llvm-cov charges every
      # region of the macro's generated wrapper to that line, which no test can all reach.
      # This is also Linux's all-features test run (the crate leg skips its own on Linux): the real-browser tests of
      # paddock-chromium must find the image's Chrome for Testing instead of skipping.
      - name: Coverage (>= 90 % lines, 99 % for security code)
        env:
          PADDOCK_REQUIRE_TEST_BROWSER: "1"
        run: |
          cargo llvm-cov nextest --profile ci --workspace --all-features --ignore-filename-regex '(paddock-window/src/tauri|paddock-panels/src/tauri|paddock-updater/src/tauri|paddock-secrets/src/os|paddock-diag/src/tauri|paddock-files/src/tauri|paddock-service/src|paddock-watch/src|paddock-metrics/src|paddock-health/src/tauri|paddock-siblings/src|paddock-power/src)/native\.rs$|paddock-proc/src/testchild\.rs$|paddock-setup/src/(main\.rs|native/.*)$|paddock-chromium/src/fake\.rs$|paddock-ipc/src/bin/test_child\.rs$|paddock-ipc/src/testing/.*\.rs$|paddock-dialogs/src/probe\.rs$|paddock-plugin-test/src/bin/(fixture|fixture_v1|misbehaving)\.rs$|paddock-plugin-api/src/entry\.rs$|paddock-plugin-test/src/process\.rs$|cargo-paddock-plugin/src/main\.rs$|paddock-ipc/src/endpoint/(unix|windows)\.rs$|paddock-service/src/privileged/trust_real/windows\.rs$' --lcov --output-path lcov.info
          node ../scripts/coverage-gate.mjs lcov.info 90
      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        if: failure()
        with:
          name: crates-lcov
          path: crates/lcov.info
          if-no-files-found: ignore
      # The container runs as root and the orphan guardian is off for root: run its acting tests as an unprivileged user
      # (ADR 0076 amendment 2026-11-09; conformance/ci/guardian-as-user.sh prints one ::error:: per failure).
      - name: Orphan guardian as a user (Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: bash ../conformance/ci/guardian-as-user.sh
      - run: cargo deny check
      - uses: ./.gitea/actions/sccache-stats
        if: always()

  # Every crate on Linux, Windows and macOS (platform-only bugs exist: lessons): clippy and tests with every feature, so the
  # `tauri` adapters are built too, the feature-off runs and the doc tests, as a few workspace-wide steps. On Linux the
  # all-features test run is the coverage job's (crates), so this leg runs only what that job does not.
  crate:
    name: crate (${{ matrix.os }})
    needs: [plan]
    if: ${{ needs.plan.outputs.crates == 'true' && contains(fromJSON(needs.plan.outputs.rerun_jobs || '["crate"]'), 'crate') }}
    strategy:
      fail-fast: false
      matrix:
        # Every OS; a rerun of a run's failures (since_run) only the failed legs, each with the filter of its failed tests.
        include: ${{ fromJSON(needs.plan.outputs.crate_legs) }}
    runs-on: ${{ matrix.os }}
    # Linux runs in the paddock-ci image (Rust, Tauri's libraries, Node, Playwright, Chrome for Testing, cargo-nextest baked in); Windows and
    # macOS run on the host.
    container: ${{ matrix.os == 'ubuntu-latest' && 'dev.decryptology.net/decryp7/paddock-ci:v2' || '' }}
    defaults:
      run:
        working-directory: crates
        shell: bash
    env:
      # A run for a tag builds the tool from source (ADR 0022: release and tag jobs bypass every cache); other runs may download it.
      PADDOCK_DEV_DOWNLOAD: ${{ (inputs.release == true || startsWith(github.ref, 'refs/tags/')) && '0' || '' }}
      # Read credential for ./dev's prebuilt download (ADR 0022 R0b), only in the jobs that run ./dev (job-isolation).
      PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
      CARGO_TERM_COLOR: always
      # Root in the Linux container: Chromium needs the opt-in to start without its sandbox (ignored when not root).
      PADDOCK_BROWSER_NO_SANDBOX: "1"
    steps:
      # Linux: the whole tree in the container. Hosts: only the bootstrap folders (the actions, their scripts, paddock-dev's inputs)
      # as a partial clone; the kept-clone step below brings the slot's own clone to this commit (conformance/ci/checkout-profiles.txt).
      - uses: actions/checkout@v4
        if: runner.os == 'Linux'

      - uses: actions/checkout@v4
        if: runner.os != 'Linux'
        with:
          sparse-checkout: |
            .cargo
            .gitea
            conformance
            scripts
            tools
            crates
          filter: blob:none

      # Host-mode Windows runner: Git's bash on PATH (`shell: bash` needs it).
      - name: Git bash on PATH (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: .
        run: |
          if not exist "%ProgramFiles%\Git\bin\bash.exe" (echo Git for Windows is not installed on this runner & exit /b 1)
          echo %ProgramFiles%\Git\bin>>"%GITHUB_PATH%"

      # CARGO_BUILD_JOBS: this runner's share of the host's cores (before job-isolation, which builds paddock-dev).
      - uses: ./.gitea/actions/build-jobs

      # A slot of the host (job isolation; after Git bash on Windows): the job's kept folders end in its slot and its temp
      # folders are the runner's per-job folder, so concurrent jobs on one host never share either.
      - uses: ./.gitea/actions/job-isolation

      # The test browser outside the checkout, the slot's kept folder (the installer stamps the
      # pinned version in it).
      - name: Test browser folder (macOS, Windows)
        if: runner.os != 'Linux'
        working-directory: .
        run: |
          dir="$(bash conformance/ci/job-isolation.sh path browser paddock)"
          if command -v cygpath >/dev/null; then dir="$(cygpath -w "$dir")"; fi
          echo "PADDOCK_TEST_BROWSER_DIR=$dir" >> "$GITHUB_ENV"

      # Host runners check out into a per-job hashed folder; sccache keys a compile on its folder, so the workspace crates miss
      # on every run. Build from the same physical path every time: PADDOCK_WORKSPACE, the steps' working-directory, is the slot's
      # kept clone at this commit (kept-clone: a fetch of what changed, a clean tree, no screenshots; macOS: the work folder is
      # a link to it; Windows, where act keeps the work folder open: the work folder stays the bootstrap, so every read of the
      # tree goes through PADDOCK_WORKSPACE). On Windows the step comes after the one that puts Git's bash on PATH (before it,
      # `shell: bash` finds WSL's bash.exe).
      - uses: ./.gitea/actions/kept-clone
        if: runner.os != 'Linux'
        with:
          name: paddock-checkout-${{ runner.os }}
          profile: lean

      # A build folder that outlives the job on the hosts (the work folder does not: it is hashed per job), crates/target in
      # the container, as cargo configuration (crates/.cargo/ci.toml, included by crates/.cargo/config.toml), never
      # CARGO_TARGET_DIR: sccache puts every CARGO_* variable into its cache key (the shared build-folder action).
      - uses: ./.gitea/actions/build-folder
        with:
          workspace: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/crates
          name: paddock-${{ github.job }}

      # Toolchain and sccache on every OS: sccache's local disk cache (host runners: the job slot's kept folder sccache-s<n>,
      # containers: the /sccache mount).
      - uses: ./.gitea/actions/setup-rust
        with:
          components: clippy

      - name: Toolchain present
        run: |
          rustc --version && cargo --version
          cargo clippy --version || { echo "::error::clippy is missing on this runner (rustup component add clippy)"; exit 1; }

      # The pinned cargo-nextest: the image's on Linux, a copy in the hosts' shared kept folder tools (downloaded once
      # per version); the step fails when the runner has another version.
      - uses: ./.gitea/actions/host-tools

      # Whole-workspace steps: one build per feature set instead of one per crate (each `-p X --all-features` resolved its own
      # features and rebuilt the shared dependencies). Every step runs even after another failed; nextest and clippy name
      # the crate of every failure. scripts/publish.test.mjs and conformance C37 fail when a workspace member is left out.
      # A leg with a filter (a rerun of failed tests) runs only the test steps below: its other steps passed in the earlier run.
      - name: Clippy (workspace, every feature)
        if: ${{ !cancelled() && !matrix.filter }}
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/crates
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # The build chromium.toml pins, on the host runners (the Linux image has it): checked against its SHA-256 and kept in a
      # folder that outlives the job, so it is downloaded once per pin. Sets CHROMIUM_TEST_PATH.
      - name: Chrome for Testing (macOS, Windows)
        if: ${{ !cancelled() && runner.os != 'Linux' }}
        uses: ./.gitea/actions/install-test-browser
        with:
          catalogue: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/crates/paddock-chromium/src/chromium.toml
          env-prefix: PADDOCK
          dir: ${{ env.PADDOCK_TEST_BROWSER_DIR }}

      # Every crate's tests with every feature, so the `tauri` adapters are built and tested too (the dialogs and panels on the
      # mock runtime, paddock-chromium against its fake browser and against Chrome for Testing: CHROMIUM_TEST_PATH, never an
      # installed browser, rule 7; a missing browser fails instead of skipping). On Linux the coverage job (crates) runs
      # exactly this run under llvm-cov, so this leg does not run it twice.
      - name: Tests (workspace, every feature)
        if: ${{ !cancelled() && runner.os != 'Linux' }}
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/crates
        env:
          PADDOCK_REQUIRE_TEST_BROWSER: "1"
          # Chrome's verbose log of each real-browser test on Windows, kept below when the job fails (ADR 0030: why the
          # network service went away is only in there).
          PADDOCK_TEST_BROWSER_LOG: ${{ runner.os == 'Windows' && format('{0}/chrome-logs', runner.temp) || '' }}
          FILTER: ${{ matrix.filter }}
        run: |
          filter=()
          if [ -n "$FILTER" ]; then echo "::notice::nextest reruns only the failed tests: $FILTER"; filter=(-E "$FILTER" --no-tests=warn); fi
          cargo nextest run --workspace --all-features --profile ci ${filter[@]+"${filter[@]}"}

      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        if: failure() && runner.os == 'Windows'
        with:
          name: chrome-logs-${{ runner.os }}
          path: ${{ runner.temp }}/chrome-logs
          if-no-files-found: ignore

      # The crates whose code changes with an optional feature off (cfg(not(feature)) paths, a default feature that can be
      # turned off) also run without it. Cargo unifies features across the packages of one run, so a crate that another
      # selected crate depends on with a feature on gets its own run: paddock-shell turns on paddock-diag's, paddock-download's
      # and paddock-updater's `tauri`, and paddock-updater turns on paddock-download's default `http`.
      - name: Tests with the optional features off
        if: ${{ !cancelled() && !matrix.filter }}
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/crates
        run: |
          cargo nextest run -p paddock-shell -p paddock-secrets -p paddock-siblings --profile ci
          cargo nextest run -p paddock-diag -p paddock-updater --profile ci
          cargo nextest run -p paddock-download --no-default-features --profile ci
          # paddock-repo-graph's git and cargo adapters sit behind features that only paddock-dev (its own workspace) turns on;
          # its default build, without them, is the one Pacenotes uses.
          cargo nextest run -p paddock-repo-graph --profile ci

      # nextest (and so the coverage job) does not run doc tests.
      - name: Doc tests (workspace, every feature)
        if: ${{ !cancelled() && !matrix.filter }}
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/crates
        run: cargo test --workspace --all-features --doc

      - uses: ./.gitea/actions/sccache-stats
        if: always()

      - uses: ./.gitea/actions/job-isolation
        if: always()
        with:
          mode: release

  # Conventional Commits and no AI attribution (rules 4, 8) for every commit of a change, whichever project it touches.
  # Only the commits a change adds are linted (scripts/affected.mjs commitLintRange): a pull request since its target branch,
  # a push `before..sha`, a manual run from the plan's base. On a push to main that is `--first-parent`: only the commits main
  # itself gets (the landing merge, a direct commit), not the ones a merge brought in. A branch's commits are linted by the
  # integrator before landing (`commit-lint --range origin/main..<branch>`, docs/rules.md rule 50(g)); C23 in the conformance
  # run is the backstop for a branch that landed without that. Tags and an app's tag gates skip it (ER-15).
  commits:
    name: commit messages
    needs: [plan]
    if: ${{ (github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch') && contains(fromJSON(needs.plan.outputs.rerun_jobs || '["commits"]'), 'commits') }}
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    steps:
      # Full history so the range from the base can be read.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint the commit messages
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          BASE_REF: ${{ github.base_ref }}
          PLAN_BASE: ${{ needs.plan.outputs.base }}
          INPUT_APP: ${{ inputs.app }}
          PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
          PADDOCK_DEV_DOWNLOAD: ${{ (inputs.release == true || startsWith(github.ref, 'refs/tags/')) && '0' || '' }}
        run: |
          range="$(./dev plan --commit-range)"
          flags="$(./dev plan --commit-flags)"
          echo "commit-lint range: $flags $range"
          if [ "$range" = "skip" ]; then exit 0; fi
          # shellcheck disable=SC2086 # the flags are zero or one fixed option
          node conformance/bin/paddock-conformance.mjs commit-lint $flags --range "$range"

  # One leg per affected app and operating system (ADR 0014 §6): the app's CI contract (apps/<app>/paddock.ci.json) through
  # the shared app-gates action, only the halves the change reaches (rust, ui). Linux (the paddock-ci image) carries the
  # whole contract: prepare, checks, the Rust gates and the UI. An app that lists Windows or macOS in `os` also gets a host
  # leg per OS with the Rust gates only, for the code that differs there (services, launch agents, Keychain). The shell demo
  # (plan S18) and the workbench demo (X50 W8) are the first legs: their UI is ui/projects/<app> (tested by the ui and e2e
  # jobs), built here because Tauri embeds it (tauri.conf.json frontendDist). A change to a shell crate or to the UI that
  # breaks an app fails here before a tag. Installers come from <app>-release.yml (an `<app>-v*` tag or a manual run).
  # Host legs: the same physical checkout path and a kept build folder every run (kept-clone, build-folder), the pinned
  # cargo-nextest (host-tools), nothing left behind (host-cleanup).
  app:
    name: app ${{ matrix.app }} (${{ matrix.os }}${{ matrix.e2e_leg != '' && format(', {0}', matrix.e2e_leg) || '' }})
    needs: [plan]
    if: ${{ needs.plan.outputs.any_app == 'true' && contains(fromJSON(needs.plan.outputs.rerun_jobs || '["app"]'), 'app') }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.os == 'ubuntu-latest' && 'dev.decryptology.net/decryp7/paddock-ci:v2' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.apps) }}
    env:
      # A run for a tag builds the tool from source (ADR 0022: release and tag jobs bypass every cache); other runs may download it.
      PADDOCK_DEV_DOWNLOAD: ${{ (inputs.release == true || startsWith(github.ref, 'refs/tags/')) && '0' || '' }}
      # Read credential for ./dev's prebuilt download (ADR 0022 R0b), only in the jobs that run ./dev (job-isolation).
      PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
      CARGO_TERM_COLOR: always
    steps:
      # Linux: the whole tree in the container. Hosts: only the bootstrap folders (the actions, their scripts, paddock-dev's inputs)
      # as a partial clone; the kept-clone step below brings the slot's own clone to this commit (conformance/ci/checkout-profiles.txt).
      - uses: actions/checkout@v4
        if: runner.os == 'Linux'

      - uses: actions/checkout@v4
        if: runner.os != 'Linux'
        with:
          sparse-checkout: |
            .cargo
            .gitea
            conformance
            scripts
            tools
            crates
          filter: blob:none

      # Host-mode Windows runner: Git's bash on PATH (`shell: bash` needs it).
      - name: Git bash on PATH (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if not exist "%ProgramFiles%\Git\bin\bash.exe" (echo Git for Windows is not installed on this runner & exit /b 1)
          echo %ProgramFiles%\Git\bin>>"%GITHUB_PATH%"

      # CARGO_BUILD_JOBS: this runner's share of the host's cores (before job-isolation, which builds paddock-dev).
      - uses: ./.gitea/actions/build-jobs

      # A slot of the host (job isolation; after Git bash on Windows), before every kept folder.
      - uses: ./.gitea/actions/job-isolation

      - uses: ./.gitea/actions/kept-clone
        if: runner.os != 'Linux'
        with:
          name: paddock-checkout-${{ runner.os }}
          profile: lean

      # The workspace's .cargo/config.toml must include ci.toml (build-folder checks it): required of an app with host legs.
      - uses: ./.gitea/actions/build-folder
        if: runner.os != 'Linux'
        with:
          workspace: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/${{ matrix.cargo }}
          name: ${{ matrix.app }}-${{ github.job }}

      - uses: ./.gitea/actions/setup-rust
        with:
          components: clippy rustfmt

      - uses: ./.gitea/actions/host-tools
        if: runner.os != 'Linux'

      # An app whose tests drive a real browser (paddock.ci.json `testBrowser`): the pinned Chrome for Testing, never an installed
      # one (rule 7). The image has it on Linux; on a host it is the app's kept folder of the job slot (test-browser-<app>-<slot>).
      - name: Test browser folder (macOS, Windows)
        if: runner.os != 'Linux' && matrix.test_browser_prefix != ''
        shell: bash
        env:
          APP: ${{ matrix.app }}
        run: |
          dir="$(bash conformance/ci/job-isolation.sh path browser "$APP")"
          if command -v cygpath >/dev/null; then dir="$(cygpath -w "$dir")"; fi
          echo "PADDOCK_TEST_BROWSER_DIR=$dir" >> "$GITHUB_ENV"

      - name: Chrome for Testing (macOS, Windows)
        if: runner.os != 'Linux' && matrix.test_browser_prefix != ''
        uses: ./.gitea/actions/install-test-browser
        with:
          catalogue: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/${{ matrix.test_browser_catalogue }}
          env-prefix: ${{ matrix.test_browser_prefix }}
          dir: ${{ env.PADDOCK_TEST_BROWSER_DIR }}

      # Points the app's tests at that browser; a missing one fails the run instead of skipping the tests. The Linux container
      # runs as root, where Chrome refuses to start with its sandbox: tests only (`noSandboxOnLinux`).
      - name: The tests' browser
        if: matrix.test_browser_prefix != ''
        shell: bash
        env:
          PREFIX: ${{ matrix.test_browser_prefix }}
          NO_SANDBOX: ${{ matrix.test_browser_no_sandbox }}
        run: |
          if [ -z "${CHROMIUM_TEST_PATH:-}" ]; then echo "::error::no Chrome for Testing (CHROMIUM_TEST_PATH is empty)"; exit 1; fi
          {
            echo "${PREFIX}_TEST_BROWSER=$CHROMIUM_TEST_PATH"
            echo "${PREFIX}_REQUIRE_TEST_BROWSER=1"
            if [ "$NO_SANDBOX" = true ]; then echo "${PREFIX}_TEST_BROWSER_NO_SANDBOX=1"; fi
          } >> "$GITHUB_ENV"

      - uses: ./.gitea/actions/node-caches
        if: runner.os == 'Linux'
        with:
          angular-dir: ${{ matrix.angular_dir || 'ui' }}
          name: app-${{ matrix.app }}${{ matrix.e2e_leg != '' && format('-{0}', matrix.e2e_leg) || '' }}

      - name: Install
        if: runner.os == 'Linux'
        run: npm ci

      - uses: ./.gitea/actions/app-gates
        with:
          app: ${{ matrix.app }}
          cargo: ${{ matrix.cargo }}
          nextest-config: ${{ matrix.nextest_config }}
          prepare: ${{ matrix.prepare }}
          checks: ${{ matrix.checks }}
          rust-checks: ${{ matrix.rust_checks }}
          host-rust-checks: ${{ matrix.host_rust_checks }}
          ui-checks: ${{ matrix.ui_checks }}
          rust: ${{ matrix.rust }}
          ui: ${{ matrix.ui }}
          last-packages: ${{ matrix.last_packages }}
          windows-clippy: ${{ matrix.windows_clippy }}
          notices: ${{ matrix.notices }}
          filter: ${{ matrix.filter }}
          tests-only: ${{ matrix.tests_only }}
          display: ${{ matrix.display }}
          e2e-checks: ${{ matrix.e2e_checks }}
          e2e-shard: ${{ matrix.e2e_shard }}

      # The failure report of the app's browser tests (paddock.ci.json `e2eArtifacts`, a folder from the repo root); Gitea has the v3 artifact actions.
      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        if: failure() && matrix.e2e_artifacts != ''
        with:
          name: ${{ matrix.app }}-${{ matrix.e2e_leg || 'ui' }}-results-${{ strategy.job-index }}
          path: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/${{ matrix.e2e_artifacts }}
          if-no-files-found: ignore

      # Nothing of this job may stay behind on a host: no fake runners or test programs of the app's tests (paddock.ci.json
      # `processPatterns`, each anchored on a folder of this job), no temp folders of its tests.
      - uses: ./.gitea/actions/host-cleanup
        if: always() && runner.os != 'Linux'
        with:
          app-id: ${{ matrix.app }}
          process-patterns: ${{ matrix.process_patterns }}
          temp-prefix: ${{ matrix.app }}-it-

      # The kept build folder stays within its cap (this job's own folder only, after the builds).
      - uses: ./.gitea/actions/prune-build-folder
        if: always() && runner.os != 'Linux'

      - uses: ./.gitea/actions/sccache-stats
        if: always()

      # The slot goes back last: the clean-up, the prune and the sccache server's stop all act on this slot's folders and port.
      - uses: ./.gitea/actions/job-isolation
        if: always()
        with:
          mode: release

  # The developer and CI tool (ADR 0022): its own Cargo workspace and lockfile, tested on every OS it runs on. Linux runs in the
  # paddock-ci image (git, Node for the golden test's live oracle, nextest); Windows and macOS run on the host.
  paddock-dev:
    name: paddock-dev (${{ matrix.os }})
    needs: [plan]
    if: ${{ needs.plan.outputs.paddock_dev == 'true' && contains(fromJSON(needs.plan.outputs.rerun_jobs || '["paddock-dev"]'), 'paddock-dev') }}
    strategy:
      fail-fast: false
      matrix:
        # Every OS; a rerun of a run's failures (since_run) only the failed legs, each with the filter of its failed tests.
        include: ${{ fromJSON(needs.plan.outputs.paddock_dev_legs) }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.os == 'ubuntu-latest' && 'dev.decryptology.net/decryp7/paddock-ci:v2' || '' }}
    defaults:
      run:
        working-directory: tools/paddock-dev
        shell: bash
    env:
      # A run for a tag builds the tool from source (ADR 0022: release and tag jobs bypass every cache); other runs may download it.
      PADDOCK_DEV_DOWNLOAD: ${{ (inputs.release == true || startsWith(github.ref, 'refs/tags/')) && '0' || '' }}
      # Read credential for ./dev's prebuilt download (ADR 0022 R0b), only in the jobs that run ./dev (job-isolation).
      PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
      CARGO_TERM_COLOR: always
    steps:
      # Linux: the whole tree in the container. Hosts: only the bootstrap folders (the actions, their scripts, paddock-dev's inputs)
      # as a partial clone; the kept-clone step below brings the slot's own clone to this commit (conformance/ci/checkout-profiles.txt).
      - uses: actions/checkout@v4
        if: runner.os == 'Linux'
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        if: runner.os != 'Linux'
        with:
          sparse-checkout: |
            .cargo
            .gitea
            conformance
            scripts
            tools
            crates
          filter: blob:none

      - name: Git bash on PATH (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: .
        run: |
          if not exist "%ProgramFiles%\Git\bin\bash.exe" (echo Git for Windows is not installed on this runner & exit /b 1)
          echo %ProgramFiles%\Git\bin>>"%GITHUB_PATH%"

      # CARGO_BUILD_JOBS: this runner's share of the host's cores (before job-isolation, which builds paddock-dev).
      - uses: ./.gitea/actions/build-jobs

      # A slot of the host (job isolation; after Git bash on Windows): its kept folders and ports are this job's alone.
      - uses: ./.gitea/actions/job-isolation

      - uses: ./.gitea/actions/kept-clone
        if: runner.os != 'Linux'
        with:
          name: paddock-checkout-${{ runner.os }}
          profile: lean

      - uses: ./.gitea/actions/build-folder
        with:
          workspace: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/tools/paddock-dev
          name: paddock-${{ github.job }}

      - uses: ./.gitea/actions/setup-rust
        with:
          components: clippy,rustfmt

      - uses: ./.gitea/actions/host-tools

      # The tool's lockfile must follow the lockfiles of the crates/ it uses by path (they change dependencies in their own PRs).
      # A leg with a filter (a rerun of failed tests) runs only the tests: its other steps passed in the earlier run.
      - name: Lockfile is current
        if: ${{ !matrix.filter }}
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/tools/paddock-dev
        run: |
          cargo metadata --locked --format-version 1 > /dev/null || {
            echo "::error::tools/paddock-dev/Cargo.lock is stale, run cargo update -w in tools/paddock-dev and commit it"; exit 1; }

      - name: Format
        if: ${{ !cancelled() && !matrix.filter }}
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/tools/paddock-dev
        run: cargo fmt --check

      - name: Clippy
        if: ${{ !cancelled() && !matrix.filter }}
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/tools/paddock-dev
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        if: ${{ !cancelled() }}
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/tools/paddock-dev
        env:
          FILTER: ${{ matrix.filter }}
        run: |
          filter=()
          if [ -n "$FILTER" ]; then echo "::notice::nextest reruns only the failed tests: $FILTER"; filter=(-E "$FILTER" --no-tests=warn); fi
          cargo nextest run --profile ci --locked --no-fail-fast ${filter[@]+"${filter[@]}"}

      # Licences, advisories, sources (tools/paddock-dev/deny.toml, the crates' rules); the image has cargo-deny.
      - name: Deny
        if: ${{ !cancelled() && runner.os == 'Linux' && !matrix.filter }}
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/tools/paddock-dev
        run: cargo deny check

      # The kept build folder stays within its cap (this job's own folder only, after the builds).
      - uses: ./.gitea/actions/prune-build-folder
        if: always() && runner.os != 'Linux'

      - uses: ./.gitea/actions/sccache-stats
        if: always()

      # The slot goes back last: the prune and the sccache server's stop act on this slot's folders and port.
      - uses: ./.gitea/actions/job-isolation
        if: always()
        with:
          mode: release
