# The monorepo's CI (ADR 0014 §6): a plan job decides which projects a change reaches (./dev plan: the Cargo and
# npm graphs plus the frontendDist and config-path edges), then only those run: the shared UI package and its entry points,
# the reference apps, the Rust crates, the conformance, tools and ESLint packages, and one matrix leg per affected app
# (apps/<app>/paddock.ci.json, through .gitea/actions/app-gates). The base of the diff: the last green push run of main for a
# push to main, the `base` input of a manual run, the `landing_base` input of a train's landing run (main's last complete commit); tags
# and manual runs without a base run everything. No pull_request trigger (the contract test no_workflow_runs_on_a_pull_request);
# branches and trains run by dispatch.
# nightly.yml runs everything, Chromium and WebKit, every night (the safety net for a wrong filter). The reference apps' browser
# jobs (e2e, e2e-webkit) and the apps' WebKit legs run only there, on a v* tag and on a manual run with `webkit`: never on a branch,
# a train or a push to main (user, 2026-11-24).
# Publishing is not here: a v* tag runs publish.yml (gates, then the cargo and npm registries and the Gitea release); this
# workflow ends with the publish dry run, so a tag never meets a packaging problem first.
#
# Runner labels: ubuntu-latest (jobs in the shared paddock-ci image, ci-image/), windows-latest and macos-latest (host runners, tools used as
# installed), as in Debrief and Pitwall.

name: ci
# A run dispatched through ./dev ci dispatch shows its dispatch_id in its title, so the tool finds that exact run (guard A6, ER-51).
run-name: ${{ github.event.inputs.dispatch_id && format('{0} [dispatch {1}]', github.workflow, github.event.inputs.dispatch_id) || '' }}

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: "Set by ./dev ci dispatch: the token it finds this run by (shown in the run's title). Leave empty."
        required: false
        default: ""
      base:
        description: "Diff from this commit (empty: run everything)"
        required: false
        default: ""
      landing_base:
        description: "A train's landing run: diff from this commit, main's last complete green one (./dev ci dispatch and the queue fill it in for a full train dispatch; ADR 0117 WP-8). Unlike base it is not a member run: every test of what the diff reaches runs, and a push to main reuses the run. Empty: no diff, everything"
        required: false
        default: ""
      webkit:
        description: "Also run the reference apps' browser jobs (Chromium and WebKit) and the apps' WebKit lines, as the nightly does"
        type: boolean
        default: false
      os_full:
        description: "Test every package on every OS (hostTests unscoped: the nightly's and the release gates' scope); empty: the OS-specific code on each OS, the rest on Linux (OS-scoped tests)"
        type: boolean
        default: false
      sccache_backend:
        description: "The compile cache of this run's Rust jobs: local (the disk only), s3 (the local disk first, RustFS behind it) or empty (the default, s3). A one-run override for measurements, for example a run with local to compare hit rates."
        required: false
        default: ""
      since_run:
        description: "Rerun only what failed in this finished ci.yml run (its API id, as ./dev ci dispatch and ./dev wait --ci-run print it; not its run number): the failed jobs, and inside a job that failed only in nextest only its failed tests (./dev plan --since-run; ER-10). Passed jobs do not run; a full run before landing catches the rest."
        required: false
        default: ""
  # nightly.yml: everything, with WebKit.
  workflow_call:
    inputs:
      webkit:
        description: "Also run the WebKit job"
        type: boolean
        default: false
      app:
        description: "Only this app's legs, every half, whatever changed: the gates of an app's own tag (<app>-release.yml)"
        type: string
        default: ""
      release:
        description: "A release workflow's gates (a rule 54 dispatch counts as a release): ./dev never downloads its tool, whatever the ref"
        type: boolean
        default: false
      os_full:
        description: "Test every package on every OS (hostTests unscoped): the nightly's scope"
        type: boolean
        default: false
    secrets:
      BUILD_INPUTS_TOKEN:
        required: false

# Read-only: no job of this workflow writes to the repository or the Actions state (a train's run holds no token that could).
permissions:
  contents: read
  actions: read

# The conformance checks Paddock runs on itself are the `conformance` field of conformance/paddock.ci.json (ADR 0038 §1): one list,
# run by the conformance job as `./dev ci run conformance paddock`, and read by `./dev check --pre-push`.
env:
  # The fallback switch of conformance/ci/kit.sh (WP-1): set the repository variable to shell and every kit step runs its script.
  PADDOCK_CI_KIT: ${{ vars.PADDOCK_CI_KIT }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Which projects this run tests. The script's own tests run first: a wrong plan would hide failures.
  plan:
    name: plan (affected projects)
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v3
    outputs:
      crates: ${{ steps.plan.outputs.crates }}
      ui: ${{ steps.plan.outputs.ui }}
      eslint: ${{ steps.plan.outputs.eslint }}
      conformance: ${{ steps.plan.outputs.conformance }}
      c99: ${{ steps.plan.outputs.c99 }}
      tools: ${{ steps.plan.outputs.tools }}
      icons: ${{ steps.plan.outputs.icons }}
      paddock_dev: ${{ steps.plan.outputs.paddock_dev }}
      apps: ${{ steps.plan.outputs.apps }}
      any_app: ${{ steps.plan.outputs.any_app }}
      # A rerun of a run's failures (the since_run input): the jobs that rerun (empty otherwise; each job's `if` reads an empty
      # list as its own name, so a normal run gates on the projects alone). The crate and paddock-dev legs: in a rerun of their
      # failures the failed ones, each with the nextest filter of its failed tests (empty: the whole leg); otherwise every OS.
      rerun_jobs: ${{ steps.plan.outputs.rerun_jobs }}
      crate_legs: ${{ steps.plan.outputs.crate_legs }}
      paddock_dev_legs: ${{ steps.plan.outputs.paddock_dev_legs }}
      # A member run (a dispatch with a base): the nextest filterset of the packages of that workspace the change reaches (empty: every
      # test, and always so on main, a tag and a manual run with no base: the final head's full run). The Linux crate tests run
      # whole (the nightly and a tag also under coverage in `crates`).
      # Whether the WebKit tests and the reference apps' browser jobs run: the e2e and e2e-webkit jobs and the scope this run declares
      # (ADR 0113) read the one value of the planner.
      webkit: ${{ steps.plan.outputs.webkit }}
      crates_filter: ${{ steps.plan.outputs.crates_filter }}
      paddock_dev_filter: ${{ steps.plan.outputs.paddock_dev_filter }}
      # The repository graph's narrowed projects (ADR 0117 §5; docs/repo-graph.toml [planner] = graph): each one's kept phases and
      # affected test files, passed to every job that runs `./dev ci run` as PADDOCK_PLAN_SELECTION; `partial` is true when any
      # project runs a smoke set or affected tests only (the run is then never complete). Both are absent under `rules`.
      selection: ${{ steps.plan.outputs.selection }}
      partial: ${{ steps.plan.outputs.partial }}
    env:
      PADDOCK_DEV_DOWNLOAD: ${{ (inputs.release == true || startsWith(github.ref, 'refs/tags/')) && '0' || '' }}
    steps:
      # The whole history: the base (a merge base, the last green commit of main) can be any older commit.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      # A train run is dispatched at once and waits here, on Linux, until no older run holds the Mac or Windows runner it
      # needs (./dev ci runner-wait); the queued run is what scheduled runs yield to. Other events: nothing.
      - uses: ./.gitea/actions/runner-wait
        with:
          dev-token: ${{ secrets.BUILD_INPUTS_TOKEN }}

      # ADR 0060: C100 cannot be the only guard of its own wiring (a change that deletes the line deletes the check too), so a plain
      # grep on every event checks that the conformance job and the nightly still run it.
      - name: C100 stays wired
        run: |
          for f in .gitea/workflows/ci.yml .gitea/workflows/nightly.yml; do
            grep -Eq '^[[:space:]]*run: \./dev gates check( --warn)?$' "$f" || { echo "::error file=$f::C100 is not wired: no line runs ./dev gates check. Fix: restore the line (ADR 0060 section 4)."; exit 1; }
          done

      # ER-49, test a commit once: a push to main of a commit that a complete run of this workflow already tested (the train's
      # dispatch, when main fast-forwards to its head) ends here, with that run named in the summary. The run counts when it is green,
      # or red only through FLAKY tests of crates and apps its plan did not reach (green with fix items, ADR 0117 WP-4: the landing
      # queue recorded them). A tag needs a run without them: its one retry (ER-49) is a manual workflow_dispatch of this workflow on
      # that commit, which this step never skips (it runs for a push to main only). Anything unreadable runs the commit (./dev ci
      # reuse fails open).
      - name: Reuse a full green run of this commit
        id: reuse
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          PLAN_TOKEN: ${{ github.token }}
          PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
        run: ./dev ci reuse --workflow ci.yml

      # ADR 0116: the packages each runner class can skip, from the test-result store (the one step of the plan job that holds the
      # test cache's key, C141). Empty while docs/test-cache.toml has no two clean shadow runs recorded. Fails open: no file, no reuse.
      - name: Test cache plan
        if: ${{ steps.reuse.outputs.reuse != 'true' }}
        continue-on-error: true
        env:
          PLAN_TOKEN: ${{ github.token }}
          PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
          PADDOCK_TEST_CACHE_KEY_ID: ${{ secrets.PADDOCK_TEST_CACHE_KEY_ID }}
          PADDOCK_TEST_CACHE_SECRET: ${{ secrets.PADDOCK_TEST_CACHE_SECRET }}
          PADDOCK_SCCACHE_S3_ENDPOINT: ${{ vars.PADDOCK_SCCACHE_S3_ENDPOINT }}
        run: ./dev ci test-cache plan --shared --out "$RUNNER_TEMP/test-cache-plan.json"

      - name: Affected projects
        id: plan
        env:
          PLAN_TOKEN: ${{ github.token }}
          PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
          PADDOCK_DEV_DOWNLOAD: ${{ (inputs.release == true || startsWith(github.ref, 'refs/tags/')) && '0' || '' }}
          PLAN_BASE: ${{ github.event.inputs.base }}
          # A train's landing run plans the diff from this commit and stays a full run (plan_ci::choose_base, ADR 0117 WP-8).
          PLAN_LANDING_BASE: ${{ github.event.inputs.landing_base }}
          PLAN_APP: ${{ inputs.app }}
          # OS-scoped tests (hostTests): every package on every OS only in the nightly, a tag's or an app's release gates and a manual ask
          # (tools/paddock-dev/src/plan_ci.rs full_os); every other run tests OS-specific code on each OS and the rest on Linux.
          PLAN_FULL_OS: ${{ (inputs.os_full == true || inputs.os_full == 'true' || github.event.inputs.os_full == 'true') && 'true' || '' }}
          PLAN_RELEASE: ${{ inputs.release == true && 'true' || '' }}
          PLAN_WEBKIT: ${{ (inputs.webkit == true || inputs.webkit == 'true') && '1' || '' }}
          # The rerun reads the earlier run's jobs and logs through the API (tools/paddock-dev/src/plan_since.rs).
          PLAN_SINCE_RUN: ${{ github.event.inputs.since_run }}
          # The scope of a rerun planner's reading of this run (plan_since::MODE_LINE). It is not the verdict: `./dev plan --ci` prints
          # the line `plan scope: {json}` (ADR 0113), what the run does against what a push to main does, and `./dev ci verdict`
          # compares them. No line of this workflow decides "complete".
          PLAN_MODE_FULL: ${{ github.event_name == 'push' || inputs.app != '' || (github.event_name == 'workflow_dispatch' && github.event.inputs.base == '' && github.event.inputs.since_run == '') }}
          # A reused run (the step above): the planner switches every job off and declares that it ran nothing; the reused run decides
          # the commit.
          PLAN_REUSE: ${{ steps.reuse.outputs.reuse }}
          # The test-result cache's plan (ADR 0116): read when the file is there.
          PLAN_TEST_CACHE_FILE: ${{ runner.temp }}/test-cache-plan.json
          EVENT: ${{ github.event_name }}
        run: |
          ./dev plan --ci
          # A smoke or affected-only selection (the graph planner's `partial`) is never a full run; the mode line says so (P2-4).
          if grep -q '^partial=true$' "$GITHUB_OUTPUT"; then PLAN_MODE_FULL=false; fi
          echo "plan mode: full=$PLAN_MODE_FULL"

  # The developer and CI tool (ADR 0022): its own Cargo workspace and lockfile, tested on every OS it runs on. Linux runs in the
  # paddock-ci image (git, Node for the golden test's live oracle, nextest); Windows and macOS run on the host.
  # Started first (user, 2026-11-25): the longest Linux job is the first job after `plan` in this file, so it takes the first free
  # Linux lane. Gitea hands a runner the waiting job with the oldest `updated` time, then the lowest id (models/actions/task.go,
  # CreateTaskForRunner: Asc("updated", "id")); every job that needs only `plan` turns waiting in the same transaction, and the ids
  # follow the order of the jobs in this file, so the file order is the start order. A `needs` would make it wait instead.
  # It waited 5.5 to 12.8 min behind short jobs when it came last (speed audit, 2026-11-25).
  # The Linux tests run as 3 parallel jobs of nextest's own hash partition (`matrix.part_label`: `, 2/3`; the plan's
  # `plan_ci::partition_nextest_legs`; user decision 107a, 2026-11-27); Windows and macOS stay one leg each. The once-only steps
  # (lockfile, format, Clippy, Deny) run on partition 1 alone (`matrix.part_extra`).
  # A partition's log holds part of the package's tests, so the test-cache record (a whole package's pass) runs on unsplit legs only.
  paddock-dev:
    name: paddock-dev (${{ matrix.os }}${{ matrix.part_label }})
    needs: [plan]
    if: ${{ needs.plan.outputs.paddock_dev == 'true' && contains(fromJSON(needs.plan.outputs.rerun_jobs || '["paddock-dev"]'), 'paddock-dev') }}
    strategy:
      fail-fast: false
      matrix:
        # Every OS; a rerun of a run's failures (since_run) only the failed legs, each with the filter of its failed tests.
        include: ${{ fromJSON(needs.plan.outputs.paddock_dev_legs) }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.os == 'ubuntu-latest' && 'dev.decryptology.net/decryp7/paddock-ci:v3' || '' }}
    defaults:
      run:
        working-directory: tools/paddock-dev
        shell: bash
    env:
      # A run for a tag builds the tool from source (ADR 0022: release and tag jobs bypass every cache); other runs may download it.
      PADDOCK_DEV_DOWNLOAD: ${{ (inputs.release == true || startsWith(github.ref, 'refs/tags/')) && '0' || '' }}
      # Read credential for ./dev's prebuilt download (ADR 0022 R0b), only in the jobs that run ./dev (job-isolation).
      PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
      CARGO_TERM_COLOR: always
    steps:
      # Linux: the whole tree in the container. Hosts: only the bootstrap folders (the actions, their scripts, paddock-dev's inputs)
      # as a partial clone; the kept-clone step below brings the slot's own clone to this commit (conformance/ci/checkout-profiles.txt).
      - uses: actions/checkout@v4
        if: runner.os == 'Linux'
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/checkout@v4
        if: runner.os != 'Linux'
        with:
          persist-credentials: false
          sparse-checkout: |
            .cargo
            .gitea
            conformance
            scripts
            tools
            crates
          filter: blob:none

      - name: Git bash on PATH (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: .
        run: |
          if not exist "%ProgramFiles%\Git\bin\bash.exe" (echo Git for Windows is not installed on this runner & exit /b 1)
          echo %ProgramFiles%\Git\bin>>"%GITHUB_PATH%"

      # CARGO_BUILD_JOBS: this runner's share of the host's cores (before job-isolation, which builds paddock-dev).
      - uses: ./.gitea/actions/build-jobs

      # A slot of the host (job isolation; after Git bash on Windows): its kept folders and ports are this job's alone.
      - uses: ./.gitea/actions/job-isolation

      - uses: ./.gitea/actions/kept-clone
        if: runner.os != 'Linux'
        with:
          name: paddock-checkout-${{ runner.os }}
          profile: lean

      - uses: ./.gitea/actions/build-folder
        with:
          workspace: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/tools/paddock-dev
          name: paddock-${{ github.job }}

      - uses: ./.gitea/actions/setup-rust
        with:
          components: clippy,rustfmt
          sccache-s3-access-key-id: ${{ secrets.PADDOCK_SCCACHE_S3_ACCESS_KEY_ID }}
          sccache-s3-secret-access-key: ${{ secrets.PADDOCK_SCCACHE_S3_SECRET_ACCESS_KEY }}

      - uses: ./.gitea/actions/host-tools

      # The tool's lockfile must follow the lockfiles of the crates/ it uses by path (they change dependencies in their own PRs).
      # A leg with a filter (a rerun of failed tests) runs only the tests: its other steps passed in the earlier run.
      - name: Lockfile is current
        if: ${{ !matrix.filter && matrix.part_extra != 'false' }}
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/tools/paddock-dev
        run: |
          cargo metadata --locked --format-version 1 > /dev/null || {
            echo "::error::tools/paddock-dev/Cargo.lock is stale, run cargo update -w in tools/paddock-dev and commit it"; exit 1; }

      - name: Format
        if: ${{ !cancelled() && env.PADDOCK_JOB_ABORTED != '1' && !matrix.filter && matrix.part_extra != 'false' }}
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/tools/paddock-dev
        run: cargo fmt --check

      - name: Clippy
        if: ${{ !cancelled() && env.PADDOCK_JOB_ABORTED != '1' && !matrix.filter && matrix.part_extra != 'false' }}
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/tools/paddock-dev
        run: cargo clippy --all-targets --locked -- -D warnings

      # The inputs and generator tests read the cargo metadata of tools/throttle offline: its packages must be in
      # the job's cargo home, not only paddock-dev's (heavy's paddock-env dependency was missing on 2026-11-13, run 8050).
      - name: Fetch the other tools' dependencies
        if: ${{ !cancelled() && env.PADDOCK_JOB_ABORTED != '1' }}
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/tools
        run: |
          for t in throttle; do
            (cd "$t" && cargo fetch --locked) || {
              echo "::error::cargo fetch --locked failed in tools/$t, so the offline metadata tests cannot read it. Next step: run it on the runner to see why"; exit 1; }
          done

      - name: Tests
        if: ${{ !cancelled() && env.PADDOCK_JOB_ABORTED != '1' }}
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/tools/paddock-dev
        env:
          FILTER: ${{ matrix.filter }}
          # OS-scoped tests (tools/paddock-dev/paddock.ci.json `hostTests`, ./dev plan --ci): the modules this host leg tests, with a member
          # run's reached packages. Linux tests everything.
          TEST_FILTER: ${{ matrix.test_filter }}
          TEST_SKIP: ${{ matrix.test_skip }}
          # The packages whose pass of the same key the test cache reuses (ADR 0116): see the crates job's step.
          TEST_CACHE_EXCLUDE: ${{ matrix.test_cache_exclude }}
          # The Linux partition (`, 2/3`, empty on the other legs): nextest's hash partition of the whole package's tests.
          PART_LABEL: ${{ matrix.part_label }}
          PADDOCK_TEST_COST_REPORT: ${{ runner.temp }}/test-cost-${{ github.run_id }}-${{ github.run_attempt }}.jsonl
          # A failed-only round (since_run): each failed test of FILTER must still select a test (./dev ci rerun-check), never a warning.
          RERUN: ${{ github.event.inputs.since_run }}
        run: |
          # The plan's selection has no test of this workspace (its gates still run above): nothing to test, said, never a filter that selects none.
          if [ -z "$FILTER" ] && [ "$TEST_SKIP" = true ]; then echo "::notice::this run's selection holds no test of paddock-dev: nothing to test here"; exit 0; fi
          if [ -n "$FILTER" ] && [ -n "$RERUN" ]; then
            cargo nextest list --locked -E "$FILTER" --message-format json > "$RUNNER_TEMP/rerun-listed.json" || { echo "::error::rerun-check: cargo nextest list failed. Next: read the build error above"; exit 1; }
            "${PADDOCK_WORKSPACE:-$GITHUB_WORKSPACE}/dev" ci rerun-check --filter "$FILTER" --listed "$RUNNER_TEMP/rerun-listed.json" || exit 1
          fi
          filter=()
          if [ -n "$FILTER" ]; then echo "::notice::nextest runs only the selected tests (a rerun's failed tests, or the plan's smoke set or affected targets): $FILTER"; filter=(-E "$FILTER" --no-tests=warn)
          elif [ -n "$TEST_FILTER" ]; then echo "::notice::nextest filter (hostTests, and the packages this change reaches in a member run): $TEST_FILTER"; filter=(-E "$TEST_FILTER" --no-tests=fail); fi
          if [ -n "$TEST_CACHE_EXCLUDE" ] && [ -z "$FILTER" ]; then
            echo "::notice::test-cache: nextest leaves out the packages with a reusable pass of the same key (and filter): $TEST_CACHE_EXCLUDE"
            if [ -n "$TEST_FILTER" ]; then filter=(-E "($TEST_FILTER) & ($TEST_CACHE_EXCLUDE)" --no-tests=warn); else filter=(-E "$TEST_CACHE_EXCLUDE" --no-tests=warn); fi
          fi
          # A partition runs its share of the tests the filters select; a rerun of named failed tests (FILTER) runs those whole.
          part=()
          if [ -n "$PART_LABEL" ] && [ -z "$FILTER" ]; then part=(--partition "hash:${PART_LABEL#, }"); echo "::notice::nextest partition ${PART_LABEL#, } (hash of the test)"; fi
          set -o pipefail
          cargo nextest run --profile ci --locked --no-fail-fast ${part[@]+"${part[@]}"} ${filter[@]+"${filter[@]}"} 2>&1 | tee "$RUNNER_TEMP/nextest-paddock-dev.log"

      # ADR 0116, report-only (ER-41): the test-result record of paddock-dev's package (see the crates leg's step). Unlike the crates
      # job, paddock-dev's Linux leg runs its tests plainly (no coverage run), so it is cacheable on every runner. A leg that runs only a
      # filtered part of the package (hostTests modules on Windows and macOS, a member run's filter) records under its `test_filter`: the
      # key holds the filter, so that pass counts only for a later leg with the same filter (user decision 97). `record` stores only
      # packages whose tests all passed on the first try in a whole log (test_cache::records_from_log).
      - name: Record test results (test cache)
        if: ${{ !cancelled() && env.PADDOCK_JOB_ABORTED != '1' && !matrix.filter && matrix.part_label == '' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/train/')) }}
        continue-on-error: true
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/tools/paddock-dev
        env:
          PLAN_TOKEN: ${{ github.token }}
          LEG_FILTER: ${{ matrix.test_filter }}
          # The job's display name (the `name:` of this job) and the run's attempt: the reader trusts a record by its own job's result.
          PADDOCK_JOB_NAME: paddock-dev (${{ matrix.os }})
          PADDOCK_RUN_ATTEMPT: ${{ github.run_attempt }}
          PADDOCK_TEST_CACHE_KEY_ID: ${{ secrets.PADDOCK_TEST_CACHE_KEY_ID }}
          PADDOCK_TEST_CACHE_SECRET: ${{ secrets.PADDOCK_TEST_CACHE_SECRET }}
          PADDOCK_SCCACHE_S3_ENDPOINT: ${{ vars.PADDOCK_SCCACHE_S3_ENDPOINT }}
        run: |
          [ -s "$RUNNER_TEMP/nextest-paddock-dev.log" ] || { echo "::notice::test-cache: no nextest output to record"; exit 0; }
          "${PADDOCK_WORKSPACE:-$GITHUB_WORKSPACE}/dev" ci test-cache record --workspace tools/paddock-dev --shared --filter "$LEG_FILTER" --log "$RUNNER_TEMP/nextest-paddock-dev.log"

      # ADR 0121, report-only (ER-41): the cost-class charges the tests recorded; a ::warning:: and a job-summary row per test outside its class.
      - name: Test cost report
        if: ${{ !cancelled() && env.PADDOCK_JOB_ABORTED != '1' }}
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}
        run: ./dev ci test-cost --wall-asserts --report "$RUNNER_TEMP/test-cost-${{ github.run_id }}-${{ github.run_attempt }}.jsonl"

      # Licences, advisories, sources (tools/paddock-dev/deny.toml, the crates' rules); the image has cargo-deny.
      - name: Deny
        if: ${{ !cancelled() && env.PADDOCK_JOB_ABORTED != '1' && runner.os == 'Linux' && !matrix.filter && matrix.part_extra != 'false' }}
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/tools/paddock-dev
        run: cargo deny check

      # The kept build folder stays within its cap (this job's own folder only, after the builds).
      - uses: ./.gitea/actions/prune-build-folder
        if: always() && runner.os != 'Linux'

      - uses: ./.gitea/actions/sccache-stats
        if: always()

      # The slot goes back last: the prune and the sccache server's stop act on this slot's folders and port.
      - uses: ./.gitea/actions/job-isolation
        if: always()
        with:
          mode: release

  # ADR 0116, report-only (ER-41): what the test-result cache would reuse for each runner class of the crates workspace. A job of its own
  # that nothing needs, so it adds nothing to the critical path (it waits for the plan like the other jobs and no job waits for it). Nothing is skipped (the
  # switch in docs/test-cache.toml is off until two clean shadow train runs are recorded); a store that cannot be reached is a notice.
  # Reads nothing in a tag run, a release or the nightly (`./dev ci test-cache` refuses itself).
  test-cache-shadow:
    needs: [plan]
    # A rerun of failed jobs and a reused run end it (rerun_jobs is empty then for the jobs it does not name).
    if: ${{ contains(fromJSON(needs.plan.outputs.rerun_jobs || '["test-cache-shadow"]'), 'test-cache-shadow') }}
    name: test cache (shadow report)
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v3
    env:
      PADDOCK_DEV_DOWNLOAD: ${{ (inputs.release == true || startsWith(github.ref, 'refs/tags/')) && '0' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      # Before the first ./dev call of the job (the tool through the Actions cache, with the read token).
      - env:
          PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
        uses: ./.gitea/actions/dev-tool-cache
      - name: Test cache lookup per runner class
        continue-on-error: true
        env:
          PLAN_TOKEN: ${{ github.token }}
          PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
          # The test cache's own RustFS key (C141: only `./dev ci test-cache` steps name it). Without the secrets the step is a notice.
          PADDOCK_TEST_CACHE_KEY_ID: ${{ secrets.PADDOCK_TEST_CACHE_KEY_ID }}
          PADDOCK_TEST_CACHE_SECRET: ${{ secrets.PADDOCK_TEST_CACHE_SECRET }}
          PADDOCK_SCCACHE_S3_ENDPOINT: ${{ vars.PADDOCK_SCCACHE_S3_ENDPOINT }}
        run: |
          for class in Linux-X64 macOS-ARM64 Windows-X64; do
            echo "::group::test-cache $class"
            ./dev ci test-cache lookup --workspace crates --class "$class" --shared || true
            echo "::endgroup::"
          done

  ui:
    needs: [plan]
    # Also the ESLint preset's tests and the family icons' checks, as steps of their own projects (one job instead of three, user
    # 2026-11-24). Each check step runs when the planner marks its own project, and the setup steps when it marks any of the three; the
    # job itself asks only rerun_jobs, so each check is gated by its own project alone (C100 reads a job condition into every line).
    if: ${{ contains(fromJSON(needs.plan.outputs.rerun_jobs || '["ui"]'), 'ui') }}
    name: ui (tokens, contrast, components, entry points, publish dry run, ESLint preset, icons)
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v3
    env:
      # The graph's selection of this job's project (ADR 0117 §5): `./dev ci run` skips a phase it does not keep and gives a test
      # runner only the affected files (tools/paddock-dev/src/ci_run/select.rs). Empty: every phase, every file.
      PADDOCK_PLAN_SELECTION: ${{ needs.plan.outputs.selection }}
      # `./dev ci run` runs the job's commands from its project's paddock.ci.json (ADR 0038 §1): a tag or release run builds the tool from source.
      # The read credential is set on the ./dev steps only.
      PADDOCK_DEV_DOWNLOAD: ${{ (inputs.release == true || startsWith(github.ref, 'refs/tags/')) && '0' || '' }}
      # scripts/npm-audit.test.mjs measures its allow list's growth against this (ER-46), as conformance does: the dispatch's
      # `base`, else origin/main; a base it cannot read fails the test as not measured (run 8327: a shallow checkout had none).
      PADDOCK_BASE_REF: ${{ inputs.base || 'origin/main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The base of the allow list growth test (PADDOCK_BASE_REF) and its merge base.
          fetch-depth: 0

      # Before the first ./dev of the job: it hashes and builds itself with the job's pinned compiler.
      - env:
          PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
        uses: ./.gitea/actions/setup-rust
        with:
          sccache-s3-access-key-id: ${{ secrets.PADDOCK_SCCACHE_S3_ACCESS_KEY_ID }}
          sccache-s3-secret-access-key: ${{ secrets.PADDOCK_SCCACHE_S3_SECRET_ACCESS_KEY }}

      - uses: ./.gitea/actions/node-caches
        if: needs.plan.outputs.ui == 'true' || needs.plan.outputs.eslint == 'true' || needs.plan.outputs.icons == 'true'

      # One npm workspace for the repo (ADR 0014 §1): the root lock installs every package.
      - name: Install
        if: needs.plan.outputs.ui == 'true' || needs.plan.outputs.eslint == 'true' || needs.plan.outputs.icons == 'true'
        working-directory: .
        run: npm ci

      # WCAG contrast of every text/background pair and colour-vision separation of the chart palette.
      - env:
          PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
        name: Contrast and CVD checks
        if: needs.plan.outputs.ui == 'true'
        run: ./dev ci run ui tokens

      # The Paddock ESLint preset (rules 27 to 39 and the angular-eslint template and accessibility rules) over every ui project.
      - env:
          PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
        name: Lint
        if: needs.plan.outputs.ui == 'true'
        run: ./dev ci run ui lint

      - env:
          PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
        name: Component specs
        if: needs.plan.outputs.ui == 'true'
        run: ./dev ci run ui specs

      - env:
          PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
        name: Script tests
        if: needs.plan.outputs.ui == 'true'
        run: ./dev ci run ui scripts

      # Every entry point (root, /shell/*, /workbench/*) is built by ng-packagr; the dry run below checks each is exported.
      - env:
          PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
        name: Build the library (all entry points)
        if: needs.plan.outputs.ui == 'true'
        run: ./dev ci run ui build

      # The shell's message catalog and the pseudo-locale files match the build (plan S15: `npm run i18n` to refresh).
      - env:
          PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
        name: Translation files up to date
        if: needs.plan.outputs.ui == 'true'
        run: ./dev ci run ui i18n

      - env:
          PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
        name: Build @decryp7/paddock-e2e
        if: needs.plan.outputs.ui == 'true'
        run: ./dev ci run ui build-e2e

      - env:
          PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
        name: Build the shell demo
        if: needs.plan.outputs.ui == 'true'
        run: ./dev ci run ui shell-demo

      - env:
          PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
        name: Build the workbench demo
        if: needs.plan.outputs.ui == 'true'
        run: ./dev ci run ui workbench-demo

      # Lists every npm package, entry point and crate with what a tag would publish; publishes nothing.
      - env:
          PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
        name: Publish dry run
        if: needs.plan.outputs.ui == 'true'
        run: ./dev ci run ui publish-dry-run

      # @decryp7/paddock-eslint (eslint/, plan X11): RuleTester cases per rule and the preset run through ESLint on temp files.
      - env:
          PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
        name: ESLint preset (rules 27 to 39)
        if: needs.plan.outputs.eslint == 'true'
        run: ./dev ci run eslint tests

      # The family icons (icons/): the pipeline's tests (seam scan, coverage, tray shapes, .icns frames, docs copies) and the check that
      # every installed copy in the apps and the docs equals the build. Without the second step a hand edit of an app's icons goes unnoticed.
      - env:
          PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
        name: Icon tests
        if: needs.plan.outputs.icons == 'true'
        run: ./dev ci run icons tests

      - env:
          PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
        name: Installed icon copies match the build
        if: needs.plan.outputs.icons == 'true'
        run: ./dev ci run icons installed

      - uses: ./.gitea/actions/sccache-stats
        if: always()

  # The reference apps in the browser (gallery and shell demo; axe, keyboard, CSP, 320 px), in two shards that run at the
  # same time: the specs run one at a time within a shard (playwright.config.ts), so splitting the files halves the wait.
  # The apps compile from source (tsconfig paths), so a shard needs no library build. Only when the planner wants the browser jobs
  # (`webkit`: the nightly, a v* tag before publish.yml, a manual ask), never on a branch, a train or a push to main (user, 2026-11-24).
  e2e:
    name: reference apps (shard ${{ matrix.shard }}/2)
    needs: [plan]
    if: ${{ needs.plan.outputs.ui == 'true' && (needs.plan.outputs.webkit == 'true' || contains(fromJSON(needs.plan.outputs.rerun_jobs || '[]'), 'e2e')) && contains(fromJSON(needs.plan.outputs.rerun_jobs || '["e2e"]'), 'e2e') }}
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v3
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      # The graph's selection of this job's project (ADR 0117 §5): `./dev ci run` skips a phase it does not keep and gives a test
      # runner only the affected files (tools/paddock-dev/src/ci_run/select.rs). Empty: every phase, every file.
      PADDOCK_PLAN_SELECTION: ${{ needs.plan.outputs.selection }}
      # `./dev ci run` runs the job's commands from its project's paddock.ci.json (ADR 0038 §1): a tag or release run builds the tool from source.
      # The read credential is set on the ./dev steps only.
      PADDOCK_DEV_DOWNLOAD: ${{ (inputs.release == true || startsWith(github.ref, 'refs/tags/')) && '0' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Before the first ./dev of the job: it hashes and builds itself with the job's pinned compiler.
      - env:
          PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
        uses: ./.gitea/actions/setup-rust
        with:
          sccache-s3-access-key-id: ${{ secrets.PADDOCK_SCCACHE_S3_ACCESS_KEY_ID }}
          sccache-s3-secret-access-key: ${{ secrets.PADDOCK_SCCACHE_S3_SECRET_ACCESS_KEY }}

      # Playwright's browsers and Chrome for Testing are baked into the image (ci-image/): nothing is downloaded per job.
      - uses: ./.gitea/actions/node-caches
        with:
          name: e2e-${{ matrix.shard }}

      - name: Install
        working-directory: .
        run: npm ci

      - name: Reference app checks
        # CI names its ports (@decryp7/paddock-e2e refuses a default there: another job could hold it), one pair per shard.
        env:
          PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
          PW_PORT: ${{ matrix.shard == 1 && '4300' || '4310' }}
          SHELL_DEMO_PORT: ${{ matrix.shard == 1 && '4301' || '4311' }}
          WORKBENCH_DEMO_PORT: ${{ matrix.shard == 1 && '4302' || '4312' }}
          E2E_SHARD: ${{ matrix.shard }}/2
        run: ./dev ci run ui e2e

      - uses: ./.gitea/actions/sccache-stats
        if: always()

  # WebKit is the engine of WKWebView, which the macOS apps render in: the three ui Playwright projects run in Playwright's own WebKit
  # build, for v* tags, nightly.yml and a manual ask only (the planner's `webkit`, as the e2e job). On Linux, in the CI image that bakes
  # WebKit in: the CI Mac is a LaunchDaemon with no window server (ADR 0120, user decision 2026-11-25), where Playwright's WebKit cannot
  # register with WindowServer (Playwright #43066). macOS WebKit (the WKWebView build) is then a local run on a Mac with a login session;
  # no macOS WebKit in CI is accepted for now (user, 2026-11-25).
  e2e-webkit:
    name: reference apps in WebKit (Linux)
    needs: [plan]
    if: ${{ needs.plan.outputs.ui == 'true' && (needs.plan.outputs.webkit == 'true' || contains(fromJSON(needs.plan.outputs.rerun_jobs || '[]'), 'e2e-webkit')) && contains(fromJSON(needs.plan.outputs.rerun_jobs || '["e2e-webkit"]'), 'e2e-webkit') }}
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v3
    env:
      # The graph's selection of this job's project (ADR 0117 §5): `./dev ci run` skips a phase it does not keep and gives a test
      # runner only the affected files (tools/paddock-dev/src/ci_run/select.rs). Empty: every phase, every file.
      PADDOCK_PLAN_SELECTION: ${{ needs.plan.outputs.selection }}
      # A run for a tag builds the tool from source (ADR 0022: release and tag jobs bypass every cache); other runs may download it.
      PADDOCK_DEV_DOWNLOAD: ${{ (inputs.release == true || startsWith(github.ref, 'refs/tags/')) && '0' || '' }}
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Before the first ./dev of the job: it hashes and builds itself with the job's pinned compiler.
      - env:
          PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
        uses: ./.gitea/actions/setup-rust
        with:
          sccache-s3-access-key-id: ${{ secrets.PADDOCK_SCCACHE_S3_ACCESS_KEY_ID }}
          sccache-s3-secret-access-key: ${{ secrets.PADDOCK_SCCACHE_S3_SECRET_ACCESS_KEY }}

      # Playwright's browsers, WebKit with its Linux dependencies included, are baked into the image (ci-image/): nothing is downloaded.
      - uses: ./.gitea/actions/node-caches
        with:
          name: e2e-webkit

      - name: Install
        working-directory: .
        run: npm ci

      # CI names its ports (@decryp7/paddock-e2e refuses a default there), apart from the e2e shards' 4300-4312 and nightly.yml's 4330-4332.
      - name: Reference app checks in WebKit
        env:
          PADDOCK_WEBKIT: "1"
          PW_PORT: "4340"
          SHELL_DEMO_PORT: "4341"
          WORKBENCH_DEMO_PORT: "4342"
        run: |
          npx playwright test --project=gallery-webkit --project=shell-demo-webkit --project=workbench-demo-webkit
          npx playwright test -c projects/paddock-e2e/selftest/playwright.config.ts --project=webkit

      # The traces of failed tests (retain-on-failure, paddockTrace) and each failure's error context: nightly 9103's chart spec failed with
      # only its timeout in the log and nothing kept to show why.
      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        if: failure()
        with:
          name: e2e-webkit-results
          path: ui/.angular/playwright-results
          if-no-files-found: ignore

      - uses: ./.gitea/actions/sccache-stats
        if: always()

  # @decryp7/paddock-conformance (conformance/, plan X9): every check has a good and a bad fixture, the release scripts are
  # tested (latest.json byte-equal to the apps' copy), the shared macOS verify runs against a shimmed bundle. One dependency, `yaml`
  # (C111 parses every workflow), installed from the root package-lock.json (conformance is a root npm workspace).
  conformance:
    name: conformance (checks, release scripts)
    needs: [plan]
    if: ${{ needs.plan.outputs.conformance == 'true' && contains(fromJSON(needs.plan.outputs.rerun_jobs || '["conformance"]'), 'conformance') }}
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v3
    env:
      # The graph's selection of this job's project (ADR 0117 §5): `./dev ci run` skips a phase it does not keep and gives a test
      # runner only the affected files (tools/paddock-dev/src/ci_run/select.rs). Empty: every phase, every file.
      PADDOCK_PLAN_SELECTION: ${{ needs.plan.outputs.selection }}
      PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
      PADDOCK_DEV_DOWNLOAD: ${{ (inputs.release == true || startsWith(github.ref, 'refs/tags/')) && '0' || '' }}
      # The ref the baselines' and allow lists' growth is measured against (ER-21; ADR 0098 amendment): the dispatch's `base` (the
      # queue passes the commit of main the train is built on), else origin/main. This workflow has no pull_request trigger. One reader:
      # check::baseline::target_ref.
      PADDOCK_BASE_REF: ${{ inputs.base || 'origin/main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # C100 reads the register's history (the Gates-date trailers) and the base revision.
          fetch-depth: 0

      # Before the first ./dev of the job (the commands below are ./dev ci run steps).
      - uses: ./.gitea/actions/setup-rust
        with:
          sccache-s3-access-key-id: ${{ secrets.PADDOCK_SCCACHE_S3_ACCESS_KEY_ID }}
          sccache-s3-secret-access-key: ${{ secrets.PADDOCK_SCCACHE_S3_SECRET_ACCESS_KEY }}

      - name: Install (yaml for C111, from the root package-lock.json)
        working-directory: .
        run: npm ci --ignore-scripts -w conformance

      - name: Tests
        run: ./dev ci run conformance tests

      # Paddock runs its own conformance checks (plan X9): the `conformance` field of conformance/paddock.ci.json lists them, with the
      # reason each other check is skipped. The checkout above has the full history (C71 compares its baseline with the merge base's).
      - name: Paddock itself (applicable checks)
        run: ./dev ci run conformance paddock

      # ADR 0060, C100: every check the repository defines is run by a reachable CI line, or registered in docs/gates.toml with a
      # reason, an owner and a review date. Rollback: `./dev gates check --warn`. The nightly has a job of its own (nightly.yml).
      - name: C100 (every check runs somewhere)
        working-directory: .
        run: ./dev gates check

      - uses: ./.gitea/actions/sccache-stats
        if: always()

  # The shared CI actions' scripts and the dev and host tools (plan X10, X47): every script runs in a scratch folder with a
  # PATH of shims, so no launchd, systemd, Docker or installed app is touched. New-app templates are covered by scripts/.
  tools:
    name: tools and shared scripts
    needs: [plan]
    if: ${{ needs.plan.outputs.tools == 'true' && contains(fromJSON(needs.plan.outputs.rerun_jobs || '["tools"]'), 'tools') }}
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v3
    env:
      # The graph's selection of this job's project (ADR 0117 §5): `./dev ci run` skips a phase it does not keep and gives a test
      # runner only the affected files (tools/paddock-dev/src/ci_run/select.rs). Empty: every phase, every file.
      PADDOCK_PLAN_SELECTION: ${{ needs.plan.outputs.selection }}
      # `./dev ci run` runs the job's commands from its project's paddock.ci.json (ADR 0038 §1): a tag or release run builds the tool from source.
      # The read credential is set on the ./dev steps only.
      PADDOCK_DEV_DOWNLOAD: ${{ (inputs.release == true || startsWith(github.ref, 'refs/tags/')) && '0' || '' }}
      # scripts/npm-audit.test.mjs measures its allow list's growth against this (ER-46), as conformance does: the dispatch's
      # `base`, else origin/main; a base it cannot read fails the test as not measured (run 8327: a shallow checkout had none).
      PADDOCK_BASE_REF: ${{ inputs.base || 'origin/main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The base of the allow list growth test (PADDOCK_BASE_REF) and its merge base.
          fetch-depth: 0

      # Before the first ./dev of the job: it hashes and builds itself with the job's pinned compiler.
      - env:
          PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
        uses: ./.gitea/actions/setup-rust
        with:
          sccache-s3-access-key-id: ${{ secrets.PADDOCK_SCCACHE_S3_ACCESS_KEY_ID }}
          sccache-s3-secret-access-key: ${{ secrets.PADDOCK_SCCACHE_S3_SECRET_ACCESS_KEY }}

      - env:
          PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
        name: Tools
        run: ./dev ci run tools tests

      - env:
          PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
        name: new-app templates
        run: ./dev ci run tools scripts

      # The agent hooks' tests (.claude/hooks/*.test.sh, with the rule-55 parity test of places.rs against lib/paddockpaths.py).
      # Blocking since its first green run on the real tree, ci.yml run 9030 (b3ad2dd2d, 2026-11-25; ER-41).
      # A change under .claude/hooks/, places.rs or docs/known-copies.toml marks this job.
      - env:
          PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
        name: Hooks tests
        run: ./dev ci run tools hooks

      # ER-40: a committed SVG is generated from its .drawio and never hand-edited. The check re-exports every diagram with the pinned
      # draw.io (ci-image/Dockerfile: DRAWIO_VERSION) and fails on a difference that is not the host's fonts (scripts/svg-drift.mjs).
      # A diagram or SVG change marks this job through the declared inputs of the planner (tools/paddock-dev/src/plan.rs, DOC_INPUTS).
      - name: draw.io for the SVG drift check
        run: |
          # The image from v3 on has it (system packages belong to the image, not to a job). Until then: the same pinned package, checked
          # by SHA-256 (the Dockerfile's ARGs are the one source) and unpacked beside the job, not installed; its libraries are the image's.
          if command -v drawio >/dev/null 2>&1; then exit 0; fi
          v=$(sed -n 's/^ARG DRAWIO_VERSION=//p' ci-image/Dockerfile | head -n 1)
          sum=$(sed -n 's/^ARG DRAWIO_SHA256_AMD64=//p' ci-image/Dockerfile | head -n 1)
          echo "::notice::the CI image has no draw.io yet (it comes with the next image rebuild, ci-image/README.md); unpacking the pinned $v"
          bash ci-image/fetch-verified.sh "https://github.com/jgraph/drawio-desktop/releases/download/v${v}/drawio-amd64-${v}.deb" "$sum" "$RUNNER_TEMP/drawio.deb" \
            || { echo "::error::could not fetch the pinned draw.io $v (see the line above). Fix: re-run, or check the release still exists and the SHA-256 in ci-image/Dockerfile."; exit 1; }
          dpkg-deb -x "$RUNNER_TEMP/drawio.deb" "$RUNNER_TEMP/drawio" \
            || { echo "::error::unpacking draw.io $v failed. Fix: run dpkg-deb -x on the same file in the paddock-ci image to see why."; exit 1; }
          echo "DRAWIO=$RUNNER_TEMP/drawio/opt/drawio/drawio" >> "$GITHUB_ENV"

      - env:
          PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
        name: SVG drift (ER-40)
        run: ./dev ci run tools svg-drift

      - uses: ./.gitea/actions/sccache-stats
        if: always()

  crates:
    name: crates (fmt, workspace hack, unused deps, coverage, deny)
    needs: [plan]
    if: ${{ needs.plan.outputs.crates == 'true' && contains(fromJSON(needs.plan.outputs.rerun_jobs || '["crates"]'), 'crates') }}
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v3
    env:
      # The graph's selection of this job's project (ADR 0117 §5): `./dev ci run` skips a phase it does not keep and gives a test
      # runner only the affected files (tools/paddock-dev/src/ci_run/select.rs). Empty: every phase, every file.
      PADDOCK_PLAN_SELECTION: ${{ needs.plan.outputs.selection }}
      # setup-rust runs ./dev (docs/plans/ci-in-rust.md): the read credential, and a tag or release run builds the tool from source.
      PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
      PADDOCK_DEV_DOWNLOAD: ${{ (inputs.release == true || startsWith(github.ref, 'refs/tags/')) && '0' || '' }}
      # The job runs as root in the container, where Chromium refuses to start with its sandbox (the real-browser test of
      # paddock-chromium); the driver drops the sandbox only for root AND with this opt-in.
      PADDOCK_BROWSER_NO_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.gitea/actions/setup-rust
        with:
          sccache-s3-access-key-id: ${{ secrets.PADDOCK_SCCACHE_S3_ACCESS_KEY_ID }}
          sccache-s3-secret-access-key: ${{ secrets.PADDOCK_SCCACHE_S3_SECRET_ACCESS_KEY }}
      - run: ./dev ci run crates fmt

      # cargo-hakari and cargo-machete come with the image (ci-image/).
      # One feature set per dependency (docs/dev-setup.md): the workspace-hack crate is current and every member uses it.
      - name: Workspace hack up to date
        run: ./dev ci run crates hakari

      # A dependency added to a shared crate must not change the workspace hack, the features of a watched crate (serde_json:
      # docs/shared-crate-features.toml) or a lockfile without that change in the same commit. Report-only until its first green run
      # on the real tree (ER-41): warnings, exit 0; the record is at `MODE` in tools/paddock-dev/src/locks_guard.rs.
      - name: Shared-crate dependency guard
        run: ./dev locks guard

      # Unused dependencies. A false report goes into `ignored` of [workspace.metadata.cargo-machete] (Cargo.toml) or of the
      # crate's own [package.metadata.cargo-machete], with the reason; the workspace-hack crate is depended on for features.
      - name: Unused dependencies
        run: ./dev ci run crates machete

      # Merged line coverage over all test binaries, adapters included (the per-binary summary counts unused generic instances).
      # Native glue files are left out (crates/README.md: never logic, reviewed by hand), and so are paddock-proc's test child (a
      # re-executed test binary that its parent ends with SIGKILL, so its coverage data is never written) and paddock-ipc's (the same); paddock-ipc's endpoint/{unix,windows}.rs are
      # its native glue (OS error paths; the portable surface in endpoint/mod.rs is covered). paddock-chromium's fake browser
      # runs in re-executed test binaries that are often ended by force (no coverage data), like paddock-proc's test child.
      # paddock-dialogs' `probe.rs` (feature `probe`) is the ADR 0026 section 6 real-window harness: it opens real webview windows and
      # runs only where there is a window system (PADDOCK_REAL_WINDOWS=1: the `dialog-window-probe` job), so no ordinary test reaches it.
      # The gate (scripts/coverage-gate.mjs) leaves out only the `#[tauri::command]` attribute lines: llvm-cov charges every
      # region of the macro's generated wrapper to that line, which no test can all reach.
      # This is also Linux's all-features test run (the crate leg skips its own on Linux): the real-browser tests of
      # paddock-chromium must find the image's Chrome for Testing instead of skipping.
      # Coverage runs only in the nightly (`os_full`), a release's gates and a tag (user decision 2026-11-26, ADR 0116 D4 amended): a train, a
      # branch and a push to main run plain nextest in the `crate` job's Linux leg, so those tests are cacheable. The same three
      # conditions are `plan_ci::coverage_run`; conformance/test/coverage-placement.test.mjs keeps them equal.
      - name: Coverage (>= 90 % lines; 99 % security target report-only)
        if: ${{ (inputs.os_full == true || inputs.os_full == 'true' || github.event.inputs.os_full == 'true' || inputs.release == true || startsWith(github.ref, 'refs/tags/')) }}
        env:
          PADDOCK_REQUIRE_TEST_BROWSER: "1"
        run: ./dev ci run crates coverage
      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        if: failure()
        with:
          name: crates-lcov
          path: crates/lcov.info
          if-no-files-found: ignore
      # The container runs as root and the orphan guardian is off for root: run its acting tests as an unprivileged user
      # (ADR 0076 amendment 2026-11-09; ./dev ci guardian-as-user prints one ::error:: per failure; the shell stays behind conformance/ci/kit.sh for tag runs).
      - name: Orphan guardian as a user (Linux)
        if: ${{ !cancelled() && env.PADDOCK_JOB_ABORTED != '1' && runner.os == 'Linux' }}
        working-directory: crates
        run: bash ../conformance/ci/kit.sh host guardian-as-user
      # Runs after a failed test step too (a FLAKY test of the coverage run): a test-only failure is graded, so the checks after it
      # must have run (run 9001 skipped deny; tests/it/tree.rs checks every TEST_STEPS job keeps this guard).
      - name: Dependency policy (cargo deny)
        if: ${{ !cancelled() && env.PADDOCK_JOB_ABORTED != '1' }}
        run: ./dev ci run crates deny
      - uses: ./.gitea/actions/sccache-stats
        if: always()

  # Every crate on Linux, Windows and macOS (platform-only bugs exist: lessons): clippy and tests with every feature, so the
  # `tauri` adapters are built too, the feature-off runs and the doc tests, as a few workspace-wide steps. On Linux the
  # all-features test run is the coverage job's (crates) only in the nightly, a release and a tag; otherwise this leg runs it plainly.
  crate:
    # The Linux tests run as parallel jobs of whole packages when coverage does not run (`matrix.part_label`: `, 2/3`; the plan's
    # `plan_ci::partition_linux_legs`); every other leg has an empty label.
    name: crate (${{ matrix.os }}${{ matrix.part_label }})
    needs: [plan]
    if: ${{ needs.plan.outputs.crates == 'true' && contains(fromJSON(needs.plan.outputs.rerun_jobs || '["crate"]'), 'crate') }}
    strategy:
      fail-fast: false
      matrix:
        # Every OS; a rerun of a run's failures (since_run) only the failed legs, each with the filter of its failed tests.
        include: ${{ fromJSON(needs.plan.outputs.crate_legs) }}
    runs-on: ${{ matrix.os }}
    # Linux runs in the paddock-ci image (Rust, Tauri's libraries, Node, Playwright, Chrome for Testing, cargo-nextest baked in); Windows and
    # macOS run on the host.
    container: ${{ matrix.os == 'ubuntu-latest' && 'dev.decryptology.net/decryp7/paddock-ci:v3' || '' }}
    defaults:
      run:
        working-directory: crates
        shell: bash
    env:
      # A run for a tag builds the tool from source (ADR 0022: release and tag jobs bypass every cache); other runs may download it.
      PADDOCK_DEV_DOWNLOAD: ${{ (inputs.release == true || startsWith(github.ref, 'refs/tags/')) && '0' || '' }}
      # Read credential for ./dev's prebuilt download (ADR 0022 R0b), only in the jobs that run ./dev (job-isolation).
      PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
      CARGO_TERM_COLOR: always
      # Root in the Linux container: Chromium needs the opt-in to start without its sandbox (ignored when not root).
      PADDOCK_BROWSER_NO_SANDBOX: "1"
    steps:
      # Linux: the whole tree in the container. Hosts: only the bootstrap folders (the actions, their scripts, paddock-dev's inputs)
      # as a partial clone; the kept-clone step below brings the slot's own clone to this commit (conformance/ci/checkout-profiles.txt).
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
        if: runner.os == 'Linux'

      - uses: actions/checkout@v4
        if: runner.os != 'Linux'
        with:
          persist-credentials: false
          sparse-checkout: |
            .cargo
            .gitea
            conformance
            scripts
            tools
            crates
          filter: blob:none

      # Host-mode Windows runner: Git's bash on PATH (`shell: bash` needs it).
      - name: Git bash on PATH (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: .
        run: |
          if not exist "%ProgramFiles%\Git\bin\bash.exe" (echo Git for Windows is not installed on this runner & exit /b 1)
          echo %ProgramFiles%\Git\bin>>"%GITHUB_PATH%"

      # CARGO_BUILD_JOBS: this runner's share of the host's cores (before job-isolation, which builds paddock-dev).
      - uses: ./.gitea/actions/build-jobs

      # A slot of the host (job isolation; after Git bash on Windows): the job's kept folders end in its slot and its temp
      # folders are the runner's per-job folder, so concurrent jobs on one host never share either.
      - uses: ./.gitea/actions/job-isolation

      # The test browser outside the checkout, the slot's kept folder (the installer stamps the
      # pinned version in it).
      - name: Test browser folder (macOS, Windows)
        if: runner.os != 'Linux'
        working-directory: .
        run: |
          dir="$(bash conformance/ci/kit.sh isolation path browser paddock)"
          if command -v cygpath >/dev/null; then dir="$(cygpath -w "$dir")"; fi
          echo "PADDOCK_TEST_BROWSER_DIR=$dir" >> "$GITHUB_ENV"

      # Host runners check out into a per-job hashed folder; sccache keys a compile on its folder, so the workspace crates miss
      # on every run. Build from the same physical path every time: PADDOCK_WORKSPACE, the steps' working-directory, is the slot's
      # kept clone at this commit (kept-clone: a fetch of what changed, a clean tree, no screenshots; macOS: the work folder is
      # a link to it; Windows, where act keeps the work folder open: the work folder stays the bootstrap, so every read of the
      # tree goes through PADDOCK_WORKSPACE). On Windows the step comes after the one that puts Git's bash on PATH (before it,
      # `shell: bash` finds WSL's bash.exe).
      - uses: ./.gitea/actions/kept-clone
        if: runner.os != 'Linux'
        with:
          name: paddock-checkout-${{ runner.os }}
          profile: lean

      # A build folder that outlives the job on the hosts (the work folder does not: it is hashed per job), crates/target in
      # the container, as cargo configuration (crates/.cargo/ci.toml, included by crates/.cargo/config.toml), never
      # CARGO_TARGET_DIR: sccache puts every CARGO_* variable into its cache key (the shared build-folder action).
      - uses: ./.gitea/actions/build-folder
        with:
          workspace: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/crates
          name: paddock-${{ github.job }}

      # Toolchain and sccache on every OS: sccache's local disk cache (host runners: the job slot's kept folder sccache-s<n>,
      # containers: the lane's own folder sccache-<lane> on the /sccache mount, never the mount itself; ADR 0111).
      - uses: ./.gitea/actions/setup-rust
        with:
          components: clippy
          sccache-s3-access-key-id: ${{ secrets.PADDOCK_SCCACHE_S3_ACCESS_KEY_ID }}
          sccache-s3-secret-access-key: ${{ secrets.PADDOCK_SCCACHE_S3_SECRET_ACCESS_KEY }}

      - name: Toolchain present
        run: |
          rustc --version && cargo --version
          cargo clippy --version || { echo "::error::clippy is missing on this runner (rustup component add clippy)"; exit 1; }

      # The pinned cargo-nextest: the image's on Linux, a copy in the hosts' shared kept folder tools (downloaded once
      # per version); the step fails when the runner has another version.
      - uses: ./.gitea/actions/host-tools

      # Whole-workspace steps: one build per feature set instead of one per crate (each `-p X --all-features` resolved its own
      # features and rebuilt the shared dependencies). Every step runs even after another failed; nextest and clippy name
      # the crate of every failure. scripts/publish.test.mjs and conformance C37 fail when a workspace member is left out.
      # A leg with a filter (a rerun of failed tests) runs only the test steps below: its other steps passed in the earlier run.
      # Once per OS: the partitions of the Linux tests (`matrix.part_extra` is "false" on all but the first) do not repeat it.
      - name: Clippy (workspace, every feature)
        if: ${{ !cancelled() && env.PADDOCK_JOB_ABORTED != '1' && !matrix.filter && matrix.part_extra != 'false' }}
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/crates
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # The build chromium.toml pins, on the host runners (the Linux image has it): checked against its SHA-256 and kept in a
      # folder that outlives the job, so it is downloaded once per pin. Sets CHROMIUM_TEST_PATH.
      - name: Chrome for Testing (macOS, Windows)
        if: ${{ !cancelled() && env.PADDOCK_JOB_ABORTED != '1' && runner.os != 'Linux' }}
        uses: ./.gitea/actions/install-test-browser
        with:
          catalogue: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/crates/paddock-chromium/src/chromium.toml
          env-prefix: PADDOCK
          dir: ${{ env.PADDOCK_TEST_BROWSER_DIR }}

      # Every crate's tests with every feature, so the `tauri` adapters are built and tested too (the dialogs and panels on the
      # mock runtime, paddock-chromium against its fake browser and against Chrome for Testing: CHROMIUM_TEST_PATH, never an
      # installed browser, rule 7; a missing browser fails instead of skipping). On Linux the coverage job (crates) runs
      # exactly this run under llvm-cov in the nightly, a release and a tag, so this leg does not run it twice there; every other run
      # (a train, a branch, a push to main) runs it here, plainly and cacheable.
      - name: Tests (workspace, every feature)
        if: ${{ !cancelled() && env.PADDOCK_JOB_ABORTED != '1' && (runner.os != 'Linux' || !(inputs.os_full == true || inputs.os_full == 'true' || github.event.inputs.os_full == 'true' || inputs.release == true || startsWith(github.ref, 'refs/tags/'))) }}
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/crates
        env:
          PADDOCK_REQUIRE_TEST_BROWSER: "1"
          # Chrome's verbose log of each real-browser test on Windows, kept below when the job fails (ADR 0030: why the
          # network service went away is only in there).
          PADDOCK_TEST_BROWSER_LOG: ${{ runner.os == 'Windows' && format('{0}/chrome-logs', runner.temp) || '' }}
          FILTER: ${{ matrix.filter }}
          # OS-scoped tests (paddock.ci.json `hostTests`, ./dev plan --ci): the packages and the filterset this host leg tests. The filterset
          # also holds a member run's reached packages, so one value carries both.
          TEST_PACKAGES: ${{ matrix.test_packages }}
          TEST_FILTER: ${{ matrix.test_filter }}
          TEST_SKIP: ${{ matrix.test_skip }}
          # The packages whose pass of the same key the test cache reuses (ADR 0116, `./dev plan --ci`): a filterset that leaves them out;
          # empty while the switch is off. A leg with a filter of its own (hostTests) ANDs it with that filter: its pass was recorded under the same filter.
          TEST_CACHE_EXCLUDE: ${{ matrix.test_cache_exclude }}
          # A failed-only round (since_run): each failed test of FILTER must still select a test (./dev ci rerun-check), never a warning.
          RERUN: ${{ github.event.inputs.since_run }}
        run: |
          # A member run that reaches none of the host packages has nothing to test on this host (the plan says so, never an empty list).
          if [ -z "$FILTER" ] && [ "$TEST_SKIP" = true ]; then echo "::notice::this member run reaches no package with OS-specific code: nothing to test on this runner (hostTests)"; exit 0; fi
          filter=(); sel=(--workspace)
          if [ -n "$FILTER" ] && [ -n "$RERUN" ]; then
            cargo nextest list "${sel[@]}" --all-features -E "$FILTER" --message-format json > "$RUNNER_TEMP/rerun-listed.json" || { echo "::error::rerun-check: cargo nextest list failed. Next: read the build error above"; exit 1; }
            "${PADDOCK_WORKSPACE:-$GITHUB_WORKSPACE}/dev" ci rerun-check --filter "$FILTER" --listed "$RUNNER_TEMP/rerun-listed.json" || exit 1
          fi
          if [ -n "$FILTER" ]; then echo "::notice::nextest runs only the selected tests (a rerun's failed tests, or the plan's smoke set or affected targets): $FILTER"; filter=(-E "$FILTER" --no-tests=warn)
          else
            if [ -n "$TEST_PACKAGES" ]; then echo "::notice::nextest tests only the packages with OS-specific code on this runner (hostTests): $TEST_PACKAGES"; sel=(); for p in $TEST_PACKAGES; do sel+=(-p "$p"); done; fi
            if [ -n "$TEST_FILTER" ]; then echo "::notice::nextest filter (hostTests, and the packages this change reaches in a member run): $TEST_FILTER"; filter=(-E "$TEST_FILTER" --no-tests=fail); fi
          fi
          # The output is kept for the test-cache record step below (ADR 0116, report-only); pipefail keeps nextest's exit code.
          set -o pipefail
          if [ -n "$TEST_CACHE_EXCLUDE" ] && [ -z "$FILTER" ]; then
            echo "::notice::test-cache: nextest leaves out the packages with a reusable pass of the same key (and filter): $TEST_CACHE_EXCLUDE"
            if [ -n "$TEST_FILTER" ]; then filter=(-E "($TEST_FILTER) & ($TEST_CACHE_EXCLUDE)" --no-tests=warn); else filter=(-E "$TEST_CACHE_EXCLUDE" --no-tests=warn); fi
          fi
          cargo nextest run "${sel[@]}" --all-features --profile ci ${filter[@]+"${filter[@]}"} 2>&1 | tee "$RUNNER_TEMP/nextest-crates.log"

      # ADR 0116, report-only (ER-41): stores the pass of every package this run proved (whole, first try, no flake) in the shared test-result
      # store, keyed by the leg's `test_filter` (a host leg's pass counts only for a later leg with the same filter; user decision 97). Only a main or train run writes (`./dev ci test-cache record` refuses any other ref and any rerun itself). Never fails the job.
      - name: Record test results (test cache)
        if: ${{ !cancelled() && env.PADDOCK_JOB_ABORTED != '1' && (runner.os != 'Linux' || !(inputs.os_full == true || inputs.os_full == 'true' || github.event.inputs.os_full == 'true' || inputs.release == true || startsWith(github.ref, 'refs/tags/'))) && !matrix.filter && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/train/')) }}
        continue-on-error: true
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/crates
        env:
          PLAN_TOKEN: ${{ github.token }}
          LEG_FILTER: ${{ matrix.test_filter }}
          # The job's display name (the `name:` of this job) and the run's attempt: the reader trusts a record by its own job's result.
          PADDOCK_JOB_NAME: crate (${{ matrix.os }}${{ matrix.part_label }})
          PADDOCK_RUN_ATTEMPT: ${{ github.run_attempt }}
          PADDOCK_TEST_CACHE_KEY_ID: ${{ secrets.PADDOCK_TEST_CACHE_KEY_ID }}
          PADDOCK_TEST_CACHE_SECRET: ${{ secrets.PADDOCK_TEST_CACHE_SECRET }}
          PADDOCK_SCCACHE_S3_ENDPOINT: ${{ vars.PADDOCK_SCCACHE_S3_ENDPOINT }}
        run: |
          [ -s "$RUNNER_TEMP/nextest-crates.log" ] || { echo "::notice::test-cache: no nextest output to record"; exit 0; }
          "${PADDOCK_WORKSPACE:-$GITHUB_WORKSPACE}/dev" ci test-cache record --workspace crates --shared --filter "$LEG_FILTER" --log "$RUNNER_TEMP/nextest-crates.log"

      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        if: failure() && runner.os == 'Windows'
        with:
          name: chrome-logs-${{ runner.os }}
          path: ${{ runner.temp }}/chrome-logs
          if-no-files-found: ignore

      # The crates whose code changes with an optional feature off (cfg(not(feature)) paths, a default feature that can be
      # turned off) also run without it. Cargo unifies features across the packages of one run, so a crate that another
      # selected crate depends on with a feature on gets its own run: paddock-shell turns on paddock-diag's, paddock-download's
      # and paddock-updater's `tauri`, and paddock-updater turns on paddock-download's default `http`.
      - name: Tests with the optional features off
        if: ${{ !cancelled() && env.PADDOCK_JOB_ABORTED != '1' && !matrix.filter && matrix.part_extra != 'false' }}
        working-directory: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/crates
        run: |
          cargo nextest run -p paddock-shell -p paddock-secrets -p paddock-siblings --profile ci
          cargo nextest run -p paddock-diag -p paddock-updater --profile ci
          cargo nextest run -p paddock-download --no-default-features --profile ci
          # paddock-repo-graph's git and cargo adapters sit behind features that only paddock-dev (its own workspace) turns on;
          # its default build, without them, is the one Pacenotes uses.
          cargo nextest run -p paddock-repo-graph --profile ci

      - uses: ./.gitea/actions/sccache-stats
        if: always()

      - uses: ./.gitea/actions/job-isolation
        if: always()
        with:
          mode: release

  # One leg per affected app and operating system (ADR 0014 §6): the app's CI contract (apps/<app>/paddock.ci.json) through
  # the shared app-gates action, only the halves the change reaches (rust, ui). Linux (the paddock-ci image) carries the
  # whole contract: prepare, checks, the Rust gates and the UI. An app that lists Windows or macOS in `os` also gets a host
  # leg per OS with the Rust gates only, for the code that differs there (services, launch agents, Keychain). The shell demo
  # (plan S18) and the workbench demo (X50 W8) are the first legs: their UI is ui/projects/<app> (tested by the ui and e2e
  # jobs), built here because Tauri embeds it (tauri.conf.json frontendDist). A change to a shell crate or to the UI that
  # breaks an app fails here before a tag. Installers come from <app>-release.yml (an `<app>-v*` tag or a manual run).
  # Host legs: the same physical checkout path and a kept build folder every run (kept-clone, build-folder), the pinned
  # cargo-nextest (host-tools), nothing left behind (host-cleanup).
  app:
    name: app ${{ matrix.app }} (${{ matrix.os }}${{ matrix.e2e_leg != '' && format(', {0}', matrix.e2e_leg) || '' }})
    needs: [plan]
    if: ${{ needs.plan.outputs.any_app == 'true' && contains(fromJSON(needs.plan.outputs.rerun_jobs || '["app"]'), 'app') }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.os == 'ubuntu-latest' && 'dev.decryptology.net/decryp7/paddock-ci:v3' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.apps) }}
    env:
      # The graph's selection of this job's project (ADR 0117 §5): `./dev ci run` skips a phase it does not keep and gives a test
      # runner only the affected files (tools/paddock-dev/src/ci_run/select.rs). Empty: every phase, every file.
      PADDOCK_PLAN_SELECTION: ${{ needs.plan.outputs.selection }}
      # A run for a tag builds the tool from source (ADR 0022: release and tag jobs bypass every cache); other runs may download it.
      PADDOCK_DEV_DOWNLOAD: ${{ (inputs.release == true || startsWith(github.ref, 'refs/tags/')) && '0' || '' }}
      # Read credential for ./dev's prebuilt download (ADR 0022 R0b), only in the jobs that run ./dev (job-isolation).
      PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
      CARGO_TERM_COLOR: always
    steps:
      # Linux: the whole tree in the container. Hosts: only the bootstrap folders (the actions, their scripts, paddock-dev's inputs)
      # as a partial clone; the kept-clone step below brings the slot's own clone to this commit (conformance/ci/checkout-profiles.txt).
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
        if: runner.os == 'Linux'

      - uses: actions/checkout@v4
        if: runner.os != 'Linux'
        with:
          persist-credentials: false
          sparse-checkout: |
            .cargo
            .gitea
            conformance
            scripts
            tools
            crates
          filter: blob:none

      # Host-mode Windows runner: Git's bash on PATH (`shell: bash` needs it).
      - name: Git bash on PATH (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if not exist "%ProgramFiles%\Git\bin\bash.exe" (echo Git for Windows is not installed on this runner & exit /b 1)
          echo %ProgramFiles%\Git\bin>>"%GITHUB_PATH%"

      # CARGO_BUILD_JOBS: this runner's share of the host's cores (before job-isolation, which builds paddock-dev).
      - uses: ./.gitea/actions/build-jobs

      # A slot of the host (job isolation; after Git bash on Windows), before every kept folder.
      - uses: ./.gitea/actions/job-isolation

      - uses: ./.gitea/actions/kept-clone
        if: runner.os != 'Linux'
        with:
          name: paddock-checkout-${{ runner.os }}
          profile: lean

      # The workspace's .cargo/config.toml must include ci.toml (build-folder checks it): required of an app with host legs.
      - uses: ./.gitea/actions/build-folder
        if: runner.os != 'Linux'
        with:
          workspace: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/${{ matrix.cargo }}
          name: ${{ matrix.app }}-${{ github.job }}

      - uses: ./.gitea/actions/setup-rust
        with:
          components: clippy rustfmt
          sccache-s3-access-key-id: ${{ secrets.PADDOCK_SCCACHE_S3_ACCESS_KEY_ID }}
          sccache-s3-secret-access-key: ${{ secrets.PADDOCK_SCCACHE_S3_SECRET_ACCESS_KEY }}

      - uses: ./.gitea/actions/host-tools
        if: runner.os != 'Linux'

      # An app whose tests drive a real browser (paddock.ci.json `testBrowser`): the pinned Chrome for Testing, never an installed
      # one (rule 7). The image has it on Linux; on a host it is the app's kept folder of the job slot (test-browser-<app>-<slot>).
      - name: Test browser folder (macOS, Windows)
        if: runner.os != 'Linux' && matrix.test_browser_prefix != ''
        shell: bash
        env:
          APP: ${{ matrix.app }}
        run: |
          dir="$(bash conformance/ci/kit.sh isolation path browser "$APP")"
          if command -v cygpath >/dev/null; then dir="$(cygpath -w "$dir")"; fi
          echo "PADDOCK_TEST_BROWSER_DIR=$dir" >> "$GITHUB_ENV"

      - name: Chrome for Testing (macOS, Windows)
        if: runner.os != 'Linux' && matrix.test_browser_prefix != ''
        uses: ./.gitea/actions/install-test-browser
        with:
          catalogue: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/${{ matrix.test_browser_catalogue }}
          env-prefix: ${{ matrix.test_browser_prefix }}
          dir: ${{ env.PADDOCK_TEST_BROWSER_DIR }}

      # Points the app's tests at that browser; a missing one fails the run instead of skipping the tests. The Linux container
      # runs as root, where Chrome refuses to start with its sandbox: tests only (`noSandboxOnLinux`).
      - name: The tests' browser
        if: matrix.test_browser_prefix != ''
        shell: bash
        env:
          PREFIX: ${{ matrix.test_browser_prefix }}
          NO_SANDBOX: ${{ matrix.test_browser_no_sandbox }}
        run: |
          if [ -z "${CHROMIUM_TEST_PATH:-}" ]; then echo "::error::no Chrome for Testing (CHROMIUM_TEST_PATH is empty)"; exit 1; fi
          {
            echo "${PREFIX}_TEST_BROWSER=$CHROMIUM_TEST_PATH"
            echo "${PREFIX}_REQUIRE_TEST_BROWSER=1"
            if [ "$NO_SANDBOX" = true ]; then echo "${PREFIX}_TEST_BROWSER_NO_SANDBOX=1"; fi
          } >> "$GITHUB_ENV"

      - uses: ./.gitea/actions/node-caches
        if: runner.os == 'Linux'
        with:
          angular-dir: ${{ matrix.angular_dir || 'ui' }}
          name: app-${{ matrix.app }}${{ matrix.e2e_leg != '' && format('-{0}', matrix.e2e_leg) || '' }}

      - name: Install
        if: runner.os == 'Linux'
        run: npm ci

      - uses: ./.gitea/actions/app-gates
        with:
          app: ${{ matrix.app }}
          cargo: ${{ matrix.cargo }}
          nextest-config: ${{ matrix.nextest_config }}
          prepare: ${{ matrix.prepare }}
          checks: ${{ matrix.checks }}
          rust-checks: ${{ matrix.rust_checks }}
          host-rust-checks: ${{ matrix.host_rust_checks }}
          host-packages: ${{ matrix.host_packages }}
          host-filter: ${{ matrix.host_filter }}
          ui-checks: ${{ matrix.ui_checks }}
          rust: ${{ matrix.rust }}
          ui: ${{ matrix.ui }}
          last-packages: ${{ matrix.last_packages }}
          windows-clippy: ${{ matrix.windows_clippy }}
          notices: ${{ matrix.notices }}
          filter: ${{ matrix.filter }}
          tests-only: ${{ matrix.tests_only }}
          graph-filter: ${{ matrix.graph_filter }}
          display: ${{ matrix.display }}
          e2e-checks: ${{ matrix.e2e_checks }}
          e2e-shard: ${{ matrix.e2e_shard }}

      # The failure report of the app's browser tests (paddock.ci.json `e2eArtifacts`, a folder from the repo root); Gitea has the v3 artifact actions.
      - uses: actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        if: failure() && matrix.e2e_artifacts != ''
        with:
          name: ${{ matrix.app }}-${{ matrix.e2e_leg || 'ui' }}-results-${{ strategy.job-index }}
          path: ${{ env.PADDOCK_WORKSPACE || github.workspace }}/${{ matrix.e2e_artifacts }}
          if-no-files-found: ignore

      # Nothing of this job may stay behind on a host: no fake runners or test programs of the app's tests (paddock.ci.json
      # `processPatterns`, each anchored on a folder of this job), no temp folders of its tests.
      - uses: ./.gitea/actions/host-cleanup
        if: always() && runner.os != 'Linux'
        with:
          app-id: ${{ matrix.app }}
          process-patterns: ${{ matrix.process_patterns }}
          temp-prefix: ${{ matrix.app }}-it-

      # The kept build folder stays within its cap (this job's own folder only, after the builds).
      - uses: ./.gitea/actions/prune-build-folder
        if: always() && runner.os != 'Linux'

      - uses: ./.gitea/actions/sccache-stats
        if: always()

      # The slot goes back last: the clean-up, the prune and the sccache server's stop all act on this slot's folders and port.
      - uses: ./.gitea/actions/job-isolation
        if: always()
        with:
          mode: release

  # Secret scan (.gitea/actions/gitleaks): the tree and the commits this branch adds on top of origin/main. It runs on every change,
  # whatever the plan reaches, because a secret is a leak wherever it is; .gitleaks.toml lists the known fixtures, one entry each.
  gitleaks:
    name: gitleaks (secret scan)
    needs: [plan]
    if: ${{ contains(fromJSON(needs.plan.outputs.rerun_jobs || '["gitleaks"]'), 'gitleaks') }}
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The history scan reads origin/main..HEAD.
          fetch-depth: 0
      - uses: ./.gitea/actions/gitleaks

  # The short Linux checks in one job (user, 2026-11-25): each took under 2 minutes as a job of its own (C99 0.7-0.9, the heavy tool
  # 0.6-1.2, audit 0.9; runs 8226 and 9021), mostly container start, checkout and setup, and each held a Linux lane. The secret scan
  # stays a job of its own that no plan output can switch off (scripts/gitleaks-config.test.mjs).
  # Each check is a step that runs when its own job ran before, and a failed check does not skip the next (`!cancelled()`). Last in
  # the file, so it starts after the long jobs (see paddock-dev's comment).
  #  - Conformance C99 (ADR 0057 §3, rule 72): no shipped process uses the macOS Keychain. Planned on its own inputs (every Cargo.toml
  #    and Cargo.lock under apps/ and crates/, the scanned sources, capabilities, paddock.ci.json, the check's code;
  #    tools/paddock-dev/src/plan.rs C99_INPUT), because it needs cargo and the registry (`cargo fetch`, `cargo tree` for both Apple
  #    triples) and the conformance job does not. Every release path runs the same action, scoped to its app.
  #  - Dependency audits judged against main (docs/ci-schedules.md "Dependency audits"): an advisory that appeared outside the change
  #    (RUSTSEC-2026-0543 run 8214, GHSA-fc5q-39xc-vjpf run 8225) is a warning here, decided on main by the nightly `audit` job; only
  #    an advisory this change adds fails. `./dev audit compare` audits the merge base's lockfiles with the same tools (no list is kept,
  #    ER-46). Report-only until the repository variable PADDOCK_AUDIT_ENFORCE is 1 (ER-41: set after its first green run, recorded in
  #    docs/ci-schedules.md); the plain audit steps of the other jobs stay blocking until then. It runs on every event, as its job did.
  #  - The heavy tool (tools/throttle): the machine-wide heavy-step lock. Its own Cargo workspace, when the plan marks `tools`; a Linux
  #    container, so no build-folder action (the build folder is tools/throttle/target in the container, git-ignored).
  quick:
    name: quick checks (C99, audit, heavy tool)
    needs: [plan]
    if: ${{ !cancelled() && contains(fromJSON(needs.plan.outputs.rerun_jobs || '["quick"]'), 'quick') }}
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v3
    defaults:
      run:
        shell: bash
    env:
      # setup-rust runs ./dev (docs/plans/ci-in-rust.md): the read credential, and a tag or release run builds the tool from source.
      PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
      PADDOCK_DEV_DOWNLOAD: ${{ (inputs.release == true || startsWith(github.ref, 'refs/tags/')) && '0' || '' }}
      # The merge base's reference: the dispatch's `base` (the commit of main a train is built on), else origin/main (as the conformance job).
      PADDOCK_BASE_REF: ${{ inputs.base || 'origin/main' }}
      PADDOCK_AUDIT_ENFORCE: ${{ vars.PADDOCK_AUDIT_ENFORCE }}
      CARGO_TERM_COLOR: always
    steps:
      # The whole history: the audit's merge base can be any older commit.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      # Set up first and unconditionally, so a failed check never leaves the steps after it without their toolchain.
      - uses: ./.gitea/actions/build-jobs

      - uses: ./.gitea/actions/setup-rust
        with:
          components: clippy,rustfmt
          sccache-s3-access-key-id: ${{ secrets.PADDOCK_SCCACHE_S3_ACCESS_KEY_ID }}
          sccache-s3-secret-access-key: ${{ secrets.PADDOCK_SCCACHE_S3_SECRET_ACCESS_KEY }}

      # The keychain action clears RUSTC_WRAPPER for its own cargo calls (no compile cache), as in its own job.
      - uses: ./.gitea/actions/keychain
        if: ${{ !cancelled() && env.PADDOCK_JOB_ABORTED != '1' && needs.plan.outputs.c99 == 'true' }}

      - name: Audit against the merge base
        if: ${{ !cancelled() && env.PADDOCK_JOB_ABORTED != '1' }}
        run: |
          enforce=()
          if [ "${PADDOCK_AUDIT_ENFORCE:-}" = "1" ]; then enforce=(--enforce); fi
          ./dev audit compare --base "$PADDOCK_BASE_REF" ${enforce[@]+"${enforce[@]}"}

      - name: heavy tool, lockfile is current
        if: ${{ !cancelled() && env.PADDOCK_JOB_ABORTED != '1' && needs.plan.outputs.tools == 'true' }}
        working-directory: tools/throttle
        run: |
          cargo metadata --locked --format-version 1 > /dev/null || {
            echo "::error::tools/throttle/Cargo.lock is stale, run cargo update -w in tools/throttle and commit it"; exit 1; }

      - name: heavy tool, format
        if: ${{ !cancelled() && env.PADDOCK_JOB_ABORTED != '1' && needs.plan.outputs.tools == 'true' }}
        working-directory: tools/throttle
        run: cargo fmt --check

      - name: heavy tool, clippy
        if: ${{ !cancelled() && env.PADDOCK_JOB_ABORTED != '1' && needs.plan.outputs.tools == 'true' }}
        working-directory: tools/throttle
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: heavy tool, tests
        if: ${{ !cancelled() && env.PADDOCK_JOB_ABORTED != '1' && needs.plan.outputs.tools == 'true' }}
        working-directory: tools/throttle
        run: cargo nextest run --profile ci --locked --no-fail-fast

      - name: heavy tool, deny
        if: ${{ !cancelled() && env.PADDOCK_JOB_ABORTED != '1' && needs.plan.outputs.tools == 'true' }}
        working-directory: tools/throttle
        run: cargo deny check

      # The tool builds with a plain Rust toolchain: no GTK -sys crate may reach it through the shared crates (the workspace
      # hack once pulled gtk-sys into paddock-proc on x86_64 Linux, so `cargo install` of heavy needed GTK headers). The
      # check reads the dependency graph for the Linux target, so it holds on an image that happens to have GTK installed.
      - name: heavy tool, no GTK in its Linux build
        if: ${{ !cancelled() && env.PADDOCK_JOB_ABORTED != '1' && needs.plan.outputs.tools == 'true' }}
        working-directory: .
        run: |
          # bash -e -o pipefail: every command that may legitimately fail is handled by hand. grep exits 1 when it finds nothing,
          # which is the success case here.
          rc=0
          for tool in throttle; do
            tree=$(cd "tools/$tool" && cargo tree --locked --target x86_64-unknown-linux-gnu -e normal,build --prefix none) || {
              echo "::error::cargo tree failed for tools/$tool (see the lines above). Run it in tools/$tool with the same arguments."
              rc=1; continue; }
            # ER-33: the probe must be able to see the thing. The tool links paddock-proc, where the hack's GTK crates arrived.
            echo "$tree" | grep -q '^paddock-proc ' || {
              echo "::error::check broken: the dependency graph of tools/$tool has no paddock-proc, so a GTK crate there would not be seen."
              rc=1; continue; }
            hits=$(echo "$tree" | grep -E '^(gtk|gdk|gio|glib|gobject|pango|cairo|atk|gdk-pixbuf|soup|webkit2gtk|javascriptcore-rs)[a-z0-9-]*-(sys|sys-rs) ' | sort -u || true)
            if [ -n "$hits" ]; then
              echo "::error::tools/$tool depends on GTK -sys crates on x86_64 Linux: $(echo "$hits" | tr '\n' ' '). Add them to crates/.config/hakari.toml traversal-excludes, run cargo hakari generate and refresh the lockfiles."
              rc=1
            else
              echo "tools/$tool: no GTK -sys crate in the x86_64 Linux graph"
            fi
          done
          exit "$rc"

      - uses: ./.gitea/actions/sccache-stats
        if: always()
