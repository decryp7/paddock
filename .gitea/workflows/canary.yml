# The nightly consumer canary (ADR 0012 §8): builds each app's `main` against this repo's `main` as the candidate
# release, so a breaking change shows up before a tag, not in an app's Renovate PR. The candidate is packed here
# (`npm pack` of @decryp7/paddock-ui and @decryp7/paddock-e2e) and laid over the app's registry versions (npm: installed
# from the tarballs; Cargo: `[patch.decryp7]` to this checkout's crates). Then the app's own type-check, lint and unit
# tests run (not its e2e). Nothing is published and no app repository is changed.
#
# An app that does not consume Paddock yet (no `@decryp7/paddock-ui` in its package.json and no `decryp7` registry crate
# in its Cargo.toml) is skipped with a notice, so the list can name the apps that will adopt the shell before they do.

name: canary

on:
  schedule:
    - cron: "23 14 * * *" # 22:23 UTC+8
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # A scheduled run ends early while a train's dispatch run is in CI (./dev ci schedule-skip; ADR 0093 amendment 2026-11-12).
  # Only scheduled runs have it; the jobs below run when it was skipped (any other event) or said run, never when it failed or was cancelled.
  gate:
    name: gate (no train in CI?)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    defaults:
      run:
        working-directory: .
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: train
        uses: ./.gitea/actions/schedule-skip
        with:
          workflow: canary.yml
          dev-token: ${{ secrets.BUILD_INPUTS_TOKEN }}
      - id: decide
        env:
          SKIP: ${{ steps.train.outputs.skip }}
        run: if [ "$SKIP" = true ]; then echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi

  app:
    name: canary (${{ matrix.app }})
    needs: [gate]
    if: ${{ !cancelled() && needs.gate.result != 'failure' && needs.gate.result != 'cancelled' && needs.gate.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/garage:ubuntu-24.04-20261023-r5
    strategy:
      fail-fast: false
      # One app at a time: scheduled runs leave at least one of the three Linux slots free.
      max-parallel: 1
      matrix:
        # Every app's UI is `app/` and its Rust side `app/src-tauri/` (the family layout).
        app: [pitwall, debrief, pitcrew, spotter, dyno]
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Paddock (the candidate)
        uses: actions/checkout@v4
        with:
          path: paddock

      # CARGO_BUILD_JOBS: this runner's share of the host (`./dev ci build-jobs` through conformance/ci/kit.sh; Linux keeps cargo's default).
      - uses: ./paddock/.gitea/actions/build-jobs

      - name: ${{ matrix.app }} (main)
        uses: actions/checkout@v4
        with:
          repository: decryp7/${{ matrix.app }}
          ref: main
          path: app
          # A read token for the app repositories (the default token reads only this one).
          token: ${{ secrets.CANARY_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Does the app consume Paddock?
        id: uses
        run: |
          ui=false; rust=false
          grep -q '"@decryp7/paddock-ui"' app/app/package.json 2>/dev/null && ui=true
          grep -Eq 'registry *= *"decryp7"' app/app/src-tauri/Cargo.toml 2>/dev/null && rust=true
          echo "ui=$ui" >> "$GITHUB_OUTPUT"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          if [ "$ui$rust" = "falsefalse" ]; then echo "::notice::${{ matrix.app }} does not consume Paddock yet; nothing to check"; fi

      - name: Pack the candidate npm packages
        if: steps.uses.outputs.ui == 'true'
        working-directory: paddock/ui
        run: |
          (cd .. && npm ci)  # the root npm workspace (ADR 0014 §1)
          npm run build
          npm run build:e2e
          mkdir -p ../../candidate
          npm pack ./dist/paddock-ui --pack-destination ../../candidate
          npm pack ./dist/paddock-e2e --pack-destination ../../candidate
          ls -l ../../candidate

      - name: UI against the candidate (type-check, lint, unit tests)
        if: steps.uses.outputs.ui == 'true'
        working-directory: app/app
        run: |
          npm ci
          npm install --no-save ../../candidate/decryp7-paddock-ui-*.tgz
          if grep -q '"@decryp7/paddock-e2e"' package.json; then npm install --no-save ../../candidate/decryp7-paddock-e2e-*.tgz; fi
          npx tsc --noEmit -p tsconfig.app.json
          npm run lint --if-present
          npx ng test --watch=false

      - name: Rust against the candidate (clippy, tests)
        if: steps.uses.outputs.rust == 'true'
        working-directory: app/app/src-tauri
        run: |
          # Every workspace crate of the candidate replaces its registry version (`[patch.decryp7]`).
          patch=()
          for dir in ../../../paddock/crates/paddock-*/; do
            name=$(basename "$dir")
            patch+=(--config "patch.decryp7.${name}.path=\"$(cd "$dir" && pwd)\"")
          done
          cargo "${patch[@]}" clippy --all-targets -- -D warnings
          cargo "${patch[@]}" test
