# Reusable (plan X41): mutation testing of an app's engine crate with cargo-mutants: how many deliberately injected bugs the
# tests catch. Weekly over the whole crate; on pull requests only the mutants in the changed lines (--in-diff). Surviving mutants
# are listed in mutants.out (uploaded); they point at untested behaviour.
#
#   on:
#     schedule: [{ cron: "41 3 * * 0" }]
#     pull_request: { paths: ["crates/my-core/**"] }
#   jobs:
#     plan: ...                                                   # .gitea/actions/plan
#     mutants:
#       needs: [plan]
#       if: needs.plan.outputs.run == 'true'
#       uses: decryp7/paddock/.gitea/workflows/app-mutants.yml@v0.3.0
#       with: { paddock-ref: v0.3.0, package: my-core, path: crates/my-core }

name: app-mutants

on:
  workflow_call:
    inputs:
      paddock-ref:
        description: The Paddock tag whose actions this run uses (the same tag as in `uses:`).
        type: string
        required: true
      package:
        description: The crate to mutate (cargo -p).
        type: string
        required: true
      path:
        description: Its folder, for the pull request diff.
        type: string
        required: true
      jobs:
        description: Parallel mutants on the weekly run (1 or 2 for memory-heavy crates).
        type: string
        default: "2"
      timeout-multiplier:
        type: string
        default: "3"
      image:
        type: string
        default: dev.decryptology.net/decryp7/garage:ubuntu-24.04-20261023-r5

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    name: mutants (${{ inputs.package }})
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: decryp7/paddock
          ref: ${{ inputs.paddock-ref }}
          path: .paddock

      - uses: ./.paddock/.gitea/actions/setup-rust

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-mutants
          key: mutants-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: mutants-${{ runner.os }}-

      - name: Install cargo-mutants
        run: command -v cargo-mutants || cargo install cargo-mutants --locked

      - name: Mutants in the changed lines
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
          PACKAGE: ${{ inputs.package }}
          CRATE_PATH: ${{ inputs.path }}
          MULT: ${{ inputs.timeout-multiplier }}
        run: |
          git diff "origin/$BASE...HEAD" -- "$CRATE_PATH" > pr.diff
          cargo mutants -p "$PACKAGE" --in-diff pr.diff --timeout-multiplier "$MULT" --no-shuffle

      # `jobs` mutants build at once: each gets 1/jobs of the job's share, so the job's rustc count stays its share.
      - uses: ./.paddock/.gitea/actions/build-jobs
        if: github.event_name != 'pull_request'
        with:
          split: ${{ inputs.jobs }}

      - name: Mutants in the whole crate
        if: github.event_name != 'pull_request'
        env:
          PACKAGE: ${{ inputs.package }}
          MULT: ${{ inputs.timeout-multiplier }}
          JOBS: ${{ inputs.jobs }}
        run: cargo mutants -p "$PACKAGE" --timeout-multiplier "$MULT" --jobs "$JOBS"

      - name: Upload results
        if: always()
        uses: ChristopherHX/gitea-upload-artifact@81f940d004763f986ba3582c007fd842dd5cb0d7 # v4
        with:
          name: mutants-out
          path: mutants.out/
          if-no-files-found: ignore
