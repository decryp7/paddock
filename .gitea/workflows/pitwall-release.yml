# Pitwall's installers and release (ADR 0014; moved from decryp7/pitwall's build.yml). The gates are not here: Pitwall is a leg
# of ci.yml (apps/pitwall/paddock.ci.json: Rust on Linux, Windows and macOS, the frontend with the Chromium and WebKit e2e), and its bundles, the macOS seal check,
# the sidecar start and the release are the shared app-release.yml. This file is only the triggers and the app's facts.
#
#   push to main      nothing: the nightly (nightly.yml) builds the installers, so a push does not spend three OS builds
#   a pitwall-v* tag  the gates (ci.yml, only Pitwall's legs, WebKit e2e included), then installers, then the Gitea release with latest.json on
#                     the release and on the moving pitwall-latest release, which installed copies update from
#   nightly           no longer here: nightly.yml builds the installers (installers-pitwall), see the verdict job below
#   manual            installers without a release (the "one CI build with bundles" before a tag, rule 25); `gates: true`
#                     also runs Pitwall's ci.yml legs beside them (not before). Rule 54: a run whose installers job did not run FAILS (verdict job).
#
# Runner labels: ubuntu-latest (the paddock-ci image), windows-latest and macos-latest (host runners; they install nothing
# system-wide and leave no processes or launch agents behind). Secrets: the family's updater key
# (PADDOCK_TAURI_SIGNING_PRIVATE_KEY, PADDOCK_TAURI_SIGNING_PRIVATE_KEY_PASSWORD, PADDOCK_TAURI_UPDATER_PUBKEY), RELEASE_TOKEN
# (a Gitea access token with write:repository) and, once there is a Developer ID, APPLE_SIGNING_IDENTITY.

name: pitwall-release

on:
  push:
    tags: ["pitwall-v*"]
  workflow_dispatch:
    inputs:
      gates:
        description: "Also run Pitwall's gates (ci.yml legs) before the installers"
        type: boolean
        default: false

# A newer push to main supersedes the run still going; a tag has its own ref, so a release is never cancelled by a later push. The group differs from ci.yml's (that
# one is called below and names this workflow too), or the called workflow would cancel its caller.
concurrency:
  group: ${{ github.workflow }}-run-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Runs the rest only when the change reaches Pitwall; a push to main whose commit carries a pitwall-v* tag is covered by
  # the tag run.
  plan:
    name: plan
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    outputs:
      run: ${{ steps.plan.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # affected.mjs for Pitwall, and the skip of a main push whose commit carries a pitwall-v* tag (the tag run is the gate).
      # The nightly builds installers even when main's CI nightly was green.
      - id: plan
        uses: ./.gitea/actions/plan
        with:
          app: pitwall
          tag-pattern: pitwall-v*
          nightly-marker: "false"
          dev-token: ${{ secrets.BUILD_INPUTS_TOKEN }}
          release: "true"

  # A tag is gated by exactly Pitwall's legs of ci.yml (all of them, both halves, on the tagged commit).
  gates:
    name: gates
    needs: [plan]
    if: ${{ needs.plan.outputs.run == 'true' && (startsWith(github.ref, 'refs/tags/pitwall-v') || github.event.inputs.gates == 'true') }}
    uses: ./.gitea/workflows/ci.yml
    with:
      app: pitwall
      release: true
      # A manual run with gates is the "one CI build with bundles" before a tag: WebKit included.
      webkit: ${{ github.event_name == 'workflow_dispatch' }}
    secrets:
      BUILD_INPUTS_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}

  # Installers for a manual run: they need only the plan, never `gates`.
  # Gitea 28.2 skips a reusable-workflow job whose need was skipped, whatever its `if` says (125 of 133 green release runs
  # built nothing), so a job that waits on the optional `gates` job can not be the one that builds on a push or a dispatch.
  # A manual run with `gates: true` runs the gates beside the installers; both must be green for the run to be.
  installers:
    name: installers
    needs: [plan]
    if: ${{ needs.plan.outputs.run == 'true' && !startsWith(github.ref, 'refs/tags/') }}
    uses: ./.gitea/workflows/app-release.yml
    with:
      paddock-ref: ${{ github.sha }}
      app-id: pitwall
      app-name: Pitwall
      app-dir: apps/pitwall/app
      cargo-dir: apps/pitwall
      tag-prefix: pitwall-
      latest-tag: pitwall-latest
      notes-extra: "**Existing installs:** download this version once by hand. Pitwall now updates from the Paddock releases, which a copy installed before this version does not look at."
      # Pitwall's UI imports the shared library from ui/dist, which the app build (Tauri's beforeBuildCommand) needs.
      prepare: npm run build -w ui
      cliff-config: apps/pitwall/cliff.toml
      # The notes list Pitwall's own commits plus the shared crates and UI it builds on.
      cliff-paths: |
        apps/pitwall/**
        crates/paddock-service/**
        crates/paddock-jobs/**
        crates/paddock-proc/**
        crates/paddock-setup/**
        crates/paddock-updater/**
        ui/**
      # --version: pitwall-server has no --self-test; its --version starts the binary from the built app and exits 0 (the old
      # macos-verify-bundle.sh ran the same).
      sidecars: pitwall-server:--version
      # A per-machine app (ADR 0053): the installer embeds paddock-setup.exe, built with this app's identity and update key before the
      # bundle, and the installer built is read as an artifact (administrator level, paddock-setup.exe inside, the include's version).
      windows-pre-bundle: node scripts/stage-paddock-setup.mjs --app pitwall && node apps/pitwall/scripts/ci/stage-vc-redist.mjs
      windows-installer-check: node conformance/release/check-per-machine-installer.mjs --conf apps/pitwall/app/src-tauri/tauri.conf.json --must-contain vc_redist.x64.exe --dir
      setup-node: false
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.PADDOCK_TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.PADDOCK_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBKEY: ${{ secrets.PADDOCK_TAURI_UPDATER_PUBKEY }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  # A tag: the gates first (ER-15: no release past red gates), then the same installers and the Gitea release. Only a tag run has
  # the gates, so this job never waits on a skipped need.
  release:
    name: installers + release
    needs: [plan, gates]
    if: ${{ needs.plan.outputs.run == 'true' && startsWith(github.ref, 'refs/tags/pitwall-v') && needs.gates.result == 'success' }}
    uses: ./.gitea/workflows/app-release.yml
    with:
      paddock-ref: ${{ github.sha }}
      app-id: pitwall
      app-name: Pitwall
      app-dir: apps/pitwall/app
      cargo-dir: apps/pitwall
      tag-prefix: pitwall-
      latest-tag: pitwall-latest
      notes-extra: "**Existing installs:** download this version once by hand. Pitwall now updates from the Paddock releases, which a copy installed before this version does not look at."
      cliff-config: apps/pitwall/cliff.toml
      cliff-paths: |
        apps/pitwall/**
        crates/**
        ui/**
      # --version: pitwall-server has no --self-test; its --version starts the binary from the built app and exits 0 (the old
      # macos-verify-bundle.sh ran the same).
      sidecars: pitwall-server:--version
      # A per-machine app (ADR 0053): the installer embeds paddock-setup.exe, built with this app's identity and update key before the
      # bundle, and the installer built is read as an artifact (administrator level, paddock-setup.exe inside, the include's version).
      windows-pre-bundle: node scripts/stage-paddock-setup.mjs --app pitwall && node apps/pitwall/scripts/ci/stage-vc-redist.mjs
      windows-installer-check: node conformance/release/check-per-machine-installer.mjs --conf apps/pitwall/app/src-tauri/tauri.conf.json --must-contain vc_redist.x64.exe --dir
      setup-node: false
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.PADDOCK_TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.PADDOCK_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBKEY: ${{ secrets.PADDOCK_TAURI_UPDATER_PUBKEY }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  # What this run proves about the installers (rule 54): "installers: built" or "installers: not built (why)" in the summary, and a
  # red run when a manual run or a tag was meant to build them and did not. The verdict reads whichever of the two installer jobs ran.
  verdict:
    name: installers verdict
    needs: [plan, gates, installers, release]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    steps:
      - uses: actions/checkout@v4
      - uses: ./.gitea/actions/release-verdict
        with:
          app: pitwall
          plan-run: ${{ needs.plan.outputs.run }}
          release-result: ${{ needs.release.result != 'skipped' && needs.release.result || needs.installers.result }}
          gates-result: ${{ needs.gates.result }}
