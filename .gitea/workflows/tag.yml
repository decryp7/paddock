# Release tags are made here (ER-15, rule 9): an agent or a person requests a tag, this workflow checks the commit and the release
# bot pushes it. Tag protection (pattern * allowing only release-bot) is switched on by the repository's owner, so a tag pushed by
# hand is refused by the server.
#
# THIS IS A GUARD RAIL AGAINST MISTAKES, NOT A SECURITY BOUNDARY. Any repository writer can dispatch a workflow from their own
# ref, and repository secrets reach every non-fork run, so a hostile writer could read RELEASE_BOT_TOKEN. The setup is single-user
# (ER-37, common practice for a personal repository); the job below runs only from main so a slip cannot use an old copy of it.
#
# Two jobs. `check` runs the checker from the DISPATCH ref's checkout (main, in `trusted/`) and reads the tag's commit only as
# data: `git show <sha>:path` for the version source and paddock.ci.json, and a `git archive` extraction for the tag gates, which
# the main-built ./dev reads. No script of the tagged tree is ever run. `push` is a fresh container with no checkout and the bot's
# token, which is the only place the token exists. Checked, each failing with one ::error:: and the next step
# (conformance/ci/request-tag.mjs):
#   - the tag's name; the sha is on origin/main or origin/release/*; it is not a skip-ci commit (ER-16); the tag does not exist;
#   - the app's version source says the tag's version;
#   - the newest FULL run of the app's gate workflow on exactly that sha is green, asked of `./dev ci verdict` (built from main;
#     tools/paddock-dev/src/ci_runs/verdict.rs, the one reader of the runs for this answer). Full means its plan job logged
#     `plan verdict: complete=true` after deciding (plan_since::COMPLETE_LINE; debrief.yml and ci.yml print it, the other app workflows through the shared plan action given `full:`), a push to main
#     included: a push whose plan skipped it tested nothing, and the refusal names the last fully tested commit. A since_run rerun or
#     a base dispatch is never full, so it cannot clear a red full run; unreadable is not measured, never a pass;
#   - for an app tag, the tag gates the release workflows also run (`./dev gates ratchet`, `./dev check ipc-endpoints --tag`).
# The ADR 0093 scheduled-CI gate (WP-5) is not built yet; it joins here when it is.
# Not covered (TOCTOU): a run can change between the check and the push (a rerun going red); the tag's own release workflow runs
# the gates again on the tag. A tag that already exists is refused by the server, never moved.
#
# The push uses RELEASE_BOT_TOKEN, a personal token of the user release-bot. A tag pushed with it starts the release workflow
# (an <app>-v* push); one pushed with the job's own token would not (Gitea ignores events whose doer is the Actions user:
# services/actions/notifier_helper.go, notify()). The token reaches git through GIT_ASKPASS from an env var, never argv, and is masked.
#
# Request a tag: POST /api/v1/repos/decryp7/paddock/actions/workflows/tag.yml/dispatches
#                with {"ref":"main","inputs":{"tag":"...","sha":"..."}}

name: tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to make: <app>-vX.Y.Z[-pre] or vX.Y.Z[-pre]"
        type: string
        required: true
      sha:
        description: "The full 40-hex commit id to tag (the commit CI tested)"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: tag-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  check:
    name: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # actions: read lists runs and reads the plan job's log; unnamed scopes are None on this Gitea, so it must be named.
    permissions:
      contents: read
      actions: read
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    env:
      TAG: ${{ inputs.tag }}
      SHA: ${{ inputs.sha }}
      PADDOCK_DEV_DOWNLOAD: "0"
    steps:
      # Inputs first, as plain text in the environment (never spliced into a script): a bad value fails before anything is fetched.
      - name: Inputs
        shell: bash
        run: |
          if ! [[ "$TAG" =~ ^[a-z0-9]+(-[a-z0-9]+)*-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ || "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::tag: the tag is not <app>-vX.Y.Z or vX.Y.Z. Run the workflow again with a tag like dyno-v1.2.0."
            exit 1
          fi
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::tag: the sha is not a full 40-hex commit id. Run the workflow again with the whole sha."
            exit 1
          fi

      # The trusted code: main, the dispatch ref, in its own folder. The tagged commit is never checked out.
      - uses: actions/checkout@v4
        with:
          ref: main
          path: trusted
          fetch-depth: 0
          persist-credentials: false

      - name: Checks
        shell: bash
        working-directory: trusted
        env:
          GITEA_TOKEN: ${{ github.token }}
        run: |
          node conformance/ci/request-tag.mjs --tag "$TAG" --sha "$SHA" --root . \
            --api "${{ github.server_url }}/api/v1" --repo "${{ github.repository }}"

      # The gates read the tagged commit as data: an extracted archive (no hooks, no checkout), looked at by the ./dev built from main.
      - name: Tag gates (apps)
        shell: bash
        working-directory: trusted
        run: |
          if [[ "$TAG" =~ ^v[0-9] ]]; then
            echo "The shared-package tag $TAG has no app tag gates."
            exit 0
          fi
          target="$RUNNER_TEMP/target"
          rm -rf "$target"
          mkdir -p "$target"
          git -c core.hooksPath=/dev/null archive "$SHA" | tar -x -C "$target"
          git -c core.hooksPath=/dev/null -C "$target" init -q
          git -c core.hooksPath=/dev/null -C "$target" fetch -q "$GITHUB_WORKSPACE/trusted" main:refs/remotes/origin/main
          ./dev gates ratchet --root "$target" --release-tag "$TAG"
          ./dev check ipc-endpoints --root "$target" --tag "$TAG"

  # The bot's push: a fresh container, no checkout of any tree, nothing of the repository to run. It fetches the sha with the job's
  # own read token, makes the annotated tag and pushes it with the bot's token. Hooks are off for every git command.
  push:
    name: push
    needs: [check]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    env:
      TAG: ${{ inputs.tag }}
      SHA: ${{ inputs.sha }}
    steps:
      - name: Make the tag as release-bot and push it
        shell: bash
        env:
          RELEASE_BOT_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          JOB_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$RELEASE_BOT_TOKEN" ]; then
            echo "::error::tag: the secret RELEASE_BOT_TOKEN is not set. Ask the repository owner to add the release-bot token as a secret."
            exit 1
          fi
          echo "::add-mask::$RELEASE_BOT_TOKEN"
          # The inputs are checked again here: this job does not trust the other one's word for them.
          if ! [[ "$TAG" =~ ^[a-z0-9]+(-[a-z0-9]+)*-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ || "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::tag: the tag or the sha is malformed. Run the workflow again with valid inputs."
            exit 1
          fi
          # Credentials reach git through an askpass script that reads the environment: nothing secret is on a command line.
          askpass="$RUNNER_TEMP/askpass.sh"
          printf '%s\n' '#!/bin/sh' 'case "$1" in Username*) echo "$GIT_AUTH_USER" ;; *) echo "$GIT_AUTH_PASS" ;; esac' > "$askpass"
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0
          url="${{ github.server_url }}/${{ github.repository }}.git"
          dir="$RUNNER_TEMP/tagrepo"
          rm -rf "$dir"
          git init -q "$dir"
          cd "$dir"
          if ! GIT_AUTH_USER=gitea-actions GIT_AUTH_PASS="$JOB_TOKEN" git -c core.hooksPath=/dev/null fetch -q --no-tags "$url" "$SHA"; then
            echo "::error::tag: the commit $SHA could not be fetched. Check the sha is on origin and the job may read the repository."
            exit 1
          fi
          git -c core.hooksPath=/dev/null -c user.name=release-bot -c user.email=release-bot@users.noreply.dev.decryptology.net tag -a "$TAG" "$SHA" -m "Release $TAG"
          if ! GIT_AUTH_USER=release-bot GIT_AUTH_PASS="$RELEASE_BOT_TOKEN" git -c core.hooksPath=/dev/null push "$url" "refs/tags/$TAG" 2>push.err; then
            tail -n 5 push.err
            echo "::error::tag: the push of $TAG was refused. Check that release-bot has Write on the repository, is on the tag protection allow-list, and the token has write:repository."
            exit 1
          fi
          {
            echo "## Tag $TAG made"
            echo "Pushed \`$TAG\` at \`$SHA\` as release-bot. The release workflow for the tag starts from this push."
          } >> "$GITHUB_STEP_SUMMARY"
