# The safety net of affected CI (ADR 0014 §6): every night, and on a manual run, ci.yml runs everything on main (every
# project, every app leg, Chromium and WebKit), whatever the change. A wrong filter in scripts/affected.mjs can therefore
# hide a failure for at most one night, and release workflows always run their app's full gates.
#
# The night's run is skipped while main is unchanged since the last fully green nightly (the plan action's marker), and a
# fully green run records that marker (nightly-mark). Imported apps add their own nightly jobs here (Debrief's bench,
# corpus, fuzz and mutants, scoped to apps/debrief).

name: nightly

on:
  schedule:
    - cron: "43 1 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  gate:
    name: gate (main changed since the last green nightly?)
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    outputs:
      run: ${{ steps.plan.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        uses: ./.gitea/actions/plan

  ci:
    name: everything
    needs: [gate]
    if: ${{ needs.gate.outputs.run == 'true' }}
    uses: ./.gitea/workflows/ci.yml
    with:
      webkit: true

  # ADR 0026 §3 (D4): every command a dialog contract declares was sent by some run, or is listed as unexercised with a
  # reason, and every dialog opened. It needs the union of the runs, so it runs here only, never in affected-only CI.
  dialog-commands:
    name: dialog commands (declared but never sent)
    needs: [gate]
    if: ${{ needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: ./.gitea/actions/node-caches
        with:
          name: nightly-dialog-commands
      - name: Install
        working-directory: .
        run: npm ci
      - name: Record the commands and the visited dialogs
        env:
          PW_PORT: "4330"
          SHELL_DEMO_PORT: "4331"
          WORKBENCH_DEMO_PORT: "4332"
        run: |
          mkdir -p dialog-check
          npm run build:css
          PADDOCK_DIALOG_COMMANDS_SEEN="$PWD/dialog-check/dialog-commands-seen.json" npx ng test paddock-ui --watch=false --include='projects/paddock-ui/shell/testing/src/reference-dialogs.spec.ts'
          PADDOCK_DIALOGS_VISITED="$PWD/dialog-check/dialogs-visited.json" npx playwright test --project=shell-demo e2e/shell-demo.spec.ts -g "opens by its window URL"
      - name: Check
        run: npm run check:dialog-commands

  # ADR 0026 section 6: the real-window probe. It opens the built shell-demo's real dialog frame in a real (hidden, then
  # shown) window and checks the window's height against the frame's measure, so it needs a webview and a display: a
  # virtual one (xvfb-run) in the Linux container. Never on the macOS or Windows host runners, which run in a user's
  # session (rule 7: a real app window only in a throwaway Linux container or a test VM); their probe runs in the local
  # test VMs (docs/dev-setup.md, "Test VMs").
  #
  # Not a gate of the green nightly (it is not in `mark`'s needs). It runs on a manual run (workflow_dispatch), or on the
  # nightly when the repository variable PADDOCK_REAL_WINDOW_PROBE is "true".
  dialog-window-probe:
    name: dialog window probe (Linux)
    needs: [gate]
    if: ${{ needs.gate.outputs.run == 'true' && (github.event_name == 'workflow_dispatch' || vars.PADDOCK_REAL_WINDOW_PROBE == 'true') }}
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - uses: ./.gitea/actions/setup-rust
        with:
          tauri-linux-deps: "true"

      - uses: ./.gitea/actions/setup-node
        with:
          app-dir: .

      - name: Build the shell demo
        run: |
          npm ci
          npm run build -w ui
          npm run shell-demo:build -w ui
          test -f ui/dist/shell-demo/browser/index.html

      - name: Probe (virtual display)
        working-directory: crates
        env:
          PADDOCK_REAL_WINDOWS: "1"
          PADDOCK_LIVE_BROWSER: "1"
          PADDOCK_PROBE_DIST: ${{ github.workspace }}/ui/dist/shell-demo/browser
        run: xvfb-run -a cargo test -p paddock-dialogs --features tauri --test show_probe -- --nocapture

      - uses: ./.gitea/actions/sccache-stats
        if: always()

  mark:
    name: mark the green nightly
    needs: [ci, dialog-commands]
    if: ${{ github.event_name == 'schedule' && success() }}
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    steps:
      - uses: actions/checkout@v4
      - uses: ./.gitea/actions/nightly-mark
