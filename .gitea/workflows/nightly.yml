# The safety net of affected CI (ADR 0014 §6): every night, and on a manual run, ci.yml runs everything on main (every
# project, every app leg, Chromium and WebKit), whatever the change. A wrong filter in scripts/affected.mjs can therefore
# hide a failure for at most one night, or two when a train in CI skipped one (a skip never leaves main unmeasured for more
# than 36 h and never happens twice in a row: ./dev ci schedule-skip), and release workflows always run their app's full gates.
#
# The night's run is skipped while main is unchanged since the last fully green nightly (the plan action's marker) or while
# a train's dispatch run is in CI (./dev ci schedule-skip; such a night is not measured, never green), and a fully green run
# records that marker (nightly-mark). Imported apps add their own nightly jobs here (Debrief's bench,
# corpus, fuzz and mutants, scoped to apps/debrief). The installers-<app> jobs build every released app's installers (no publish) and the
# verdict job fails the night when one was not built.

name: nightly

on:
  schedule:
    - cron: "3 21 * * *" # 05:03 UTC+8, Windows leg (backup end only assumed; docs/ci-schedules.md)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  # The fallback switch of conformance/ci/kit.sh (WP-1): set the repository variable to shell and every kit step runs its script.
  PADDOCK_CI_KIT: ${{ vars.PADDOCK_CI_KIT }}

jobs:
  gate:
    name: gate (main changed since the last green nightly?)
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v3
    outputs:
      run: ${{ steps.plan.outputs.run }}
      # Whether the night ends early because a train is in CI: installers-gate reuses it instead of asking again.
      train_skip: ${{ steps.plan.outputs.train-skip }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        uses: ./.gitea/actions/plan
        with:
          dev-token: ${{ secrets.BUILD_INPUTS_TOKEN }}
          schedule-workflow: nightly.yml

  # The disk summary of the night: what is on the work disks (d7, d8), who owns it, what is reclaimable and what grew most in the
  # last 7 days (`./dev disk report --summary`, read-only: nothing is cleaned here). Disk fills whether or not main changed, so it
  # does not wait for the gate (the night's skip of an unchanged main or a train in CI does not apply). Informational: not in
  # `mark`'s needs, and its failure never fails the night.
  disk-summary:
    name: disk summary (macos-latest)
    runs-on: macos-latest
    continue-on-error: true
    defaults:
      run:
        shell: bash
    env:
      PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
      PADDOCK_DEV_DOWNLOAD: ${{ startsWith(github.ref, 'refs/tags/') && '0' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.gitea/actions/build-jobs
      # Also runs `./dev disk check` for the host's disks.
      - uses: ./.gitea/actions/job-isolation
      - name: Scan and report
        run: |
          ./dev disk scan
          ./dev disk report --summary >> "$GITHUB_STEP_SUMMARY"
      - uses: ./.gitea/actions/job-isolation
        if: always()
        with:
          mode: release

  # ADR 0060: C100 with a job of its own, so that deleting the conformance job's line does not also delete the check.
  c100:
    name: C100 (every check runs somewhere)
    needs: [gate]
    if: ${{ needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v3
    env:
      PADDOCK_DEV_DOWNLOAD: ${{ startsWith(github.ref, 'refs/tags/') && '0' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.gitea/actions/setup-rust
      - name: C100
        run: ./dev gates check

  ci:
    name: everything
    needs: [gate]
    if: ${{ needs.gate.outputs.run == 'true' }}
    uses: ./.gitea/workflows/ci.yml
    with:
      webkit: true
    secrets:
      BUILD_INPUTS_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}

  # ADR 0026 §3 (D4): every command a dialog contract declares was sent by some run, or is listed as unexercised with a
  # reason, and every dialog opened. It needs the union of the runs, so it runs here only, never in affected-only CI.
  dialog-commands:
    name: dialog commands (declared but never sent)
    needs: [gate]
    if: ${{ needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v3
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: ./.gitea/actions/node-caches
        with:
          name: nightly-dialog-commands
      - name: Install
        working-directory: .
        run: npm ci
      - name: Record the commands and the visited dialogs
        env:
          PW_PORT: "4330"
          SHELL_DEMO_PORT: "4331"
          WORKBENCH_DEMO_PORT: "4332"
        run: |
          mkdir -p dialog-check
          npm run build:css
          PADDOCK_DIALOG_COMMANDS_SEEN="$PWD/dialog-check/dialog-commands-seen.json" npx ng test paddock-ui --watch=false --include='projects/paddock-ui/shell/testing/src/reference-dialogs.spec.ts'
          PADDOCK_DIALOGS_VISITED="$PWD/dialog-check/dialogs-visited.json" npx playwright test --project=shell-demo e2e/shell-demo.spec.ts -g "opens by its window URL"
      - name: Check
        run: npm run check:dialog-commands

  # ADR 0026 section 6: the real-window probe. It opens the built shell-demo's real dialog frame in a real (hidden, then
  # shown) window and checks the window's height against the frame's measure, so it needs a webview and a display: the
  # host runners have one, Linux gets a virtual one (xvfb-run).
  #
  # OFF by default, and not a gate of the green nightly (it is not in `mark`'s needs): it opens real windows on the runner
  # hosts' desktops (ER-14), and the Mac host's displays sleep at night, so a scheduled run would hang or fail for reasons
  # that say nothing about the code. It runs on a manual run (workflow_dispatch), or on the nightly when the repository
  # variable PADDOCK_REAL_WINDOW_PROBE is "true".
  dialog-window-probe:
    name: dialog window probe (${{ matrix.os }})
    needs: [gate]
    if: ${{ needs.gate.outputs.run == 'true' && (github.event_name == 'workflow_dispatch' || vars.PADDOCK_REAL_WINDOW_PROBE == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.os == 'ubuntu-latest' && 'dev.decryptology.net/decryp7/paddock-ci:v3' || '' }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      # Read credential and tag rule for ./dev's prebuilt download (ADR 0022 R0b; a run for a tag builds from source).
      PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
      PADDOCK_DEV_DOWNLOAD: ${{ startsWith(github.ref, 'refs/tags/') && '0' || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Git bash on PATH (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if not exist "%ProgramFiles%\Git\bin\bash.exe" (echo Git for Windows is not installed on this runner & exit /b 1)
          echo %ProgramFiles%\Git\bin>>"%GITHUB_PATH%"

      # CARGO_BUILD_JOBS: this runner's share of the host's cores (before job-isolation, which builds paddock-dev).
      - uses: ./.gitea/actions/build-jobs

      # A slot of the host (job isolation; after Git bash on Windows): setup-rust's sccache folder and port are this job's.
      - uses: ./.gitea/actions/job-isolation

      - uses: ./.gitea/actions/setup-rust
        with:
          tauri-linux-deps: "true"

      - uses: ./.gitea/actions/setup-node
        with:
          app-dir: .

      - name: Build the shell demo
        run: |
          npm ci
          npm run build -w ui
          npm run shell-demo:build -w ui
          test -f ui/dist/shell-demo/browser/index.html

      - name: Probe (Linux, virtual display)
        if: runner.os == 'Linux'
        working-directory: crates
        env:
          PADDOCK_REAL_WINDOWS: "1"
          PADDOCK_PROBE_DIST: ${{ github.workspace }}/ui/dist/shell-demo/browser
        run: xvfb-run -a cargo test -p paddock-dialogs --features tauri --test show_probe -- --nocapture

      - name: Probe (macOS, Windows)
        if: runner.os != 'Linux'
        working-directory: crates
        env:
          PADDOCK_REAL_WINDOWS: "1"
          PADDOCK_PROBE_DIST: ${{ github.workspace }}/ui/dist/shell-demo/browser
        run: cargo test -p paddock-dialogs --features tauri --test show_probe -- --nocapture

      - uses: ./.gitea/actions/sccache-stats
        if: always()

      # The slot goes back last.
      - uses: ./.gitea/actions/job-isolation
        if: always()
        with:
          mode: release

  # Rule 54, "green that proves something": the installers of every released app, built every night with nothing published (the
  # release job of app-release.yml runs only for a tag). They need only installers-gate, a job that always runs: a skipped need
  # skips a reusable-workflow job on this Gitea whatever its `if` says, so nothing here waits on a job that can be skipped.
  # The gate skips the night while main, the toolchain image (ci-image/) and the pinned Rust and Node (rust-toolchain, .nvmrc) are
  # unchanged since the last nightly that built every installer (rule 50); installers-mark records that. The host runners' own Xcode,
  # MSVC and rustc are not visible from this Linux job, so a change of those alone does not wake the night: run the nightly by hand
  # after upgrading a host. Pushes to main build no installers (the nightly does), the cheaper way to keep one marker honest.
  # The inputs are copied from each app's installers job in <app>-release.yml; conformance/test/release-verdict.test.mjs fails when
  # they drift apart. Debrief builds its installers in debrief.yml (its schedule has `full`), the demos have manual releases only.
  installers-gate:
    name: installers gate (main or the toolchain image changed since the last nightly build?)
    needs: [gate]
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v3
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: built
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .nightly-installers
          key: nightly-installers-${{ github.sha }}-${{ hashFiles('ci-image/**', 'rust-toolchain*', '.nvmrc') }}
          lookup-only: true
      - id: decide
        shell: bash
        env:
          HIT: ${{ steps.built.outputs.cache-hit }}
          # gate's answer (ADR 0093 amendment 2026-11-12). It is asked only after main changed since the last green night; a night
          # skipped as unchanged may still build the installers while a train is in CI.
          TRAIN_SKIP: ${{ needs.gate.outputs.train_skip }}
        run: |
          if [ "$HIT" = true ]; then echo "run=false" >> "$GITHUB_OUTPUT"; echo "::notice::main and the toolchain image are unchanged since the last nightly that built the installers; skipping."
          elif [ "$TRAIN_SKIP" = true ]; then echo "run=false" >> "$GITHUB_OUTPUT"
          else echo "run=true" >> "$GITHUB_OUTPUT"; fi

  installers-dyno:
    name: installers (Dyno, no publish)
    needs: [installers-gate]
    if: ${{ needs.installers-gate.outputs.run == 'true' }}
    uses: ./.gitea/workflows/app-release.yml
    with:
      paddock-ref: ${{ github.sha }}
      app-id: dyno
      app-name: Dyno
      app-dir: apps/dyno/app
      cargo-dir: apps/dyno
      tag-prefix: dyno-
      latest-tag: dyno-latest
      notes-extra: "**Existing installs:** download this version once by hand. Dyno now updates from the Paddock releases, which a copy installed before this version does not look at."
      # Dyno's UI imports the shared library from ui/dist, which the app build (Tauri's beforeBuildCommand) needs.
      prepare: npm run build -w ui
      cliff-config: apps/dyno/cliff.toml
      # Since 1.1.0 every Dyno release's notes are the CHANGELOG section of its version (as in dyno-release.yml).
      first-release-changelog: apps/dyno/CHANGELOG.md
      notes-from-changelog: true
      cliff-paths: |
        apps/dyno/**
        crates/**
        ui/**
      # Every sidecar (bundle.externalBin) is started from the built macOS app with --version, which exits 0 (the old
      # macos-verify-bundle.sh ran the same); dyno-agent and the dyno command have no --self-test.
      sidecars: |
        dyno-agent:--version
        dyno:--version
        dyno-bench:--version
        dyno-bench-gpu:--version
        dyno-helper:--version
      # Run paths of the packaged binaries, and the executables a package must carry, on Linux and macOS; on macOS the agent
      # also measures once from the built app (read-only).
      bundle-check: apps/dyno/scripts/check-bundle.sh
      windows-bundle-check: node apps/dyno/scripts/check-pe-subsystem.mjs --dir
      windows-pre-bundle: node scripts/stage-paddock-setup.mjs --app dyno
      windows-installer-check: node conformance/release/check-per-machine-installer.mjs --conf apps/dyno/app/src-tauri/tauri.conf.json --dir
      setup-node: false
      image: dev.decryptology.net/decryp7/paddock-ci:v3
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.PADDOCK_TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.PADDOCK_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBKEY: ${{ secrets.PADDOCK_TAURI_UPDATER_PUBKEY }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  installers-spotter:
    name: installers (Spotter, no publish)
    needs: [installers-gate]
    if: ${{ needs.installers-gate.outputs.run == 'true' }}
    uses: ./.gitea/workflows/app-release.yml
    with:
      paddock-ref: ${{ github.sha }}
      app-id: spotter
      app-name: Spotter
      app-dir: apps/spotter/app
      cargo-dir: apps/spotter
      tag-prefix: spotter-
      latest-tag: spotter-latest
      notes-extra: "**Existing installs:** download this version once by hand. Spotter now updates from the Paddock releases, which a copy installed before this version does not look at."
      # Spotter's UI imports the shared library from ui/dist, which the app build needs.
      prepare: npm run build -w ui
      cliff-config: apps/spotter/cliff.toml
      cliff-paths: |
        apps/spotter/**
        crates/**
        ui/**
      # Spotter bundles no sidecar (no bundle.externalBin), so the macOS verify has none to start; the seal, the hardened-runtime
      # and TeamIdentifier checks on the .app and the DMG still run. A sidecar added later is read from tauri.conf.json.
      setup-node: false
      image: dev.decryptology.net/decryp7/paddock-ci:v3
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.PADDOCK_TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.PADDOCK_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBKEY: ${{ secrets.PADDOCK_TAURI_UPDATER_PUBKEY }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  installers-pitcrew:
    name: installers (Pitcrew, no publish)
    needs: [installers-gate]
    if: ${{ needs.installers-gate.outputs.run == 'true' }}
    uses: ./.gitea/workflows/app-release.yml
    with:
      paddock-ref: ${{ github.sha }}
      app-id: pitcrew
      app-name: Pitcrew
      app-dir: apps/pitcrew/app
      cargo-dir: apps/pitcrew
      tag-prefix: pitcrew-
      latest-tag: pitcrew-latest
      notes-extra: "**Existing installs:** download this version once by hand. Pitcrew now updates from the Paddock releases, which a copy installed before this version does not look at."
      cliff-config: apps/pitcrew/cliff.toml
      cliff-paths: |
        apps/pitcrew/**
        crates/**
        ui/**
      # --version: Pitcrew's service has no --self-test; its --version loads every library and exits 0.
      sidecars: pitcrew-service:--version
      setup-node: false
      image: dev.decryptology.net/decryp7/paddock-ci:v3
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.PADDOCK_TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.PADDOCK_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBKEY: ${{ secrets.PADDOCK_TAURI_UPDATER_PUBKEY }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  installers-pitwall:
    name: installers (Pitwall, no publish)
    needs: [installers-gate]
    if: ${{ needs.installers-gate.outputs.run == 'true' }}
    uses: ./.gitea/workflows/app-release.yml
    with:
      paddock-ref: ${{ github.sha }}
      app-id: pitwall
      app-name: Pitwall
      app-dir: apps/pitwall/app
      cargo-dir: apps/pitwall
      tag-prefix: pitwall-
      latest-tag: pitwall-latest
      notes-extra: "**Existing installs:** download this version once by hand. Pitwall now updates from the Paddock releases, which a copy installed before this version does not look at."
      # Pitwall's UI imports the shared library from ui/dist, which the app build (Tauri's beforeBuildCommand) needs.
      prepare: npm run build -w ui
      cliff-config: apps/pitwall/cliff.toml
      # The notes list Pitwall's own commits plus the shared crates and UI it builds on.
      cliff-paths: |
        apps/pitwall/**
        crates/paddock-service/**
        crates/paddock-jobs/**
        crates/paddock-proc/**
        crates/paddock-setup/**
        crates/paddock-updater/**
        ui/**
      # --version: pitwall-server has no --self-test; its --version starts the binary from the built app and exits 0 (the old
      # macos-verify-bundle.sh ran the same).
      sidecars: pitwall-server:--version
      # A per-machine app (ADR 0053), as pitwall-release.yml: the installer embeds paddock-setup.exe and is read as an artifact.
      windows-pre-bundle: node scripts/stage-paddock-setup.mjs --app pitwall && node apps/pitwall/scripts/ci/stage-vc-redist.mjs
      windows-installer-check: node conformance/release/check-per-machine-installer.mjs --conf apps/pitwall/app/src-tauri/tauri.conf.json --must-contain vc_redist.x64.exe --dir
      setup-node: false
      image: dev.decryptology.net/decryp7/paddock-ci:v3
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.PADDOCK_TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.PADDOCK_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBKEY: ${{ secrets.PADDOCK_TAURI_UPDATER_PUBKEY }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  installers-verdict:
    name: installers verdict (the nightly built them, or it fails)
    needs: [gate, installers-gate, installers-dyno, installers-spotter, installers-pitcrew, installers-pitwall]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v3
    steps:
      - uses: actions/checkout@v4
      - uses: ./.gitea/actions/release-verdict
        with:
          app: dyno
          plan-run: ${{ needs.installers-gate.outputs.run }}
          skip-reason: ${{ needs.gate.outputs.train_skip == 'true' && 'train' || '' }}
          release-result: ${{ needs.installers-dyno.result }}
      - uses: ./.gitea/actions/release-verdict
        with:
          app: spotter
          plan-run: ${{ needs.installers-gate.outputs.run }}
          skip-reason: ${{ needs.gate.outputs.train_skip == 'true' && 'train' || '' }}
          release-result: ${{ needs.installers-spotter.result }}
      - uses: ./.gitea/actions/release-verdict
        with:
          app: pitcrew
          plan-run: ${{ needs.installers-gate.outputs.run }}
          skip-reason: ${{ needs.gate.outputs.train_skip == 'true' && 'train' || '' }}
          release-result: ${{ needs.installers-pitcrew.result }}
      - uses: ./.gitea/actions/release-verdict
        with:
          app: pitwall
          plan-run: ${{ needs.installers-gate.outputs.run }}
          skip-reason: ${{ needs.gate.outputs.train_skip == 'true' && 'train' || '' }}
          release-result: ${{ needs.installers-pitwall.result }}

  installers-mark:
    name: mark the nightly that built every installer
    needs: [installers-gate, installers-dyno, installers-spotter, installers-pitcrew, installers-pitwall]
    if: ${{ github.event_name == 'schedule' && success() && needs.installers-gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v3
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p .nightly-installers && echo "${{ github.sha }}" > .nightly-installers/sha
        shell: bash
      - uses: actions/cache/save@v4
        with:
          path: .nightly-installers
          key: nightly-installers-${{ github.sha }}-${{ hashFiles('ci-image/**', 'rust-toolchain*', '.nvmrc') }}

  # IP1 item 6 (plan 1.2): every shared crate's fuzz targets run for a bounded time each, through the reusable app-fuzz workflow
  # (rule 55: one implementation of the fuzz run). A crash fails its job, uploads the reproducer and keeps the night from being
  # marked green. Each crate's fuzz folder is its own workspace (`crates/<crate>/fuzz`).
  # Gitea counts runner slots per caller, so the five calls are chained in two chains (ipc, view, testplan and plugin-package,
  # archive): at most two run at once and one of the three Linux slots stays free. A later link runs even after a crash
  # in the earlier one (`!cancelled()`), so one crash does not hide the others.
  fuzz-ipc:
    name: fuzz (paddock-ipc)
    needs: [gate]
    if: ${{ needs.gate.outputs.run == 'true' }}
    uses: ./.gitea/workflows/app-fuzz.yml
    with:
      paddock-ref: ${{ github.sha }}
      fuzz-dir: crates/paddock-ipc/fuzz
      shards: '[{"shard":1,"targets":"frame plugin_request"}]'
      seconds: "120"
      timeout-minutes: 45

  fuzz-plugin-package:
    name: fuzz (paddock-plugin-package)
    needs: [gate]
    if: ${{ needs.gate.outputs.run == 'true' }}
    uses: ./.gitea/workflows/app-fuzz.yml
    with:
      paddock-ref: ${{ github.sha }}
      fuzz-dir: crates/paddock-plugin-package/fuzz
      shards: '[{"shard":1,"targets":"manifest package"}]'
      seconds: "120"
      timeout-minutes: 45

  fuzz-view:
    name: fuzz (paddock-view)
    needs: [gate, fuzz-ipc]
    if: ${{ !cancelled() && needs.gate.outputs.run == 'true' }}
    uses: ./.gitea/workflows/app-fuzz.yml
    with:
      paddock-ref: ${{ github.sha }}
      fuzz-dir: crates/paddock-view/fuzz
      shards: '[{"shard":1,"targets":"decode"}]'
      seconds: "120"
      timeout-minutes: 45

  fuzz-archive:
    name: fuzz (paddock-archive)
    needs: [gate, fuzz-plugin-package]
    if: ${{ !cancelled() && needs.gate.outputs.run == 'true' }}
    uses: ./.gitea/workflows/app-fuzz.yml
    with:
      paddock-ref: ${{ github.sha }}
      fuzz-dir: crates/paddock-archive/fuzz
      shards: '[{"shard":1,"targets":"archive"}]'
      seconds: "120"
      timeout-minutes: 45

  fuzz-testplan:
    name: fuzz (paddock-testplan)
    needs: [gate, fuzz-view]
    if: ${{ !cancelled() && needs.gate.outputs.run == 'true' }}
    uses: ./.gitea/workflows/app-fuzz.yml
    with:
      paddock-ref: ${{ github.sha }}
      fuzz-dir: crates/paddock-testplan/fuzz
      shards: '[{"shard":1,"targets":"formats"}]'
      seconds: "120"
      timeout-minutes: 45

  # ER-40 / ER-41: every command of the generator registry (docs/generators.toml) runs on the real tree every night, so a
  # check that passes without looking, or was never run, shows within a day. Slot: this workflow's 21:03 UTC (05:03 UTC+8,
  # outside 00:00-04:00 local), one Linux slot. `--all` exits 5 on a stale file and 6 on a check that could not run.
  generators:
    name: generators (every registry check)
    # Measured once (2026-11-12, container on a Mac, amd64 emulated, 4 CPUs): 92 min. Before a real run, the limit is the sum of the hang guards of the heavy entries (tools/paddock-dev
    # generators/run.rs: 1800 s each, 24 of them, would be 12 h, so this takes the longest known chain instead): the UI and
    # e2e builds (about 15 min) plus the heaviest checks measured on 2026-11-12 on a loaded Mac (ts-debrief-wire 12 min cold,
    # ts-dyno-shell 6 min, ts-shared-crates and the rest about 40 min together) and a cold cargo-about install (5 min), with a
    # margin of 2: 150 minutes. Replace with the measured duration plus 50 % after the first run.
    timeout-minutes: 150
    needs: [gate]
    if: ${{ needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    env:
      PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
      # Generator builds go outside the checkout and the home folder (tools/paddock-dev generators/run.rs).
      PADDOCK_DEV_TARGET_DIR: /var/tmp/paddock-gen-builds
      PADDOCK_DEV_DOWNLOAD: ${{ startsWith(github.ref, 'refs/tags/') && '0' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.gitea/actions/setup-rust
      - uses: ./.gitea/actions/node-caches
      - name: Install
        run: npm ci
      # The Debrief store crates link the official libduckdb: the image's when it has the pinned version, else the pinned download
      # (as debrief.yml does before it builds the workspace).
      - name: libduckdb
        working-directory: apps/debrief
        run: bash scripts/ci/libduckdb-env.sh
      # i18n:check and the publish dry run read the built package.
      - name: Build the UI package
        run: npm run build -w ui && npm run build:e2e -w ui
      # The notices checks never install their tool (a missing one is NOT MEASURED), so the job does, at the pinned version.
      - name: cargo-about
        run: cargo install cargo-about --version 0.9.2 --locked --features cli
      - name: ./dev gen check --all
        run: ./dev gen check --all

  # `generators` joins this list after its first green nightly run (docs/ci-schedules.md).
  # A night the gate skipped (main unchanged, or a train in CI) measured nothing and is never marked.
  mark:
    name: mark the green nightly
    needs: [gate, ci, dialog-commands, fuzz-ipc, fuzz-plugin-package, fuzz-view, fuzz-archive, fuzz-testplan]
    if: ${{ github.event_name == 'schedule' && success() && needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/paddock-ci:v3
    steps:
      - uses: actions/checkout@v4
      - uses: ./.gitea/actions/nightly-mark
