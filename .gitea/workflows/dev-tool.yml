# Publishes the paddock-dev binary for every runner kind CI uses to the Gitea generic package `paddock-dev` (ADR 0022 section 3.3,
# R0b), keyed by the input hash, so a CI job's ./dev downloads it instead of compiling the tool (about 100 s cold). Runs on a push
# to main that changes the tool's inputs (tools/paddock-dev/inputs.txt, checked by a test), nightly (a new stable compiler changes
# the hash without a commit) and by hand. A run on another ref skips every job. A runner that already finds its file under the hash ends at once.
#
# Needs the Gitea secret DEV_TOOL_PUBLISH_TOKEN (a token with write:package; the only workflow that gets it). Without it the
# upload stops with an ::error:: naming what to create. Reads use BUILD_INPUTS_TOKEN; the package owner is the private org
# paddock-build-inputs (ADR 0022 amendment 2026-11-09, Proposed). It publishes only from main: a binary from a branch must
# not be readable by other branches' jobs under a hash they could compute (ADR 0022, "written only by main"). The consumer side is the `dev` wrapper.

name: dev-tool

on:
  push:
    branches: [main]
    paths:
      - dev
      - tools/paddock-dev/**
      - crates/Cargo.toml
      - crates/paddock-cli/**
      - crates/paddock-proc/**
      - crates/paddock-repo-graph/**
      - crates/paddock-slots/**
      - crates/paddock-workspace-hack/**
      - .cargo/config.toml
      - conformance/ci/dev-tool-publish.sh
      - .gitea/workflows/dev-tool.yml
  schedule:
    - cron: '35 2 * * *'
  workflow_dispatch:
    inputs:
      macos:
        description: "Also publish for the macOS host runner (false: Linux and Windows only, when the macOS runner is busy)"
        type: boolean
        default: true

concurrency:
  group: dev-tool-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish (${{ matrix.os }})
    if: ${{ github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.os == 'ubuntu-latest' && 'dev.decryptology.net/decryp7/paddock-ci:v2' || '' }}
    defaults:
      run:
        shell: bash
    env:
      PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Git bash on PATH (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if not exist "%ProgramFiles%\Git\bin\bash.exe" (echo Git for Windows is not installed on this runner & exit /b 1)
          echo %ProgramFiles%\Git\bin>>"%GITHUB_PATH%"

      - uses: ./.gitea/actions/build-jobs

      # A slot of the host (job isolation): its kept folders (the compile cache) and temp folder are this job's alone.
      - uses: ./.gitea/actions/job-isolation

      - uses: ./.gitea/actions/setup-rust

      - name: Build and publish the tool for this runner
        env:
          PUBLISH_TOKEN: ${{ secrets.DEV_TOOL_PUBLISH_TOKEN }}
        run: bash conformance/ci/dev-tool-publish.sh

      - uses: ./.gitea/actions/job-isolation
        if: always()
        with:
          mode: release

  publish-macos:
    name: publish (macos-latest)
    # A manual run can leave this leg out while the macOS runner is busy (macos: false).
    if: ${{ github.ref == 'refs/heads/main' && github.event.inputs.macos != 'false' }}
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    env:
      PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.gitea/actions/build-jobs

      # A slot of the host (job isolation): its kept folders (the compile cache) and temp folder are this job's alone.
      - uses: ./.gitea/actions/job-isolation

      - uses: ./.gitea/actions/setup-rust

      - name: Build and publish the tool for this runner
        env:
          PUBLISH_TOKEN: ${{ secrets.DEV_TOOL_PUBLISH_TOKEN }}
        run: bash conformance/ci/dev-tool-publish.sh

      - uses: ./.gitea/actions/job-isolation
        if: always()
        with:
          mode: release
