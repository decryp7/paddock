# Probes the shared test-result store (RustFS) from every runner OS: `./dev ci test-cache probe --shared` runs a fixed set of scenarios
# (a missing GET, a small and a real-size record, PUTs and GETs in parallel at 4, 16 and 50, a key and a path with a space and a backslash,
# the same PUTs one at a time) and prints one line each with p50/p90/max in ms, the HTTP statuses and the curl exits. It writes only under its own
# scratch prefix of the bucket and deletes it (ER-45). By hand only (Actions > test-cache-probe > Run workflow); not a gate, not scheduled.
# The store settings are the crate legs' (ci.yml, "Test cache store check"). Why: run 9350 lost every record of a Windows leg to one timed-out PUT,
# and the write limit and parallelism are set from these numbers (ER-12).
name: test-cache-probe
# A run dispatched through ./dev ci dispatch shows its dispatch_id in its title, so the tool finds that exact run (guard A6, ER-51).
run-name: ${{ github.event.inputs.dispatch_id && format('{0} [dispatch {1}]', github.workflow, github.event.inputs.dispatch_id) || '' }}

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: "Set by ./dev ci dispatch: the token it finds this run by (shown in the run's title). Leave empty."
        required: false
        default: ""

env:
  # The fallback switch of conformance/ci/kit.sh, as in ci.yml: the shared actions call kit.sh.
  PADDOCK_CI_KIT: ${{ vars.PADDOCK_CI_KIT }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    name: probe (${{ matrix.os }})
    strategy:
      fail-fast: false
      # One OS at a time: the probe measures the store, and three at once would be the load.
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.os == 'ubuntu-latest' && 'dev.decryptology.net/decryp7/paddock-ci:v3' || '' }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      # The tag rule for ./dev (job-isolation runs it): a tag run never downloads a stored tool binary.
      PADDOCK_DEV_DOWNLOAD: ${{ startsWith(github.ref, 'refs/tags/') && '0' || '' }}
      PADDOCK_DEV_TOKEN: ${{ secrets.BUILD_INPUTS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: runner.os == 'Linux'
        with:
          persist-credentials: false

      - uses: actions/checkout@v4
        if: runner.os != 'Linux'
        with:
          persist-credentials: false
          sparse-checkout: |
            .cargo
            .gitea
            conformance
            scripts
            tools
            crates
          filter: blob:none

      - name: Git bash on PATH (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if not exist "%ProgramFiles%\Git\bin\bash.exe" (echo Git for Windows is not installed on this runner & exit /b 1)
          echo %ProgramFiles%\Git\bin>>"%GITHUB_PATH%"

      - uses: ./.gitea/actions/build-jobs
      - uses: ./.gitea/actions/job-isolation

      - name: Probe the test-result store
        env:
          PADDOCK_TEST_CACHE_KEY_ID: ${{ secrets.PADDOCK_TEST_CACHE_KEY_ID }}
          PADDOCK_TEST_CACHE_SECRET: ${{ secrets.PADDOCK_TEST_CACHE_SECRET }}
          PADDOCK_SCCACHE_S3_ENDPOINT: ${{ vars.PADDOCK_SCCACHE_S3_ENDPOINT }}
        run: |
          "$GITHUB_WORKSPACE/dev" ci test-cache probe --shared

      - uses: ./.gitea/actions/job-isolation
        if: always()
        with:
          mode: release
