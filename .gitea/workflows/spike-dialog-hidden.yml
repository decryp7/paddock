# TEMPORARY, spike branch only (ADR 0026 package 1.1-0): runs spikes/dialog-hidden on the Windows host runner, which
# runs jobs in a desktop session, and prints the probe log. Dispatched once by hand on spike/dialog-hidden-windows;
# this file is deleted on the branch after the run and never merges to main.
name: spike-dialog-hidden

on:
  workflow_dispatch:
    inputs:
      only:
        description: "windows or linux (the local Docker engine was unresponsive, so the Linux leg runs in the CI image here)"
        default: windows


jobs:
  windows:
    name: dialog hidden-window probe (windows)
    if: inputs.only != 'linux'
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Git bash on PATH (Windows)
        shell: cmd
        run: |
          whoami
          query session 2>nul
          if not exist "%ProgramFiles%\Git\bin\bash.exe" (echo Git for Windows is not installed on this runner & exit /b 1)
          echo %ProgramFiles%\Git\bin>>"%GITHUB_PATH%"
          (echo CARGO_BUILD_JOBS=8)>>"%GITHUB_ENV%"
          rem `query session` leaves ERRORLEVEL 1 and echo does not reset it
          exit /b 0

      - name: Tools
        run: |
          rustc --version
          cargo --version
          node --version
          powershell -NoProfile -Command "\"job session: $((Get-Process -Id $PID).SessionId)\""
          reg query "HKLM\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}" //v pv 2>/dev/null || true

      - name: Build the probe
        working-directory: spikes/dialog-hidden
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/dialog-spike-target
        run: cargo build

      - name: Run the probe
        working-directory: spikes/dialog-hidden
        env:
          PROBE_REPS: "3"
          PROBE_OUT: ${{ runner.temp }}/probe-windows.jsonl
        run: |
          set +e
          timeout 900 "$RUNNER_TEMP/dialog-spike-target/debug/dialog-hidden-spike.exe"
          echo "probe exit: $?"
          node summarize.mjs "$PROBE_OUT"
          echo
          node summarize.mjs "$PROBE_OUT" --trials
          echo "=== PROBE JSONL BEGIN ==="
          cat "$PROBE_OUT"
          echo "=== PROBE JSONL END ==="

  linux:
    name: dialog hidden-window probe (linux, Xvfb)
    if: inputs.only == 'linux'
    runs-on: ubuntu-latest
    container: dev.decryptology.net/decryp7/paddock-ci:v2
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: spikes/dialog-hidden
    env:
      CARGO_TARGET_DIR: /tmp/dialog-spike-target
      WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
      WEBKIT_DISABLE_DMABUF_RENDERER: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"
      PROBE_REPS: "3"
    steps:
      - uses: actions/checkout@v4
      - name: Build the probe
        run: cargo build
      - name: Run the probe (compositing on, scale 1; compositing off as CI's e2e; GDK_SCALE=2)
        run: |
          set +e
          bin=/tmp/dialog-spike-target/debug/dialog-hidden-spike
          pkg-config --modversion webkit2gtk-4.1
          PROBE_OUT=/tmp/linux-comp.jsonl dbus-run-session -- xvfb-run -a --server-args="-screen 0 1600x1000x24" timeout 900 $bin; echo "exit $?"
          WEBKIT_DISABLE_COMPOSITING_MODE=1 PROBE_OUT=/tmp/linux-nocomp.jsonl dbus-run-session -- xvfb-run -a --server-args="-screen 0 1600x1000x24" timeout 900 $bin; echo "exit $?"
          GDK_SCALE=2 PROBE_REPS=1 PROBE_OUT=/tmp/linux-scale2.jsonl dbus-run-session -- xvfb-run -a --server-args="-screen 0 3200x2000x24" timeout 900 $bin; echo "exit $?"
          for f in linux-comp linux-nocomp linux-scale2; do
            echo "=== $f summary"; node summarize.mjs /tmp/$f.jsonl; node summarize.mjs /tmp/$f.jsonl --trials
            echo "=== PROBE JSONL BEGIN $f ==="; cat /tmp/$f.jsonl; echo "=== PROBE JSONL END $f ==="
          done
