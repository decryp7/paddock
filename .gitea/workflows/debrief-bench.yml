# Engine benchmarks (crates/debrief-core/benches) on pushes to main that change the
# engine, nightly and on demand. A quick criterion pass keeps the job short; the
# HTML report is uploaded as an artifact so runs can be compared. Raise the input sizes locally with
# DEBRIEF_BENCH_IMPORT_LINES / DEBRIEF_BENCH_WORKSPACE_LINES.

name: debrief-bench

on:
  # Pushes run only when the engine changes (most pushes are UI or shell work and cannot move these numbers);
  # the nightly run still catches drift from dependency updates.
  push:
    branches: [main]
    paths:
      - "apps/debrief/crates/debrief-core/**"
      - "apps/debrief/crates/debrief-store-duck/**"
      - "apps/debrief/crates/debrief-store-worker/**"
  schedule:
    - cron: "3 14 * * *" # 22:03 UTC+8
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# A newer push to the same branch (or pull request) supersedes the run still going; tags have their own ref,
# so releases are never cancelled by later pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every step runs in the app's folder (ADR 0014: Debrief lives in apps/debrief) unless its job says otherwise.
defaults:
  run:
    working-directory: apps/debrief

jobs:
  # Decides whether this run is needed at all:
  # the nightly run is skipped while main is unchanged since the last green one.
  plan:
    name: plan
    runs-on: ubuntu-latest
    container:
      # The paddock-ci image: ./dev (the schedule-skip step) runs there.
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    outputs:
      run: ${{ steps.plan.outputs.run }}
    defaults:
      run:
        working-directory: .
    steps:
      # A scheduled run ends early while a train is in CI (ADR 0093 amendment 2026-11-12); the action needs the checkout.
      - uses: actions/checkout@v4
        if: github.event_name == 'schedule'
      - id: train
        if: github.event_name == 'schedule'
        uses: ./.gitea/actions/schedule-skip
        with:
          dev-token: ${{ secrets.BUILD_INPUTS_TOKEN }}

      # Exact-key lookup only: nothing is downloaded. The marker is saved by the nightly-mark job after a fully green run.
      - uses: actions/cache/restore@v4
        id: green
        if: github.event_name == 'schedule'
        with:
          path: .nightly-green
          key: debrief-bench-nightly-green-${{ github.sha }}
          lookup-only: true

      - name: Decide
        id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          GREEN: ${{ steps.green.outputs.cache-hit }}
          TRAIN_SKIP: ${{ steps.train.outputs.skip }}
        run: |
          run=true
          if [ "$EVENT" = schedule ] && [ "$GREEN" = true ]; then
            run=false
            echo "::notice::main has not changed since the last green run ($SHA); skipping."
          fi
          if [ "$EVENT" = schedule ] && [ "$TRAIN_SKIP" = true ]; then
            run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  bench:
    name: engine benchmarks
    needs: [plan]
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/garage:ubuntu-24.04-20261023-r5
    steps:
      - uses: actions/checkout@v4

      # CARGO_BUILD_JOBS: this runner's share of the host (conformance/ci/build-jobs.sh; Linux keeps cargo's default).
      - uses: ./.gitea/actions/build-jobs

      - uses: dtolnay/rust-toolchain@stable

      # Restore and save separately, with the run id in the saved key: a fixed key can never be updated once it
      # exists, and a failing run still warms the cache (see build.yml).
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/debrief/target
          key: bench-${{ runner.os }}-${{ hashFiles('apps/debrief/Cargo.lock') }}
          restore-keys: bench-${{ runner.os }}-

      # The store crates link the official prebuilt libduckdb (ADR 0014): fetched once per version, SHA-256 pinned,
      # so every job that builds the workspace links it (a test that is skipped still has to link).
      - uses: actions/cache@v4
        if: runner.os != 'Windows'
        with:
          path: ~/.cache/debrief-libduckdb
          key: libduckdb-${{ runner.os }}-${{ hashFiles('apps/debrief/crates/debrief-store-duck/scripts/fetch-libduckdb.sh') }}

      - name: libduckdb (prebuilt, pinned SHA-256)
        shell: bash
        run: |
          # Checked on its own: `eval "$(...)"` would swallow a failed download and go on with no or another libduckdb (CI 7822).
          if ! duckdb_env=$(bash crates/debrief-store-duck/scripts/fetch-libduckdb.sh "$HOME/.cache/debrief-libduckdb"); then
            echo "::error::could not fetch the pinned libduckdb (fetch-libduckdb.sh failed; its error is above). Re-run the job; if the download keeps failing, check the DuckDB release on GitHub."
            exit 1
          fi
          unset DUCKDB_LIB_DIR DUCKDB_INCLUDE_DIR
          eval "$duckdb_env"
          : "${DUCKDB_LIB_DIR:?fetch-libduckdb.sh did not set DUCKDB_LIB_DIR}"
          echo "DUCKDB_LIB_DIR=$DUCKDB_LIB_DIR" >> "$GITHUB_ENV"
          echo "DUCKDB_INCLUDE_DIR=$DUCKDB_INCLUDE_DIR" >> "$GITHUB_ENV"
          case "$RUNNER_OS" in
            Linux) echo "LD_LIBRARY_PATH=$DUCKDB_LIB_DIR:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV" ;;
            macOS) echo "DYLD_LIBRARY_PATH=$DUCKDB_LIB_DIR:${DYLD_LIBRARY_PATH:-}" >> "$GITHUB_ENV" ;;
            Windows) cygpath -w "$DUCKDB_LIB_DIR" >> "$GITHUB_PATH" ;;
          esac

      - name: Benchmarks (quick)
        run: cargo bench -p debrief-core --bench engine -- --quick

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/debrief/target
          key: bench-${{ runner.os }}-${{ hashFiles('apps/debrief/Cargo.lock') }}-${{ github.run_id }}

      - name: Upload criterion report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: criterion-report
          path: apps/debrief/target/criterion
          if-no-files-found: warn

  # The store at 10M events (ADR 0014 budgets): import, indexing, reads and the worker's memory. Nightly and on
  # demand only (about 15 minutes); the corpus (3.7 GB of CLEF) is generated once into a cached folder.
  store-bench:
    name: store benchmarks (10M events)
    needs: [plan]
    if: needs.plan.outputs.run == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/garage:ubuntu-24.04-20261023-r5
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # CARGO_BUILD_JOBS: this runner's share of the host (conformance/ci/build-jobs.sh; Linux keeps cargo's default).
      - uses: ./.gitea/actions/build-jobs

      - uses: dtolnay/rust-toolchain@stable

      # The store crates link the official prebuilt libduckdb (ADR 0014): fetched once per version, SHA-256 pinned,
      # so every job that builds the workspace links it (a test that is skipped still has to link).
      - uses: actions/cache@v4
        if: runner.os != 'Windows'
        with:
          path: ~/.cache/debrief-libduckdb
          key: libduckdb-${{ runner.os }}-${{ hashFiles('apps/debrief/crates/debrief-store-duck/scripts/fetch-libduckdb.sh') }}

      - name: libduckdb (prebuilt, pinned SHA-256)
        shell: bash
        run: |
          # Checked on its own: `eval "$(...)"` would swallow a failed download and go on with no or another libduckdb (CI 7822).
          if ! duckdb_env=$(bash crates/debrief-store-duck/scripts/fetch-libduckdb.sh "$HOME/.cache/debrief-libduckdb"); then
            echo "::error::could not fetch the pinned libduckdb (fetch-libduckdb.sh failed; its error is above). Re-run the job; if the download keeps failing, check the DuckDB release on GitHub."
            exit 1
          fi
          unset DUCKDB_LIB_DIR DUCKDB_INCLUDE_DIR
          eval "$duckdb_env"
          : "${DUCKDB_LIB_DIR:?fetch-libduckdb.sh did not set DUCKDB_LIB_DIR}"
          echo "DUCKDB_LIB_DIR=$DUCKDB_LIB_DIR" >> "$GITHUB_ENV"
          echo "DUCKDB_INCLUDE_DIR=$DUCKDB_INCLUDE_DIR" >> "$GITHUB_ENV"
          case "$RUNNER_OS" in
            Linux) echo "LD_LIBRARY_PATH=$DUCKDB_LIB_DIR:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV" ;;
            macOS) echo "DYLD_LIBRARY_PATH=$DUCKDB_LIB_DIR:${DYLD_LIBRARY_PATH:-}" >> "$GITHUB_ENV" ;;
            Windows) cygpath -w "$DUCKDB_LIB_DIR" >> "$GITHUB_PATH" ;;
          esac

      - uses: actions/cache@v4
        with:
          path: ~/.cache/debrief-bench-corpus
          key: store-bench-corpus-v1

      - name: Import, index and reads at 10M events (budgets asserted)
        env:
          DEBRIEF_BENCH_EVENTS: "10000000"
        # The import benchmark asserts the import budgets; the read benchmark reports every operation against the
        # 0.5 s / 300 MB budgets (DEBRIEF_BENCH_STRICT=1 enforces them once the known misses in ADR 0014 are fixed).
        run: |
          export DEBRIEF_BENCH_DIR="$HOME/.cache/debrief-bench-corpus" DEBRIEF_BENCH_STORE="${RUNNER_TEMP:-/tmp}/debrief-bench-store"
          cargo test --release -p debrief-store-duck --test bench -- --nocapture
          cargo test --release -p debrief-store-duck --test bench_reads -- --nocapture

      - name: The worker's memory budgets (20 copies of the samples)
        env:
          DEBRIEF_BENCH_COPIES: "20"
        run: |
          cargo test --release -p debrief-store-worker --test it worker:: -- --nocapture

  # Records a fully green scheduled run for this commit; `plan` skips the next scheduled run while main is unchanged.
  # Never runs when anything failed, so a red commit is retried every night.
  nightly-mark:
    name: nightly-mark
    needs: [plan, bench, store-bench]
    if: github.event_name == 'schedule' && success() && needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/garage:ubuntu-24.04-20261023-r5
    defaults:
      run:
        working-directory: .
    steps:
      - name: Marker file
        run: |
          mkdir -p .nightly-green
          echo "${{ github.sha }}" > .nightly-green/sha

      - uses: actions/cache/save@v4
        with:
          path: .nightly-green
          key: debrief-bench-nightly-green-${{ github.sha }}
