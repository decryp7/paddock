# Nightly: real-world files that cannot be committed, downloaded at test time into a temporary folder.
# EVTX-ATTACK-SAMPLES (GPL-3.0, LICENSE.GPL; downloaded for the run, never committed; pinned commit and SHA-256) through the Windows plugin's EVTX importer over the
# real IPC: no panic, no plugin crash or memory-cap stop, events with timestamps. Failures name the file only.
# See crates/debrief-plugins/tests/it/evtx_corpus.rs. Never runs on push: it needs the network and takes minutes.

name: debrief-corpus

on:
  schedule:
    - cron: "43 14 * * *" # 22:43 UTC+8
  workflow_dispatch:

env:
  # The fallback switch of conformance/ci/kit.sh (WP-1): set the repository variable to shell and every kit step runs its script.
  PADDOCK_CI_KIT: ${{ vars.PADDOCK_CI_KIT }}
  CARGO_TERM_COLOR: always
  # The test is off unless this is set; the verified archive (about 6 MB, pinned by commit and SHA-256) is cached.
  DEBRIEF_EVTX_CORPUS: "1"
  DEBRIEF_CORPUS_CACHE: ${{ github.workspace }}/.corpus-cache

# Every step runs in the app's folder (ADR 0014: Debrief lives in apps/debrief) unless its job says otherwise.
defaults:
  run:
    working-directory: apps/debrief

jobs:
  # Decides whether this run is needed at all:
  # the nightly run is skipped while main is unchanged since the last green one.
  plan:
    name: plan
    runs-on: ubuntu-latest
    container:
      # The paddock-ci image: ./dev (the schedule-skip step) runs there.
      image: dev.decryptology.net/decryp7/paddock-ci:v2
    outputs:
      run: ${{ steps.plan.outputs.run }}
    defaults:
      run:
        working-directory: .
    steps:
      # A scheduled run ends early while a train is in CI (ADR 0093 amendment 2026-11-12); the action needs the checkout.
      - uses: actions/checkout@v4
        if: github.event_name == 'schedule'
      - id: train
        if: github.event_name == 'schedule'
        uses: ./.gitea/actions/schedule-skip
        with:
          workflow: debrief-corpus.yml
          dev-token: ${{ secrets.BUILD_INPUTS_TOKEN }}

      # Exact-key lookup only: nothing is downloaded. The marker is saved by the nightly-mark job after a fully green run.
      - uses: actions/cache/restore@v4
        id: green
        if: github.event_name == 'schedule'
        with:
          path: .nightly-green
          key: debrief-corpus-nightly-green-${{ github.sha }}
          lookup-only: true

      - name: Decide
        id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          GREEN: ${{ steps.green.outputs.cache-hit }}
          TRAIN_SKIP: ${{ steps.train.outputs.skip }}
        run: |
          run=true
          if [ "$EVENT" = schedule ] && [ "$GREEN" = true ]; then
            run=false
            echo "::notice::main has not changed since the last green run ($SHA); skipping."
          fi
          if [ "$EVENT" = schedule ] && [ "$TRAIN_SKIP" = true ]; then
            run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  evtx:
    name: real-world EVTX corpus
    needs: [plan]
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/garage:ubuntu-24.04-20261023-r5
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # CARGO_BUILD_JOBS: this runner's share of the host (`./dev ci build-jobs` through conformance/ci/kit.sh; Linux keeps cargo's default).
      - uses: ./.gitea/actions/build-jobs

      # The garage image has only `stable`; rust-toolchain.toml names the pinned version, which rustup would download on every run.
      # RUSTUP_TOOLCHAIN outranks the file, so the image's own toolchain is used as it is (no network).
      - run: echo "RUSTUP_TOOLCHAIN=stable" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/debrief/target
            !apps/debrief/target/debug/incremental
          key: corpus-${{ runner.os }}-${{ hashFiles('apps/debrief/Cargo.lock') }}
          restore-keys: corpus-${{ runner.os }}-

      - uses: actions/cache@v4
        with:
          path: apps/debrief/.corpus-cache
          key: evtx-attack-samples-4ceed2f4706daf601c212a8f91c113dd85349a2c

      - name: EVTX-ATTACK-SAMPLES through the EVTX importer
        run: |
          cargo test -p debrief-plugins --test it evtx_corpus::

  # Records a fully green scheduled run for this commit; `plan` skips the next scheduled run while main is unchanged.
  # Never runs when anything failed, so a red commit is retried every night.
  nightly-mark:
    name: nightly-mark
    needs: [plan, evtx]
    if: github.event_name == 'schedule' && success() && needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    container:
      image: dev.decryptology.net/decryp7/garage:ubuntu-24.04-20261023-r5
    defaults:
      run:
        working-directory: .
    steps:
      - name: Marker file
        run: |
          mkdir -p .nightly-green
          echo "${{ github.sha }}" > .nightly-green/sha

      - uses: actions/cache/save@v4
        with:
          path: .nightly-green
          key: debrief-corpus-nightly-green-${{ github.sha }}
