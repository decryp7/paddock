# cargo-nextest settings for wiki (its own workspace). Locally: `cargo nextest run`; CI: `--profile ci`, the same
# profile as crates/.config/nextest.toml (no retries: a flaky test is fixed, not retried; a time budget; a JUnit report).

[profile.default]
test-threads = -1
slow-timeout = { period = "30s", terminate-after = 10 }

[profile.ci]
fail-fast = false
retries = 0
failure-output = "immediate-final"
# A CI job has its runner to itself.
test-threads = "num-cpus"
# Reported SLOW after 30 s and stopped, failing the run, after 60 s, so a test that waits on a timeout fails CI instead of
# slowing it down. A test that needs longer is a waiver below (an override with a `[profile.ci.junit]
# Written to <target>/nextest/ci/junit.xml.
path = "junit.xml"
