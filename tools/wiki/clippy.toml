# The family's clippy preset (lint/clippy.toml): programs start through paddock-proc.
disallowed-methods = [
    { path = "std::env::vars", reason = "panics on a variable that is not valid Unicode: read the environment through paddock_env::vars (skips and names it)" },
    # ADR 0100 amendment 2026-11-16: the environment is process-wide, and tests share one process under the plain harness; a
    # change made outside the test kit's lock is seen by every other test thread (the hermetic flake, fixed in 9ac185c24). Change
    # it through paddock_testkit::EnvLock (the one site that may), or a justified site carries #[expect(..., reason = "...")].
    { path = "std::env::set_var", reason = "the environment is process-wide: change it through paddock_testkit::EnvLock (ADR 0100), or justify the site with #[expect]" },
    { path = "std::env::remove_var", reason = "the environment is process-wide: change it through paddock_testkit::EnvLock (ADR 0100), or justify the site with #[expect]" },
    { path = "std::env::set_current_dir", reason = "the working folder is process-wide: start the child in the folder (`current_dir`) instead; a test that moved its process left every later child of a plain test run in a deleted folder (rule 89)" },
    # ER-47 / rule 84 (ADR 0100): clearing a child's environment strips the variables that restrict it (a download ban, an install ban,
    # an offline switch). paddock_env::clear_env (paddock_proc::clean_env) is the one function that clears, and it passes them.
    { path = "std::process::Command::env_clear", reason = "clear a child's environment through paddock_proc::clean_env (paddock_env::clear_env): it keeps the restricting variables (ER-47)" },
    { path = "tokio::process::Command::env_clear", allow-invalid = true, reason = "build the command with paddock_proc::command and clear it through paddock_proc::clean_env, which keeps the restricting variables (ER-47)" },
    # ADR 0021 amendment 2026-11-11 (D-P2): a canonical path keeps Windows' verbatim `\\?\` prefix and later meets git, cargo, text or a plain path. Go through paddock_env::winpath.
    { path = "std::fs::canonicalize", reason = "use paddock_env::winpath::real_for_tools (programs), real (display, Rust file APIs) or real_verbatim (Win32 long paths, compared only with verbatim paths); ADR 0021 amendment 2026-11-11" },
    { path = "std::path::Path::canonicalize", reason = "use paddock_env::winpath::real_for_tools (programs), real (display, Rust file APIs) or real_verbatim (Win32 long paths, compared only with verbatim paths); ADR 0021 amendment 2026-11-11" },
    { path = "std::process::Command::new", reason = "use paddock-proc: no console window on Windows, always bounded and killed with its parent" },
    { path = "std::env::temp_dir", reason = "tests use a scratch folder (tempfile) and production code uses an explicit folder" },
    # ADR 0033: nothing is ended by a bare pid. A pid may name another process by the time it is signalled; end it through
    # paddock-proc with a ProcessId, or through a handle or job this process owns. A justified site carries
    # #[expect(clippy::disallowed_methods, reason = "...")].
    { path = "libc::kill", allow-invalid = true, reason = "signals a bare pid: use paddock_proc::end / kill_tree with a ProcessId (ADR 0033)" },
    { path = "libc::killpg", allow-invalid = true, reason = "signals a process group by a bare pid: use paddock_proc::kill_tree with a ProcessId (ADR 0033)" },
    { path = "nix::sys::signal::kill", allow-invalid = true, reason = "signals a bare pid: use paddock_proc::end / ask with a ProcessId (ADR 0033)" },
    { path = "nix::sys::signal::killpg", allow-invalid = true, reason = "signals a process group by a bare pid: use paddock_proc::kill_tree with a ProcessId (ADR 0033)" },
    { path = "sysinfo::Process::kill", allow-invalid = true, reason = "ends a process found by pid: use paddock_proc::end with a ProcessId (ADR 0033)" },
    { path = "sysinfo::Process::kill_with", allow-invalid = true, reason = "ends a process found by pid: use paddock_proc::end / ask with a ProcessId (ADR 0033)" },
]
