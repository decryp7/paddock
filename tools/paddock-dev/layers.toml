# The layers of tools/paddock-dev's top-level modules, declared once (C178, rule 40, ER-21), in the shape of the crate split of
# docs/plans/paddock-dev-crate-split.md (branch docs/paddock-dev-split-plan, 9354c6308): section 2's crate table with the recommended
# diamond (section 2.1: host and repo both use core and not each other), and its seven reassignments of the ADR's sketch (places to host,
# escape to repo, tool_cache and host_tests to core, ci_run to repo, plan_cmd and load to ci), with generators filed in ci (B6).
# A layer's name is the crate it would become (the plan's paddock-dev-<name>); a layer `uses` the layers named here, each declared above
# it, and what those use. A module refers (`crate::<module>`) to its own layer or a used one, never another: the check reads this file and
# reports each production reference that breaks it, each module of src/ not listed here and each entry with no module in src/.
#
# The plan's splits are done (batches B1 to B5 and the moves of WP-4's last branch): git, repo_root, registers, subject, throttle, http (the
# `Http` port; its curl adapter stays in `wait`), git_diff and trailers (from merge_check), the error-line and exit-status wording in
# log_text, escape's CI edges as escape_ci, `landing_held` in pre_push. The remaining open items of the plan are B6, its optional diamond.

[[layer]]
name = "core"
modules = [
    "cargo_target",
    "child_env",
    "curl_config",
    "full_tree",
    "git",
    "git_diff",
    "git_env",
    "host_tests",
    "http",
    "input_hash",
    "job_outcome",
    "log_text",
    "nextest_log",
    "pathfind",
    "plan_cargo_lock",
    "priority",
    "process_env",
    "repo_inputs",
    "repo_root",
    "stop_signals",
    "test_cost",
    "test_sleeper",
    "throttle",
    "tool_cache",
    "trailers",
    "wait_lock",
]

[[layer]]
name = "host"
uses = ["core"]
modules = [
    "audit",
    "ci_build_env",
    "ci_build_jobs",
    "ci_dev_tool_store",
    "ci_dyno_linux_units",
    "ci_host",
    "ci_isolation",
    "ci_rust_pin",
    "ci_s3_guard",
    "ci_setup_rust",
    "ci_tool",
    "deps_cache",
    "disk",
    "health",
    "heavy_cmd",
    "heavy_install",
    "heavy_tool",
    "hook",
    "local_sccache",
    "locks",
    "locks_guard",
    "places",
    "release_isolation",
    "safe_remove",
    "slots",
    "wait",
    "worktree",
]

[[layer]]
name = "repo"
uses = ["core"]
modules = [
    "active_apps",
    "check",
    "check_ids",
    "ci_run",
    "escape",
    "gates",
    "ipc_endpoints",
    "lessons_driver",
    "os_placement",
    "plan",
    "plan_ci",
    "plan_gitea",
    "plan_graph",
    "plan_repo",
    "registers",
    "plan_since",
    "repo_model",
    "run_scope",
    "subject",
    "test_features",
]

[[layer]]
name = "ci"
uses = ["host", "repo"]
modules = [
    "ci_job_model",
    "ci_runs",
    "escape_ci",
    "generators",
    "load",
    "merge_check",
    "plan_cmd",
    "pr",
    "queue",
    "test_cache",
]

[[layer]]
name = "gates"
uses = ["ci"]
modules = [
    "mutants_gate",
    "pre_push",
]

[[layer]]
name = "bin"
uses = ["gates"]
modules = [
    "cli",
    "lib",
    "main",
]
