# `paddock-dev`: the developer and CI tool (ADR 0022). Its own Cargo workspace and lockfile (ADR 0014's third kind,
# `tools/<tool>/`): a dependency change here never touches crates/Cargo.lock, which the planner treats as an input of every
# crate. The shared crates are path dependencies; the files that decide the binary are listed in inputs.txt.
[workspace]
resolver = "3"
members = ["."]

[package]
name = "paddock-dev"
version = "0.1.0"
description = "Paddock's developer and CI tool: ./dev"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://dev.decryptology.net/decryp7/paddock"
publish = false
build = "build.rs"

[lib]
doctest = false # doctests are off (crates/README.md, "Doctests")

[[bin]]
name = "paddock-dev"
path = "src/main.rs"

[dependencies]
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
# Keep the key order of the JSON the planner prints (the recorded answers in tests/golden are in that order).
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
# ci_isolation: the {src} key of a kept build folder (ADR 0025 amendment); release_isolation: SHA-256 of the .crate archives.
sha2 = "0.10"
# The repository graph's TypeScript and JavaScript import edges (repo_model/ts.rs, ADR 0117 §10): oxc's parser and resolver resolve
# tsconfig paths and package exports, which a text scan cannot. They live here, not in paddock-repo-graph: as optional crate deps
# they changed paddock-workspace-hack, and oxc_resolver turns on serde_json's preserve_order, which --all-features unified into
# every shared crate (clippy result_large_err in paddock-mcp, measured in WP-3).
oxc_allocator = "0.159"
oxc_ast = "0.159"
oxc_ast_visit = "0.159"
oxc_parser = "0.159"
oxc_span = "0.159"
oxc_resolver = { version = "11.24", default-features = false }
# C102 (ipc_endpoints): the syn pass over non-test code and the register/ratchet files; the repository graph's Rust reads (repo_model/reads.rs).
syn = { version = "2", default-features = false, features = ["full", "parsing", "visit", "printing"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
# pre_push/reuse: the time a reused row was green, in RFC 3339 (jiff is the one date and time crate).
jiff = { version = "0.2", default-features = false, features = ["std"] }
paddock-cli = { path = "../../crates/paddock-cli" }
paddock-env = { path = "../../crates/paddock-env" }
paddock-proc = { path = "../../crates/paddock-proc" }
paddock-git = { path = "../../crates/paddock-git" }
# ci_s3_guard: the stall guard (a localhost proxy that cuts a request the store does not answer); no TLS stack without the `http` feature.
paddock-net = { path = "../../crates/paddock-net", default-features = false }
paddock-repo-graph = { path = "../../crates/paddock-repo-graph", features = ["git-history", "cargo-metadata", "content"] }
paddock-slots = { path = "../../crates/paddock-slots" }
yaml-rust2 = "0.13"
# disk: the usage index, as cargo's own global cache tracker is SQLite too (cargo clean gc). Bundled: no system library needed; MIT, SQLite is public domain.
rusqlite = { version = "0.41", features = ["bundled"] }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
ra-ap-rustc_lexer = "=0.184.0"
tree-sitter = "=0.27.2"
tree-sitter-bash = "=0.25.1"
tree-sitter-yaml = "=0.7.2"

[target.'cfg(unix)'.dependencies]
# fds.rs: the holder closes the descriptors it inherited.
libc = "0.2"
# pre_push: SIGINT and SIGTERM set a flag that ends the running gates' process trees (as tools/heavy does).
signal-hook = { version = "0.3", default-features = false }

[target.'cfg(windows)'.dependencies]
# pre_push: Ctrl+C sets the flag that ends the running gates (as tools/heavy does).
ctrlc = "3"
# fds.rs: every handle is made non-inheritable before the holder starts (Threading: the handle count); release_isolation: the file index.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
paddock-testkit = { path = "../../crates/paddock-testkit" }
paddock-testkit-start = { path = "../../crates/paddock-testkit-start" }

# Debug info as the cargo book's build-performance guide and crates/ have it: line tables for this workspace's code (backtraces still
# name file and line), none for dependencies. Every agent's and gate's build of ./dev wrote full debug info before
# (docs/research/2026-11-19-sccache.md, section 5). A debugger session with variables: CARGO_PROFILE_DEV_DEBUG=full for that build.
[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
debug = false

# C102 parses every Rust file of the repository (src/ipc_endpoints.rs): optimised parser crates keep that to seconds in a
# debug build too (27 s in a debug build before, measured 2026-11-09).
[profile.dev.package.syn]
opt-level = 3
[profile.dev.package.proc-macro2]
opt-level = 3
# The repository model parses about 2,200 JS/TS files with oxc on every graph build (the plan and its tests): 0.83 s in a debug build,
# 0.11 s with the parser crates optimised (measured 2026-11-24, docs/benchmarks.md, "the repository model's ownership test").
[profile.dev.package.oxc_parser]
opt-level = 3
[profile.dev.package.oxc_allocator]
opt-level = 3
[profile.dev.package.oxc_ast]
opt-level = 3
[profile.dev.package.oxc_span]
opt-level = 3
[profile.dev.package.oxc_syntax]
opt-level = 3
[profile.dev.package.oxc_diagnostics]
opt-level = 3
[profile.dev.package.oxc_data_structures]
opt-level = 3
[profile.dev.package.oxc_str]
opt-level = 3
[profile.dev.package.oxc_regular_expression]
opt-level = 3
[profile.dev.package.oxc_ecmascript]
opt-level = 3

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
