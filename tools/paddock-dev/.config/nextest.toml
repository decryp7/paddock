# cargo-nextest settings for paddock-dev (its own workspace). Locally: `cargo nextest run`; CI: `--profile ci`, the same
# profile as crates/.config/nextest.toml (no retries: a flaky test is fixed, not retried; a time budget; a JUnit report).

[profile.default]
test-threads = -1
slow-timeout = { period = "30s", terminate-after = 10 }

[profile.ci]
fail-fast = false
retries = 0
failure-output = "immediate-final"
# Every core, where a CI job has its host to itself. On a shared host (three macOS runners on one Mac) build-jobs.sh
# sets NEXTEST_TEST_THREADS to the job's core share, which overrides this (conformance/ci/build-jobs.sh).
test-threads = "num-cpus"
# Reported SLOW after 30 s and stopped, failing the run, after 60 s, so a test that waits on a timeout fails CI instead of
# slowing it down. A test that needs longer is a waiver below (an override with a `# waiver:` line saying why).
slow-timeout = { period = "30s", terminate-after = 2 }

# waiver: whole-repository "live" tests, which read every tracked file (git ls-files, git grep, a syn parse of every .rs file, node over
# every file); measured 2026-11-11 on the shared Mac (14 cores, `nextest --test-threads 4`, load 4-7, tree 2e988c03a): 0.3-9 s warm, 37 s
# and 114 s on a first pass over the tree, and on the contended CI Mac run 7924/7918/7929 they passed the 60 s budget (waiting on
# disk, git and node, not computing: the C102 scan itself is 3.2 s of CPU). The work is real and bounded (one pass over about 13 000
# files), so it gets four periods of 60 s; it is not a hidden flake (ER-12).
[[profile.ci.overrides]]
filter = "test(/^ipc_endpoints::the_repository_register_is_complete/) | test(/^check::live_/) | test(/^contracts::every_markdown_file_that_code_reads/)"
slow-timeout = { period = "60s", terminate-after = 4 }

# waiver: the two golden live tests that run scripts/affected.mjs over every edit class of the real tree (one node process per case);
# measured 2026-11-11: 13 s and 34 s on the shared Mac with a load of about 5, 147 s once and past the 240 s of the golden budget twice
# on the contended CI Mac (runs 7924, 7918, 7929). Eight periods of 60 s; the comparison with the JS planner is the point of the test.
# Listed before the golden:: override below: the first override that sets slow-timeout wins.
[[profile.ci.overrides]]
filter = "test(/^golden::live_(guard_edits|workflow_action)/)"
slow-timeout = { period = "60s", terminate-after = 8 }

# waiver: the golden tests run scripts/affected.mjs (Node) over the fixture repository for every recorded case and for the
# live change sets; on a loaded Windows host runner that takes about a minute, and what it compares is the point of the tool.
[[profile.ci.overrides]]
filter = "test(/^golden::/)"
slow-timeout = { period = "60s", terminate-after = 4 }

# waiver: not a longer budget. A skipped live comparison prints a ::notice:: (golden.rs `skip`); show the output of these tests so the notice is in the job log.
[[profile.ci.overrides]]
filter = "test(/^golden::live_/)"
success-output = "final"

# Every test that reads the repository graph runs `cargo metadata` over every workspace, and those runs queue on cargo's
# package-cache lock; started together on a loaded host runner (run 7787, macOS) they pass the 60 s budget while they wait.
[test-groups.repo-graph]
max-threads = 2

# waiver: not a longer budget. At most two of the tests that read the repository graph run at a time (the group above), which keeps
# each of them far inside the 60 s budget on a loaded host runner.
[[profile.ci.overrides]]
filter = "test(/^(golden|tree|inputs)::/) | test(/^cli::graph_affected/)"
test-group = "repo-graph"

[profile.ci.junit]
# Written to <target>/nextest/ci/junit.xml.
path = "junit.xml"
