# cargo-nextest settings for paddock-dev (its own workspace). Locally: `cargo nextest run`; CI: `--profile ci`, the same
# profile as crates/.config/nextest.toml (one retry that still fails the run (ER-12); a time budget; a JUnit report).

# Locally `cargo nextest run` is the way to run the tests (a plain `cargo test` has no per-test bound): a test that waits on
# something that never comes is stopped after 120 s and fails, instead of hanging the run (the slots probe test hung 23 minutes).
[profile.default]
# Bounded: a test still running after two minutes (four periods) is stopped and fails (ER-21, conformance C114); a test
# that needs longer is a named override with a `# waiver:` line, not a longer default.
test-threads = -1
slow-timeout = { period = "30s", terminate-after = 4 }

# waiver: the same whole-repository tests as the ci profile's overrides below (measured 2026-11-11: 42-49 s quiet, over 240 s under
# I/O load); eight periods of 60 s there, the same here, for the same named tests (the two measured 2026-11-18 below included).
[[profile.default.overrides]]
filter = "test(/^ipc_endpoints::the_repository_register_is_complete/) | test(/^check::live_/) | test(/^check_engine::this_working_tree_/) | test(/^check_c122::live_tree_/) | test(/^contracts::every_markdown_file_that_code_reads/) | test(/^golden::/)"
slow-timeout = { period = "60s", terminate-after = 8 }

[profile.ci]
# ADR 0103 (D2): a test whose child still holds its output 500 ms after the test ended is reported as LEAK. Report-only (ER-41):
# result = "pass" until the first green CI run with it on main, recorded here by run id; then "fail" (nextest 0.9.95 or later).
leak-timeout = { period = "500ms", result = "pass" }
fail-fast = false
retries = 1
flaky-result = "fail"
failure-output = "immediate-final"
# Every core, where a CI job has its host to itself. On a shared host (three macOS runners on one Mac) build-jobs.sh
# sets NEXTEST_TEST_THREADS to the job's core share, which overrides this (conformance/ci/build-jobs.sh).
test-threads = "num-cpus"
# Reported SLOW after 30 s and stopped, failing the run, after 60 s, so a test that waits on a timeout fails CI instead of
# slowing it down. A test that needs longer is a waiver below (an override with a `# waiver:` line saying why).
slow-timeout = { period = "30s", terminate-after = 2 }

# waiver: the whole-repository "live" tests read every tracked file (git ls-files, a syn parse of every .rs file, node over every file);
# measured 2026-11-11: 42-49 s quiet against over 240 s under I/O load, with files finishing all along. Each one also judges itself on
# progress (ADR 0071, `paddock_testkit::guarded`): it fails with its own message when it finishes no file for 120 s, so a hang is named
# and a slow disk is not called one. Four periods of 60 s are nextest's bound on the whole run, kept at the old size (not raised): a
# run over 240 s in total is still stopped here and is a finding about the host (ER-12).
# Two more tests by name, each measured on its own (2026-11-18, full ci-profile runs at a 15-minute load of 50 to 80 on the 14-core Mac,
# fix/paddock-dev-load-flakes; check::live_tree_, already here, took 46.5-48.4 s in the same runs):
# - check_engine::this_working_tree_: 58.8 s, 59.1 s, and stopped at 60.0 s then 45.8 s. It does not judge its own progress yet, so for
#   it the 240 s bound is the stop.
# - check_c122::live_tree_: 52.5-55.3 s after its quadratic walk was removed (stopped at 60 s on both tries in 3 of 3 runs before); on
#   train 15's member gate at a load of about 50 it was stopped at 120 s (before the fix).
# Another whole-tree test joins this list only when it is measured timing out, by name, with its numbers here.
[[profile.ci.overrides]]
filter = "test(/^ipc_endpoints::the_repository_register_is_complete/) | test(/^check::live_/) | test(/^check_engine::this_working_tree_/) | test(/^check_c122::live_tree_/)"
slow-timeout = { period = "60s", terminate-after = 4 }

# waiver: the whole-repository reads of the documentation contract; measured 2026-11-11 like the live tests above (waiting on disk, git
# and node, not computing), and without a unit of work to count. Four periods of 60 s.
[[profile.ci.overrides]]
filter = "test(/^contracts::every_markdown_file_that_code_reads/)"
slow-timeout = { period = "60s", terminate-after = 4 }

# waiver: the two golden live tests that run scripts/affected.mjs over every edit class of the real tree (one node process per case);
# measured 2026-11-11: 13 s and 34 s on the shared Mac with a load of about 5, 147 s once and past the 240 s of the golden budget twice
# on the contended CI Mac (runs 7924, 7918, 7929). Eight periods of 60 s; the comparison with the JS planner is the point of the test.
# Listed before the golden:: override below: the first override that sets slow-timeout wins.
[[profile.ci.overrides]]
filter = "test(/^golden::live_(guard_edits|workflow_action)/)"
slow-timeout = { period = "60s", terminate-after = 8 }

# waiver: the golden tests run scripts/affected.mjs (Node) over the fixture repository for every recorded case and for the
# live change sets; on a loaded Windows host runner that takes about a minute, and what it compares is the point of the tool.
[[profile.ci.overrides]]
filter = "test(/^golden::/)"
slow-timeout = { period = "60s", terminate-after = 4 }

# waiver: not a longer budget. A skipped live comparison prints a ::notice:: (golden.rs `skip`); show the output of these tests so the notice is in the job log.
[[profile.ci.overrides]]
filter = "test(/^golden::live_/)"
success-output = "final"

# Every test that reads the repository graph runs `cargo metadata` over every workspace, and those runs queue on cargo's
# package-cache lock; started together on a loaded host runner (run 7787, macOS) they pass the 60 s budget while they wait.
[test-groups.repo-graph]
max-threads = 2

# waiver: not a longer budget. At most two of the tests that read the repository graph run at a time (the group above), which keeps
# each of them far inside the 60 s budget on a loaded host runner.
[[profile.ci.overrides]]
filter = "test(/^(golden|tree|inputs|pre_push)::/) | test(/^cli::graph_affected/)"
test-group = "repo-graph"

[profile.ci.junit]
# Written to <target>/nextest/ci/junit.xml.
path = "junit.xml"

# The member audits: the repository-wide tests of tests/it, run by the member gate of `./dev merge check --gates` (`--member-gate`) on the
# merged tree (src/pre_push/gates.rs, `member_audits`). This filter is the one list of them (ER-42); `--no-tests=fail` makes a selection of
# nothing a failure, and tests/it/member_audits.rs checks that every clause below selects at least one test of the binary (the replay
# exclusion included), so a renamed audit shrinks nothing silently. They read every tracked file, so a clash between two members' changes
# shows here and not first in the train-wide run (ER-8).
# Measured 2026-11-17 (docs/benchmarks.md): the whole `it` binary minus the replay takes 130 s warm on the merged tree (over the 2 minutes
# the user was told to expect, with a 120 s stop on one test under load), so the list stays positive.
# Left out on purpose: the fixture goldens (build_jobs_golden, host_steps_golden) read no tracked tree, and
# golden::live_range_plans_match_affected_mjs_on_this_repositorys_first_parent_history: over 120 s, it replays the whole first-parent
# history and audits no fresh code; the train-wide run keeps it.
[profile.member-audits]
default-filter = '''
binary(it) & (
    (test(/^(dev_bin|cargo_target_lint|parity_corpus|tree|golden|check_allow_list|safe_remove_lint)::/)
        & !test(/^golden::live_range_plans_match_affected_mjs/))
    | test(/^check::live_/)
    | test(/^check_c1[0-9]{2}::(live_|this_working_tree_)/)
    | test(/^check_engine::this_working_tree_/)
    | test(/^inputs::(heavy_)?inputs_txt_matches_cargo_metadata/)
    | test(/^ipc_endpoints::the_repository_register_is_complete/)
    | test(/^contracts::every_markdown_file_that_code_reads/)
    | test(/^generators::the_registry_of_the_repository/)
)
'''
# Every failure of the run is listed, as in the ci profile.
fail-fast = false

# waiver: not a longer budget; the same group as the ci profile, at most two of the tests that read the repository graph at a time.
[[profile.member-audits.overrides]]
filter = "test(/^(golden|tree|inputs|pre_push)::/) | test(/^cli::graph_affected/)"
test-group = "repo-graph"
