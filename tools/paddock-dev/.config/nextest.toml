# cargo-nextest settings for paddock-dev (its own workspace). Locally: `cargo nextest run`; CI: `--profile ci`, the same
# profile as crates/.config/nextest.toml (one retry that still fails the run (ER-12); a time budget; a JUnit report).

# Locally `cargo nextest run` is the way to run the tests (a plain `cargo test` has no per-test bound): a test that waits on
# something that never comes is stopped after 120 s and fails, instead of hanging the run (the slots probe test hung 23 minutes).
[profile.default]
# Bounded: a test still running after two minutes (four periods) is stopped and fails (ER-21, conformance C114); a test
# that needs longer is in a cost class below, or a named override with a `# waiver:` line, not a longer default.
test-threads = -1
slow-timeout = { period = "30s", terminate-after = 4 }

# ---- Test cost classes (ADR 0121): the one place for the concurrency and the time budget of whole-repository tests ----
# A test declares its class by the prefix of its function's name (src/test_cost.rs, `Class`): `graph_` runs `cargo metadata`, `tree_`
# reads the whole real tree (every tracked file, a parse of every source, the conformance line). These overrides are in the default
# profile, so every profile (ci, member-audits) inherits them after its own (nextest's per-test overrides). No other override sets a test
# group or threads (src/test_cost.rs checks the table with the TOML parser). The graph class is checked at run time (`test_cost::charge`
# at every place that starts `cargo metadata`), the tree class by its cost (`./dev ci test-cost` over nextest's output).
#
# Concurrency (ER-48): each class test takes two of the run's test threads and each class group holds at most two of them, so at most
# four class tests run at once in a run, on at most 8 of its threads. A CI job's test threads are its core share (build-jobs: Linux
# 30 cores / 6 lanes = 5, Windows 16 / 3 = 5) or, on the shared Mac, the measured 8 for tests that mostly wait (3 lanes x 8 on 12 usable
# cores, the ER-48 exception in build-jobs). The class tests are the ones that do not mostly wait (one core each, busy: syn, node, cargo),
# so they are held to at most four per job, the Mac lane's core share of 4, and to two at a time where a lane has 5 threads (2 x 2 = 4
# <= 5). Before this, every whole-tree test of a job could run at once beside the heavy jobs on the host: run 8830 macOS (job 47411)
# ran every whole-tree test 5 to 15 times slower than locally.
# Time tiers (ADR 0121; the user, 2026-11-24: "Test should run no matter the load"). A wall-clock stop is a hang backstop, not a
# performance limit, in Bazel's tiers: moderate 300 s, long 900 s, eternal 3600 s. A tier is at least a test's measured time times the
# worst measured contention, 15: in jobs 47411 (run 8830 macOS, two heavy jobs on the host) and 47644 the whole-tree tests ran 5 to 15
# times their local time. The times are upper bounds of the tests' own work: their wall time in a full ci-profile run at 8 test threads on
# the shared 14-core Mac at a median 1-minute load of 39 (2026-11-24, docs/benchmarks.md "test cost classes"); `./dev test-guard` replaces
# them with measured CPU time (docs/benchmarks.md "test time tiers"). Unclassed (ci profile): longest 16.3 s x 15 = 245 s, moderate 300 s.
# tree: 41.4 s x 15 = 621 s, long 900 s. graph: 26.9 s x 15 = 404 s without the train replay, long 900 s. The train replay: 79.2 s there,
# and its rule tables alone took 157.6 to 185.9 s of one thread (2026-11-23): 186 s x 15 = 2790 s, eternal 3600 s. The default profile
# keeps C114's 120 s for unclassed tests run by hand.
[test-groups.repo-graph]
max-threads = 4

[test-groups.whole-tree]
max-threads = 4

# waiver: the train replay's tier, eternal (12 periods of 300 s): its rule tables alone took 157.6 to 185.9 s of one thread (2026-11-23,
# docs/benchmarks.md), times the contention of 15 is 2790 s (the time tiers above). Before the class rows, so it wins over the graph tier.
[[profile.default.overrides]]
filter = "test(/^repo_graph_net::graph_train_replay_/)"
slow-timeout = { period = "300s", terminate-after = 12 }

# Class graph. Group: the runs of `cargo metadata` queue on cargo's package-cache lock, and readers started together on a loaded host
# runner passed 60 s while they waited (run 7787 macOS; the ownership test on Windows, run 8694 job 45791: stopped at 60 s, then 18.2 s;
# repo_model::code's syn test, run 8830 job 47457: stopped at 60 s beside the ownership test, then 23.4 s; the same test took 29.8 s
# running alone on the Windows runner, run 8838, half the old unclassed 60 s stop, so it has no margin there without the class). The
# class budget, four periods of 60 s, the budget the graph readers had as waivers (golden:: and the train replay), not raised.
# Measured: the golden tests took about a minute on a loaded Windows host runner (2026-11-18); the train replay took 98.4 s at six threads
# on the 14-core Mac at a 1-minute load of 8 to 13 (docs/benchmarks.md 2026-11-24, "which paddock-dev tests run cargo metadata") and 91.5
# s in four threads at a 15-minute load of 27 to 35 (2026-11-23); the rest of the class 0.2 to 22 s on the same Mac. Re-measured on the CI
# hosts from every landing run with `./dev ci test-cost --run <id>` (per-class longest test; docs/benchmarks.md 2026-11-24, "test cost
# classes").
# With the class (2026-11-24, 8 test threads at a median 1-minute load of 39 on the 14-core Mac, docs/benchmarks.md "test cost classes"):
# the 44 graph tests' longest 79.2 s (the train replay; 146.9 s before, at a median load of 42), median 7.3 s, one over 30 s.
# waiver: the graph class's tier, long (15 periods of 60 s), from the measurements above and the time tiers (ER-12).
[[profile.default.overrides]]
filter = "test(/(^|::)graph_[^:]*$/)"
test-group = "repo-graph"
threads-required = 2
slow-timeout = { period = "60s", terminate-after = 15 }

# Class tree. The class budget, four periods of 60 s, the budget the whole-repository live tests had as waivers, not raised for
# them. Measured 2026-11-11: 42 to 49 s quiet against over 240 s under I/O load, files finishing all along (each live test also judges
# itself on progress, ADR 0071: 120 s with no file finished is its own failure); 2026-11-18 at a 15-minute load of 50 to 80 on the 14-core
# Mac (full ci-profile runs): check_engine::this_working_tree_ 58.8 s, 59.1 s, stopped at 60 s, then 45.8 s; check_c122::live_tree_ 52.5
# to 55.3 s; check::live_tree_ 46.5 to 48.4 s. Tests that had the unclassed 60 s stop and join the class by measurement (their cost is a
# whole-tree read; the class's group and threads are what keeps them inside it): ci_run's conformance-line test, 7.7 to 12.1 s locally and
# stopped at 60 s on both tries of run 8830 macOS (job 47411, with heavy jobs 47415 and 47396 on the same host); the others are listed by
# name with their local times in docs/benchmarks.md 2026-11-24, "test cost classes".
# With the class (same runs): the 29 tree tests' longest 41.4 s (os_scoped's removal test, FLAKY at the 60 s stop before), median 7.8 s;
# ci_run's conformance-line test 11.6 s (59.1 s before). The eight tests/it pre_push:: tests that start `./dev check --pre-push` over the
# real tree are in the class: out of any group they took 22 to 52 s.
# waiver: the tree class's tier, long (15 periods of 60 s), from the measurements above and the time tiers (ER-12).
[[profile.default.overrides]]
filter = "test(/(^|::)tree_[^:]*$/)"
test-group = "whole-tree"
threads-required = 2
slow-timeout = { period = "60s", terminate-after = 15 }

[profile.ci]
# The parked merge queue (user, 2026-11-24; src/queue/mod.rs, src/pr/mod.rs): the tick's and the ledger's tests are not CI's. Every
# filterset of a CI run (`-E`) is intersected with this one; `--ignore-default-filter` runs them by hand.
default-filter = "not (test(/^queue::tests::/) | test(/^pr::/))"
# ADR 0103 (D2): a test whose child still holds its output 500 ms after the test ended is reported as LEAK. Report-only (ER-41):
# result = "pass" until the first green CI run with it on main, recorded here by run id; then "fail" (nextest 0.9.95 or later).
leak-timeout = { period = "500ms", result = "pass" }
fail-fast = false
retries = 1
flaky-result = "fail"
failure-output = "immediate-final"
# Every core, where a CI job has its host to itself. On a shared host (three macOS runners on one Mac) build-jobs.sh
# sets NEXTEST_TEST_THREADS to the job's core share, which overrides this (conformance/ci/build-jobs.sh).
test-threads = "num-cpus"
# The moderate tier (the time tiers above): reported SLOW every 60 s and stopped, failing the run, after 300 s, the backstop for a test
# that hangs. A hang is found sooner by `./dev test-guard` (no CPU time and no output); a test that needs longer is in a cost class
# (the class table above, which this profile inherits) or a named override with a `# waiver:` line saying why.
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci.junit]
# Written to <target>/nextest/ci/junit.xml.
path = "junit.xml"

# The member audits: the repository-wide tests of tests/it, run by the member gate of `./dev merge check --gates` (`--member-gate`) on the
# merged tree (src/pre_push/gates.rs, `member_audits`). This filter is the one list of them (ER-42); `--no-tests=fail` makes a selection
# of nothing a failure, and tests/it/member_audits.rs checks that every clause below selects at least one test of the binary (the replay
# exclusion included), so a renamed audit shrinks nothing silently. They read every tracked file, so a clash between two members' changes
# shows here and not first in the train-wide run (ER-8). Measured 2026-11-17 (docs/benchmarks.md): the whole `it` binary minus the replay
# takes 130 s warm on the merged tree (over the 2 minutes the user was told to expect, with a 120 s stop on one test under load), so the
# list stays positive. The source audits are selected by one rule, a test name (the last clause, outside the `binary(it)` group): every
# test of the tool's own modules named `no_source_file_*` reads the tool's `src` and fails on a source file that breaks a rule of the tool
# (the program names itself only through `self_exe`, git starts only through the builder). A member's own run never shows a guard from one
# branch meeting code from another; the combined tree does (train 15: the self_exe guard against the load-flakes member's tests). A new
# audit of the same kind takes the prefix and is in; no list here to forget (ER-42). tests/it/member_audits.rs and the gate's tests check
# the clause. A test renamed into a cost class keeps its clause with an optional `tree_` (ADR 0121). Left out on purpose: the fixture
# goldens (build_jobs_golden, host_steps_golden) read no tracked tree. (The first-parent history replay against affected.mjs, which was
# left out too, was removed with the script, 2026-11-18.) The lib's ownership test (repo_model, the last clause: every tracked file
# outside a project folder has an owner, docs/*.toml registers included) is in: a new register without an owner in docs/repo-graph.toml
# first failed in a train's full run three times (docs/shared-crate-features.toml, docs/ci-active-apps.toml on train 2026-11-25-a,
# docs/ci-dispatch-guards.toml in run 8999 of train 2026-11-26-c). The `it` binary's register test covers a subset of it on the slower
# graph path and stays out. The pre-push tests check that each `kind(lib)` clause selects a test of the lib.
[profile.member-audits]
default-filter = '''
(binary(it) & (
    (test(/^(dev_bin|cargo_target_lint|parity_corpus|tree|golden|check_allow_list|safe_remove_lint|build_cost)::/))
    | test(/^check::(tree_)?live_/)
    | test(/^check_c1[0-9]{2}::(tree_)?(live_|this_working_tree_)/)
    | test(/^check_engine::(tree_)?this_working_tree_/)
    | test(/^inputs::(heavy_)?inputs_txt_matches_cargo_metadata/)
    | test(/^ipc_endpoints::(tree_)?the_repository_register_is_complete/)
    | test(/^contracts::every_markdown_file_that_code_reads/)
    | test(/^generators::the_registry_of_the_repository/)
    | test(/^doctests_off::graph_every_library_target_has_doctests_off/)
))
| test(/::no_source_file_/)
| (kind(lib) & test(/^repo_model::tests::graph_every_tracked_file_of_the_tree_has_an_owner/))
'''
# Every failure of the run is listed, as in the ci profile.
fail-fast = false

