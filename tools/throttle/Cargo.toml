# `throttle`: the machine-wide heavy-step lock (replaces the shell scripts plock and engineering-playbook scripts/heavy.sh, ER-24).
# Its own Cargo workspace and lockfile (ADR 0014's third kind, `tools/<tool>/`). Package `throttle`, binary `throttle`: the thin
# program over the shared core `crates/paddock-throttle` (user decision 77, 2026-11-26), which holds admission, the queue, the load
# rules, the priority lane, the run log and the stall detector. The binary owns the command line wiring and the signal handlers.
[workspace]
resolver = "3"
members = ["."]

[package]
name = "throttle"
version = "0.1.0"
description = "throttle: one heavy step (cargo, npm, playwright, ...) at a time per machine. A FIFO queue, a load gate, identity-checked liveness, built-in troubleshooting log."
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://dev.decryptology.net/decryp7/paddock"
readme = "README.md"
publish = false # released as binaries by throttle-release.yml; the core is the crate paddock-throttle

[[bin]]
name = "throttle"
path = "src/main.rs"
doctest = false # doctests are off (crates/README.md, "Doctests")

[dependencies]
# The core: admission, the queue, the load rules, the priority lane, the run log and the stall detector (ER-22).
paddock-throttle = { version = "0.1", path = "../../crates/paddock-throttle", registry = "decryp7" }
# The shim: this program, called as cargo, npm, ..., is the shim of that tool (user decision 77).
paddock-shim = { version = "0.1", path = "../../crates/paddock-shim", registry = "decryp7" }
# Program start for the build-folder lookup (`git config`), bounded.
paddock-proc = { version = "0.2", path = "../../crates/paddock-proc", registry = "decryp7" }
paddock-env = { version = "0.1", path = "../../crates/paddock-env", registry = "decryp7" }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
signal-hook = { version = "0.3", default-features = false }

[target.'cfg(windows)'.dependencies]
ctrlc = "3"

[dev-dependencies]
paddock-testkit-start = { path = "../../crates/paddock-testkit-start" }
paddock-testkit = { path = "../../crates/paddock-testkit" }
tempfile = "3"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

# Debug info for development and test builds, as crates/Cargo.toml (docs/dev-setup.md, "Build profiles"): line tables are enough
# for backtraces with file and line, and dependencies get none, which makes the objects smaller and linking faster. A debugger
# session that needs variables sets `CARGO_PROFILE_DEV_DEBUG=full` for that build.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
