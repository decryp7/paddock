# `throttle`: the machine-wide heavy-step lock (replaces the shell scripts plock and engineering-playbook scripts/heavy.sh, ER-24).
# Its own Cargo workspace and lockfile (ADR 0014's third kind, `tools/<tool>/`). Package `paddock-throttle`, binary `throttle`.
[workspace]
resolver = "3"
members = ["."]

[package]
name = "paddock-throttle"
version = "0.1.0"
description = "throttle: one heavy step (cargo, npm, playwright, ...) at a time per machine. A FIFO queue, a load gate, identity-checked liveness, built-in troubleshooting log."
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://dev.decryptology.net/decryp7/paddock"
readme = "README.md"
publish = ["decryp7"]

[lib]
doctest = false # doctests are off (crates/README.md, "Doctests")
name = "throttle"
path = "src/lib.rs"

[[bin]]
name = "throttle"
path = "src/main.rs"

[dependencies]
# Process identity (pid + OS start time, rule 53 / ADR 0033), kill_tree, lower_priority: shared, not copied (ER-22).
paddock-proc = { version = "0.2", path = "../../crates/paddock-proc", registry = "decryp7" }
# winpath: a canonical path without the Windows verbatim prefix (the home guard compares it with plain paths).
paddock-env = { version = "0.1", path = "../../crates/paddock-env", registry = "decryp7" }
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
# probe.rs: the signal-0 existence probe (EPERM counts as alive).
libc = "0.2"
signal-hook = { version = "0.3", default-features = false }

[target.'cfg(windows)'.dependencies]
ctrlc = "3"
# probe.rs: the real file index of a directory (GetFileInformationByHandle).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
paddock-testkit-start = { path = "../../crates/paddock-testkit-start" }
paddock-testkit = { path = "../../crates/paddock-testkit" }
tempfile = "3"
proptest = { version = "1", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

# Debug info for development and test builds, as crates/Cargo.toml (docs/dev-setup.md, "Build profiles"): line tables are enough
# for backtraces with file and line, and dependencies get none, which makes the objects smaller and linking faster. A debugger
# session that needs variables sets `CARGO_PROFILE_DEV_DEBUG=full` for that build.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
