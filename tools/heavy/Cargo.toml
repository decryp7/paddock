# `heavy`: the machine-wide heavy-step lock (replaces the shell scripts plock and engineering-rules scripts/heavy.sh, ER-24).
# Its own Cargo workspace and lockfile (ADR 0014's third kind, `tools/<tool>/`). Package `paddock-heavy`, binary `heavy`.
[workspace]
resolver = "3"
members = ["."]

[package]
name = "paddock-heavy"
version = "0.1.0"
description = "heavy: one heavy step (cargo, npm, playwright, ...) at a time per machine. A FIFO queue, a load gate, identity-checked liveness, built-in troubleshooting log."
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://dev.decryptology.net/decryp7/paddock"
publish = ["decryp7"]

[lib]
name = "heavy"
path = "src/lib.rs"

[[bin]]
name = "heavy"
path = "src/main.rs"

[dependencies]
# Process identity (pid + OS start time, rule 53 / ADR 0033), kill_tree, lower_priority: shared, not copied (ER-22).
paddock-proc = { version = "0.1", path = "../../crates/paddock-proc", registry = "decryp7" }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
# probe.rs: the signal-0 existence probe (EPERM counts as alive).
libc = "0.2"
signal-hook = { version = "0.3", default-features = false }

[target.'cfg(windows)'.dependencies]
ctrlc = "3"
# probe.rs: the real file index of a directory (GetFileInformationByHandle).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
proptest = { version = "1", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
