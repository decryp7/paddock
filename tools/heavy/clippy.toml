# The family's clippy preset (lint/clippy.toml): programs start through paddock-proc.
disallowed-methods = [
    { path = "std::process::Command::new", reason = "use paddock-proc: no console window on Windows, always bounded and killed with its parent" },
    { path = "std::env::temp_dir", reason = "tests use a scratch folder (tempfile) and production code uses an explicit folder" },
    # ADR 0033: nothing is ended by a bare pid. A pid may name another process by the time it is signalled; end it through
    # paddock-proc with a ProcessId, or through a handle or job this process owns. A justified site carries
    # #[expect(clippy::disallowed_methods, reason = "...")].
    { path = "libc::kill", allow-invalid = true, reason = "signals a bare pid: use paddock_proc::end / kill_tree with a ProcessId (ADR 0033)" },
    { path = "libc::killpg", allow-invalid = true, reason = "signals a process group by a bare pid: use paddock_proc::kill_tree with a ProcessId (ADR 0033)" },
    { path = "nix::sys::signal::kill", allow-invalid = true, reason = "signals a bare pid: use paddock_proc::end / ask with a ProcessId (ADR 0033)" },
    { path = "nix::sys::signal::killpg", allow-invalid = true, reason = "signals a process group by a bare pid: use paddock_proc::kill_tree with a ProcessId (ADR 0033)" },
    { path = "sysinfo::Process::kill", allow-invalid = true, reason = "ends a process found by pid: use paddock_proc::end with a ProcessId (ADR 0033)" },
    { path = "sysinfo::Process::kill_with", allow-invalid = true, reason = "ends a process found by pid: use paddock_proc::end / ask with a ProcessId (ADR 0033)" },
]

allow-unwrap-in-tests = true
allow-expect-in-tests = true
