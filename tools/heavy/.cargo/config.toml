# Machine-local settings, git-ignored: ci.toml, written by the shared build-folder action on CI's host runners
# (build.target-dir: the job's build folder outside the checkout, as configuration because sccache hashes CARGO_TARGET_DIR).
# The repo root's .cargo/config.toml (linker, registry) applies as well.
include = [{ path = "ci.toml", optional = true }]
