[package]
name = "dyno-agent"
description = "Dyno's background agent: sampling, history, rules, cleanup and the plugin host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "dyno-agent"
path = "src/main.rs"

[dependencies]
dyno-core.workspace = true
dyno-platform.workspace = true
dyno-ipc.workspace = true
dyno-plugin-host.workspace = true
rusqlite = { version = "0.40", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
trash = "5"
# The diagnostics bundle (MIT; the same build as Debrief's: deflate via the Rust zlib-rs, no C code).
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
# Content hashes for the duplicate file finder (MIT OR Apache-2.0; already in the tree through other dependencies).
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
dyno-helper.workspace = true
plist = "1"
tempfile.workspace = true

[lints]
workspace = true
