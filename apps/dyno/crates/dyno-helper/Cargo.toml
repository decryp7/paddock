[package]
name = "dyno-helper"
description = "Dyno's minimal privileged helper: read-only answers that need administrator rights (programs' network traffic), installed on the user's click (ADR 0016)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
build = "build.rs"

[lib]
name = "dyno_helper"
path = "src/lib.rs"

[[bin]]
name = "dyno-helper"
path = "src/main.rs"

[dependencies]
dyno-core.workspace = true
dyno-helper-service = { path = "../dyno-helper-service" }
paddock-service = { path = "../../../../crates/paddock-service" }
paddock-watch = { path = "../../../../crates/paddock-watch", features = ["notify"] }
paddock-jobs = { path = "../../../../crates/paddock-jobs" }
paddock-env = { path = "../../../../crates/paddock-env" }
paddock-ipc.workspace = true
log = { version = "0.4", features = ["kv"] }
dyno-platform.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Runs the daemon under the Service Control Manager (MIT OR Apache-2.0).
windows-service = "0.8"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
