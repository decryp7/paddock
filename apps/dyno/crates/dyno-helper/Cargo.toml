[package]
name = "dyno-helper"
description = "Dyno's minimal privileged helper: read-only answers that need administrator rights (programs' network traffic), installed on the user's click (ADR 0016)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
build = "build.rs"

[lib]
name = "dyno_helper"
path = "src/lib.rs"

[[bin]]
name = "dyno-helper"
path = "src/main.rs"

[dependencies]
dyno-core.workspace = true
dyno-helper-service = { path = "../dyno-helper-service" }
paddock-service = { path = "../../../../crates/paddock-service" }
paddock-watch = { path = "../../../../crates/paddock-watch", features = ["notify"] }
paddock-jobs = { path = "../../../../crates/paddock-jobs" }
paddock-env = { path = "../../../../crates/paddock-env" }
paddock-ipc.workspace = true
log = { version = "0.4", features = ["kv"] }
dyno-platform.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
paddock-testkit = { path = "../../../../crates/paddock-testkit" }
# The test doubles (ADR 0033): only here, so a build without test targets cannot name them.
dyno-platform = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
