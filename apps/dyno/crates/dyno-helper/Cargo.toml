[package]
name = "dyno-helper"
description = "Dyno's minimal privileged helper: read-only answers that need administrator rights (programs' network traffic), installed on the user's click (ADR 0016)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
build = "build.rs"

[lib]
doctest = false # doctests are off (crates/README.md, "Doctests")
name = "dyno_helper"
path = "src/lib.rs"

[[bin]]
name = "dyno-helper"
path = "src/main.rs"

[dependencies]
dyno-core.workspace = true
dyno-helper-service = { path = "../dyno-helper-service" }
paddock-service = { path = "../../../../crates/paddock-service" }
paddock-watch = { path = "../../../../crates/paddock-watch", features = ["notify"] }
paddock-jobs = { path = "../../../../crates/paddock-jobs" }
paddock-env = { path = "../../../../crates/paddock-env" }
paddock-ipc.workspace = true
log = { version = "0.4", features = ["kv"] }
dyno-platform.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
paddock-watch = { path = "../../../../crates/paddock-watch", features = ["test-support"] }
paddock-service = { path = "../../../../crates/paddock-service", features = ["test-support"] }
paddock-jobs = { path = "../../../../crates/paddock-jobs", features = ["test-support"] }
# The ending harness of ADR 0072 (the ending test in src/server.rs).
paddock-ipc = { workspace = true, features = ["test-support"] }
paddock-testkit = { path = "../../../../crates/paddock-testkit" }
# The test doubles (ADR 0033): only here, so a build without test targets cannot name them.
dyno-platform = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true

[package.metadata.paddock]
# What this crate's tests read that the test cache's reads extractor cannot resolve (ADR 0116 §2, user decision 122), as globs from the
# repository root; `[]` says the blind reads touch no repository file.
# `src/server.rs` test: the endings register and ratchet. `src/orphan.rs` walks up a path the caller gives (not a repository path).
# Root rules (ADR 0116 §6), read site by site: also `current_exe` (the test binary started again, or files beside it: build output);
# paths taken from the environment (`HOME`, `XDG_*`, `OUT_DIR`, `CARGO_*`, tool and runtime folders, folders a test passes). None is
# a repository file outside the globs.
test-reads = [
    "docs/ipc-endpoints.toml",
    "docs/ipc-endpoint-ratchet.toml",
]
