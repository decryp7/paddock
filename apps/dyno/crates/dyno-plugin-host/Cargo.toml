[package]
name = "dyno-plugin-host"
description = "Runs Dyno plugins out of process: discovery, start, timeouts, memory caps, restart with backoff, quarantine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

# A misbehaving plugin for this crate's own tests (panics, hangs, exits, garbage, memory hog, wrong id). Never shipped.
[[bin]]
name = "dyno-test-plugin"
path = "src/bin/test_plugin.rs"
test = false
doc = false

[dependencies]
paddock-ipc.workspace = true
log = { version = "0.4", features = ["kv"] }
dyno-plugin-api.workspace = true
serde.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
