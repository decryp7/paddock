[package]
name = "dyno-bench"
description = "Dyno's benchmark runner: one short-lived process per benchmark, started by the agent on the user's click"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "dyno-bench"
path = "src/main.rs"

[dependencies]
dyno-core.workspace = true
# The clock the repetition driver takes (ManualClock in tests).
paddock-bench = { path = "../../../../crates/paddock-bench" }
serde_json.workspace = true
# Run-time choice of the widest vector unit (AVX-512, AVX2 with FMA, NEON) for the SIMD kernels (MIT OR Apache-2.0; ADR 0030 D8).
multiversion = "0.9"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_SystemInformation"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
paddock-testkit = { path = "../../../../crates/paddock-testkit" }
tempfile.workspace = true

[lints]
workspace = true
