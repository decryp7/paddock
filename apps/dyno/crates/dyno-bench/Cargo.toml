[package]
name = "dyno-bench"
description = "Dyno's benchmark runner: one short-lived process per benchmark, started by the agent on the user's click"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
doctest = false # doctests are off (crates/README.md, "Doctests")

[[bin]]
name = "dyno-bench"
path = "src/main.rs"

[dependencies]
# The one constructor of a program's Command (counted for budget tests).
paddock-env = { path = "../../../../crates/paddock-env" }
dyno-core.workspace = true
# The clock the repetition driver takes (ManualClock in tests).
paddock-bench = { path = "../../../../crates/paddock-bench" }
serde_json.workspace = true
# Run-time choice of the widest vector unit (AVX-512, AVX2 with FMA, NEON) for the SIMD kernels (MIT OR Apache-2.0; ADR 0030 D8).
multiversion = "0.9"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_SystemInformation"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
paddock-testkit = { path = "../../../../crates/paddock-testkit" }
tempfile.workspace = true

[lints]
workspace = true

[package.metadata.paddock]
# What this crate's tests read that the test cache's reads extractor cannot resolve (ADR 0116 §2, user decision 122), as globs from the
# repository root; `[]` says the blind reads touch no repository file.
# `build.rs` reads this crate's own `macos/Info.plist`.
# Root rules (ADR 0116 §6), read site by site: also paths taken from the environment (`HOME`, `XDG_*`, `OUT_DIR`, `CARGO_*`, tool
# and runtime folders, folders a test passes). None is a repository file outside the globs.
test-reads = []
