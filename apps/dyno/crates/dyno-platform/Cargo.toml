[package]
name = "dyno-platform"
description = "Dyno's OS adapters (Windows, macOS) behind dyno-core's port traits"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
dyno-core.workspace = true
serde.workspace = true
serde_json.workspace = true
plist = "1"
log = { version = "0.4", features = ["kv"] }
starship-battery = "0.12"
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk", "network", "component", "user"] }
dns-lookup = "4.0.2"
jiff = "0.2"
# Child processes the family's way (ER-22): a process group killed as a whole, a kill-on-close job object on Windows, lower priority.
paddock-proc = { path = "../../../../crates/paddock-proc" }
paddock-jobs = { path = "../../../../crates/paddock-jobs" }
# The helper checks a downloaded tool package against its own pinned SHA-256 (ADR 0027 section 7).
sha2 = "0.10"
# Keep awake and sleep/wake notifications (ADR 0032, D3); the fakes are what tests use.
paddock-power = { path = "../../../../crates/paddock-power" }
# The SecureOn password of a Wake-on-LAN device is never in the database or the logs (ADR 0032, D6): an owner-only file on macOS, the
# OS credential store elsewhere. The `keyring` feature is enabled for other targets only, so the Keychain adapter does not exist in a
# macOS build (a Keychain read waits behind a password dialog after every update).
paddock-secrets = { path = "../../../../crates/paddock-secrets" }

[target.'cfg(not(target_os = "macos"))'.dependencies]
paddock-secrets = { path = "../../../../crates/paddock-secrets", features = ["keyring"] }

[target.'cfg(windows)'.dependencies]
wmi = { version = "0.18", default-features = false }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WNet",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Com",
    "Win32_System_JobObjects",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_Shutdown",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_RestartManager",
    "Win32_System_SystemInformation",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# The test doubles (`fake`, `FakeCounters`, `FakeThrottle`, `FakeWear`, `FakeBattery`, `FakeWakeTimer`, `WolPorts::fake`). Enable it in
# [dev-dependencies] only (ADR 0033): resolver 2 keeps dev-dependency features out of a build with no test targets, so a shipped binary
# cannot name a fake. crates/dyno-platform/tests/no_ungated_doubles.rs and scripts/check-shipped.test.mjs keep that true.
test-support = ["dyno-core/test-support", "paddock-power/test-support"]

[dev-dependencies]
tempfile.workspace = true
# The unit tests compile this crate with cfg(test); the doubles of the crates below do not, so they ask for them.
dyno-core = { workspace = true, features = ["test-support"] }
paddock-power = { path = "../../../../crates/paddock-power", features = ["test-support"] }

[lints]
workspace = true

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# Sockets with their owning process on Linux (/proc/net) (MIT/Apache-2.0); macOS reads the kernel's socket lists (Dyno ADR 0026) and Windows the IP
# Helper tables itself (src/windows/net.rs).
netstat2 = "0.11"
