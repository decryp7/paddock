[package]
name = "dyno-platform"
description = "Dyno's OS adapters (Windows, macOS) behind dyno-core's port traits"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
dyno-core.workspace = true
serde.workspace = true
serde_json.workspace = true
plist = "1"
starship-battery = "0.12"
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk", "network", "component", "user"] }
dns-lookup = "4.0.2"
jiff = "0.2"
# Child processes the family's way (ER-22): a process group killed as a whole, a kill-on-close job object on Windows, lower priority.
paddock-proc = { path = "../../../../crates/paddock-proc" }

[target.'cfg(windows)'.dependencies]
wmi = { version = "0.18", default-features = false }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_WNet",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_RestartManager",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[target.'cfg(not(windows))'.dependencies]
# Sockets with their owning process on macOS (libproc) and Linux (/proc/net) (MIT/Apache-2.0); Windows reads the IP
# Helper tables itself (src/windows/net.rs).
netstat2 = "0.11"
