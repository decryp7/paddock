[package]
name = "dyno-app"
description = "Dyno: measures and explains your PC (tray app and window over the Dyno agent)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors = ["decryp7"]
publish = false

[lib]
name = "dyno_app_lib"
# rlib only: the desktop binary links the rlib. Tauri's template also builds a staticlib (iOS) and a cdylib (Android) on
# every build, which cost 25-38% of an incremental debug rebuild (docs/research/2026-10-29-link-time.md). Add them back
# only for a mobile target.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }
# build.rs patches TAURI_CONFIG (no externalBin copy while the sidecars are placeholders).
serde_json.workspace = true

[dependencies]
dyno-core.workspace = true
paddock-ipc.workspace = true
# Only for `Dirs`, `Discovery` and `service::Service` (the agent's per-user service registration); the app never links to
# the sensors by calling them (ADR 0002: the agent measures, the app is a client).
dyno-agent.workspace = true
# The OS time zone for "Readings paused at 14:28" in the popup's agent notice (the agent already links it).
dyno-platform.workspace = true
# Widget layouts (family ADR 0035): the popup's layout and values, the menu bar items.
paddock-widgets = { path = "../../../../crates/paddock-widgets" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The name-based GUID of a tray item (tray_identity).
sha2 = "0.10"
# "macos-private-api": the transparent window with vibrancy on macOS (tauri.macos.conf.json `macOSPrivateApi`); a no-op
# elsewhere. It must sit here, not under a target table: tauri-build checks only this list against the config.
tauri = { version = "2.12.4", features = ["tray-icon", "image-png", "macos-private-api"] }
# The Paddock app shell (ADR 0012): the plugin and the crates whose types the app names itself (path dependencies inside the
# monorepo).
paddock-shell = { path = "../../../../crates/paddock-shell", features = ["tray", "install", "native-dialogs"] }
paddock-commands = { path = "../../../../crates/paddock-commands", features = ["tauri"] }
paddock-dialogs = { path = "../../../../crates/paddock-dialogs", features = ["tauri"] }
paddock-health = { path = "../../../../crates/paddock-health", features = ["tauri"] }
paddock-jobs = { path = "../../../../crates/paddock-jobs", features = ["tauri"] }
# The start judge, stall report and discovery-hint helpers (ADR 0031, rule 53).
paddock-proc = { path = "../../../../crates/paddock-proc" }
# Report a problem: Dyno's own section beside paddock-diag's, the app's folders and the log handle the dialog's Logging section drives.
paddock-diag = { path = "../../../../crates/paddock-diag", features = ["tauri"] }
paddock-env = { path = "../../../../crates/paddock-env" }
paddock-log = { path = "../../../../crates/paddock-log" }
# Dyno's MCP tools: two reads and two actions behind the user's opt-in (ADR 0032, D7).
paddock-mcp = { path = "../../../../crates/paddock-mcp" }
paddock-secrets = { path = "../../../../crates/paddock-secrets", features = ["keyring"] }
# The shared launchd readers and the repair decision (a pending or running job is never stale).
paddock-service = { path = "../../../../crates/paddock-service" }
paddock-settings = { path = "../../../../crates/paddock-settings", features = ["tauri"] }
paddock-startup = { path = "../../../../crates/paddock-startup", features = ["tauri"] }
paddock-updater = { path = "../../../../crates/paddock-updater", features = ["tauri", "install"] }
paddock-download = { path = "../../../../crates/paddock-download", features = ["tauri"] }
paddock-window = { path = "../../../../crates/paddock-window", features = ["tauri", "tray", "wry"] }
log = { version = "0.4", features = ["kv"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2.4.0"
tauri-plugin-dialog = "2.7.3"
# The installer behind the shell's updater (`PluginInstaller`): verifies the package signature again and installs it.
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls"] }

[target.'cfg(windows)'.dependencies]
# The taskbar's light/dark setting (tray icon), read only.
winreg = "0.56"
# The taskbar window's DPI (the notification-area icon size).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
# The GUID provider for the tray icons (the vendored, patched copy: apps/dyno/vendor/PATCHES.md).
tray-icon = { version = "=0.25.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# The session bus: whether a StatusNotifier host shows the tray icons (tray_host.rs). The blocking API with a call timeout; the
# same crate paddock-power uses for logind.
zbus = { version = "5", features = ["blocking-api"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Registering the bundled launch agent with SMAppService (macOS 13+).
objc2 = "0.6"
# The autosave-name provider for the menu-bar items (the vendored, patched copy: apps/dyno/vendor/PATCHES.md).
tray-icon = { version = "=0.25.1", default-features = false }
# ControlCenter's and Dyno's process start time from the kernel (tray_platform).
libc = "0.2"
# NSStatusItem.autosaveName of the menu-bar items (tray_identity).
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSStatusItem", "NSButton", "NSView", "NSWindow", "NSResponder", "NSApplication", "NSGraphics", "NSFont", "NSFontDescriptor", "NSRunningApplication", "NSWorkspace", "libc", "objc2-core-foundation"] }
# The CoreText adapter of the tray text port (tray_text.rs): the system font, drawn by the system into an alpha bitmap.
objc2-core-foundation = "0.3.2"
objc2-core-graphics = { version = "0.3.2", features = ["CGBitmapContext", "CGColorSpace", "CGContext", "CGImage", "CGWindow"] }
objc2-core-text = { version = "0.3.2", features = ["CTLine", "CTFont", "CTStringAttributes", "CTFontDescriptor", "CTFontTraits"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError", "NSUserDefaults", "NSObject", "NSArray", "NSDictionary", "NSValue", "NSDate"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService"] }

[dev-dependencies]
# The capabilities are resolved through Tauri's own ACL in the tests.
tauri-utils = "2.10"
toml = "0.9"
# The shell plugin on Tauri's mock runtime (no window, no user folders).
tauri = { version = "2.12.4", features = ["test"] }
paddock-shell = { path = "../../../../crates/paddock-shell", features = ["tray", "mock-runtime"] }
# The menu bar state, to check what the native menu does with Dyno's model.
paddock-menu = { path = "../../../../crates/paddock-menu", features = ["tauri"] }
# The user-files service the shell manages, to check About's releases link has its state.
paddock-files = { path = "../../../../crates/paddock-files", features = ["tauri"] }
# Tests start an in-process agent over the fake platform (never the real sensors).
dyno-platform.workspace = true
tempfile.workspace = true

[lints]
workspace = true
