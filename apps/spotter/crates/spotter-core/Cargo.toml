[package]
name = "spotter-core"
description = "Spotter's pure core: versions, sources and their parsers, filters, schedules, notification policy, watch state, configuration and its migration (ADR 0001)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors = ["decryp7"]
publish = false

[lib]
doctest = false # doctests are off (crates/README.md, "Doctests")

[dependencies]
croner.workspace = true
jiff.workspace = true
quick-xml.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
url = "2.5"
ego-tree = "0.11"
scraper = { version = "0.29", default-features = false }

[lints]
workspace = true

# What this crate's tests read that the test cache's reads extractor cannot resolve (ADR 0116 §2, user decision 122), as globs from the
# repository root; `[]` says the blind reads touch no repository file.
# `src/source/web_page.rs`: `.ancestors()` of an HTML node (a tree of the page), not a path.
[package.metadata.paddock]
test-reads = []
