[package]
name = "spotter-core"
description = "Spotter's pure core: versions, sources and their parsers, filters, schedules, notification policy, watch state, configuration and its migration (ADR 0001)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors = ["decryp7"]
publish = false

[dependencies]
croner.workspace = true
jiff.workspace = true
quick-xml.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
time.workspace = true
toml.workspace = true
url = "2.5"
ego-tree = "0.11"
scraper = { version = "0.29", default-features = false }
# Widget layouts (family ADR 0035): the closed catalogue of the tray popup lives here.
paddock-widgets = { path = "../../../../crates/paddock-widgets" }
# TypeScript for the catalogue and value types (generated into the UI's core/generated/widgets.ts).
ts-rs = "11.1"

[dev-dependencies]
# `testing::sync_generated`, the stale-file check of the generated TypeScript.
paddock-commands = { path = "../../../../crates/paddock-commands" }

[lints]
workspace = true
