[package]
name = "spotter-render"
description = "Spotter renderer: a self-contained Chromium driver (CDP) behind the PageRenderer port"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors = ["decryp7"]
publish = false

[dependencies]
spotter-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
toml.workspace = true
paddock-proc = { path = "../../../../crates/paddock-proc" }
tokio.workspace = true
reqwest.workspace = true
tungstenite.workspace = true
zip.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The identity of a pid a stand-in wrote (launch.rs tests, rule 53) and the kit's bounded poll.
paddock-testkit = { path = "../../../../crates/paddock-testkit" }
paddock-testkit-start = { path = "../../../../crates/paddock-testkit-start" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }

# The stand-in's go FIFO is opened non-blocking (O_NONBLOCK, ENXIO) in the launch tests.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[lints]
workspace = true
