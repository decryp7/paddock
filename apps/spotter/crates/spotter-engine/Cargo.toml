[package]
name = "spotter-engine"
description = "Spotter's engine: SQLite state and history, polite fetching, the scheduler, the check pipeline and the facade the shell calls"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors = ["decryp7"]
publish = false

[lib]
doctest = false # doctests are off (crates/README.md, "Doctests")

[dependencies]
# The shared atomic file replace (a temporary name of its own per write).
paddock-env = { path = "../../../../crates/paddock-env" }
spotter-core.workspace = true
spotter-sources.workspace = true
reqwest.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
url = "2.5"
rusqlite = { version = "0.41", features = ["bundled"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "aws-lc-rs", "rustls-platform-verifier"] }
base64 = "0.22"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
