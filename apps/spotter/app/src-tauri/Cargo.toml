[package]
name = "spotter-app"
description = "Spotter — watches for new releases anywhere and tells you the moment one appears: tray app and window"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors = ["decryp7"]
publish = false

[lib]
name = "spotter_app_lib"
# rlib only: the desktop binary links the rlib. Tauri's template also builds a staticlib (iOS) and a cdylib (Android) on
# every build, which cost 25-38% of an incremental debug rebuild (docs/research/2026-10-29-link-time.md). Add them back
# only for a mobile target.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
spotter-core.workspace = true
spotter-engine.workspace = true
spotter-render.workspace = true
spotter-sources.workspace = true
# The Paddock app shell (ADR 0012): the plugin and the crates whose types the app names itself (path dependencies inside the
# monorepo; an app outside it names them from the `decryp7` registry, crates/README.md "Consuming the crates").
paddock-shell = { path = "../../../../crates/paddock-shell", features = ["tray", "install"] }
paddock-commands = { path = "../../../../crates/paddock-commands", features = ["tauri"] }
paddock-dialogs = { path = "../../../../crates/paddock-dialogs", features = ["tauri"] }
paddock-health = { path = "../../../../crates/paddock-health", features = ["tauri"] }
paddock-jobs = { path = "../../../../crates/paddock-jobs", features = ["tauri"] }
paddock-download = { path = "../../../../crates/paddock-download", features = ["tauri"] }
paddock-settings = { path = "../../../../crates/paddock-settings", features = ["tauri"] }
paddock-startup = { path = "../../../../crates/paddock-startup", features = ["tauri"] }
paddock-updater = { path = "../../../../crates/paddock-updater", features = ["tauri", "install"] }
paddock-widgets = { path = "../../../../crates/paddock-widgets" }
paddock-window = { path = "../../../../crates/paddock-window", features = ["tauri", "tray", "wry"] }
log = { version = "0.4", features = ["kv"] }
iana-time-zone = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process"] }
# "macos-private-api": the transparent windows with vibrancy on macOS (tauri.macos.conf.json `macOSPrivateApi`); a
# no-op elsewhere. It must sit here, not under a target table: tauri-build checks only this list against the config.
tauri = { version = "2.12.4", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
# The installer behind the shell's updater (`PluginInstaller`): verifies the package signature again and installs it.
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls"] }
# Tokens, passwords and site cookies live in the OS credential store: Windows Credential Manager, macOS Keychain
# (Secret Service on Linux).
keyring = "4.2"
# Parses the test build's update feed URL (src/lib.rs `update_feed`).
url = "2"

[target.'cfg(unix)'.dependencies]
# statvfs: whether the running copy sits on a read-only volume (src/login_item.rs); safe, no unsafe block.
rustix = { version = "1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
# The taskbar's light/dark setting, to pick the tray icon variant.
winreg = "0.56"
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[dev-dependencies]
tempfile.workspace = true
# The capabilities are resolved through Tauri's own ACL in the tests.
tauri-utils = "2.10"
toml = "0.9"
# The shell plugin on Tauri's mock runtime (no window, no user folders).
tauri = { version = "2.12.4", features = ["test"] }
paddock-shell = { path = "../../../../crates/paddock-shell", features = ["tray", "mock-runtime"] }
# The real-browser gate in the renderer's launch and self-test (rule 7): without it the app's own tests compile it out.
spotter-render = { workspace = true, features = ["testing"] }

[lints]
workspace = true
