# cargo-nextest settings for spotter's Cargo workspace (the same profiles as crates/.config/nextest.toml). Locally:
# `cargo nextest run --workspace`; CI (.gitea/workflows/ci.yml, apps/spotter/paddock.ci.json): `--profile ci`. nextest does not run doc tests:
# `cargo test --workspace --doc` runs them. nextest runs every test in its own process, so a lock a test file takes
# around a shared outside resource (a real browser, a port) is a test group here, not only a static Mutex.

[profile.default]
# Bounded: a test still running after two minutes (four periods) is stopped and fails (ER-21, conformance C114); a test
# that needs longer is a named override with a `# waiver:` line, not a longer default.
# One test per core but one (rules.md 13), so a full run leaves the machine usable.
test-threads = -1
slow-timeout = { period = "30s", terminate-after = 4 }

# waiver: the real-browser tests wait up to the 120 s START_GUARD of tests/real_browser.rs, then the page (the ci profile's waiver
# below says why); two minutes in total would stop them first.
[[profile.default.overrides]]
filter = "package(spotter-render) & binary(real_browser)"
slow-timeout = { period = "30s", terminate-after = 8 }


# CI: every failure reported, no retries (rules.md 5: a flaky test is fixed, not retried), a JUnit report.
[profile.ci]
fail-fast = false
retries = 0
failure-output = "immediate-final"
# Every core, where a CI job has its host to itself. On a shared host (three macOS runners on one Mac) build-jobs.sh
# sets NEXTEST_TEST_THREADS to the job's core share, which overrides this (conformance/ci/build-jobs.sh).
test-threads = "num-cpus"
# The time budget of one test (rule 40): reported SLOW after 30 s and stopped, failing the run, after 60 s. A test that
# needs longer is a waiver below: an override with a `# waiver:` line saying why (conformance/test/ci-actions.test.mjs).
slow-timeout = { period = "30s", terminate-after = 2 }

[profile.ci.junit]
path = "junit.xml"

# The real-browser tests (spotter-render's tests/real_browser.rs) take turns: started side by side, Chrome instances starve
# each other on a small runner. In one `cargo test` process a static Mutex serialised them; nextest gives every test its
# own process, so the group does it here.
[test-groups]
real-browser = { max-threads = 1 }

[[profile.default.overrides]]
filter = "package(spotter-render) & binary(real_browser)"
test-group = "real-browser"

# waiver: a real browser's start is judged on whether the process is alive or has exited, not on a clock (CI runs 7918 and 7929: a
# starved shared Mac let the browser wait over 20 s for its first CPU). A working start on a loaded host is waited for and only a
# hung one fails, after the 120 s START_GUARD of tests/real_browser.rs, then the page; the default 60 s would stop the tests first.
[[profile.ci.overrides]]
filter = "package(spotter-render) & binary(real_browser)"
slow-timeout = { period = "30s", terminate-after = 8 }
