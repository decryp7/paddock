      <stop offset="0" stop-color="#BFA2EE"/><stop offset="0.55" stop-color="#A686D6"/><stop offset="1" stop-color="#8B6DB5"/>
    </linearGradient>
    <radialGradient id="s24sheen" cx="330.72" cy="100" r="700.4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="s24edge" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.4"/><stop offset="0.3" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.75" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <clipPath id="s24clip"><path d="M383.41 100H640.59C722.19 100 763 100 806.92 113.89C854.88 131.34 892.66 169.12 910.11 217.08C924 261 924 301.81 924 383.41V640.59C924 722.19 924 763 910.11 806.92C892.66 854.88 854.88 892.66 806.92 910.11C763 924 722.19 924 640.59 924H383.41C301.81 924 261 924 217.08 910.11C169.12 892.66 131.34 854.88 113.89 806.92C100 763 100 722.19 100 640.59V383.41C100 301.81 100 261 113.89 217.08C131.34 169.12 169.12 131.34 217.08 113.89C261 100 301.81 100 383.41 100Z"/></clipPath>
    <filter id="s24gs" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#3C2D52" flood-opacity="0.32"/></filter>
    <filter id="s24ts" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/></filter>
    
  </defs>
  <path d="M383.41 100H640.59C722.19 100 763 100 806.92 113.89C854.88 131.34 892.66 169.12 910.11 217.08C924 261 924 301.81 924 383.41V640.59C924 722.19 924 763 910.11 806.92C892.66 854.88 854.88 892.66 806.92 910.11C763 924 722.19 924 640.59 924H383.41C301.81 924 261 924 217.08 910.11C169.12 892.66 131.34 854.88 113.89 806.92C100 763 100 722.19 100 640.59V383.41C100 301.81 100 261 113.89 217.08C131.34 169.12 169.12 131.34 217.08 113.89C261 100 301.81 100 383.41 100Z" fill="url(#s24bg)" filter="url(#s24ts)"/>
  <g clip-path="url(#s24clip)">
    <path d="M60 907.52L907.52 60L1022.8800000000001 60L60 1022.8800000000001Z" fill="#FFFFFF" opacity="0.08"/>
    <path d="M60 1080.56L1080.56 60L1113.52 60L60 1113.52Z" fill="#FFFFFF" opacity="0.08800000000000001"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#s24sheen)"/>
    <path d="M383.41 100H640.59C722.19 100 763 100 806.92 113.89C854.88 131.34 892.66 169.12 910.11 217.08C924 261 924 301.81 924 383.41V640.59C924 722.19 924 763 910.11 806.92C892.66 854.88 854.88 892.66 806.92 910.11C763 924 722.19 924 640.59 924H383.41C301.81 924 261 924 217.08 910.11C169.12 892.66 131.34 854.88 113.89 806.92C100 763 100 722.19 100 640.59V383.41C100 301.81 100 261 113.89 217.08C131.34 169.12 169.12 131.34 217.08 113.89C261 100 301.81 100 383.41 100Z" fill="none" stroke="url(#s24edge)" stroke-width="6"/>
    
  </g>
  <g filter="url(#s24gs)" transform="translate(512 512) scale(1) translate(-512 -512)"><g opacity="0.6"><path d="M727.6 607.99A236 236 0 0 1 607.99 727.6M416.01 727.6A236 236 0 0 1 296.4 607.99M296.4 416.01A236 236 0 0 1 416.01 296.4M607.99 296.4A236 236 0 0 1 727.6 416.01" fill="none" stroke="#2D1D43" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/><path d="M728 512L812 512M512 728L512 812M296 512L212 512M512 296L512 212" fill="none" stroke="#2D1D43" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M436 392L436 620L498.32 562.24L543.92 661.04L598.64 638.24L553.04 540.96L639.68 540.96Z" fill="#2D1D43" stroke="#2D1D43" stroke-width="20" stroke-linejoin="round"/></g>
</svg><text class="name" x="132" y="68" style="font-size:28px">How Sighter works</text>
<circle class="accfill" cx="224" cy="188" r="44"/><g class="gl" transform="translate(206 170) scale(1.5)"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.6" fill="currentColor"/></g><path class="conn" d="M282 188 L446 188"/><path class="chev" d="M440 182 l7 6 -7 6"/><text class="stepn" x="224" y="272" text-anchor="middle">STEP 1</text><text class="stept" x="224" y="302" text-anchor="middle">Record</text><text class="steps" x="224" y="330" text-anchor="middle">Windows or screens, plus</text><text class="steps" x="224" y="358" text-anchor="middle">input events.</text>
<circle class="accfill" cx="512" cy="188" r="44"/><g class="gl" transform="translate(494 170) scale(1.5)"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><rect x="8" y="8" width="8" height="8" rx="1"/></g><path class="conn" d="M570 188 L734 188"/><path class="chev" d="M728 182 l7 6 -7 6"/><text class="stepn" x="512" y="272" text-anchor="middle">STEP 2</text><text class="stept" x="512" y="302" text-anchor="middle">Identify</text><text class="steps" x="512" y="330" text-anchor="middle">OCR, templates, a</text><text class="steps" x="512" y="358" text-anchor="middle">detector and a vision</text><text class="steps" x="512" y="386" text-anchor="middle">model.</text>
<circle class="accfill" cx="800" cy="188" r="44"/><g class="gl" transform="translate(782 170) scale(1.5)"><path d="M4 7l2 2 3-3M4 16l2 2 3-3M12 8h8M12 17h8"/></g><path class="conn" d="M858 188 L1022 188"/><path class="chev" d="M1016 182 l7 6 -7 6"/><text class="stepn" x="800" y="272" text-anchor="middle">STEP 3</text><text class="stept" x="800" y="302" text-anchor="middle">Review</text><text class="steps" x="800" y="330" text-anchor="middle">Confirm what was not</text><text class="steps" x="800" y="358" text-anchor="middle">identified.</text>
<circle class="accfill" cx="1088" cy="188" r="44"/><g class="gl" transform="translate(1070 170) scale(1.5)"><circle cx="6" cy="6" r="2.4"/><circle cx="6" cy="18" r="2.4"/><circle cx="18" cy="12" r="2.4"/><path d="M8 7l8 4M8 17l8-4"/></g><path class="conn" d="M1146 188 L1310 188"/><path class="chev" d="M1304 182 l7 6 -7 6"/><text class="stepn" x="1088" y="272" text-anchor="middle">STEP 4</text><text class="stept" x="1088" y="302" text-anchor="middle">Train</text><text class="steps" x="1088" y="330" text-anchor="middle">A small detector per app,</text><text class="steps" x="1088" y="358" text-anchor="middle">versioned.</text>
<circle class="accfill" cx="1376" cy="188" r="44"/><g class="gl" transform="translate(1358 170) scale(1.5)"><circle cx="12" cy="12" r="6.5"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/></g><text class="stepn" x="1376" y="272" text-anchor="middle">STEP 5</text><text class="stept" x="1376" y="302" text-anchor="middle">Locate</text><text class="steps" x="1376" y="330" text-anchor="middle">Your tests ask; it</text><text class="steps" x="1376" y="358" text-anchor="middle">answers with a box.</text>
<line x1="80" x2="1520" y1="434" y2="434" stroke="var(--line)"/>
<text class="small" x="80" y="472">Pitwall supplies the vision model, Debrief opens run bundles and Pitcrew runs the tests.</text>
</svg>