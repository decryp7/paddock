<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="t d">
<title id="t">How Sighter works</title><desc id="d">Record, then Identify, then Review, then Train, then Locate. Pitwall supplies the vision model, Debrief opens run bundles and Pitcrew runs the tests.</desc>
<style>
:root{--ink:#14161A;--muted:#566070;--card:#FFFFFF;--line:#DDE1E8;--soft:#F1F3F7;--bar:#ECEEF2;--link:#8A93A3;--codebg:#F7F8FA;--acc:#884F92;--acct:#884F92;--accf:#975EA2;--glow:.20;--shadow:.22;--wbg:#FFFFFF}
@media (prefers-color-scheme: dark){:root{--ink:#F2F4F7;--muted:#A6AEBC;--card:#171A20;--line:#2B303A;--soft:#1B1E24;--bar:#20242C;--link:#667085;--codebg:#12151A;--acc:#C488CF;--acct:#C488CF;--glow:.26;--shadow:.55;--wbg:#0E0F12}}
text{font-family:-apple-system,"SF Pro Display","SF Pro Text","Segoe UI Variable Display","Segoe UI",Cantarell,"Noto Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums;fill:var(--ink)}
.lt{display:inline}.dk{display:none}
@media (prefers-color-scheme: dark){.lt{display:none}.dk{display:inline}}
.eyebrow{font-size:15px;font-weight:600;letter-spacing:.14em;fill:var(--acct)}
.h1{font-size:56px;font-weight:600;letter-spacing:-.025em}
.h2{font-size:42px;font-weight:600;letter-spacing:-.02em}
.sub{font-size:22px;fill:var(--muted)}
.small{font-size:20px;fill:var(--muted)}
.pilltxt{font-size:17px;font-weight:600;fill:var(--acct)}
.name{font-size:26px;font-weight:600;letter-spacing:-.01em}
.card{fill:var(--card);stroke:var(--line)}
.ph{fill:var(--soft);stroke:var(--link);stroke-width:1.5;stroke-dasharray:5 4}
.mono{font-weight:600;fill:var(--muted)}
.track{fill:none;stroke:var(--line);stroke-width:1.25;opacity:.8}
.gl{fill:none;stroke:var(--acct);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.accfill{fill:var(--acc);fill-opacity:.13}.accline{fill:var(--acc)}
.ptitle{font-size:29px;font-weight:600;letter-spacing:-.01em}
.pbody{font-size:21px;fill:var(--muted)}
.stepn{font-size:16px;font-weight:600;letter-spacing:.1em;fill:var(--muted)}
.stept{font-size:26px;font-weight:600}
.steps{font-size:21px;fill:var(--muted)}
.conn{fill:none;stroke:var(--link);stroke-width:1.5;stroke-linecap:round;stroke-dasharray:1 7}
.chev{fill:none;stroke:var(--link);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wtit{font-size:17px;font-weight:600;letter-spacing:.14em;fill:var(--muted)}
.wname{font-size:22px;font-weight:600}.wnote{font-size:20px;fill:var(--muted)}
.wbar{fill:var(--bar)}.wedge{fill:none;stroke:var(--line)}
.mbg{fill:var(--soft)}.mc{fill:var(--card);stroke:var(--line)}.mside{fill:var(--bar)}.mrule{fill:var(--line)}.ms{fill:var(--line)}
.mfield{fill:var(--soft);stroke:var(--line)}.mact{fill:var(--acc);fill-opacity:.14}.maccf{fill:var(--accf)}.mbox{fill:var(--acc);fill-opacity:.12;stroke:var(--acc);stroke-width:2}
.mt{font-size:14px;font-weight:500;fill:var(--ink)}.mm{font-size:13px;fill:var(--muted)}.mta{font-size:13px;font-weight:600;fill:var(--acct)}.mtw{font-size:12.5px;font-weight:600;fill:#fff}.mh{font-size:20px;font-weight:600;fill:var(--ink)}
.medge{fill:none;stroke:var(--link);stroke-width:1.5}.mcode{fill:var(--codebg);stroke:var(--line)}.mmono{font:13px ui-monospace,"SF Mono",Menlo,Consolas,monospace;fill:var(--ink)}.mmonoa{font:600 13px ui-monospace,"SF Mono",Menlo,Consolas,monospace;fill:var(--acct)}
.madd{fill:#2EA043;fill-opacity:.18}.mdel{fill:#F85149;fill-opacity:.16}.mrec{fill:#E5484D}.mcon{fill:var(--card);stroke:var(--acc);stroke-width:2}
</style><svg x="80" y="40" width="40" height="40" viewBox="60 60 904 904" overflow="visible">
  
