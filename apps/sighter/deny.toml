# cargo-deny: licences, security advisories, banned crates and sources.
# Run: cargo deny --workspace check

[graph]
all-features = false

[advisories]
# RustSec advisory database; unmaintained crates are reported for workspace dependencies only, transitive ones are
# Renovate's job.
unmaintained = "workspace"
yanked = "deny"

[licenses]
confidence-threshold = 0.9
# Sighter is MIT OR Apache-2.0 (LICENSE-MIT, LICENSE-APACHE). Dependencies must be permissive (or file-level MPL-2.0)
# so the dual licence holds; no GPL/LGPL/AGPL. Our crates are unpublished.
private = { ignore = true }
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "Unicode-3.0",
  "Unlicense",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]
# Non-crate binaries shipped in the bundle (cargo-deny cannot check these; the bundle check of the notices tooling
# will). Each entry is a named exception to the permissive-only rule, approved by the user, for that file only:
#
# - DirectML.dll 1.15.4 (NuGet Microsoft.AI.DirectML, SHA-256-pinned), Windows only, next to sighter-infer.exe.
#   Licence: Microsoft Software License Terms, Microsoft DirectX Machine Learning (DirectML), proprietary; may be
#   distributed only inside an application, not stand-alone. Reason: Sighter's ONNX Runtime build imports it to reach
#   DirectX 12 GPUs (NVIDIA, AMD, Intel) on Windows; the inference sidecar cannot start without it.
#   Condition: the DirectML gate of the spike passes (no outbound connection from sighter-infer, and no ETW/TraceLogging
#   provider registered by the DLL, or one shown to be inert); otherwise it is not shipped and Sighter uses the system
#   DirectML.dll through a delay-loaded import (or a CPU-only build), or the CPU.
#   Approved: user, 2026-10-29, conditional (docs/adr/0001-object-detector.md, "Licence exceptions").
#
# - NVIDIA CUDA runtime libraries (CUDA runtime, cuBLAS, cuDNN, and the others the pinned PyTorch CUDA wheels need):
#   NVIDIA CUDA EULA and the NVIDIA SDK licence with its cuDNN supplement, proprietary. Scope: training only, the
#   opt-in CUDA variant of the managed Python training runtime, downloaded on request from download.pytorch.org,
#   pypi.org and files.pythonhosted.org (never mirrored); never in the installer, never used by inference.
#   Reason: PyTorch has no other accelerator for NVIDIA GPUs.
#   Approved: user, 2026-10-29 (docs/adr/0001-object-detector.md, "Licence exceptions").

[bans]
# Duplicate versions are reported, not fatal: most come from the Tauri stack (wry, tao, gtk-rs on Linux), which pins
# older releases. Look at a new duplicate in the change that introduces it.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
