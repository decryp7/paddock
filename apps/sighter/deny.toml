# cargo-deny: licences, security advisories, banned crates and sources.
# Run: cargo deny --workspace check

[graph]
all-features = false

[advisories]
# RustSec advisory database; unmaintained crates are reported for workspace dependencies only, transitive ones are
# Renovate's job.
unmaintained = "workspace"
yanked = "deny"

[licenses]
confidence-threshold = 0.9
# Sighter is MIT OR Apache-2.0 (LICENSE-MIT, LICENSE-APACHE). Dependencies must be permissive (or file-level MPL-2.0)
# so the dual licence holds; no GPL/LGPL/AGPL. Our crates are unpublished.
private = { ignore = true }
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "Unicode-3.0",
  "Unlicense",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]
# Non-crate binaries shipped in the bundle (cargo-deny cannot check these; the bundle check of the notices tooling
# will). Each entry is a named exception to the permissive-only rule, approved by the user, for that file only:
#
# - DirectML.dll 1.15.4 (NuGet Microsoft.AI.DirectML, SHA-256-pinned), Windows only, next to sighter-infer.exe.
#   Licence: Microsoft Software License Terms, Microsoft DirectX Machine Learning (DirectML), proprietary; may be
#   distributed only inside an application, not stand-alone. Reason: Sighter's ONNX Runtime build imports it to reach
#   DirectX 12 GPUs (NVIDIA, AMD, Intel) on Windows; the inference sidecar cannot start without it.
#   Approved: user, 2026-10-29 (docs/adr/0001-object-detector.md, "Licence exceptions").

[bans]
# Duplicate versions are reported, not fatal: most come from the Tauri stack (wry, tao, gtk-rs on Linux), which pins
# older releases. Look at a new duplicate in the change that introduces it.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
