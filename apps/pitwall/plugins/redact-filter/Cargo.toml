[package]
name = "pitwall-redact-filter"
description = "Example Pitwall filter plugin: redacts e-mail addresses, IPv4 addresses and long hex/base64 secrets from request messages; optional local audit log with counts only"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
pitwall-plugin-api.workspace = true
regex.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
pitwall-plugin-host.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
pitwall-ipc.workspace = true
