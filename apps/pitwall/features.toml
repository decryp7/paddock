# Pitwall's features register (ADR 0052 §1.4, check C85, report-only for now; `conformance/src/checks/C85-features-register.mjs` says what the keys mean).
#
# One row per user-facing feature of 1.1, the chat included. Each row names the real-engine test that covers it (`tauri`, the
# shared real-app kit of ADR 0037 WP-7), its visible-outcome and real-layout rows (C86 and C89 will enumerate those), and, for a
# feature that depends on a platform (a privileged wire or not all three OS), a vm-smoke step for each OS it lists.
#
# Where a test does not exist the row says so in `owed`, with the reason and the date it ends (`owed_until`): nothing here names
# a test that is not in the tree (C85 looks each one up). `supporting` lists tests that exist but are not real-engine: Pitwall's
# Playwright specs run against the mock backend, and the Rust tests under crates/pitwall-server/tests/it run the real server
# against a fake engine (the one real-engine test, `llama_e2e.rs`, is manual and needs PITWALL_LLAMA_E2E=1). They are looked up
# and never counted.
#
# What is not covered by a row yet: the shell's own surfaces (About, Updates, What's new, Report a problem, Appearance, Logging,
# the confirmation dialog) belong to the shared shell and are tested there; the status-bar items and the tray widgets are not
# enumerated by C85 (it reads routes, dialogs, Settings pages, job kinds and the command table). Pitwall's HTTP APIs (the
# OpenAI, Anthropic and Ollama families and /x/v1) have no wire.toml (ADR 0052 WP-A1) and so no request kinds to cover; row
# `server.api` stands for them.

[[feature]]
id = "dashboard"
title = "Dashboard: live tiles, loaded models, history, events, pause and resume serving, release memory"
surfaces = [
  "route:/dashboard",
]
wires = [
  "app-command:overview",
  "app-command:history",
  "app-command:events",
  "app-command:usage_series",
  "app-command:set_serving",
  "app-command:release_memory",
  "app-command:unload_model",
]
platforms = ["macos", "windows", "linux"]
tests = {}
supporting = [
  "app/e2e/dashboard.e2e.ts#shows live tiles, loaded models with idle countdowns, a history chart and the events feed",
  "crates/pitwall-server/tests/it/discovery.rs#start_writes_serving_true_and_a_clean_stop_rewrites_it_false",
]
owed = ["tauri", "outcome", "layout"]
owed_why = "the real-app kit (ADR 0037 WP-7) is not built, so no test drives the real app; C86's outcome harness and the shared layout check (ADR 0052 §3.2) are not built either, and app/e2e specs run against the mock backend"
owed_until = "pitwall-v1.1.0"

