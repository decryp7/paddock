[package]
name = "pitwall-cli"
description = "The `pitwall` command-line tool: status, models, load, unload, pull, keys, presets, chat and bench over the local APIs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors = ["decryp7"]
publish = false

[lib]
name = "pitwall_cli"
path = "src/lib.rs"

[[bin]]
name = "pitwall"
path = "src/main.rs"

[dependencies]
pitwall-core.workspace = true
# The only way the CLI reaches the server: a client that cannot hold an address other than 127.0.0.1 (ADR 0001).
pitwall-loopback = { path = "../pitwall-loopback" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time", "io-util", "io-std"] }
# The family's log (ER-27, ER-22): `pitwall-cli.<day>.log` in the app's log folder, the same format as the app and the server.
paddock-log = { path = "../../../../crates/paddock-log" }
paddock-env = { path = "../../../../crates/paddock-env" }
log = { version = "0.4", features = ["kv"] }
# The server's admin.key, read as an owner-only secret file (ADR 0057 WP-4: no OS credential store).
paddock-secrets = { path = "../../../../crates/paddock-secrets" }

[dev-dependencies]
# A socket bound but not listening refuses connections on Linux and Windows (not macOS): "nothing listens" with the port held.
socket2 = { version = "0.6", features = ["all"] }
tempfile.workspace = true
# A held loopback port for "nothing answers there" (C39: a test never frees a port it probes).
paddock-testkit = { path = "../../../../crates/paddock-testkit" }
tokio = { workspace = true, features = ["rt", "net", "time", "io-util", "macros"] }

[lints]
workspace = true
