[package]
name = "pitwall-ipc"
description = "Pitwall's one IPC (ADR 0008): length-prefixed postcard frames on a private local stream, an authenticated handshake, a symmetric peer with credits and cancel, and the sandboxed plugin launcher (no network by default)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
getrandom.workspace = true
postcard.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Isolation",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[dev-dependencies]
proptest.workspace = true
