[package]
name = "pitwall-loopback"
description = "A small HTTP/1.1 client that can only reach 127.0.0.1 (engines, the server's management API)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors = ["decryp7"]
publish = false

[dependencies]
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "time", "rt", "macros"] }

[dev-dependencies]
tokio = { workspace = true, features = ["net", "time", "rt-multi-thread", "macros", "io-util"] }

[lints]
workspace = true
