[package]
name = "pitwall-server"
description = "Pitwall's server: the local OpenAI/Anthropic/Ollama-compatible API, engines, models and memory management"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors = ["decryp7"]
publish = false

[lib]
name = "pitwall_server"
path = "src/lib.rs"

[[bin]]
name = "pitwall-server"
path = "src/main.rs"

[dependencies]
pitwall-core.workspace = true
pitwall-loopback = { path = "../pitwall-loopback" }
# The service: the shared registration, host and watch (rule 55) and the one spec that the app builds from too; on Windows
# also where a LocalSystem service's program may be (plan B6): the folders Windows names and the protected-chain rule.
paddock-service = { path = "../../../../crates/paddock-service" }
pitwall-service = { path = "../pitwall-service" }
log = { version = "0.4", features = ["kv"] }
# Process memory as real memory per OS (physical footprint on macOS, PSS on Linux), never the resident size.
paddock-proc = { path = "../../../../crates/paddock-proc" }
# The family's log (ER-27, ER-22): one dated CLEF file per process in the app's log folder, redaction, panic hook, crash marker.
paddock-log = { path = "../../../../crates/paddock-log" }
paddock-env = { path = "../../../../crates/paddock-env" }
# The admin key's owner-only file (ADR 0057 WP-4): the one shared secret-file mechanism, never the OS credential store.
paddock-secrets = { path = "../../../../crates/paddock-secrets" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "matched-path"] }
bytes = "1"
flate2 = "1"
futures-util = "0.3"
getrandom.workspace = true
rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk"] }
tar = "0.4"
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "process", "fs", "io-util", "sync", "signal"] }
toml.workspace = true
zip = { version = "9", default-features = false, features = ["deflate"] }

# The signals of a console on Windows (os_signals.rs); the service's registration read back with DELETE access (service/windows.rs).
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Environment",
  "Win32_System_Memory",
  "Win32_System_RemoteDesktop",
  "Win32_System_Services",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "process", "fs", "io-util", "sync", "signal"] }

[lints]
workspace = true
