[package]
name = "pitwall-server"
description = "Pitwall's server: the local OpenAI/Anthropic/Ollama-compatible API, engines, models and memory management"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors = ["decryp7"]
publish = false

[lib]
name = "pitwall_server"
path = "src/lib.rs"

[[bin]]
name = "pitwall-server"
path = "src/main.rs"

[dependencies]
pitwall-core.workspace = true
pitwall-loopback = { path = "../pitwall-loopback" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
bytes = "1"
flate2 = "1"
futures-util = "0.3"
getrandom.workspace = true
rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk"] }
tar = "0.4"
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "process", "fs", "io-util", "sync", "signal"] }
toml.workspace = true
zip = { version = "9", default-features = false, features = ["deflate"] }

# The Windows service (Service Control Manager, session enumeration); see src/service/windows.rs.
[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Environment",
  "Win32_System_Memory",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "process", "fs", "io-util", "sync", "signal"] }

[lints]
workspace = true
