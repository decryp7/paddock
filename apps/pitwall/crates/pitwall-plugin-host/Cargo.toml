[package]
name = "pitwall-plugin-host"
description = "The host side of Pitwall's plugins (ADR 0008): discovery, sandboxed launch, and guarded calls (timeouts, memory caps, crash attribution, restart with backoff, quarantine) behind an async API"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# A fake plugin (crash, hang, flood, oversize, exit at start, network probe, ...) used only by the tests. Never bundled.
[[bin]]
name = "pitwall-fake-plugin"
path = "src/bin/fake_plugin.rs"
test = false

[dependencies]
pitwall-ipc.workspace = true
pitwall-plugin-api.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "io-util", "time"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }
