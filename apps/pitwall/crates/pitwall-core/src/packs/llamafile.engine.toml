# Built-in engine pack: llamafile (Mozilla.ai). One self-contained executable per platform (an "actually portable
# executable"), serving an OpenAI-compatible API. Experimental: it is not Pitwall's default engine.
format = 1
id = "llamafile"
name = "llamafile"
description = "Single-file llama.cpp distribution from Mozilla.ai (OpenAI-compatible server, CPU and GPU)."
version = "0.10.6"

[capabilities]
chat = true
embeddings = false
vision = false
tools = true

[launch]
# {engine_dir} is the folder the pack installed into; {host} is always 127.0.0.1.
command = "{engine_dir}/{binary}"
args = ["--server", "--nobrowser", "--host", "{host}", "--port", "{port}", "-m", "{model}", "-c", "{context}", "--alias", "{alias}"]

[health]
path = "/health"

[memory]
# Extra memory on top of the model file and KV cache.
overhead_mib = 768

