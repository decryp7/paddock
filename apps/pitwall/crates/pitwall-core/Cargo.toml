[package]
name = "pitwall-core"
description = "Pitwall's pure core: API translation, scheduling, memory policy, model fit, catalogs, keys and settings (no I/O)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors = ["decryp7"]
publish = false

[lib]
doctest = false # doctests are off (crates/README.md, "Doctests")

[dependencies]
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
# Widget layouts (family ADR 0035): the closed catalogue of the tray popup lives here.
paddock-widgets = { path = "../../../../crates/paddock-widgets" }
# `ItemResult` and `check_batch` (the one bound check of bulk calls, `mgmt::check_bulk`); also `testing::sync_generated` in tests.
paddock-commands = { path = "../../../../crates/paddock-commands" }
# TypeScript for the catalogue and value types (generated into the UI's core/generated/widgets.ts).
ts-rs = "11.1"

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
