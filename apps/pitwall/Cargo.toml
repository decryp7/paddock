[workspace]
members = [
  "crates/pitwall-core",
  "crates/pitwall-cli",
  "crates/pitwall-loopback",
  "crates/pitwall-server",
  "app/src-tauri",
]
resolver = "2"

# Shared by every member: `edition.workspace = true` etc.
[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.88"
repository = "https://dev.decryptology.net/decryp7/pitwall"
version = "1.1.0"

# Versions of the dependencies that two or more members use, so they stay on one version.
[workspace.dependencies]
pitwall-core = { path = "crates/pitwall-core" }
libc = "0.2"
regex = "1"
windows = "0.62"
base64 = "0.22"
getrandom = "0.3"
proptest = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1", default-features = false }
toml = "0.9"

# Dependencies are optimised even in debug builds; workspace crates stay at opt-level 0 for fast rebuilds.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
debug = "line-tables-only"

# Shipped builds (`cargo build --profile dist`, `tauri build -- --profile dist`).
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = true

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
