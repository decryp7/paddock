<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="t d">
<title id="t">How Pitwall works</title><desc id="d">Apps call one API, then Queue by priority, then Load on demand, then Answer and cache, then Release memory. Debrief, Spotter, Dyno and Sighter use it for AI; Pacenotes is served to it over MCP.</desc>
<style>
:root{--ink:#14161A;--muted:#566070;--card:#FFFFFF;--line:#DDE1E8;--soft:#F1F3F7;--bar:#ECEEF2;--link:#8A93A3;--codebg:#F7F8FA;--acc:#6D3FD6;--acct:#6D3FD6;--accf:#6D3FD6;--glow:.20;--shadow:.22;--wbg:#FFFFFF}
@media (prefers-color-scheme: dark){:root{--ink:#F2F4F7;--muted:#A6AEBC;--card:#171A20;--line:#2B303A;--soft:#1B1E24;--bar:#20242C;--link:#667085;--codebg:#12151A;--acc:#A58BFA;--acct:#A58BFA;--glow:.26;--shadow:.55;--wbg:#0E0F12}}
text{font-family:-apple-system,"SF Pro Display","SF Pro Text","Segoe UI Variable Display","Segoe UI",Cantarell,"Noto Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums;fill:var(--ink)}
.lt{display:inline}.dk{display:none}
@media (prefers-color-scheme: dark){.lt{display:none}.dk{display:inline}}
.eyebrow{font-size:15px;font-weight:600;letter-spacing:.14em;fill:var(--acct)}
.h1{font-size:56px;font-weight:600;letter-spacing:-.025em}
.h2{font-size:42px;font-weight:600;letter-spacing:-.02em}
.sub{font-size:22px;fill:var(--muted)}
.small{font-size:20px;fill:var(--muted)}
.pilltxt{font-size:17px;font-weight:600;fill:var(--acct)}
.name{font-size:26px;font-weight:600;letter-spacing:-.01em}
.card{fill:var(--card);stroke:var(--line)}
.ph{fill:var(--soft);stroke:var(--link);stroke-width:1.5;stroke-dasharray:5 4}
.mono{font-weight:600;fill:var(--muted)}
.track{fill:none;stroke:var(--line);stroke-width:1.25;opacity:.8}
.gl{fill:none;stroke:var(--acct);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.accfill{fill:var(--acc);fill-opacity:.13}.accline{fill:var(--acc)}
.ptitle{font-size:29px;font-weight:600;letter-spacing:-.01em}
.pbody{font-size:21px;fill:var(--muted)}
.stepn{font-size:16px;font-weight:600;letter-spacing:.1em;fill:var(--muted)}
.stept{font-size:26px;font-weight:600}
.steps{font-size:21px;fill:var(--muted)}
.conn{fill:none;stroke:var(--link);stroke-width:1.5;stroke-linecap:round;stroke-dasharray:1 7}
.chev{fill:none;stroke:var(--link);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wtit{font-size:17px;font-weight:600;letter-spacing:.14em;fill:var(--muted)}
.wname{font-size:22px;font-weight:600}.wnote{font-size:20px;fill:var(--muted)}
.wbar{fill:var(--bar)}.wedge{fill:none;stroke:var(--line)}
.mbg{fill:var(--soft)}.mc{fill:var(--card);stroke:var(--line)}.mside{fill:var(--bar)}.mrule{fill:var(--line)}.ms{fill:var(--line)}
.mfield{fill:var(--soft);stroke:var(--line)}.mact{fill:var(--acc);fill-opacity:.14}.maccf{fill:var(--accf)}.mbox{fill:var(--acc);fill-opacity:.12;stroke:var(--acc);stroke-width:2}
.mt{font-size:14px;font-weight:500;fill:var(--ink)}.mm{font-size:13px;fill:var(--muted)}.mta{font-size:13px;font-weight:600;fill:var(--acct)}.mtw{font-size:12.5px;font-weight:600;fill:#fff}.mh{font-size:20px;font-weight:600;fill:var(--ink)}
.medge{fill:none;stroke:var(--link);stroke-width:1.5}.mcode{fill:var(--codebg);stroke:var(--line)}.mmono{font:13px ui-monospace,"SF Mono",Menlo,Consolas,monospace;fill:var(--ink)}.mmonoa{font:600 13px ui-monospace,"SF Mono",Menlo,Consolas,monospace;fill:var(--acct)}
.madd{fill:#2EA043;fill-opacity:.18}.mdel{fill:#F85149;fill-opacity:.16}.mrec{fill:#E5484D}
</style><svg x="80" y="40" width="40" height="40" viewBox="60 60 904 904" overflow="visible">
  
  <defs>
    <linearGradient id="p19bg" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7B46DB"/><stop offset="0.55" stop-color="#5A24B0"/><stop offset="1" stop-color="#43198F"/>
    </linearGradient>
    <radialGradient id="p19sheen" cx="330.72" cy="100" r="700.4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p19edge" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.4"/><stop offset="0.3" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.75" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <clipPath id="p19clip"><path d="M383.41 100H640.59C722.19 100 763 100 806.92 113.89C854.88 131.34 892.66 169.12 910.11 217.08C924 261 924 301.81 924 383.41V640.59C924 722.19 924 763 910.11 806.92C892.66 854.88 854.88 892.66 806.92 910.11C763 924 722.19 924 640.59 924H383.41C301.81 924 261 924 217.08 910.11C169.12 892.66 131.34 854.88 113.89 806.92C100 763 100 722.19 100 640.59V383.41C100 301.81 100 261 113.89 217.08C131.34 169.12 169.12 131.34 217.08 113.89C261 100 301.81 100 383.41 100Z"/></clipPath>
    <filter id="p19gs" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#24094F" flood-opacity="0.32"/></filter>
    <filter id="p19ts" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/></filter>
    <mask id="p19m0" maskUnits="userSpaceOnUse" x="-2000" y="-2000" width="5000" height="5000"><rect x="-2000" y="-2000" width="5000" height="5000" fill="#fff"/><path d="M392 448V528M452 404V572M512 364V612M572 404V572M632 448V528" fill="none" stroke="#000" stroke-width="34" stroke-linecap="round"/></mask>
  </defs>
  <path d="M383.41 100H640.59C722.19 100 763 100 806.92 113.89C854.88 131.34 892.66 169.12 910.11 217.08C924 261 924 301.81 924 383.41V640.59C924 722.19 924 763 910.11 806.92C892.66 854.88 854.88 892.66 806.92 910.11C763 924 722.19 924 640.59 924H383.41C301.81 924 261 924 217.08 910.11C169.12 892.66 131.34 854.88 113.89 806.92C100 763 100 722.19 100 640.59V383.41C100 301.81 100 261 113.89 217.08C131.34 169.12 169.12 131.34 217.08 113.89C261 100 301.81 100 383.41 100Z" fill="url(#p19bg)" filter="url(#p19ts)"/>
  <g clip-path="url(#p19clip)">
    <path d="M60 907.52L907.52 60L1022.8800000000001 60L60 1022.8800000000001Z" fill="#FFFFFF" opacity="0.08"/>
    <path d="M60 1080.56L1080.56 60L1113.52 60L60 1113.52Z" fill="#FFFFFF" opacity="0.08800000000000001"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#p19sheen)"/>
    <path d="M383.41 100H640.59C722.19 100 763 100 806.92 113.89C854.88 131.34 892.66 169.12 910.11 217.08C924 261 924 301.81 924 383.41V640.59C924 722.19 924 763 910.11 806.92C892.66 854.88 854.88 892.66 806.92 910.11C763 924 722.19 924 640.59 924H383.41C301.81 924 261 924 217.08 910.11C169.12 892.66 131.34 854.88 113.89 806.92C100 763 100 722.19 100 640.59V383.41C100 301.81 100 261 113.89 217.08C131.34 169.12 169.12 131.34 217.08 113.89C261 100 301.81 100 383.41 100Z" fill="none" stroke="url(#p19edge)" stroke-width="6"/>
    
  </g>
  <g filter="url(#p19gs)" transform="translate(512 512) scale(1) translate(-512 -512)"><path d="M398 284H626A136 136 0 0 1 762 420V532A136 136 0 0 1 626 668H398A136 136 0 0 1 262 532V420A136 136 0 0 1 398 284ZM332 620L470 660L300 770Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="36" stroke-linejoin="round" mask="url(#p19m0)"/></g>
</svg><text class="name" x="132" y="68" style="font-size:28px">How Pitwall works</text>
<circle class="accfill" cx="224" cy="188" r="44"/><g class="gl" transform="translate(206 170) scale(1.5)"><path d="M8 8l-4 4 4 4M16 8l4 4-4 4M13.5 6l-3 12"/></g><path class="conn" d="M282 188 L446 188"/><path class="chev" d="M440 182 l7 6 -7 6"/><text class="stepn" x="224" y="272" text-anchor="middle">STEP 1</text><text class="stept" x="224" y="302" text-anchor="middle">Apps call one API</text><text class="steps" x="224" y="330" text-anchor="middle">OpenAI, Anthropic and</text><text class="steps" x="224" y="358" text-anchor="middle">Ollama on 127.0.0.1.</text>
<circle class="accfill" cx="512" cy="188" r="44"/><g class="gl" transform="translate(494 170) scale(1.5)"><path d="M4 7h16M4 12h12M4 17h8"/></g><path class="conn" d="M570 188 L734 188"/><path class="chev" d="M728 182 l7 6 -7 6"/><text class="stepn" x="512" y="272" text-anchor="middle">STEP 2</text><text class="stept" x="512" y="302" text-anchor="middle">Queue by priority</text><text class="steps" x="512" y="330" text-anchor="middle">Interactive first, then</text><text class="steps" x="512" y="358" text-anchor="middle">background and batch.</text>
<circle class="accfill" cx="800" cy="188" r="44"/><g class="gl" transform="translate(782 170) scale(1.5)"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12 4 7.5"/></g><path class="conn" d="M858 188 L1022 188"/><path class="chev" d="M1016 182 l7 6 -7 6"/><text class="stepn" x="800" y="272" text-anchor="middle">STEP 3</text><text class="stept" x="800" y="302" text-anchor="middle">Load on demand</text><text class="steps" x="800" y="330" text-anchor="middle">The model loads only if</text><text class="steps" x="800" y="358" text-anchor="middle">it fits in memory.</text>
<circle class="accfill" cx="1088" cy="188" r="44"/><g class="gl" transform="translate(1070 170) scale(1.5)"><path d="M4 5h16v11H9l-5 4z"/></g><path class="conn" d="M1146 188 L1310 188"/><path class="chev" d="M1304 182 l7 6 -7 6"/><text class="stepn" x="1088" y="272" text-anchor="middle">STEP 4</text><text class="stept" x="1088" y="302" text-anchor="middle">Answer and cache</text><text class="steps" x="1088" y="330" text-anchor="middle">Streamed replies; prompt</text><text class="steps" x="1088" y="358" text-anchor="middle">prefixes reused.</text>
<circle class="accfill" cx="1376" cy="188" r="44"/><g class="gl" transform="translate(1358 170) scale(1.5)"><rect x="7" y="7" width="10" height="10" rx="2"/><path d="M9 3v4M15 3v4M9 17v4M15 17v4M3 9h4M3 15h4M17 9h4M17 15h4"/></g><text class="stepn" x="1376" y="272" text-anchor="middle">STEP 5</text><text class="stept" x="1376" y="302" text-anchor="middle">Release memory</text><text class="steps" x="1376" y="330" text-anchor="middle">Freed when idle or when</text><text class="steps" x="1376" y="358" text-anchor="middle">pressure rises.</text>
<line x1="80" x2="1520" y1="434" y2="434" stroke="var(--line)"/>
<text class="small" x="80" y="472">Debrief, Spotter, Dyno and Sighter use it for AI; Pacenotes is served to it over MCP.</text>
</svg>