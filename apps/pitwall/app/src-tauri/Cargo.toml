[package]
name = "pitwall-app"
description = "Pitwall: tray app and window over the Pitwall server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors = ["decryp7"]
publish = false

[lib]
name = "pitwall_app_lib"
# rlib only: the desktop binary links the rlib. Tauri's template also builds a staticlib (iOS) and a cdylib (Android) on
# every build, which cost 25-38% of an incremental debug rebuild (docs/research/2026-10-29-link-time.md). Add them back
# only for a mobile target.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

# The shell depends on the management contract (pitwall-core) and the loopback-only HTTP client; never on
# pitwall-server (the server is a separate process) and never on an HTTP client of its own (ADR 0001).
[dependencies]
pitwall-core.workspace = true
pitwall-loopback = { path = "../../crates/pitwall-loopback" }
# The shared service crate (core only, no tauri feature): the launchctl parser and its stale rule.
# The shared executor of long operations (ADR 0020, ADR 0024 rule 3): job registry, phases, progress, cancel tokens.
paddock-jobs = { path = "../../../../crates/paddock-jobs" }
paddock-service = { path = "../../../../crates/paddock-service" }
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time", "sync", "rt", "macros"] }
# "macos-private-api": the tray popover's transparent window with vibrancy on macOS (tauri.macos.conf.json `macOSPrivateApi`;
# the main window is opaque, user 2026-10-30); a no-op
# elsewhere. It must sit here, not under a target table: tauri-build checks only this list against the config.
tauri = { version = "2.12.4", features = ["tray-icon", "image-png", "macos-private-api"] }
# The Paddock app shell (ADR 0012, ADR 0029): the plugin and the crates whose types the app names itself (path dependencies
# inside the monorepo). The shell owns the start, the windows, the tray icon, the exit and its watchdog, and the guard in front
# of Pitwall's commands.
paddock-shell = { path = "../../../../crates/paddock-shell", features = ["tray", "install"] }
paddock-commands = { path = "../../../../crates/paddock-commands", features = ["tauri"] }
paddock-dialogs = { path = "../../../../crates/paddock-dialogs", features = ["tauri"] }
paddock-startup = { path = "../../../../crates/paddock-startup", features = ["tauri"] }
paddock-updater = { path = "../../../../crates/paddock-updater", features = ["tauri", "install"] }
paddock-window = { path = "../../../../crates/paddock-window", features = ["tauri", "tray", "wry"] }
tauri-plugin-autostart = "2"
# A second launch focuses the running app instead of starting another one (release builds; see window::second_launch).
tauri-plugin-single-instance = "2"
# >= 2.12 fixes GHSA-j38x-g3m3-95fr (downgrade through the unsigned manifest version). No "zip": Pitwall publishes v2
# updater artifacts (the installers themselves). "rustls-tls" with the platform verifier trusts the OS certificate
# store. The updater is the only outbound HTTP in the shell, and only when the user asks for an update check.
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }
# The OS credential store (Windows Credential Manager, macOS Keychain, Secret Service) for the app's copy of the
# admin key; admin.key is the fallback.
keyring = "4.2"

[target.'cfg(windows)'.dependencies]
# Asking the Service Control Manager whether the service is installed and running (no rights needed).
windows-service = "0.8"
# The taskbar's light/dark setting (for the tray icon), read only.
winreg = "0.56"
webview2-com = "0.39"
# Starting `pitwall-server install` with Windows' own elevation prompt (ShellExecuteExW "runas").
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Registering the bundled launch agent with SMAppService (macOS 13+).
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService"] }

[lints]
workspace = true

[dev-dependencies]
# A socket bound but not listening refuses connections on Linux and Windows (not macOS): "nothing listens" with the port held.
socket2 = { version = "0.6", features = ["all"] }
tempfile.workspace = true
# A held loopback port for "nothing answers there" (C39).
paddock-testkit = { path = "../../../../crates/paddock-testkit" }
tokio = { workspace = true, features = ["time", "sync", "rt", "rt-multi-thread", "macros", "net", "io-util", "test-util"] }
tauri = { version = "2.12.4", features = ["test"] }
# The shell plugin on Tauri's mock runtime: the start test (ADR 0029, C50) opens no window and touches no user folder.
paddock-shell = { path = "../../../../crates/paddock-shell", features = ["tray", "mock-runtime"] }
# The menu bar's no-window route (Quit with the last window closed to the tray) is tested with the shell's NativeMenu state.
paddock-menu = { path = "../../../../crates/paddock-menu", features = ["tauri"] }
