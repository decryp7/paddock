[package]
name = "chromium-driver"
license.workspace = true
repository.workspace = true
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Self-contained Chromium renderer driver: discovery, supervised launch, a minimal DevTools-protocol client, readiness and challenge detection (no application types; meant to be copied between apps)"

[lib]
doctest = false # doctests are off (crates/README.md, "Doctests")

[dependencies]
tempfile.workspace = true
paddock-testkit = { path = "../../../../crates/paddock-testkit", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
sha2 = { workspace = true }
zip = { workspace = true }
# A small synchronous WebSocket client for the DevTools endpoint on 127.0.0.1 (MIT OR Apache-2.0).
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
# `CHROMIUM_PATH` and `DEBRIEF_BROWSER_NO_SANDBOX` are reported once when a release build ignores them (ADR 0073).
paddock-env = { path = "../../../../crates/paddock-env" }
# The shared start judge (ADR 0031): the browser's start is judged on its run state, not on a fixed wait.
paddock-proc = { path = "../../../../crates/paddock-proc" }

[features]
# A fake DevTools browser for tests of this crate and of the apps that drive it.
test-support = ["dep:paddock-testkit"]

[dev-dependencies]
# The self dev-dependency that turns `test-support` on for this package's own integration tests (rule 99).
chromium-driver = { path = ".", features = ["test-support"] }
# The real-browser tests wait for the browser until it is ready or ends, and set the test form of the answers (ADR 0071).
paddock-testkit = { path = "../../../../crates/paddock-testkit" }
paddock-testkit-start = { path = "../../../../crates/paddock-testkit-start" }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[package.metadata.paddock]
# What this crate's tests read that the test cache's reads extractor cannot resolve (ADR 0116 §2, user decision 122), as globs from the
# repository root; `[]` says the blind reads touch no repository file.
# `src/fake.rs` starts the test binary again (`current_exe`) as a fake browser and passes the loader's `DYLD_*` variables: no
# repository file.
test-reads = []
