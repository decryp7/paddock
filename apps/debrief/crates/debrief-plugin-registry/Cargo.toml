[package]
name = "debrief-plugin-registry"
license.workspace = true
repository.workspace = true
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Debrief plugin: imports Windows registry exports (.reg)"

[lib]
doctest = false # doctests are off (crates/README.md, "Doctests")

[dependencies]
debrief-plugin-api = { path = "../debrief-plugin-api" }
anyhow.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }

[dev-dependencies]
proptest.workspace = true

# What this crate's tests read that the test cache's reads extractor cannot resolve (ADR 0116 §2, user decision 122), as globs from the
# repository root; `[]` says the blind reads touch no repository file.
# `tests/it/properties.rs` reads one sample.
[package.metadata.paddock]
test-reads = [
    "apps/debrief/samples/windows/registry-export.reg",
]
