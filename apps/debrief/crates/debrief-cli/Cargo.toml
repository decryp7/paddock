[package]
name = "debrief-cli"
license.workspace = true
repository.workspace = true
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "The headless command line: import files into a store, run query-language queries and analyses, build the incident report (docs/cli.md)"

[lib]
doctest = false # doctests are off (crates/README.md, "Doctests")
name = "debrief_cli"
path = "src/lib.rs"

[[bin]]
name = "debrief"
path = "src/bin/debrief.rs"

[dependencies]
debrief-ipc = { path = "../debrief-ipc" }
# `DEBRIEF_STORE_WORKER` is honoured in a debug build only (ADR 0073).
paddock-env = { path = "../../../../crates/paddock-env" }
tempfile.workspace = true
debrief-core = { path = "../debrief-core" }
# The store worker's client (no database linked); the CLI starts the worker like the app does.
debrief-store-client = { path = "../debrief-store-client" }
debrief-pdf = { path = "../debrief-pdf" }
# Ctrl+C / SIGTERM stop `watch` cleanly.
ctrlc = { workspace = true, features = ["termination"] }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }

[dev-dependencies]
paddock-testkit = { path = "../../../../crates/paddock-testkit" }
debrief-store-duck = { path = "../debrief-store-duck" }

[package.metadata.paddock]
# What this crate's tests read that the test cache's reads extractor cannot resolve (ADR 0116 §2, user decision 122), as globs from the
# repository root; `[]` says the blind reads touch no repository file.
# `src/host.rs` finds the worker binary and its library folder beside the program (`current_exe`, `DEBRIEF_STORE_WORKER`,
# `DEBRIEF_LIB_DIR`): build output, no repository file.
test-reads = []
