[package]
name = "debrief-ai"
license.workspace = true
repository.workspace = true
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "AI assistant for Debrief on Pitwall: engine-validated proposals, chat, tools and the Pitwall client (ADR 0070)"

[lib]
doctest = false # doctests are off (crates/README.md, "Doctests")

[features]
# Test support (rule 99): the scripted LLM (`llm::fake`) and the fake Pitwall (`engine::pitwall::fake`). Enabled from
# `[dev-dependencies]` only, never in a shipped build (`./dev check test-features`, C170).
test-support = []

[dependencies]
# The shared atomic file replace (a temporary name of its own per write).
paddock-env = { path = "../../../../crates/paddock-env" }
debrief-core = { path = "../debrief-core" }
debrief-collect = { path = "../debrief-collect" }
debrief-image = { path = "../debrief-image" }
# The system proxy rules (HTTPS_PROXY, NO_PROXY, the operating system's) and the TLS/proxy agent set-up (ER-22).
paddock-download = { path = "../../../../crates/paddock-download" }
base64.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
sysinfo = { workspace = true, features = ["system", "disk"] }
thiserror.workspace = true
toml.workspace = true
log.workspace = true
regex.workspace = true
getrandom.workspace = true
url = "2"
percent-encoding = "2"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip", "platform-verifier"] }
# The TLS stack ureq already uses; named here only to recognise certificate errors (`net::classify`).
rustls = { version = "0.23", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_System_Threading"] }

[dev-dependencies]
debrief-image = { path = "../debrief-image", features = ["test-support"] }
# The self dev-dependency that turns `test-support` on for this package's own integration tests (rule 99).
debrief-ai = { path = ".", features = ["test-support"] }
tempfile.workspace = true
# A real store (the SQL tool and the end-to-end chat tests run over it); an adapter, so tests only.
debrief-store-duck = { path = "../debrief-store-duck" }
# A local HTTPS server with a certificate no trust store knows (tests/it/net_tls.rs).
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
proptest.workspace = true
# Waits on a condition with a hang guard instead of a sleep (ADR 0041, conformance C71).
paddock-testkit = { path = "../../../../crates/paddock-testkit" }

[package.metadata.paddock]
# What this crate's tests read that the test cache's reads extractor cannot resolve (ADR 0116 §2, user decision 122), as globs from the
# repository root; `[]` says the blind reads touch no repository file.
# `examples/eval.rs` (a program run by hand, never by the tests) reads the samples folder.
# Root rules (ADR 0116 §6), read site by site: also paths taken from the environment (`HOME`, `XDG_*`, `OUT_DIR`, `CARGO_*`, tool
# and runtime folders, folders a test passes). None is a repository file outside the globs.
test-reads = [
    "apps/debrief/samples/**",
]
