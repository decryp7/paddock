[package]
name = "debrief-ai"
license.workspace = true
repository.workspace = true
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "AI assistant for Debrief on Pitwall: engine-validated proposals, chat, tools and the Pitwall client (ADR 0070)"

[dependencies]
debrief-core = { path = "../debrief-core" }
debrief-collect = { path = "../debrief-collect" }
debrief-image = { path = "../debrief-image" }
base64.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
sysinfo = { workspace = true, features = ["system", "disk"] }
thiserror.workspace = true
toml.workspace = true
log.workspace = true
regex.workspace = true
getrandom.workspace = true
url = "2"
percent-encoding = "2"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip", "platform-verifier"] }
# The TLS stack ureq already uses; named here only to recognise certificate errors (`net::classify`).
rustls = { version = "0.23", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true
# A real store (the SQL tool and the end-to-end chat tests run over it); an adapter, so tests only.
debrief-store-duck = { path = "../debrief-store-duck" }
# A local HTTPS server with a certificate no trust store knows (tests/it/net_tls.rs).
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
proptest.workspace = true
