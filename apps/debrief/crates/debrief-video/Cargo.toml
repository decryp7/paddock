[package]
name = "debrief-video"
license.workspace = true
repository.workspace = true
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Video sources (ADR 0033): the downloadable FFmpeg runtime (pinned LGPL builds, verified, self-tested, updated with rollback), sandboxed ffmpeg/ffprobe runs, frame selection, alignment to the logs and the video records kept in the project"

# A fake ffmpeg/ffprobe (scripted output, hang, memory hog, bad output) used only by the tests. Never bundled.
[lib]
doctest = false # doctests are off (crates/README.md, "Doctests")

[[bin]]
name = "debrief-video-fake-ffmpeg"
path = "src/bin/fake_ffmpeg.rs"
test = false

[dependencies]
# The shared atomic file replace (a temporary name of its own per write).
paddock-env = { path = "../../../../crates/paddock-env" }
debrief-core = { path = "../debrief-core" }
debrief-ai = { path = "../debrief-ai" }
debrief-image = { path = "../debrief-image" }
debrief-ipc = { path = "../debrief-ipc" }
log.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
zip.workspace = true
tar = { version = "0.4", default-features = false }
# The Linux builds are .tar.xz: a pure-Rust decoder (MIT), no liblzma.
lzma-rs = "0.3"
# TypeScript bindings of the wire DTOs (`api`), generated by the app's `generated_types` test (ADR 0016).
ts-rs = { version = "11.1", optional = true }

[dev-dependencies]
debrief-image = { path = "../debrief-image", features = ["test-support"] }
debrief-ai = { path = "../debrief-ai", features = ["test-support"] }
tempfile.workspace = true
proptest.workspace = true

[features]
ts = ["dep:ts-rs"]

[package.metadata.paddock]
# What this crate's tests read that the test cache's reads extractor cannot resolve (ADR 0116 §2, user decision 122), as globs from the
# repository root; `[]` says the blind reads touch no repository file.
# `src/bin/fake_ffmpeg.rs` reads its own name and a `fake-mode` file beside it (`current_exe`) that the test wrote: no repository
# file.
test-reads = []
