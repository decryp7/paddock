[package]
name = "debrief-symbols"
license.workspace = true
repository.workspace = true
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Native symbols for Debrief (ADR 0022): PE/PDB identities, symbol paths and cache, optional symbol-server downloads, DbgHelp symbolisation and stack walking; shared by the native profiler and dump analysis"

[lib]
doctest = false # doctests are off (crates/README.md, "Doctests")

[dependencies]
thiserror.workspace = true
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"], optional = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, optional = true, features = [
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader",
] }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[features]
# Test support (rule 99): `testing`, the fake symbol server. Enabled from `[dev-dependencies]` only, never in a shipped
# build (`./dev check test-features`, C170).
test-support = []
default = ["server", "dbghelp"]
# Downloads from symbol servers (only those the user enables).
server = ["dep:ureq"]
# The DbgHelp resolver and stack walker (Windows). Without it the crate is pure: identities, the cache, downloads.
dbghelp = ["dep:windows"]

[package.metadata.paddock]
# What this crate's tests read that the test cache's reads extractor cannot resolve (ADR 0116 §2, user decision 122), as globs from the
# repository root; `[]` says the blind reads touch no repository file.
# `src/cache.rs` removes files and empty folders inside the cache folder a caller names; no repository path.
# Root rules (ADR 0116 §6), read site by site: also `current_exe` (the test binary started again, or files beside it: build output).
# None is a repository file outside the globs.
test-reads = []
