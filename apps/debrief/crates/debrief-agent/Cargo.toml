[package]
name = "debrief-agent"
license.workspace = true
repository.workspace = true
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Headless Debrief agent: scheduled and triggered diagnostics collection, as a CLI or an OS service"

[lib]
doctest = false # doctests are off (crates/README.md, "Doctests")
name = "debrief_agent"
path = "src/lib.rs"

[[bin]]
name = "debrief-agent"
path = "src/bin/debrief-agent.rs"

[dependencies]
# The shared atomic file replace (a temporary name of its own per write).
paddock-env = { path = "../../../../crates/paddock-env" }
debrief-core = { path = "../debrief-core" }
debrief-collect = { path = "../debrief-collect" }
debrief-monitor = { path = "../debrief-monitor" }
# PerfMon Data Collector Set control (`logman`), shared with the tools plugin.
debrief-plugin-tools = { path = "../debrief-plugin-tools" }
anyhow.workspace = true
jiff.workspace = true
# Cron expressions (MIT): 5/6-field POSIX/Vixie patterns, aliases, L/W/#, time zones via jiff.
croner = { version = "4.0.1", default-features = false, features = ["jiff"] }
globset.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
# Free disk space and PID liveness (already in the dependency tree).
log.workspace = true
sysinfo = { workspace = true, features = ["system", "disk"] }
thiserror.workspace = true
toml.workspace = true
# Saving debrief-agent.toml in place, keeping the user's comments (MIT OR Apache-2.0).
toml_edit = "0.25"
ctrlc = { workspace = true, features = ["termination"] }

[target.'cfg(windows)'.dependencies]
# Windows Service Control Manager integration (MIT OR Apache-2.0).
windows-service = "0.8.1"

[dev-dependencies]
tempfile.workspace = true
# Waiting on a condition instead of a guessed time (ADR 0041 §3).
paddock-testkit = { path = "../../../../crates/paddock-testkit" }

[package.metadata.paddock]
# What this crate's tests read that the test cache's reads extractor cannot resolve (ADR 0116 §2, user decision 122), as globs from the
# repository root; `[]` says the blind reads touch no repository file.
# `src/disk.rs`: `existing_ancestor` walks up a caller's output folder (a machine path).
test-reads = []
