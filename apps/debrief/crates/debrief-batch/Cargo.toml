[package]
name = "debrief-batch"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false
description = "Debrief's event batch: stable ids, the fixed Arrow schema of an event (ADR 0014 §3), a builder and a validated EventBatch shared by importers, the store and plugins"

# Arrow 60 is the version duckdb-rs 1.20000 (DuckDB 2.0.0) links against, so batches reach the store's
# Arrow appender without a conversion. The plugin SDK is on Arrow 60 as well.
[dependencies]
arrow-array = { version = "60", default-features = false }
arrow-buffer = { version = "60", default-features = false }
arrow-schema = { version = "60", default-features = false }
thiserror.workspace = true
# Serialisation of ids and the timestamp state in the store's request/reply types.
serde = { workspace = true, optional = true }

[features]
serde = ["dep:serde"]
