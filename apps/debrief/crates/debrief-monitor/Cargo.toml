[package]
name = "debrief-monitor"
license.workspace = true
repository.workspace = true
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
doctest = false # doctests are off (crates/README.md, "Doctests")

[dependencies]
debrief-core = { path = "../debrief-core" }
paddock-proc = { path = "../../../../crates/paddock-proc" }
anyhow.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
globset.workspace = true
log.workspace = true
sysinfo = { workspace = true, features = ["system"] }
ctrlc.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_System_Performance", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
paddock-testkit = { path = "../../../../crates/paddock-testkit" }
tempfile.workspace = true

[[bin]]
name = "debrief-monitor"
path = "src/bin/debrief-monitor.rs"

[package.metadata.paddock]
# What this crate's tests read that the test cache's reads extractor cannot resolve (ADR 0116 §2, user decision 122), as globs from the
# repository root; `[]` says the blind reads touch no repository file.
# `src/tests.rs` looks up the test binary's own process name (`current_exe`) and `src/dotnet_win_tests.rs` finds the .NET compiler
# under `WINDIR`: no repository file.
test-reads = []
