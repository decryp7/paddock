<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 356" width="960" height="356" role="img" aria-labelledby="d2t d2d">
    <title id="d2t">Write throughput by method</title>
    <desc id="d2d">Quack server with 1 client: 115 thousand events per second. Appender, 1 long-lived: 387 thousand. Parquet, 1 writer: 725 thousand. Real import at load: 0.7 to 1.0 million. Real import on a quiet machine: 1.3 to 1.55 million. Parquet, 8 writers, small sample: 5.1 million.</desc>
    <style>
      /* Self-contained colours (no page variables): light by default, dark under prefers-color-scheme. */
      .bg { fill: #ffffff; }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; fill: #1b2228; }
      .t-mono { font-family: ui-monospace, "SF Mono", Menlo, "Cascadia Mono", Consolas, monospace; }
      .t-muted { fill: #5a6670; }
      .t-head { font-weight: 600; }
      .box { fill: #eef1f3; stroke: #b4bdc5; }
      .edge { stroke: #5a6670; stroke-width: 1.5; fill: none; }
      .s-single { stroke: #8a4f9e; } .f-single { fill: #8a4f9e; }
      .s-fan { stroke: #1f7a6d; } .f-fan { fill: #1f7a6d; }
      .s-server { stroke: #1d5fd1; } .f-server { fill: #1d5fd1; }
      .grid { stroke: #b4bdc5; stroke-width: 1; }
      .arrowhead { fill: #5a6670; }
      .val { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #1a2127; }
        text { fill: #e3e8ec; }
        .t-muted { fill: #9aa6b0; }
        .box { fill: #202930; stroke: #46535e; }
        .edge { stroke: #9aa6b0; }
        .s-single { stroke: #c08ad4; } .f-single { fill: #c08ad4; }
        .s-fan { stroke: #4cc0ae; } .f-fan { fill: #4cc0ae; }
        .s-server { stroke: #5b9bff; } .f-server { fill: #5b9bff; }
        .grid { stroke: #46535e; }
        .arrowhead { fill: #9aa6b0; }
        .val { stroke: #1a2127; }
      }
    </style>
    <rect class="bg" x="0" y="0" width="960" height="356" rx="6"/>
    <!-- scale: x = 300 + v / 6.0M * 600 ; 1M = 100px -->
    <g class="grid">
      <line x1="300" y1="20" x2="300" y2="282"/><line x1="400" y1="20" x2="400" y2="282"/><line x1="500" y1="20" x2="500" y2="282"/>
      <line x1="600" y1="20" x2="600" y2="282"/><line x1="700" y1="20" x2="700" y2="282"/><line x1="800" y1="20" x2="800" y2="282"/><line x1="900" y1="20" x2="900" y2="282"/>
    </g>
    <g class="t-mono t-muted" font-size="11.5" text-anchor="middle">
      <text x="300" y="302">0</text><text x="400" y="302">1M</text><text x="500" y="302">2M</text><text x="600" y="302">3M</text>
      <text x="700" y="302">4M</text><text x="800" y="302">5M</text><text x="900" y="302">6M</text>
    </g>
    <text x="600" y="322" text-anchor="middle" class="t-muted" font-size="11.5">events per second</text>
    <g font-size="13">
      <text x="20" y="44">Quack server, 1 client</text><text x="20" y="60" class="t-muted t-mono" font-size="11">writer bench</text>
      <rect x="300" y="32" width="11.5" height="24" rx="2" class="f-server"/><text x="318" y="49" class="t-mono val" font-size="12">115k</text>

      <text x="20" y="86">Appender, 1 long-lived</text><text x="20" y="102" class="t-muted t-mono" font-size="11">writer bench</text>
      <rect x="300" y="74" width="38.7" height="24" rx="2" class="f-single"/><text x="346" y="91" class="t-mono val" font-size="12">387k</text>

      <text x="20" y="128">Parquet, 1 writer</text><text x="20" y="144" class="t-muted t-mono" font-size="11">writer bench</text>
      <rect x="300" y="116" width="72.5" height="24" rx="2" class="f-fan"/><text x="380" y="133" class="t-mono val" font-size="12">725k</text>

      <text x="20" y="170">Import, 8 writers, at load</text><text x="20" y="186" class="t-muted t-mono" font-size="11">real import</text>
      <rect x="300.75" y="158.75" width="68.5" height="22.5" rx="2" fill="none" class="s-fan" stroke-width="1.5"/><rect x="370" y="158" width="30" height="24" rx="2" class="f-fan"/>
      <text x="408" y="175" class="t-mono val" font-size="12">0.7–1.0M</text>

      <text x="20" y="212">Import, 8 writers, quiet</text><text x="20" y="228" class="t-muted t-mono" font-size="11">real import</text>
      <rect x="300.75" y="200.75" width="128.5" height="22.5" rx="2" fill="none" class="s-fan" stroke-width="1.5"/><rect x="430" y="200" width="25" height="24" rx="2" class="f-fan"/>
      <text x="463" y="217" class="t-mono val" font-size="12">1.3–1.55M</text>

      <text x="20" y="254">Parquet, 8 writers</text><text x="20" y="270" class="t-muted t-mono" font-size="11">writer bench, small sample</text>
      <rect x="300" y="242" width="510" height="24" rx="2" class="f-fan"/><text x="818" y="259" class="t-mono val" font-size="12">5.1M</text>
    </g>
    <text x="944" y="344" text-anchor="end" class="t-muted" font-size="11">Debrief · updated 2026-10-29</text>
  </svg>
