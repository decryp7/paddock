    <text x="520.0" y="809" class="name" text-anchor="middle">Quack server</text>
    <text x="520.0" y="825" class="muted" text-anchor="middle">buffers rows per client</text>
    <rect x="640" y="784" width="160" height="56" rx="6" class="n-proc"/>
    <text x="720.0" y="809" class="name mono" text-anchor="middle">events.duckdb</text>
    <text x="720.0" y="825" class="muted" text-anchor="middle">server's database</text>
    <path d="M216,812 L254,812" class="edge" marker-end="url(#ah)"/>
