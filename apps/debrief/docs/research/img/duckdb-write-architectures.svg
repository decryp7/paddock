    <path d="M640,536 L620,536 L620,588 L602,588" class="edge dash" marker-end="url(#oh)"/>
    <text x="336" y="640" class="muted" text-anchor="middle">written by the parquet crate, not DuckDB; temp name, then rename</text>
    <text x="832" y="470" class="name t-own">4.38M ev/s, 8 writers</text>
    <text x="832" y="488" class="muted">12 writers: 4.41M (no gain)</text>
    <text x="832" y="504" class="muted">R2b, Windows VM: 1 → 8 writers ≈ 4×</text>
    <text x="832" y="520" class="muted">no shared lock while writing</text>
