<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 984" width="1152" height="984" role="img" aria-labelledby="d1t d1d">
  <title id="d1t">Write architectures compared</title>
  <desc id="d1d">Three ways to write events. A, single writer: 8 parse threads queue on a channel into one Appender that writes events.duckdb; 1 Appender 200k events/s, 4 Appenders 355k in the Quack harness, a 2nd 1.0x on the writer bench. B, fan-out (Debrief today): each parse thread has its own Parquet writer and segment file; catalog.duckdb holds the segment list and a view that reads them; 8 writers 4.38M events/s in the Quack harness. C, server mode: 4 client processes send rows over a socket to a DuckDB Quack server process; 1 client 115k events/s, 4 clients 416k using 4.6 GB at a 1 GB limit, out of memory in 2 of 3 rounds at 192 MB.</desc>
  <style>
