    <text x="720.0" y="505" class="muted" text-anchor="middle">segment list +</text>
    <text x="720.0" y="521" class="mono muted" text-anchor="middle">VIEW events AS</text>
    <text x="720.0" y="537" class="mono muted" text-anchor="middle">read_parquet([...])</text>
    <path d="M640,480 L620,480 L620,428 L602,428" class="edge dash" marker-end="url(#oh)"/>
