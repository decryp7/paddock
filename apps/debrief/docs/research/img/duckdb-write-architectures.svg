    <text x="832" y="230" class="muted">2 Appenders: 1.0× (writer bench)</text>
    <text x="832" y="246" class="muted">4 Appenders: 1.8× (Quack harness)</text>
    <text x="832" y="262" class="muted">at about 2× the memory</text>
    <rect x="48" y="336" width="1056" height="328" rx="10" class="group"/>
    <text x="72" y="360" class="glabel">B · Fan-out: one Parquet file per thread, a view over them</text>
