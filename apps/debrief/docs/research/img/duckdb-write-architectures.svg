    <text x="144.0" y="521" class="muted" text-anchor="middle">[2 of 8]</text>
    <rect x="256" y="480" width="144" height="56" rx="6" class="n-own"/>
    <text x="328.0" y="505" class="name" text-anchor="middle">Parquet writer</text>
    <text x="328.0" y="521" class="muted" text-anchor="middle">[ArrowWriter, zstd]</text>
    <rect x="440" y="480" width="160" height="56" rx="6" class="n-proc"/>
    <text x="520.0" y="505" class="name" text-anchor="middle">Segment file</text>
