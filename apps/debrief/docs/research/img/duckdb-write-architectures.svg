  <rect class="bg" x="0" y="0" width="1152" height="984"/>
    <text x="48" y="64" class="title">Write architectures compared</text>
    <text x="48" y="88" class="kind muted">Flow · Debrief storage engine, import write path</text>
    <text x="48" y="108" class="muted">The same 8 parse threads feed each design; the difference is where they wait. Numbers: Quack harness, same batches, Mac mini, 2026-10-28.</text>
    <rect x="48" y="136" width="1056" height="144" rx="10" class="group"/>
    <text x="72" y="160" class="glabel">A · Single writer into a native table</text>
    <text x="72" y="178" class="muted">INSERT or the Appender; Debrief's import before R2b (2026-10-20)</text>
    <rect x="72" y="200" width="144" height="56" rx="6" class="n-proc"/>
    <text x="144.0" y="225" class="name" text-anchor="middle">Parse threads</text>
    <text x="144.0" y="241" class="muted" text-anchor="middle">[8 threads]</text>
    <rect x="256" y="200" width="144" height="56" rx="6" class="n-proc"/>
    <text x="328.0" y="225" class="name" text-anchor="middle">Channel</text>
    <text x="328.0" y="241" class="muted" text-anchor="middle">threads wait here</text>
    <rect x="440" y="200" width="160" height="56" rx="6" class="n-proc"/>
    <text x="520.0" y="225" class="name" text-anchor="middle">1 Appender</text>
    <text x="520.0" y="241" class="muted" text-anchor="middle">long-lived, large batches</text>
    <rect x="640" y="200" width="160" height="56" rx="6" class="n-proc"/>
    <text x="720.0" y="225" class="name mono" text-anchor="middle">events.duckdb</text>
    <text x="720.0" y="241" class="muted" text-anchor="middle">compressed as written</text>
    <path d="M216,228 L254,228" class="edge" marker-end="url(#ah)"/>
    <path d="M400,228 L438,228" class="edge" marker-end="url(#ah)"/>
    <path d="M600,228 L638,228" class="edge" marker-end="url(#ah)"/>
