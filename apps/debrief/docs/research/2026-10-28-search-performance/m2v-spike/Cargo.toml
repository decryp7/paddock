[package]
name = "m2v-spike"
version = "0.0.0"
edition = "2021"
publish = false
description = "Measurements for docs/research/2026-10-28-search-performance.md (Model2Vec over log templates); not shipped."

# A standalone spike, not a member of the app's workspace.
[workspace]

[dependencies]
model2vec-rs = { version = "=0.3.0", default-features = false, features = ["fancy-regex"] }
# The tokenizer model2vec-rs 0.3.0 links, so both encoders tokenize identically.
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
safetensors = "0.5"
half = "2"
serde_json = "1"
rayon = "1"
libc = "0.2"
usearch = "=2.26.6"
hnsw_rs = "=0.3.5"

[profile.release]
debug = 1
