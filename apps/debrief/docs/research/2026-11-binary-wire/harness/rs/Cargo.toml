[package]
name = "binwire"
version = "0.0.0"
edition = "2021"
publish = false
[workspace]
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
rmp-serde = "1.3"
postcard = { version = "1.1", features = ["use-std"] }
ciborium = "0.2"
flexbuffers = "25.12.19"
flatbuffers = "25.12.19"
arrow-array = { version = "60", default-features = false }
arrow-buffer = { version = "60", default-features = false }
arrow-schema = { version = "60", default-features = false }
arrow-ipc = { version = "60", default-features = false }
[profile.release]
debug = false
