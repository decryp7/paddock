<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Folder import dialog mock</title>
<link rel="stylesheet" href="../../../../../ui/dist/paddock-ui/css/tokens.css"><link rel="stylesheet" href="tokens.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--pd-surface-1);color:var(--pd-text);font-family:var(--pd-font-sans);font-size:var(--pd-text-body);line-height:var(--pd-lh-body)}

.title{flex:none;height:28px;display:flex;align-items:center;justify-content:center;position:relative;background:var(--pd-surface-2);border-bottom:1px solid var(--pd-hairline);font-size:var(--pd-text-label);font-weight:var(--pd-weight-medium);color:var(--pd-text-muted)}
.lights{position:absolute;left:10px;display:flex;gap:8px}.lights i{width:12px;height:12px;border-radius:50%;background:var(--pd-border-strong)}
.body{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:var(--pd-space-3) var(--pd-space-4) 0}
.path{flex:none;display:flex;align-items:center;gap:var(--pd-space-2);height:28px;min-width:0}
.path .p{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:var(--pd-weight-medium)}
.path .sum{margin-inline-start:auto;color:var(--pd-text-muted);font-size:var(--pd-text-label);white-space:nowrap;font-variant-numeric:tabular-nums}
.bar{flex:none;display:flex;align-items:center;gap:var(--pd-space-2);min-height:var(--pd-toolbar-height);min-width:0}
.filter{display:flex;align-items:center;gap:var(--pd-space-2);flex:0 1 240px;min-width:120px;height:28px;padding:0 var(--pd-space-2);border:1px solid var(--pd-border-control);border-radius:var(--pd-radius-input);color:var(--pd-text-muted)}
.filter span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.filter.on{color:var(--pd-text)}
.sel{display:inline-flex;align-items:center;gap:var(--pd-space-1);height:28px;padding:0 var(--pd-space-2);border:1px solid var(--pd-border-control);border-radius:var(--pd-radius-input);white-space:nowrap}
.sel b{font-weight:var(--pd-weight-regular);color:var(--pd-text-muted)}
.sel.on{border-color:var(--pd-accent);}
.spacer{flex:1}
.count{color:var(--pd-text-muted);font-size:var(--pd-text-label);white-space:nowrap;font-variant-numeric:tabular-nums}
.tool{display:inline-flex;align-items:center;gap:var(--pd-space-1);height:28px;padding:0 var(--pd-space-2);border-radius:var(--pd-radius-control);color:var(--pd-text-muted);white-space:nowrap}
.note{flex:none;display:flex;align-items:center;gap:var(--pd-space-2);min-height:36px;padding:var(--pd-space-1) var(--pd-space-3);margin-bottom:var(--pd-space-2);border-radius:var(--pd-radius-control);background:var(--pd-info-tint)}
.note.warn{background:var(--pd-warning-tint)}.note.danger{background:var(--pd-danger-tint)}.note.plain{background:var(--pd-surface-2)}
.note .tx{flex:1;min-width:0}.note .ic{color:var(--pd-info);display:inline-grid}.note.warn .ic{color:var(--pd-warning)}.note.danger .ic{color:var(--pd-danger)}.note.plain .ic{color:var(--pd-text-muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;height:var(--pd-button-height);padding:0 var(--pd-space-3);border-radius:var(--pd-radius-control);border:1px solid var(--pd-border-strong);background:var(--pd-surface-2);color:var(--pd-text);font-weight:var(--pd-weight-medium);white-space:nowrap}
.btn.small{height:24px;padding:0 var(--pd-space-2);font-size:var(--pd-text-label)}
.btn.primary{background:var(--pd-accent-fill);border-color:var(--pd-accent-fill);color:var(--pd-on-accent)}
.btn[disabled]{opacity:.55}
.progress{flex:none;display:flex;align-items:center;gap:var(--pd-space-3);height:36px;margin-bottom:var(--pd-space-2)}
.progress .lab{font-weight:var(--pd-weight-medium);white-space:nowrap}
.track{flex:1;height:4px;border-radius:2px;background:var(--pd-hover);overflow:hidden}.track i{display:block;height:100%;background:var(--pd-accent-control)}
.grid{--cols:minmax(0,2fr) 116px 148px minmax(0,1.5fr) 72px 56px 24px;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;border:1px solid var(--pd-hairline);border-radius:var(--pd-radius-card);background:var(--pd-surface-1);overflow:hidden;position:relative}
.grid.noreason{--cols:minmax(0,2fr) 116px 148px 72px 56px 24px}.grid.tiny{--cols:minmax(0,1fr) 148px 72px 24px}
.row,.head{display:grid;grid-template-columns:var(--cols);column-gap:var(--pd-space-3);align-items:center;padding:0 var(--pd-space-3);min-width:0}
.head{flex:none;height:28px;border-bottom:1px solid var(--pd-hairline);color:var(--pd-text-muted);font-size:var(--pd-text-label);padding-inline-end:calc(var(--pd-space-3) + 12px)}
.head .end,.cell.end{justify-content:flex-end;text-align:end;font-variant-numeric:tabular-nums}
.head div{display:flex;align-items:center;gap:2px}.head .sorted{color:var(--pd-text)}
.rows{flex:1 1 auto;min-height:0;overflow:hidden;position:relative;padding-inline-end:12px}
.row{height:var(--pd-row-height);border-bottom:1px solid var(--pd-hairline)}
.row.focus{outline:var(--pd-focus-width) solid var(--pd-focus-ring);outline-offset:-2px;border-radius:2px}
.row.muted .name{color:var(--pd-text-muted)}
.cell{display:flex;align-items:center;min-width:0;white-space:nowrap;overflow:hidden;gap:var(--pd-space-1)}
.name{display:flex;align-items:center;gap:var(--pd-space-1);min-width:0}
.name .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row.folder .t{font-weight:var(--pd-weight-medium)}
.chev{flex:none;width:16px;height:16px;display:inline-grid;place-items:center;color:var(--pd-text-muted)}
.cb{flex:none;width:16px;height:16px;margin:0 var(--pd-space-1);border-radius:3px;border:2px solid var(--pd-border-control);display:inline-grid;place-items:center;color:var(--pd-on-accent-control)}
.cb.on,.cb.mix{background:var(--pd-accent-control);border-color:var(--pd-accent-control)}
.cb.off-dis{border-color:var(--pd-hairline);background:var(--pd-surface-2)}
.ico{flex:none;display:inline-grid;color:var(--pd-text-muted);margin-inline-end:2px}
.muted2{color:var(--pd-text-muted)}.sub{color:var(--pd-text-subtle)}
.reason{color:var(--pd-text-muted);overflow:hidden;text-overflow:ellipsis}
.st{display:inline-flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums}
.st.ok{color:var(--pd-success)}.st.lim{color:var(--pd-warning)}.st.no{color:var(--pd-text-muted)}.st.err{color:var(--pd-danger)}.st.wait{color:var(--pd-text-subtle)}
.st .w{color:var(--pd-text)}.st.no .w{color:var(--pd-text-muted)}
.more{justify-content:center;color:var(--pd-row-action-rest)}.more.hot{color:var(--pd-text)}
.chip{flex:none;height:20px;line-height:20px;padding:0 var(--pd-space-2);border-radius:var(--pd-radius-pill);background:var(--pd-surface-2);color:var(--pd-text-muted);font-size:var(--pd-text-label);white-space:nowrap}
.link{color:var(--pd-accent);font-weight:var(--pd-weight-medium);flex:none}
.tag{flex:none;height:18px;padding:0 var(--pd-space-1);border-radius:var(--pd-radius-tag);background:var(--pd-info-tint);color:var(--pd-info);font-size:var(--pd-text-caption);line-height:18px}
.skel{display:block;height:10px;border-radius:3px;background:var(--pd-skeleton)}
.scroll{position:absolute;top:2px;right:2px;bottom:2px;width:8px}.scroll i{position:absolute;left:0;right:0;border-radius:4px;background:var(--pd-border-strong)}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--pd-space-2);text-align:center;color:var(--pd-text-muted)}
.cost{flex:none;display:flex;align-items:center;gap:var(--pd-space-4);min-height:36px;margin-top:var(--pd-space-1);white-space:nowrap;min-width:0;font-variant-numeric:tabular-nums}
.cost b{font-weight:var(--pd-weight-semibold);color:var(--pd-text)}.cost .k{color:var(--pd-text-muted)}
.cost .warnx{display:inline-flex;align-items:center;gap:var(--pd-space-1);min-width:0;overflow:hidden;text-overflow:ellipsis}.cost .warnx svg{color:var(--pd-warning);flex:none}
.foot{flex:none;display:flex;align-items:center;justify-content:flex-end;gap:var(--pd-space-2);padding:var(--pd-space-3) var(--pd-space-4);border-top:1px solid var(--pd-hairline);background:var(--pd-surface-1);margin-top:var(--pd-space-1)}
.foot .msg{margin-inline-end:auto;color:var(--pd-text-muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div id="win"></div>
<script>
const q = new URLSearchParams(location.search);
document.documentElement.dataset.theme = q.get('theme') || 'dark';
const state = q.get('state') || 'selection';
const svg = (p, s = 14, f = false) => `<svg width="${s}" height="${s}" viewBox="0 0 16 16" fill="${f ? 'currentColor' : 'none'}" stroke="${f ? 'none' : 'currentColor'}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const I = {
  folder: svg('<path d="M2 4.5c0-.6.4-1 1-1h3l1.5 1.5H13c.6 0 1 .4 1 1V12c0 .6-.4 1-1 1H3c-.6 0-1-.4-1-1z"/>'),
  file: svg('<path d="M4 2h5l3 3v9H4z"/><path d="M9 2v3h3"/>'),
  zip: svg('<path d="M4 2h5l3 3v9H4z"/><path d="M7 4v1M7 7v1M7 10v1"/>'),
  right: svg('<path d="M6 4l4 4-4 4"/>'), down: svg('<path d="M4 6l4 4 4-4"/>'),
  ok: svg('<circle cx="8" cy="8" r="6"/><path d="M5.5 8.2l1.8 1.8 3.2-3.6"/>'),
  lim: svg('<path d="M8 2.5l6 10.5H2z"/><path d="M8 6.5v3M8 11.4v.1"/>'),
  no: svg('<circle cx="8" cy="8" r="6"/><path d="M3.8 12.2l8.4-8.4"/>'),
  err: svg('<circle cx="8" cy="8" r="6"/><path d="M8 4.8v3.6M8 11v.1"/>'),
  wait: svg('<circle cx="4" cy="8" r=".8"/><circle cx="8" cy="8" r=".8"/><circle cx="12" cy="8" r=".8"/>'),
  search: svg('<circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/>'),
  caret: svg('<path d="M4.5 6.5L8 10l3.5-3.5"/>', 12),
  info: svg('<circle cx="8" cy="8" r="6"/><path d="M8 7.4v3.4M8 5v.1"/>', 16),
  warn: svg('<path d="M8 2.5l6 10.5H2z"/><path d="M8 6.5v3M8 11.4v.1"/>', 16),
  check: svg('<path d="M3 8.5l3 3 7-7.5" stroke-width="2.2"/>', 12),
  dash: svg('<path d="M3.5 8h9" stroke-width="2.4"/>', 12),
  columns: svg('<path d="M2.5 3h11v10h-11zM6.2 3v10M9.8 3v10"/>'),
  more: svg('<circle cx="3.5" cy="8" r=".9" fill="currentColor" stroke="none"/><circle cx="8" cy="8" r=".9" fill="currentColor" stroke="none"/><circle cx="12.5" cy="8" r=".9" fill="currentColor" stroke="none"/>', 16),
  sortd: svg('<path d="M8 3v9M4.5 9L8 12.5 11.5 9"/>', 12),
};
const cb = (v) => v === 'on' ? `<span class="cb on">${I.check}</span>` : v === 'mix' ? `<span class="cb mix">${I.dash}</span>` : v === 'dis' ? '<span class="cb off-dis"></span>' : '<span class="cb"></span>';
const stat = (kind, n, w) => `<span class="st ${kind}">${I[kind]}${n != null ? `<span class="w">${n}</span>` : ''}${w ? `<span class="w">${w}</span>` : ''}</span>`;
const ok = (n) => stat('ok', n), lim = (n) => stat('lim', n), no = (n) => stat('no', n), er = (n) => stat('err', n);
const W = { ok: stat('ok', null, 'Supported'), lim: stat('lim', null, 'Limited'), no: stat('no', null, 'Not supported'), err: stat('err', null, 'Can’t read'), wait: stat('wait', null, 'Scanning…') };
/** name row: level, kind (d folder / f file / z archive), open, check, name, type, status, reason, size, count, extras */
function row(o, cols) {
  const indent = (o.l - 1) * 20;
  const chev = o.k === 'f' ? '<span class="chev"></span>' : `<span class="chev">${o.open ? I.down : I.right}</span>`;
  const ic = o.k === 'd' ? I.folder : o.k === 'z' ? I.zip : I.file;
  const name = `<div class="cell"><span class="name" style="padding-inline-start:${indent}px">${chev}${cb(o.c)}<span class="ico">${ic}</span><span class="t">${o.n}</span></span></div>`;
  const type = `<div class="cell muted2">${o.t === '~' ? '<span class="skel" style="width:64px"></span>' : (o.t || '')}</div>`;
  const status = `<div class="cell">${o.s || ''}</div>`;
  const reason = `<div class="cell">${o.tag ? `<span class="tag">${o.tag}</span>` : ''}<span class="reason">${o.r || ''}</span></div>`;
  const more = `<div class="cell more ${o.focus ? 'hot' : ''}">${I.more}</div>`;
  const size = `<div class="cell end">${o.z ?? ''}</div>`;
  const count = `<div class="cell end muted2">${o.f ?? ''}</div>`;
  const cells = cols === 'full' ? [name, type, status, reason, size, count, more] : cols === 'noreason' ? [name, type, status, size, count, more] : [name, status, size, more];
  return `<div class="row ${o.k !== 'f' ? 'folder' : ''} ${o.focus ? 'focus' : ''} ${o.m ? 'muted' : ''}">${cells.join('')}</div>`;
}
function head(cols, sort = 'name') {
  const h = (k, label, end) => `<div class="${end ? 'end' : ''} ${sort === k ? 'sorted' : ''}">${end && sort === k ? I.sortd : ''}${label}${!end && sort === k ? '&nbsp;<span style="display:inline-grid;transform:rotate(180deg)">' + I.sortd + '</span>' : ''}</div>`;
  const parts = cols === 'full' ? [h('name', 'Name'), h('type', 'Type'), h('status', 'Status'), h('reason', 'Reason'), h('size', 'Size', 1), h('files', 'Files', 1), '<div></div>']
    : cols === 'noreason' ? [h('name', 'Name'), h('type', 'Type'), h('status', 'Status'), h('size', 'Size', 1), h('files', 'Files', 1), '<div></div>']
    : [h('name', 'Name'), h('status', 'Status'), h('size', 'Size', 1), '<div></div>'];
  return `<div class="head">${parts.join('')}</div>`;
}
function grid(cols, rows, opts = {}) {
  const cls = cols === 'noreason' ? 'noreason' : cols === 'tiny' ? 'tiny' : '';
  return `<div class="grid ${cls}" role="treegrid" aria-label="Files in the folder">${head(cols, opts.sort)}<div class="rows">${rows.map((r) => row(r, cols)).join('')}${opts.inner || ''}<div class="scroll"><i style="top:${opts.st ?? 0}%;height:${opts.sh ?? 40}%"></i></div></div></div>`;
}
const tb = (o = {}) => `<div class="bar"><div class="filter ${o.q ? 'on' : ''}">${I.search}<span>${o.q || 'Filter by name'}</span></div>
  <span class="sel ${o.t ? 'on' : ''}"><b>Type</b> ${o.t || 'All'} ${I.caret}</span><span class="sel ${o.s ? 'on' : ''}"><b>Status</b> ${o.s || 'All'} ${I.caret}</span>
  <span class="spacer"></span><span class="count">${o.c || ''}</span><span class="tool">Select ${I.caret}</span><span class="tool" aria-label="Columns">${I.columns}</span></div>`;
const path = (right, p = '…/Incoming/Bundle', chip = '') => `<div class="path"><span class="ico">${I.folder}</span><span class="p">${p}</span>${chip ? `<span class="chip">${chip}</span>` : ''}<span class="sum">${right}</span></div>`;
const cost = (o) => `<div class="cost"><span class="k">Selected</span> <b>${o.n} files, ${o.b}</b><span class="k">Disk free</span> <b>${o.free || '449 GiB'}</b>${o.pend ? `<span class="k">${o.pend}</span>` : `<span class="k">Not selected</span> <span class="link">${o.left} ${I.caret.replace('width="12"','width="10"')}</span>`}${o.w ? `<span class="warnx">${I.lim}${o.w}</span> <span class="link">Retry</span>` : ''}</div>`;
const foot = (o = {}) => `<div class="foot">${o.msg ? `<span class="msg">${o.msg}</span>` : ''}<span class="btn">${o.cancel || 'Cancel'}</span><span class="btn primary" ${o.dis ? 'disabled' : ''}>${o.ok || 'Import selected'}</span></div>`;
const frame = (title, inner, footer) => `<div class="title"><span class="lights"><i></i><i></i><i></i></span>${title}</div><div class="body">${inner}</div>${footer}`;
const TITLE = 'Choose files to import';

const logs = { l: 1, k: 'd', open: 1, c: 'mix', n: 'Logs', t: 'Mixed', s: ok('2,723'), z: '280 MiB', f: '2,723' };
const treeSel = [
  logs,
  { l: 2, k: 'd', c: 'on', n: 'AppA', t: 'CSV log', s: ok('610'), z: '140 MiB', f: '610' },
  { l: 2, k: 'd', c: 'on', n: 'Lifecycle', t: 'CSV log', s: ok('1,340'), z: '22 MiB', f: '1,340' },
  { l: 2, k: 'd', open: 1, c: 'mix', n: 'History', t: 'CSV log', s: ok('713'), z: '19 MiB', f: '713' },
  { l: 3, k: 'd', c: 'on', n: 'All', t: 'CSV log', s: ok('420'), z: '11 MiB', f: '420', focus: 1 },
  { l: 3, k: 'd', c: 'off', n: 'Summary', tag: 'Likely duplicate', t: 'CSV log', s: ok('293'), r: 'of All', z: '8 MiB', f: '293' },
  { l: 2, k: 'd', c: 'on', n: 'Service', t: 'Text log', s: ok('60'), z: '100 MiB', f: '60' },
  { l: 1, k: 'd', c: 'dis', n: 'Project', m: 1, t: 'Mixed', s: no('8,529'), r: 'Binary project data', z: '2.97 GiB', f: '8,529' },
  { l: 1, k: 'd', open: 1, c: 'mix', n: 'System', t: 'Mixed', s: `${ok('2')}&nbsp;${lim('3')}&nbsp;${er('1')}`, z: '3.41 GiB', f: '6' },
  { l: 2, k: 'f', c: 'on', n: 'Event0.evtx', t: 'Windows event log', s: W.ok, z: '1,011 MiB' },
  { l: 2, k: 'f', c: 'on', n: 'Event1.evtx', t: 'Windows event log', s: W.ok, z: '1,011 MiB' },
  { l: 2, k: 'f', c: 'dis', n: 'Event2.evtx', t: 'Windows event log', s: W.err, r: 'Locked by a program', z: '1,011 MiB' },
  { l: 2, k: 'd', c: 'off', n: 'Exports', tag: 'Likely duplicate', t: 'Text log', s: lim('3'), r: 'of Event*; no time', z: '458 MiB', f: '3' },
  { l: 1, k: 'd', c: 'on', n: 'Dumps', t: 'Crash dump', s: ok('22'), z: '895 MiB', f: '22' },
  { l: 1, k: 'd', c: 'on', n: 'Archives', t: 'ZIP archive', s: ok('4'), z: '1 MiB', f: '4' },
];
const dupNote = `<div class="note"><span class="ic">${I.info}</span><span class="tx">2 sets of likely duplicates. Debrief chose one of each; check the other if you want both.</span><span class="btn small">Show them</span></div>`;

const STATES = {
  selection() {
    return frame(TITLE, path('14,000 files, 7.56 GiB. Scan finished.', undefined, 'Asia/Tokyo · from neighbouring logs') + tb() + dupNote + grid('full', treeSel, { sh: 62 })
      + cost({ n: '2,458', b: '3.12 GiB', left: '11,542 files', w: '1 file could not be read' }), foot());
  },
  reasons() {
    const line = (l, n, b) => `<div style="display:grid;grid-template-columns:minmax(0,1fr) 56px 64px;gap:12px;height:28px;align-items:center;padding:0 8px;border-radius:6px;font-variant-numeric:tabular-nums"><span>${l}</span><span style="text-align:end">${n}</span><span style="text-align:end;color:var(--pd-text-muted)">${b}</span></div>`;
    const pop = `<div style="position:absolute;left:300px;bottom:102px;width:356px;padding:4px;background:var(--pd-surface-3);border:1px solid var(--pd-hairline);border-radius:var(--pd-radius-popover);box-shadow:var(--pd-shadow-2);z-index:5"><div style="display:grid;grid-template-columns:minmax(0,1fr) 56px 64px;gap:12px;height:24px;align-items:center;padding:0 8px;font-size:var(--pd-text-label);color:var(--pd-text-muted)"><span>Why they are not selected</span><span style="text-align:end">Files</span><span style="text-align:end">Size</span></div>`
      + line('Binary file', '7,429', '1.90 GiB') + line('No parser reads this file', '3,770', '1.10 GiB') + line('Likely duplicate', '296', '466 MiB') + line('Empty file', '46', '0 B') + line('Could not be read', '1', '1,011 MiB') + `</div>`;
    return STATES.selection().replace('<div class="foot">', pop + '<div class="foot">');
  },
  scanning() {
    const rows = [
      { ...logs, s: `${ok('1,950')}&nbsp;${stat('wait', '773')}` },
      { l: 2, k: 'd', c: 'on', n: 'AppA', t: 'CSV log', s: ok('610'), z: '140 MiB', f: '610' },
      { l: 2, k: 'd', c: 'on', n: 'Lifecycle', t: 'CSV log', s: ok('1,340'), z: '22 MiB', f: '1,340' },
      { l: 2, k: 'd', open: 1, c: 'off', n: 'History', t: '~', s: stat('wait', '713'), z: '19 MiB', f: '713' },
      { l: 3, k: 'd', open: 1, c: 'off', n: 'All', t: '~', s: stat('wait', '420'), z: '11 MiB', f: '420', focus: 1 },
      { l: 4, k: 'f', c: 'off', n: 'all_0000.csv', t: '~', s: W.wait, z: '26 KiB' },
      { l: 4, k: 'f', c: 'off', n: 'all_0001.csv', t: '~', s: W.wait, z: '31 KiB' },
      { l: 4, k: 'f', c: 'off', n: 'all_0002.csv', t: '~', s: W.wait, z: '18 KiB' },
      { l: 3, k: 'd', c: 'off', n: 'Summary', t: '~', s: stat('wait', '293'), z: '8 MiB', f: '293' },
      { l: 2, k: 'd', c: 'off', n: 'Service', t: '~', s: stat('wait', '60'), z: '100 MiB', f: '60' },
      { l: 1, k: 'd', c: 'off', n: 'Project', t: '~', s: stat('wait', '8,529'), z: '2.97 GiB', f: '8,529' },
      { l: 1, k: 'd', c: 'off', n: 'System', t: '~', s: stat('wait', '6'), z: '3.41 GiB', f: '6' },
      { l: 1, k: 'd', c: 'off', n: 'Dumps', t: '~', s: stat('wait', '22'), z: '895 MiB', f: '22' },
      { l: 1, k: 'd', c: 'off', n: 'State', t: '~', s: stat('wait', '1,580'), z: '1 MiB', f: '1,580' },
    ];
    const prog = `<div class="progress"><span class="lab">Detecting file types</span><span class="track"><i style="width:14%"></i></span><span class="count">1,950 of 14,000 files</span></div>`;
    return frame(TITLE, path('14,000 files, 7.56 GiB. Still scanning.') + tb() + prog + grid('full', rows, { sh: 38 })
      + cost({ n: '1,950', b: '162 MiB', left: '', pend: '12,050 not scanned yet' }), foot({ msg: 'Import selected starts when the scan ends.' }));
  },
  huge() {
    const r = [];
    const names = [['W000', 'win_00412.xaml', '1.60 MiB'], ['W000', 'win_00078.xaml', '1.60 MiB'], ['W000', 'win_00903.xaml', '1.59 MiB'], ['W000', 'win_00116.xaml', '1.58 MiB'], ['W000', 'win_00651.xaml', '1.58 MiB']];
    r.push({ l: 1, k: 'd', open: 1, c: 'dis', m: 1, n: 'Project', t: 'XML, UTF-16', s: no('1,100'), z: '1.10 GiB', f: '1,100' });
    r.push({ l: 2, k: 'd', open: 1, c: 'dis', m: 1, n: 'Windows', t: 'XML, UTF-16', s: no('1,100'), z: '1.10 GiB', f: '1,100' });
    r.push({ l: 3, k: 'd', open: 1, c: 'dis', m: 1, n: 'W000', t: 'XML, UTF-16', s: no('41'), z: '42 MiB', f: '41' });
    names.forEach((n, i) => r.push({ l: 4, k: 'f', c: 'dis', m: 1, n: n[1], t: 'XML, UTF-16', s: W.no, r: 'No parser reads this file', z: n[2], focus: i === 1 }));
    ['win_00288', 'win_00034', 'win_00745', 'win_00501'].forEach((n, i) => r.push({ l: 4, k: 'f', c: 'dis', m: 1, n: n + '.xaml', t: 'XML, UTF-16', s: W.no, r: 'No parser reads this file', z: ['1.57', '1.56', '1.56', '1.55'][i] + ' MiB' }));
    r.push({ l: 3, k: 'd', open: 0, c: 'dis', m: 1, n: 'W001', t: 'XML, UTF-16', s: no('38'), z: '39 MiB', f: '38' });
    r.push({ l: 3, k: 'd', open: 0, c: 'dis', m: 1, n: 'W002', t: 'XML, UTF-16', s: no('44'), z: '43 MiB', f: '44' });
    r.push({ l: 3, k: 'd', open: 0, c: 'dis', m: 1, n: 'W003', t: 'XML, UTF-16', s: no('36'), z: '37 MiB', f: '36' });
    return frame(TITLE, path('14,000 files, 7.56 GiB. Scan finished.') + tb({ q: '.xaml', s: 'Not supported', c: '1,100 of 14,000 files' }) + grid('full', r, { sort: 'size', st: 3, sh: 4 })
      + cost({ n: '2,458', b: '3.12 GiB', left: '11,542 files' }), foot({ msg: 'The filter only hides rows: the selection stays as it was.' }));
  },
  cut() {
    const note = `<div class="note warn"><span class="ic">${I.warn}</span><span class="tx">Looked at the first 500,000 of more than 500,000 entries. Anything not listed is not imported.</span><span class="btn small">Open a subfolder…</span></div>`;
    const r = ['Y2024', 'Y2025', 'Y2026'].map((n, i) => ({ l: 1, k: 'd', c: 'mix', n, t: 'Mixed', s: `${ok(['41,204', '62,877', '12,330'][i])}&nbsp;${no(['102,002', '181,450', '100,137'][i])}`, z: ['88 GiB', '140 GiB', '31 GiB'][i], f: ['143,206', '244,327', '112,467'][i] }));
    return frame(TITLE, path('more than 500,000 files. 259 GiB listed.', '…/Archive/AllStations'.replace('Stations','Machines')) + tb() + note + grid('full', r, { sh: 100 })
      + cost({ n: '116,411', b: '41 GiB', left: '383,589 files' }), foot());
  },
  nothing() {
    const r = [
      { l: 1, k: 'd', c: 'dis', m: 1, n: 'Resources', t: 'Binary', s: no('380'), r: 'Binary file', z: '61 MiB', f: '380' },
      { l: 1, k: 'd', c: 'dis', m: 1, n: 'Layouts', t: 'INI-like text', s: no('30'), r: 'No parser reads these', z: '2 MiB', f: '30' },
      { l: 1, k: 'f', c: 'dis', m: 1, n: 'placeholder.tmp', t: 'Empty', s: W.no, r: 'Empty file', z: '0 B' },
      { l: 1, k: 'f', c: 'dis', m: 1, n: 'unused.dat', t: 'Empty', s: W.no, r: 'Empty file', z: '0 B' },
    ];
    const note = `<div class="note plain"><span class="ic">${I.info}</span><span class="tx"><b style="font-weight:var(--pd-weight-semibold)">Nothing here can be imported yet.</b> 412 files: 380 binary, 30 with no parser, 2 empty.</span><span class="btn small">Set up a format…</span><span class="btn small">Open another folder…</span></div>`;
    return frame(TITLE, path('412 files, 63 MiB. Scan finished.', '…/Incoming/ProjectCopy') + tb() + note + grid('full', r, { sh: 100 })
      + cost({ n: '0', b: '0 B', left: '412 files' }), foot({ cancel: 'Close', dis: 1 }));
  },
  error() {
    const note = `<div class="note danger"><span class="ic">${I.err.replace('width="14" height="14"','width="16" height="16"')}</span><span class="tx"><b style="font-weight:var(--pd-weight-semibold)">Debrief can’t read this folder.</b> The system denied access.</span><span class="btn small">Try again</span><span class="btn small">Choose another folder…</span></div>`;
    const inner = `<div class="empty"><span>No files listed.</span></div>`;
    return frame(TITLE, path('Not listed.', '…/Incoming/Protected') + tb().replace('class="bar"','class="bar" style="opacity:.55"') + note + grid('full', [], { inner, sh: 0 }), foot({ dis: 1, cancel: 'Close' }));
  },
  narrow() {
    const pick = treeSel.slice(0, 12);
    return frame(TITLE, path('14,000 files, 7.56 GiB') + `<div class="bar"><div class="filter">${I.search}<span>Filter by name</span></div><span class="sel"><b>Type</b> ${I.caret}</span><span class="sel"><b>Status</b> ${I.caret}</span><span class="spacer"></span><span class="tool">Select ${I.caret}</span></div>` + grid('tiny', pick, { sh: 40 })
      + `<div class="cost"><b>2,458 files, 3.12 GiB</b><span class="k">449 GiB free</span><span class="link">11,542 not selected ${I.caret.replace('width="12"','width="10"')}</span></div>`, foot());
  },
};
document.getElementById('win').innerHTML = STATES[state]();
</script>
