# cargo-nextest settings. Locally: `cargo nextest run --workspace` (the default profile); CI: `--profile ci`. nextest does
# not run doc tests: `cargo test --workspace --doc` runs them.
#
# Tests that start real child processes and time how a crash, hang or restart is detected (fake workers, fake
# plugins, the IPC fake child, the built-in plugins' processes) are sensitive to a busy machine. They run one at a time in
# their own group. Locally they get two retries (nextest reports a test that only passed on a retry as FLAKY, so
# flakiness stays visible); CI never retries (Paddock rule 5: a flaky test is fixed, not retried).
# Everything else runs in parallel as usual.
#
# Each crate's integration tests are one binary, `it` (tests/it/main.rs, one module per former tests/<name>.rs), so a
# former binary is a test-name prefix here: `binary(it) & test(/^worker::/)`.

[test-groups]
child-processes = { max-threads = 1 }
# The shell's unit tests (debrief-app's lib): nearly every one builds a test app, which starts the plugins binary (its
# manifests, then a process per plugin it uses) and an in-process store. Fourteen at once on the Mac runner meant 84 plugin
# processes and a load of 116 on 14 cores (CI 7096 and the watch after it; apps/debrief/docs/performance.md). Six at a time;
# the rest of the workspace fills the other threads. The filter is the whole binary, so a new test there joins the group
# without a list to update (conformance/test/ci-actions.test.mjs checks it).
app-plugin-processes = { max-threads = 6 }
# chromium-driver's real-browser tests (tests/it/real_browser.rs) take turns: two Chrome for Testing cold starts side by side,
# beside the heavy suites, starved each other on the loaded Mac runner (CI 7213, 7250 and the run after). The start itself is
# judged on the browser's run state (ADR 0031); the group keeps them from competing with each other.
real-browser = { max-threads = 1 }
# debrief-store-duck's waived suites (the differential, analysis and large-folder tests in profile.ci below) each import
# whole sample workspaces. Five at once beside the rest of the workspace on a shared Mac runner pushed three past their 180 s
# waiver (CI 7822, three macOS jobs on one host); two at a time instead of a longer limit (ER-12).
duck-heavy = { max-threads = 2 }

[profile.default]
# One test per core but one (Paddock rule 13), so a full run leaves the machine usable.
test-threads = -1
# A test still running after 30 s is reported as SLOW (and again every 30 s); one still running after five minutes is
# stopped instead of letting a hang stall the run.
slow-timeout = { period = "30s", terminate-after = 10 }

[[profile.default.overrides]]
filter = '''
    (package(debrief-ipc) & binary(it) & (test(/^launch::/) | test(/^child_log::/)))
    | (package(debrief-plugin-host) & binary(it) & test(/^remote::/))
    | (package(debrief-plugins) & kind(test))
    | (package(debrief-plugin-windows) & test(eventlog::follower::))
    | (package(debrief-plugin-test) & kind(test))
    | (package(debrief-plugin-e2e) & kind(test))
    | (package(debrief-example-*) & kind(test))
'''
test-group = 'child-processes'
retries = 2

[[profile.default.overrides]]
filter = 'package(chromium-driver) & binary(it) & test(/^real_browser::/)'
test-group = 'real-browser'

[[profile.default.overrides]]
filter = 'package(debrief-app) & kind(lib)'
test-group = 'app-plugin-processes'

# CI (.gitea/workflows/debrief.yml (repo root)): every failure reported, no retries, a JUnit report.
[profile.ci]
fail-fast = false
retries = 0
failure-output = "immediate-final"
# Every core, where a CI job has its host to itself. On a shared host (three macOS runners on one Mac) build-jobs.sh
# sets NEXTEST_TEST_THREADS to the job's core share, which overrides this (conformance/ci/build-jobs.sh).
test-threads = "num-cpus"
# The time budget of one test (Paddock rule 40, as crates/.config/nextest.toml): reported SLOW after 30 s and stopped,
# failing the run, after 90 s, so a hung test costs a minute and a half instead of five (CI 6381: a hang in long_ops held
# the Linux run for 300 s). A test that needs longer is a waiver below: an override with a `# waiver:` line saying why;
# conformance/test/ci-actions.test.mjs checks both. The longest other tests took 30-40 s on CI (6381).
slow-timeout = { period = "30s", terminate-after = 3 }

[profile.ci.junit]
# Written to <target>/nextest/ci/junit.xml.
path = "junit.xml"

# A profile's own overrides are matched before the default profile's, so this one wins over `retries = 2` above (the
# group and timeouts still apply).
[[profile.ci.overrides]]
filter = 'all()'
retries = 0

# waiver: the DuckDB store answers every query and analysis of the sample workspaces like the reference engine, one profile
# per test (47-81 s in CI 6381), and the large-folder import measures progress over a generated folder of many files (89 s).
# Two at a time (duck-heavy) since CI 7822 stopped three of five at 180 s: under load the slowest took 34-39 s grouped and 48 s
# all at once (docs/performance.md, "The store's waived suites under load", 2026-11-09).
[[profile.ci.overrides]]
filter = "package(debrief-store-duck) & binary(it) & (test(/^differential::answers_like_the_workspace_/) | test(/^analysis::analyses_match_the_workspace_/) | test(/^large_folder::/))"
slow-timeout = { period = "30s", terminate-after = 6 }
test-group = 'duck-heavy'

# waiver: a real browser's start is judged on its run state (ADR 0031): a working start on a loaded runner is waited for, and
# only a stuck one fails, after up to 120 s of CPU without becoming ready (the spin patience); 90 s would stop the test first.
[[profile.ci.overrides]]
filter = "package(chromium-driver) & binary(it) & test(/^real_browser::/)"
slow-timeout = { period = "30s", terminate-after = 6 }
