[package]
name = "xtask"
license.workspace = true
repository.workspace = true
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Repository chores for Debrief developers (`cargo xtask <task>`); never part of the app"

[dependencies]
flate2.workspace = true
sha2.workspace = true
tar.workspace = true
toml.workspace = true
# The pinned libduckdb download (`cargo xtask libduckdb`): the OS trust store, as in debrief-ai, so TLS-inspecting
# proxies work; the proxy itself comes from the environment.
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }

[dev-dependencies]
tempfile.workspace = true
