[package]
name = "xtask"
license.workspace = true
repository.workspace = true
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Repository chores for Debrief developers (`cargo xtask <task>`); never part of the app"

[dependencies]
flate2.workspace = true
sha2.workspace = true
tar.workspace = true
toml.workspace = true
# The pinned libduckdb download (`cargo xtask libduckdb`): the OS trust store, as in debrief-ai, so TLS-inspecting
# proxies work; the proxy itself comes from the environment.
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }

[dev-dependencies]
paddock-testkit = { path = "../../../crates/paddock-testkit" }
tempfile.workspace = true

[package.metadata.paddock]
# What this crate's tests read that the test cache's reads extractor cannot resolve (ADR 0116 §2, user decision 122), as globs from the
# repository root; `[]` says the blind reads touch no repository file.
# `src/main.rs` tests: the sample generator and the libduckdb fetch script, by repository-relative paths.
test-reads = [
    "apps/debrief/samples/generate.py",
    "apps/debrief/crates/debrief-store-duck/scripts/fetch-libduckdb.sh",
]
