# The Gitea cargo registry of the Paddock crates (crates/README.md, "Consuming the crates"; no token needed to read). The
# shell crates' own manifests name it, so the app's build needs it even while it uses them by path.
[registries.decryp7]
index = "sparse+https://dev.decryptology.net/api/packages/decryp7/cargo/"
