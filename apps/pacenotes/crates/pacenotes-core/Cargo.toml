[package]
name = "pacenotes-core"
description = "Pacenotes' pure core: ids that survive renames, locations, revisions, confidence and tiers, finding states, the ports the core owns (history, store, embedder, vector index, language server, LLM) and the validated schemas of language-server packs and review rules."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
# In-memory fakes of every port and the contract test of each (`pacenotes_core::contract`), for the adapters' own tests.
testing = []

[dependencies]
paddock-jobs = { workspace = true }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
toml = "1"

[dev-dependencies]
serde_json = "1"
proptest = "1"
paddock-testkit = { workspace = true }

[lints]
workspace = true
