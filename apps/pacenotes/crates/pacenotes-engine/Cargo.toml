paddock-jobs = { workspace = true }
paddock-repo-files = { path = "../../../../crates/paddock-repo-files" }
paddock-watch = { path = "../../../../crates/paddock-watch" }
thiserror = "2"

[dev-dependencies]
paddock-testkit = { workspace = true }

[lints]
workspace = true
