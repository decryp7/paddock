# cargo-nextest settings for Pacenotes' Cargo workspace (the same profiles as crates/.config/nextest.toml, without the
# browser group). Locally: `cargo nextest run --workspace`; CI (apps/pacenotes/paddock.ci.json): `--profile ci`. nextest does not
# run doc tests: `cargo test --workspace --doc` runs them.

[profile.default]
# One test per core but one (rules.md 13), so a full run leaves the machine usable.
test-threads = -1
slow-timeout = { period = "30s", terminate-after = 10 }

# CI: every failure reported, no retries (rules.md 5: a flaky test is fixed, not retried), a JUnit report.
[profile.ci]
fail-fast = false
retries = 0
failure-output = "immediate-final"
# A CI job has its runner to itself.
test-threads = "num-cpus"
# The time budget of one test (rule 40): reported SLOW after 30 s and stopped after 60 s. A test that needs longer is a
# waiver here: an override with a `# waiver:` line saying why (conformance/test/ci-actions.test.mjs).
slow-timeout = { period = "30s", terminate-after = 2 }

[profile.ci.junit]
path = "junit.xml"
