</svg><text class="name" x="132" y="68" style="font-size:28px">How Pacenotes works</text>
<circle class="accfill" cx="260" cy="188" r="44"/><g class="gl" transform="translate(242 170) scale(1.5)"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 12.5l9 5 9-5M3 17l9 5 9-5"/></g><path class="conn" d="M318 188 L554 188"/><path class="chev" d="M548 182 l7 6 -7 6"/><text class="stepn" x="260" y="272" text-anchor="middle">STEP 1</text><text class="stept" x="260" y="302" text-anchor="middle">Index</text><text class="steps" x="260" y="330" text-anchor="middle">Reads the repository</text><text class="steps" x="260" y="358" text-anchor="middle">without running it.</text>
<circle class="accfill" cx="620" cy="188" r="44"/><g class="gl" transform="translate(602 170) scale(1.5)"><circle cx="6" cy="6" r="2.4"/><circle cx="6" cy="18" r="2.4"/><circle cx="18" cy="12" r="2.4"/><path d="M8 7l8 4M8 17l8-4"/></g><path class="conn" d="M678 188 L914 188"/><path class="chev" d="M908 182 l7 6 -7 6"/><text class="stepn" x="620" y="272" text-anchor="middle">STEP 2</text><text class="stept" x="620" y="302" text-anchor="middle">Understand</text><text class="steps" x="620" y="330" text-anchor="middle">Symbols, references and</text><text class="steps" x="620" y="358" text-anchor="middle">call graphs.</text>
<circle class="accfill" cx="980" cy="188" r="44"/><g class="gl" transform="translate(962 170) scale(1.5)"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="9" r="2"/><path d="M6 7v10M18 11c0 4-8 2-12 6"/></g><path class="conn" d="M1038 188 L1274 188"/><path class="chev" d="M1268 182 l7 6 -7 6"/><text class="stepn" x="980" y="272" text-anchor="middle">STEP 3</text><text class="stept" x="980" y="302" text-anchor="middle">Review and trace</text><text class="steps" x="980" y="330" text-anchor="middle">Diffs, diagrams and</text><text class="steps" x="980" y="358" text-anchor="middle">requirements.</text>
<circle class="accfill" cx="1340" cy="188" r="44"/><g class="gl" transform="translate(1322 170) scale(1.5)"><rect x="4" y="4" width="16" height="6" rx="2"/><rect x="4" y="14" width="16" height="6" rx="2"/><path d="M8 7h.01M8 17h.01"/></g><text class="stepn" x="1340" y="272" text-anchor="middle">STEP 4</text><text class="stept" x="1340" y="302" text-anchor="middle">Serve over MCP</text><text class="steps" x="1340" y="330" text-anchor="middle">Local AI gets the same</text><text class="steps" x="1340" y="358" text-anchor="middle">view.</text>
<line x1="80" x2="1520" y1="434" y2="434" stroke="var(--line)"/>
<text class="small" x="80" y="472">Pitwall calls it over MCP, Debrief checks log lines against it and Pitcrew runs it in CI.</text>
</svg>