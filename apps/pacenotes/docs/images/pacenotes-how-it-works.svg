    <filter id="p2fgs" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#302501" flood-opacity="0.32"/></filter>
    <filter id="p2fts" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/></filter>
    <mask id="p2fm0" maskUnits="userSpaceOnUse" x="-2000" y="-2000" width="5000" height="5000"><rect x="-2000" y="-2000" width="5000" height="5000" fill="#fff"/><path d="M374 246H674A40 40 0 0 1 714 286V702A40 40 0 0 1 674 742H374A40 40 0 0 1 334 702V286A40 40 0 0 1 374 246Z" fill="#000"/></mask><mask id="p2fm1" maskUnits="userSpaceOnUse" x="-2000" y="-2000" width="5000" height="5000"><rect x="-2000" y="-2000" width="5000" height="5000" fill="#fff"/><path d="M367 330a21 21 0 1 1 42 0a21 21 0 1 1 -42 0Z" fill="#000"/><path d="M367 494a21 21 0 1 1 42 0a21 21 0 1 1 -42 0Z" fill="#000"/><path d="M367 658a21 21 0 1 1 42 0a21 21 0 1 1 -42 0Z" fill="#000"/><path d="M452 346H664M452 406H600M486 462L456 508L486 554M536 456L516 560M566 462L596 508L566 554M456 700C530 700 520 636 592 636C630 636 650 650 662 676" fill="none" stroke="#000" stroke-width="26" stroke-linecap="round"/></mask>
