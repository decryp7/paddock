[package]
name = "pitcrew-app"
description = "Pitcrew — a runner manager for Gitea and Forgejo: tray app and window"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors = ["decryp7"]
publish = false

[lib]
name = "pitcrew_app_lib"
# rlib only: the desktop binary links the rlib. Tauri's template also builds a staticlib (iOS) and a cdylib (Android) on
# every build, which cost 25-38% of an incremental debug rebuild (docs/research/2026-10-29-link-time.md). Add them back
# only for a mobile target.
crate-type = ["rlib"]

[build-dependencies]
paddock-build = { path = "../../../../crates/paddock-build", features = ["tauri-build"] }

[dependencies]
pitcrew-core.workspace = true
notify-channels = { path = "../../crates/notify-channels" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# "macos-private-api": the transparent window with vibrancy on macOS (tauri.macos.conf.json `macOSPrivateApi`); a no-op
# elsewhere. It must sit here, not under a target table: tauri-build checks only this list against the config.
tauri = { version = "2.12.4", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
# >= 2.12 fixes GHSA-j38x-g3m3-95fr (downgrade through the unsigned manifest version); see docs/releasing.md.
# No "zip": Pitcrew publishes v2 updater artifacts (the installers themselves). "rustls-tls" with the platform verifier
# trusts the OS certificate store, so update checks work behind TLS-inspecting proxies.
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }
# The OS credential store (Windows Credential Manager, macOS Keychain) for the Gitea read token and, if the user
# asks, the registration token (ADR 0005).
# Through paddock-secrets' Vault port (ADR 0077 WP-4): its keyring adapter is the one door to the store, and tests use its
# MemoryVault. The entries keep the names this app wrote before.
paddock-secrets = { path = "../../../../crates/paddock-secrets", features = ["keyring"] }
# The Gitea API (current job details, job outcomes) with the user's read token: HTTPS, OS certificate store.
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
# The diagnostics bundle.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
# Asking the Service Control Manager whether the service is installed and running (no rights needed).
windows-service = "0.8"
# The taskbar's light/dark setting (for the tray icon), read only.
winreg = "0.56"
webview2-com = "0.39"
# Starting `pitcrew-service install` with Windows' own elevation prompt (ShellExecuteExW "runas").
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Registering the bundled launch agent with SMAppService (macOS 13+, ADR 0003).
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService"] }

[lints]
workspace = true
