[package]
name = "pitcrew-service"
description = "Pitcrew's background service: supervises CI runners under the Windows Service Control Manager or a macOS launch agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "pitcrew-service"
path = "src/main.rs"

[dependencies]
pitcrew-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
# Local time for update windows and day boundaries.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# The IPC server (named pipe / Unix socket) only; supervision runs on plain threads.
tokio = { version = "1.54", default-features = false, features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal"] }
# Child processes, machine metrics and disk space without platform FFI.
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk"] }
# Release discovery and downloads: HTTPS with the OS certificate store.
# Runner downloads: segmented Range requests, per-host caps and 429 back-off, resume, one SHA-256 while writing, the
# free-space check, Cancel in every phase, progress as a job (rules 11-15). The service's own jobs are never shown by Tauri here.
paddock-download = { path = "../../../../crates/paddock-download" }
paddock-jobs = { path = "../../../../crates/paddock-jobs" }
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }

# The Service Control Manager integration (MIT OR Apache-2.0, maintained by Mullvad): safe wrappers around the
# service dispatcher, control handler and service manager APIs.
[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
# Session APIs (WTSQueryUserToken, CreateProcessAsUserW), console control events and the pipe ACL (ADR 0003, 0004).
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Environment",
  "Win32_System_Pipes",
  "Win32_System_RemoteDesktop",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

# Graceful stop (SIGTERM to the runner's process group) without unsafe code.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal", "process", "user"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
# The fake runner (examples/fake_runner.rs) stops on Ctrl+Break / SIGTERM like the real one.
ctrlc = { version = "3.5", features = ["termination"] }

[lints]
workspace = true
