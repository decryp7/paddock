[package]
name = "pitcrew-service"
description = "Pitcrew's background service: supervises CI runners under the Windows Service Control Manager or a macOS launch agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
doctest = false # doctests are off (crates/README.md, "Doctests")
path = "src/lib.rs"

[[bin]]
name = "pitcrew-service"
path = "src/main.rs"

[features]
# Test support (rule 99; ADR 0122 §4): the IPC server's act gate (`Host::start_with_act_gate`) for the ending test. Enabled
# from `[dev-dependencies]` only, never in a shipped build (`./dev check test-features`, C170).
test-support = []

[dependencies]
# The shared atomic file replace (a temporary name of its own per write).
paddock-env = { path = "../../../../crates/paddock-env" }
pitcrew-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
# Local time for update windows and day boundaries.
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-bundle-always"] }
# The IPC server (named pipe / Unix socket) only; supervision runs on plain threads.
tokio = { version = "1.54", default-features = false, features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal"] }
# The three-valued look at a pid (an unlisted pid is gone only when the OS says so).
paddock-proc = { path = "../../../../crates/paddock-proc" }
# Child processes, machine metrics and disk space without platform FFI.
sysinfo = { version = "0.40", default-features = false, features = ["system", "disk"] }
# Release discovery and downloads: HTTPS with the OS certificate store.
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }

# The Service Control Manager integration (MIT OR Apache-2.0, maintained by Mullvad): safe wrappers around the
# service dispatcher, control handler and service manager APIs.
[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
# Session APIs (WTSQueryUserToken, CreateProcessAsUserW), console control events and the pipe ACL (ADR 0003, 0004).
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Environment",
  "Win32_System_Pipes",
  "Win32_System_RemoteDesktop",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

# Graceful stop (SIGTERM to the runner's process group) without unsafe code.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal", "process", "user"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
# The boot-volume temp folder for the runner the tests start disclaimed (tests/supervision.rs, launch.rs, disclaim.rs).
paddock-testkit = { path = "../../../../crates/paddock-testkit" }
# The identity of a pid read from a file, an output line or a process list (tests/supervision.rs, rule 53).
paddock-testkit-start = { path = "../../../../crates/paddock-testkit-start" }
# The ending harness of ADR 0072 (tests/endings.rs): the raw-stream client, the scenarios, the ratchet.
paddock-ipc = { path = "../../../../crates/paddock-ipc", features = ["test-support"] }
# The self dev-dependency that turns `test-support` on for this package's own integration tests (rule 99): the act gate.
pitcrew-service = { path = ".", features = ["test-support"] }
# The fake runner (examples/fake_runner.rs) stops on Ctrl+Break / SIGTERM like the real one.
ctrlc = { version = "3.5", features = ["termination"] }

[lints]
workspace = true

[package.metadata.paddock]
# What this crate's tests read that the test cache's reads extractor cannot resolve (ADR 0116 §2, user decision 122), as globs from the
# repository root; `[]` says the blind reads touch no repository file.
# `tests/endings.rs` loads the endings register and ratchet.
# Root rules (ADR 0116 §6), read site by site: also `current_exe` (the test binary started again, or files beside it: build output);
# paths taken from the environment (`HOME`, `XDG_*`, `OUT_DIR`, `CARGO_*`, tool and runtime folders, folders a test passes);
# `home_dir` (the user's folder). None is a repository file outside the globs.
test-reads = [
    "docs/ipc-endpoints.toml",
    "docs/ipc-endpoint-ratchet.toml",
]
