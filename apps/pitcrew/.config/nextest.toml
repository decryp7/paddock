# cargo-nextest settings for pitcrew's Cargo workspace (the same profiles as crates/.config/nextest.toml). Locally:
# `cargo nextest run --workspace`; CI (ci.yml's pitcrew legs, .gitea/actions/app-gates): `--profile ci`. nextest does not run doc tests:
# `cargo test --workspace --doc` runs them. nextest runs every test in its own process, so a lock a test file takes
# around a shared outside resource (a real browser, a port) is a test group here, not only a static Mutex.

[profile.default]
# Bounded: a test still running after two minutes (four periods) is stopped and fails (ER-21, conformance C114); a test
# that needs longer is a named override with a `# waiver:` line, not a longer default.
# One test per core but one (rules.md 13), so a full run leaves the machine usable.
test-threads = -1
slow-timeout = { period = "30s", terminate-after = 4 }

# Class build (crates/paddock-testkit/src/build_cost.rs): a test that starts a compiler or a `cargo build` has the name prefix `build_`
# (`paddock_testkit::build_cost::charge` fails a test of another name under nextest; tools/paddock-dev/tests/it/build_cost.rs checks the
# places that start a build and this override). The supervision tests build the `fake_runner` example when it is missing (a `cargo test
# --test supervision` does not build examples). In the default profile, so the ci profile inherits it.
# waiver: the build class's budget, a hang backstop and not a performance limit (ER-12), from the cold time of docs/benchmarks.md "2026-11-28,
# test build cost class": `cargo build -p pitcrew-service --example fake_runner` took 138.3 s from a fresh build folder with no sccache (Mac mini
# of 14 cores at a 1-minute load of 7 to 20). 900 s is 6.5x that.
[[profile.default.overrides]]
filter = 'test(/(^|::)build_[^:]*$/)'
slow-timeout = { period = "60s", terminate-after = 15 }

# CI: every failure reported, one retry that still fails the run (ER-12: flaky-result = "fail"), a JUnit report.
[profile.ci]
# ADR 0103 (D2): a test whose child still holds its output 500 ms after the test ended is reported as LEAK. Report-only (ER-41):
# result = "pass" until the first green CI run with it on main, recorded here by run id; then "fail" (nextest 0.9.95 or later).
leak-timeout = { period = "500ms", result = "pass" }
fail-fast = false
retries = 1
flaky-result = "fail"
failure-output = "immediate-final"
# Every core, where a CI job has its host to itself. On a shared host (three macOS runners on one Mac) build-jobs.sh
# sets NEXTEST_TEST_THREADS to the job's core share, which overrides this (conformance/ci/build-jobs.sh).
test-threads = "num-cpus"
# The time budget of one test (rule 40): reported SLOW after 30 s and stopped, failing the run, after 60 s. A test that
# needs longer is a waiver below: an override with a `# waiver:` line saying why (conformance/test/ci-actions.test.mjs).
slow-timeout = { period = "30s", terminate-after = 2 }

[profile.ci.junit]
path = "junit.xml"
