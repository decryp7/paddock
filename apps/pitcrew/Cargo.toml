[workspace]
members = ["crates/pitcrew-core", "crates/pitcrew-service", "app/src-tauri"]
resolver = "2"

# Shared by every member: `edition.workspace = true` etc.
[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.88"
repository = "https://dev.decryptology.net/decryp7/Pitcrew"
version = "0.1.0"

# Versions of the dependencies that two or more members use, so they stay on one version.
[workspace.dependencies]
pitcrew-core = { path = "crates/pitcrew-core" }
regex = "1.12"
semver = { version = "1", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
toml = "1"
# Parses the runner's config.yaml for validation (syntax and types); edits never re-serialise it (ADR 0011).
serde_norway = "0.9"

# Dependencies are optimised even in debug builds; workspace crates stay at opt-level 0 for fast rebuilds.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
debug = "line-tables-only"

# Shipped builds (`cargo build --profile dist`, `tauri build -- --profile dist`).
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = true

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
