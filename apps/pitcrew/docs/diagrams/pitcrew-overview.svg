<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 870" width="1240" height="870" role="img" aria-labelledby="t d">
  <title id="t">Pitcrew architecture overview</title>
  <desc id="d">The outside world (Gitea or Forgejo server, runner release hosts, Pitcrew releases, the operating system) meets the Pitcrew service, which supervises runner processes, restarts stalled or crashed runners, updates them safely with roll-back and cleans their disks. The Pitcrew app (window, tray, Rust shell) shows and controls it over one local IPC. A pure Rust core holds all the rules.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah"/></marker></defs>
  <style>
    :root { --bg:#ffffff; --panel:#f6f6f8; --ink:#17181c; --muted:#555a65; --line:#d2d3da; --a:#2a78d6; --b:#d4440d; --c:#1baf7a; --d:#c98500; --e:#6b707c; --soft-a:#e4eefa; --soft-b:#fbe9e1; --soft-c:#dff4eb; --soft-d:#fdf3d9; --soft-e:#efeff2; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d0e11; --panel:#15161a; --ink:#ececf0; --muted:#a3a7b1; --line:#353841; --a:#3987e5; --b:#ff8a4c; --c:#199e70; --d:#c98500; --e:#868a96; --soft-a:#14243a; --soft-b:#2e1b12; --soft-c:#0f2a21; --soft-d:#2c2410; --soft-e:#1b1c21; }
    }
    text { font-family: Arial, Helvetica, sans-serif; fill: var(--ink); }
    .bg { fill: var(--bg); }
    .title { font-size: 26px; font-weight: 700; }
    .sub { font-size: 14px; fill: var(--muted); }
    .h { font-size: 16px; font-weight: 700; }
    .h2 { font-size: 14px; font-weight: 700; }
    .t { font-size: 12px; }
    .m { font-size: 11px; fill: var(--muted); }
    .col { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
    .box { stroke-width: 1.5; }
    .ext { fill: var(--soft-e); stroke: var(--e); stroke-dasharray: 6 4; }
    .svc { fill: var(--soft-a); stroke: var(--a); }
    .run { fill: var(--soft-d); stroke: var(--d); }
    .pri { fill: var(--soft-a); stroke: var(--a); }
    .ui { fill: var(--soft-b); stroke: var(--b); }
    .core { fill: var(--soft-c); stroke: var(--c); }
    .ar { stroke: var(--muted); stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 6 4; }
    .ah { fill: var(--muted); }
  </style>
  <rect class="bg" width="1240" height="870"/>
  <text class="title" x="30" y="52">Pitcrew</text>
  <text class="sub" x="30" y="80">A runner manager for Gitea and Forgejo: install, run, watch, update and clean CI runners · Windows, macOS and Linux</text>
  <text class="sub" x="30" y="104">keep running → update safely → show everything</text>
  <rect class="col" x="30" y="130" width="330" height="560" rx="14"/>
  <text class="h" x="54" y="164">Outside Pitcrew</text>
  <rect class="col" x="400" y="130" width="450" height="560" rx="14"/>
  <text class="h" x="424" y="164">Pitcrew service: keeps runners going</text>
  <rect class="col" x="890" y="130" width="320" height="560" rx="14"/>
  <text class="h" x="914" y="164">Pitcrew app: see and control</text>
  <rect class="box ext" x="54" y="180" width="282" height="118" rx="10"/>
  <text class="h2" x="70" y="206">Gitea / Forgejo server</text>
  <text class="t" x="70" y="228">Hands out jobs; runners register</text>
  <text class="t" x="70" y="245">and poll it. The app reads job</text>
  <text class="t" x="70" y="262">outcomes with a read-only token.</text>
  <rect class="box ext" x="54" y="316" width="282" height="118" rx="10"/>
  <text class="h2" x="70" y="342">Runner release hosts</text>
  <text class="t" x="70" y="364">dl.gitea.com and gitea.com</text>
  <text class="t" x="70" y="381">releases: version, binary and</text>
  <text class="t" x="70" y="398">SHA-256 checksums (two hosts).</text>
  <rect class="box ext" x="54" y="452" width="282" height="100" rx="10"/>
  <text class="h2" x="70" y="478">Pitcrew releases</text>
  <text class="t" x="70" y="500">latest.json and signed installers;</text>
  <text class="t" x="70" y="517">update checks are opt-in.</text>
  <rect class="box ext" x="54" y="570" width="282" height="100" rx="10"/>
  <text class="h2" x="70" y="596">The operating system</text>
  <text class="t" x="70" y="618">Service manager, credential store,</text>
  <text class="t" x="70" y="635">notifications, tray.</text>
  <rect class="box svc" x="424" y="180" width="402" height="96" rx="10"/>
  <text class="h2" x="440" y="206">Supervisor</text>
  <text class="t" x="440" y="228">One thread owns every runner: a controller,</text>
  <text class="t" x="440" y="245">a job tracker and an update machine each,</text>
  <text class="t" x="440" y="262">driven by one message channel.</text>
  <rect class="box svc" x="424" y="292" width="402" height="96" rx="10"/>
  <text class="h2" x="440" y="318">Watchdog and restarts</text>
  <text class="t" x="440" y="340">Stall rule: 6 timed-out polls in 15 min with</text>
  <text class="t" x="440" y="357">no job. Back-off 10 s to 5 min, crash-loop</text>
  <text class="t" x="440" y="374">pause. A running job is never killed.</text>
  <rect class="box svc" x="424" y="404" width="402" height="96" rx="10"/>
  <text class="h2" x="440" y="430">Safe updates</text>
  <text class="t" x="440" y="452">Download, verify, wait for the job, swap,</text>
  <text class="t" x="440" y="469">restart, confirm. Roll back automatically</text>
  <text class="t" x="440" y="486">if the new runner is not accepted.</text>
  <rect class="box svc" x="424" y="516" width="402" height="80" rx="10"/>
  <text class="h2" x="440" y="542">Housekeeping, history, metrics</text>
  <text class="t" x="440" y="564">Cleanup of work and cache folders; uptime,</text>
  <text class="t" x="440" y="581">restarts and jobs; CPU and memory of runners.</text>
  <rect class="box run" x="424" y="612" width="402" height="62" rx="10"/>
  <text class="h2" x="440" y="638">Runner processes</text>
  <text class="t" x="440" y="660">gitea-runner, one per runner, children of the service.</text>
  <rect class="box ui" x="914" y="180" width="272" height="134" rx="10"/>
  <text class="h2" x="930" y="206">Window</text>
  <text class="t" x="930" y="228">Dashboard, runners, activity,</text>
  <text class="t" x="930" y="245">logs, updates, settings and</text>
  <text class="t" x="930" y="262">the register wizard, dark</text>
  <text class="t" x="930" y="279">and light.</text>
  <rect class="box ui" x="914" y="330" width="272" height="100" rx="10"/>
  <text class="h2" x="930" y="356">Tray and notifications</text>
  <text class="t" x="930" y="378">Worst state at a glance; stalls,</text>
  <text class="t" x="930" y="395">crash loops, updates, disk.</text>
  <rect class="box pri" x="914" y="446" width="272" height="100" rx="10"/>
  <text class="h2" x="930" y="472">Rust shell</text>
  <text class="t" x="930" y="494">Validates every request, keeps</text>
  <text class="t" x="930" y="511">tokens in the OS credential store.</text>
  <rect class="box pri" x="914" y="562" width="272" height="112" rx="10"/>
  <text class="h2" x="930" y="588">Close it, crash it</text>
  <text class="t" x="930" y="610">The service goes on supervising;</text>
  <text class="t" x="930" y="627">quitting the app never stops</text>
  <text class="t" x="930" y="644">the runners.</text>
  <path class="ar" d="M340 240 L420 228" marker-end="url(#a)"/>
  <path class="ar" d="M340 378 L420 440" marker-end="url(#a)"/>
  <text class="m" x="352" y="224">jobs</text>
  <text class="m" x="346" y="418">releases</text>
  <path class="ar" d="M826 228 L910 228" marker-end="url(#a)"/>
  <path class="ar" d="M910 500 L830 500" marker-end="url(#a)"/>
  <text class="m" x="838" y="216">events</text>
  <text class="m" x="838" y="526">requests</text>
  <rect class="box core" x="30" y="712" width="1180" height="70" rx="10"/>
  <text class="h2" x="46" y="740">pitcrew-core: pure Rust, no I/O, no clock</text>
  <text class="t" x="46" y="762">Controller, watchdog, restart policy, update machine and policy, housekeeping plan, history, metrics, config, protocol; time comes in as values.</text>
  <rect class="box ext" x="30" y="808" width="22" height="14" rx="4"/>
  <text class="m" x="60" y="820">outside</text>
  <rect class="box svc" x="136" y="808" width="22" height="14" rx="4"/>
  <text class="m" x="166" y="820">service (keeps running)</text>
  <rect class="box run" x="338" y="808" width="22" height="14" rx="4"/>
  <text class="m" x="368" y="820">runners</text>
  <rect class="box pri" x="444" y="808" width="22" height="14" rx="4"/>
  <text class="m" x="474" y="820">shell</text>
  <rect class="box ui" x="538" y="808" width="22" height="14" rx="4"/>
  <text class="m" x="568" y="820">see and control</text>
  <rect class="box core" x="692" y="808" width="22" height="14" rx="4"/>
  <text class="m" x="722" y="820">pure core</text>
  <text class="m" x="30" y="846">One local IPC joins app and service: named pipe or Unix socket, JSON frames, pushed status events. Windows, macOS and Linux.</text>
</svg>
