# gitleaks configuration (.gitea/actions/gitleaks, the `gitleaks` job of ci.yml). The default rules stay on. Each entry below allows one known finding: the
# file AND the exact value (a regex on the secret) AND the rule (condition = "AND"), each with its reason. A new value in the same
# file, or the same value in another file, is still a leak until it is shown to be a fixture and gets an entry of its own.
title = "paddock"

[extend]
useDefault = true

[[allowlists]]
description = "a Cargo.lock package name next to a checksum, matched by the entropy rule; the lock holds no secrets"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^apps/debrief/Cargo\.lock$''']
regexes = [
  '''^ed25519-compact$''',
]

[[allowlists]]
description = "an invented value in a redaction test: the code under test must hide it"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^apps/debrief/app/src-tauri/src/activity/report\.rs$''']
regexes = [
  '''^abcd1234efgh$''',
]

[[allowlists]]
description = "the word key or token in a name (a keybinding, storage key or key id), not a secret"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^apps/debrief/app/src/app/diagnostics/diagnostics\.ids\.ts$''']
regexes = [
  '''^Mod\+Shift\+F12$''',
]

[[allowlists]]
description = "the word key or token in a name (a keybinding, storage key or key id), not a secret"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^apps/debrief/app/src/app/palette/palette-recent\.ts$''']
regexes = [
  '''^debrief\.palette\.recent\.v1$''',
]

[[allowlists]]
description = "the fixed RFC 6455 sample Sec-WebSocket-Key in a fake handshake, not a secret"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^apps/debrief/crates/chromium-driver/src/fake\.rs$''']
regexes = [
  '''^dGhlIHNhbXBsZSBub25jZQ==$''',
]

[[allowlists]]
description = "an invented value in a redaction test: the code under test must hide it"
condition = "AND"
targetRules = ["jwt"]
paths = ['''^apps/debrief/crates/debrief-ai/src/web/privacy\.rs$''']
regexes = [
  '''^eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.abcdefghijk$''',
]

[[allowlists]]
description = "an invented value in a redaction test: the code under test must hide it"
condition = "AND"
targetRules = ["stripe-access-token"]
paths = ['''^apps/debrief/crates/debrief-ai/src/web/privacy\.rs$''']
regexes = [
  '''^sk_live_abcdef1234567890abcdef$''',
]

[[allowlists]]
description = "an invented value in a redaction test: the code under test must hide it"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^apps/debrief/crates/debrief-collect/tests/it/plan_redact\.rs$''']
regexes = [
  '''^sk-1234567890abcd$''',
  '''^ABCDEFGH12345$''',
]

[[allowlists]]
description = "an invented value in a redaction test: the code under test must hide it"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^apps/debrief/crates/debrief-core/src/redact/tests\.rs$''']
regexes = [
