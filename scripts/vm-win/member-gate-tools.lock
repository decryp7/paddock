# The programs the Windows member gate copies into the test VM each run (scripts/member-gate-windows.sh). The VM is Arm: these are the
# aarch64-pc-windows-msvc builds. cargo-nextest is the release of the pin in tools/paddock-dev/src/ci_host/host_tools.rs (a test
# there holds the version equal); the SHA-256 was taken from the GitHub release download on 2026-11-16 (it publishes no checksum
# file for this archive, so the first trust is TLS to GitHub). The Rust toolchain follows rust-toolchain.toml and is checked against
# the .sha256 that static.rust-lang.org publishes next to the archive; the Build Tools installer is in the VM image (vm-win.sh
# toolchain-setup), not here.
nextest_version=0.9.149
nextest_url=https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.149/cargo-nextest-0.9.149-aarch64-pc-windows-msvc.zip
nextest_sha256=4f323e5cc36ffba08b871081aa124267566465c5146b7e471859be1f97dc5869
rust_dist=https://static.rust-lang.org/dist
rust_host=aarch64-pc-windows-msvc
rust_components="rustc cargo rust-std-aarch64-pc-windows-msvc rustfmt-preview clippy-preview"
